version: 2.1

############################################################################

references:
   checkout_job_steps: &checkout_job_steps
      steps:
         - checkout:
             method: full
         - run:
            name: Checking out dependencies.
            command: |
               git clone -b develop --single-branch https://github.com/Zimbra/zm-pkg-tool.git ~/zm-pkg-tool
               git clone -b publish-nexus-jar-poc --single-branch https://github.com/Zimbra/zm-zcs.git ~/zm-zcs
               git clone -b master --single-branch https://github.com/Zimbra/zimbra-package-stub.git ~/zimbra-package-stub
               echo "BUILD_NO=$CIRCLE_BUILD_NUM" > config.build
               mkdir -p ~/.zcs-deps
         - persist_to_workspace:
            root: ..
            paths:
               - zm-pkg-tool
               - zm-zcs
               - zimbra-package-stub
               - zm-mailbox
               - .zcs-deps

   build_job_steps: &build_job_steps
      steps:
         - attach_workspace:
            at: ..
         - run:
            name: Creating build
            command: |
              mkdir -p /home/build/.ivy2/cache
              sudo apt-get update; sudo apt-get install ant-contrib -y
              cd ../zm-mailbox/
              JAVA_HOME=/usr/lib/jvm/java-8-openjdk-amd64 && export JAVA_HOME && ant -Dzimbra.buildinfo.version=10.0.0_GA_1001 clean publish-local-all                     
         - persist_to_workspace:
            root: ..
            paths:
               - .ivy2
               - .zcs-deps

   publish_job_steps: &publish_job_steps
      steps:
         - attach_workspace:
            at: ..
         - run:
            name: Publish to Nexus
            command: |
              sudo apt-get update; sudo apt-get install ant-contrib -y
              cd ../zm-mailbox
              ant publish-remote-all

############################################################################

jobs:
   checkout:
      working_directory: ~/zm-mailbox
      shell: /bin/bash -eo pipefail
      docker:
      - image: $DOCKER_REGISTRY/zm-base-os:devcore-ubuntu-18.04
        auth:
          username: $DOCKER_USER
          password: $DOCKER_PASS
      resource_class: small
      <<: *checkout_job_steps

   build:
      working_directory: ~/zm-mailbox
      shell: /bin/bash -eo pipefail
      docker:
      - image: $DOCKER_REGISTRY/zm-base-os:devcore-ubuntu-22.04
        auth:
          username: $DOCKER_USER
          password: $DOCKER_PASS
      resource_class: medium
      <<: *build_job_steps

   publish:
      working_directory: ~/zm-mailbox
      shell: /bin/bash -eo pipefail
      circleci_ip_ranges: true
      docker:
      - image: $DOCKER_REGISTRY/zm-base-os:devcore-ubuntu-22.04
        auth:
          username: $DOCKER_USER
          password: $DOCKER_PASS
      resource_class: small
      <<: *publish_job_steps

############################################################################

workflows:
   version: 2
   main:
      jobs:
         - checkout:
            context:
               - docker-dev-registry
         - build:
            context:
               - docker-dev-registry
            requires:
               - checkout
         - publish_hold:
            type: approval
            requires:
               - build
         - publish:
            context:
               - docker-dev-registry
               - nexus-artifactory
            requires:
               - publish_hold
            filters:
               branches:
                 only:
                   - publish-nexus-jar-poc
