version: 2.1

############################################################################

references:
   default_environment_settings: &default_environment_settings
      docker:
        - image: $DOCKER_REGISTRY/zm-base-os:devcore-ubuntu-22.04
          auth:
            username: $DOCKER_USER
            password: $DOCKER_PASS
      environment:
        - ANT_OPTS: -Dzimbra.buildinfo.version=${BUILD_RELEASE_NO}${CIRCLE_BUILD_NUM}
        - BUILD: "/home/build"
      working_directory: /home/build/zm-mailbox
   default_attach_workspace: &default_attach_workspace
         attach_workspace:
            at: /home/build
   filter_branches: &filter_branches
     filters:
       branches:
         only:
           - develop
           - ZCS-18921-poc
   validate_ant_parameter: &validate_ant_parameter
      run:
        name: Validate release version prefix
        command: |
          RELEASE_PREFIX="${BUILD_RELEASE_NO}"
          [ -n "$RELEASE_PREFIX" ] || (echo "BUILD_RELEASE_NO is required (example: 10.1.0_GA_)" && exit 1)
          echo "$RELEASE_PREFIX" | grep -Eq '^[0-9]+\.[0-9]+\.[0-9]+' || (echo "Release prefix must start with semantic version (example: 10.1.0_GA_)" && exit 1)
          echo "Using release prefix: $RELEASE_PREFIX"
############################################################################

jobs:
  build:
    <<: *default_environment_settings
    steps:
      - checkout
      - *validate_ant_parameter
      - run:
          name: Install ant-contrib
          command: sudo apt-get update; sudo apt-get install ant-contrib && mkdir -p ~/.ivy2/cache
      - run:
          name: Clone zm-timezones
          command: |
            cd "$BUILD"
            git clone https://github.com/Zimbra/zm-timezones.git -b develop --single-branch || exit 1
      - run:
          name: Running ant compile in native directory
          command: JAVA_HOME=/usr/lib/jvm/java-8-openjdk-amd64 PATH=/usr/lib/jvm/java-8-openjdk-amd64/bin:$PATH ant clean compile publish-local
          working_directory: native
      - run:
          name: Running ant compile in common directory
          command: JAVA_HOME=/usr/lib/jvm/java-8-openjdk-amd64 PATH=/usr/lib/jvm/java-8-openjdk-amd64/bin:$PATH ant clean compile publish-local
          working_directory: common
      - run:
          name: Running ant compile in soap directory
          command: JAVA_HOME=/usr/lib/jvm/java-8-openjdk-amd64 PATH=/usr/lib/jvm/java-8-openjdk-amd64/bin:$PATH ant clean compile publish-local
          working_directory: soap
      - run:
          name: Running ant compile in client directory
          command: JAVA_HOME=/usr/lib/jvm/java-8-openjdk-amd64 PATH=/usr/lib/jvm/java-8-openjdk-amd64/bin:$PATH ant clean compile publish-local
          working_directory: client
      - run:
          name: Running ant compile in store directory
          command: JAVA_HOME=/usr/lib/jvm/java-8-openjdk-amd64 PATH=/usr/lib/jvm/java-8-openjdk-amd64/bin:$PATH ant clean compile publish-local
          working_directory: store
      - run:
          name: Compile validation completed
          command: echo "Compile stage completed for develop branch."
      - persist_to_workspace:
          root: /home/build/
          paths:
            - zm-timezones
            - zm-mailbox
            - .ssh
            - .zcs-deps
  package_build:
    <<: *default_environment_settings
    steps:
      - *default_attach_workspace
      - *validate_ant_parameter
      - run:
          name: Prepare ant-contrib jar for root build.xml
          command: |
            sudo apt-get update; sudo apt-get install ant-contrib rpm dpkg-dev fakeroot lsb-release debhelper build-essential -y
            mkdir -p ~/.ivy2/cache
            mkdir -p ~/.zcs-deps
            if [ -f /usr/share/java/ant-contrib.jar ]; then
              cp -f /usr/share/java/ant-contrib.jar ~/.zcs-deps/ant-contrib-1.0b1.jar
            elif [ -f /usr/share/ant/lib/ant-contrib.jar ]; then
              cp -f /usr/share/ant/lib/ant-contrib.jar ~/.zcs-deps/ant-contrib-1.0b1.jar
            else
              echo "ant-contrib.jar not found on runner" && exit 1
            fi
            if [ ! -f /etc/lsb-release ] && [ -f /etc/os-release ]; then
              . /etc/os-release
              REL="${VERSION_ID%%.*}"
              echo "DISTRIB_RELEASE=${REL}" | sudo tee /etc/lsb-release >/dev/null
            fi
      - run:
          name: Validate package tooling
          command: |
            for b in perl rpmbuild rpm dpkg-deb fakeroot tar gzip; do
              command -v "$b" >/dev/null 2>&1 || (echo "Missing required binary: $b" && exit 1)
            done
      - run:
          name: Build mailbox OS packages
          command: |
            cd /home/build
            if [ ! -d "zm-pkg-tool" ]; then
              git clone -b develop --single-branch https://github.com/Zimbra/zm-pkg-tool.git
            fi
            [ -x /home/build/zm-pkg-tool/pkg-build.pl ] || chmod +x /home/build/zm-pkg-tool/pkg-build.pl
            cd /home/build/zm-mailbox
            JAVA_HOME=/usr/lib/jvm/java-8-openjdk-amd64 PATH=/usr/lib/jvm/java-8-openjdk-amd64/bin:$PATH ant pkg
      - persist_to_workspace:
          root: /home/build/
          paths:
            - zm-mailbox
            - zm-pkg-tool
            - .zcs-deps
  publish_jars:
    <<: *default_environment_settings
    circleci_ip_ranges: true
    steps:
      - *default_attach_workspace
      - *validate_ant_parameter
      - run:
          name: Prepare ant-contrib jar for root build.xml
          command: |
            sudo apt-get update; sudo apt-get install ant-contrib -y
            mkdir -p ~/.ivy2/cache
            mkdir -p ~/.zcs-deps
            if [ -f /usr/share/java/ant-contrib.jar ]; then
              cp -f /usr/share/java/ant-contrib.jar ~/.zcs-deps/ant-contrib-1.0b1.jar
            elif [ -f /usr/share/ant/lib/ant-contrib.jar ]; then
              cp -f /usr/share/ant/lib/ant-contrib.jar ~/.zcs-deps/ant-contrib-1.0b1.jar
            else
              echo "ant-contrib.jar not found on runner" && exit 1
            fi
      - run:
          name: Validate Nexus env variables
          command: |
            [ -n "$NEXUS_BASE_URL" ] || (echo "NEXUS_BASE_URL is required" && exit 1)
            [ -n "$NEXUS_USER" ] || (echo "NEXUS_USER is required" && exit 1)
            [ -n "$NEXUS_PASSWORD" ] || (echo "NEXUS_PASSWORD is required" && exit 1)
      - run:
          name: Publish built jars to Nexus
          command: |
            cd /home/build
            if [ ! -d "zm-zcs" ]; then
              git clone -b develop --single-branch https://github.com/Zimbra/zm-zcs.git
            fi
            if [ ! -d "zm-taglib" ]; then
              git clone -b develop --single-branch https://github.com/Zimbra/zm-taglib.git
            fi
            cd /home/build/zm-taglib
            JAVA_HOME=/usr/lib/jvm/java-8-openjdk-amd64
            export JAVA_HOME
            export PATH="$JAVA_HOME/bin:$PATH"
            ant -Dzimbra.buildinfo.version=${BUILD_RELEASE_NO}${CIRCLE_BUILD_NUM} clean publish-local
            TAGLIB_PUB="$(find "$HOME/.zcs-deps/zimbra/zm-taglib" -maxdepth 1 -type f -name '*.jar' ! -name 'zm-taglib-latest.integration.jar' ! -name 'zm-taglib-local.jar' -printf '%T@\t%p\n' 2>/dev/null | sort -t "$(printf '\t')" -k1,1rn | head -1 | cut -f2-)"
            if [ -z "$TAGLIB_PUB" ] || [ ! -f "$TAGLIB_PUB" ]; then
              TAGLIB_PUB="$(find build -maxdepth 1 -type f -name '*.jar' -printf '%T@\t%p\n' 2>/dev/null | sort -t "$(printf '\t')" -k1,1rn | head -1 | cut -f2-)"
            fi
            if [ -n "$TAGLIB_PUB" ] && [ -f "$TAGLIB_PUB" ]; then
              mkdir -p "$HOME/.zcs-deps/zimbra/zm-taglib"
              cp -f "$TAGLIB_PUB" "$HOME/.zcs-deps/zimbra/zm-taglib/zm-taglib-latest.integration.jar"
              cp -f "$TAGLIB_PUB" "$HOME/.zcs-deps/zimbra/zm-taglib/zm-taglib-local.jar"
              echo "Aliased taglib jar: $TAGLIB_PUB"
            else
              echo "ERROR: could not locate any zm-taglib jar after publish-local"
              ls -la "$HOME/.zcs-deps/zimbra/zm-taglib" 2>/dev/null || true
              ls -la build 2>/dev/null || true
              exit 1
            fi
            cd /home/build/zm-mailbox
            JAVA_HOME=/usr/lib/jvm/java-8-openjdk-amd64
            export JAVA_HOME
            export PATH="$JAVA_HOME/bin:$PATH"
            ant -Dzimbra.buildinfo.version=${BUILD_RELEASE_NO}${CIRCLE_BUILD_NUM} clean publish-local-all
            for MODULE in zm-native zm-common zm-soap zm-client zm-store; do
              PUB_DIR="$HOME/.zcs-deps/zimbra/$MODULE"
              PUB_JAR="$(find "$PUB_DIR" -maxdepth 1 -type f -name '*.jar' ! -name "${MODULE}-latest.integration.jar" ! -name "${MODULE}-local.jar" -printf '%T@\t%p\n' 2>/dev/null | sort -t "$(printf '\t')" -k1,1rn | head -1 | cut -f2-)"
              if [ -n "$PUB_JAR" ] && [ -f "$PUB_JAR" ]; then
                cp -f "$PUB_JAR" "$PUB_DIR/${MODULE}-latest.integration.jar"
                cp -f "$PUB_JAR" "$PUB_DIR/${MODULE}-local.jar"
                echo "Aliased mailbox module $MODULE => $PUB_JAR"
              else
                echo "ERROR: could not locate published jar for $MODULE in $PUB_DIR"
                ls -la "$PUB_DIR" 2>/dev/null || true
                exit 1
              fi
            done
            JAR_REPO="develop-snapshot"
            VERSION="${BUILD_RELEASE_NO}${CIRCLE_BUILD_NUM}"
            RAW_BASE="$(printf '%s' "$NEXUS_BASE_URL" | sed 's/#.*$//' | sed 's:/*$::')"
            jar_list_file="$(mktemp)"
            for MODULE in zm-native zm-common zm-soap zm-client zm-store zm-taglib; do
              PUB_DIR="$HOME/.zcs-deps/zimbra/$MODULE"
              [ -d "$PUB_DIR" ] || continue
              JAR_PATH="$(find "$PUB_DIR" -maxdepth 1 -type f -name "${MODULE}-*.jar" ! -name "${MODULE}-latest.integration.jar" ! -name "${MODULE}-local.jar" -printf '%T@\t%p\n' 2>/dev/null | sort -t "$(printf '\t')" -k1,1rn | head -1 | cut -f2-)"
              [ -n "$JAR_PATH" ] && [ -f "$JAR_PATH" ] && printf '%s\n' "$JAR_PATH" >> "$jar_list_file"
            done
            if [ ! -s "$jar_list_file" ]; then
              echo "No jars found for Nexus upload under ~/.zcs-deps/zimbra"
              exit 1
            fi
            while IFS= read -r jar_path; do
              [ -n "$jar_path" ] || continue
              jar_name="$(basename "$jar_path")"
              module_name="$(echo "$jar_name" | sed -E 's/-[0-9].*\.jar$//')"
              target_url="$RAW_BASE/repository/$JAR_REPO/zimbra/$module_name/$VERSION/$jar_name"
              body_file="$(mktemp)"
              header_file="$(mktemp)"
              echo "Uploading $jar_name -> $target_url"
              http_code="$(curl --silent --show-error --user "$NEXUS_USER:$NEXUS_PASSWORD" --header 'Expect:' --upload-file "$jar_path" --dump-header "$header_file" --output "$body_file" --write-out '%{http_code}' "$target_url" || true)"
              case "$http_code" in
                2??)
                  echo "Upload successful: $jar_name (HTTP $http_code)"
                  ;;
                400|409)
                  response_lc="$(tr '[:upper:]' '[:lower:]' < "$body_file" 2>/dev/null || true)"
                  case "$response_lc" in
                    *already*exist*|*cannot*be*updated*|*conflict*|*duplicate*)
                      echo "Upload skipped (already exists): $jar_name (HTTP $http_code)"
                      ;;
                    *)
                      echo "Upload failed for $jar_name (HTTP $http_code)"
                      [ -s "$header_file" ] && sed -n '1,120p' "$header_file"
                      [ -s "$body_file" ] && sed -n '1,200p' "$body_file"
                      rm -f "$body_file" "$header_file" "$jar_list_file"
                      exit 1
                      ;;
                  esac
                  ;;
                *)
                  echo "Upload failed for $jar_name (HTTP $http_code)"
                  [ -s "$header_file" ] && sed -n '1,120p' "$header_file"
                  [ -s "$body_file" ] && sed -n '1,200p' "$body_file"
                  rm -f "$body_file" "$header_file" "$jar_list_file"
                  exit 1
                  ;;
              esac
              rm -f "$body_file" "$header_file"
            done < "$jar_list_file"
            rm -f "$jar_list_file"
  publish_packages:
    <<: *default_environment_settings
    circleci_ip_ranges: true
    steps:
      - *default_attach_workspace
      - *validate_ant_parameter
      - run:
          name: Prepare ant-contrib jar for root build.xml
          command: |
            sudo apt-get update; sudo apt-get install ant-contrib -y
            mkdir -p ~/.ivy2/cache
            mkdir -p ~/.zcs-deps
            if [ -f /usr/share/java/ant-contrib.jar ]; then
              cp -f /usr/share/java/ant-contrib.jar ~/.zcs-deps/ant-contrib-1.0b1.jar
            elif [ -f /usr/share/ant/lib/ant-contrib.jar ]; then
              cp -f /usr/share/ant/lib/ant-contrib.jar ~/.zcs-deps/ant-contrib-1.0b1.jar
            else
              echo "ant-contrib.jar not found on runner" && exit 1
            fi
      - run:
          name: Validate Nexus env variables
          command: |
            [ -n "$NEXUS_BASE_URL" ] || (echo "NEXUS_BASE_URL is required" && exit 1)
            [ -n "$NEXUS_USER" ] || (echo "NEXUS_USER is required" && exit 1)
            [ -n "$NEXUS_PASSWORD" ] || (echo "NEXUS_PASSWORD is required" && exit 1)
      - run:
          name: Publish built packages to Nexus APT/Yum
          command: |
            : "${NEXUS_BASE_URL:?NEXUS_BASE_URL is required}"
            : "${NEXUS_USER:?NEXUS_USER is required}"
            : "${NEXUS_PASSWORD:?NEXUS_PASSWORD is required}"
            ROOT="build/dist"
            APT_REPO="package-repo-apt"
            YUM_REPO="package-repo-yum"
            MODULE_PATH="zimbra/zm-mailbox/${CIRCLE_SHA1:-develop}"
            RAW_BASE="$(printf '%s' "$NEXUS_BASE_URL" | sed 's/#.*$//' | sed 's:/*$::')"
            API_BASE="$RAW_BASE/service/rest/v1/components"
            PACKAGE_FILES="$(find "$ROOT" -type f \( -name '*.deb' -o -name '*.rpm' \))"
            if [ -z "$PACKAGE_FILES" ]; then
              echo "No package artifacts found in $ROOT"
              exit 1
            fi
            package_list_file="$(mktemp)"
            printf '%s\n' "$PACKAGE_FILES" > "$package_list_file"
            while IFS= read -r f; do
              [ -n "$f" ] || continue
              rel="$(echo "$f" | sed "s|^$ROOT/||")"
              dir="$(dirname "$rel")"
              file_name="$(basename "$f")"
              body_file="$(mktemp)"
              header_file="$(mktemp)"
              case "$f" in
                *.deb)
                  repo="$APT_REPO"
                  url="$API_BASE?repository=$repo"
                  echo "Uploading $f -> $repo via Components API"
                  http_code="$(curl --silent --show-error --user "$NEXUS_USER:$NEXUS_PASSWORD" --request POST "$url" -F "apt.asset=@$f" --dump-header "$header_file" --output "$body_file" --write-out '%{http_code}' || true)"
                  ;;
                *.rpm)
                  repo="$YUM_REPO"
                  yum_dir="$MODULE_PATH/$dir"
                  url="$API_BASE?repository=$repo"
                  echo "Uploading $f -> $repo via Components API (yum.directory=$yum_dir)"
                  http_code="$(curl --silent --show-error --user "$NEXUS_USER:$NEXUS_PASSWORD" --request POST "$url" -F "yum.directory=$yum_dir" -F "yum.asset=@$f" -F "yum.asset.filename=$file_name" --dump-header "$header_file" --output "$body_file" --write-out '%{http_code}' || true)"
                  ;;
                *)
                  rm -f "$body_file" "$header_file"
                  continue
                  ;;
              esac
              case "$http_code" in
                2??)
                  echo "Upload successful: $file_name (HTTP $http_code)"
                  ;;
                400)
                  response_lc="$(tr '[:upper:]' '[:lower:]' < "$body_file" 2>/dev/null || true)"
                  case "$response_lc" in
                    *already*exist*|*cannot*be*updated*|*duplicate*)
                      echo "Upload skipped (already exists): $file_name (HTTP 400)"
                      ;;
                    *)
                      echo "Upload failed for $f (HTTP $http_code)"
                      [ -s "$header_file" ] && sed -n '1,120p' "$header_file"
                      [ -s "$body_file" ] && sed -n '1,200p' "$body_file"
                      rm -f "$body_file" "$header_file" "$package_list_file"
                      exit 1
                      ;;
                  esac
                  ;;
                *)
                  echo "Upload failed for $f (HTTP $http_code)"
                  [ -s "$header_file" ] && sed -n '1,120p' "$header_file"
                  [ -s "$body_file" ] && sed -n '1,200p' "$body_file"
                  rm -f "$body_file" "$header_file" "$package_list_file"
                  exit 1
                  ;;
              esac
              rm -f "$body_file" "$header_file"
            done < "$package_list_file"
            rm -f "$package_list_file"
  test:
    <<: *default_environment_settings
    steps:
      - *default_attach_workspace
      - *validate_ant_parameter
      - run:
          name: Ensure xml tooling for junit merge
          command: sudo apt-get update && sudo apt-get install -y xmlstarlet
      - run:
          name: Create test report directory to hold junit tests
          command: mkdir -p /tmp/junit/
      - run:
          name: Running ant test native
          command: JAVA_HOME=/usr/lib/jvm/java-8-openjdk-amd64 PATH=/usr/lib/jvm/java-8-openjdk-amd64/bin:$PATH ant test
          working_directory: native
      - run:
          name: Running ant test common
          command: JAVA_HOME=/usr/lib/jvm/java-8-openjdk-amd64 PATH=/usr/lib/jvm/java-8-openjdk-amd64/bin:$PATH ant test
          working_directory: common
      - run:
          name: Running ant test soap
          command: JAVA_HOME=/usr/lib/jvm/java-8-openjdk-amd64 PATH=/usr/lib/jvm/java-8-openjdk-amd64/bin:$PATH ant test
          working_directory: soap
      - run:
          name: Running ant test client
          command: JAVA_HOME=/usr/lib/jvm/java-8-openjdk-amd64 PATH=/usr/lib/jvm/java-8-openjdk-amd64/bin:$PATH ant test
          working_directory: client
      - run:
          name: Running ant test store
          command: JAVA_HOME=/usr/lib/jvm/java-8-openjdk-amd64 PATH=/usr/lib/jvm/java-8-openjdk-amd64/bin:$PATH ant test
          no_output_timeout: 1200s
          working_directory: store
      - run:
          name: Finding test results
          command: |
            TEST_XMLS="$(find . -type f -regex '.*/build/test/report/.*xml')"
            [ -n "$TEST_XMLS" ] || (echo "No junit xml files found" && exit 1)
            python3 - \<<'PY'
            import glob
            import xml.etree.ElementTree as ET

            files = glob.glob("**/build/test/report/*.xml", recursive=True)
            if not files:
                raise SystemExit("No junit xml files found")

            root = ET.Element("testsuites")
            for f in files:
                try:
                    doc = ET.parse(f).getroot()
                except Exception:
                    continue
                if doc.tag == "testsuite":
                    root.append(doc)
                elif doc.tag == "testsuites":
                    for ts in list(doc):
                        if ts.tag == "testsuite":
                            root.append(ts)

            ET.ElementTree(root).write("merged-test-results.xml", encoding="utf-8", xml_declaration=True)
            PY
      - run:
          name: Copy test results to proper directory
          command: cp merged-test-results.xml /tmp/junit/
      - store_test_results:
          path: /tmp/junit/
############################################################################

workflows:
  version: 2
  build_deploy:
    jobs:
      - build:
          <<: *filter_branches
          context:
            - docker-dev-registry
            - build-number
      - package_build:
          requires:
            - build
          <<: *filter_branches
          context:
            - docker-dev-registry
            - build-number
      - test:
          requires:
            - package_build
          <<: *filter_branches
          context:
            - docker-dev-registry
            - build-number
      - publish_jars:
          requires:
            - test
          <<: *filter_branches
          context:
            - docker-dev-registry
            - build-number
            - nexus-artifactory
      - publish_packages:
          requires:
            - test
          <<: *filter_branches
          context:
            - docker-dev-registry
            - build-number
            - nexus-artifactory
############################################################################
