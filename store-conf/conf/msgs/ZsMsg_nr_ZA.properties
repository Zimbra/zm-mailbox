# local config settings

zimbra_home = Umsuka wokufakwa kwe-Zimbra nedayirekhtori yasekhaya yomsebenzisi we-UNIX \u2018zimbra\u2019. Awukwazi ukuthutha umsuka wokufaka - ungatjhugululi isethingi le.
zimbra_java_home = Indlela eya ku-JDK/J2SDK.
zimbra_log_directory = Idayirekhtori lapho amafayili welogi atlolwa khona.
zimbra_index_directory = Idayirekhtori yamafayili we-index yebhokisi leposo.
zimbra_store_directory = Idayirekhtori yemilayezo yebhokisi leposo.
zimbra_db_directory = Idayirekhtori yamafayili wedathabhesi.
zimbra_tmp_directory = Idayirekhtori yamafayili wesikhatjhana.
zimbra_hybrid_blob_mover_enabled = Ibeka bona isici se-Hybrid Blob Mover sivuliwe na. Okuzenzakalelako: false
zimbra_extensions_directory = Idayirekhtori enama-subdirectory aqukethe ama-extension.
zimbra_extensions_common_directory = Idayirekhtori enamafayili we-jar ajayelekileko kiwo woke ama-extension.
zimbra_mysql_shutdown_timeout = Isikhathi sokulinda bona iprosesi ye-MySQL/MariaDB yebhokisi leposo iphele. Yandisa isikhathi nange i-mysql.server ithatha isikhathi eside khulu ukuvala iprosesi.
zimbra_mysql_user = Ibizo lomsebenzisi le-MySQL elisetjenziswa ukudala nokufikelela amadatabhesi namathebula we-Zimbra. Le yivalu obungayinikeza kukhetho lwe-\u2018-u\u2019 lwehlelo lomugca womyalo lwe-\u2018mysql\u2019.
zimbra_mysql_password = Iphasiwedi ye-zimbra_mysql_user. Igcinwa kukhonfigi yendawo ukuze isetjenziswe yindlela yesitoreji ekuqinisekiseni ubuwena. Nawufuna ukutjhugulula le phasiwedi, sibawa usebenzise ihlelo le-zmmypasswd elizokutjhugulula iphasiwedi kokubili ku-MySQL nakukonfigi yendawo.
zimbra_ldap_userdn = I-LDAP dn esetjenziswa ekuqinisekiseni indlela yesitoreji nge-LDAP.
zimbra_ldap_user = Ibizo lomsebenzisi le-Zimbra elisetjenziswa ekuqinisekiseni nge-admin AuthRequest.
zimbra_ldap_password = Iphasiwedi ye-zimbra_ldap_userdn. Igcinwa kukhonfigi yendawo ukuze isetjenziswe yindlela yesitoreji ekuqinisekiseni ubuwena. Nawufuna ukutjhugulula le phasiwedi, sibawa usebenzise ihlelo le-zmldappasswd elizokutjhugulula iphasiwedi kokubili ku-LDAP nakukonfigi yendawo.
zimbra_server_hostname = Ibizo elihleliweko lale seva. Kufanele kube nokufakwa okuhambelanako kwe-\u2018server\u2019 ku-LDAP - qala amadokhumenti womlayo we-CreateServer wehlelo le-zmprov.
zimbra_user = Umsebenzisi we-unix we-Zimbra ekufanele iprosesi yeseva ye-Zimbra itjhintshele kuye amalungelo, ngemva kokubophela ama-port anelungelo.
zimbra_uid = I-unix uid ye-Zimbra ekufanele iprosesi yeseva ye-Zimbra itjhintshele kuyo amalungelo, ngemva kokubophela ama-port anelungelo.
zimbra_gid = I-unix gid ye-Zimbra ekufanele iprosesi yeseva ye-Zimbra itjhintshele kuyo amalungelo, ngemva kokubophela ama-port anelungelo.
zimbra_log4j_properties = Indlela eya kufayili yeempahla zokuhlela i-log4j.
zimbra_log4j_properties_watch = Isikhathi sokugada sefayili yeempahla zokuhlela i-log4j ngo-msec.
zimbra_attrs_directory = Idayirekhtori equkethe amafayili we-*.xml atjho i-syntax yama-attribute we-LDAP asetjenziswa yindlela.
localized_msgs_directory = Idayirekhtori yamafayili wemilayezo ahunyutjhiweko ngokwendawo.
localized_client_msgs_directory = Idayirekhtori yamafayili wemilayezo yeklayenti ahunyutjhiweko ngokwendawo.
skins_directory = Idayirekhtori yama-skin.
zimbra_store_sweeper_max_age = Amafayili amadala ngaphezu kweminithi eminingi kangaka asulwa ngokuzenzakalela edayirekhtorini yokungena yesitoreji.
zimbra_store_copy_buffer_size_kb = Imisebenzi yokukopa amafayili isebenzisa ama-buffer anobukhulu obungaka.
zimbra_mailbox_galsync_cache = Isetha ikheshi elikhulu khulu lezinto zoxhumana nabo ku-mailbox ye-galsync. Setha inani libe okungenani linani lezinto zoxhumana nabo ku-mailbox ye-galsync.
zimbra_mailbox_manager_hardref_cache = Inani elikhulu khulu lama-mailbox azobanjwa ememorini ngaphambi kobana umphathi we-mailbox athome ukuwavumela ukuthi asuswe nge-SoftReference garbage collection.
zimbra_mailbox_active_cache = Ubukhulu obukhulu bekheshi langaphakathi le-LRU le-mailbox nakunamaseshini asebenzako.
zimbra_mailbox_inactive_cache = Ubukhulu obukhulu bekheshi langaphakathi le-LRU le-mailbox nayinganamaseshini asebenzako.
zimbra_mailbox_change_checkpoint_frequency = Imvamisa (ngenani leentjhuguluko) lapho inani letjhuguluko eliphezulu le-ZIMBRA.MAILBOX.CHANGE_CHECKPOINT le-mailbox litlolwa khona.
zimbra_index_elasticsearch_url_base = I-URL eyisisekelo ye-ElasticSearch REST API.
zimbra_index_threads = Ubukhulu be-thread pool yokwenza i-batch index.
zimbra_reindex_threads = Inani elikhulu khulu lama-thread we-re-index. Ama-thread we-re-index awasebenzisi iphuli.
zimbra_index_disable_perf_counters = Nangabe false, i-Lucene IO yokufunda nokutlola iyalandelelwa kukuhlolwa kokusebenza kwe-Zimbra. Inani elithi true likhubaza ukuhlolwa kwe-Lucene IO.
zimbra_index_max_readers = Inani elikhulu khulu lama-IndexReader asebenza ngesikhathi sinye.
zimbra_index_max_writers = Inani elikhulu khulu lama-IndexWriter asebenza ngesikhathi sinye.
zimbra_index_reader_cache_size = Inani elikhulu khulu lama-IndexReader ekheshini ye-search index.
zimbra_index_reader_cache_ttl = Nangabe ingasebenzi isikhathi eside kuneli nani (imizuzwana), susa i-IndexReader ekheshini.
zimbra_index_deferred_items_failure_delay = Ngemva kokwehluleka, ukubambezeleka okuncani (imizuzwana) hlangana nemizamo yokukhupha umtlala wezinto ezingakafakwa ku-index (ezibambezelekileko).
zimbra_index_lucene_max_terms_per_query = Setha inani elikhulu khulu lamathemu avunyelweko ngesibuzo ngasinye.
zimbra_index_max_transaction_bytes = Nakuhlanganiswa imisebenzi ye-index ibe yi-transaction ye-Mailbox, ubukhulu obukhulu obuhlanganisiwe bezinto esizobuvumela ku-transaction eyodwa.
zimbra_index_max_transaction_items = Nakuhlanganiswa imisebenzi ye-index, inani elikhulu khulu lama-mail_items esiwavumela ku-transaction eyodwa.
zimbra_index_max_pending_deletes = Inani elikhulu khulu lokusula ku-index okulindileko ngaphambi kokubuyiswa kwesikhala sediski.
zimbra_index_lucene_merge_policy = true ukusebenzisa i-LogDocMergePolicy, false ukusebenzisa i-LogByteSizeMergePolicy. I-LogDocMergePolicy ikhetha izingaba okufanele zihlanganiswe ngokusekelwe enanini lemibhalo. I-LogByteSizeMergePolicy ikhetha izingaba okufanele zihlanganiswe ngokusekelwe ebukhulu bazo.
zimbra_index_lucene_min_merge = Isetha ubukhulu obuncani bokuhlanganisa be-Lucene kumibhalo namkha ku-KB ngokuya nge-merge policy ecaciswe ku-zimbra_index_lucene_merge_policy.
zimbra_index_lucene_max_merge = Isetha ubukhulu obukhulu bokuhlanganisa be-Lucene kumibhalo namkha ku-KB ngokuya nge-merge policy ecaciswe ku-zimbra_index_lucene_merge_policy. Leli nani linquma isigaba esikhulu khulu esingahlanganiswa nezinye izingaba.
zimbra_index_lucene_merge_factor = Ukuthi ama-segment index ahlanganiswa kangaki yi-addDocument(). Ngezinani ezincani, kusetjenziswa i-RAM encani ngesikhathi sokufaka ku-index, begodu ukufuna kuyashesha, kodwana ijubane lokufaka ku-index liyancipha. Ngezinani ezikhulu, kusetjenziswa i-RAM enengi ngesikhathi sokufaka ku-index, begodu nanyana ukufuna kucotha, ukufaka ku-index kuyashesha. Iinani ezikhulu (>10) zihle ekudalweni kwe-batch index, kanti ezincani (<10) zisebenzela ama-index agcinwa ngokusebenzisana.
zimbra_index_lucene_term_index_divisor = Ithatha amasampula wamathemu afakwe ku-index alayishwa ku-RAM. Ngokuyisetha enanini > 1 unganciphisa ukusetjenziswa kwememori kodwana kube nokulibala okuphezulu nakulayishwa ilwazi lerekhodi eligcinelwe ithemu.
zimbra_index_lucene_use_compound_file = true nangabe isigaba esitjha se-Lucene kufanele sisebenzise ifomethi yefayela elihlanganisiweko. http://wiki.apache.org/lucene-java/ImproveIndexingSpeed ithi ucime ifomethi yefayela elihlanganisiweko ukuze kusebenze ngcono, kodwana lokho kuzokwandisa khulu inani lezichazi zamafayela. Izichazi zamafayela zingaphela nangabe zimbra_index_lucene_merge_factor likhulu.
zimbra_index_lucene_max_buffered_docs = Inani elincani lemibhalo elifunekako ngaphambi kobana imibhalo ekheshiwe ememorini ikhishwe njengegaba elitjha. Iinani ezikhulu ngokuvamile zinikela ukufaka ku-index okutsheshako.
zimbra_index_lucene_ram_buffer_size_kb = I-RAM enkulu khulu ekheshiwe yi-Lucene ku-KB.
zimbra_index_lucene_io_impl = Ukuqalisa kwe-Lucene FSDirectory okusetjenziselwa i-indexing IO. Amanani angaba khona nio - Sebenzisa i-NIOFSDirectory. Kusebenzisa i-positional io ye-FileChannel ye-java.nio nakufundwa ukuze kugwenywe ukuvumelanisa nakufundwa efayeleni elifanako. mmap - Sebenziswa i-MMapDirectory. Kusebenzisa i-memory-mapped IO nakufundwa. Kukhetha kuhle nangabe kune-memory ephesheya enengi uma kuqhathaniswa nobukhulu be-index. simple - Sebenziswa i-SimpleFSDirectory. Kusebenzisa i-java.io.RandomAccessFile. Inokusebenza okumbi ngesikhathi esifanako ngombana iyavumelanisa lokha ama-thread amanengi afunda ifayela elifanako. Nangabe akunikelwanga nani, i-FSDirectory izokhetha ukuqaliswa okuhle khulu kwendawo.
zimbra_index_rfc822address_max_token_count = Inani elikhulu khulu lama-token wamakheli ku-RFC822 address token stream. Umkhawulo usebenza kibo boke abahlokwana be-FROM, TO, ne-CC bama-imeyili, woke amakheli we-imeyili wabaQhakamisana nabo kanye nenkundla yoMdali yemibhalo.
zimbra_index_rfc822address_max_token_length = Ubude obukhulu be-token bekheli ku-RFC822 address token stream. Umkhawulo usebenza kibo boke abahlokwana be-FROM, TO, ne-CC bama-imeyili, woke amakheli we-imeyili wabaQhakamisana nabo kanye nenkundla yoMdali yemibhalo.
zimbra_index_wildcard_max_terms_expanded = Ukwandiswa okukhulu khulu kwe-wildcard kuthemu ngalinye elisodwa esibuzweni.
zimbra_galsync_index_reader_cache_size = Inani elikhulu khulu lama-IndexReader ekheshini ye-GAL search index. I-Lucene index ye-akhawunti yokuvumelanisa i-GAL ikheshwa ngokuhlukileko ngaphandle kokukhutjhwa ngokuzenzakalela.
zimbra_spam_report_queue_size = Kuma-Junk/Not Junk Msg/ConvActionRequests, lobu bukhulu bomtlala bukhawulela i-workqueue yeseva yokucubungula ukudluliselwa.
zimbra_throttle_op_concurrency = Irhelo elihlukaniswe ngamakhoma lamanani wokusebenza ngesikhathi sinye kuwona woke amazinga ama-5 wobukhulu, ngokulandelana kusukela kobukhulu obuphezulu ukuya kobuphasi.
zimbra_im_chat_flush_time = IM chat ezivulekileko zitlolwa kanengi kangangani (imizuzwana) esitolo.
zimbra_im_chat_close_time = Iseva izolinda isikhathi eside kangangani (imizuzwana) ukuvala amaseshini we-IM chat angasebenzi.
zimbra_http_originating_ip_header = I-HTTP header okumele ihlolwe ukuze kutholakale ikheli le-IP lokuthoma leklayenti.
zimbra_session_limit_imap = Inani elikhulu khulu lama-folder we-IMAP umsebenzisi oyedwa angaba nawo avulekile ngesikhathi sinye.
zimbra_session_limit_admin = Inani elikhulu khulu lamaseshini we-admin SOAP umsebenzisi oyedwa angaba nawo avulekile ngesikhathi sinye.
zimbra_session_limit_soap = Inani elikhulu khulu lamaseshini we-SOAP asebenzako nge-akhawunti. Yandisa leli nani ngokucophelela ukuze ugweme amaphutha athi "Too many SOAP sessions" ku-mailbox.log.
zimbra_session_limit_sync = Inani elikhulu khulu labelaleli bokuvumelanisa ngeseshini ngasinye be-ActiveSync. Yandisa leli nani ngokucophelela ukuze ugweme amaphutha athi "Too many SYNCLISTENER sessions" ku-sync.log.
zimbra_session_timeout_soap = Isikhathi sokuphela kokungalungi (ngemizuzwana) samaseshini we-SOAP.
zimbra_session_max_pending_notifications = Inani elikhulu khulu lezaziso ezilindileko ezingafakwa emtlaleni weseshini ye-SOAP ngaphambi kobana umtlala uhlanzwe begodu iklayenti litshelwe bona isimo salo asisebenzi.
zimbra_converter_enabled_uuencode = Nangabe i-UUENCODE decoder iyasetjenziswa na lokha nakuhlaziywa imilayezo evela esitolo.
zimbra_converter_enabled_tnef = Nangabe i-TNEF decoder iyasetjenziswa na lokha nakuhlaziywa imilayezo evela esitolo.
zimbra_converter_depth_max = Ubujula be-MIME obuphindaphindekako okungaphasi kwabo abaguquli abangeke basebenze.
zimbra_ssl_enabled = Ukuthi kuyalayishwa na i-ssl keystore.
stats_img_folder = Irhekhthori yokugcina iinthombe zezibalo ezenziweko.
ldap_host = Umphathi we-LDAP ozokusetjenziswa. Akusasekelwa - sibawa usebenzise i-ldap_url esikhundleni.
ldap_log_level = Izinga lokuloga le-LDAP.
ldap_port = I-port ye-LDAP ezokusetjenziswa. Akusasekelwa - sibawa usebenzise i-ldap_url esikhundleni.
ldap_url = Irhelo lamaseva we-LDAP azosetjenziswa yile seva.
ldap_master_url = I-URL eya ku-master ye-LDAP.
ldap_is_master = Ingabe lo mphathi uyiseva ye-master ye-LDAP?
ldap_root_password = Iphasiwedi ye-rootdn ye-LDAP slapd.conf. Njengokwenza kube lula, ngesikhathi sokuthoma i-LDAP kudalwa iphasiwedi engahleliweko, igcinwe ku-local config naku-slapd.conf. Nangabe ufuna ukutjhugulula le phasiwedi, sibawa usebenzise uhlelo lwe-zmldappasswd oluzotjhugulula iphasiwedi kokubili ku-slapd.conf naku-local config.
ldap_connect_timeout = Ama-millisecond ngemva kwalokho umzamo wokuxhuma uyakhanselwa.
ldap_read_timeout = Ama-millisecond ngemva kwalokho umzamo wokufunda uyakhanselwa.
ldap_deref_aliases = Ukuthi ama-alias kufanele adereferenshwe na ngesikhathi sokufuna namkha sokubophela kurhekhthori yangaphandle. Amanani avumelekileko ngi: always, never, finding, searching.
ldap_connect_pool_master = Ukuthi i-JNDI connection pooling kufanele isetjenziselwe i-LDAP master.
ldap_connect_pool_debug = Ukuthi i-LDAP connection pooling kufanele idebagiwe na.
ldap_connect_pool_initsize = Inani lokuthoma loxhumano lwe-LDAP olusebenzako okuzokukhuliswa kulo.
ldap_connect_pool_maxsize = Inani elikhulu khulu loxhumano lwe-LDAP olusebenzako nolungasebenzi oluvunyelweko.
ldap_connect_pool_prefsize = Inani elithandwako loxhumano lwe-LDAP - ukusetha kokubili i-maxsize ne-prefsize enanini elifanako kugcina iphuli yoxhumano isebukhulu obungatjhugulukiko.
ldap_connect_pool_timeout = Ama-millisecond wesikhathi sokungasebenzi ngaphambi kobana uxhumano olungasebenzi lukhutjhwe ephulini.
ldap_connect_pool_health_check_on_checkout_enabled = Ukuthi ukuhlolwa kwepilo ye-connection pool kuzobizwa na qobe lokha nakuzokukhutjhwa uxhumano ukuze lusetjenziswe. Nangabe ukuhlolwa kwepilo kwe-OnCheckout kuvuliwe, ukuhlolwa kwepilo kwesendlalelo esingemuva okwenziwa ngezikhathi ezithileko kuzokukhutjhazwa.
ldap_connect_pool_health_check_interval_millis = Ubude besikhathi ngama-millisecond hlangana nokuhlolwa kwepilo kwesendlalelo esingemuva okwenziwa ngezikhathi ezithileko phezu koxhumano olukhona ephulini yoxhumano.
ldap_connect_pool_health_check_max_response_time_millis = Ubude besikhathi obukhulu ngama-millisecond okufanele buvunyelwe bona impendulo yokuhlolwa kwepilo ibuyele ivela kuseva ye-LDAP.
ldap_replication_password = Iphasiwedi esetjenziswa mumsebenzisi we-syncrepl ukuziqinisekisa ku-ldap master.
ldap_postfix_password = Iphasiwedi esetjenziswa yi-postfix ukuziqinisekisa ku-ldap.
ldap_amavis_password = Iphasiwedi esetjenziswa yi-amavis ukuziqinisekisa ku-ldap.
ldap_starttls_supported = Ukuthi iseva ye-LDAP isekela umsebenzi we-startTLS.
ldap_require_tls = Ukuthi i-TLS iyafuneka kumaklayenti we-LDAP.
ldap_cache_account_maxsize = Inani elikhulu khulu lezinto ze-akhawunti okufanele zikheshwe.
ldap_cache_account_maxage = Ubudala obukhulu (ngemizuzu) bezinto ze-akhawunti ekheshini.
ldap_cache_cos_maxsize = Inani elikhulu khulu lezinto ze-cos okufanele zikheshwe.
ldap_cache_cos_maxage = Ubudala obukhulu (ngemizuzu) bezinto ze-cos ekheshini.
ldap_cache_domain_maxsize = Inani elikhulu khulu lezinto zedomeyini okufanele zikheshwe.
ldap_cache_domain_maxage = Ubudala obukhulu (ngemizuzu) bezinto zedomeyini ekheshini.
ldap_cache_mime_maxage = Ubudala obukhulu, ngemizuzu, bezinto ze-MIME ekheshini.
ldap_cache_server_maxsize = Inani elikhulu khulu lezinto zeseva okufanele zikheshwe.
ldap_cache_server_maxage = Ubudala obukhulu (ngemizuzu) bezinto zeqhema ekheshini.
ldap_cache_share_locator_maxsize = Inani elikhulu khulu lezinto ze-akhawunti ekheshini yokungena ebiziweko.
ldap_cache_share_locator_maxage = I-TTL yekheshi yokungena ebiziweko ngemizuzu.
ldap_cache_timezone_maxsize = Inani elikhulu khulu lezinto ze-timezone okufanele zikheshwe.
ldap_cache_zimlet_maxsize = Inani elikhulu khulu lezinto ze-zimlet okufanele zikheshwe.
ldap_cache_zimlet_maxage = Ubudala obukhulu (ngemizuzu) bezinto ze-zimlet ekheshini.
ldap_cache_custom_dynamic_group_membership_maxage_ms = Ubudala obukhulu (ngama-millisecond) bokukhesha ukuthi ngiwaphi amaqhema adinamikhi i-akhawunti elilunga lawo kumaqhema lawo ubulunga bawo bunqunywa ngokusebenzisa i-MemberURL yesiko.
csrf_filter_domain_allowed_ref_hosts_max_size = Inani elikhulu khulu lokungena kwedomeyini ekheshini ye-CsrfFilter per-domain allowedRefererHosts. Kubuyela ku-ldap_cache_domain_maxsize nakunepIutha lokuhlaziya.
csrf_filter_domain_allowed_ref_hosts_cache_expiry_mins = Ubudala obukhulu (ngemizuzu) bokungena ekheshini ye-CsrfFilter per-domain allowedRefererHosts. Ngemva kokuphelelwa sikhathi, ukungena kuyakhutjhwa begodu kulayishwa godu kusuka ku-LDAP esibaweni esilandelako. Kubuyela emuva emizuzwini ema-60 nakunepIutha lokuhlaziya.
mysql_directory = Indawo yokufakwa kwe-MySQL.
mysql_data_directory = Irhekhthori lapho idatha ye-MySQL kufanele ihlale khona.
mysql_errlogfile = I-log yephutha ye-MySQL/MariaDB.
mysql_socket = Indlela eya ku-MySQL socket ezosetjenziswa mathulusi womugqa womyalo we-MySQL.
mysql_pidfile = Ifayela lapho i-ID yephrosesi ye-MySQL igcinwa khona.
mysql_mycnf = Indlela eya ku-my.cnf, ifayela lekhonfigi ye-MySQL.
mysql_bind_address = I-interface kule host lapho i-MySQL izobopha khona.
mysql_port = Inomboro yephothi lapho iseva ye-MySQL kufuze ilalele khona.
mysql_root_password = Iphasiwedi yomsebenzisi 'root' eyakhelwe ngaphakathi ku-MySQL, ingadidaniswa nokungena kwe-UNIX root.  Njengekulula, ngesikhathi sokuqalisa i-database kukhiqizwa iphasiwedi engakhethiweko, igcinwe kukhonfigi yendawo naku-MySQL.  Nangabe ufuna ukutjhugulula le phasiwedi, sibawa usebenzise ihlelo le-zmmypasswd elizokutjhugulula iphasiwedi kokubili ku-MySQL nakukonfigi yendawo.
mysql_memory_percent = Iphesenthe yememori yesistimu okufuze i-mysql iyisebenzise.  Inani leli ligcinwe lapha ukuze lisetjenziswe lihlelo le-zmmycnf.  Ukutjhugulula isethingi le akubonakali masinyana kuseva ye-MySQL.  Kufuze, ngokutlhogomela okukhulu, uphinde wenze i-my.cnf begodu uthomelele kutjha iseva ye-MySQL ukuze itjhuguluko lisebenze.
mysql_innodb_log_buffer_size = Bona idokhumentheyishini ye-MySQL mayelana ne-innodb_log_buffer_size.  Inani leli ligcinwe lapha ukuze lisetjenziswe lihlelo le-zmmycnf.  Ukutjhugulula isethingi le akubonakali masinyana kuseva ye-MySQL.  Kufuze, ngokutlhogomela okukhulu, uphinde wenze i-my.cnf begodu uthomelele kutjha iseva ye-MySQL ukuze itjhuguluko lisebenze.
mysql_innodb_log_file_size = Bona idokhumentheyishini ye-MySQL mayelana ne-innodb_log_file_size.  Inani leli ligcinwe lapha ukuze lisetjenziswe lihlelo le-zmmycnf.  Ukutjhugulula isethingi le akubonakali masinyana kuseva ye-MySQL.  Kufuze, ngokutlhogomela okukhulu, uphinde wenze i-my.cnf begodu uthomelele kutjha iseva ye-MySQL ukuze itjhuguluko lisebenze.
mysql_sort_buffer_size = Bona idokhumentheyishini ye-MySQL mayelana ne-sort_buffer_size.  Inani leli ligcinwe lapha ukuze lisetjenziswe lihlelo le-zmmycnf.  Ukutjhugulula isethingi le akubonakali masinyana kuseva ye-MySQL.  Kufuze, ngokutlhogomela okukhulu, uphinde wenze i-my.cnf begodu uthomelele kutjha iseva ye-MySQL ukuze itjhuguluko lisebenze.
mysql_read_buffer_size = Bona idokhumentheyishini ye-MySQL mayelana ne-read_buffer_size.  Inani leli ligcinwe lapha ukuze lisetjenziswe lihlelo le-zmmycnf.  Ukutjhugulula isethingi le akubonakali masinyana kuseva ye-MySQL.  Kufuze, ngokutlhogomela okukhulu, uphinde wenze i-my.cnf begodu uthomelele kutjha iseva ye-MySQL ukuze itjhuguluko lisebenze.
mysql_backup_retention = Inani lokubuyekezwa kwe-backup ye-database ye-mysql okufuze kugcinwe.
antispam_mysql_enabled = Sebenzisa i-database ye-mysql ye-antispam.  I-False ngokuzenzakalela.
antispam_backup_retention = Inani lokubuyekezwa kwe-backup ye-database ye-antispam okufuze kugcinwe.
derby_properties = Indlela eya kufayela lezakhiwo zekhonfigi ye-derby.
imap_max_consecutive_error = Nangabe lingaphezu kwaka-0, lahla i-connection ye-IMAP nangabe inani le-imap_max_consecutive_error lifinyelelwa.
imap_inactive_session_cache_size = Ehcache: ubunengi obukhulu bokungena kwekhetjhi ye-IMAP engasebenziyo ediskini ngaphambi kokukhutjhwa.
imap_use_ehcache = Nangabe kuyiqiniso, sebenzisa i-Ehcache ekucachingeni iseshini ye-IMAP. Kungenjalo, sebenzisa i-disk cache.
imap_write_timeout = Setha isikhathi sokuphela sokutlola seseshini ye-IMAP (nio).
imap_write_chunk_size = Ubukhulu ngamabhayithi bebhafa yokutlola ye-IMAP.
imap_thread_keep_alive_time = Ubude besikhathi obujayelekileko, ngemizuzwana, bethredi ye-IMAP.
imap_throttle_ip_limit = Nangabe lingaphezu kwaka-0, ubunengi obukhulu bezicelo ze-IMAP/ngomzuzwana nge-IP.
imap_throttle_acct_limit = Nangabe lingaphezu kwaka-0, ubunengi obukhulu bezicelo ze-IMAP/ngomzuzwana nge-akhawunti.
imap_suggested_batch_copy_size = Inani lemilayezo okufuze icutshungulwe ngebhetjhi ngayinye ngesikhathi semisebenzi ye-IMAP COPY.
imap_in_progress_response_thread_pool_size = Ubunengi obukhulu bamathredi ephulini lokuthumela ipendulo ye-InProgress kuklayenti.
imap_in_progress_response_thread_keep_alive = Isikhathi ngemizuzwana lapho ithredi kufuze igcinwe iphila ngaphambi kobana ipheliswe.
imap_ehcache_heap_size = Ubunengi obukhulu bokungena kwekhetjhi ye-IMAP okugcinwe ku-heap tier ye-Ehcache.
imap_ehcache_skip_large_folder = Yeqa ukucachwa kwamafolda amakhulu we-IMAP ku-Ehcache nawukuthi kuvuliwe.
imap_ehcache_folder_max_message_count = Umkhawulo wenani lemilayezo ongaphezulu kwawo amafolda we-IMAP angacachwa ku-Ehcache. 
nio_imap_enabled = Nangabe kuyiqiniso, vula i-Jetty non-blocking IO ye-IMAP.
nio_pop3_enabled = Nangabe kuyiqiniso, vula i-Jetty non-blocking IO ye-POP3.
postfix_mail_owner = postfix_mail_owner
postfix_setgid_group = postfix_setgid_group
postfix_version = postfix_version
mailboxd_directory = Indawo yokufakwa kwe-mailboxd.
mailboxd_java_heap_size = Inani lama-megabyte azosetjenziswa njengobukhulu obukhulu be-Java heap (-Xmx) be-JVM egijimisa i-Mailboxd.
mailboxd_java_heap_new_size_percent = Iphesenthe yobukhulu be-Java heap ezosetjenziswa ku-young generation (-Xmn) ye-JVM egijimisa i-Mailboxd.
mailboxd_java_options = Iinkhetho ze-JVM ezizokusetjenziswa nakwethulwa i-Mailboxd.
mailboxd_pidfile = Ifayela lapho i-ID yephrosesi ye-JVM ye-Mailboxd igcinwa khona.
mailboxd_keystore = Indawo yefayela ledatha ye-keystore.
mailboxd_keystore_password = Iphasiwedi ezokusetjenziswa ne-KeyManager keystore.
mailboxd_truststore = Indawo yefayela ledatha ye-truststore.
mailboxd_truststore_password = Iphasiwedi ezokusetjenziswa ne-TrustManager keystore.
client_ssl_truststore = Indawo yefayela ledatha ye-truststore esetjenziselwa ukuqinisekiswa kwekhasimende le-SSL.
client_ssl_truststore_password = Iphasiwedi ezokusetjenziswa ne-client SSL TrustManager keystore.
mailboxd_output_file = Ifayela okuzokuqondiswa kilo i-stdout ne-stderr yeseva.
mailboxd_output_rotate_interval = Isikhathi, ngemizuzwana, lapho ifayela lokukhutjhwa kwe-mailboxd lijikeleziswa khona. Nangabe <= 0, akukho kujikeleziswa okwenziwako.
mailboxd_thread_stack_size = Ubukhulu be-thread stack ye-Mailboxd
ssl_allow_untrusted_certs = Nangabe kuyiqiniso, vumela izitifikhethi ze-SSL ezizisayinileko.
zimlet_directory = Indlela eya kuma-Zimlets afakiweko.
calendar_outlook_compatible_allday_events = Sebenzisa izehlakalo zosuku loke ezihambisana ne-Outlook.  I-False ngokuzenzakalela.
calendar_entourage_compatible_timezones = Faka amakowuthi kuparamitha ye-TZID kuzakhiwo ze-iCalendar, ukwenzela ukusebenzela iphuthe le-MS Entourage. True ngokuzenzakalela.
calendar_ics_import_full_parse_max_size = Ngesikhathi sokungenisa i-ics sebenzisa i-full parser nangabe ubukhulu be-ics buncani nanyana bulingana nalokhu; amafayela we-ics amakhulu acutshungulwa nge-callback parser engavumeli ama-forward reference ku-VTIMEZONE TZID
calendar_canonical_tzid = I-id ye-timezone okufuze ibuyiswe njenge-TimeZone.getCanonicalID(). Amanani angaba khona: "olson","windows","java". "windows" ngokuzenzakalela.
calendar_cache_enabled = Vula i-calendar cache.  I-False ngokuzenzakalela.
calendar_cache_directory = Idayirekthri yeruthi yamafayela we-calendar cache
calendar_cache_lru_size = Ubukhulu be-LRU yememory-cache.  Cacha amafolda amanengi wekhalenda ememori.
calendar_cache_range_month_from = Inyanga yokuthoma ebangeni elikhethiweko lecache.  U-0 utjho inyanga yanje, u--1 utjho inyanga edlulileko, njalo njalo.
calendar_cache_range_months = Inani leenyanga ebangeni elikhethiweko lecache
krb5_keytab = Indawo yefayela le-keytab le-Zimbra Kerberos 5
krb5_debug_enabled = Uku-debugga kwe-Kerberos kuvuliwe
zimbra_mtareport_max_hosts = Ubunengi obukhulu bama-host okufanele afakwe emibikweni ye-MTA yansuku zoke ekhiqizwa yi-zmdailyreport.
zimbra_mtareport_max_recipients = Inani labamukeli ekufanele libalwe emibikweni ye-mta yansuku zoke.
zimbra_mtareport_max_senders = Inani labathumeli ekufanele libalwe emibikweni ye-mta yansuku zoke.
zimbra_mtareport_max_users = Ubunengi obukhulu babasebenzisi okufanele bafakwe emibikweni ye-MTA yansuku zoke ekhiqizwa yi-zmdailyreport.
