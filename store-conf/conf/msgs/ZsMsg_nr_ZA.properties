#license notification email for exceeding usage count for feature
licenseFeaureOnHoldNotifierSubject = Isexwayiso Sesistimu ye-Zimbra: Umkhawulo wokusetjenziswa kwezici udlulwe
licenseFeaureOnHoldNotifierBodyText=Inani lama-akhawunti anelayisensi lifinyelelwe namkha lidlulwe ngezici ezilandelako:\n{0}\nUnganciphisa ukusetjenziswa kwabasebenzisi abakhona namkha wandise umkhawulo welayisensi yesici.\n\nUkwandisa umkhawulo welayisensi yesici, sibawa uthintane ne-Zimbra Sales ku-sales@zimbra.com.\nUkuphatha ukwabiwa kwezici ze-akhawunti, sibawa ungene ku-Admin Portal.\n\nSibawa utjheje okulandelako:\n1. Uzoragela phambili nokuthola isaziso amalanga ayi-{1,number,integer} kusukela ngelanga lokudlulwa komkhawulo wokusetjenziswa.\n2. Ngeke ukghone ukwenza isici esisetjenziswe ngokweqileko sisebenzele nanyana imaphi ama-akhawunti.\n3. Nawungathathi sinyatho esicini esisetjenziswe ngokweqileko, isici sizocinyelwa abasebenzisi ukuze sibuyele ngaphasi komkhawulo welayisensi.\n\nNgokuhlonipha,\nZimbra Support
licenseFeaureOnHoldNotifierBodyHtml=<div style="font-family:sans-serif;">Inani lama-akhawunti anelayisensi lifinyelelwe namkha lidlulwe ngezici ezilandelako:<br>{0}<br>Unganciphisa ukusetjenziswa kwabasebenzisi abakhona namkha wandise umkhawulo welayisensi yesici.<br><br>Ukwandisa umkhawulo welayisensi yesici, sibawa uthintane ne-Zimbra Sales ku-<b>sales@zimbra.com</b>.<br>Ukuphatha ukwabiwa kwezici ze-akhawunti, sibawa ungene ku-Admin Portal.<br><br>Sibawa utjheje okulandelako:<br>1. Uzoragela phambili nokuthola isaziso amalanga ayi-{1,number,integer} kusukela ngelanga lokudlulwa komkhawulo wokusetjenziswa.<br>2. Ngeke ukghone ukwenza isici esisetjenziswe ngokweqileko sisebenzele nanyana imaphi ama-akhawunti.<br>3. Nawungathathi sinyatho esicini esisetjenziswe ngokweqileko, isici sizocinyelwa abasebenzisi ukuze sibuyele ngaphasi komkhawulo welayisensi.<br><br>Ngokuhlonipha,<br>Zimbra Support</div>

