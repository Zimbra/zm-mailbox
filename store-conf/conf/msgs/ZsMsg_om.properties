httpclient_internal_client_connection_timeout = httpclient client walqunnamtii keessaa Zimbraf: yeroo timeout milisekondii keessatti kan HTTP connection manager irraa HTTP connection argachuuf fayyadamu kaa'a.
httpclient_internal_connmgr_connection_timeout = httpclient connection manager walqunnamtii keessaa Zimbraf: hanga walqunnamtiin hundeeffamutti timeout murteessa. Gatiin zero jedhu timeout hin fayyadamne jechuudha.
httpclient_internal_connmgr_idle_reaper_connection_timeout = httpclient connection manager idle reaper walqunnamtii keessaa Zimbraf: yeroo timeout kan walqunnamtiilee hojii malee jiran qoruuf fayyadamu.
httpclient_internal_connmgr_idle_reaper_sleep_interval = httpclient connection manager idle reaper walqunnamtii keessaa Zimbraf: yeroo threadiin idle connection reaper hojii gidduutti rafee tura, milisekondii keessatti. 0 jechuun threadiin reaper dhaabbata.
httpclient_internal_connmgr_max_host_connections = httpclient connection manager walqunnamtii keessaa Zimbraf: lakkoofsa olaanaa walqunnamtiilee qindaa'ina host tokkoof hayyamaman murteessa.
httpclient_internal_connmgr_max_total_connections = httpclient connection manager walqunnamtii keessaa Zimbraf: lakkoofsa olaanaa walqunnamtiilee waliigalaa hayyamaman murteessa.
httpclient_internal_connmgr_so_timeout = httpclient connection manager walqunnamtii keessaa Zimbraf: gatiin timeout zero jechuun timeout daangaa hin qabne jechuudha. Gatiin kun yeroo method parameters HTTP keessatti socket timeout hin kaa'amne fayyadama.
httpclient_internal_connmgr_tcp_nodelay = httpclient connection manager walqunnamtii keessaa Zimbraf: HTTP socket irratti Nagle algorithm dhaabuu isaa murteessa.
httpclient_internal_connmgr_stale_connection_check = httpclient connection manager walqunnamtii keessaa Zimbraf: stale connection check fayyadamuun isaa murteessa. Stale connection check dhaabuun bu'aa raawwii xinnoo fooyyeessuu danda'a, garuu walqunnamtii server cufee irra request raawwachuun dogoggora I/O fiduu mala.
httpclient_external_client_connection_timeout = httpclient client walqunnamtii alaa: yeroo timeout milisekondii keessatti kan HTTP connection manager irraa HTTP connection argachuuf fayyadamu kaa'a. Stale connection check dhaabuun bu'aa raawwii xinnoo fooyyeessuu danda'a, garuu walqunnamtii server cufee irra request raawwachuun dogoggora I/O fiduu mala.
httpclient_external_connmgr_connection_timeout = httpclient connection manager walqunnamtii alaa: hanga walqunnamtiin hundeeffamutti timeout murteessa. Gatiin zero jedhu timeout hin fayyadamne jechuudha.
httpclient_external_connmgr_idle_reaper_connection_timeout = httpclient connection manager idle reaper walqunnamtii alaaf: yeroo timeout kan walqunnamtiilee hojii malee jiran qoruuf fayyadamu.
httpclient_external_connmgr_idle_reaper_sleep_interval = httpclient connection manager idle reaper walqunnamtii alaaf: yeroo threadiin idle connection reaper hojii gidduutti rafee tura, milisekondii keessatti. 0 jechuun threadiin reaper dhaabbata.
httpclient_external_connmgr_max_host_connections = httpclient connection manager walqunnamtii alaaf: lakkoofsa olaanaa walqunnamtiilee qindaa'ina host tokkoof hayyamaman murteessa.
