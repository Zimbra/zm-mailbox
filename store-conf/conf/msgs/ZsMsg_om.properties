zimbra_log_directory = Galmee faayiliileen log itti barreeffaman.
zimbra_index_directory = Galmee faayiliilee indeeksii kuusaa ergaatiif.
zimbra_store_directory = Galmee ergaawwan kuusaa ergaatiif.
zimbra_db_directory = Galmee faayiliilee deetaa-beezitiif.
zimbra_tmp_directory = Galmee faayiliilee yeroo muraasaatiif.
zimbra_hybrid_blob_mover_enabled = Amalli Hybrid Blob Mover akka hojiirra oolu murteessa. Durtiin isaa: false.
zimbra_extensions_directory = Galmee galmeeleen jalaa isaa extension qabatan.
zimbra_extensions_common_directory = Galmee faayiliilee jar kan extension hunda keessatti waliinii ta'an qabuu.
zimbra_mysql_shutdown_timeout = Adeemsi MySQL/MariaDB kuusaa ergaa akka dhaabbatu eeggachuuf yeroo. Yoo mysql.server adeemsa dhaabuuf yeroo dheeraa fudhata ta'e, timeout dabaluu qabdu.
zimbra_mysql_user = Maqaa fayyadamaa MySQL kan deetaa-beezotaa fi gabateewwan zimbra uumuuf yookiin isaanii seenuuf fayyadu. Kun gatii sagantaa sarara-ajaja 'mysql' keessatti filannoo '-u'f kennitan dha.
zimbra_mysql_password = Jechi icciitii zimbra_mysql_user. Store application'n mirkaneessuuf local config keessatti kuufama. Jecha icciitii kana jijjiiruu yoo barbaaddan, sagantaa zmmypasswd fayyadamaa; innis jecha icciitii MySQL keessatti fi local config keessatti ni jijjiira.
zimbra_ldap_userdn = LDAP dn kan store application'n LDAP waliin mirkaneeffachuuf fayyadamu.
zimbra_ldap_user = Maqaa fayyadamaa zimbra kan admin AuthRequest waliin mirkaneeffachuuf fayyadamu.
zimbra_ldap_password = Jechi icciitii zimbra_ldap_userdn. Store application'n mirkaneessuuf local config keessatti kuufama. Jecha icciitii kana jijjiiruu yoo barbaaddan, sagantaa zmldappasswd fayyadamaa; innis jecha icciitii LDAP keessatti fi local config keessatti ni jijjiira.
zimbra_server_hostname = Maqaan server kanaaf qophaa'e kana dha. Galmeen 'server' isa waliin walsimu LDAP keessatti jiraachuu qaba; ajaja CreateServer sagantaa zmprov ilaalchisee sanada ilaalaa.
zimbra_user = Fayyadamaan unix zimbra kan adeemsi server zimbra poortiiwwan mirga addaa qaban irratti hidhee booda mirga isaa itti geeddaruu qabu.
zimbra_uid = UID unix zimbra kan adeemsi server zimbra poortiiwwan mirga addaa qaban irratti hidhee booda itti geeddaruu qabu.
zimbra_gid = GID unix zimbra kan adeemsi server zimbra poortiiwwan mirga addaa qaban irratti hidhee booda itti geeddaruu qabu.
zimbra_log4j_properties = Daandii gara faayilii amaloota qindeessaa log4j.
zimbra_log4j_properties_watch = Yeroo hordoffii faayilii amaloota qindeessaa log4j keessatti msec.
zimbra_attrs_directory = Galmee faayiliileen *.xml sintaksii amaloota LDAP sirnichi fayyadamu ibsan qabu.
localized_msgs_directory = Galmee faayiliilee ergaa naannoofamanii.
localized_client_msgs_directory = Galmee faayiliilee ergaa maamilaa naannoofamanii.
skins_directory = Galmee skins.
zimbra_store_sweeper_max_age = Faayiliileen daqiiqaa baay'ina kana caalan galmee incoming store keessaa ofumaan haqamu.
zimbra_store_copy_buffer_size_kb = Hojiiwwan waraabbii faayilii buffer hamma kana qaban fayyadamu.
zimbra_mailbox_galsync_cache = Daangaa olaanaa kaachii wanta quunnamtii sanduuqa galsync murteessa. Gatii kana yoo xiqqaate baay'ina wantoota quunnamtii sanduuqa galsync keessaa ta'u irratti kaa'aa.
zimbra_mailbox_manager_hardref_cache = Baay'ina olaanaa sanduuqawwan ergaa yaadannoo keessatti qabamanii itti fufan murteessa; sana booda mailbox manager akka isaan SoftReference garbage collection'n qulqulleeffaman ni hayyama.
zimbra_mailbox_active_cache = Yeroo sessionnni hojii irra jiranitti, hamma olaanaa kaachii wanta LRU keessaa sanduuqa ergaa.
zimbra_mailbox_inactive_cache = Yeroo sessionnni hojii irra hin jirretti, hamma olaanaa kaachii wanta LRU keessaa sanduuqa ergaa.
zimbra_mailbox_change_checkpoint_frequency = Yeroo keessaa lakkoofsa jijjiiramaatiin gatiin jijjiirama highwater ZIMBRA.MAILBOX.CHANGE_CHECKPOINT sanduuqa ergaa itti barreeffamu.
zimbra_index_elasticsearch_url_base = URL bu'uuraa REST API ElasticSearch.
zimbra_index_threads = Hamma poolii thread indeeksii baachii.
zimbra_reindex_threads = Baay'ina olaanaa thread re-index. Thread'oonni re-index pool keessatti hin kuufaman.
zimbra_index_disable_perf_counters = Yoo false ta'e, Lucene read fi write IO hordoffii hojii Zimbra'n ni galmaa'u. Gatiin true ta'e hordoffii IO Lucene ni dhaaba.
zimbra_index_max_readers = Baay'ina olaanaa IndexReaders yeroo tokkotti hojii irra jiran.
zimbra_index_max_writers = Baay'ina olaanaa IndexWriters yeroo tokkotti hojii irra jiran.
zimbra_index_reader_cache_size = Cache indexii barbaachaa keessatti lakkoofsa olaanaa IndexReaders.
zimbra_index_reader_cache_ttl = Yoo yeroo kana (sekondii) caalaa hojii malee ture, IndexReader cache keessaa haqi.
zimbra_index_deferred_items_failure_delay = Dogoggora booda, tarree wantoota hin indexamne (deferred) qulqulleessuuf yaalii gidduutti yeroo tursiisa xiqqaa (sekondii).
zimbra_index_lucene_max_terms_per_query = Lakkoofsa olaanaa termoota gaaffii tokko keessatti hayyamaman kaa'i.
zimbra_index_max_transaction_bytes = Yeroo hojiiwwan indexii gara transaction Mailbox tokkootti batch godhaman, guddina waliigalaa olaanaa wantoota transaction tokko keessatti hayyamamu.
zimbra_index_max_transaction_items = Yeroo hojiiwwan indexii batch godhaman, lakkoofsa olaanaa mail_items transaction tokko keessatti hayyamnu.
zimbra_index_max_pending_deletes = Bakki diskii deebifamee argamutti geessutti lakkoofsa olaanaa haqiinsa indexii eegaa jiran.
zimbra_index_lucene_merge_policy = LogDocMergePolicy fayyadamuuf true, LogByteSizeMergePolicy fayyadamuuf false. LogDocMergePolicy baay'ina dokumentootaa irratti hundaa'ee segmentoota walitti makamu filata. LogByteSizeMergePolicy immoo guddina isaanii irratti hundaa'ee segmentoota walitti makamu filata.
zimbra_index_lucene_min_merge = Akka merge policy zimbra_index_lucene_merge_policy keessatti ibsameen, Lucene minimum merge size Documents yookaan KB keessatti kaa'a.
zimbra_index_lucene_max_merge = Akka merge policy zimbra_index_lucene_merge_policy keessatti ibsameen, Lucene maximum merge size Documents yookaan KB keessatti kaa'a. Gatiin kun segmentii guddaan segmentoota biroo waliin walitti makamuu danda'u murteessa.
zimbra_index_lucene_merge_factor = Segment indices addDocument()tiin yeroo meeqa walitti makaman. Gatiin xiqqaan yeroo indexing RAM xiqqaa fayyadama, barbaachisni saffisaa ta'a, garuu saffisni indexing suuta ta'a. Gatiin guddaan yeroo indexing RAM baay'ee fayyadama, barbaachisni suuta ta'a, garuu indexing saffisaa ta'a. Gatiin guddaan (>10) uuma indexii batchiif gaarii dha; gatiin xiqqaan (<10) immoo indices walqunnamtiidhaan eeggamanif gaarii dha.
zimbra_index_lucene_term_index_divisor = Termoota indexaman keessaa RAM keessatti kan fe'aman subsample godha. Gatii > 1 kaa'uun, yeroo odeeffannoo galmee term tokkoof kuufame fe'amu latency ol ka'uu evvachuun yaadannoo hir'isuu dandeessa.
zimbra_index_lucene_use_compound_file = Yoo true ta'e, segmentiin Lucene haaraan compound file format fayyadama. http://wiki.apache.org/lucene-java/ImproveIndexingSpeed akka jedhu, hojii gaarii argachuuf compound file format dhaabuu wayya, garuu lakkoofsa file descriptors baay'ee dabala. Yoo zimbra_index_lucene_merge_factor guddaa ta'e file descriptors dhumu danda'u.
zimbra_index_lucene_max_buffered_docs = Dokumentoota xiqqeessaan barbaachisan, dokumentoonni yaadannoo keessaa buffer godhaman akka segmentii haaraatti gadi lakkifaman dura. Gatiin guddaan yeroo baay'ee indexing saffisaa kenna.
zimbra_index_lucene_ram_buffer_size_kb = Lucene Max Buffered RAM KB keessatti.
zimbra_index_lucene_io_impl = Implementation Lucene FSDirectory indexing IOf fayyadamu. Gatiin danda'aman: nio - NIOFSDirectory fayyadami. Kun yeroo dubbisu java.nio FileChannel positional io fayyadamee file tokko irraa yeroo tokko keessatti dubbisuu irratti synchronization irraa fagaata. mmap - MMapDirectory fayyadami. Kun yeroo dubbisu memory-mapped IO fayyadama. Yoo virtual memory baay'een guddina indexii wajjin wal bira qabamee jiru ta'e filannoo gaarii dha. simple - SimpleFSDirectory fayyadami. Kun java.io.RandomAccessFile fayyadama. Yeroo threads hedduun file wal fakkaataa dubbisan synchronization waan godhuuf hojii yeroo wal faana dadhabaa qaba. Yoo gatiin hin kennamne, FSDirectory naannoo kanaaf implementation caalu filata.
zimbra_index_rfc822address_max_token_count = Lakkoofsi olaanaa tokenoota teessoo address token stream RFC822 keessaa. Daangaan kun imeelotaaf header FROM, TO fi CC hunda irratti, Quunnamtootaaf teessoo imeelii hunda irratti, fi Documents keessatti dirree Creator irratti hojii irra oola.
zimbra_index_rfc822address_max_token_length = Dheerinni olaanaa token teessoo address token stream RFC822 keessaa. Daangaan kun imeelotaaf header FROM, TO fi CC hunda irratti, Quunnamtootaaf teessoo imeelii hunda irratti, fi Documents keessatti dirree Creator irratti hojii irra oola.
zimbra_index_wildcard_max_terms_expanded = Gaaffii keessatti term tokko tokkoof expansion wildcard olaanaa.
zimbra_galsync_index_reader_cache_size = Cache indexii barbaacha GAL keessatti lakkoofsi olaanaa IndexReaders. Lucene index herrega GAL sync cache addaatiin kuufama; ofumaan keessaa hin haqamu.
zimbra_spam_report_queue_size = Junk/Not Junk Msg/ConvActionRequests keessatti guddinni queue kun hojii forwards qindeessuu keessatti server workqueue ni daangessa.
zimbra_throttle_op_concurrency = Sadarkaa dursa 5n hundaa'ee, isa dursa olaanaa irraa kaasee hanga isa gadi aanaatti, tarree gatii concurrency comma'n addaan baafame.
zimbra_im_chat_flush_time = IM chats banaman gara storetti yeroo meeqa (sekondiin) keessatti barreeffaman.
zimbra_im_chat_close_time = Serveriin sessiyoona IM chat hojii malee jiran cufuuf yeroo hammam (sekondiin) eega.
zimbra_http_originating_ip_header = IP asilii clientii murteessuuf header HTTP ilaalamu.
zimbra_session_limit_imap = Lakkoofsa olaanaa fooldarii IMAP fayyadamaan tokko yeroo tokko keessatti banee qabaachuu danda'u.
zimbra_session_limit_admin = Lakkoofsa olaanaa sessiyoona admin SOAP fayyadamaan tokko yeroo tokko keessatti banee qabaachuu danda'u.
zimbra_session_limit_soap = Lakkoofsa olaanaa sessiyoona soap socho'aa herrega tokkoof. Dogoggora "Too many SOAP sessions" mailbox.log keessatti hanqisuuf gatii kana of eeggannoodhaan dabali.
zimbra_session_limit_sync = Lakkoofsa olaanaa sync listeners per session ActiveSyncf. Dogoggora "Too many SYNCLISTENER sessions" sync.log keessatti hanqisuuf gatii kana of eeggannoodhaan dabali.
zimbra_session_timeout_soap = Sessiyoona SOAPf timeout hojii malee (sekondii keessatti).
zimbra_session_max_pending_notifications = Lakkoofsa olaanaa beeksisoota eegaa jiran kan sessiyoonii SOAP keessatti tarreeffamuu danda'an; sanaa ol yoo ta'e queue ni qulqullaawa, clientiinis state isaa sirrii miti jedhamee himama.
zimbra_converter_enabled_uuencode = Yeroo ergaawwan store irraa parse godhaman decoder UUENCODE akka hojjetu ta'uu isaa.
zimbra_converter_enabled_tnef = Yeroo ergaawwan store irraa parse godhaman decoder TNEF akka hojjetu ta'uu isaa.
zimbra_converter_depth_max = Gad fageenya recursive MIME part isa converters itti hin hojjenne.
zimbra_ssl_enabled = Keystore ssl fe'u ykn fe'uu dhiisuu isaa.
stats_img_folder = Daarektarii suuraawwan istaatistiksii uumaman kuusuuf.
ldap_host = Fayyadamuuf host LDAP. Deprecated - maaloo bakka isaa ldap_url fayyadami.
ldap_log_level = Sadarkaa galmeessuu LDAP.
ldap_port = Fayyadamuuf port LDAP. Deprecated - maaloo bakka isaa ldap_url fayyadami.
ldap_url = Serveroota LDAP serveriin kun itti fayyadamu tarreessi.
ldap_master_url = URL gara master LDAP.
ldap_is_master = Hostiin kun master LDAP serverii dhaa?
ldap_root_password = LDAP slapd.conf rootdnf jecha icciitii. Mijachuuf, yeroo LDAP jalqabsiifamu jechi icciitii random ta'e ni uumama; local config keessatti fi slapd.conf keessatti ni kuufama. Jecha icciitii kana jijjiiruu yoo barbaadde, sagantaa zmldappasswd fayyadami; inni slapd.conf keessaa fi local config keessaa lamaan keessatti ni jijjiira.
ldap_connect_timeout = Milisekondii yaaliin wal qunnamtii itti addaan citu.
ldap_read_timeout = Milisekondii yaaliin dubbisuu itti addaan citu.
ldap_deref_aliases = Yeroo barbaadu yookaan external directorytti hidhamu aliases dereference godhachuu isaa. Gatiin sirrii: always, never, finding, searching.
ldap_connect_pool_master = LDAP masterf JNDI connection pooling fayyadamuun isaa.
ldap_connect_pool_debug = LDAP connection pooling debug gochuun isaa.
ldap_connect_pool_initsize = Lakkoofsa jalqabaa wal qunnamtiilee LDAP socho'oo itti ol kaafaman.
ldap_connect_pool_maxsize = Lakkoofsa olaanaa wal qunnamtiilee LDAP socho'oo fi hojii malee hayyamaman.
ldap_connect_pool_prefsize = Lakkoofsa filatamaa wal qunnamtiilee LDAP - maxsize fi prefsize wal qixa kaa'uun connection pool guddina dhaabbataa irratti tursiisa.
ldap_connect_pool_timeout = Milisekondii yeroo hojii malee connectioniin hojii malee pool irraa buqqa'u dura.
ldap_connect_pool_health_check_on_checkout_enabled = Yeroo wal qunnamtiin tokko hojii irra ooluuf checkout godhamu hunda connection pool health check ni waamama moo. Yoo health check OnCheckout dandeessifame, health check background yeroo yerootti deemuu ni dhaabbata.
ldap_connect_pool_health_check_interval_millis = Yeroo milisekondii keessatti health checks background yeroo yerootti wal qunnamtiilee connection pool keessa jiran irratti gaggeeffaman gidduu jiru.
ldap_connect_pool_health_check_max_response_time_millis = Dheerina yeroo olaanaa milisekondii keessatti deebiin health check server LDAP irraa deebi'uu qabu.
ldap_replication_password = Jecha icciitii fayyadamaan syncrepl gara ldap mastertti mirkaneeffachuuf fayyadamu.
ldap_postfix_password = Jecha icciitii postfix gara ldaptti mirkaneeffachuuf fayyadamu.
ldap_amavis_password = Jecha icciitii amavis gara ldaptti mirkaneeffachuuf fayyadamu.
ldap_starttls_supported = Serveriin LDAP hojii startTLS ni deeggaraa?
ldap_require_tls = Clientoota LDAPf TLS dirqamaa ta'uu isaa.
ldap_cache_account_maxsize = Lakkoofsa olaanaa objectoota herregaa cache keessatti kuufaman.
ldap_cache_account_maxage = Umuriin olaanaan (daqiiqaa keessatti) objectoota herregaa cache keessatti.
ldap_cache_cos_maxsize = Lakkoofsa olaanaa objectoota cos cache keessatti kuufaman.
ldap_cache_cos_maxage = Umuriin olaanaan (daqiiqaa keessatti) objectoota cos cache keessatti.
ldap_cache_domain_maxsize = Lakkoofsa olaanaa objectoota domain cache keessatti kuufaman.
ldap_cache_domain_maxage = Umuriin olaanaan (daqiiqaa keessatti) objectoota domain cache keessatti.
ldap_cache_mime_maxage = Umuriin olaanaan objectoota MIME cache keessaa, daqiiqaa keessatti.
ldap_cache_server_maxsize = Lakkoofsa olaanaa objectoota server cache keessatti kuufaman.
ldap_cache_server_maxage = Umuriin olaanaan (daqiiqaa keessatti) objectoota garee cache keessatti.
ldap_cache_share_locator_maxsize = Lakkoofsa olaanaa itemoota herregaa named entry cache keessatti.
ldap_cache_share_locator_maxage = TTL named entry cache daqiiqaa keessatti.
ldap_cache_timezone_maxsize = Lakkoofsa olaanaa objectoota timezone cache keessatti kuufaman.
ldap_cache_zimlet_maxsize = Lakkoofsa olaanaa objectoota zimlet cache keessatti kuufaman.
ldap_cache_zimlet_maxage = Umuriin olaanaan (daqiiqaa keessatti) objectoota zimlet cache keessatti.
ldap_cache_custom_dynamic_group_membership_maxage_ms = Gareewwan dynamic gatiin isaanii custom MemberURL'n murtaa'e keessatti herregni tokko miseensa garee dynamic kam akka ta'e kuusuuf umuriin olaanaan (milisekondii keessatti).
csrf_filter_domain_allowed_ref_hosts_max_size = Cache CsrfFilter per-domain allowedRefererHosts keessatti lakkoofsa olaanaa galteewwan domain. Yoo parsing error ta'e ldap_cache_domain_maxsize irratti deebi'a.
csrf_filter_domain_allowed_ref_hosts_cache_expiry_mins = Cache CsrfFilter per-domain allowedRefererHosts keessatti umuriin olaanaa galteewwan (daqiiqaa keessatti). Expiry booda galteen ni haqama; request itti aanutti LDAP irraa deebi'ee fe'ama. Yoo parsing error ta'e daqiiqaa 60 irratti deebi'a.
mysql_directory = Bakka kuusaan MySQL itti fe'ame.
mysql_data_directory = Daarektarii data MySQL keessa turuu qabu.
mysql_errlogfile = Galmee dogoggoraa MySQL/MariaDB.
mysql_socket = Karaa socket MySQL kan MySQL command line tools itti fayyadaman.
mysql_pidfile = Faayilii process id MySQL keessatti kuufamu.
mysql_mycnf = Karaa gara my.cnf, faayila config MySQL.
mysql_bind_address = Interface host kana irratti MySQL itti bind godhu.
mysql_port = Lakkoofsa portii MySQL server itti dhaggeeffatu.
mysql_root_password = Jecha icciitii fayyadamaa built-in 'root' kan MySQL; kun UNIX root login wajjin hin wal fakkaatu. Mijachuuf, yeroo database jalqabsiifamu jechi icciitii random ta'e ni uumama; local config keessatti fi MySQL keessatti ni kuufama. Jecha icciitii kana jijjiiruu yoo barbaadde, sagantaa zmmypasswd fayyadami; inni jecha icciitii MySQL keessaa fi local config keessaa lamaan keessatti ni jijjiira.
mysql_memory_percent = Dhibbeentaan yaadannoo sirna mysql fayyadamuu qabu. Gatiin kun sagantaa zmmycnf itti fayyadamuuf asitti kuufama. Setting kana jijjiiruun battalumatti server MySQL keessatti hin mul'atu. Jijjiiramni kun hojii irra akka ooluuf, of eeggannoodhaan my.cnf irra deebi'ii uumiitii server MySQL deebisii jalqabi.
mysql_innodb_log_buffer_size = Dokumenteeshinii MySQL innodb_log_buffer_size ilaalchi. Gatiin kun sagantaa zmmycnf itti fayyadamuuf asitti kuufama. Setting kana jijjiiruun battalumatti server MySQL keessatti hin mul'atu. Jijjiiramni kun hojii irra akka ooluuf, of eeggannoodhaan my.cnf irra deebi'ii uumiitii server MySQL deebisii jalqabi.
mysql_innodb_log_file_size = Dokumenteeshinii MySQL innodb_log_file_size ilaalchi. Gatiin kun sagantaa zmmycnf itti fayyadamuuf asitti kuufama. Setting kana jijjiiruun battalumatti server MySQL keessatti hin mul'atu. Jijjiiramni kun hojii irra akka ooluuf, of eeggannoodhaan my.cnf irra deebi'ii uumiitii server MySQL deebisii jalqabi.
mysql_sort_buffer_size = Dokumenteeshinii MySQL sort_buffer_size ilaalchi. Gatiin kun sagantaa zmmycnf itti fayyadamuuf asitti kuufama. Setting kana jijjiiruun battalumatti server MySQL keessatti hin mul'atu. Jijjiiramni kun hojii irra akka ooluuf, of eeggannoodhaan my.cnf irra deebi'ii uumiitii server MySQL deebisii jalqabi.
mysql_read_buffer_size = Dokumenteeshinii MySQL read_buffer_size ilaalchi. Gatiin kun sagantaa zmmycnf itti fayyadamuuf asitti kuufama. Setting kana jijjiiruun battalumatti server MySQL keessatti hin mul'atu. Jijjiiramni kun hojii irra akka ooluuf, of eeggannoodhaan my.cnf irra deebi'ii uumiitii server MySQL deebisii jalqabi.
mysql_backup_retention = Lakkoofsa revisions backup database mysql keessaa qabachuu.
antispam_mysql_enabled = Antispamf mysql database fayyadami. Durtiidhaan false.
antispam_backup_retention = Lakkoofsa revisions backup database antispam keessaa qabachuu.
derby_properties = Karaa gara faayila properties qindaa'ina derby.
imap_max_consecutive_error = Yoo 0 caalaa guddaa ta'e, yeroo gatiin imap_max_consecutive_error ga'amu wal qunnamtiin imap ni citu.
imap_inactive_session_cache_size = Ehcache: lakkoofsa olaanaa galteewwan cache IMAP hojii malee jiran kan disk irratti eviction duratti kuufaman.
imap_use_ehcache = Yoo true ta'e, cache sessiyoonii IMAPf Ehcache fayyadami; yoo kana hin taane disk cache fayyadami.
imap_write_timeout = Timeout barreessuu sessiyoonii IMAP (nio) kaa'i.
imap_write_chunk_size = Guddina buffer barreessuu IMAP bytes keessatti.
imap_thread_keep_alive_time = Yeroo durtii, sekondii keessatti, thread IMAP tokkoof.
imap_throttle_ip_limit = Yoo 0 caalaa guddaa ta'e, IP tokkoof gaaffii IMAP olaanaa/sekondii.
imap_throttle_acct_limit = Yoo 0 caalaa guddaa ta'e, herrega tokkoof gaaffii IMAP olaanaa/sekondii.
imap_suggested_batch_copy_size = Hojii IMAP COPY keessatti batch tokkoon ergaawwan irratti hojii raawwataman lakkoofsa isaanii.
imap_in_progress_response_thread_pool_size = InProgress response clientitti erguuf pool keessatti threads olaanaa.
imap_in_progress_response_thread_keep_alive = Threadiin hojii irraa haqamuu dura yeroo sekondii keessatti akka jiraatu.
imap_ehcache_heap_size = Sadarkaa Ehcache heap keessatti lakkoofsa olaanaa galteewwan cache IMAP kuufaman.
imap_ehcache_skip_large_folder = Yoo dandeessifame, fooldaroota IMAP gurguddoo gara Ehcachetti cache gochuu ni darba.
imap_ehcache_folder_max_message_count = Daangaa lakkoofsa ergaawwan isa olitti fooldariin IMAP gara Ehcachetti cache hin godhamne.
nio_imap_enabled = Yoo true ta'e, IMAPf Jetty non-blocking IO dandeessisi.
nio_pop3_enabled = Yoo true ta'e, POP3f Jetty non-blocking IO dandeessisi.
postfix_mail_owner = postfix_mail_owner
postfix_setgid_group = postfix_setgid_group
postfix_version = postfix_version
mailboxd_directory = Bakka mailboxd itti fe'ame.
mailboxd_java_heap_size = Lakkoofsa megabytes akka guddina olaanaa Java heap (-Xmx) JVM Mailboxd irratti hojii irra ooluuf fayyadamu.
mailboxd_java_heap_new_size_percent = Dhibbeentaa guddina Java heap keessaa akka young generation (-Xmn) JVM Mailboxd irratti hojii irra ooluuf fayyadamu.
mailboxd_java_options = Mailboxd jalqabuuf filannoowwan JVM fayyadaman.
mailboxd_pidfile = Faayilii process id JVM Mailboxd keessatti kuufamu.
mailboxd_keystore = Bakka faayiliin deetaa keystore itti jiru.
mailboxd_keystore_password = Jecha icciitii KeyManager keystore waliin fayyadamu.
mailboxd_truststore = Bakka faayiliin deetaa truststore itti jiru.
mailboxd_truststore_password = Jecha icciitii TrustManager keystore waliin fayyadamu.
client_ssl_truststore = Bakka faayiliin deetaa truststore kan mirkaneessa client SSLf fayyadamu itti jiru.
client_ssl_truststore_password = Jecha icciitii client SSL TrustManager keystore waliin fayyadamu.
mailboxd_output_file = Faayilii stdout fi stderr server keessaa gara isaa qajeelchuuf.
mailboxd_output_rotate_interval = Yeroo, sekondii keessatti, faayiliin output mailboxd itti naanneffamu. Yoo <= 0 ta'e, naanneffamni hin raawwatamu.
mailboxd_thread_stack_size = Guddina stack thread Mailboxd.
ssl_allow_untrusted_certs = Yoo true ta'e, SSL certificates self-signed hayyami.
zimlet_directory = Karaa gara Zimlets fe'aman.
calendar_outlook_compatible_allday_events = Taateewwan guutuu guyyaa Outlook waliin wal simu fayyadami. Durtiidhaan false.
calendar_entourage_compatible_timezones = Bug MS Entourage irraa mufuuf, properties iCalendar keessatti parameter TZID quotes keessa kaa'i. Durtiidhaan true.
calendar_ics_import_full_parse_max_size = Import ics keessatti, yoo guddinni ics kanaa gadi yookaan isa wajjin wal qixa ta'e full parser fayyadami; faayiloonni ics gurguddoon callback parsern parse godhamu, kunis VTIMEZONE TZIDf forward references hin hayyamu.
calendar_canonical_tzid = Timezone id TimeZone.getCanonicalID() irraa deebi'u. Gatiin danda'aman: "olson","windows","java". Durtiidhaan "windows".
calendar_cache_enabled = Cache calendar dandeessisi. Durtiidhaan false.
calendar_cache_directory = Daarektarii hundee faayiloota cache calendar.
calendar_cache_lru_size = Guddina memory-cache LRU. Fooldarii calendar hedduu kana yaadannoo keessatti cache godhi.
calendar_cache_range_month_from = Ji'a jalqabaa range cache keessatti. 0 jechuun ji'a ammaa, -1 jechuun ji'a darbe, kkf.
calendar_cache_range_months = Lakkoofsa ji'oota range cache keessaa.
krb5_keytab = Bakka faayilii keytab Zimbra Kerberos 5.
krb5_debug_enabled = Kerberos debugging dandeessifame.
zimbra_mtareport_max_hosts = Lakkoofsa olaanaa hostoota zmdailyreporttiin gabaasa MTA guyyaa keessatti hammataman.
zimbra_mtareport_max_recipients = Lakkoofsa recipients gabaasa mta guyyaa keessatti tarreeffaman.
zimbra_mtareport_max_senders = Lakkoofsa senders gabaasa mta guyyaa keessatti tarreeffaman.
zimbra_mtareport_max_users = Lakkoofsa olaanaa fayyadamtootaa zmdailyreporttiin gabaasa MTA guyyaa keessatti hammataman.
zimbra_auth_always_send_refer = Client redirect dirqisiisuuf deebii auth keessatti yeroo hunda tag <refer> deebisi.
zimbra_admin_service_port = Pooritii admin durtii/bootstrap.
zimbra_admin_service_scheme = Scheme/protocol admin durtii/bootstrap.
zimbra_mail_service_port = Pooritii mail durtii.
zimbra_zmprov_default_to_ldap = zmprov durtiidhaan LDAP yookaan SOAP filachuu isaa.
zimbra_zmprov_default_soap_server = Server soap durtii zmprov itti wal qunnamu.
zmprov_safeguarded_attrs = Tartiiba amaloota provisioning heddu-gatii qabanii bakka bu'iinsarraa eegumsa barbaadan comma'n addaan baafaman.
zmprov_tmp_directory = Daarektarii yeroo muraasaa zmprov gatii attribute binary gara faayilootaatti barreessuuf.
zimbra_mailbox_groups = Lakkoofsa gareewwan mailbox mailbox haaraa itti qoodamu.
debug_mailboxindex_use_new_locking = MailboxIndexf locking haala haaraa fayyadami.
zimbra_class_provisioning = Kilaasii interface provisioning.
zimbra_class_accessmanager = Kilaasii interface access manager.
zimbra_class_mboxmanager = Kilaasii interface mailbox manager.
zimbra_class_database = Kilaasii qindaa'ina database.
zimbra_class_store = Kilaasii interface message store.
zimbra_class_application = Kilaasii interface application Zimbra.
zimbra_class_rulerewriterfactory = Kilaasii interface RuleRewriterFactory.
zimbra_class_dbconnfactory = Kilaasii database connection factory.
zimbra_class_soapsessionfactory = Kilaasii soap session factory.
av_notify_user = Teessoo imeelii ergaawwan bulchiinsaa anti-virus fi DKIM irraa itti ergaman.
av_notify_domain = Domain durtii settings amavisd keessatti.
data_source_trust_self_signed_certs = Yeroo data source tokko irratti SSL'n wal qunnamtu, SSL certificates self-signed hayyami.
data_source_fetch_size = Lakkoofsa olaanaa ergaawwan imap request tokko keessatti FETCH godhaman.
data_source_max_literal_mem_size = Guddina olaanaa literal data (bytes keessatti) kan yaadannoo keessatti cache godhamu. Deetaan guddaan faayila yeroo muraasaatti kuufama.
timezone_file = Faayilii iCalendar kan time zones beekamoo tarreessu.
search_disable_database_hints = Yoo true ta'e, gaaffilee barbaacha keessatti database hints hin fayyadamin.
search_dbfirst_term_percentage_cutoff = Parameetira uuminsa gaaffii keessaa (Internal Query Generation).
zmstat_interval = zmstat samples yeroo meeqa keessatti fudhatamu (sekondii).
zmstat_df_excludes = Tartiiba disk volumes kan mount pathiin ibsamanii colon'n addaan baafaman, zmstats keessaa irraa hafan.
zimbra_noop_default_timeout = Yoo clientiin wait=1 ibse, serveriin NoOpRequest akka block ta'u yeroo eeyyamamu (sekondii).
zimbra_noop_min_timeout = Timeout xiqqeessaan NoOpRequestf hayyamamu (sekondii).
zimbra_noop_max_timeout = Timeout olaanaa NoOpRequestf hayyamamu (sekondii).
zimbra_waitset_default_request_timeout = Timeout durtii (sekondii) WaitSetRequest non-admin block ta'u.
zimbra_waitset_min_request_timeout = Timeout xiqqeessaa (sekondii) WaitSetRequest non-admin block ta'u.
zimbra_waitset_max_request_timeout = Timeout olaanaa (sekondii) WaitSetRequest non-admin block ta'u.
zimbra_waitset_max_per_account = Lakkoofsa olaanaa WaitSets non-admin herregni tokko banee qabaachuu danda'u.
zimbra_admin_waitset_default_request_timeout = Timeout durtii (sekondii) WaitSetRequest admin block ta'u.
zimbra_admin_waitset_min_request_timeout = Timeout xiqqeessaa (sekondii) WaitSetRequest admin block ta'u.
zimbra_admin_waitset_max_request_timeout = Timeout olaanaa (sekondii) WaitSetRequest admin block ta'u.
zimbra_waitset_initial_sleep_time = WaitSetRequest kamiyyuu hojii irra oolchuu dura timeout jalqabaa (milliseconds) eegamu.
zimbra_waitset_nodata_sleep_time = Yeroo (milliseconds) WaitSetRequest tokko yeroo check jalqabaa booda deetaan hin jirre irratti rafamu.
zmdisklog_warn_threshold = Daangaa akeekkachiisaa disk SNMP/SMTP durtii.
zmdisklog_critical_threshold = Daangaa sadarkaa cimaa disk SNMP/SMTP durtii.
zimbra_csv_mapping_file = CSV import fi exportf mapping dirree quunnamtii.
