zimbra_home = Rootiin ijaarsa Zimbra fi galmeen manaa fayyadamaa UNIX 'zimbra' kana dha. Rootii ijaarsaa bakka biraatti geessisuu hin dandeessan; qindaa'ina kana hin jijjiirinaa.
