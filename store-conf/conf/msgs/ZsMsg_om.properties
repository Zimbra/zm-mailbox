sendPasswordResetEmailBodyHtml = <div style="font-family:sans-serif;"><h1 style="font-size:1.3em;">Gaaffiin jecha icciitii herrega keessanii, {1}, reset gochuu nu ga'eera.</h1><hr>Jecha icciitii keessan kaa'uuf qaree armaan gadii cuqaasaa. <br> <a href="{2}" style="font-size: 18px; font-family: helvetica, arial, sans-serif;background-color: rgb(238, 238, 238);border: 1px solid rgb(153, 153, 153);color: black;display: inline-block;line-height: 1.27rem;margin: 4px 2px;padding: 5px 5px 5px 5px;position: relative !important;vertical-align: top;white-space: nowrap;border-radius: 8px;box-sizing: border-box;" target="_blank" >Jecha Icciitii Kaa'i</a>  <br> <br> Liinkiin kun yeroo itti dhumu: {3}<br> </div>
licenseFeaureOnHoldNotifierSubject = Akeekkachiisa Sirna Zimbra: daangaan fayyadama amalootaa darbameera
licenseFeaureOnHoldNotifierBodyText = Lakkoofsi herregaa license godhame amaloota armaan gadiif ga'ee yookaan darbeera:\n{0}\nFayyadama fayyadamtoota jiran hir'isuu yookaan daangaa license amalaa dabaluun ni danda'ama.\n\nDaangaa license amalaa dabaluuf, maaloo Zimbra Sales irratti sales@zimbra.com qunnamaa.\nRamaddii amalaa herregaa bulchuuf, maaloo gara Admin Portal seenaa.\n\nMaaloo kanneen armaan gadii hubadhaa:\n1. Guyyaa fayyadama daangaa darbe irraa eegalee guyyoota {1,number,integer}f beeksisa kana arguu itti fuftu.\n2. Amaloota garmalee fayyadaman herrega kamiyyuu irratti dandeessisuu hin dandeessan.\n3. Yoo amala garmalee fayyadame irratti tarkaanfii hin fudhanne, daangaa license jalatti deebisuuf amalichi fayyadamtootaaf ni dhaabama.\n\nNagaan,\nZimbra Support
licenseFeaureOnHoldNotifierBodyHtml = <div style="font-family:sans-serif;">Lakkoofsi herregaa license godhame amaloota armaan gadiif ga'ee yookaan darbeera:<br>{0}<br>Fayyadama fayyadamtoota jiran hir'isuu yookaan daangaa license amalaa dabaluun ni danda'ama.<br><br>Daangaa license amalaa dabaluuf, maaloo Zimbra Sales irratti <b>sales@zimbra.com</b> qunnamaa.<br>Ramaddii amalaa herregaa bulchuuf, maaloo gara Admin Portal seenaa.<br><br>Maaloo kanneen armaan gadii hubadhaa:<br>1. Guyyaa fayyadama daangaa darbe irraa eegalee guyyoota {1,number,integer}f beeksisa kana arguu itti fuftu.<br>2. Amaloota garmalee fayyadaman herrega kamiyyuu irratti dandeessisuu hin dandeessan.<br>3. Yoo amala garmalee fayyadame irratti tarkaanfii hin fudhanne, daangaa license jalatti deebisuuf amalichi fayyadamtootaaf ni dhaabama.<br><br>Nagaan,<br>Zimbra Support</div>
passwordExpiryNotifierSubject = Jecha icciitii keessan guyyoota {0} keessatti ni dhuma
passwordExpiryNotifierBodyText = Kabajamoo {0},\n\nJecha icciitii herrega keessanii guyyoota {1} keessatti, jechuunis {2} irratti ni dhuma.\n\nSeensa herrega keessanii itti fufuuf, maaloo guyyaa xumuraa dura jecha icciitii keessan reset godhaa.\n\nJecha icciitiin jijjiiramu yookaan dhumutti beeksisota guyyaa guyyaadhaan arguu itti fuftu.\n\nKun beeksisa imeelii ofumaan uumamedha.
passwordExpiryNotifierBodyHtml = <p>Kabajamoo {0},</p><p>Jecha icciitii herrega keessanii <strong>guyyoota {1} keessatti</strong>, jechuunis <strong>{2}</strong> irratti ni dhuma.</p><p>Seensa herrega keessanii itti fufuuf, maaloo guyyaa xumuraa dura jecha icciitii keessan reset godhaa.</p><p>Jecha icciitiin jijjiiramu yookaan dhumutti beeksisota guyyaa guyyaadhaan arguu itti fuftu.</p><p>Kun beeksisa imeelii ofumaan uumamedha.</p>
