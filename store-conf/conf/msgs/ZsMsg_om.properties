httpclient_external_connmgr_so_timeout = httpclient connection manager walqunnamtii alaaf: gatiin timeout zero jechuun timeout daangaa hin qabne jechuudha. Gatiin kun yeroo method parameters HTTP keessatti socket timeout hin kaa'amne fayyadama.
httpclient_external_connmgr_tcp_nodelay = httpclient connection manager walqunnamtii alaaf: HTTP socket irratti Nagle algorithm dhaabuu isaa murteessa.
httpclient_external_connmgr_stale_connection_check = httpclient connection manager walqunnamtii alaaf: stale connection check fayyadamuun isaa murteessa.
httpclient_convertd_so_timeout = Timeout socket milisekondii keessatti kan convertd clientiif. Yoo 0 ta'e timeout hin jiru; yoo -1 ta'e yookaan hin kaa'amne ta'e timeout dubbisuu durtii connection manager fayyadama.
