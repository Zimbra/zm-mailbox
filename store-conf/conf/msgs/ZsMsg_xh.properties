# local config settings

zimbra_home = Ingcambu yofakelo lweZimbra kunye nolawulo lwasekhaya lomsebenzisi we-UNIX othi \u2018zimbra\u2019. Awunakushenxisa ingcambu yofakelo - musa ukutshintsha olu seto.
zimbra_java_home = Indlela eya kwi-JDK/J2SDK.
zimbra_log_directory = Ulawulo apho kubhalwa khona iifayile ze-log.
zimbra_index_directory = Ulawulo lweefayile zesalathisi sebhokisi yemeyile.
zimbra_store_directory = Ulawulo lwemiyalezo yebhokisi yemeyile.
zimbra_db_directory = Ulawulo lweefayile zedatabase.
zimbra_tmp_directory = Ulawulo lweefayile zethutyana.
zimbra_hybrid_blob_mover_enabled = Iseta ukuba inqaku le-Hybrid Blob Mover livuliwe na. Okwendalo: false
zimbra_extensions_directory = Ulawulo oluneefolda ezingaphantsi eziqulethe ii-extension.
zimbra_extensions_common_directory = Ulawulo oluneefayile ze-jar eziqhelekileyo kuzo zonke ii-extension.
zimbra_mysql_shutdown_timeout = Ixesha lokulinda inkqubo ye-MySQL/MariaDB yebhokisi yemeyile ukuba ime. Yandisa eli xesha ukuba i-mysql.server ithatha ixesha elide kakhulu ukuvala inkqubo.
zimbra_mysql_user = Igama lomsebenzisi le-MySQL lokudala okanye lokufikelela kwiidatabase neetheyibhile ze-zimbra. Eli lixabiso ongalinika ukhetho lwe-\u2018-u\u2019 lwenkqubo yomgca womyalelo ethi \u2018mysql\u2019.
zimbra_mysql_password = Iphasiwedi ye-zimbra_mysql_user. Igcinwa kuseto lwasekuhlaleni ukuze isetyenziswe sisicelo sesitoreji xa siziqinisekisa. Ukuba ufuna ukutshintsha le phasiwedi, nceda sebenzisa inkqubo ye-zmmypasswd eya kutshintsha iphasiwedi kuzo zombini i-MySQL nakuseto lwasekuhlaleni.
zimbra_ldap_userdn = I-LDAP dn esetyenziselwa ukuqinisekisa isicelo sesitoreji nge-LDAP.
zimbra_ldap_user = igama lomsebenzisi le-zimbra elisetyenziselwa ukuqinisekisa nge-admin AuthRequest.
zimbra_ldap_password = Iphasiwedi ye-zimbra_ldap_userdn. Igcinwa kuseto lwasekuhlaleni ukuze isetyenziswe sisicelo sesitoreji xa siziqinisekisa. Ukuba ufuna ukutshintsha le phasiwedi, nceda sebenzisa inkqubo ye-zmldappasswd eya kutshintsha iphasiwedi kuzo zombini i-LDAP nakuseto lwasekuhlaleni.
zimbra_server_hostname = Igama elibonelelweyo lale server. Kufuneka kubekho ungeno oluhambelanayo lwe-\u2018server\u2019 kwi-LDAP - jonga amaxwebhu omyalelo we-CreateServer wenkqubo ye-zmprov.
zimbra_user = Umsebenzisi we-unix we-zimbra ekufuneka inkqubo yeseva ye-zimbra itshintshele kuwo amalungelo, emva kokubopha amazibuko afuna amalungelo awodwa.
zimbra_uid = I-uid ye-unix ye-zimbra ekufuneka inkqubo yeseva ye-zimbra itshintshele kuyo amalungelo, emva kokubopha amazibuko afuna amalungelo awodwa.
zimbra_gid = I-gid ye-unix ye-zimbra ekufuneka inkqubo yeseva ye-zimbra itshintshele kuyo amalungelo, emva kokubopha amazibuko afuna amalungelo awodwa.
zimbra_log4j_properties = Indlela eya kwifayile yeempawu zoqwalaselo lwe-log4j.
zimbra_log4j_properties_watch = Ixesha lokujonga lefayile yeempawu zoqwalaselo lwe-log4j kwi-msec.
zimbra_attrs_directory = Ulawulo oluqulathe iifayile ze-*.xml ezichaza isintaksi seempawu ze-LDAP ezisetyenziswa yinkqubo.
localized_msgs_directory = Ulawulo lweefayile zemiyalezo eziguqulelweyo.
localized_client_msgs_directory = Ulawulo lweefayile zemiyalezo yomxhasi eziguqulelweyo.
skins_directory = Ulawulo lwezikin.
zimbra_store_sweeper_max_age = Iifayile ezindala ngaphezu kweli nani lemizuzu zicinywa ngokuzenzekelayo kulawulo olungenayo lwesitoreji.
zimbra_store_copy_buffer_size_kb = Iikopi zeefayile zisebenzisa iibuffer zobu bungakanani.
zimbra_mailbox_galsync_cache = Iseta elona nani liphezulu lekheshi yezinto zonxibelelwano zebhokisi yemeyile ye-galsync. Seta ixabiso libe ubuncinane linani lezinto zonxibelelwano kwibhokisi yemeyile ye-galsync.
zimbra_mailbox_manager_hardref_cache = Elona nani liphezulu leebhokisi zemeyile eziya kubanjwa kwimemori ngaphambi kokuba umphathi weebhokisi zemeyile aqalise ukuzivumela ukuba zicocwe ngoqokelelo lwenkunkuma lwe-SoftReference.
zimbra_mailbox_active_cache = Elona nani liphezulu lekheshi yangaphakathi ye-LRU yezinto zebhokisi yemeyile xa kukho iiseshoni ezisebenzayo.
zimbra_mailbox_inactive_cache = Elona nani liphezulu lekheshi yangaphakathi ye-LRU yezinto zebhokisi yemeyile xa ingenazo iiseshoni ezisebenzayo.
zimbra_mailbox_change_checkpoint_frequency = Ubuninzi (kwinani lotshintsho) apho ixabiso lotshintsho lwe-highwater lwe-ZIMBRA.MAILBOX.CHANGE_CHECKPOINT lebhokisi yemeyile libhalwa khona.
zimbra_index_elasticsearch_url_base = I-URL esisiseko ye-ElasticSearch REST API.
zimbra_index_threads = Ubungakanani bephuli yemisonto yesalathisi sebhetshi.
zimbra_reindex_threads = Elona nani liphezulu lemisonto lokuphinda kusalathiswe. Imisonto yokuphinda kusalathiswe ayidityaniswanga ephulini.
zimbra_index_disable_perf_counters = Ukuba yi-false, i-Lucene yokufunda ne-yokubhala i-IO ilandelwa lulawulo lokusebenza lweZimbra. Ixabiso eliyi-true likhubaza ukulandelwa kwe-Lucene IO.
zimbra_index_max_readers = Elona nani liphezulu lee-IndexReader ezisebenza ngaxeshanye
zimbra_index_max_writers = Elona nani liphezulu lee-IndexWriter ezisebenza ngaxeshanye
zimbra_index_reader_cache_size = Elona nani liphezulu lee-IndexReader kwikheshi yesalathisi sokukhangela
zimbra_index_reader_cache_ttl = Ukuba ayisebenzi ixesha elide kuneli xabiso (imizuzwana) susa i-IndexReader kwikheshi
zimbra_index_deferred_items_failure_delay = Emva kokusilela, elona xesha lincinci lokulibaziseka (imizuzwana) phakathi kwemizamo yokucoca uluhlu lwezinto ezingekasalathiswa (ezihlehlisiweyo)
zimbra_index_lucene_max_terms_per_query = Seta elona nani liphezulu lamagama avumelekileyo kumbuzo ngamnye.
zimbra_index_max_transaction_bytes = Xa kudityaniswa imisebenzi yesalathisi kwintengiselwano ye-Mailbox, obu bubungakanani obuphezulu obupheleleyo bezinto esiza kuzivumela kwintengiselwano enye.
zimbra_index_max_transaction_items = Xa kudityaniswa imisebenzi yesalathisi, eli lelona nani liphezulu le-mail_items esilivumelayo kwintengiselwano enye.
zimbra_index_max_pending_deletes = Elona nani liphezulu lokucinywa kwesalathisi okulindileyo ngaphambi kokubuyiselwa kwesithuba sediski.
zimbra_index_lucene_merge_policy = true ukusebenzisa i-LogDocMergePolicy, false ukusebenzisa i-LogByteSizeMergePolicy. I-LogDocMergePolicy ikhetha iisegimenti eziza kudityaniswa ngokusekelwe kwinani lamaxwebhu. I-LogByteSizeMergePolicy ikhetha iisegimenti eziza kudityaniswa ngokusekelwe kubungakanani bazo.
zimbra_index_lucene_min_merge = Iseta obona bungakanani buncinci bokudityaniswa kwe-Lucene kuMqulu okanye kwi-KB kuxhomekeke kumgaqo-nkqubo wokudibanisa ochazwe kwi-zimbra_index_lucene_merge_policy.
zimbra_index_lucene_max_merge = Iseta obona bungakanani buphezulu bokudityaniswa kwe-Lucene kuMqulu okanye kwi-KB kuxhomekeke kumgaqo-nkqubo wokudibanisa ochazwe kwi-zimbra_index_lucene_merge_policy. Eli xabiso limisela eyona segimenti inkulu enokudityaniswa nezinye iisegimenti.
zimbra_index_lucene_merge_factor = Kukangaphi izalathisi zeesegimenti zidityaniswa yi-addDocument(). Ngamaxabiso amancinci, kusetyenziswa i-RAM encinci ngexesha lokusalathisa, kwaye ukukhangela kuyakhawuleza, kodwa isantya sokusalathisa sicotha. Ngamaxabiso amakhulu, kusetyenziswa i-RAM eninzi ngexesha lokusalathisa, kwaye nangona ukukhangela kucotha, ukusalathisa kuyakhawuleza. Amaxabiso amakhulu (>10) alungele ukwenziwa kwesalathisi sebhetshi, kwaye amancinci (<10) alungele izalathisi ezigcinwa ngokunxibelelana.
zimbra_index_lucene_term_index_divisor = Iisampulu ezincinci zamagama asalathisiweyo zilayishwa kwi-RAM. Ngokumisela oku kwixabiso > 1 unganciphisa ukusetyenziswa kwememori ngexabiso lokulibaziseka eliphezulu xa kulayishwa ulwazi lwerekhodi olugcinelwe igama.
zimbra_index_lucene_use_compound_file = true ukuba isegimenti entsha ye-Lucene kufuneka isebenzise ifomathi yefayile edityanisiweyo. I-http://wiki.apache.org/lucene-java/ImproveIndexingSpeed ithi makucinywe ifomathi yefayile edityanisiweyo ukuze kube nokusebenza okungcono, kodwa oko kuya kwandisa kakhulu inani lezichazi zefayile. Izichazi zefayile zinokuphela ukuba i-zimbra_index_lucene_merge_factor inkulu.
zimbra_index_lucene_max_buffered_docs = Elona nani lincinci lamaxwebhu elifunekayo ngaphambi kokuba amaxwebhu akhutshelweyo asememori akhutshwe abe yisegimenti entsha. Amaxabiso amakhulu ahlala enika ukusalathisa okukhawulezayo.
zimbra_index_lucene_ram_buffer_size_kb = I-RAM ephezulu ebhafa yi-Lucene kwi-KB
zimbra_index_lucene_io_impl = Ukuphunyezwa kwe-Lucene FSDirectory okusetyenziselwa i-IO yokusalathisa. Amaxabiso anokwenzeka nio - Sebenzisa i-NIOFSDirectory. Isebenzisa i-io yendawo ye-FileChannel ye-java.nio xa kufundwa ukuphepha ungqamaniso xa kufundwa kwifayile enye. mmap - Sebenzisa i-MMapDirectory. Isebenzisa i-IO ekhunjulwe kwimemori xa kufundwa. Lukhetho oluhle ukuba kukho imemori eninzi ebonakalayo xa ithelekiswa nobungakanani besalathisi. simple - Sebenzisa i-SimpleFSDirectory. Isebenzisa i-java.io.RandomAccessFile. Inokusebenza okubi xa kukho ukufunda ngaxeshanye kuba iyangqamanisa xa imisonto emininzi ifunda ifayile enye. Ukuba akukho xabiso linikiweyo, i-FSDirectory iya kukhetha olona phunyezwa lufanelekileyo kwimeko-bume.
zimbra_index_rfc822address_max_token_count = Elona nani liphezulu leetoken zedilesi kumjelo weethokheni zedilesi ye-RFC822. Umda usebenza kuzo zonke iintloko ze-FROM, TO, ne-CC zee-imeyile, kuzo zonke iidilesi zee-imeyile zoQhagamshelwano, nakwindawo yoMdali yamaXwebhu.
zimbra_index_rfc822address_max_token_length = Obona bude buphezulu bethokheni yedilesi kumjelo weethokheni zedilesi ye-RFC822. Umda usebenza kuzo zonke iintloko ze-FROM, TO, ne-CC zee-imeyile, kuzo zonke iidilesi zee-imeyile zoQhagamshelwano, nakwindawo yoMdali yamaXwebhu.
zimbra_index_wildcard_max_terms_expanded = Elona nani liphezulu lokwandiswa kwe-wildcard kwigama ngalinye kumbuzo.
zimbra_galsync_index_reader_cache_size = Elona nani liphezulu lee-IndexReader kwikheshi yesalathisi sokukhangela ye-GAL. Isalathisi se-Lucene seakhawunti yongqamaniso lwe-GAL sigcinwa ngokwahlukileyo ngaphandle kokukhutshwa ngokuzenzekelayo.
zimbra_spam_report_queue_size = Kwi-Junk/Not Junk Msg/ConvActionRequests obu bungakanani boluhlu luthintela umgca womsebenzi weseva wokuqhuba ukudlulisela phambili.
zimbra_throttle_op_concurrency = Uluhlu olwahlulwe ngeekoma lwamaxabiso ongqamaniso kwinqanaba ngalinye kula manqanaba ama-5 okubaluleka ukusuka kwelona liphezulu ukuya kwelisezantsi.
zimbra_im_chat_flush_time = Kukangaphi (imizuzwana) iingxoxo ze-IM ezivulekileyo zibhaliwa kwisitoreji
zimbra_im_chat_close_time = Ixesha elingakanani (imizuzwana) iseva iya kulinda ngaphambi kokuvala iiseshoni zeengxoxo ze-IM ezingasebenziyo
zimbra_http_originating_ip_header = Intloko ye-HTTP ekufuneka ijongwe ukumisela idilesi ye-IP yokuqala yomxhasi
zimbra_session_limit_imap = Elona nani liphezulu leefolda ze-IMAP anokuzivula umsebenzisi omnye ngexesha elinye
zimbra_session_limit_admin = Elona nani liphezulu leeseshoni ze-admin SOAP anokuzivula umsebenzisi omnye ngexesha elinye
zimbra_session_limit_soap = Elona nani liphezulu leeseshoni ze-soap ezisebenzayo ngeakhawunti nganye. Yandisa eli xabiso ngononophelo ukuze uphephe iimpazamo ze-"Too many SOAP sessions" kwi-mailbox.log.
zimbra_session_limit_sync = Elona nani liphezulu labaphulaphuli bongqamaniso beeseshoni nganye ze-ActiveSync. Yandisa eli xabiso ngononophelo ukuze uphephe iimpazamo ze-"Too many SYNCLISTENER sessions" kwi-sync.log.
zimbra_session_timeout_soap = Ixesha lokuphelelwa kukungasebenzi (ngemizuzwana) leeseshoni ze-SOAP
zimbra_session_max_pending_notifications = Elona nani liphezulu lezaziso ezisalindileyo ezinokufakwa emgceni kwiseshoni ye-SOAP phambi kokuba umgca ucocwe aze umxhasi axelelwe ukuba imo yakhe ayisebenzi
zimbra_converter_enabled_uuencode = Ukuba i-decoder ye-UUENCODE iyasebenza xa kusahlulwa imiyalezo esuka kugcino
zimbra_converter_enabled_tnef = Ukuba i-decoder ye-TNEF iyasebenza xa kusahlulwa imiyalezo esuka kugcino
zimbra_converter_depth_max = Ubunzulu obuphezulu obuphindaphindwayo bendawo ye-MIME ngaphantsi kwabo abaguquli abangayi kusebenza
zimbra_ssl_enabled = Ukuba kufuneka kulayishwe i-keystore ye-ssl okanye akunjalo
stats_img_folder = Uvimba weefayile wokugcina imifanekiso yeenkcukacha-manani eyenziweyo.
ldap_host = Umamkeli we-LDAP oza kusetyenziswa. Kudala ungasetyenziswa - nceda usebenzise i-ldap_url endaweni yoko.
ldap_log_level = Inqanaba lokuloga le-LDAP
ldap_port = Izibuko le-LDAP oza kulisebenzisa. Kudala lingasetyenziswa - nceda usebenzise i-ldap_url endaweni yoko.
ldap_url = Uluhlu lweeseva ze-LDAP ezisetyenziswa yile seva.
ldap_master_url = I-URL eya kwi-LDAP master.
ldap_is_master = Ngaba lo mamkeli uyiseva enkulu ye-LDAP?
ldap_root_password = Iphasiwedi ye-rootdn ye-LDAP slapd.conf. Ukuze kube lula, ngexesha lokuqalisa i-LDAP kuveliswa iphasiwedi engacwangciswanga, igcinwe kuqwalaselo lwasekhaya nakwi-slapd.conf. Ukuba ufuna ukutshintsha le phasiwedi, nceda usebenzise inkqubo ye-zmldappasswd eya kutshintsha iphasiwedi kuzo zombini i-slapd.conf nakuqwalaselo lwasekhaya.
ldap_connect_timeout = Inani leemillisecond emva kwalo umzamo wonxibelelwano uyayekiswa.
ldap_read_timeout = Inani leemillisecond emva kwalo umzamo wokufunda uyayekiswa.
ldap_deref_aliases = Ukuba ii-aliases mazikhutshwe zibhekiswe ngqo na ngexesha lokukhangela okanye lokubopha kuluhlu lwangaphandle. Amaxabiso asebenzayo ngala: always, never, finding, searching
ldap_connect_pool_master = Ukuba kusetyenziswe i-JNDI connection pooling kwi-LDAP master.
ldap_connect_pool_debug = Ukuba i-LDAP connection pooling mayihlolwe ngedebug.
ldap_connect_pool_initsize = Inani lokuqala lonxibelelwano olusebenzayo lwe-LDAP ekufuneka lonyuswe lufike kulo.
ldap_connect_pool_maxsize = Elona nani liphezulu lonxibelelwano lwe-LDAP olusebenzayo nolungasebenziyo oluvumelekileyo.
ldap_connect_pool_prefsize = Inani elikhethwayo lonxibelelwano lwe-LDAP - ukumisela zombini i-maxsize ne-prefsize kwixabiso elifanayo kugcina ipuli yonxibelelwano kubukhulu obumisiweyo.
ldap_connect_pool_timeout = Inani leemillisecond zokungasebenzi phambi kokuba unxibelelwano olungasebenziyo lususwe kwipuli.
ldap_connect_pool_health_check_on_checkout_enabled = Ukuba uvavanyo lwempilo yepuli yonxibelelwano luya kubizwa ngalo lonke ixesha xa unxibelelwano luphuma ukuze lusetyenziswe. Ukuba uvavanyo lwempilo lwe-OnCheckout luvuliwe, uvavanyo lwempilo lwangasemva oluqhubekayo luya kukhubazeka.
ldap_connect_pool_health_check_interval_millis = Ubude bexesha ngeemillisecond phakathi kovavanyo lwempilo lwangasemva oluqhubekayo ngokuchasene nonxibelelwano olukhoyo kwipuli yonxibelelwano.
ldap_connect_pool_health_check_max_response_time_millis = Elona xesha lide ngeemillisecond ekufuneka livunyelwe ukuze impendulo yovavanyo lwempilo ibuye kwiserva ye-LDAP.
ldap_replication_password = Iphasiwedi esetyenziswa ngumsebenzisi we-syncrepl ukuqinisekisa kwi-ldap master.
ldap_postfix_password = Iphasiwedi esetyenziswa yi-postfix ukuqinisekisa kwi-ldap.
ldap_amavis_password = Iphasiwedi esetyenziswa yi-amavis ukuqinisekisa kwi-ldap.
ldap_starttls_supported = Ukuba iseva ye-LDAP ixhasa umsebenzi we-startTLS.
ldap_require_tls = Ukuba i-TLS iyafuneka kubaxhasi be-LDAP.
ldap_cache_account_maxsize = Elona nani liphezulu lezinto zeakhawunti ekufuneka zigcinwe kwi-cache.
ldap_cache_account_maxage = Ubudala obuphezulu (ngemizuzu) bezinto zeakhawunti kwi-cache.
ldap_cache_cos_maxsize = Elona nani liphezulu lezinto ze-cos ekufuneka zigcinwe kwi-cache.
ldap_cache_cos_maxage = Ubudala obuphezulu (ngemizuzu) bezinto ze-cos kwi-cache.
ldap_cache_domain_maxsize = Elona nani liphezulu lezinto zedomeyini ekufuneka zigcinwe kwi-cache
ldap_cache_domain_maxage = Ubudala obuphezulu (ngemizuzu) bezinto zedomeyini kwi-cache.
ldap_cache_mime_maxage = Ubudala obuphezulu, ngemizuzu, bezinto ze-MIME kwi-cache.
ldap_cache_server_maxsize = Elona nani liphezulu lezinto zeseva ekufuneka zigcinwe kwi-cache
ldap_cache_server_maxage = Ubudala obuphezulu (ngemizuzu) bezinto zeqela kwi-cache.
ldap_cache_share_locator_maxsize = Elona nani liphezulu lezinto zeakhawunti kwi-cache yokungena enegama.
ldap_cache_share_locator_maxage = I-TTL ye-cache yokungena enegama ngemizuzu.
ldap_cache_timezone_maxsize = Elona nani liphezulu lezinto zexesha lommandla ekufuneka zigcinwe kwi-cache.
ldap_cache_zimlet_maxsize = Elona nani liphezulu lezinto ze-Zimlet ekufuneka zigcinwe kwi-cache.
ldap_cache_zimlet_maxage = Ubudala obuphezulu (ngemizuzu) bezinto ze-Zimlet kwi-cache.
ldap_cache_custom_dynamic_group_membership_maxage_ms = Ubudala obuphezulu (ngeemillisecond) bokugcina kwi-cache ukuba ngawaphi amaqela aguqukayo apho iakhawunti ililungu kuwo kula maqela amiselwa ubulungu bawo kusetyenziswa i-MemberURL yesiko.
csrf_filter_domain_allowed_ref_hosts_max_size = Elona nani liphezulu longeniso lwedomeyini kwi-cache ye-CsrfFilter per-domain allowedRefererHosts. Ibuyela kwi-ldap_cache_domain_maxsize xa kukho impazamo yokuhlalutya.
csrf_filter_domain_allowed_ref_hosts_cache_expiry_mins = Ubudala obuphezulu (ngemizuzu) bongeniso kwi-cache ye-CsrfFilter per-domain allowedRefererHosts. Emva kokuphelelwa, ungeniso luyakhutshwa luze lulayishwe kwakhona lisuka kwi-LDAP kwisicelo esilandelayo. Ibuyela kwimizuzu engama-60 xa kukho impazamo yokuhlalutya.
mysql_directory = Indawo yofakelo lwe-MySQL.
mysql_data_directory = Uvimba weefayile apho idatha ye-MySQL kufuneka ihlale khona.
mysql_errlogfile = Ilog yeempazamo ye-MySQL/MariaDB.
mysql_socket = Indlela eya kwi-socket ye-MySQL esetyenziswa zizixhobo zomgca womyalelo ze-MySQL.
mysql_pidfile = Ifayile apho i-id yenkqubo ye-MySQL igcinwa khona.
mysql_mycnf = Indlela eya kwi-my.cnf, ifayile yoqwalaselo ye-MySQL.
mysql_bind_address = Ujongano olukulo mamkeli apho i-MySQL iza kubophelela khona.
mysql_port = Inani lezibuko apho iseva ye-MySQL kufuneka imamele khona.
mysql_root_password = Iphasiwedi yomsebenzisi owakhelwe ngaphakathi we-MySQL othi \u2018root\u2019, engafanele ukudidaniswa nokungena kwe-UNIX root. Ukuze kube lula, ngexesha lokuqalisa isiseko sedatha kuveliswa iphasiwedi engacwangciswanga, igcinwe kuqwalaselo lwasekhaya nakwi-MySQL. Ukuba ufuna ukutshintsha le phasiwedi, nceda usebenzise inkqubo ye-zmmypasswd eya kutshintsha iphasiwedi kuzo zombini i-MySQL nakuqwalaselo lwasekhaya.
mysql_memory_percent = Ipesenti yenkumbulo yenkqubo ekufuneka isetyenziswe yi-mysql. Eli xabiso ligcinwa apha ukuze lisetyenziswe yinkqubo ye-zmmycnf. Ukutshintsha olu seto akubonakali ngoko nangoko kwiseva ye-MySQL. Kuya kufuneka, ngononophelo olukhulu, uphinde uvelise i-my.cnf uze uqale kwakhona iseva ye-MySQL ukuze utshintsho lusebenze.
mysql_innodb_log_buffer_size = Jonga uxwebhu lwe-MySQL lwe-innodb_log_buffer_size. Eli xabiso ligcinwa apha ukuze lisetyenziswe yinkqubo ye-zmmycnf. Ukutshintsha olu seto akubonakali ngoko nangoko kwiseva ye-MySQL. Kuya kufuneka, ngononophelo olukhulu, uphinde uvelise i-my.cnf uze uqale kwakhona iseva ye-MySQL ukuze utshintsho lusebenze.
mysql_innodb_log_file_size = Jonga uxwebhu lwe-MySQL lwe-innodb_log_file_size. Eli xabiso ligcinwa apha ukuze lisetyenziswe yinkqubo ye-zmmycnf. Ukutshintsha olu seto akubonakali ngoko nangoko kwiseva ye-MySQL. Kuya kufuneka, ngononophelo olukhulu, uphinde uvelise i-my.cnf uze uqale kwakhona iseva ye-MySQL ukuze utshintsho lusebenze.
mysql_sort_buffer_size = Jonga uxwebhu lwe-MySQL lwe-sort_buffer_size. Eli xabiso ligcinwa apha ukuze lisetyenziswe yinkqubo ye-zmmycnf. Ukutshintsha olu seto akubonakali ngoko nangoko kwiseva ye-MySQL. Kuya kufuneka, ngononophelo olukhulu, uphinde uvelise i-my.cnf uze uqale kwakhona iseva ye-MySQL ukuze utshintsho lusebenze.
mysql_read_buffer_size = Jonga uxwebhu lwe-MySQL lwe-read_buffer_size. Eli xabiso ligcinwa apha ukuze lisetyenziswe yinkqubo ye-zmmycnf. Ukutshintsha olu seto akubonakali ngoko nangoko kwiseva ye-MySQL. Kuya kufuneka, ngononophelo olukhulu, uphinde uvelise i-my.cnf uze uqale kwakhona iseva ye-MySQL ukuze utshintsho lusebenze.
mysql_backup_retention = Inani lohlaziyo logcino lwedatha lwe-mysql ekufuneka lugcinwe.
antispam_mysql_enabled = Sebenzisa isiseko sedatha se-mysql kwi-antispam. Bubuxoki ngokungagqibekanga.
antispam_backup_retention = Inani lohlaziyo logcino lwedatha lwe-antispam ekufuneka lugcinwe.
derby_properties = Indlela eya kwifayile yeepropathi zoqwalaselo ye-derby.
imap_max_consecutive_error = Ukuba ingaphezulu ko-0, lahla unxibelelwano lwe-imap xa kufikelelwa kwixabiso le-imap_max_consecutive_error.
imap_inactive_session_cache_size = Ehcache: elona nani liphezulu longeniso lwe-cache ye-IMAP engasebenziyo kwidiski phambi kokukhutshwa.
imap_use_ehcache = Ukuba kuyinyani, sebenzisa i-Ehcache kwi-cache yeseshoni ye-IMAP. Kungenjalo, sebenzisa i-cache yediski.
imap_write_timeout = Misela ixesha lokuphela kokubhala leseshoni ye-IMAP (nio).
imap_write_chunk_size = Ubungakanani ngeebhayithi bebhafa yokubhala ye-IMAP.
imap_thread_keep_alive_time = Ubude bexesha obungagqibekanga, ngemizuzwana, bomsonto we-IMAP.
imap_throttle_ip_limit = Ukuba ingaphezulu ko-0, elona nani liphezulu lezicelo ze-IMAP/ngomzuzwana nge-IP nganye.
imap_throttle_acct_limit = Ukuba ingaphezulu ko-0, elona nani liphezulu lezicelo ze-IMAP/ngomzuzwana ngeakhawunti nganye.
imap_suggested_batch_copy_size = Inani lemiyalezo ekufuneka iqhutywe kwibhetshi nganye ngexesha lemisebenzi ye-IMAP COPY.
imap_in_progress_response_thread_pool_size = Elona nani liphezulu leentsontelo kwipuli lokuthumela impendulo ye-InProgress kumxhasi.
imap_in_progress_response_thread_keep_alive = Ixesha ngemizuzwana apho umsonto ugcinwa usebenza phambi kokupheliswa.
imap_ehcache_heap_size = Elona nani liphezulu longeniso lwe-cache ye-IMAP olugcinwe kwinqanaba le-heap le-Ehcache.
imap_ehcache_skip_large_folder = Itsiba ukugcina kwi-cache iifolda ezinkulu ze-IMAP kwi-Ehcache xa ivuliwe.
imap_ehcache_folder_max_message_count = Umda wenani lemiyalezo ongaphezulu kwawo iifolda ze-IMAP zingagcinwa kwi-Ehcache.
nio_imap_enabled = Ukuba kuyinyani, vula i-Jetty non-blocking IO ye-IMAP.
nio_pop3_enabled = Ukuba kuyinyani, vula i-Jetty non-blocking IO ye-POP3.
postfix_mail_owner = postfix_mail_owner
postfix_setgid_group = postfix_setgid_group
postfix_version = postfix_version
mailboxd_directory = Indawo yofakelo lwe-mailboxd.
mailboxd_java_heap_size = Inani leemegabhayithi eliza kusetyenziswa njengobukhulu obuphezulu be-heap ye-Java (-Xmx) ye-JVM eqhuba i-Mailboxd.
mailboxd_java_heap_new_size_percent = Ipesenti yobukhulu be-heap ye-Java eza kusetyenziswa kwisizukulwana esitsha (-Xmn) se-JVM eqhuba i-Mailboxd.
mailboxd_java_options = Iinketho ze-JVM ekufuneka zisetyenziswe xa kusungulwa i-Mailboxd.
mailboxd_pidfile = Ifayile apho i-id yenkqubo ye-JVM ye-Mailboxd igcinwa khona.
mailboxd_keystore = Indawo yefayile yedatha ye-keystore.
mailboxd_keystore_password = Iphasiwedi ekufuneka isetyenziswe ne-KeyManager keystore.
mailboxd_truststore = Indawo yefayile yedatha ye-truststore.
mailboxd_truststore_password = Iphasiwedi ekufuneka isetyenziswe ne-TrustManager keystore.
client_ssl_truststore = Indawo yefayile yedatha ye-truststore esetyenziselwa uqinisekiso lwe-SSL lomxhasi.
client_ssl_truststore_password = Iphasiwedi ekufuneka isetyenziswe ne-client SSL TrustManager keystore.
mailboxd_output_file = Ifayile yokujika kuyo i-stdout ne-stderr zeseva.
mailboxd_output_rotate_interval = Ixesha, ngemizuzwana, apho ifayile yemveliso ye-mailboxd ijikeleziswa khona. Ukuba <= 0, akukho kujikeleziswa kwenziwayo.
mailboxd_thread_stack_size = Ubungakanani bestakhi somsonto be-Mailboxd
ssl_allow_untrusted_certs = Ukuba kuyinyani, vumela izatifikethi ze-SSL ezisayinwe ngokwazo.
zimlet_directory = Indlela eya kwi-Zimlet ezifakiweyo.
calendar_outlook_compatible_allday_events = Sebenzisa iziganeko zosuku lonke ezihambelana ne-Outlook. Bubuxoki ngokungagqibekanga.
calendar_entourage_compatible_timezones = Caphula ipharamitha ye-TZID kwiipropathi ze-iCalendar, ukuze kusetyenzwe bug kwi-MS Entourage. Kuyinyani ngokungagqibekanga.
calendar_ics_import_full_parse_max_size = Ngexesha lokungenisa i-ics sebenzisa umhlalutyi opheleleyo ukuba ubungakanani be-ics bungaphantsi okanye bulingana noku; iifayile ezinkulu ze-ics zihlalutywa ngomhlalutyi we-callback ongavumeli ireferensi eziya phambili kwi-VTIMEZONE TZID
calendar_canonical_tzid = I-id yexesha lommandla ekufuneka ibuyiswe njenge-TimeZone.getCanonicalID(). Amaxabiso anokwenzeka: "olson","windows","java". "windows" ngokungagqibekanga.
calendar_cache_enabled = Vula i-cache yekhalenda. Bubuxoki ngokungagqibekanga.
calendar_cache_directory = Uvimba weengcambu weefayile ze-cache yekhalenda
calendar_cache_lru_size = Ubungakanani be-LRU ye-memory-cache. Gcina ezi folda zekhalenda zininzi kwimemori.
