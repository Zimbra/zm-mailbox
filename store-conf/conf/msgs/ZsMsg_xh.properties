passwordExpiryNotifierBodyHtml=<p>Molo {0},</p><p>Iphasiwedi yeakhawunti yakho iphelelwa kwiintsuku ezi-<strong>{1}</strong>, ngomhla we-<strong>{2}</strong>.</p><p>Ukuze uqhubeke ufikelela kwiakhawunti yakho, nceda usete kwakhona iphasiwedi yakho ngaphambi komhla wokuphelelwa kwayo.</p><p>Uya kuqhubeka ufumana izaziso yonke imihla de iphasiwedi itshintshwe okanye iphelelwe.</p><p>Le yimeyile yesaziso ezenzekelayo.</p>

