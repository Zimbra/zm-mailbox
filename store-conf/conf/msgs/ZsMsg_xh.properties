#license notification email for exceeding usage count for feature
licenseFeaureOnHoldNotifierSubject = Isilumkiso seNkqubo yeZimbra: Umda wokusetyenziswa kweempawu ugqithisiwe
licenseFeaureOnHoldNotifierBodyText=Inani leeakhawunti elinelayisensi lifikelelwe okanye ligqithisiwe kwezi mpawu zilandelayo:\n{0}\nUnganciphisa ukusetyenziswa ngabasebenzisi abakhoyo okanye wandise umda welayisensi yeempawu.\n\nUkuze wandise umda welayisensi yeempawu, nceda qhagamshelana neZimbra Sales ku-sales@zimbra.com.\nUkuze ulawule ulwabiwo lweempawu zeakhawunti, nceda ungene kwiPhothali yoLawulo.\n\nNceda uqaphele oku kulandelayo:\n1. Uya kuqhubeka ufumana esi saziso iintsuku eziyi-{1,number,integer} ukusukela kumhla wokugqithisa ukusetyenziswa.\n2. Awuyi kukwazi ukwenza uphawu olusetyenziswe ngokugqithisileyo lusebenze kuyo nayiphi na iakhawunti.\n3. Ukuba awuthathi manyathelo kuphawu olusetyenziswe ngokugqithisileyo, olu phawu luya kukhutshazwa kubasebenzisi ukuze lubuyiselwe phantsi komda welayisensi.\n\nNgemibuliso,\nZimbra Support
licenseFeaureOnHoldNotifierBodyHtml=<div style="font-family:sans-serif;">Inani leeakhawunti elinelayisensi lifikelelwe okanye ligqithisiwe kwezi mpawu zilandelayo:<br>{0}<br>Unganciphisa ukusetyenziswa ngabasebenzisi abakhoyo okanye wandise umda welayisensi yeempawu.<br><br>Ukuze wandise umda welayisensi yeempawu, nceda qhagamshelana neZimbra Sales ku-<b>sales@zimbra.com</b>.<br>Ukuze ulawule ulwabiwo lweempawu zeakhawunti, nceda ungene kwiPhothali yoLawulo.<br><br>Nceda uqaphele oku kulandelayo:<br>1. Uya kuqhubeka ufumana esi saziso iintsuku eziyi-{1,number,integer} ukusukela kumhla wokugqithisa ukusetyenziswa.<br>2. Awuyi kukwazi ukwenza uphawu olusetyenziswe ngokugqithisileyo lusebenze kuyo nayiphi na iakhawunti.<br>3. Ukuba awuthathi manyathelo kuphawu olusetyenziswe ngokugqithisileyo, olu phawu luya kukhutshazwa kubasebenzisi ukuze lubuyiselwe phantsi komda welayisensi.<br><br>Ngemibuliso,<br>Zimbra Support</div>

