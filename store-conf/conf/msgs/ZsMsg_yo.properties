zimbra_mailbox_galsync_cache = \u0143 \u1e63\u00e8t\u00f2 \u00ecpam\u1ecd\u0301 t\u00f3 p\u1ecd\u0300 j\u00f9 f\u00fan cache ohun kan ol\u00f9b\u00e1s\u1ecd\u0300r\u1ecd\u0300 n\u00edn\u00fa \u00e0p\u00f3t\u00ed \u00ecme\u00e8l\u00ec galsync. \u1e62\u00e8t\u00f2 iye n\u00e1\u00e0 k\u00f3 t\u00f3 iye \u00e0w\u1ecdn ohun kan ol\u00f9b\u00e1s\u1ecd\u0300r\u1ecd\u0300 t\u00f3 w\u00e0 n\u00edn\u00fa \u00e0p\u00f3t\u00ed \u00ecme\u00e8l\u00ec galsync.
zimbra_mailbox_manager_hardref_cache = N\u1ecd\u0301mb\u00e0 t\u00f3 p\u1ecd\u0300 j\u00f9 ti \u00e0w\u1ecdn \u00e0p\u00f3t\u00ed \u00ecme\u00e8l\u00ec t\u00ed a \u00f3 d\u00ec m\u1ecd\u0301 s\u00edn\u00fa \u00ecr\u00e1nt\u00ed k\u00ed ol\u00f9\u1e63\u00e0k\u00f3so \u00e0p\u00f3t\u00ed \u00ecme\u00e8l\u00ec t\u00f3 b\u1eb9\u0300r\u1eb9\u0300 s\u00ed \u00ed j\u1eb9\u0301 k\u00ed a l\u00e8 nu w\u1ecdn k\u00far\u00f2 n\u00edpas\u1eb9\u0300 SoftReference garbage collection.
zimbra_mailbox_active_cache = Iw\u1ecdn t\u00f3 p\u1ecd\u0300 j\u00f9 ti cache ohun kan LRU in\u00fa \u00e0p\u00f3t\u00ed \u00ecme\u00e8l\u00ec n\u00edgb\u00e0 t\u00ed \u00e0w\u1ecdn session b\u00e1 \u0144 \u1e63i\u1e63\u1eb9\u0301.
zimbra_mailbox_inactive_cache = Iw\u1ecdn t\u00f3 p\u1ecd\u0300 j\u00f9 ti cache ohun kan LRU in\u00fa \u00e0p\u00f3t\u00ed \u00ecme\u00e8l\u00ec n\u00edgb\u00e0 t\u00ed k\u00f2 s\u00ed session t\u00f3 \u0144 \u1e63i\u1e63\u1eb9\u0301.
zimbra_mailbox_change_checkpoint_frequency = \u00ccgb\u00e0 t\u00f3 m\u00e1a \u0144 \u1e63\u1eb9l\u1eb9\u0300, n\u00ed iye \u00e0w\u1ecdn \u00e0y\u00edpad\u00e0, t\u00ed a fi m\u00e1a k\u1ecd iye \u00e0y\u00edpad\u00e0 highwater ZIMBRA.MAILBOX.CHANGE_CHECKPOINT ti \u00e0p\u00f3t\u00ed \u00ecme\u00e8l\u00ec s\u00edl\u1eb9\u0300.
zimbra_index_elasticsearch_url_base = URL \u00ecpil\u1eb9\u0300 REST API ElasticSearch.
zimbra_index_threads = Iw\u1ecdn ad\u00e1g\u00fan thread f\u00fan batch index.
zimbra_reindex_threads = N\u1ecd\u0301mb\u00e0 t\u00f3 p\u1ecd\u0300 j\u00f9 ti \u00e0w\u1ecdn thread f\u00fan re-index. A k\u00ec \u00ed ko \u00e0w\u1ecdn thread re-index j\u1ecd s\u00edn\u00fa ad\u00e1g\u00fan kan.
zimbra_index_disable_perf_counters = T\u00ed \u00f3 b\u00e1 j\u1eb9\u0301 false, Zimbra performance monitoring y\u00f3\u00f2 t\u1ecd\u0301pinpin IO \u00eck\u00e0 \u00e0ti \u00eck\u1ecd Lucene. Iye true kan m\u00e1a pa \u00e0b\u00f3j\u00fat\u00f3 IO Lucene.
zimbra_index_max_readers = N\u1ecd\u0301mb\u00e0 t\u00f3 p\u1ecd\u0300 j\u00f9 ti IndexReaders t\u00f3 l\u00e8 \u1e63i\u1e63\u1eb9\u0301 p\u1ecd\u0300 n\u00ed \u00e0k\u00f3k\u00f2 kan
zimbra_index_max_writers = N\u1ecd\u0301mb\u00e0 t\u00f3 p\u1ecd\u0300 j\u00f9 ti IndexWriters t\u00f3 l\u00e8 \u1e63i\u1e63\u1eb9\u0301 p\u1ecd\u0300 n\u00ed \u00e0k\u00f3k\u00f2 kan
zimbra_index_reader_cache_size = N\u1ecd\u0301mb\u00e0 t\u00f3 p\u1ecd\u0300 j\u00f9 ti IndexReaders n\u00edn\u00fa cache at\u1ecd\u0301ka \u00ec\u1e63\u00e0w\u00e1r\u00ed
zimbra_index_reader_cache_ttl = T\u00ed \u00f3 b\u00e1 d\u00far\u00f3 l\u00e1\u00ec\u1e63i\u1e63\u1eb9\u0301 ju iye y\u00ec\u00ed l\u1ecd, n\u00ed i\u1e63\u1eb9\u0301j\u00fa-aaya, y\u1ecd IndexReader n\u00e1\u00e0 k\u00far\u00f2 n\u00edn\u00fa cache
zimbra_index_deferred_items_failure_delay = L\u1eb9\u0301y\u00ecn \u00eck\u00f9n\u00e0 kan, \u00ecd\u00e1d\u00far\u00f3 k\u00e9ker\u00e9 j\u00f9, n\u00ed i\u1e63\u1eb9\u0301j\u00fa-aaya, l\u00e1\u00e0\u00e1r\u00edn \u00e0w\u1ecdn \u00ecgb\u00ecm\u1ecd\u0300 l\u00e1ti nu \u00ecl\u00e0 \u00e0w\u1ecdn ohun kan t\u00ed a k\u00f2 t\u00ed\u00ec t\u1ecd\u0301ka s\u00ed k\u00far\u00f2
zimbra_index_lucene_max_terms_per_query = \u1e62\u00e8t\u00f2 n\u1ecd\u0301mb\u00e0 t\u00f3 p\u1ecd\u0300 j\u00f9 ti \u00e0w\u1ecdn term t\u00ed a gba l\u00e1y\u00e8 n\u00edn\u00fa query k\u1ecd\u1ecdkan.
zimbra_index_max_transaction_bytes = N\u00edgb\u00e0 t\u00ed a b\u00e1 \u0144 ko \u00e0w\u1ecdn i\u1e63\u1eb9\u0301 index j\u1ecd s\u00edn\u00fa transaction Mailbox kan, \u00e8y\u00ed ni \u00e0pap\u1ecd\u0300 \u00ecw\u1ecd\u0300n t\u00f3 p\u1ecd\u0300 j\u00f9 ti \u00e0w\u1ecdn ohun kan t\u00ed a \u00f3 j\u1eb9\u0301 k\u00ed \u00f3 w\u00e0 n\u00edn\u00fa transaction kan \u1e63o\u1e63o.
zimbra_index_max_transaction_items = N\u00edgb\u00e0 t\u00ed a b\u00e1 \u0144 ko \u00e0w\u1ecdn i\u1e63\u1eb9\u0301 index j\u1ecd, \u00e8y\u00ed ni n\u1ecd\u0301mb\u00e0 t\u00f3 p\u1ecd\u0300 j\u00f9 ti mail_items t\u00ed a gba l\u00e1y\u00e8 n\u00edn\u00fa transaction kan \u1e63o\u1e63o.
zimbra_index_max_pending_deletes = N\u1ecd\u0301mb\u00e0 t\u00f3 p\u1ecd\u0300 j\u00f9 ti \u00e0w\u1ecdn \u00ecpar\u1eb9\u0301 index t\u00f3 \u0144 d\u00far\u00f3 k\u00ed a t\u00f3 gba \u00e0y\u00e8 disiki pad\u00e0
zimbra_index_lucene_merge_policy = true l\u00e1ti l\u00f2 LogDocMergePolicy, false l\u00e1ti l\u00f2 LogByteSizeMergePolicy. LogDocMergePolicy m\u00e1a \u0144 yan \u00e0w\u1ecdn segment l\u00e1ti darap\u1ecd\u0300 g\u1eb9\u0301g\u1eb9\u0301 b\u00ed iye document. LogByteSizeMergePolicy m\u00e1a \u0144 yan \u00e0w\u1ecdn segment l\u00e1ti darap\u1ecd\u0300 g\u1eb9\u0301g\u1eb9\u0301 b\u00ed \u00ecw\u1ecd\u0300n w\u1ecdn.
zimbra_index_lucene_min_merge = \u0143 \u1e63\u00e8t\u00f2 \u00ecw\u1ecd\u0300n merge k\u00e9ker\u00e9 j\u00f9 Lucene n\u00edn\u00fa Documents t\u00e0b\u00ed KB g\u1eb9\u0301g\u1eb9\u0301 b\u00ed merge policy t\u00ed a s\u1ecd n\u00edn\u00fa zimbra_index_lucene_merge_policy.
zimbra_index_lucene_max_merge = \u0143 \u1e63\u00e8t\u00f2 \u00ecw\u1ecd\u0300n merge t\u00f3 p\u1ecd\u0300 j\u00f9 f\u00fan Lucene n\u00edn\u00fa Documents t\u00e0b\u00ed KB g\u1eb9\u0301g\u1eb9\u0301 b\u00ed merge policy t\u00ed a s\u1ecd n\u00edn\u00fa zimbra_index_lucene_merge_policy. Iye y\u00ec\u00ed l\u00f3 \u0144 pinnu segment t\u00f3 t\u00f3bi j\u00f9 t\u00ed a l\u00e8 darap\u1ecd\u0300 m\u1ecd\u0301 \u00e0w\u1ecdn segment m\u00ec\u00edr\u00e0n.
zimbra_index_lucene_merge_factor = \u00d3 \u0144 s\u1ecd b\u00ed a \u1e63e m\u00e1a \u0144 darap\u1ecd\u0300 \u00e0w\u1ecdn at\u1ecd\u0301ka segment n\u00edpas\u1eb9\u0300 addDocument(). P\u1eb9\u0300l\u00fa \u00e0w\u1ecdn iye k\u00e9ker\u00e9, a m\u00e1a lo RAM d\u00ed\u1eb9\u0300 n\u00edgb\u00e0 at\u1ecd\u0301ka, \u00ec\u1e63\u00e0w\u00e1r\u00ed \u00e1 s\u00ec y\u00e1ra s\u00edi, \u1e63\u00f9gb\u1ecd\u0301n \u00ecy\u00e1ra at\u1ecd\u0301ka \u00e1 l\u1ecd d\u00ed\u1eb9\u0300. P\u1eb9\u0300l\u00fa \u00e0w\u1ecdn iye t\u00f3bi, a m\u00e1a lo RAM p\u00fap\u1ecd\u0300 s\u00edi n\u00edgb\u00e0 at\u1ecd\u0301ka, \u00e0ti b\u00ed \u00ec\u1e63\u00e0w\u00e1r\u00ed \u1e63e m\u00e1a l\u1ecd d\u00ed\u1eb9\u0300 ni, b\u1eb9\u0301\u1eb9\u0300 ni at\u1ecd\u0301ka \u00e1 y\u00e1ra s\u00edi. \u00c0w\u1ecdn iye t\u00f3bi (>10) d\u00e1ra j\u00f9 f\u00fan \u1e63\u00ed\u1e63e batch index, \u00e0w\u1ecdn iye k\u00e9ker\u00e9 (<10) s\u00ec dara f\u00fan \u00e0w\u1ecdn at\u1ecd\u0301ka t\u00ed a \u0144 t\u1ecd\u0301j\u00fa n\u00ed \u00ecb\u00e1nis\u1ecd\u0300r\u1ecd\u0300.
zimbra_index_lucene_term_index_divisor = \u00d3 \u0144 d\u00edn iye \u00e0w\u1ecdn term t\u00ed a ti t\u1ecd\u0301ka s\u00ed t\u00ed a \u0144 k\u00f3 s\u00edn\u00fa RAM k\u00f9 n\u00edpas\u1eb9\u0300 y\u00edyan d\u00ed\u1eb9\u0300 n\u00edn\u00fa w\u1ecdn. N\u00edpa \u1e63\u00ed\u1e63\u00e8t\u00f2 \u00e8y\u00ed s\u00ed iye kan t\u00f3 ju 1 l\u1ecd, o l\u00e8 d\u00edn l\u00edlo \u00ecr\u00e1nt\u00ed k\u00f9, \u1e63\u00f9gb\u1ecd\u0301n \u00ecdad\u00far\u00f3 m\u00e1a p\u1ecd\u0300 s\u00edi n\u00edgb\u00e0 t\u00ed a b\u00e1 \u0144 k\u00f3 \u00ecm\u1ecd\u0300 \u00ecgb\u00e0k\u1ecds\u00edl\u1eb9\u0300 t\u00ed a fi pam\u1ecd\u0301 f\u00fan term kan w\u1ecdl\u00e9.
zimbra_index_lucene_use_compound_file = true b\u00ed segment Lucene tuntun kan b\u00e1 y\u1eb9 k\u00ed \u00f3 lo compound file format. http://wiki.apache.org/lucene-java/ImproveIndexingSpeed s\u1ecd p\u00e9 k\u00ed a pa compound file format f\u00fan i\u1e63\u1eb9\u0301 t\u00f3 d\u00e1ra s\u00edi, \u1e63\u00f9gb\u1ecd\u0301n \u00e8y\u00ed y\u00f3\u00f2 m\u00fa k\u00ed n\u1ecd\u0301mb\u00e0 file descriptor p\u1ecd\u0300 gidigidi. File descriptor l\u00e8 t\u00e1n b\u00ed zimbra_index_lucene_merge_factor b\u00e1 t\u00f3bi.
zimbra_index_lucene_max_buffered_docs = \u00ccye document k\u00e9ker\u00e9 j\u00f9 t\u00ed a n\u00edl\u00f2 k\u00ed a t\u00f3 t\u00fa \u00e0w\u1ecdn document in\u00fa-\u00ecr\u00e1nt\u00ed t\u00ed a ti buffer s\u00edta g\u1eb9\u0301g\u1eb9\u0301 b\u00ed segment tuntun. \u00c0w\u1ecdn iye t\u00f3bi s\u00e1b\u00e0 m\u00e1a \u0144 m\u00fa k\u00ed at\u1ecd\u0301ka yara s\u00edi.
zimbra_index_lucene_ram_buffer_size_kb = RAM buffer t\u00f3 p\u1ecd\u0300 j\u00f9 f\u00fan Lucene n\u00ed KB
zimbra_index_lucene_io_impl = \u00ccm\u00fal\u00f2 Lucene FSDirectory t\u00ed a l\u00f2 f\u00fan indexing IO. \u00c0w\u1ecdn iye t\u00f3 \u1e63e\u00e9 \u1e63e ni nio - l\u00f2 NIOFSDirectory. \u00d3 \u0144 lo positional io ti FileChannel inu java.nio n\u00edgb\u00e0 \u00eck\u00e0 k\u00ed a l\u00e8 y\u00e0g\u00f2 f\u00fan synchronization n\u00edgb\u00e0 t\u00ed a b\u00e1 \u0144 ka l\u00e1ti f\u00e1\u00ecl\u00ec kan n\u00e1\u00e0. mmap - l\u00f2 MMapDirectory. \u00d3 \u0144 lo memory-mapped IO n\u00edgb\u00e0 \u00eck\u00e0. \u00d3 j\u1eb9\u0301 y\u00edyan t\u00f3 d\u00e1ra b\u00ed virtual memory b\u00e1 p\u1ecd\u0300 t\u00f3 n\u00ed \u00ecfiw\u00e9ra p\u1eb9\u0300l\u00fa \u00ecw\u1ecd\u0300n index. simple - l\u00f2 SimpleFSDirectory. \u00d3 \u0144 lo java.io.RandomAccessFile. I\u1e63\u1eb9\u0301 r\u1eb9 k\u00ec \u00ed d\u00e1ra n\u00ed i\u1e63\u1eb9\u0301 p\u1ecd\u0300 n\u00edtor\u00ed \u00f3 m\u00e1a \u0144 \u1e63e synchronization n\u00edgb\u00e0 t\u00ed \u1ecd\u0300p\u1ecd\u0300 thread b\u00e1 \u0144 ka f\u00e1\u00ecl\u00ec kan n\u00e1\u00e0. T\u00ed a k\u00f2 b\u00e1 p\u00e8s\u00e8 iye kan, FSDirectory y\u00f3\u00f2 yan \u00ecm\u00fal\u00f2 t\u00f3 d\u00e1ra j\u00f9 f\u00fan \u00e0y\u00edk\u00e1 n\u00e1\u00e0.
zimbra_index_rfc822address_max_token_count = \u00ccye token t\u00f3 p\u1ecd\u0300 j\u00f9 f\u00fan \u00e0w\u1ecdn \u00e0d\u00edr\u1eb9\u0301s\u00ec n\u00edn\u00fa token stream \u00e0d\u00edr\u1eb9\u0301s\u00ec RFC822. \u00c0\u00e0l\u00e0 n\u00e1\u00e0 kan gbogbo FROM, TO, \u00e0ti CC headers f\u00fan \u00e0w\u1ecdn imeeli, gbogbo \u00e0w\u1ecdn \u00e0d\u00edr\u1eb9\u0301s\u00ec imeeli f\u00fan Contacts, \u00e0ti p\u00e1p\u00e1 Creator f\u00fan Documents.
zimbra_index_rfc822address_max_token_length = G\u00edg\u00f9n token t\u00f3 p\u1ecd\u0300 j\u00f9 f\u00fan \u00e0d\u00edr\u1eb9\u0301s\u00ec kan n\u00edn\u00fa token stream \u00e0d\u00edr\u1eb9\u0301s\u00ec RFC822. \u00c0\u00e0l\u00e0 n\u00e1\u00e0 kan gbogbo FROM, TO, \u00e0ti CC headers f\u00fan \u00e0w\u1ecdn imeeli, gbogbo \u00e0w\u1ecdn \u00e0d\u00edr\u1eb9\u0301s\u00ec imeeli f\u00fan Contacts, \u00e0ti p\u00e1p\u00e1 Creator f\u00fan Documents.
zimbra_index_wildcard_max_terms_expanded = \u00ccgb\u00f2\u00f2r\u00f2 wildcard t\u00f3 p\u1ecd\u0300 j\u00f9 f\u00fan term k\u1ecd\u0300\u1ecd\u0300kan n\u00edn\u00fa query.
zimbra_galsync_index_reader_cache_size = N\u1ecd\u0301mb\u00e0 t\u00f3 p\u1ecd\u0300 j\u00f9 ti IndexReaders n\u00edn\u00fa cache at\u1ecd\u0301ka \u00ec\u1e63\u00e0w\u00e1r\u00ed GAL. A \u0144 fi cache at\u1ecd\u0301ka Lucene f\u00fan \u00e0k\u00e1\u01f9t\u00ec GAL sync pam\u1ecd\u0301 l\u1ecd\u0301t\u1ecd\u0300 p\u1eb9\u0300l\u00fa \u00e0\u00ecn\u00ed yiy\u1ecd laif\u1ecdw\u1ecd\u0301yi.
zimbra_spam_report_queue_size = F\u00fan \u00e0w\u1ecdn Junk/Not Junk Msg/ConvActionRequests, \u00ecw\u1ecd\u0300n queue y\u00ec\u00ed l\u00f3 \u0144 fi \u00e0\u00e0l\u00e0 s\u00ed workqueue olupin f\u00fan \u1e63i\u1e63\u00e8t\u00f2 \u00e0w\u1ecdn forward.
zimbra_throttle_op_concurrency = \u00c0t\u00f2j\u1ecd iye concurrency t\u00ed a y\u00e0 p\u1eb9\u0300l\u00fa koma f\u00fan \u1ecdk\u1ecd\u1ecdkan n\u00edn\u00fa \u00e0w\u1ecdn ipele \u00e0k\u1ecd\u0301k\u1ecd\u0301 mar\u00fan-\u00fan, l\u00e1ti ipele t\u00f3 ga j\u00f9 s\u00ed ti k\u00e9r\u00e9 j\u00f9.
zimbra_im_chat_flush_time = B\u00ed a \u1e63e m\u00e1a \u0144 k\u1ecd \u00e0w\u1ecdn \u00ecj\u00edr\u00f2r\u00f2 IM \u1e63\u00ed\u1e63i s\u00ed store l\u00e9ral\u00e9ra, n\u00ed i\u1e63\u1eb9\u0301j\u00fa-aaya.
zimbra_im_chat_close_time = B\u00ed olupin \u1e63e m\u00e1a d\u00far\u00f3 p\u1eb9\u0301 t\u00f3, n\u00ed i\u1e63\u1eb9\u0301j\u00fa-aaya, k\u00ed \u00f3 t\u00f3 pa \u00e0w\u1ecdn session \u00ecj\u00edr\u00f2r\u00f2 IM t\u00ed k\u00f2 \u1e63i\u1e63\u1eb9\u0301 m\u1ecd\u0301.
zimbra_http_originating_ip_header = HTTP header t\u00ed a m\u00e1a wo l\u00e1ti m\u1ecd \u00e0d\u00edr\u1eb9\u0301s\u00ec IP \u00e0k\u1ecd\u0301k\u1ecd\u0301 ti kli\u1eb9nti.
zimbra_session_limit_imap = N\u1ecd\u0301mb\u00e0 t\u00f3 p\u1ecd\u0300 j\u00f9 ti \u00e0w\u1ecdn f\u00f3ld\u00e0 IMAP t\u00ed ol\u00f9l\u00f2 kan l\u00e8 \u1e63\u00ed n\u00ed \u1eb9\u1eb9kan.
zimbra_session_limit_admin = N\u1ecd\u0301mb\u00e0 t\u00f3 p\u1ecd\u0300 j\u00f9 ti \u00e0w\u1ecdn session SOAP admin t\u00ed ol\u00f9l\u00f2 kan l\u00e8 \u1e63\u00ed n\u00ed \u1eb9\u1eb9kan.
