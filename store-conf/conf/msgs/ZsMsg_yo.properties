passwordExpiryNotifierBodyText = Ol\u00f9f\u1eb9\u0301 {0},\n\n\u1ecc\u0300r\u1ecd\u0300\u00ecpam\u1ecd\u0301 \u00e0k\u00e1\u01f9t\u00ec r\u1eb9 m\u00e1a par\u00ed n\u00ed \u1eccj\u1ecd\u0301 {1}, n\u00ed {2}.\n\nL\u00e1ti pa \u00e0y\u00e8 \u00ecw\u1ecdl\u00e9 s\u00ed \u00e0k\u00e1\u01f9t\u00ec r\u1eb9 m\u1ecd\u0301, j\u1ecd\u0300w\u1ecd\u0301 t\u00fan \u1ecd\u0300r\u1ecd\u0300\u00ecpam\u1ecd\u0301 r\u1eb9 \u1e63e k\u00ed \u1ecdj\u1ecd\u0301 ipari t\u00f3 d\u00e9.\n\nW\u00e0\u00e1 m\u00e1a gba \u00e0w\u1ecdn \u00ecfit\u00f3nil\u00e9t\u00ed l\u00f3jooj\u00fam\u1ecd\u0301 t\u00edt\u00ed t\u00ed a \u00f3 fi y\u00ed \u1ecd\u0300r\u1ecd\u0300\u00ecpam\u1ecd\u0301 n\u00e1\u00e0 pad\u00e0 t\u00e0b\u00ed t\u00ed y\u00f3\u00f2 fi par\u00ed.\n\n\u00c8y\u00ed j\u1eb9\u0301 \u00ecfit\u00f3nil\u00e9t\u00ed \u00edme\u00e8l\u00ec al\u00e1d\u00e0\u00e1\u1e63i\u1e63\u1eb9\u0301.
passwordExpiryNotifierBodyHtml = <p>Ol\u00f9f\u1eb9\u0301 {0},</p><p>\u1ecc\u0300r\u1ecd\u0300\u00ecpam\u1ecd\u0301 \u00e0k\u00e1\u01f9t\u00ec r\u1eb9 m\u00e1a par\u00ed n\u00ed <strong>\u1eccj\u1ecd\u0301 {1}</strong>, n\u00ed <strong>{2}</strong>.</p><p>L\u00e1ti pa \u00e0y\u00e8 \u00ecw\u1ecdl\u00e9 s\u00ed \u00e0k\u00e1\u01f9t\u00ec r\u1eb9 m\u1ecd\u0301, j\u1ecd\u0300w\u1ecd\u0301 t\u00fan \u1ecd\u0300r\u1ecd\u0300\u00ecpam\u1ecd\u0301 r\u1eb9 \u1e63e k\u00ed \u1ecdj\u1ecd\u0301 ipari t\u00f3 d\u00e9.</p><p>W\u00e0\u00e1 m\u00e1a gba \u00e0w\u1ecdn \u00ecfit\u00f3nil\u00e9t\u00ed l\u00f3jooj\u00fam\u1ecd\u0301 t\u00edt\u00ed t\u00ed a \u00f3 fi y\u00ed \u1ecd\u0300r\u1ecd\u0300\u00ecpam\u1ecd\u0301 n\u00e1\u00e0 pad\u00e0 t\u00e0b\u00ed t\u00ed y\u00f3\u00f2 fi par\u00ed.</p><p>\u00c8y\u00ed j\u1eb9\u0301 \u00ecfit\u00f3nil\u00e9t\u00ed \u00edme\u00e8l\u00ec al\u00e1d\u00e0\u00e1\u1e63i\u1e63\u1eb9\u0301.</p>
