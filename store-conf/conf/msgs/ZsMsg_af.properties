zimbra_mysql_shutdown_timeout = Tyd om te wag dat die posbus-MySQL/MariaDB-proses afsluit. Verhoog die wagtyd as mysql.server te lank neem om die proses af te sluit.
zimbra_mysql_user = MySQL-gebruikersnaam om te gebruik om zimbra-databasisse en -tabelle te skep of toegang daartoe te verkry. Dit is die waarde wat jy aan die '-u'-opsie van die 'mysql'-opdragre\u00eblprogram sou gee.
zimbra_mysql_password = Wagwoord vir zimbra_mysql_user. Dit word in local config gestoor sodat die store-toepassing kan verifieer. As jy hierdie wagwoord wil verander, gebruik asseblief die zmmypasswd-program, wat die wagwoord in sowel MySQL as local config sal verander.
zimbra_ldap_userdn = LDAP-dn wat gebruik word om die store-toepassing by LDAP te verifieer.
zimbra_ldap_user = zimbra-gebruikersnaam wat gebruik word om met admin AuthRequest te verifieer.
zimbra_ldap_password = Wagwoord vir zimbra_ldap_userdn. Dit word in local config gestoor sodat die store-toepassing kan verifieer. As jy hierdie wagwoord wil verander, gebruik asseblief die zmldappasswd-program, wat die wagwoord in sowel LDAP as local config sal verander.
zimbra_server_hostname = Die voorsiene naam van hierdie bediener. Daar behoort n ooreenstemmende \u2018server\u2019-inskrywing in LDAP te bestaan - raadpleeg die dokumentasie vir die CreateServer-opdrag van die zmprov-program.
zimbra_user = Die zimbra-unix-gebruiker waarna die zimbra-bedienerproses voorregte moet oorskakel nadat dit aan bevoorregte poorte gebind het.
zimbra_uid = Die zimbra-unix-uid waarna die zimbra-bedienerproses voorregte moet oorskakel nadat dit aan bevoorregte poorte gebind het.
zimbra_gid = Die zimbra-unix-gid waarna die zimbra-bedienerproses voorregte moet oorskakel nadat dit aan bevoorregte poorte gebind het.
zimbra_log4j_properties = Pad na log4j-konfigurasie-eienskappel\u00eaer.
zimbra_log4j_properties_watch = Moniteringsinterval vir die log4j-konfigurasie-eienskappel\u00eaer in ms.
zimbra_attrs_directory = Gids wat *.xml-l\u00eaers bevat wat die sintaksis spesifiseer vir LDAP-eienskappe wat deur die stelsel gebruik word
localized_msgs_directory = Gids vir gelokaliseerde boodskapl\u00eaers.
localized_client_msgs_directory = Gids vir gelokaliseerde kli\u00ebntboodskapl\u00eaers.
skins_directory = Gids vir skins.
zimbra_store_sweeper_max_age = L\u00eaers ouer as soveel minute word outomaties uit die store-inkomende gids geskrap.
zimbra_store_copy_buffer_size_kb = L\u00eaerkopieerbewerkings gebruik buffers van hierdie grootte
zimbra_mailbox_galsync_cache = Stel die maksimum galsync-posbuskontakitemkas. Stel die waarde op minstens die aantal kontakitems in die galsync-posbus.
zimbra_mailbox_manager_hardref_cache = Die maksimum aantal posbusse wat in geheue vasgepen sal word voordat die posbusbestuurder toelaat dat hulle deur SoftReference-vullisversameling opgeruim word.
zimbra_mailbox_active_cache = Die maksimum grootte van 'n posbus se interne LRU-itemkas wanneer daar aktiewe sessies is.
zimbra_mailbox_inactive_cache = Die maksimum grootte van 'n posbus se interne LRU-itemkas wanneer dit geen aktiewe sessies het nie.
zimbra_mailbox_change_checkpoint_frequency = Die frekwensie (in aantal veranderinge) waarteen 'n posbus se ZIMBRA.MAILBOX.CHANGE_CHECKPOINT-highwater-veranderingswaarde geskryf word.
zimbra_index_elasticsearch_url_base = ElasticSearch REST API-basis-URL.
zimbra_index_threads = Draadswembadgrootte vir bondelindeksering
zimbra_reindex_threads = Maksimum aantal drade vir herindeksering. Herindekseringsdrade word nie saamgevoeg nie.
zimbra_index_disable_perf_counters = As dit false is, word Lucene-lees- en skryf-IO deur Zimbra-prestasiemonitering dopgehou. 'n true-waarde deaktiveer Lucene-IO-monitering.
zimbra_index_max_readers = Maksimum aantal gelyktydige IndexReaders
zimbra_index_max_writers = Maksimum aantal gelyktydige IndexWriters
zimbra_index_reader_cache_size = Maksimum aantal IndexReaders in die soekindekskas
zimbra_index_reader_cache_ttl = As dit langer as hierdie waarde (sekondes) ledig is, verwyder die IndexReader uit die kas
zimbra_index_deferred_items_failure_delay = Na 'n mislukking, die minimum vertraging (sekondes) tussen pogings om die tou van onge\u00efndekseerde (uitgestelde) items skoon te maak
zimbra_index_lucene_max_terms_per_query = Stel die maksimum aantal terme wat per navraag toegelaat word.
zimbra_index_max_transaction_bytes = Wanneer indeksbewerkings in 'n Mailbox-transaksie gebondel word, die maksimum totale grootte van items wat ons in 'n enkele transaksie sal toelaat
zimbra_index_max_transaction_items = Wanneer indeksbewerkings gebondel word, die maksimum aantal mail_items wat ons in 'n enkele transaksie toelaat
zimbra_index_max_pending_deletes = Maksimum aantal hangende indeks-skraps voordat die skyfspasie teruggewin word
zimbra_index_lucene_merge_policy = true om LogDocMergePolicy te gebruik, false om LogByteSizeMergePolicy te gebruik. LogDocMergePolicy kies segmente om saam te voeg op grond van die aantal dokumente. LogByteSizeMergePolicy kies segmente om saam te voeg op grond van hulle grootte.
zimbra_index_lucene_min_merge = Stel die Lucene minimum saamvoeggrootte in Documents of KB, afhangende van die saamvoegbeleid wat in zimbra_index_lucene_merge_policy gespesifiseer is.
zimbra_index_lucene_max_merge = Stel die Lucene maksimum saamvoeggrootte in Documents of KB, afhangende van die saamvoegbeleid wat in zimbra_index_lucene_merge_policy gespesifiseer is. Hierdie waarde bepaal die grootste segment wat met ander segmente saamgevoeg kan word.
zimbra_index_lucene_merge_factor = Hoe gereeld segmentindekse deur addDocument() saamgevoeg word. Met kleiner waardes word minder RAM tydens indeksering gebruik en is soektogte vinniger, maar indeksering is stadiger. Met groter waardes word meer RAM tydens indeksering gebruik en, hoewel soektogte stadiger is, is indeksering vinniger. Groter waardes (>10) is die beste vir bondelindeksskepping, en kleiner waardes (<10) vir indekse wat interaktief in stand gehou word.
zimbra_index_lucene_term_index_divisor = Neem 'n submonster van watter ge\u00efndekseerde terme in RAM gelaai word. Deur dit op 'n waarde > 1 te stel kan jy geheuegebruik verminder ten koste van ho\u00ebr latensie wanneer die rekordinligting wat vir 'n term gestoor is, gelaai word.
zimbra_index_lucene_use_compound_file = true as 'n nuwe Lucene-segment die compound file format moet gebruik. http://wiki.apache.org/lucene-java/ImproveIndexingSpeed s\u00ea dat compound file format afgeskakel moet word vir beter werkverrigting, maar dit sal die aantal l\u00eaerbeskrywers aansienlik verhoog. L\u00eaerbeskrywers kan uitgeput raak as zimbra_index_lucene_merge_factor groot is.
zimbra_index_lucene_max_buffered_docs = Die minimum aantal dokumente wat vereis word voordat die gebufferde in-geheue-dokumente as 'n nuwe segment uitgeskryf word. Groot waardes gee oor die algemeen vinniger indeksering.
zimbra_index_lucene_ram_buffer_size_kb = Lucene maksimum gebufferde RAM in KB
zimbra_index_lucene_io_impl = Lucene FSDirectory-implementering wat vir indekserings-IO gebruik word. Moontlike waardes nio - Gebruik NIOFSDirectory. Gebruik java.nio se FileChannel se posisionele io wanneer gelees word om sinchronisasie te vermy wanneer uit dieselfde l\u00eaer gelees word. mmap - Gebruik MMapDirectory. Gebruik memory-mapped IO wanneer gelees word. 'n Goeie keuse as daar volop virtuele geheue relatief tot indeksgrootte is. simple - Gebruik SimpleFSDirectory. Gebruik java.io.RandomAccessFile. Dit het swak gelyktydige werkverrigting omdat dit sinchroniseer wanneer verskeie drade dieselfde l\u00eaer lees. As geen waarde verskaf word nie, sal FSDirectory die beste implementering vir die omgewing kies.
zimbra_index_rfc822address_max_token_count = Die maksimum aantal tokens van adresse in die RFC822-adrestokenstroom. Die limiet geld vir alle FROM-, TO- en CC-kopskrifte vir e-posse, alle e-posadresse vir Kontakte en die Creator-veld vir Documents.
zimbra_index_rfc822address_max_token_length = Die maksimum tokenlengte vir n adres in die RFC822-adrestokenstroom. Die limiet geld vir alle FROM-, TO- en CC-kopskrifte vir e-posse, alle e-posadresse vir Kontakte en die Creator-veld vir Documents.
zimbra_index_wildcard_max_terms_expanded = Maksimum jokeruitbreidings vir elke individuele term in die navraag.
zimbra_galsync_index_reader_cache_size = Die maksimum aantal IndexReaders in die GAL-soekindekskas. Die GAL-sync-rekening se Lucene-indeks word apart gekas sonder outomatiese verwydering.
zimbra_spam_report_queue_size = Vir Gemors/Nie Gemors Msg/ConvActionRequests beperk hierdie tougrootte die bedienerwerkry vir die verwerking van die aansturings.
zimbra_throttle_op_concurrency = Komma-geskeide lys van gelyktydigheidswaardes vir elk van die 5 prioriteitsvlakke in volgorde van hoogste na laagste prioriteit
zimbra_im_chat_flush_time = Hoe gereeld (sekondes) oop IM-kletse na die store geskryf word
zimbra_im_chat_close_time = Hoe lank (sekondes) die bediener sal wag om ledige IM-kletsessies te sluit
zimbra_http_originating_ip_header = HTTP-kopskrif waarna gekyk moet word om die oorspronklike IP-adres van die kli\u00ebnt te bepaal
zimbra_session_limit_imap = Maksimum aantal IMAP-gidse wat 'n enkele gebruiker tegelyk oop kan h\u00ea
zimbra_session_limit_admin = Maksimum aantal admin-SOAP-sessies wat 'n enkele gebruiker tegelyk oop kan h\u00ea
zimbra_session_limit_soap = Maksimum aantal aktiewe soap-sessies per rekening. Verhoog hierdie waarde versigtig om "Too many SOAP sessions\u201d-foute in mailbox.log te vermy.
zimbra_session_limit_sync = Maksimum aantal per-sessie-sinkroniseringluisteraars vir ActiveSync. Verhoog hierdie waarde versigtig om "Too many SYNCLISTENER sessions"-foute in sync.log te vermy.
zimbra_session_timeout_soap = Ledige wagtyd (in sekondes) vir SOAP-sessies
zimbra_session_max_pending_notifications = Maksimum aantal hangende kennisgewings wat in 'n SOAP-sessie in 'n tou geplaas kan word voordat die tou skoongemaak word en die kli\u00ebnt meegedeel word dat hul toestand ongeldig is
zimbra_converter_enabled_uuencode = Of die UUENCODE-dekodeerder uitgevoer word wanneer boodskappe uit die store ontleed word
zimbra_converter_enabled_tnef = Of die TNEF-dekodeerder uitgevoer word wanneer boodskappe uit die store ontleed word
zimbra_converter_depth_max = Rekursiewe MIME-deeldiepte waaronder omsetters nie sal optree nie
zimbra_ssl_enabled = Of die ssl-sleutelbewaarplek gelaai moet word of nie
stats_img_folder = Gids vir die berging van gegenereerde statistiekbeelde.
ldap_host = LDAP-gasheer om te gebruik. Verouderd - gebruik asseblief eerder ldap_url.
ldap_log_level = LDAP-logvlak
ldap_port = LDAP-poort om te gebruik. Verouderd - gebruik asseblief eerder ldap_url.
ldap_url = Lys van LDAP-bedieners vir gebruik deur hierdie bediener.
ldap_master_url = URL na die LDAP-hoofbediener.
ldap_is_master = Is hierdie gasheer die hoof-LDAP-bediener?
ldap_root_password = Wagwoord vir LDAP slapd.conf rootdn.  Gerieflikheidshalwe word 'n ewekansige wagwoord tydens LDAP-inisialisering gegenereer, in local config en in slapd.conf gestoor.  As jy hierdie wagwoord wil verander, gebruik asseblief die zmldappasswd-program, wat die wagwoord in sowel slapd.conf as local config sal verander.
ldap_connect_timeout = Millisekondes waarna 'n verbindingspoging gestaak word.
ldap_read_timeout = Millisekondes waarna 'n leespoging gestaak word.
ldap_deref_aliases = Of aliasse gedereferensieer moet word terwyl daar in 'n eksterne gids gesoek of daaraan gebind word. Geldige waardes is: always, never, finding, searching
ldap_connect_pool_master = Of JNDI-verbindingspoele vir die LDAP-hoofbediener gebruik moet word.
ldap_connect_pool_debug = Of LDAP-verbindingspoele ontfout moet word.
ldap_connect_pool_initsize = Aanvanklike aantal aktiewe LDAP-verbindings om na op te skaal.
ldap_connect_pool_maxsize = Maksimum aantal aktiewe en ledige LDAP-verbindings wat toegelaat word.
ldap_connect_pool_prefsize = Voorkeuraantal LDAP-verbindings - om sowel maxsize as prefsize op dieselfde waarde te stel, hou die verbindingspoel op 'n vaste grootte.
ldap_connect_pool_timeout = Millisekondes van ledige tyd voordat 'n ledige verbinding uit die poel verwyder word.
ldap_connect_pool_health_check_on_checkout_enabled = Of die gesondheidstoets van die verbindingspoel uitgevoer sal word wanneer 'n verbinding vir gebruik uitgeboek word. As OnCheckout-gesondheidstoets geaktiveer is, sal periodieke agtergrondgesondheidstoets gedeaktiveer word.
ldap_connect_pool_health_check_interval_millis = Tydsduur in millisekondes tussen periodieke agtergrondgesondheidstoetse op die beskikbare verbindings in die verbindingspoel.
ldap_connect_pool_health_check_max_response_time_millis = Die maksimum tydsduur in millisekondes wat toegelaat moet word vir die gesondheidstoetsreaksie om van die LDAP-bediener terug te kom.
ldap_replication_password = Wagwoord wat deur die syncrepl-gebruiker gebruik word om by die ldap-hoofbediener te verifieer.
ldap_postfix_password = Wagwoord wat deur postfix gebruik word om by ldap te verifieer.
ldap_amavis_password = Wagwoord wat deur amavis gebruik word om by ldap te verifieer.
ldap_starttls_supported = Of die LDAP-bediener die startTLS-bewerking ondersteun.
ldap_require_tls = Of TLS vir LDAP-kli\u00ebnte vereis word.
ldap_cache_account_maxsize = Maksimum aantal rekeningobjekte om te kas.
ldap_cache_account_maxage = Maksimum ouderdom (in minute) van rekeningobjekte in die kas.
ldap_cache_cos_maxsize = Maksimum aantal cos-objekte om te kas.
ldap_cache_cos_maxage = Maksimum ouderdom (in minute) van cos-objekte in die kas.
ldap_cache_domain_maxsize = Maksimum aantal domeinobjekte om te kas
ldap_cache_domain_maxage = Maksimum ouderdom (in minute) van domeinobjekte in die kas.
ldap_cache_mime_maxage = Maksimum ouderdom, in minute, van MIME-objekte in die kas.
ldap_cache_server_maxsize = Maksimum aantal bedienerobjekte om te kas
ldap_cache_server_maxage = Maksimum ouderdom (in minute) van groepsobjekte in die kas.
ldap_cache_share_locator_maxsize = Maksimum rekeningitems in die benoemde-inskrywingskas.
ldap_cache_share_locator_maxage = Benoemde-inskrywingskas-TTL in minute.
ldap_cache_timezone_maxsize = Maksimum aantal tydsone-objekte om te kas.
ldap_cache_zimlet_maxsize = Maksimum aantal Zimlet-objekte om te kas.
ldap_cache_zimlet_maxage = Maksimum ouderdom (in minute) van Zimlet-objekte in die kas.
ldap_cache_custom_dynamic_group_membership_maxage_ms = Maksimum ouderdom (in millisekondes) om te kas van watter dinamiese groepe 'n rekening lid is vir daardie groepe waarvan die lidmaatskap met 'n pasgemaakte MemberURL bepaal word.
csrf_filter_domain_allowed_ref_hosts_max_size = Maksimum aantal domeininskrywings in die CsrfFilter per-domein allowedRefererHosts-kas. Val terug na ldap_cache_domain_maxsize by ontleedfout.
csrf_filter_domain_allowed_ref_hosts_cache_expiry_mins = Maksimum ouderdom (in minute) van inskrywings in die CsrfFilter per-domein allowedRefererHosts-kas. N\u00e1 verval word die inskrywing verwyder en met die volgende versoek weer vanaf LDAP gelaai. Val terug na 60 minute by ontleedfout.
mysql_directory = Ligging van MySQL-installasie.
mysql_data_directory = Gids waarin MySQL-data moet wees.
mysql_errlogfile = MySQL/MariaDB-foutlog.
mysql_socket = Pad na MySQL-sok vir gebruik deur MySQL-opdragre\u00eblnutsgoed.
mysql_pidfile = L\u00eaer waarin die MySQL-proses-ID gestoor word.
mysql_mycnf = Pad na my.cnf, die MySQL-konfigurasiel\u00eaer.
mysql_bind_address = Koppelvlak op hierdie gasheer waaraan MySQL sal bind.
mysql_port = Poortnommer waarop die MySQL-bediener moet luister.
mysql_root_password = Wagwoord vir MySQL se ingeboude \u2018root\u2019-gebruiker, nie te verwar met die UNIX-root-aanmelding nie.  Gerieflikheidshalwe word n ewekansige wagwoord tydens databasisiinisi\u00ebring gegenereer, in local config en in MySQL gestoor.  As jy hierdie wagwoord wil verander, gebruik asseblief die zmmypasswd-program, wat die wagwoord in sowel MySQL as local config sal verander.
mysql_memory_percent = Persentasie stelselgeheue wat mysql moet gebruik. Hierdie waarde word hier gestoor vir gebruik deur die zmmycnf-program. Die verandering van hierdie instelling word nie onmiddellik in die MySQL-bediener weerspie\u00ebl nie. Jy sal, met die grootste omsigtigheid, my.cnf weer moet genereer en die MySQL-bediener herbegin voordat die verandering van krag word.
mysql_innodb_log_buffer_size = Raadpleeg MySQL-dokumentasie vir innodb_log_buffer_size. Hierdie waarde word hier gestoor vir gebruik deur die zmmycnf-program. Die verandering van hierdie instelling word nie onmiddellik in die MySQL-bediener weerspie\u00ebl nie. Jy sal, met die grootste omsigtigheid, my.cnf weer moet genereer en die MySQL-bediener herbegin voordat die verandering van krag word.
mysql_innodb_log_file_size = Raadpleeg MySQL-dokumentasie vir innodb_log_file_size. Hierdie waarde word hier gestoor vir gebruik deur die zmmycnf-program. Die verandering van hierdie instelling word nie onmiddellik in die MySQL-bediener weerspie\u00ebl nie. Jy sal, met die grootste omsigtigheid, my.cnf weer moet genereer en die MySQL-bediener herbegin voordat die verandering van krag word.
mysql_sort_buffer_size = Raadpleeg MySQL-dokumentasie vir sort_buffer_size. Hierdie waarde word hier gestoor vir gebruik deur die zmmycnf-program. Die verandering van hierdie instelling word nie onmiddellik in die MySQL-bediener weerspie\u00ebl nie. Jy sal, met die grootste omsigtigheid, my.cnf weer moet genereer en die MySQL-bediener herbegin voordat die verandering van krag word.
mysql_read_buffer_size = Raadpleeg MySQL-dokumentasie vir read_buffer_size. Hierdie waarde word hier gestoor vir gebruik deur die zmmycnf-program. Die verandering van hierdie instelling word nie onmiddellik in die MySQL-bediener weerspie\u00ebl nie. Jy sal, met die grootste omsigtigheid, my.cnf weer moet genereer en die MySQL-bediener herbegin voordat die verandering van krag word.
mysql_backup_retention = Aantal weergawes van die mysql-databasisrugsteun om te behou.
antispam_mysql_enabled = Gebruik mysql-databasis vir antispam.  False by verstek.
antispam_backup_retention = Aantal weergawes van die antispam-databasisrugsteun om te behou.
derby_properties = Pad na derby-konfigurasie-eienskappel\u00eaer.
imap_max_consecutive_error = Indien groter as 0, laat val die IMAP-verbinding as die waarde imap_max_consecutive_error bereik word.
imap_inactive_session_cache_size = Ehcache: die maksimum aantal onaktiewe IMAP-kasinskrywings op skyf voor uitsetting.
imap_use_ehcache = Indien waar, gebruik Ehcache vir IMAP-sessiekasberging. Andersins, gebruik skyfkas.
imap_write_timeout = Stel die skryftime-out vir die IMAP-sessie (nio).
imap_write_chunk_size = Grootte in grepe van die IMAP-skryfbuffer.
imap_thread_keep_alive_time = Verstekduur, in sekondes, vir 'n IMAP-draad.
imap_throttle_ip_limit = Indien groter as 0, maksimum IMAP-versoeke/sekonde per IP.
imap_throttle_acct_limit = Indien groter as 0, maksimum IMAP-versoeke/sekonde per rekening.
