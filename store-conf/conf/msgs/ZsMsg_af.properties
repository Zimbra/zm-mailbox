mailboxd_thread_stack_size = Draadstapelgrootte vir Mailboxd
ssl_allow_untrusted_certs = Indien waar, laat selfondertekende SSL-sertifikate toe.
zimlet_directory = Pad na ge\u00efnstalleerde Zimlets.
calendar_outlook_compatible_allday_events = Gebruik Outlook-versoenbare heeldaggebeurtenisse. Vals by verstek.
