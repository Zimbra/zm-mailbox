imap_ehcache_heap_size = Maksimum aantal IMAP-kasinskrywings wat in die Ehcache-heapvlak gestoor word.
imap_ehcache_skip_large_folder = Slaan kasberging van groot IMAP-gidse in Ehcache oor wanneer dit geaktiveer is.
imap_ehcache_folder_max_message_count = Boodskapteldrempel waarbo IMAP-gidse nie in Ehcache gekas word nie. 
nio_imap_enabled = Indien waar, aktiveer Jetty nieblokkende IO vir IMAP.
nio_pop3_enabled = Indien waar, aktiveer Jetty nieblokkende IO vir POP3.
postfix_mail_owner = postfix_mail_owner
postfix_setgid_group = postfix_setgid_group
postfix_version = postfix_version
mailboxd_directory = Ligging van die mailboxd-installasie.
mailboxd_java_heap_size = Aantal megagrepe wat as die maksimum Java-heapgrootte (-Xmx) van die JVM wat Mailboxd uitvoer, gebruik moet word.
