licenseFeaureOnHoldNotifierBodyText = Die gelisensieerde aantal rekeninge is vir die volgende kenmerke bereik of oorskry:\n{0}\nJy kan \u00f3f die gebruik deur bestaande gebruikers verminder \u00f3f die lisensielimiet vir die kenmerk verhoog.\n\nOm die lisensielimiet vir die kenmerk te verhoog, kontak asseblief Zimbra Sales by sales@zimbra.com.\nOm toekenning van rekeningkenmerke te bestuur, meld asseblief by die Admin Portal aan.\n\nLet asseblief op die volgende:\n1. Jy sal voortgaan om die kennisgewing vir {1,number,integer} dae vanaf die datum van gebruiksoorskryding te ontvang.\n2. Jy sal nie die oorbenutte kenmerk vir enige rekeninge kan aktiveer nie.\n3. As jy geen aksie oor die oorbenutte kenmerk neem nie, sal die kenmerk vir die gebruikers gedeaktiveer word om dit onder die gelisensieerde limiet te bring.\n\nGroete,\nZimbra Support
licenseFeaureOnHoldNotifierBodyHtml = <div style="font-family:sans-serif;">Die gelisensieerde aantal rekeninge is vir die volgende kenmerke bereik of oorskry:<br>{0}<br>Jy kan \u00f3f die gebruik deur bestaande gebruikers verminder \u00f3f die lisensielimiet vir die kenmerk verhoog.<br><br>Om die lisensielimiet vir die kenmerk te verhoog, kontak asseblief Zimbra Sales by <b>sales@zimbra.com</b>.<br>Om toekenning van rekeningkenmerke te bestuur, meld asseblief by die Admin Portal aan.<br><br>Let asseblief op die volgende:<br>1. Jy sal voortgaan om die kennisgewing vir {1,number,integer} dae vanaf die datum van gebruiksoorskryding te ontvang.<br>2. Jy sal nie die oorbenutte kenmerk vir enige rekeninge kan aktiveer nie.<br>3. As jy geen aksie oor die oorbenutte kenmerk neem nie, sal die kenmerk vir die gebruikers gedeaktiveer word om dit onder die gelisensieerde limiet te bring.<br><br>Groete,<br>Zimbra Support</div>
passwordExpiryNotifierSubject = Jou wagwoord verval oor {0} dae
passwordExpiryNotifierBodyText = Beste {0},\n\nJou rekeningwagwoord verval oor {1} dae, op {2}.\n\nOm toegang tot jou rekening te behou, stel asseblief jou wagwoord terug voor die vervaldatum.\n\nJy sal voortgaan om daagliks kennisgewings te ontvang totdat die wagwoord verander is of verval.\n\nDit is n outomatiese e-poskennisgewing.
