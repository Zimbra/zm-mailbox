zimbra_extensions_directory = Dosiye oyo ba-sous-dosiye na yango ezali na ba-extension.
zimbra_extensions_common_directory = Dosiye oyo ezali na ba-fichier jar oyo ekabolami na ba-extension nyonso.
zimbra_mysql_shutdown_timeout = Ntango ya kozela ete processus ya mailbox MySQL/MariaDB esila. Bakisa delai soki mysql.server ezali kozwa ntango molai mingi mpo na kokanga processus yango.
zimbra_mysql_user = Nkombo ya mosaleli ya MySQL ya kosalela mpo na kosala to kokota na ba-base de donnees mpe ba-table ya zimbra. Oyo nde motuya okopesa na option \u2018-u\u2019 ya programme ya ligne de commande \u2018mysql\u2019.
zimbra_mysql_password = Modepasi mpo na zimbra_mysql_user. Ebombami na local config mpo application ya store esalela yango mpo na komimonisa. Soki olingi kobongola modepasi oyo, salela program\u025b zmmypasswd oyo ekobongola modepasi na MySQL mpe na local config.
zimbra_ldap_userdn = LDAP dn oyo esalelamaka mpo application ya store emimonisa na LDAP.
zimbra_ldap_user = Nkombo ya mosaleli ya zimbra oyo esalelamaka mpo na komimonisa na admin AuthRequest.
zimbra_ldap_password = Modepasi mpo na zimbra_ldap_userdn. Ebombami na local config mpo application ya store esalela yango mpo na komimonisa. Soki olingi kobongola modepasi oyo, salela program\u025b zmldappasswd oyo ekobongola modepasi na LDAP mpe na local config.
zimbra_server_hostname = Nkombo oyo epesami na serveur oyo. Esengeli ete bok\u0254ti ya 'server' oyo ekokani na yango ezala na LDAP \u2014 tala mokanda ya mobeko CreateServer ya program\u025b zmprov.
zimbra_user = Mosaleli ya unix ya zimbra oyo process ya serveur ya zimbra esengeli kobongola makoki na yango epai na ye sima ya kokangama na ba port ya privil\u00e8ge.
zimbra_uid = uid ya unix ya zimbra oyo process ya serveur ya zimbra esengeli kobongola makoki na yango epai na yango sima ya kokangama na ba port ya privil\u00e8ge.
zimbra_gid = gid ya unix ya zimbra oyo process ya serveur ya zimbra esengeli kobongola makoki na yango epai na yango sima ya kokangama na ba port ya privil\u00e8ge.
zimbra_log4j_properties = Nzela ya fisye ya ba propri\u00e9t\u00e9s ya configuration ya log4j.
zimbra_log4j_properties_watch = Tango ya kotala lisusu fisye ya ba propri\u00e9t\u00e9s ya configuration ya log4j na msec.
zimbra_attrs_directory = Dosiye oyo ezali na bafisye *.xml oyo elakisi sintaksi ya ba attribut LDAP oyo syst\u00e8me esalelaka.
localized_msgs_directory = Dosiye mpo na bafisye ya bamokanda oyo babongoli na mon\u0254k\u0254 mosusu.
localized_client_msgs_directory = Dosiye mpo na bafisye ya bamokanda ya client oyo babongoli na mon\u0254k\u0254 mosusu.
skins_directory = Dosiye mpo na skins.
zimbra_store_sweeper_max_age = Bafisye oyo eleki motango oyo ya miniti balongolamaka bango moko na dosiye ya bokoti ya store.
zimbra_store_copy_buffer_size_kb = Misala ya kokopi fisye esalelaka ba buffer ya bonene oyo.
zimbra_mailbox_galsync_cache = Etiaka cache monene koleka ya bilembo ya kontakte ya bo\u00eete aux lettres galsync. Tia motuya yango ata na motango ya bilembo ya kontakte oyo ezali na bo\u00eete aux lettres galsync.
zimbra_mailbox_manager_hardref_cache = Motango monene koleka ya ba bo\u00eete aux lettres oyo ekangamaka na memoire liboso mailbox manager abandi kotika ete elongolama na SoftReference garbage collection.
zimbra_mailbox_active_cache = Bonene monene koleka ya cache interne ya bilembo LRU ya bo\u00eete aux lettres tango ba session ezali kosala.
zimbra_mailbox_inactive_cache = Bonene monene koleka ya cache interne ya bilembo LRU ya bo\u00eete aux lettres tango ezali na ba session ya kosala te.
zimbra_mailbox_change_checkpoint_frequency = Mbala boni, na motango ya mbongwana, nde motuya ya mbongwana ya highwater ya ZIMBRA.MAILBOX.CHANGE_CHECKPOINT ya bo\u00eete aux lettres ekomamaka.
zimbra_index_elasticsearch_url_base = URL ya moboko ya REST API ya ElasticSearch.
zimbra_index_threads = Bonene ya pool ya ba thread mpo na index ya batch.
zimbra_reindex_threads = Motango monene koleka ya ba thread mpo na re-index. Ba thread ya re-index ezalaka na pool te.
zimbra_index_disable_perf_counters = Soki ezali false, Lucene read mpe write IO elandamaka na bolandi ya performance ya Zimbra. Motuya true ezimisaka bolandi ya Lucene IO.
zimbra_index_max_readers = Motango monene koleka ya IndexReaders oyo ekoki kosala elongo.
zimbra_index_max_writers = Motango monene koleka ya IndexWriters oyo ekoki kosala elongo.
zimbra_index_reader_cache_size = Motango monene koleka ya IndexReaders na cache ya index ya boluki.
zimbra_index_reader_cache_ttl = Soki ezali kozanga kosalelama koleka motuya oyo na secondes, longola IndexReader na cache.
zimbra_index_deferred_items_failure_delay = Nsima ya panne, retard minimum na secondes kati na mimeka mpo na kolongola molongo ya bilembo oyo eindexamaki te, to deferred.
zimbra_index_lucene_max_terms_per_query = Tia motango monene koleka ya ba terme oyo bandimami mpo na requ\u00eate moko.
zimbra_index_max_transaction_bytes = Tango misala ya index esangisami na transaction ya Mailbox, bonene nyonso monene koleka ya bilembo oyo tokondima na transaction moko.
zimbra_index_max_transaction_items = Tango misala ya index esangisami, motango monene koleka ya mail_items oyo tokondima na transaction moko.
zimbra_index_max_pending_deletes = Motango monene koleka ya ba suppressions ya index oyo ezali kozela liboso ya kozongisa esika ya disque.
zimbra_index_lucene_merge_policy = true mpo na kosalela LogDocMergePolicy, false mpo na kosalela LogByteSizeMergePolicy. LogDocMergePolicy eponaka ba segment mpo na kosangisa na kotalaka motango ya ba documents. LogByteSizeMergePolicy eponaka ba segment mpo na kosangisa na kotalaka bonene na yango.
zimbra_index_lucene_min_merge = Etiaka bonene minimum ya merge ya Lucene na Documents to KB kolanda merge policy oyo elakisami na zimbra_index_lucene_merge_policy.
zimbra_index_lucene_max_merge = Etiaka bonene monene koleka ya merge ya Lucene na Documents to KB kolanda merge policy oyo elakisami na zimbra_index_lucene_merge_policy. Motuya oyo elakisaka segment oyo eleki monene oyo ekoki kosangisama na ba segment mosusu.
zimbra_index_lucene_merge_factor = Mbala boni nde ba index ya segment esangisamaka na addDocument(). Na motuya mike, RAM esalelamaka moke tango ya indexing, mpe boluki ezalaka noki, kasi vitesse ya indexing ezalaka malembe. Na motuya minene, RAM esalelamaka mingi tango ya indexing, mpe atako boluki ezalaka malembe, vitesse ya indexing ezalaka noki. Motuya minene, koleka 10, ezali malamu mpo na bokeli ya index ya batch, mpe motuya mike, na nse ya 10, mpo na ba index oyo babatelaka na ndenge ya interactif.
zimbra_index_lucene_term_index_divisor = Eponaka ndambo ya ba terme oyo eindexami mpo ezwa na RAM. Soki otii yango na motuya koleka 1, okoki kokitisa bosaleli ya memoire kasi retard ekozala mingi tango ozali kocharger bansango ya enregistrement oyo ebombami mpo na terme moko.
zimbra_index_lucene_use_compound_file = true soki segment ya sika ya Lucene esengeli kosalela format ya fichier compos\u00e9. http://wiki.apache.org/lucene-java/ImproveIndexingSpeed elobi ete format ya fichier compos\u00e9 esengeli kozimama mpo na performance malamu, kasi yango ekobakisa mingi motango ya ba file descriptor. Ba file descriptor ekoki kosila soki zimbra_index_lucene_merge_factor ezali monene.
zimbra_index_lucene_max_buffered_docs = Motango minimum ya ba documents oyo esengeli liboso ba documents oyo ebombami na memoire ebimisama lokola segment ya sika. Mbala mingi, motuya minene epesaka indexing ya noki.
zimbra_index_lucene_ram_buffer_size_kb = RAM ya Lucene oyo ebombami lokola buffer na KB.
zimbra_index_lucene_io_impl = Implementation ya Lucene FSDirectory oyo esalelamaka mpo na indexing IO. Ba motuya oyo ekoki kozala ezali nio - Salela NIOFSDirectory. Esalelaka positional io ya FileChannel ya java.nio tango ya kotanga mpo na koboya synchronisation tango ba thread mingi bazali kotanga fisye moko. mmap - Salela MMapDirectory. Esalelaka memory-mapped IO tango ya kotanga. Ezali maponi malamu soki memoire virtuelle ezali mingi soki tokokanisi na bonene ya index. simple - Salela SimpleFSDirectory. Esalelaka java.io.RandomAccessFile. Ezali na performance ya mabe mpo na misala mingi elongo mpo esalaka synchronisation tango ba thread mingi bazali kotanga fisye moko. Soki motuya moko te epesami, FSDirectory ekopona implementation oyo eleki malamu mpo na environnement.
zimbra_index_rfc822address_max_token_count = Motango monene koleka ya ba token ya ba adresse na flux ya token ya adresse RFC822. Limit\u025b yango etali ba en-t\u00eate FROM, TO mpe CC nyonso mpo na ba imeli, ba adresse nyonso ya imeli mpo na ba Kontakte, mpe champ Creator mpo na ba Documents.
zimbra_index_rfc822address_max_token_length = Bolai monene koleka ya token mpo na adresse moko na flux ya token ya adresse RFC822. Limit\u025b yango etali ba en-t\u00eate FROM, TO mpe CC nyonso mpo na ba imeli, ba adresse nyonso ya imeli mpo na ba Kontakte, mpe champ Creator mpo na ba Documents.
zimbra_index_wildcard_max_terms_expanded = Motango monene koleka ya ba extension ya wildcard mpo na terme moko moko na requ\u00eate.
zimbra_galsync_index_reader_cache_size = Motango monene koleka ya IndexReaders na cache ya index ya boluki ya GAL. Index ya Lucene ya konti ya GAL sync ebombamaka na ndenge ekeseni mpe elongolamaka yango moko te.
zimbra_spam_report_queue_size = Mpo na Junk/Not Junk Msg/ConvActionRequests, bonene oyo ya molongo epekisaka server workqueue mpo na kosala ba forwards.
zimbra_throttle_op_concurrency = Liste oyo bakaboli na virgule ya ba motuya ya concurrence mpo na moko na moko ya ba niveau 5 ya priorit\u00e9, kobanda na priorit\u00e9 ya likolo kino na ya nse.
zimbra_im_chat_flush_time = Mbala boni, na secondes, nde ba chat IM oyo efungwami ekomamaka na store.
zimbra_im_chat_close_time = Serveur ekozela tango boni, na secondes, mpo na kokanga ba session ya chat IM oyo ezali lisusu kosalelama te.
zimbra_http_originating_ip_header = En-t\u00eate HTTP oyo basengeli kotala mpo na koyeba adresse IP ya ebandeli ya client.
zimbra_session_limit_imap = Motango monene koleka ya ba dosiye IMAP oyo mosaleli moko akoki kofungola mbala moko.
zimbra_session_limit_admin = Motango monene koleka ya ba session SOAP ya admin oyo mosaleli moko akoki kofungola mbala moko.
zimbra_session_limit_soap = Motango monene koleka ya ba session soap oyo ezali kosala mpo na konti moko. Bakisa motuya oyo malembe malembe mpo na koboya mabunga "Too many SOAP sessions" na mailbox.log.
zimbra_session_limit_sync = Motango monene koleka ya ba sync listener mpo na session moko ya ActiveSync. Bakisa motuya oyo malembe malembe mpo na koboya mabunga "Too many SYNCLISTENER sessions" na sync.log.
zimbra_session_timeout_soap = Ntango ya kosila ya kozanga mosala, na secondes, mpo na ba session SOAP.
zimbra_session_max_pending_notifications = Motango monene koleka ya ba notifications oyo ezali kozela oyo ekoki kotiyama na molongo na session SOAP moko liboso molongo elongolama mpe client ayebisama ete \u00e9tat na ye ezali lisusu ya malamu te.
zimbra_converter_enabled_uuencode = Ezali kolakisa soki decoder UUENCODE esalaka tango bazali koparser bamokanda uta na store.
zimbra_converter_enabled_tnef = Ezali kolakisa soki decoder TNEF esalaka tango bazali koparser bamokanda uta na store.
zimbra_converter_depth_max = Mozindo ya recursion ya eteni ya MIME oyo ezali na nse na yango ba convertisseur bakosala te.
zimbra_ssl_enabled = Ezali kolakisa soki basengeli kocharger ssl keystore to te.
stats_img_folder = Dosiye mpo na kobomba bilili ya statistiques oyo ebimisami.
ldap_host = Host LDAP ya kosalela. Esila kosalelama lisusu te \u2014 salela ldap_url na esika na yango.
ldap_log_level = Niveau ya logging ya LDAP.
ldap_port = Port LDAP ya kosalela. Esila kosalelama lisusu te \u2014 salela ldap_url na esika na yango.
ldap_url = Liste ya ba serveur LDAP mpo serveur oyo esalela yango.
ldap_master_url = URL mpo na maitre LDAP.
ldap_is_master = Host oyo nde serveur maitre ya LDAP?
ldap_root_password = Modepasi mpo na rootdn ya LDAP slapd.conf. Mpo na kopesa p\u025bt\u025b\u025b, na tango ya kobanda LDAP, modepasi ya hasard ebimisamaka, ebombamaka na local config mpe na slapd.conf. Soki olingi kobongola modepasi oyo, salela program\u025b zmldappasswd oyo ekobongola modepasi na slapd.conf mpe na local config.
ldap_connect_timeout = Ba millisecondes oyo nsima na yango komeka ya connexion etikamaka.
ldap_read_timeout = Ba millisecondes oyo nsima na yango komeka ya botangi etikamaka.
ldap_deref_aliases = Ezali kolakisa soki alias esengeli kolandama tango ya boluki to ya binding na annuaire externe. Ba motuya oyo endimami ezali: always, never, finding, searching.
ldap_connect_pool_master = Ezali kolakisa soki basengeli kosalela JNDI connection pooling mpo na maitre LDAP.
ldap_connect_pool_debug = Ezali kolakisa soki basengeli kosala debug ya LDAP connection pooling.
ldap_connect_pool_initsize = Motango ya ebandeli ya ba connexion LDAP oyo ezali kosala mpo na komata tii kuna.
ldap_connect_pool_maxsize = Motango monene koleka ya ba connexion LDAP oyo ezali kosala mpe oyo ezangi mosala oyo endimami.
ldap_connect_pool_prefsize = Motango oyo eleki malamu ya ba connexion LDAP \u2014 soki otii maxsize mpe prefsize na motuya moko, connection pool ekobatela bonene ya seko.
ldap_connect_pool_timeout = Ba millisecondes ya kozanga mosala liboso connexion oyo ezangi mosala elongolama na pool.
ldap_connect_pool_health_check_on_checkout_enabled = Ezali kolakisa soki v\u00e9rification ya sant\u00e9 ya connection pool ekosalema mbala nyonso tango connexion moko ekobimisama mpo na kosalela yango. Soki v\u00e9rification ya sant\u00e9 ya OnCheckout epelisi, v\u00e9rification p\u00e9riodique ya nsima ekokangama.
ldap_connect_pool_health_check_interval_millis = Ntango kati ya v\u00e9rification p\u00e9riodique ya nsima ya sant\u00e9, na millisecondes, mpo na ba connexion oyo ezali na connection pool.
ldap_connect_pool_health_check_max_response_time_millis = Bolai monene koleka ya ntango, na millisecondes, oyo esengeli kotikala mpo eyano ya v\u00e9rification ya sant\u00e9 ezonga uta na serveur LDAP.
ldap_replication_password = Modepasi oyo mosaleli syncrepl asalelaka mpo na kosala authentification epai ya ldap master.
ldap_postfix_password = Modepasi oyo postfix asalelaka mpo na kosala authentification na ldap.
ldap_amavis_password = Modepasi oyo amavis asalelaka mpo na kosala authentification na ldap.
ldap_starttls_supported = Ezali kolakisa soki serveur LDAP esimbaka mosala ya startTLS.
ldap_require_tls = Ezali kolakisa soki TLS esengami mpo na bakiliya LDAP.
ldap_cache_account_maxsize = Motango eleki nyonso ya baobj\u025b ya konti ya kobomba na cache.
ldap_cache_account_maxage = Ntango eleki nyonso (na miniti) oyo baobj\u025b ya konti ekotikala na cache.
ldap_cache_cos_maxsize = Motango eleki nyonso ya baobj\u025b ya cos ya kobomba na cache.
ldap_cache_cos_maxage = Ntango eleki nyonso (na miniti) oyo baobj\u025b ya cos ekotikala na cache.
ldap_cache_domain_maxsize = Motango eleki nyonso ya baobj\u025b ya domaine ya kobomba na cache.
ldap_cache_domain_maxage = Ntango eleki nyonso (na miniti) oyo baobj\u025b ya domaine ekotikala na cache.
ldap_cache_mime_maxage = Ntango eleki nyonso, na miniti, oyo baobj\u025b ya MIME ekotikala na cache.
ldap_cache_server_maxsize = Motango eleki nyonso ya baobj\u025b ya serveur ya kobomba na cache.
ldap_cache_server_maxage = Ntango eleki nyonso (na miniti) oyo baobj\u025b ya group ekotikala na cache.
ldap_cache_share_locator_maxsize = Motango eleki nyonso ya biloko ya konti na cache ya named entry.
ldap_cache_share_locator_maxage = TTL ya cache ya named entry na miniti.
ldap_cache_timezone_maxsize = Motango eleki nyonso ya baobj\u025b ya zone ya ngonga ya kobomba na cache.
ldap_cache_zimlet_maxsize = Motango eleki nyonso ya baobj\u025b ya zimlet ya kobomba na cache.
ldap_cache_zimlet_maxage = Ntango eleki nyonso (na miniti) oyo baobj\u025b ya zimlet ekotikala na cache.
ldap_cache_custom_dynamic_group_membership_maxage_ms = Ntango eleki nyonso (na millisecondes) ya kobomba na cache bituluku dynamiques oyo konti ezali mondimi na yango mpo na bituluku oyo bondimi na yango ezwamaka na MemberURL personnalise.
csrf_filter_domain_allowed_ref_hosts_max_size = Motango eleki nyonso ya baentrees ya domaine na cache allowedRefererHosts ya par domaine ya CsrfFilter. Soki parsing elongi te, ezongaka na ldap_cache_domain_maxsize.
csrf_filter_domain_allowed_ref_hosts_cache_expiry_mins = Ntango eleki nyonso (na miniti) ya baentrees na cache allowedRefererHosts ya par domaine ya CsrfFilter. Sima ya expiration, entree elongolamaka mpe echargemaka lisusu uta na LDAP na bosengi oyo elandi. Soki parsing elongi te, ezongaka na miniti 60.
mysql_directory = Esika ya installation ya MySQL.
mysql_data_directory = Dosiye oyo esengeli kobatela ba donnees ya MySQL.
mysql_errlogfile = Journal ya mabunga ya MySQL/MariaDB.
mysql_socket = Nzela ya socket MySQL mpo na kosalelama na bisaleli ya ligne de commande ya MySQL.
mysql_pidfile = Fisye oyo identifiant ya processus ya MySQL ebombamaka.
mysql_mycnf = Nzela ya my.cnf, fisye ya configuration ya MySQL.
mysql_bind_address = Interface na hote oyo MySQL ekobindama na yango.
mysql_port = Motango ya port oyo serveur MySQL esengeli koyoka na yango.
mysql_root_password = Modepasi ya mosaleli "root" oyo etongami na kati ya MySQL, kasi esengeli te kobulunganisa yango na login root ya UNIX. Mpo na kopesa pete, na tango ya kobanda base de donnees, modepasi ya pwasa ebimisamaka, ebombamaka na config ya local mpe na MySQL. Soki olingi kobongola modepasi oyo, salela programe zmmypasswd, oyo ekobongola modepasi na MySQL mpe na config ya local nyonso mibale.
mysql_memory_percent = Pourcentage ya memoire systeme oyo mysql esengeli kosalela. Valeur oyo ebombami awa mpo na kosalelama na programe zmmycnf. Kobongola parametre oyo emonisaka mbala moko te na serveur MySQL. Esengeli, na bokebi mingi, kobimisa lisusu my.cnf mpe kobanda lisusu serveur MySQL mpo mbongwana esala.
mysql_innodb_log_buffer_size = Tala documentation ya MySQL mpo na innodb_log_buffer_size. Valeur oyo ebombami awa mpo na kosalelama na programe zmmycnf. Kobongola parametre oyo emonisaka mbala moko te na serveur MySQL. Esengeli, na bokebi mingi, kobimisa lisusu my.cnf mpe kobanda lisusu serveur MySQL mpo mbongwana esala.
mysql_innodb_log_file_size = Tala documentation ya MySQL mpo na innodb_log_file_size. Valeur oyo ebombami awa mpo na kosalelama na programe zmmycnf. Kobongola parametre oyo emonisaka mbala moko te na serveur MySQL. Esengeli, na bokebi mingi, kobimisa lisusu my.cnf mpe kobanda lisusu serveur MySQL mpo mbongwana esala.
mysql_sort_buffer_size = Tala documentation ya MySQL mpo na sort_buffer_size. Valeur oyo ebombami awa mpo na kosalelama na programe zmmycnf. Kobongola parametre oyo emonisaka mbala moko te na serveur MySQL. Esengeli, na bokebi mingi, kobimisa lisusu my.cnf mpe kobanda lisusu serveur MySQL mpo mbongwana esala.
mysql_read_buffer_size = Tala documentation ya MySQL mpo na read_buffer_size. Valeur oyo ebombami awa mpo na kosalelama na programe zmmycnf. Kobongola parametre oyo emonisaka mbala moko te na serveur MySQL. Esengeli, na bokebi mingi, kobimisa lisusu my.cnf mpe kobanda lisusu serveur MySQL mpo mbongwana esala.
mysql_backup_retention = Motango ya ba versions ya sauvegarde ya base de donnees mysql ya kobatela.
antispam_mysql_enabled = Salela base de donnees mysql mpo na antispam. False na ndenge ya liboso.
antispam_backup_retention = Motango ya ba versions ya sauvegarde ya base de donnees antispam ya kobatela.
derby_properties = Nzela ya fisye ya ba proprietes ya configuration ya derby.
imap_max_consecutive_error = Soki eleki 0, kata boyokani ya imap soki valeur ya imap_max_consecutive_error ekokoma.
imap_inactive_session_cache_size = Ehcache: motango eleki nyonso ya baentrees ya cache IMAP oyo ezali inactive na disque liboso elongolama.
imap_use_ehcache = Soki true, salela Ehcache mpo na cache ya session IMAP. Soki te, salela cache ya disque.
imap_write_timeout = Bongisa write timeout ya session IMAP (nio).
imap_write_chunk_size = Bonene na bytes ya buffer ya kokoma ya IMAP.
imap_thread_keep_alive_time = Boumeli ya ndenge ya liboso, na secondes, mpo na thread ya IMAP.
imap_throttle_ip_limit = Soki eleki 0, motango eleki nyonso ya masengi ya IMAP na seg\u0254nde moko mpo na IP.
imap_throttle_acct_limit = Soki eleki 0, motango eleki nyonso ya masengi ya IMAP na seg\u0254nde moko mpo na konti.
imap_suggested_batch_copy_size = Motango ya bamokanda ya kosalela na batch moko na tango ya misala ya IMAP COPY.
imap_in_progress_response_thread_pool_size = Motango eleki nyonso ya ba threads na pool mpo na kotinda eyano InProgress epai ya client.
imap_in_progress_response_thread_keep_alive = Ntango na secondes mpo thread etikala na bomoi liboso esilisama.
imap_ehcache_heap_size = Motango eleki nyonso ya baentrees ya cache IMAP ebombami na niveau heap ya Ehcache.
imap_ehcache_skip_large_folder = Soki epelisami, ekataka kobomba na cache ba dossiers IMAP minene na Ehcache.
imap_ehcache_folder_max_message_count = Motango ya nsuka ya bamokanda oyo soki eleki yango, ba dossiers IMAP ebombamaka te na Ehcache.
nio_imap_enabled = Soki true, pelisa Jetty non-blocking IO mpo na IMAP.
nio_pop3_enabled = Soki true, pelisa Jetty non-blocking IO mpo na POP3.
postfix_mail_owner = postfix_mail_owner
postfix_setgid_group = postfix_setgid_group
postfix_version = postfix_version
mailboxd_directory = Esika ya installation ya mailboxd.
mailboxd_java_heap_size = Motango ya megabytes oyo ekosalelama lokola bonene eleki nyonso ya Java heap (-Xmx) mpo na JVM oyo ezali kotambwisa Mailboxd.
mailboxd_java_heap_new_size_percent = Pourcentage ya bonene ya Java heap oyo ekosalelama mpo na generation jeune (-Xmn) ya JVM oyo ezali kotambwisa Mailboxd.
mailboxd_java_options = Ba options ya JVM ya kosalela ntango ya kobanda Mailboxd.
mailboxd_pidfile = Fisye oyo identifiant ya processus ya JVM ya Mailboxd ebombamaka.
mailboxd_keystore = Esika ya fisye ya ba donnees ya keystore.
mailboxd_keystore_password = Modepasi ya kosalela na keystore ya KeyManager.
mailboxd_truststore = Esika ya fisye ya ba donnees ya truststore.
mailboxd_truststore_password = Modepasi ya kosalela na keystore ya TrustManager.
client_ssl_truststore = Esika ya fisye ya ba donnees ya truststore oyo esalelamaka mpo na authentification SSL ya client.
client_ssl_truststore_password = Modepasi ya kosalela na keystore ya client SSL TrustManager.
mailboxd_output_file = Fisye oyo stdout mpe stderr ya serveur ekotindama na yango.
mailboxd_output_rotate_interval = Periode, na secondes, oyo fisye ya sortie ya mailboxd ebongolamaka. Soki <= 0, rotation esalemaka te.
mailboxd_thread_stack_size = Bonene ya pile ya thread mpo na Mailboxd.
ssl_allow_untrusted_certs = Soki true, ndima ba certificats SSL self-signed.
zimlet_directory = Nzela ya ba Zimlets oyo etiyami.
calendar_outlook_compatible_allday_events = Salela all-day events oyo ekokani na Outlook. False na ndenge ya liboso.
calendar_entourage_compatible_timezones = Tia bilembo ya kotanga na parametre TZID na ba proprietes ya iCalendar mpo na kozongela bug na MS Entourage. True na ndenge ya liboso.
calendar_ics_import_full_parse_max_size = Na import ya ics, salela parseur complet soki bonene ya ics ezali moke to ekokani na oyo; ba fichiers ics ya minene elekisami na parseur ya callback oyo endimaka te ba references avant na VTIMEZONE TZID.
calendar_canonical_tzid = Identifiant ya zone ya ngonga oyo esengeli kozonga lokola TimeZone.getCanonicalID(). Ba valeurs oyo ekoki kozala: "olson","windows","java". "windows" na ndenge ya liboso.
calendar_cache_enabled = Pelisa cache ya kalandriye. False na ndenge ya liboso.
calendar_cache_directory = Dosiye ya mosisa ya ba fichiers ya cache ya kalandriye.
calendar_cache_lru_size = Bonene ya LRU ya memory-cache. Bomba na memoire ba dossiers ya kalandriye ebele boye.
calendar_cache_range_month_from = Sanza ya ebandeli na etando oyo ebombami na cache. 0 elingi koloba sanza ya lelo, -1 elingi koloba sanza eleki, bongo na bongo.
calendar_cache_range_months = Motango ya basanza na etando oyo ebombami na cache
krb5_keytab = Esika ya fisye keytab ya Zimbra Kerberos 5
krb5_debug_enabled = Soki debug ya Kerberos epelisami
zimbra_mtareport_max_hosts = Motango eleki nyonso ya ba host oyo ekoki kokota na balaporo ya MTA ya mokolo oyo zmdailyreport ebimisaka.
zimbra_mtareport_max_recipients = Motango ya bato bazwi oyo bakomonisama na balaporo ya MTA ya mokolo.
zimbra_mtareport_max_senders = Motango ya bato batindi oyo bakomonisama na balaporo ya MTA ya mokolo.
zimbra_mtareport_max_users = Motango eleki nyonso ya basaleli oyo ekoki kokota na balaporo ya MTA ya mokolo oyo zmdailyreport ebimisaka.
zimbra_auth_always_send_refer = Zongisa ntango nyonso elembo <refer> na eyano ya auth mpo na kotinda client abongola nzela.
zimbra_admin_service_port = Porti ya admin ya liboso/bootstrap.
zimbra_admin_service_scheme = Schema ya protocole ya admin ya liboso/bootstrap.
zimbra_mail_service_port = Porti ya imeli ya liboso
zimbra_zmprov_default_to_ldap = Soki zmprov esalelaka LDAP to SOAP lokola ya liboso.
zimbra_zmprov_default_soap_server = Serveur ya SOAP ya liboso oyo zmprov ekokangama na yango
zmprov_safeguarded_attrs = Liste ekabolami na bavirgile ya ba attributs ya provisioning oyo ezali na motuya mingi mpe esengeli kobatelama mpo ezwa esika te
zmprov_tmp_directory = Dosiye ya mwa ntango mpo na zmprov ekoma motuya ya ba attributs binaire na ba fisye.
zimbra_mailbox_groups = Motango ya bituluku ya mailbox mpo na kokabola ba mailbox ya sika na yango.
debug_mailboxindex_use_new_locking = Salela kokanga ya lolenge ya sika mpo na MailboxIndex
zimbra_class_provisioning = Kelasi ya interface ya provisioning
zimbra_class_accessmanager = Kelasi ya interface ya mokambi ya acces
zimbra_class_mboxmanager = Kelasi ya interface ya mokambi ya mailbox
zimbra_class_database = Kelasi ya configuration ya base de donnees
zimbra_class_store = Kelasi ya interface ya esika ya kobomba bamokanda
zimbra_class_application = Kelasi ya interface ya application ya Zimbra
zimbra_class_rulerewriterfactory = Kelasi ya interface ya RuleRewriterFactory
zimbra_class_dbconnfactory = Kelasi ya fabrika ya boyokani na base de donnees
zimbra_class_soapsessionfactory = Kelasi ya fabrika ya session ya SOAP
av_notify_user = Adresi ya imeli mpo na kotinda bamokanda ya admin oyo ewutaka na anti-virus mpe DKIM.
av_notify_domain = Domaine ya liboso na bibongiseli ya amavisd.
data_source_trust_self_signed_certs = Pesa nzela na ba certificats oyo emipesi signature yango moko ntango ozali kokangama na source ya ba donnees na nzela ya SSL.
data_source_fetch_size = Motango eleki nyonso ya bamokanda ya IMAP mpo na FETCH na bosengi mokomoko
data_source_max_literal_mem_size = Bonene eleki nyonso ya ba donnees litterales (na ba octets) oyo ekobombama na memoire cache. Ba donnees oyo eleki monene ekobombama na fisye ya mwa ntango.
timezone_file = Fisye iCalendar oyo ezali kotanga ba zones ya ngonga oyo eyebani malamu
search_disable_database_hints = Soki ezali solo, kosalela te database hints na ba requetes oyo esalemi ntango ya boluki
search_dbfirst_term_percentage_cutoff = Parametre ya kati ya kobimisa requete
zmstat_interval = Mbala boni zmstat ezwaka ba echantillons (na secondes)
zmstat_df_excludes = Liste ekabolami na ba deux-points ya ba volumes ya disque (na nzela ya montage) oyo esengeli kolongolama na zmstats
zimbra_noop_default_timeout = Ntango (na secondes) oyo serveur ekotika NoOpRequest ezala na blocage soki client apesi wait=1
zimbra_noop_min_timeout = Ntango ya kozela ya moke koleka nyonso (na secondes) oyo epesami na NoOpRequest
zimbra_noop_max_timeout = Ntango ya kozela eleki nyonso (na secondes) oyo epesami na NoOpRequest
zimbra_waitset_default_request_timeout = Ntango ya kozela ya liboso (na secondes) oyo WaitSetRequest oyo ezali ya admin te ekotikala na blocage
zimbra_waitset_min_request_timeout = Ntango ya kozela ya moke koleka nyonso (na secondes) oyo WaitSetRequest oyo ezali ya admin te ekotikala na blocage
zimbra_waitset_max_request_timeout = Ntango ya kozela eleki nyonso (na secondes) oyo WaitSetRequest oyo ezali ya admin te ekotikala na blocage
zimbra_waitset_max_per_account = Motango eleki nyonso ya ba WaitSets oyo ezali ya admin te konti moko ekoki kozala na yango polele
zimbra_admin_waitset_default_request_timeout = Ntango ya kozela ya liboso (na secondes) oyo WaitSetRequest ya admin ekotikala na blocage
zimbra_admin_waitset_min_request_timeout = Ntango ya kozela ya moke koleka nyonso (na secondes) oyo WaitSetRequest ya admin ekotikala na blocage
zimbra_admin_waitset_max_request_timeout = Ntango ya kozela eleki nyonso (na secondes) oyo WaitSetRequest ya admin ekotikala na blocage
zimbra_waitset_initial_sleep_time = Ntango ya kozela ya ebandeli (na millisecondes) mpo na kozela liboso ya kosala WaitSetRequest nyonso
zimbra_waitset_nodata_sleep_time = Ntango (na millisecondes) ya kolala ntango ya kosalela WaitSetRequest soki ba donnees ezali te nsima ya botali ya liboso
zmdisklog_warn_threshold = Seuil ya likebisi ya disque ya liboso mpo na SNMP/SMTP
zmdisklog_critical_threshold = Seuil ya nivo critique ya disque ya liboso mpo na SNMP/SMTP
zimbra_csv_mapping_file = Mapping ya bisika ya kontakte mpo na kokotisa mpe kobimisa CSV
zimbra_auth_provider = Liste ekabolami na bavirgile mpe ebongisami na molongo ya ba fournisseurs ya auth
zimbra_zmjava_options = Ba options ya Java mpo na script ya zmjava
zimbra_zmjava_java_library_path = Propriete Java java.library.path mpo na script ya zmjava
zimbra_zmjava_java_ext_dirs = Propriete Java java.ext.dirs mpo na script ya zmjava
debug_update_config_use_old_scheme = Soki ezali solo, DbMailbox.updateConfig() ekosala DELETE/INSERT na esika ya UPDATE.
debug_xmpp_disable_client_tls = Zimisa TLS mpo na protocole XMPP C2S
