licenseFeaureOnHoldNotifierSubject = Likebisi ya Syst\u00e8me Zimbra: ndelo ya bosaleli ya fonctionnalit\u00e9 eleki
licenseFeaureOnHoldNotifierBodyText = Motango ya bakonti oyo licence epesi ndingisa esili kokokisama to eleki mpo na ba fonctionnalit\u00e9 oyo elandi:\n{0}\nOkoki to kokitisa bosaleli ya basaleli oyo bazali sikoyo to komatisaka ndelo ya licence ya fonctionnalit\u00e9.\n\nMpo na komatisaka ndelo ya licence ya fonctionnalit\u00e9, senga lisalisi epai ya Zimbra Sales na sales@zimbra.com.\nMpo na kotambwisa bokaboli ya fonctionnalit\u00e9 ya konti, k\u0254ta na Admin Portal.\n\nTala makambo oyo elandi:\n1. Okokoba kozwa likebisi yango mikolo {1,number,integer} banda mokolo oyo bosaleli eleki ndelo.\n2. Okokoka te kopelisa fonctionnalit\u00e9 oyo basaleli mingi na yango mpo na konti moko te.\n3. Soki osali eloko moko te mpo na fonctionnalit\u00e9 oyo basaleli mingi na yango, fonctionnalit\u00e9 yango ekokangama mpo na basaleli mpo ezonga na nse ya ndelo ya licence.\n\nMbote,\nZimbra Support
licenseFeaureOnHoldNotifierBodyHtml = <div style="font-family:sans-serif;">Motango ya bakonti oyo licence epesi ndingisa esili kokokisama to eleki mpo na ba fonctionnalit\u00e9 oyo elandi:<br>{0}<br>Okoki to kokitisa bosaleli ya basaleli oyo bazali sikoyo to komatisaka ndelo ya licence ya fonctionnalit\u00e9.<br><br>Mpo na komatisaka ndelo ya licence ya fonctionnalit\u00e9, senga lisalisi epai ya Zimbra Sales na <b>sales@zimbra.com</b>.<br>Mpo na kotambwisa bokaboli ya fonctionnalit\u00e9 ya konti, k\u0254ta na Admin Portal.<br><br>Tala makambo oyo elandi:<br>1. Okokoba kozwa likebisi yango mikolo {1,number,integer} banda mokolo oyo bosaleli eleki ndelo.<br>2. Okokoka te kopelisa fonctionnalit\u00e9 oyo basaleli mingi na yango mpo na konti moko te.<br>3. Soki osali eloko moko te mpo na fonctionnalit\u00e9 oyo basaleli mingi na yango, fonctionnalit\u00e9 yango ekokangama mpo na basaleli mpo ezonga na nse ya ndelo ya licence.<br><br>Mbote,<br>Zimbra Support</div>
passwordExpiryNotifierSubject = Modepasi na yo ekosila na mikolo {0}
passwordExpiryNotifierBodyText = Mbote {0},\n\nModepasi ya konti na yo ekosila na mikolo {1}, na {2}.\n\nMpo okoba kozwa nzela na konti na yo, zongisa modepasi na yo liboso ya mokolo ya kosila.\n\nOkokoba kozwa bilembo ya kokundwela mokolo na mokolo kino modepasi ebongwani to esili.\n\nOyo ezali likebisi ya imeli oyo etindami na ndenge ya automatique.
passwordExpiryNotifierBodyHtml = <p>Mbote {0},</p><p>Modepasi ya konti na yo ekosila na <strong>mikolo {1}</strong>, na <strong>{2}</strong>.</p><p>Mpo okoba kozwa nzela na konti na yo, zongisa modepasi na yo liboso ya mokolo ya kosila.</p><p>Okokoba kozwa bilembo ya kokundwela mokolo na mokolo kino modepasi ebongwani to esili.</p><p>Oyo ezali likebisi ya imeli oyo etindami na ndenge ya automatique.</p>
