httpclient_internal_client_connection_timeout = Client httpclient mpo na ba connexions internes ya Zimbra: etyaka ntango ya kozela na millisecondes oyo esalelamaka ntango ya kozwa boyokani ya HTTP uta na mokambi ya ba connexions HTTP.
httpclient_internal_connmgr_connection_timeout = httpclient connection manager mpo na ba connexion ya kati ya Zimbra: ezwaka mokano ya ntango ya kozela kino connexion esalemi. Motuya ya z\u00e9ro elakisi ete timeout yango esalelami te
httpclient_internal_connmgr_idle_reaper_connection_timeout = httpclient connection manager idle reaper mpo na ba connexion ya kati ya Zimbra: motuya ya timeout ya kosalela tango bazali komeka ba connexion oyo ezali idle.
httpclient_internal_connmgr_idle_reaper_sleep_interval = httpclient connection manager idle reaper mpo na ba connexion ya kati ya Zimbra: motango ya ntango (na milliseconds) oyo thread ya idle connection reaper ya http client elalaka kati na misala. 0 elakisi ete thread ya reaper ezimisi.
httpclient_internal_connmgr_max_host_connections = httpclient connection manager mpo na ba connexion ya kati ya Zimbra: elimbolaka motango ya likolo ya ba connexion oyo endimami mpo na configuration moko na moko ya host
httpclient_internal_connmgr_max_total_connections = httpclient connection manager mpo na ba connexion ya kati ya Zimbra: elimbolaka motango ya likolo ya ba connexion oyo endimami nyonso
httpclient_internal_connmgr_so_timeout = httpclient connection manager mpo na ba connexion ya kati ya Zimbra: motuya ya timeout ya z\u00e9ro elimbolami lokola timeout ya seko. Motuya oyo esalelamaka tango socket timeout etyami te na ba param\u00e8tre ya m\u00e9thode HTTP
httpclient_internal_connmgr_tcp_nodelay = httpclient connection manager mpo na ba connexion ya kati ya Zimbra: elimbolaka soki esengeli kozimisa algorithme Nagle na socket HTTP
httpclient_internal_connmgr_stale_connection_check = httpclient connection manager mpo na ba connexion ya kati ya Zimbra: ezwaka mokano soki stale connection check esengeli kosalelama. Kozimisa stale connection check ekoki kopesa bobongisi moke ya performance, kasi na likama ya kozwa libunga ya I/O tango bosengi esalemi na connexion oyo ekangamaki na ngambo ya serveur.
httpclient_external_client_connection_timeout = httpclient client mpo na ba connexion ya libanda: etiaka timeout na milliseconds oyo basalelaka tango bazali kozwa connexion HTTP uta na HTTP connection manager. Kozimisa stale connection check ekoki kopesa bobongisi moke ya performance, kasi na likama ya kozwa libunga ya I/O tango bosengi esalemi na connexion oyo ekangamaki na ngambo ya serveur.
httpclient_external_connmgr_connection_timeout = httpclient connection manager mpo na ba connexion ya libanda: ezwaka mokano ya ntango ya kozela kino connexion esalemi. Motuya ya z\u00e9ro elakisi ete timeout yango esalelami te
httpclient_external_connmgr_idle_reaper_connection_timeout = httpclient connection manager idle reaper mpo na ba connexion ya libanda: motuya ya timeout ya kosalela tango bazali komeka ba connexion oyo ezali idle.
httpclient_external_connmgr_idle_reaper_sleep_interval = httpclient connection manager idle reaper mpo na ba connexion ya libanda: motango ya ntango (na milliseconds) oyo thread ya idle connection reaper ya http client elalaka kati na misala. 0 elakisi ete thread ya reaper ezimisi.
httpclient_external_connmgr_max_host_connections = httpclient connection manager mpo na ba connexion ya libanda: elimbolaka motango ya likolo ya ba connexion oyo endimami mpo na configuration moko na moko ya host
httpclient_external_connmgr_max_total_connections = httpclient connection manager mpo na ba connexion ya libanda: elimbolaka motango ya likolo ya ba connexion oyo endimami nyonso
httpclient_external_connmgr_so_timeout = httpclient connection manager mpo na ba connexion ya libanda: motuya ya timeout ya z\u00e9ro elimbolami lokola timeout ya seko. Motuya oyo esalelamaka tango socket timeout etyami te na ba param\u00e8tre ya m\u00e9thode HTTP
httpclient_external_connmgr_tcp_nodelay = httpclient connection manager mpo na ba connexion ya libanda: elimbolaka soki esengeli kozimisa algorithme Nagle na socket HTTP
httpclient_external_connmgr_stale_connection_check = httpclient connection manager mpo na ba connexion ya libanda: ezwaka mokano soki stale connection check esengeli kosalelama.
httpclient_convertd_so_timeout = socket SO timeout na milliseconds mpo na client convertd. Soki 0, elakisi timeout te. Soki -1 to etyami te, elakisi kosalela default read timeout ya connection manager.
httpclient_convertd_keepalive_connections = Elimbolaka soki ba connexion HTTP keep-alive esengeli kosalelama mpo na client convertd
httpclient_soaphttptransport_retry_count = Elimbolaka motango ya ba retry nsima ya bozangi ya mwa ntango mpo na ba client SOAP oyo basalelaka classe SoapHttpTransport
