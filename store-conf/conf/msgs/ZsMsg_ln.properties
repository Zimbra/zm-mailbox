zimbra_index_directory = Dosiye mpo na ba-fichier ya index ya mailbox.
zimbra_store_directory = Dosiye mpo na bamokanda ya mailbox.
zimbra_db_directory = Dosiye mpo na ba-fichier ya base de donnees.
