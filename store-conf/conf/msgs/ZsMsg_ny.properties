#license notification email for exceeding usage count for feature
licenseFeaureOnHoldNotifierSubject = Chenjezo la Dongosolo la Zimbra: Malire ogwiritsa ntchito a mbali zina adutsa
licenseFeaureOnHoldNotifierBodyText=Chiwerengero chololedwa cha ma akaunti chafikidwa kapena chadutsa pa mbali zotsatirazi:\n{0}\nMukhoza kuchepetsa kugwiritsa ntchito kwa ogwiritsa ntchito omwe alipo kapena kuwonjezera malire a layisensi ya mbaliyo.\n\nKuti muwonjezere malire a layisensi ya mbaliyo, chonde lemberani Zimbra Sales pa sales@zimbra.com.\nKuti musamalire kugawidwa kwa mbali za akaunti, chonde lowani mu Admin Portal.\n\nChonde dziwani izi:\n1. Mupitiriza kulandira chidziwitsochi kwa masiku {1,number,integer} kuchokera pa tsiku limene kugwiritsa ntchito kudadutsa malire.\n2. Simudzatha kuyambitsa mbali yogwiritsidwa ntchito mopitirira muyeso pa akaunti iliyonse.\n3. Ngati simuchitapo kanthu pa mbali yogwiritsidwa ntchito mopitirira muyeso, mbaliyo idzazimitsidwa kwa ogwiritsa ntchito kuti ibwerere pansi pa malire a layisensi.\n\nMoni,\nZimbra Support
licenseFeaureOnHoldNotifierBodyHtml=<div style="font-family:sans-serif;">Chiwerengero chololedwa cha ma akaunti chafikidwa kapena chadutsa pa mbali zotsatirazi:<br>{0}<br>Mukhoza kuchepetsa kugwiritsa ntchito kwa ogwiritsa ntchito omwe alipo kapena kuwonjezera malire a layisensi ya mbaliyo.<br><br>Kuti muwonjezere malire a layisensi ya mbaliyo, chonde lemberani Zimbra Sales pa <b>sales@zimbra.com</b>.<br>Kuti musamalire kugawidwa kwa mbali za akaunti, chonde lowani mu Admin Portal.<br><br>Chonde dziwani izi:<br>1. Mupitiriza kulandira chidziwitsochi kwa masiku {1,number,integer} kuchokera pa tsiku limene kugwiritsa ntchito kudadutsa malire.<br>2. Simudzatha kuyambitsa mbali yogwiritsidwa ntchito mopitirira muyeso pa akaunti iliyonse.<br>3. Ngati simuchitapo kanthu pa mbali yogwiritsidwa ntchito mopitirira muyeso, mbaliyo idzazimitsidwa kwa ogwiritsa ntchito kuti ibwerere pansi pa malire a layisensi.<br><br>Moni,<br>Zimbra Support</div>

