passwordExpiryNotifierBodyText=Wokondedwa {0},\n\nMawu achinsinsi a akaunti yanu amathera m'masiku {1}, pa {2}.\n\nKuti mupitirize kupeza akaunti yanu, chonde bwezeretsani mawu anu achinsinsi tsiku lotha lisanafike.\n\nMupitiriza kulandira zidziwitso tsiku ndi tsiku mpaka mawu achinsinsi asinthidwe kapena athere.\n\nIyi ndi imelo yodziwitsa yokha.
passwordExpiryNotifierBodyHtml=<p>Wokondedwa {0},</p><p>Mawu achinsinsi a akaunti yanu amathera m'masiku <strong>{1}</strong>, pa <strong>{2}</strong>.</p><p>Kuti mupitirize kupeza akaunti yanu, chonde bwezeretsani mawu anu achinsinsi tsiku lotha lisanafike.</p><p>Mupitiriza kulandira zidziwitso tsiku ndi tsiku mpaka mawu achinsinsi asinthidwe kapena athere.</p><p>Iyi ndi imelo yodziwitsa yokha.</p>

