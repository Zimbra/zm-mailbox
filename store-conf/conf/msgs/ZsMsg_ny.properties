# local config settings

zimbra_home = Muzu wa kuyika kwa Zimbra ndi foda yakunyumba ya wogwiritsa ntchito wa UNIX wa \u2018zimbra\u2019. Simungasunthe muzu wa kuyika - musasinthe zokondazi.
zimbra_java_home = Njira yopitira ku JDK/J2SDK.
zimbra_log_directory = Foda yomwe mafayilo a log amalembedwamo.
zimbra_index_directory = Foda ya mafayilo a index a bokosi la makalata.
zimbra_store_directory = Foda ya mauthenga a bokosi la makalata.
zimbra_db_directory = Foda ya mafayilo a database.
zimbra_tmp_directory = Foda ya mafayilo osakhalitsa.
zimbra_hybrid_blob_mover_enabled = Imakhazikitsa ngati mbali ya Hybrid Blob Mover yatsegulidwa. Zosasinthika ndi: false
zimbra_extensions_directory = Foda yomwe ma subdir ake ali ndi ma extension.
zimbra_extensions_common_directory = Foda yokhala ndi mafayilo a jar omwe amagwiritsidwa ntchito limodzi pa ma extension onse.
zimbra_mysql_shutdown_timeout = Nthawi yodikirira kuti process ya MySQL/MariaDB ya bokosi la makalata ithe. Wonjezerani timeout ngati mysql.server ikutenga nthawi yaitali kwambiri kutseka processyo.
zimbra_mysql_user = Dzina la wogwiritsa ntchito la MySQL logwiritsidwa ntchito kupanga kapena kufikira ma database ndi matebulo a zimbra. Ili ndi mtengo womwe mungapereke ku njira ya \u2018-u\u2019 ya pulogalamu ya mzere wa malamulo ya \u2018mysql\u2019.
zimbra_mysql_password = Mawu achinsinsi a zimbra_mysql_user. Amasungidwa mu local config kuti pulogalamu ya store igwiritse ntchito potsimikizira.  Ngati mukufuna kusintha mawu achinsinsiwa, chonde gwiritsani ntchito pulogalamu ya zmmypasswd yomwe isintha mawu achinsinsiwo mu MySQL ndi mu local config.
zimbra_ldap_userdn = LDAP dn yogwiritsidwa ntchito kutsimikizira pulogalamu ya store ndi LDAP.
zimbra_ldap_user = Dzina la wogwiritsa ntchito la zimbra logwiritsidwa ntchito kutsimikizira ndi admin AuthRequest.
zimbra_ldap_password = Mawu achinsinsi a zimbra_ldap_userdn. Amasungidwa mu local config kuti pulogalamu ya store igwiritse ntchito potsimikizira.  Ngati mukufuna kusintha mawu achinsinsiwa, chonde gwiritsani ntchito pulogalamu ya zmldappasswd yomwe isintha mawu achinsinsiwo mu LDAP ndi mu local config.
zimbra_server_hostname = Dzina lokonzedwa la seva iyi. Payenera kukhala cholowa chofanana cha \u2018server\u2019 mu LDAP - onani zolembedwa za lamulo la CreateServer la pulogalamu ya zmprov.
zimbra_user = Wogwiritsa ntchito wa unix wa zimbra yemwe process ya seva ya zimbra iyenera kusinthira maulamuliro ake, itamangiriza ma port apadera.
zimbra_uid = UID ya unix ya zimbra yomwe process ya seva ya zimbra iyenera kusinthira maulamuliro ake, itamangiriza ma port apadera.
zimbra_gid = GID ya unix ya zimbra yomwe process ya seva ya zimbra iyenera kusinthira maulamuliro ake, itamangiriza ma port apadera.
zimbra_log4j_properties = Njira yopitira ku fayilo ya makonda a log4j properties.
zimbra_log4j_properties_watch = Nthawi ya kuyang'ana fayilo ya makonda a log4j properties mu msec.
zimbra_attrs_directory = Foda yomwe ili ndi mafayilo a *.xml omwe amafotokoza syntax ya ma attribute a LDAP omwe amagwiritsidwa ntchito ndi dongosolo.
localized_msgs_directory = Foda ya mafayilo a mauthenga omasuliridwa.
localized_client_msgs_directory = Foda ya mafayilo a mauthenga a kasitomala omasuliridwa.
skins_directory = Foda ya ma skin.
zimbra_store_sweeper_max_age = Mafayilo akale kuposa mphindi izi amachotsedwa okha ku foda yolowera ya store.
zimbra_store_copy_buffer_size_kb = Ntchito zokopera mafayilo zimagwiritsa ntchito ma buffer a kukula uku.
zimbra_mailbox_galsync_cache = Imakhazikitsa cache yayikulu kwambiri ya zinthu za anthu olumikizana nawo mu bokosi la makalata la galsync. Ikani mtengo wosachepera chiwerengero cha zinthu za anthu olumikizana nawo mu bokosi la makalata la galsync.
zimbra_mailbox_manager_hardref_cache = Chiwerengero chachikulu cha mabokosi a makalata chomwe chidzamangirizidwe mu memory mailbox manager asanayambe kuwalola kuchotsedwa kudzera mu SoftReference garbage collection.
zimbra_mailbox_active_cache = Kukula kwakukulu kwa cache yamkati ya zinthu za LRU ya bokosi la makalata pamene pali ma session ogwira ntchito.
zimbra_mailbox_inactive_cache = Kukula kwakukulu kwa cache yamkati ya zinthu za LRU ya bokosi la makalata pamene palibe ma session ogwira ntchito.
zimbra_mailbox_change_checkpoint_frequency = Kawirikawiri (mwa chiwerengero cha zosintha) komwe mtengo wa kusintha kwa highwater wa ZIMBRA.MAILBOX.CHANGE_CHECKPOINT wa bokosi la makalata umalembedwera.
zimbra_index_elasticsearch_url_base = Base URL ya ElasticSearch REST API.
zimbra_index_threads = Kukula kwa thread pool kwa batch index.
zimbra_reindex_threads = Chiwerengero chachikulu cha ma thread cha re-index. Ma thread a re-index sali pooled.
zimbra_index_disable_perf_counters = Ngati ndi false, Lucene read ndi write IO zimatsatiridwa ndi kuyang'anira magwiridwe antchito kwa Zimbra. Mtengo wa true umalepheretsa kuyang'anira kwa Lucene IO.
zimbra_index_max_readers = Chiwerengero chachikulu cha IndexReaders zomwe zingagwire ntchito nthawi imodzi.
zimbra_index_max_writers = Chiwerengero chachikulu cha IndexWriters zomwe zingagwire ntchito nthawi imodzi.
zimbra_index_reader_cache_size = Chiwerengero chachikulu cha IndexReaders mu cache ya search index.
zimbra_index_reader_cache_ttl = Ngati siligwira ntchito kwa nthawi yoposa mtengo uwu (masekondi), chotsani IndexReader mu cache.
zimbra_index_deferred_items_failure_delay = Pambuyo pa kulephera, kuchedwa kochepa kwambiri (masekondi) pakati pa mayesero ochotsa mndandanda wa zinthu zosalembedwa mu index (deferred).
zimbra_index_lucene_max_terms_per_query = Khazikitsani chiwerengero chachikulu cha ma term ololedwa pa query iliyonse.
zimbra_index_max_transaction_bytes = Pamene mukupanga magulu a ntchito za index mu transaction ya Mailbox, uku ndi kukula kwakukulu kophatikizika kwa zinthu komwe tidzalole mu transaction imodzi.
zimbra_index_max_transaction_items = Pamene mukupanga magulu a ntchito za index, ichi ndi chiwerengero chachikulu cha mail_items chomwe timalola mu transaction imodzi.
zimbra_index_max_pending_deletes = Chiwerengero chachikulu cha ma delete a index odikirira musanabwezeretse malo a disk.
zimbra_index_lucene_merge_policy = true kuti mugwiritse ntchito LogDocMergePolicy, false kuti mugwiritse ntchito LogByteSizeMergePolicy. LogDocMergePolicy imasankha magawo oti aphatikizidwe kutengera chiwerengero cha ma document. LogByteSizeMergePolicy imasankha magawo oti aphatikizidwe kutengera kukula kwake.
zimbra_index_lucene_min_merge = Imakhazikitsa kukula kochepa kwambiri kwa Lucene merge mu ma Document kapena KB kutengera merge policy yomwe yatchulidwa mu zimbra_index_lucene_merge_policy.
zimbra_index_lucene_max_merge = Imakhazikitsa kukula kwakukulu kwa Lucene merge mu ma Document kapena KB kutengera merge policy yomwe yatchulidwa mu zimbra_index_lucene_merge_policy. Mtengowu umatsimikizira gawo lalikulu kwambiri lomwe lingaphatikizidwe ndi magawo ena.
zimbra_index_lucene_merge_factor = Momwe ma segment index amaphatikizidwira pafupipafupi ndi addDocument(). Ndi mitengo yaying'ono, RAM imagwiritsidwa ntchito pang'ono polemba mu index, ndipo kusaka kumakhala mwachangu, koma liwiro la kulemba mu index limachepa. Ndi mitengo yayikulu, RAM imagwiritsidwa ntchito kwambiri polemba mu index, ndipo ngakhale kusaka kumachedwa, kulemba mu index kumakhala mwachangu. Mitengo yayikulu (>10) ndi yabwino popanga batch index, ndipo yaying'ono (<10) pa ma index omwe amasamalidwa mwachindunji.
zimbra_index_lucene_term_index_divisor = Imachepetsa kuchuluka kwa ma term a index omwe amalowetsedwa mu RAM. Pokhazikitsa izi kukhala mtengo > 1 mutha kuchepetsa kugwiritsa ntchito memory, koma kuchedwa pakukweza zambiri za rekodi zosungidwa pa term kudzawonjezeka.
zimbra_index_lucene_use_compound_file = true ngati segment yatsopano ya Lucene iyenera kugwiritsa ntchito compound file format. http://wiki.apache.org/lucene-java/ImproveIndexingSpeed imanena kuti compound file format izimitsidwe kuti magwiridwe antchito akhale abwino, koma izi zidzawonjezera kwambiri chiwerengero cha ma file descriptor. Ma file descriptor angathe kutha ngati zimbra_index_lucene_merge_factor ndi yayikulu.
zimbra_index_lucene_max_buffered_docs = Chiwerengero chochepa kwambiri cha ma document chomwe chikufunika musanayambe kutulutsa ma document a mu memory omwe asungidwa ngati segment yatsopano. Mitengo yayikulu nthawi zambiri imapereka kulemba mu index mwachangu.
zimbra_index_lucene_ram_buffer_size_kb = Lucene Max Buffered RAM mu KB
zimbra_index_lucene_io_impl = Kukhazikitsidwa kwa Lucene FSDirectory kogwiritsidwa ntchito pa indexing IO. Mitengo yotheka ndi nio - Gwiritsani ntchito NIOFSDirectory. Imagwiritsa ntchito positional io ya FileChannel ya java.nio powerenga kuti ipewe synchronization powerenga kuchokera ku fayilo yomweyo. mmap - Gwiritsani ntchito MMapDirectory. Imagwiritsa ntchito memory-mapped IO powerenga. Ndi chisankho chabwino ngati pali virtual memory yokwanira poyerekeza ndi kukula kwa index. simple - Gwiritsani ntchito SimpleFSDirectory. Imagwiritsa ntchito java.io.RandomAccessFile. Ili ndi magwiridwe antchito oipa pa ntchito zambiri chifukwa imachita synchronization pamene ma thread ambiri akuwerenga fayilo yomweyo. Ngati palibe mtengo waperekedwa, FSDirectory idzasankha kukhazikitsidwa kwabwino kwambiri kwa chilengedwechi.
zimbra_index_rfc822address_max_token_count = Chiwerengero chachikulu cha ma token a maadiresi mu RFC822 address token stream. Malirewa amagwira ntchito pa ma header onse a FROM, TO, ndi CC a maimelo, pa ma adiresi onse a imelo a Contacts, ndi pa gawo la Creator la Documents.
zimbra_index_rfc822address_max_token_length = Kutalika kwakukulu kwa token ya adiresi mu RFC822 address token stream. Malirewa amagwira ntchito pa ma header onse a FROM, TO, ndi CC a maimelo, pa ma adiresi onse a imelo a Contacts, ndi pa gawo la Creator la Documents.
zimbra_index_wildcard_max_terms_expanded = Kukula kwakukulu kwa wildcard expansions pa term iliyonse mu query.
zimbra_galsync_index_reader_cache_size = Chiwerengero chachikulu cha IndexReaders mu cache ya GAL search index. Lucene index ya akaunti ya GAL sync imasungidwa payokha popanda kuchotsedwa kokha.
zimbra_spam_report_queue_size = Pa Junk/Not Junk Msg/ConvActionRequests, kukula kwa queue uku kumaletsa server workqueue popanga ma forward.
zimbra_throttle_op_concurrency = Mndandanda wa mitengo ya concurrency yosiyanitsidwa ndi makoma pa magawo 5 a priority kuyambira pa priority yapamwamba mpaka yotsika.
zimbra_im_chat_flush_time = Kodi ma IM chat otseguka amalembedwa ku store pafupipafupi bwanji (masekondi).
zimbra_im_chat_close_time = Kodi seva idzadikira nthawi yaitali bwanji (masekondi) kuti itseke ma session a IM chat osagwira ntchito.
zimbra_http_originating_ip_header = HTTP header yoti muyang'ane kuti mudziwe IP address yoyambirira ya kasitomala.
zimbra_session_limit_imap = Chiwerengero chachikulu cha ma foda a IMAP omwe wogwiritsa ntchito m'modzi angatsegule nthawi imodzi.
zimbra_session_limit_admin = Chiwerengero chachikulu cha ma session a admin SOAP omwe wogwiritsa ntchito m'modzi angatsegule nthawi imodzi.
zimbra_session_limit_soap = Chiwerengero chachikulu cha ma session a SOAP ogwira ntchito pa akaunti iliyonse. Wonjezerani mtengowu mosamala kuti mupewe zolakwika za \u201cToo many SOAP sessions\u201d mu mailbox.log.
zimbra_session_limit_sync = Chiwerengero chachikulu cha ma sync listener pa session iliyonse a ActiveSync. Wonjezerani mtengowu mosamala kuti mupewe zolakwika za \u201cToo many SYNCLISTENER sessions\u201d mu sync.log.
zimbra_session_timeout_soap = Idle timeout (masekondi) ya ma session a SOAP.
zimbra_session_max_pending_notifications = Chiwerengero chachikulu cha zidziwitso zodikirira zomwe zingayikidwe mu queue mu session ya SOAP musanachotsedwe queueyo ndipo kasitomala auzidwe kuti state yake ndi yosavomerezeka.
zimbra_converter_enabled_uuencode = Ngati decoder ya UUENCODE iyenera kuthamangitsidwa potanthauzira mauthenga ochokera ku store.
zimbra_converter_enabled_tnef = Ngati decoder ya TNEF iyenera kuthamangitsidwa potanthauzira mauthenga ochokera ku store.
zimbra_converter_depth_max = Kuzama kwakukulu kwa recursive MIME part komwe pansi pake ma converter sadzagwira ntchito.
zimbra_ssl_enabled = Ngati keystore ya ssl iyenera kukwezedwa kapena ayi.
stats_img_folder = Foda yosungiramo zithunzi za ziwerengero zopangidwa.
ldap_host = LDAP host yoti igwiritsidwe ntchito.  Yachotsedwa ntchito - chonde gwiritsani ntchito ldap_url m'malo mwake.
ldap_log_level = Mulingo wa logging wa LDAP.
ldap_port = Port ya LDAP yoti igwiritsidwe ntchito.  Yachotsedwa ntchito - chonde gwiritsani ntchito ldap_url m'malo mwake.
ldap_url = Mndandanda wa ma seva a LDAP oti seva iyi igwiritse ntchito.
ldap_master_url = URL ya LDAP master.
ldap_is_master = Kodi host iyi ndi seva ya master LDAP?
ldap_root_password = Mawu achinsinsi a rootdn wa LDAP slapd.conf.  Monga kusavuta, pa nthawi yoyambitsa LDAP mawu achinsinsi osasankhidwa amapangidwa, amasungidwa mu local config ndi mu slapd.conf.  Ngati mukufuna kusintha mawu achinsinsiwa, chonde gwiritsani ntchito pulogalamu ya zmldappasswd yomwe isintha mawu achinsinsiwo mu slapd.conf ndi mu local config.
ldap_connect_timeout = Mamilisekondi omwe pambuyo pake kuyesa kulumikizana kumasiya.
ldap_read_timeout = Mamilisekondi omwe pambuyo pake kuyesa kuwerenga kumasiya.
ldap_deref_aliases = Ngati ma alias ayenera kutsatiridwa pofufuza kapena kumangirira ku external directory. Mitengo yolondola ndi: always, never, finding, searching
ldap_connect_pool_master = Ngati mugwiritse ntchito JNDI connection pooling pa LDAP master.
ldap_connect_pool_debug = Ngati muyenera kuchita debug ya LDAP connection pooling.
ldap_connect_pool_initsize = Chiwerengero choyambirira cha ma connection a LDAP ogwira ntchito oti mukulitse kufikako.
ldap_connect_pool_maxsize = Chiwerengero chachikulu cha ma connection a LDAP ogwira ntchito ndi osagwira ntchito ololedwa.
ldap_connect_pool_prefsize = Chiwerengero chokondedwa cha ma connection a LDAP - kukhazikitsa maxsize ndi prefsize kukhala mtengo womwewo kumasunga connection pool pa kukula kokhazikika.
ldap_connect_pool_timeout = Mamilisekondi a nthawi yosagwira ntchito musanatulutse idle connection mu pool.
ldap_connect_pool_health_check_on_checkout_enabled = Ngati kuyang'ana thanzi la connection pool kuyenera kuyitanidwa nthawi iliyonse yomwe connection ikufuna kutulutsidwa kuti igwiritsidwe ntchito. Ngati kuyang'ana thanzi kwa OnCheckout kwatsegulidwa, kuyang'ana thanzi kwa nthawi ndi nthawi kumbuyo kudzazimitsidwa.
ldap_connect_pool_health_check_interval_millis = Kutalika kwa nthawi mu mamilisekondi pakati pa kuyang'ana thanzi kwa kumbuyo kwa nthawi ndi nthawi pa ma connection omwe alipo mu connection pool.
ldap_connect_pool_health_check_max_response_time_millis = Kutalika kwakukulu kwa nthawi mu mamilisekondi komwe kuyankhulira kwa kuyang'ana thanzi kuyenera kuloledwa kubwera kuchokera ku seva ya LDAP.
ldap_replication_password = Mawu achinsinsi ogwiritsidwa ntchito ndi wogwiritsa ntchito wa syncrepl kutsimikizira ku ldap master.
ldap_postfix_password = Mawu achinsinsi ogwiritsidwa ntchito ndi postfix kutsimikizira ku ldap.
ldap_amavis_password = Mawu achinsinsi ogwiritsidwa ntchito ndi amavis kutsimikizira ku ldap.
ldap_starttls_supported = Ngati seva ya LDAP imathandiza ntchito ya startTLS.
ldap_require_tls = Ngati TLS ikufunika kwa makasitomala a LDAP.
ldap_cache_account_maxsize = Chiwerengero chachikulu cha ma object a akaunti oti asungidwe mu cache.
ldap_cache_account_maxage = Nthawi yayitali kwambiri (mumphindi) yosungira ma object a akaunti mu cache.
ldap_cache_cos_maxsize = Chiwerengero chachikulu cha ma object a cos oti asungidwe mu cache.
ldap_cache_cos_maxage = Nthawi yayitali kwambiri (mumphindi) yosungira ma object a cos mu cache.
ldap_cache_domain_maxsize = Chiwerengero chachikulu cha ma object a domain oti asungidwe mu cache.
ldap_cache_domain_maxage = Nthawi yayitali kwambiri (mumphindi) yosungira ma object a domain mu cache.
ldap_cache_mime_maxage = Nthawi yayitali kwambiri, mumphindi, yosungira ma object a MIME mu cache.
ldap_cache_server_maxsize = Chiwerengero chachikulu cha ma object a seva oti asungidwe mu cache.
ldap_cache_server_maxage = Nthawi yayitali kwambiri (mumphindi) yosungira ma object a gulu mu cache.
ldap_cache_share_locator_maxsize = Chiwerengero chachikulu cha zinthu za akaunti mu named entry cache.
ldap_cache_share_locator_maxage = TTL ya named entry cache mumphindi.
ldap_cache_timezone_maxsize = Chiwerengero chachikulu cha ma object a timezone oti asungidwe mu cache.
ldap_cache_zimlet_maxsize = Chiwerengero chachikulu cha ma object a zimlet oti asungidwe mu cache.
ldap_cache_zimlet_maxage = Nthawi yayitali kwambiri (mumphindi) yosungira ma object a zimlet mu cache.
ldap_cache_custom_dynamic_group_membership_maxage_ms = Nthawi yayitali kwambiri (mu mamilisekondi) yosungira mu cache magulu a dynamic omwe akaunti ili membala wake pa magulowo omwe umembala wake umatsimikizidwa pogwiritsa ntchito MemberURL yapadera.
csrf_filter_domain_allowed_ref_hosts_max_size = Chiwerengero chachikulu cha zolowa za domain mu cache ya allowedRefererHosts ya per-domain ya CsrfFilter. Imabwerera ku ldap_cache_domain_maxsize pakakhala cholakwika pomasulira.
csrf_filter_domain_allowed_ref_hosts_cache_expiry_mins = Nthawi yayitali kwambiri (mumphindi) ya zolowa mu cache ya allowedRefererHosts ya per-domain ya CsrfFilter. Ikatha nthawi, cholowacho chimachotsedwa ndipo chimakwezedwanso kuchokera ku LDAP pa pempho lotsatira. Imabwerera ku mphindi 60 pakakhala cholakwika pomasulira.
mysql_directory = Malo a kuyikidwa kwa MySQL.
mysql_data_directory = Foda yomwe data ya MySQL iyenera kukhala.
mysql_errlogfile = Log yolakwika ya MySQL/MariaDB.
mysql_socket = Njira yopitira ku socket ya MySQL yogwiritsidwa ntchito ndi zida za mzere wa malamulo za MySQL.
mysql_pidfile = Fayilo yomwe process id ya MySQL imasungidwamo.
mysql_mycnf = Njira yopitira ku my.cnf, fayilo ya makonda a MySQL.
mysql_bind_address = Interface pa host iyi yomwe MySQL idzamangepo.
mysql_port = Nambala ya port yomwe seva ya MySQL iyenera kumvetsera.
mysql_root_password = Mawu achinsinsi a wogwiritsa ntchito wa \u2018root\u2019 womangidwa mkati wa MySQL, osasokonezedwa ndi login ya UNIX root.  Monga kusavuta, pa nthawi yoyambitsa database mawu achinsinsi osasankhidwa amapangidwa, amasungidwa mu local config ndi mu MySQL.  Ngati mukufuna kusintha mawu achinsinsiwa, chonde gwiritsani ntchito pulogalamu ya zmmypasswd yomwe isintha mawu achinsinsiwo mu MySQL ndi mu local config.
mysql_memory_percent = Peresenti ya memory ya dongosolo yomwe mysql iyenera kugwiritsa ntchito. Mtengowu umasungidwa pano kuti ugwiritsidwe ntchito ndi pulogalamu ya zmmycnf. Kusintha zokondazi sikuwonekera nthawi yomweyo mu seva ya MySQL. Muyenera, mosamala kwambiri, kupanga my.cnf kachiwiri ndi kuyambitsanso seva ya MySQL kuti kusinthako kugwire ntchito.
mysql_innodb_log_buffer_size = Onani zolembedwa za MySQL pa innodb_log_buffer_size. Mtengowu umasungidwa pano kuti ugwiritsidwe ntchito ndi pulogalamu ya zmmycnf. Kusintha zokondazi sikuwonekera nthawi yomweyo mu seva ya MySQL. Muyenera, mosamala kwambiri, kupanga my.cnf kachiwiri ndi kuyambitsanso seva ya MySQL kuti kusinthako kugwire ntchito.
mysql_innodb_log_file_size = Onani zolembedwa za MySQL pa innodb_log_file_size. Mtengowu umasungidwa pano kuti ugwiritsidwe ntchito ndi pulogalamu ya zmmycnf. Kusintha zokondazi sikuwonekera nthawi yomweyo mu seva ya MySQL. Muyenera, mosamala kwambiri, kupanga my.cnf kachiwiri ndi kuyambitsanso seva ya MySQL kuti kusinthako kugwire ntchito.
mysql_sort_buffer_size = Onani zolembedwa za MySQL pa sort_buffer_size. Mtengowu umasungidwa pano kuti ugwiritsidwe ntchito ndi pulogalamu ya zmmycnf. Kusintha zokondazi sikuwonekera nthawi yomweyo mu seva ya MySQL. Muyenera, mosamala kwambiri, kupanga my.cnf kachiwiri ndi kuyambitsanso seva ya MySQL kuti kusinthako kugwire ntchito.
mysql_read_buffer_size = Onani zolembedwa za MySQL pa read_buffer_size. Mtengowu umasungidwa pano kuti ugwiritsidwe ntchito ndi pulogalamu ya zmmycnf. Kusintha zokondazi sikuwonekera nthawi yomweyo mu seva ya MySQL. Muyenera, mosamala kwambiri, kupanga my.cnf kachiwiri ndi kuyambitsanso seva ya MySQL kuti kusinthako kugwire ntchito.
mysql_backup_retention = Chiwerengero cha masinthidwe a backup ya database ya mysql oti asungidwe.
antispam_mysql_enabled = Gwiritsani ntchito database ya mysql pa antispam.  Zosasinthika ndi False.
antispam_backup_retention = Chiwerengero cha masinthidwe a backup ya database ya antispam oti asungidwe.
derby_properties = Njira yopitira ku fayilo ya derby configuration properties.
imap_max_consecutive_error = Ngati ndi yoposa 0, dulani kulumikizana kwa IMAP ngati mtengo wa imap_max_consecutive_error wafika.
imap_inactive_session_cache_size = Ehcache: chiwerengero chachikulu cha zolowetsa za cache ya IMAP zosagwira ntchito pa diski zisanachotsedwe.
imap_use_ehcache = Ngati ndi zoona, gwiritsani ntchito Ehcache posunga cache ya gawo la IMAP. Apo ayi, gwiritsani ntchito cache ya pa diski.
imap_write_timeout = Khazikitsani nthawi yodikira yolemba ya gawo la IMAP (nio).
imap_write_chunk_size = Kukula kwa buffer yolembera ya IMAP m'mabayiti.
imap_thread_keep_alive_time = Nthawi yokhazikika, m'masekondi, ya thread ya IMAP.
imap_throttle_ip_limit = Ngati ndi yoposa 0, kuchuluka kwakukulu kwa zopempha za IMAP pa sekondi pa IP iliyonse.
imap_throttle_acct_limit = Ngati ndi yoposa 0, kuchuluka kwakukulu kwa zopempha za IMAP pa sekondi pa akaunti iliyonse.
imap_suggested_batch_copy_size = Chiwerengero cha mauthenga oti akonzedwe pa batch iliyonse pa ntchito za IMAP COPY.
imap_in_progress_response_thread_pool_size = Chiwerengero chachikulu cha ma thread mu pool yotumizira yankho la InProgress kwa kasitomala.
imap_in_progress_response_thread_keep_alive = Nthawi m'masekondi yomwe thread imasungidwa ikugwira ntchito isanathe.
imap_ehcache_heap_size = Chiwerengero chachikulu cha zolowetsa za cache ya IMAP zosungidwa mu gawo la heap la Ehcache.
imap_ehcache_skip_large_folder = Ikayatsidwa, imadumpha kusunga ma foda akulu a IMAP mu Ehcache.
imap_ehcache_folder_max_message_count = Malire a chiwerengero cha mauthenga omwe akapitilira, ma foda a IMAP sasungidwa mu Ehcache.
nio_imap_enabled = Ngati ndi zoona, yambitsani Jetty non-blocking IO ya IMAP.
nio_pop3_enabled = Ngati ndi zoona, yambitsani Jetty non-blocking IO ya POP3.
postfix_mail_owner = postfix_mail_owner
postfix_setgid_group = postfix_setgid_group
postfix_version = postfix_version
mailboxd_directory = Malo a kuyikidwa kwa mailboxd.
mailboxd_java_heap_size = Chiwerengero cha ma megabyte ogwiritsidwa ntchito ngati kukula kwakukulu kwa Java heap (-Xmx) kwa JVM yomwe ikuyendetsa Mailboxd.
mailboxd_java_heap_new_size_percent = Peresenti ya kukula kwa Java heap yomwe igwiritsidwe ntchito pa young generation (-Xmn) ya JVM yomwe ikuyendetsa Mailboxd.
mailboxd_java_options = Zosankha za JVM zogwiritsidwa ntchito poyambitsa Mailboxd.
mailboxd_pidfile = Fayilo yomwe process id ya Mailboxd JVM imasungidwamo.
mailboxd_keystore = Malo a fayilo ya deta ya keystore.
mailboxd_keystore_password = Mawu achinsinsi ogwiritsidwa ntchito ndi keystore ya KeyManager.
mailboxd_truststore = Malo a fayilo ya deta ya truststore.
mailboxd_truststore_password = Mawu achinsinsi ogwiritsidwa ntchito ndi keystore ya TrustManager.
client_ssl_truststore = Malo a fayilo ya deta ya truststore yomwe imagwiritsidwa ntchito pa kutsimikizira kwa kasitomala kwa SSL.
client_ssl_truststore_password = Mawu achinsinsi ogwiritsidwa ntchito ndi keystore ya TrustManager ya SSL ya kasitomala.
mailboxd_output_file = Fayilo yolandirira stdout ndi stderr za seva zomwe zasinthidwira.
mailboxd_output_rotate_interval = Nthawi, m'masekondi, yomwe fayilo yotulutsa ya mailboxd imazunguliridwa. Ngati <= 0, palibe kuzungulira komwe kumachitika.
mailboxd_thread_stack_size = Kukula kwa thread stack kwa Mailboxd.
ssl_allow_untrusted_certs = Ngati ndi zoona, lolani satifiketi za SSL zodzisaina.
zimlet_directory = Njira yopita ku ma Zimlet oyikidwa.
calendar_outlook_compatible_allday_events = Gwiritsani ntchito zochitika za tsiku lonse zogwirizana ndi Outlook. False mwachisawawa.
calendar_entourage_compatible_timezones = Ikani TZID parameter m'ma mawu otsekera mu katundu wa iCalendar kuti muthane ndi vuto la MS Entourage. True mwachisawawa.
calendar_ics_import_full_parse_max_size = Pa kulowetsa kwa ics, gwiritsani ntchito full parser ngati kukula kwa ics kuli kochepera kapena kofanana ndi izi; mafayilo akulu a ics amakonzedwa ndi callback parser yomwe salola ma forward reference ku VTIMEZONE TZID.
calendar_canonical_tzid = ID ya timezone yobwezedwa ngati TimeZone.getCanonicalID(). Mitengo yotheka: "olson","windows","java". "windows" mwachisawawa.
calendar_cache_enabled = Yambitsani cache ya kalendala. False mwachisawawa.
calendar_cache_directory = Chikwatu chachikulu cha mafayilo a cache ya kalendala.
calendar_cache_lru_size = Kukula kwa memory-cache LRU. Sungani ma foda a kalendala ochuluka chonchi mu memory.
calendar_cache_range_month_from = Mwezi woyambira mu range yosungidwa mu cache. 0 amatanthauza mwezi uno, -1 amatanthauza mwezi watha, ndi zina.
calendar_cache_range_months = Chiwerengero cha miyezi mu range yosungidwa mu cache.
krb5_keytab = Malo a fayilo ya keytab ya Zimbra Kerberos 5.
krb5_debug_enabled = Yambitsani debugging ya Kerberos.
zimbra_mtareport_max_hosts = Chiwerengero chachikulu cha ma host oti aphatikizidwe mu malipoti a tsiku ndi tsiku a MTA opangidwa ndi zmdailyreport.
zimbra_mtareport_max_recipients = Chiwerengero cha olandira oti alembedwe mu malipoti a tsiku ndi tsiku a mta.
zimbra_mtareport_max_senders = Chiwerengero cha otumiza oti alembedwe mu malipoti a tsiku ndi tsiku a mta.
zimbra_mtareport_max_users = Chiwerengero chachikulu cha ogwiritsa ntchito oti aphatikizidwe mu malipoti a tsiku ndi tsiku a MTA opangidwa ndi zmdailyreport.
zimbra_auth_always_send_refer = Nthawi zonse tumizani tag ya <refer> mu yankho la auth kuti mukakamize redirect ya kasitomala.
zimbra_admin_service_port = Port ya admin ya default/bootstrap.
zimbra_admin_service_scheme = Scheme ya protocol ya admin ya default/bootstrap.
zimbra_mail_service_port = Port ya makalata ya default.
zimbra_zmprov_default_to_ldap = Kaya zmprov imagwiritsa ntchito LDAP kapena SOAP mwachisawawa.
zimbra_zmprov_default_soap_server = Seva ya soap ya default yomwe zmprov imalumikizana nayo.
zmprov_safeguarded_attrs = Mndandanda wogawidwa ndi makoma wa ma attribute a provisioning okhala ndi mitengo ingapo omwe ayenera kutetezedwa kuti asasinthidwe.
zmprov_tmp_directory = Chikwatu cha kanthawi cha zmprov cholembera mitengo ya ma attribute a binary ku mafayilo.
zimbra_mailbox_groups = Chiwerengero cha magulu a mailbox ogawira ma mailbox atsopano.
debug_mailboxindex_use_new_locking = Gwiritsani ntchito locking ya mtundu watsopano pa MailboxIndex.
zimbra_class_provisioning = Kalasi ya provisioning interface.
zimbra_class_accessmanager = Kalasi ya access manager interface.
zimbra_class_mboxmanager = Kalasi ya mailbox manager interface.
zimbra_class_database = Kalasi ya kasinthidwe ka database.
zimbra_class_store = Kalasi ya message store interface.
zimbra_class_application = Kalasi ya Zimbra application interface.
zimbra_class_rulerewriterfactory = Kalasi ya RuleRewriterFactory interface.
zimbra_class_dbconnfactory = Kalasi ya database connection factory.
zimbra_class_soapsessionfactory= Kalasi ya soap session factory.
av_notify_user = Adiresi ya imelo yotumizira mauthenga a oyang'anira kuchokera ku anti-virus ndi DKIM.
