debug_xmpp_disable_client_tls = gbany\u1ee5\u1ecd TLS maka pr\u1ecdt\u1ecd\u1ecdk\u1ecd XMPP C2S
im_dnsutil_dnsoverride = Nt\u1ecdala DNS override maka IM federation, n\u2019\u1ee5d\u1ecb \u2018{domain,host:port},{domain,host:port},...\u2019
javamail_pop3_debug = Ma a ga-agbanye JavaMail debug maka POP3.
javamail_zparser = Ma a ga-eji parser MIME Zimbra kama nke JavaMail.
javamail_imap_debug = Ma a ga-agbanye JavaMail debug maka IMAP.
javamail_smtp_debug = Ma a ga-agbanye JavaMail debug maka SMTP.
javamail_pop3_timeout = Oge ngw\u1ee5cha POP3 na sek\u1ecdnd.
javamail_imap_timeout = Oge ngw\u1ee5cha IMAP na sek\u1ecdnd.
javamail_smtp_timeout = Oge ngw\u1ee5cha SMTP na sek\u1ecdnd.
javamail_pop3_enable_starttls = Ma a ga-agbanye STARTTLS maka POP3.
javamail_imap_enable_starttls = Ma a ga-agbanye STARTTLS maka IMAP.
javamail_smtp_enable_starttls = Ma a ga-agbanye STARTTLS maka SMTP.
jdbc_results_streaming_enabled = \u1ecc b\u1ee5r\u1ee5 na \u1ecd b\u1ee5 eziokwu, a ga-as\u1ecdba data site na databesi maka aj\u1ee5j\u1ee5 nd\u1ecb nwere ike iweghachi nnukwu set\u1ecbp\u1ee5 nsonaaz\u1ee5.
zimbra_lmtp_validate_messages = \u1ecc b\u1ee5r\u1ee5 na \u1ecd b\u1ee5 eziokwu, nyochaa \u1ecdd\u1ecbnaya nke ozi LMTP na-abata.
zimbra_message_validation_max_line_length = \u1ecc b\u1ee5r\u1ee5 na zimbra_lmtp_validate_messages b\u1ee5 eziokwu, laghachite ozi nd\u1ecb nwere ah\u1ecbr\u1ecb kar\u1ecbr\u1ecb \u1ecdn\u1ee5 \u1ecdg\u1ee5g\u1ee5 bayt a.
smtp_host_retry_millis = \u1eccn\u1ee5 \u1ecdg\u1ee5g\u1ee5 milisek\u1ecdnd ichere tupu \u1ecbnwa \u1ecdz\u1ecd mgbe njik\u1ecd SMTP host dara.
conversation_max_age_ms = Ogo kacha elu nke oge mkpar\u1ecbta \u1ee5ka ga-an\u1ecdgide mepere emepe, na milisek\u1ecdnd.
data_source_scheduling_enabled = Ma a ga-emek\u1ecdr\u1ecbta isi data na-akpagh\u1ecb aka nke nwere etinyere interval polling.
text_attachments_base64 = \u1ecc b\u1ee5r\u1ee5 na \u1ecd b\u1ee5 eziokwu, koodu ihe e kenyere ederede niile d\u1ecb ka base64 mgbe niile.
cli_httpclient_soaphttptransport_so_timeout = Oge ngw\u1ee5cha s\u1ecdket na milisek\u1ecdnd maka klayent\u1ecb SOAP nke ngwa \u1ecdr\u1ee5 cli na-eji klas SoapHttpTransport.
client_use_native_proxy_selector = Ma a ga-eji koodu native g\u1ee5\u1ecd data proxy sistem\u1ee5.
client_use_system_proxy = Ma a ga-eji proxy sistem\u1ee5.
contact_ranking_enabled = Gbanye teb\u1ee5l \u1ecdkwa k\u1ecdntakt\u1ecb.
data_source_config = \u1ee4z\u1ecd gaa na fa\u1ecbl\u1ee5 nhazi datasource.
httpclient_internal_client_connection_timeout = httpclient client maka njik\u1ecd ime Zimbra: na-edobe oge ngw\u1ee5cha na milisek\u1ecdnd a na-eji mgbe a na-enweta njik\u1ecd HTTP site na njikwa njik\u1ecd HTTP.
httpclient_internal_connmgr_connection_timeout = httpclient connection manager maka njik\u1ecd ime Zimbra: na-ekpebi oge ngw\u1ee5cha ruo mgbe e guzobere njik\u1ecd. Uru efu p\u1ee5tara na a nagh\u1ecb eji oge ngw\u1ee5cha ah\u1ee5.
httpclient_internal_connmgr_idle_reaper_connection_timeout = idle reaper nke httpclient connection manager maka njik\u1ecd ime Zimbra: uru oge ngw\u1ee5cha a ga-eji mgbe a na-anwale njik\u1ecd na-ad\u1ecbgh\u1ecb ar\u1ee5 \u1ecdr\u1ee5.
httpclient_internal_connmgr_idle_reaper_sleep_interval = idle reaper nke httpclient connection manager maka njik\u1ecd ime Zimbra: oge (na milisek\u1ecdnd) thred reaper njik\u1ecd na-ad\u1ecbgh\u1ecb ar\u1ee5 \u1ecdr\u1ee5 nke njikwa njik\u1ecd http client na-ehi n\u2019etiti \u1ecdr\u1ee5. 0 p\u1ee5tara na agbany\u1ee5r\u1ee5 thred reaper.
httpclient_internal_connmgr_max_host_connections = httpclient connection manager maka njik\u1ecd ime Zimbra: na-ak\u1ecdwa \u1ecdn\u1ee5 \u1ecdg\u1ee5g\u1ee5 kacha elu nke njik\u1ecd ekwekwara kwa nhazi host.
httpclient_internal_connmgr_max_total_connections = httpclient connection manager maka njik\u1ecd ime Zimbra: na-ak\u1ecdwa \u1ecdn\u1ee5 \u1ecdg\u1ee5g\u1ee5 kacha elu nke njik\u1ecd ekwekwara n\u2019ozuzu.
httpclient_internal_connmgr_so_timeout = httpclient connection manager maka njik\u1ecd ime Zimbra: a na-ak\u1ecdwa uru oge ngw\u1ee5cha efu d\u1ecbka oge ngw\u1ee5cha na-enwegh\u1ecb njedebe. A na-eji uru a mgbe e nwegh\u1ecb oge ngw\u1ee5cha s\u1ecdket etinyere na paraamita usoro HTTP.
httpclient_internal_connmgr_tcp_nodelay = httpclient connection manager maka njik\u1ecd ime Zimbra: na-ak\u1ecdwa ma a ga-agbany\u1ee5 alg\u1ecdridim Nagle na s\u1ecdket HTTP.
httpclient_internal_connmgr_stale_connection_check = httpclient connection manager maka njik\u1ecd ime Zimbra: na-ekpebi ma a ga-eji nyocha njik\u1ecd ochie. Igbany\u1ee5 nyocha njik\u1ecd ochie nwere ike iweta ntak\u1ecbr\u1ecb mmezi ar\u1ee5m\u1ecdr\u1ee5, ma \u1ecd nwere ihe ize nd\u1ee5 nke \u1ecbnweta njehie I/O mgbe a na-eme ar\u1ecbr\u1ecb\u1ecd site na njik\u1ecd sava mechiri.
httpclient_external_client_connection_timeout = httpclient client maka njik\u1ecd mp\u1ee5ga: na-edobe oge ngw\u1ee5cha na milisek\u1ecdnd a na-eji mgbe a na-enweta njik\u1ecd HTTP site na njikwa njik\u1ecd HTTP. Igbany\u1ee5 nyocha njik\u1ecd ochie nwere ike iweta ntak\u1ecbr\u1ecb mmezi ar\u1ee5m\u1ecdr\u1ee5, ma \u1ecd nwere ihe ize nd\u1ee5 nke \u1ecbnweta njehie I/O mgbe a na-eme ar\u1ecbr\u1ecb\u1ecd site na njik\u1ecd sava mechiri.
httpclient_external_connmgr_connection_timeout = httpclient connection manager maka njik\u1ecd mp\u1ee5ga: na-ekpebi oge ngw\u1ee5cha ruo mgbe e guzobere njik\u1ecd. Uru efu p\u1ee5tara na a nagh\u1ecb eji oge ngw\u1ee5cha ah\u1ee5.
httpclient_external_connmgr_idle_reaper_connection_timeout = idle reaper nke httpclient connection manager maka njik\u1ecd mp\u1ee5ga: uru oge ngw\u1ee5cha a ga-eji mgbe a na-anwale njik\u1ecd na-ad\u1ecbgh\u1ecb ar\u1ee5 \u1ecdr\u1ee5.
httpclient_external_connmgr_idle_reaper_sleep_interval = idle reaper nke httpclient connection manager maka njik\u1ecd mp\u1ee5ga: oge (na milisek\u1ecdnd) thred reaper njik\u1ecd na-ad\u1ecbgh\u1ecb ar\u1ee5 \u1ecdr\u1ee5 nke njikwa njik\u1ecd http client na-ehi n\u2019etiti \u1ecdr\u1ee5. 0 p\u1ee5tara na agbany\u1ee5r\u1ee5 thred reaper.
httpclient_external_connmgr_max_host_connections = httpclient connection manager maka njik\u1ecd mp\u1ee5ga: na-ak\u1ecdwa \u1ecdn\u1ee5 \u1ecdg\u1ee5g\u1ee5 kacha elu nke njik\u1ecd ekwekwara kwa nhazi host.
httpclient_external_connmgr_max_total_connections = httpclient connection manager maka njik\u1ecd mp\u1ee5ga: na-ak\u1ecdwa \u1ecdn\u1ee5 \u1ecdg\u1ee5g\u1ee5 kacha elu nke njik\u1ecd ekwekwara n\u2019ozuzu.
httpclient_external_connmgr_so_timeout = httpclient connection manager maka njik\u1ecd mp\u1ee5ga: a na-ak\u1ecdwa uru oge ngw\u1ee5cha efu d\u1ecbka oge ngw\u1ee5cha na-enwegh\u1ecb njedebe. A na-eji uru a mgbe e nwegh\u1ecb oge ngw\u1ee5cha s\u1ecdket etinyere na paraamita usoro HTTP.
httpclient_external_connmgr_tcp_nodelay = httpclient connection manager maka njik\u1ecd mp\u1ee5ga: na-ak\u1ecdwa ma a ga-agbany\u1ee5 alg\u1ecdridim Nagle na s\u1ecdket HTTP.
httpclient_external_connmgr_stale_connection_check = httpclient connection manager maka njik\u1ecd mp\u1ee5ga: na-ekpebi ma a ga-eji nyocha njik\u1ecd ochie.
httpclient_convertd_so_timeout = Oge ngw\u1ee5cha s\u1ecdket na milisek\u1ecdnd maka klayent\u1ecb convertd. \u1ecc b\u1ee5r\u1ee5 na \u1ecd b\u1ee5 0, \u1ecd p\u1ee5tara na e nwegh\u1ecb oge ngw\u1ee5cha. \u1ecc b\u1ee5r\u1ee5 na \u1ecd b\u1ee5 -1 ma \u1ecd b\u1ee5 na edogh\u1ecb ya, \u1ecd p\u1ee5tara iji oge ngw\u1ee5cha ag\u1ee5 ndabara nke njikwa njik\u1ecd.
httpclient_convertd_keepalive_connections = Na-ak\u1ecdwa ma a ga-eji njik\u1ecd HTTP keep-alive maka klayent\u1ecb convertd.
httpclient_soaphttptransport_retry_count = Na-ak\u1ecdwa \u1ecdn\u1ee5\u1ecdg\u1ee5 ugboro a ga-anwale \u1ecdz\u1ecd mgbe \u1ecdd\u1ecbda nwa oge mere maka nd\u1ecb ah\u1ecba SOAP na-eji klas SoapHttpTransport.
httpclient_soaphttptransport_so_timeout = Oge nkw\u1ee5s\u1ecb soket na milisek\u1ecdnd maka nd\u1ecb ah\u1ecba SOAP na-eji klas SoapHttpTransport.
httpclient_soaphttptransport_keepalive_connections = Na-ak\u1ecdwa ma a ga-eji njik\u1ecd HTTP keep-alive maka mbufe HTTP SOAP.
ldap_starttls_required = Ma starttls d\u1ecb mkpa maka onye ah\u1ecba java ldap mgbe \u1ecd na-emep\u1ee5ta njik\u1ecd na sava ldap Zimbra.
mailboxd_keystore_base = Keystore a ga-eji maka ngwa java cli na nod\u1ee5 nd\u1ecb na-ab\u1ee5gh\u1ecb zimbra-store.
networkaddress_cache_ttl = Uru maka njirimara java.security.Security networkaddress.cache.ttl, nke a na-edobe site na njirimara usoro JVM -Dsun.net.inetaddr.ttl. \u1eccn\u1ee5\u1ecdg\u1ee5 sek\u1ecdnd a ga-echekwa nch\u1ecdta adrees\u1ecb IP nke aha nnabata gara nke \u1ecdma site na \u1ecdr\u1ee5 aha.
out_of_disk_error_unix = Eriri ozi IOException maka njehie enwegh\u1ecb ohere diski na sistem\u1ee5 ar\u1ee5m\u1ecdr\u1ee5 Unix.
out_of_disk_error_windows = Eriri ozi IOException maka njehie enwegh\u1ecb ohere diski na Windows.
purge_initial_sleep_ms = Ogo oge (na milisek\u1ecdnd) eriri purge na-ehi mgbe mmalite gas\u1ecbr\u1ecb tupu \u1ecdmalite \u1ecdr\u1ee5.
servlet_max_concurrent_http_requests_per_account = \u1eccn\u1ee5\u1ecdg\u1ee5 kacha elu nke ar\u1ecbr\u1ecb\u1ecd HTTP kwa aka\u1ee5nt\u1ee5 tupu ZimbraQoSFilter kw\u1ee5s\u1ecb ar\u1ecbr\u1ecb\u1ecd nd\u1ecb \u1ecdz\u1ecd. Nke a kwek\u1ecdr\u1ecd na \u1ecbd\u1ecd aka na nt\u1ecb "Exceeded the max requests limit. Suspending..." d\u1ecb na mailbox.log.
servlet_max_concurrent_requests_per_session = \u1eccn\u1ee5\u1ecdg\u1ee5 kacha elu nke ar\u1ecbr\u1ecb\u1ecd HTTP na-eme n\u2019otu oge kwa nn\u1ecdk\u1ecd HTTP (0 p\u1ee5tara enwegh\u1ecb oke). Mgbanwe ga-ar\u1ee5 \u1ecdr\u1ee5 malite na nn\u1ecdk\u1ecd \u1ecdh\u1ee5r\u1ee5.
shared_mime_info_globs = Fa\u1ecbl\u1ee5 glob nke freedesktop.org shared-mime-info.
shared_mime_info_magic = Fa\u1ecbl\u1ee5 magic nke freedesktop.org shared-mime-info.
soap_response_buffer_size = Nha nke nchekwa \u1ecdd\u1ecbnaya eji eziga nzaghachi HTTP SOAP. \u1ecc b\u1ee5r\u1ee5 na a nagh\u1ecb edo ya, jiri ndabara Jetty.
soap_response_chunked_transfer_encoding_enabled = Na-agbany\u1ee5\u1ecd nzaghachi SOAP chunked.
socket_connect_timeout = Oge nkw\u1ee5s\u1ecb ndabara maka ijik\u1ecd soket na milisek\u1ecdnd.
socket_so_timeout = Oge nkw\u1ee5s\u1ecb ndabara nke soket SO na milisek\u1ecdnd.
socks_enabled = Gbanyee nkwado nh\u1ecdr\u1ecd maka onye ah\u1ecba SOCKS.
ssl_allow_accept_untrusted_certs = Kwe ka onye \u1ecdr\u1ee5 nabata asambodo a na-at\u1ee5kwas\u1ecbgh\u1ecb obi.
ssl_allow_mismatched_certs = Kwe ka asambodo na-adabagh\u1ecb adaba (gbany\u1ee5\u1ecd nkwenye aha nnabata).
xmpp_client_compression_policy = Mkpak\u1ecd XMPP C2S: nh\u1ecdr\u1ecd|agbany\u1ee5r\u1ee5.
xmpp_client_idle_timeout = Oge nkw\u1ee5s\u1ecb mgbe onye ah\u1ecba XMPP anagh\u1ecb ar\u1ee5 \u1ecdr\u1ee5.
xmpp_client_write_timeout = Oge nkw\u1ee5s\u1ecb maka soket onye ah\u1ecba e jidere mgbe a na-ede.
xmpp_cloudrouting_idle_timeout = Oge nkw\u1ee5s\u1ecb ezumike nke soket CloudRouting.
xmpp_dns_override = Dochie DNS maka sava XMPP, ndep\u1ee5ta ndenye e kewara na k\u1ecdma n\u2019\u1ee5d\u1ecb "{domain:hostname:port}".
xmpp_muc_default_history_type = XMPP Multi-User-Chat: nt\u1ecdala ndek\u1ecd ndabara maka ime \u1ee5l\u1ecd MUC: none|all|number.
xmpp_muc_discover_locked = Ar\u1ecbr\u1ecb\u1ecd MUC Disco h\u00e0 kwes\u1ecbr\u1ecb iweghachite ime \u1ee5l\u1ecd akp\u1ecdchiri akp\u1ecdchi?
xmpp_muc_enabled = Gbanyee \u1ecdr\u1ee5 XMPP Multi-User-Chat?
xmpp_muc_history_number = \u1eccn\u1ee5\u1ecdg\u1ee5 ndabara nke ozi nkata a ga-echekwa (ma \u1ecd b\u1ee5r\u1ee5 na \u1ee5d\u1ecb ak\u1ee5k\u1ecd ihe mere eme b\u1ee5 number).
xmpp_muc_idle_user_sweep_ms = Ugboro ole a ga-enyocha MUC maka nd\u1ecb \u1ecdr\u1ee5 na-ad\u1ecbgh\u1ecb ar\u1ee5 \u1ecdr\u1ee5.
xmpp_muc_idle_user_timeout_ms = \u1eccn\u1ee5\u1ecdg\u1ee5 milisek\u1ecdnd onye \u1ecdr\u1ee5 ga-an\u1ecd n\u2019enwegh\u1ecb \u1ecdr\u1ee5 tupu a ch\u1ee5p\u1ee5 ya n\u2019ime ime \u1ee5l\u1ecd niile.
xmpp_muc_log_batch_size = \u1eccn\u1ee5\u1ecdg\u1ee5 ozi a ga-edek\u1ecd na \u1ecds\u1ecd \u1ecd b\u1ee5la nke usoro ndek\u1ecd.
xmpp_muc_log_sweep_time_ms = Ugboro ole a ga-edek\u1ecd ozi sitere n\u2019ime ime \u1ee5l\u1ecd na-ar\u1ee5 \u1ecdr\u1ee5 (ma \u1ecd b\u1ee5r\u1ee5 na ahaziri ime \u1ee5l\u1ecd ah\u1ee5 ka \u1ecd na-edek\u1ecd).
xmpp_muc_restrict_room_creation = \u1ecamep\u1ee5ta ime \u1ee5l\u1ecd MUC h\u00e0 kwes\u1ecbr\u1ecb \u1ecbkpa oke naan\u1ecb na JID nd\u1ecb e dep\u1ee5tara na xmpp_muc_room_create_jid_list?
xmpp_muc_room_create_jid_list = Ndep\u1ee5ta JID e kewara na k\u1ecdma nke a kwere ka ha mep\u1ee5ta ime \u1ee5l\u1ecd MUC.
xmpp_muc_service_name = Aha XMPP maka \u1ecdr\u1ee5 Multi-User-Chat.
xmpp_muc_sysadmin_jid_list = Nwa oge: ndep\u1ee5ta JID nwere ohere sysadmin maka IM Multi-User-Chat.
xmpp_muc_unload_empty_hours = \u1eccn\u1ee5\u1ecdg\u1ee5 awa MUC ga-an\u1ecd n\u2019efu tupu usoro ah\u1ee5 wep\u1ee5 ya n\u2019\u1ecdr\u1ee5. A nagh\u1ecb ehichap\u1ee5 MUC nd\u1ecb na-ad\u1ecbgide ad\u1ecbgide, naan\u1ecb a na-ewep\u1ee5 ha n\u2019\u1ecdr\u1ee5.
xmpp_offline_quota = \u1eccn\u1ee5\u1ecdg\u1ee5 byte kacha elu nke ozi an\u1ecdgh\u1ecb n\u2019\u1ecbntanet\u1ecb a ga-echekwa (ma \u1ecd b\u1ee5r\u1ee5 na \u1ee5d\u1ecb b\u1ee5 store_and_bounce ma \u1ecd b\u1ee5 store_and_drop).
xmpp_offline_type = Ihe a ga-eme na ozi nd\u1ecb \u1ecdr\u1ee5 an\u1ecdgh\u1ecb n\u2019\u1ecbntanet\u1ecb natara: drop|bounce|store|store_and_bounce|store_and_drop.
xmpp_private_storage_enabled = XMPP: Kwado nchekwa nzuzo (XEP-0049).
xmpp_server_certificate_accept_selfsigned = XMPP sava-na-sava: nabata asambodo a b\u1ecbanyere aka n\u2019onwe ha sitere na sava d\u1ecbp\u1ee5r\u1ee5 ad\u1ecbp\u1ee5.
xmpp_server_certificate_verify = XMPP sava-na-sava: njikwa isi maka \u1ecbgbanye/\u1ecbgbany\u1ee5\u1ecd nyocha asambodo SSL (ugbua agbajiri, agbanyela ya).
xmpp_server_certificate_verify_chain = XMPP sava-na-sava: gbanyee nyocha asambodo SSL maka yinye asambodo dum (naan\u1ecb ma \u1ecd b\u1ee5r\u1ee5 na certificate_verify b\u1ee5 true).
xmpp_server_certificate_verify_root = XMPP sava-na-sava: gbanyee nyocha asambodo SSL maka asambodo mgb\u1ecdr\u1ecdgw\u1ee5 (naan\u1ecb ma \u1ecd b\u1ee5r\u1ee5 na certificate_verify b\u1ee5 true).
xmpp_server_certificate_verify_validity = XMPP sava-na-sava: lelee ma asambodo \u1ecd b\u1ee5la d\u1ecb ir\u00e8 n\u2019oge ugbu a (naan\u1ecb ma \u1ecd b\u1ee5r\u1ee5 na certificate_verify b\u1ee5 true
xmpp_server_compression_policy = Mkpak\u1ecd S2S: nh\u1ecdr\u1ecd|agbany\u1ee5r\u1ee5.
xmpp_server_dialback_enabled = Kwe ka S2S Server Dialback Protocol.
xmpp_server_outgoing_max_threads = \u1eccn\u1ee5\u1ecdg\u1ee5 eriri kacha elu n\u2019ime \u1ecdd\u1ecd maka S2S na-ap\u1ee5 ap\u1ee5.
xmpp_server_outgoing_queue = Ogologo kw\u1ee5 n\u2019ah\u1ecbr\u1ecb maka S2S na-ap\u1ee5 ap\u1ee5.
xmpp_server_processing_core_threads = Eriri isi maka nhazi S2S.
xmpp_server_processing_max_threads = \u1eccn\u1ee5\u1ecdg\u1ee5 eriri nhazi S2S kacha elu.
xmpp_server_processing_queue = Ogologo kw\u1ee5 n\u2019ah\u1ecbr\u1ecb nhazi S2S.
xmpp_server_read_timeout = Oge nkw\u1ee5s\u1ecb \u1ecbg\u1ee5 maka S2S (ogologo oge any\u1ecb ga-echere ka sava d\u1ecbp\u1ee5r\u1ee5 ad\u1ecbp\u1ee5 zaa?)
xmpp_server_session_allowmultiple = Kwe ka \u1ecdt\u1ee5t\u1ee5 njik\u1ecd S2S na-eme n\u2019otu oge sitere na host e nyere.
xmpp_server_session_idle = Oge nkw\u1ee5s\u1ecb maka njik\u1ecd S2S na-ad\u1ecbgh\u1ecb ar\u1ee5 \u1ecdr\u1ee5.
xmpp_server_session_idle_check_time = Ugboro ole any\u1ecb na-enyocha njik\u1ecd sava na-ad\u1ecbgh\u1ecb ar\u1ee5 \u1ecdr\u1ee5.
xmpp_server_socket_remoteport = P\u1ecdt d\u1ecbp\u1ee5r\u1ee5 ad\u1ecbp\u1ee5 a ga-ejik\u1ecd na ya maka S2S na-ap\u1ee5 ap\u1ee5.
xmpp_server_tls_enabled = Kwe ka TLS maka njik\u1ecd S2S.
xmpp_session_conflict_limit = Oke esemokwu maka nn\u1ecdk\u1ecd XMPP C2S.
yauth_baseuri = URI nt\u1ecdala maka yauth.
