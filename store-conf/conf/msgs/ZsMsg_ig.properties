zimbra_csv_mapping_file = Map\u1ecbng nke ubi k\u1ecdntakt\u1ecb maka mbubata na mbupu CSV.
zimbra_auth_provider = Ndep\u1ee5ta auth providers e nyere usoro, nke e kewara site na koma.
zimbra_zmjava_options = Nh\u1ecdr\u1ecd Java maka script zmjava.
zimbra_zmjava_java_library_path = Njirimara Java java.library.path maka script zmjava.
zimbra_zmjava_java_ext_dirs = Njirimara Java java.ext.dirs maka script zmjava.
