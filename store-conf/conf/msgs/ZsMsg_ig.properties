mailboxd_java_heap_new_size_percent = Pasent nke Java heap size a ga-eji maka \u1ecdgb\u1ecd young (-Xmn) nke JVM na-agba Mailboxd.
mailboxd_java_options = Nh\u1ecdr\u1ecd JVM a ga-eji mgbe a na-ebido Mailboxd.
mailboxd_pidfile = Fa\u1ecbl\u1ee5 ebe a na-echekwa ID usoro nke JVM Mailboxd.
mailboxd_keystore = Ebe fa\u1ecbl\u1ee5 data keystore d\u1ecb.
