mailboxd_output_file = Fa\u1ecbl\u1ee5 a ga-ebughar\u1ecb stdout na stderr nke sava gaa.
mailboxd_output_rotate_interval = Oge, na sek\u1ecdnd, a na-at\u1ee5ghar\u1ecb fa\u1ecbl\u1ee5 mmep\u1ee5ta mailboxd. \u1ecc b\u1ee5r\u1ee5 na \u1ecd <= 0, a nagh\u1ecb eme nt\u1ee5ghar\u1ecb.
mailboxd_thread_stack_size = Ogo stack thred maka Mailboxd.
ssl_allow_untrusted_certs = \u1ecc b\u1ee5r\u1ee5 na \u1ecd b\u1ee5 eziokwu, kwe ka asambodo SSL a b\u1ecbanyere aka n\u2019onwe ha.
zimlet_directory = \u1ee4z\u1ecd gaa na Zimlet nd\u1ecb ar\u1ee5nyere.
calendar_outlook_compatible_allday_events = Jiri mmemme \u1ee5b\u1ecdch\u1ecb dum kwek\u1ecdr\u1ecd na Outlook. Ndabara b\u1ee5 \u1ee5gha.
calendar_entourage_compatible_timezones = Tinye akara mkp\u1ee5r\u1ee5okwu na paraamita TZID n\u2019ime njirimara iCalendar iji zere njehie d\u1ecb na MS Entourage. Ndabara b\u1ee5 eziokwu.
calendar_ics_import_full_parse_max_size = N\u2019oge mbubata ics, jiri parser zuru ezu ma \u1ecd b\u1ee5r\u1ee5 na nha ics d\u1ecb obere kar\u1ecba ma \u1ecd b\u1ee5 h\u00e0 nke a; a na-eji parser callback nyochaa fa\u1ecbl\u1ee5 ics buru ibu kar\u1ecba, nke na-ekwegh\u1ecb ka e nwee nt\u1ee5aka VTIMEZONE TZID gara n\u2019ihu.
calendar_canonical_tzid = ID mpaghara oge a ga-alaghachi d\u1ecb ka TimeZone.getCanonicalID(). Uru kwe omume b\u1ee5: "olson","windows","java". Ndabara b\u1ee5 "windows".
calendar_cache_enabled = Gbanye cache kalenda. Ndabara b\u1ee5 \u1ee5gha.
calendar_cache_directory = Ndek\u1ecd mgb\u1ecdr\u1ecdgw\u1ee5 nke fa\u1ecbl\u1ee5 cache kalenda.
calendar_cache_lru_size = Ogo LRU cache ebe nchekwa. Chekwaa \u1ecdt\u1ee5t\u1ee5 f\u1ecdlda kalenda a n\u2019ime ebe nchekwa.
calendar_cache_range_month_from = \u1eccnwa mmalite n\u2019ime oke echekwara. 0 p\u1ee5tara \u1ecdnwa ugbu a, -1 p\u1ee5tara \u1ecdnwa gara aga, wdg.
calendar_cache_range_months = \u1eccn\u1ee5 \u1ecdg\u1ee5g\u1ee5 \u1ecdnwa d\u1ecb n\u2019ime oke echekwara.
krb5_keytab = Ebe fa\u1ecbl\u1ee5 keytab Kerberos 5 nke Zimbra d\u1ecb.
krb5_debug_enabled = Gbanye nch\u1ecdp\u1ee5ta nsogbu Kerberos.
zimbra_mtareport_max_hosts = \u1eccn\u1ee5 \u1ecdg\u1ee5g\u1ee5 kacha elu nke host a ga-etinye na ak\u1ee5k\u1ecd MTA kwa \u1ee5b\u1ecdch\u1ecb nke zmdailyreport na-emep\u1ee5ta.
zimbra_mtareport_max_recipients = \u1eccn\u1ee5 \u1ecdg\u1ee5g\u1ee5 nd\u1ecb nnata a ga-edep\u1ee5ta na ak\u1ee5k\u1ecd mta kwa \u1ee5b\u1ecdch\u1ecb.
zimbra_mtareport_max_senders = \u1eccn\u1ee5 \u1ecdg\u1ee5g\u1ee5 nd\u1ecb zitere ozi a ga-edep\u1ee5ta na ak\u1ee5k\u1ecd mta kwa \u1ee5b\u1ecdch\u1ecb.
zimbra_mtareport_max_users = \u1eccn\u1ee5 \u1ecdg\u1ee5g\u1ee5 kacha elu nke nd\u1ecb \u1ecdr\u1ee5 a ga-etinye na ak\u1ee5k\u1ecd MTA kwa \u1ee5b\u1ecdch\u1ecb nke zmdailyreport na-emep\u1ee5ta.
zimbra_auth_always_send_refer = Na-ezighachi mgbe niile mkpado <refer> n\u2019ime nzaghachi auth iji manye ntughari klayent\u1ecb.
zimbra_admin_service_port = P\u1ecdt\u1ee5 admin ndabara/mbido.
zimbra_admin_service_scheme = Usoro pr\u1ecdt\u1ecd\u1ecdk\u1ecd admin ndabara/mbido.
zimbra_mail_service_port = P\u1ecdt\u1ee5 ozi ndabara.
zimbra_zmprov_default_to_ldap = Ma zmprov na-eji LDAP ma \u1ecd b\u1ee5 SOAP d\u1ecb ka ndabara.
zimbra_zmprov_default_soap_server = Sava soap ndabara nke zmprov ga-ejik\u1ecd na ya.
zmprov_safeguarded_attrs = Ndep\u1ee5ta attrs provisioning nwere \u1ecdt\u1ee5t\u1ee5 uru, nke e kewara site na koma, nke kwes\u1ecbr\u1ecb ichebe p\u1ee5\u1ecd na nn\u1ecdchi.
zmprov_tmp_directory = Ndek\u1ecd nwa oge ka zmprov dee uru \u00e0gw\u00e0 binar\u1ecb n\u2019ime fa\u1ecbl\u1ee5.
zimbra_mailbox_groups = \u1eccn\u1ee5 \u1ecdg\u1ee5g\u1ee5 otu mailbox iji kesaa mailbox \u1ecdh\u1ee5r\u1ee5 n\u2019ime ha.
debug_mailboxindex_use_new_locking = Jiri locking \u1ee5d\u1ecb \u1ecdh\u1ee5r\u1ee5 maka MailboxIndex.
zimbra_class_provisioning = Klas interface provisioning.
zimbra_class_accessmanager = Klas interface access manager.
zimbra_class_mboxmanager = Klas interface mailbox manager.
