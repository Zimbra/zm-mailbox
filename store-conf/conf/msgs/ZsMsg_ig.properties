zimbra_waitset_min_request_timeout = Oge ngw\u1ee5cha kacha nta (sek\u1ecdnd) nke WaitSetRequest na-ab\u1ee5gh\u1ecb admin ga-egbochi.
zimbra_waitset_max_request_timeout = Oge ngw\u1ee5cha kacha elu (sek\u1ecdnd) nke WaitSetRequest na-ab\u1ee5gh\u1ecb admin ga-egbochi.
zimbra_waitset_max_per_account = \u1eccn\u1ee5 \u1ecdg\u1ee5g\u1ee5 kacha elu nke WaitSet na-ab\u1ee5gh\u1ecb admin otu aka\u1ee5nt\u1ee5 nwere ike imeghe.
zimbra_admin_waitset_default_request_timeout = Oge ngw\u1ee5cha ndabara (sek\u1ecdnd) nke WaitSetRequest admin ga-egbochi.
zimbra_admin_waitset_min_request_timeout = Oge ngw\u1ee5cha kacha nta (sek\u1ecdnd) nke WaitSetRequest admin ga-egbochi.
zimbra_admin_waitset_max_request_timeout = Oge ngw\u1ee5cha kacha elu (sek\u1ecdnd) nke WaitSetRequest admin ga-egbochi.
zimbra_waitset_initial_sleep_time = Oge ngw\u1ee5cha mmalite (milisek\u1ecdnd) ichere tupu \u1ecbhazi WaitSetRequest \u1ecd b\u1ee5la.
