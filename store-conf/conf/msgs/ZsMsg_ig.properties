zimbra_class_application = Klas interface ngwa Zimbra.
zimbra_class_rulerewriterfactory = Klas interface RuleRewriterFactory.
zimbra_class_dbconnfactory = Klas factory njik\u1ecd databesi.
zimbra_class_soapsessionfactory = Klas factory sesh\u1ecdn Soap.
av_notify_user = Adrees\u1ecb imeel\u1ee5 e si ezipu ozi nch\u1ecbkwa sitere na anti-virus na DKIM.
av_notify_domain = Domeenu ndabara na nt\u1ecdala amavisd.
data_source_trust_self_signed_certs = Kwe ka asambodo a b\u1ecbanyere aka n\u2019onwe ha mgbe a na-ejik\u1ecd na isi data site na SSL.
data_source_fetch_size = \u1eccn\u1ee5 \u1ecdg\u1ee5g\u1ee5 kacha elu nke ozi IMAP a ga-FETCH na ar\u1ecbr\u1ecb\u1ecd \u1ecd b\u1ee5la.
data_source_max_literal_mem_size = Oke kacha elu nke nha data literal (na bayt) a ga-echekwa na ebe nchekwa. Data buru ibu kar\u1ecba ga-echekwa na fa\u1ecbl\u1ee5 nwa oge.
timezone_file = Fa\u1ecbl\u1ee5 iCalendar nke dep\u1ee5tara mpaghara oge a ma ama.
search_disable_database_hints = \u1ecc b\u1ee5r\u1ee5 na \u1ecd b\u1ee5 eziokwu, ejila database hints na aj\u1ee5j\u1ee5 a na-emep\u1ee5ta n\u2019oge \u1ecdch\u1ee5ch\u1ecd.
search_dbfirst_term_percentage_cutoff = Paraamita d\u1ecb n\u2019ime maka imep\u1ee5ta aj\u1ee5j\u1ee5.
zmstat_interval = ugboro ole zmstat na-ewere sample (sek\u1ecdnd)
zmstat_df_excludes = ndep\u1ee5ta olu diski nke e kewara site na k\u1ecdl\u1ecdn (site na \u1ee5z\u1ecd mount) a ga-ewepu na zmstats
zimbra_noop_default_timeout = Oge (sek\u1ecdnd) sava ga-ekwe ka NoOpRequest kw\u1ee5s\u1ecb ma \u1ecd b\u1ee5r\u1ee5 na klayent\u1ecb dep\u1ee5tara wait=1.
zimbra_noop_min_timeout = Oge ngw\u1ee5cha kacha nta a na-ekwe ka e dep\u1ee5ta ya na NoOpRequest (sek\u1ecdnd).
zimbra_noop_max_timeout = Oge ngw\u1ee5cha kacha elu a na-ekwe ka e dep\u1ee5ta ya na NoOpRequest (sek\u1ecdnd).
