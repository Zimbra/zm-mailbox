licenseFeaureOnHoldNotifierBodyText = \u1eccn\u1ee5\u1ecdg\u1ee5 aka\u1ee5nt\u1ee5 enyere ikikere eruola ma \u1ecd b\u1ee5 agafeela maka njirimara nd\u1ecb a:\n{0}\n\u1eca nwere ike belata ojiji nke nd\u1ecb \u1ecdr\u1ee5 d\u1ecb ugbu a ma \u1ecd b\u1ee5 m\u1ee5baa oke ikikere njirimara ah\u1ee5.\n\nIji m\u1ee5baa oke ikikere njirimara ah\u1ee5, biko kp\u1ecdt\u1ee5r\u1ee5 Zimbra Sales na sales@zimbra.com.\nIji jikwaa nkesa njirimara aka\u1ee5nt\u1ee5, biko banye na Admin Portal.\n\nBiko r\u1ecbba ama ihe nd\u1ecb a:\n1. \u1eca ga-aga n\u2019ihu na-anata \u1ecdkwa a ruo \u1ee5b\u1ecdch\u1ecb {1,number,integer} site n\u2019\u1ee5b\u1ecdch\u1ecb agafere ojiji.\n2. \u1eca gagh\u1ecb enwe ike \u1ecbgbanye njirimara e jiri kar\u1ecba oke maka aka\u1ee5nt\u1ee5 \u1ecd b\u1ee5la.\n3. \u1ecc b\u1ee5r\u1ee5 na \u1ecbmegh\u1ecb ihe \u1ecd b\u1ee5la banyere njirimara e jiri kar\u1ecba oke, a ga-agbany\u1ee5\u1ecd njirimara ah\u1ee5 maka nd\u1ecb \u1ecdr\u1ee5 iji weghachite ya n\u2019okpuru oke enyere ikikere.\n\nNdewo,\nZimbra Support
