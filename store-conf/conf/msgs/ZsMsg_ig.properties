zimbra_ldap_password = Okwuntughe maka zimbra_ldap_userdn. A na-echekwa ya na nhazi mpaghara ka ngwa store jiri kwado njirimara.  \u1ecc b\u1ee5r\u1ee5 na \u1ecbch\u1ecdr\u1ecd \u1ecbgbanwe okwuntughe a, biko jiri mmemme zmldappasswd nke ga-agbanwe okwuntughe ah\u1ee5 ma na LDAP ma na nhazi mpaghara.
zimbra_server_hostname = Aha e nyere sava a. E kwesiri inwe ndebanye \u2018server\u2019 kwek\u1ecdr\u1ecd na LDAP - lelee akw\u1ee5kw\u1ecd nduzi maka iwu CreateServer nke mmemme zmprov.
zimbra_user = Onye \u1ecdr\u1ee5 unix zimbra nke usoro sava zimbra ga-agbanwe ikike ya gaa n\u2019aka ya mgbe o jik\u1ecdtara \u1ecdd\u1ee5 nd\u1ecb nwere ikike p\u1ee5r\u1ee5 iche.
zimbra_uid = UID unix zimbra nke usoro sava zimbra ga-agbanwe ikike ya gaa na ya mgbe o jik\u1ecdtara \u1ecdd\u1ee5 nd\u1ecb nwere ikike p\u1ee5r\u1ee5 iche.
zimbra_gid = GID unix zimbra nke usoro sava zimbra ga-agbanwe ikike ya gaa na ya mgbe o jik\u1ecdtara \u1ecdd\u1ee5 nd\u1ecb nwere ikike p\u1ee5r\u1ee5 iche.
zimbra_log4j_properties = \u1ee4z\u1ecd gaa na fa\u1ecbl\u1ee5 properties nhazi log4j.
zimbra_log4j_properties_watch = Oge nlek\u1ecdta maka fa\u1ecbl\u1ee5 properties nhazi log4j na msec.
zimbra_attrs_directory = Direktori nwere fa\u1ecbl\u1ee5 *.xml nke na-ak\u1ecdwa sintaks\u1ecb maka attributes LDAP nke sistem\u1ee5 na-eji.
localized_msgs_directory = Direktori maka fa\u1ecbl\u1ee5 ozi e tinyere n\u2019as\u1ee5s\u1ee5 obodo.
localized_client_msgs_directory = Direktori maka fa\u1ecbl\u1ee5 ozi onye ah\u1ecba e tinyere n\u2019as\u1ee5s\u1ee5 obodo.
skins_directory = Direktori maka skins.
zimbra_store_sweeper_max_age = A na-ehichap\u1ee5 fa\u1ecbl\u1ee5 nd\u1ecb kar\u1ecbr\u1ecb nkeji a n\u2019onwe ha n\u2019ime direktori mbata nke store.
zimbra_store_copy_buffer_size_kb = \u1eccr\u1ee5 nnomi fa\u1ecbl\u1ee5 na-eji buffers nke nha a.
zimbra_mailbox_galsync_cache = Na-ahazi oke kachas\u1ecb nke kaash\u1ecb ihe k\u1ecdntakt\u1ecb nke mailbox galsync. T\u1ecd\u1ecd uru ah\u1ee5 ka \u1ecd d\u1ecbkar\u1ecba ala h\u00e0 \u1ecdn\u1ee5 \u1ecdg\u1ee5g\u1ee5 ihe k\u1ecdntakt\u1ecb d\u1ecb na mailbox galsync.
zimbra_mailbox_manager_hardref_cache = \u1eccn\u1ee5 \u1ecdg\u1ee5g\u1ee5 kachas\u1ecb nke mailboxes a ga-edobe n\u2019ime ebe nchekwa tupu njikwa mailbox amalite ikwe ka e kpochap\u1ee5 ha site na nch\u1ecbk\u1ecdta mkpofu SoftReference.
zimbra_mailbox_active_cache = Oke kachas\u1ecb nke kaash\u1ecb ihe LRU ime nke mailbox mgbe enwere sessions na-ar\u1ee5 \u1ecdr\u1ee5.
zimbra_mailbox_inactive_cache = Oke kachas\u1ecb nke kaash\u1ecb ihe LRU ime nke mailbox mgbe \u1ecd nwegh\u1ecb sessions na-ar\u1ee5 \u1ecdr\u1ee5.
zimbra_mailbox_change_checkpoint_frequency = Ugboro (n\u2019\u1ecdn\u1ee5 \u1ecdg\u1ee5g\u1ee5 mgbanwe) a na-ede uru mgbanwe highwater nke ZIMBRA.MAILBOX.CHANGE_CHECKPOINT nke mailbox.
zimbra_index_elasticsearch_url_base = URL nt\u1ecdala nke ElasticSearch REST API.
zimbra_index_threads = Nha pool nke threads maka ndeksi ngwugwu.
zimbra_reindex_threads = \u1eccn\u1ee5 \u1ecdg\u1ee5g\u1ee5 kachas\u1ecb nke threads maka re-index. A nagh\u1ecb etinye threads re-index na pool.
zimbra_index_disable_perf_counters = \u1ecc b\u1ee5r\u1ee5 na \u1ecd b\u1ee5 false, a na-enyocha Lucene read na write IO site na nlele ar\u1ee5m\u1ecdr\u1ee5 Zimbra. Uru true na-egbochi nlele Lucene IO.
zimbra_index_max_readers = \u1eccn\u1ee5 \u1ecdg\u1ee5g\u1ee5 kachas\u1ecb nke IndexReaders na-ar\u1ee5k\u1ecd \u1ecdr\u1ee5 n\u2019otu oge
zimbra_index_max_writers = \u1eccn\u1ee5 \u1ecdg\u1ee5g\u1ee5 kachas\u1ecb nke IndexWriters na-ar\u1ee5k\u1ecd \u1ecdr\u1ee5 n\u2019otu oge
zimbra_index_reader_cache_size = \u1eccn\u1ee5 \u1ecdg\u1ee5g\u1ee5 kachas\u1ecb nke IndexReaders n\u2019ime kaash\u1ecb ndeksi \u1ecdch\u1ee5ch\u1ecd
zimbra_index_reader_cache_ttl = \u1ecc b\u1ee5r\u1ee5 na \u1ecd n\u1ecd n\u2019\u1ecdd\u1ee5 n\u2019efu kar\u1ecba uru a (sek\u1ecdnd), wep\u1ee5 IndexReader na kaash\u1ecb.
zimbra_index_deferred_items_failure_delay = Mgbe \u1ecdd\u1ecbda mere, oge kacha nta a ga-echere (sek\u1ecdnd) n\u2019etiti mb\u1ecd \u1ecbsachap\u1ee5 ah\u1ecbr\u1ecb nke ihe nd\u1ecb a na-edebegh\u1ecb ndeksi (deferred).
zimbra_index_lucene_max_terms_per_query = T\u1ecd\u1ecd \u1ecdn\u1ee5 \u1ecdg\u1ee5g\u1ee5 kachas\u1ecb nke terms a na-ekwe kwa query.
zimbra_index_max_transaction_bytes = Mgbe a na-ach\u1ecbk\u1ecdta \u1ecdr\u1ee5 ndeksi n\u2019ime Mailbox transaction, nke a b\u1ee5 oke kachas\u1ecb nke nha ng\u1ee5k\u1ecdta ihe nd\u1ecb any\u1ecb ga-ekwe n\u2019otu transaction.
zimbra_index_max_transaction_items = Mgbe a na-ach\u1ecbk\u1ecdta \u1ecdr\u1ee5 ndeksi, nke a b\u1ee5 \u1ecdn\u1ee5 \u1ecdg\u1ee5g\u1ee5 kachas\u1ecb nke mail_items any\u1ecb ga-ekwe n\u2019otu transaction.
zimbra_index_max_pending_deletes = \u1eccn\u1ee5 \u1ecdg\u1ee5g\u1ee5 kachas\u1ecb nke nhichap\u1ee5 ndeksi na-eche tupu eweghachite oghere diski
zimbra_index_lucene_merge_policy = true iji jiri LogDocMergePolicy, false iji jiri LogByteSizeMergePolicy. LogDocMergePolicy na-ah\u1ecdr\u1ecd segments a ga-ejik\u1ecdta dabere na \u1ecdn\u1ee5 \u1ecdg\u1ee5g\u1ee5 nke documents. LogByteSizeMergePolicy na-ah\u1ecdr\u1ecd segments a ga-ejik\u1ecdta dabere na nha ha.
zimbra_index_lucene_min_merge = Na-ahazi nha njik\u1ecd kacha nta nke Lucene na Documents ma \u1ecd b\u1ee5 KB dabere na merge policy ak\u1ecdwap\u1ee5tara na zimbra_index_lucene_merge_policy.
zimbra_index_lucene_max_merge = Na-ahazi nha njik\u1ecd kacha elu nke Lucene na Documents ma \u1ecd b\u1ee5 KB dabere na merge policy ak\u1ecdwap\u1ee5tara na zimbra_index_lucene_merge_policy. Uru a na-ekpebi segment kas\u1ecb ukwuu nke enwere ike ijik\u1ecd ya na segments nd\u1ecb \u1ecdz\u1ecd.
zimbra_index_lucene_merge_factor = Ugboro ole a na-ejik\u1ecdta ndeksi segments site na addDocument(). Site na uru nd\u1ecb pere mpe, a na-eji RAM d\u1ecb ntak\u1ecbr\u1ecb mgbe a na-eme indexing, \u1ecdch\u1ee5ch\u1ecd na-ad\u1ecbkwa ngwa ngwa, mana \u1ecds\u1ecd indexing na-ad\u1ecbr\u1ecb nway\u1ecd. Site na uru nd\u1ecb ka ukwuu, a na-eji RAM kar\u1ecba mgbe a na-eme indexing, ma n\u2019agbanyegh\u1ecb na \u1ecdch\u1ee5ch\u1ecd na-ad\u1ecb nway\u1ecd, indexing na-ad\u1ecb ngwa ngwa. Uru nd\u1ecb ka ukwuu (>10) kacha mma maka imep\u1ee5ta batch index, ebe uru nd\u1ecb pere mpe (<10) kacha mma maka ndeksi a na-elek\u1ecdta n\u2019ime mmek\u1ecdr\u1ecbta ozugbo.
zimbra_index_lucene_term_index_divisor = Na-eme ka \u1ecd b\u1ee5r\u1ee5 naan\u1ecb ak\u1ee5k\u1ee5 nke terms e debere ndeksi ka a na-ebunye n\u2019ime RAM. Site n\u2019itinye uru > 1, \u1ecb nwere ike belata iji ebe nchekwa n\u2019\u1ecdn\u1ecdd\u1ee5 \u1ecbgbat\u1ecb oge nzaghachi mgbe a na-ebunye ozi ndek\u1ecd echekwara maka otu term.
zimbra_index_lucene_use_compound_file = true ma \u1ecd b\u1ee5r\u1ee5 na Lucene segment \u1ecdh\u1ee5r\u1ee5 kwes\u1ecbr\u1ecb iji compound file format. http://wiki.apache.org/lucene-java/ImproveIndexingSpeed na-ekwu ka a gbany\u1ee5\u1ecd compound file format maka ar\u1ee5m\u1ecdr\u1ee5 ka mma, mana nke a ga-abawanye \u1ecdn\u1ee5 \u1ecdg\u1ee5g\u1ee5 file descriptors nke ukwuu. File descriptors nwere ike \u1ecbgw\u1ee5 ma \u1ecd b\u1ee5r\u1ee5 na zimbra_index_lucene_merge_factor buru ibu.
zimbra_index_lucene_max_buffered_docs = \u1eccn\u1ee5 \u1ecdg\u1ee5g\u1ee5 kacha nta nke documents ach\u1ecdr\u1ecd tupu a kpochap\u1ee5 documents echekwara n\u2019ebe nchekwa d\u1ecbka segment \u1ecdh\u1ee5r\u1ee5. Uru nd\u1ecb buru ibu na-enye indexing ngwa ngwa n\u2019ozuzu.
zimbra_index_lucene_ram_buffer_size_kb = RAM echekwara kacha elu nke Lucene na KB
zimbra_index_lucene_io_impl = Mmejuputa Lucene FSDirectory a na-eji maka indexing IO. Uru nd\u1ecb kwe omume b\u1ee5 nio - jiri NIOFSDirectory. \u1ecc na-eji positional io nke FileChannel nke java.nio mgbe a na-ag\u1ee5 iji zere synchronization mgbe a na-ag\u1ee5 site n'otu fa\u1ecbl\u1ee5. mmap - jiri MMapDirectory. \u1ecc na-eji memory-mapped IO mgbe a na-ag\u1ee5. \u1ecc b\u1ee5 nh\u1ecdr\u1ecd \u1ecdma ma \u1ecd b\u1ee5r\u1ee5 na e nwere ebe nchekwa mebere zuru oke ma e jiri ya t\u1ee5nyere nha index. simple - jiri SimpleFSDirectory. \u1ecc na-eji java.io.RandomAccessFile. \u1ecc nwere ar\u1ee5m\u1ecdr\u1ee5 mmek\u1ecdr\u1ecbta dara ogbenye n'ihi na \u1ecd na-eme synchronization mgbe \u1ecdt\u1ee5t\u1ee5 threads na-ag\u1ee5 otu fa\u1ecbl\u1ee5. \u1ecc b\u1ee5r\u1ee5 na e nyegh\u1ecb uru \u1ecd b\u1ee5la, FSDirectory ga-ah\u1ecdr\u1ecd mmejuputa kacha mma maka gburugburu ah\u1ee5.
zimbra_index_rfc822address_max_token_count = \u1eccn\u1ee5 \u1ecdg\u1ee5g\u1ee5 token kachas\u1ecb nke adrees\u1ecb d\u1ecb na iyi token adrees\u1ecb RFC822. Oke a met\u1ee5tara isiokwu FROM, TO na CC niile maka imeel\u1ee5, adrees\u1ecb imeel\u1ee5 niile maka K\u1ecdntakt\u1ecb, na oghere Creator maka Documents.
zimbra_index_rfc822address_max_token_length = Ogologo token kachas\u1ecb maka otu adrees\u1ecb d\u1ecb na iyi token adrees\u1ecb RFC822. Oke a met\u1ee5tara isiokwu FROM, TO na CC niile maka imeel\u1ee5, adrees\u1ecb imeel\u1ee5 niile maka K\u1ecdntakt\u1ecb, na oghere Creator maka Documents.
zimbra_index_wildcard_max_terms_expanded = \u1eccn\u1ee5 \u1ecdg\u1ee5g\u1ee5 kachas\u1ecb nke mgbasawanye wildcard maka term \u1ecd b\u1ee5la n\u2019ime query.
zimbra_galsync_index_reader_cache_size = \u1eccn\u1ee5 \u1ecdg\u1ee5g\u1ee5 kachas\u1ecb nke IndexReaders n\u2019ime kaash\u1ecb ndeksi \u1ecdch\u1ee5ch\u1ecd GAL. A na-echekwa ndeksi Lucene nke aka\u1ee5nt\u1ee5 GAL sync iche, na-enwegh\u1ecb nch\u1ee5p\u1ee5 akpaaka.
zimbra_spam_report_queue_size = Maka Junk/Not Junk Msg/ConvActionRequests, nha ah\u1ecbr\u1ecb a na-egbochi server workqueue maka \u1ecbhazi forwards.
zimbra_throttle_op_concurrency = Ndep\u1ee5ta uru concurrency kewara site na comma maka \u1ecdkwa mkpa 5 \u1ecd b\u1ee5la, n\u2019usoro site na nke kacha elu ruo na nke kacha ala
zimbra_im_chat_flush_time = Ugboro ole (sek\u1ecdnd) a na-ede IM chats mepere emepe n\u2019\u1ee5l\u1ecd nchekwa store
zimbra_im_chat_close_time = Ogologo oge ole (sek\u1ecdnd) sava ga-echere tupu o mechie sessions IM chat nd\u1ecb na-ad\u1ecbgh\u1ecb ar\u1ee5 \u1ecdr\u1ee5
zimbra_http_originating_ip_header = HTTP header a ga-elele iji ch\u1ecdp\u1ee5ta adrees\u1ecb IP mb\u1ee5 nke onye ah\u1ecba
zimbra_session_limit_imap = \u1eccn\u1ee5 \u1ecdg\u1ee5g\u1ee5 kachas\u1ecb nke f\u1ecdlda IMAP onye \u1ecdr\u1ee5 otu nwere ike imeghe n\u2019otu oge
zimbra_session_limit_admin = \u1eccn\u1ee5 \u1ecdg\u1ee5g\u1ee5 kachas\u1ecb nke sessions admin SOAP onye \u1ecdr\u1ee5 otu nwere ike imeghe n\u2019otu oge
zimbra_session_limit_soap = \u1eccn\u1ee5 \u1ecdg\u1ee5g\u1ee5 kachas\u1ecb nke sessions SOAP na-ar\u1ee5 \u1ecdr\u1ee5 kwa aka\u1ee5nt\u1ee5. Bawanye uru a nke \u1ecdma iji zere njehie "Too many SOAP sessions\u201d n\u2019ime mailbox.log.
zimbra_session_limit_sync = \u1eccn\u1ee5 \u1ecdg\u1ee5g\u1ee5 kachas\u1ecb nke sync listeners kwa session maka ActiveSync. Bawanye uru a nke \u1ecdma iji zere njehie "Too many SYNCLISTENER sessions" n\u2019ime sync.log.
zimbra_session_timeout_soap = Oge nkw\u1ee5s\u1ecb n\u2019ihi \u1ecbn\u1ecd n\u2019efu (na sek\u1ecdnd) maka sessions SOAP
zimbra_session_max_pending_notifications = \u1eccn\u1ee5 \u1ecdg\u1ee5g\u1ee5 kachas\u1ecb nke notifications na-eche nke enwere ike itinye n\u2019ah\u1ecbr\u1ecb n\u2019ime session SOAP tupu a sachap\u1ee5 ah\u1ecbr\u1ecb ah\u1ee5 ma gwa onye ah\u1ecba na steeti ya ad\u1ecbgh\u1ecbzi ir\u00e8
zimbra_converter_enabled_uuencode = Ma a na-agba decoder UUENCODE mgbe a na-at\u1ee5ghar\u1ecb ozi sitere na store
zimbra_converter_enabled_tnef = Ma a na-agba decoder TNEF mgbe a na-at\u1ee5ghar\u1ecb ozi sitere na store
zimbra_converter_depth_max = Omimi recursive nke ak\u1ee5k\u1ee5 MIME n\u2019okpuru nke converters agagh\u1ecb ar\u1ee5 \u1ecdr\u1ee5
zimbra_ssl_enabled = Ma e kwesiri ibunye ssl keystore
stats_img_folder = Direktori maka onyonyo statistik e mep\u1ee5tara.
ldap_host = LDAP host a ga-eji.  Ekwugh\u1ecbzi ka e jiri ya - biko jiri ldap_url kama.
ldap_log_level = \u1ecckwa ndek\u1ecd LDAP
ldap_port = LDAP port a ga-eji.  Ekwugh\u1ecbzi ka e jiri ya - biko jiri ldap_url kama.
ldap_url = Ndep\u1ee5ta sava LDAP nd\u1ecb sava a ga-eji.
ldap_master_url = URL gaa na LDAP master.
ldap_is_master = Host a \u1ecd b\u1ee5 sava LDAP master?
ldap_root_password = Okwuntughe maka rootdn nke LDAP slapd.conf.  D\u1ecb ka mmezi enyemaka, n\u2019oge mmalite LDAP a na-emep\u1ee5ta okwuntughe na-enwegh\u1ecb usoro, a na-echekwa ya na nhazi mpaghara na na slapd.conf.  \u1ecc b\u1ee5r\u1ee5 na \u1ecbch\u1ecdr\u1ecd \u1ecbgbanwe okwuntughe a, biko jiri mmemme zmldappasswd nke ga-agbanwe okwuntughe ah\u1ee5 ma na slapd.conf ma na nhazi mpaghara.
ldap_connect_timeout = Milisek\u1ecdnd mgbe e mes\u1ecbr\u1ecb ka a ga-akw\u1ee5s\u1ecb mgbal\u1ecb njik\u1ecd.
ldap_read_timeout = Milisek\u1ecdnd mgbe e mes\u1ecbr\u1ecb ka a ga-akw\u1ee5s\u1ecb mgbal\u1ecb \u1ecbg\u1ee5.
ldap_deref_aliases = Ma a ga-agbaso aliases mgbe a na-ach\u1ecd ma \u1ecd b\u1ee5 na-ejik\u1ecdta na direktori mp\u1ee5ga. Uru ziri ezi b\u1ee5: always, never, finding, searching
ldap_connect_pool_master = Ma a ga-eji JNDI connection pooling maka LDAP master.
ldap_connect_pool_debug = Ma a ga-eme debug nke LDAP connection pooling.
ldap_connect_pool_initsize = \u1eccn\u1ee5 \u1ecdg\u1ee5g\u1ee5 mb\u1ee5 nke njik\u1ecd LDAP na-ar\u1ee5 \u1ecdr\u1ee5 a ga-ebuli ruo ya.
ldap_connect_pool_maxsize = \u1eccn\u1ee5 \u1ecdg\u1ee5g\u1ee5 kachas\u1ecb nke njik\u1ecd LDAP na-ar\u1ee5 \u1ecdr\u1ee5 na nke na-ad\u1ecbgh\u1ecb ar\u1ee5 \u1ecdr\u1ee5 a na-ekwe.
ldap_connect_pool_prefsize = \u1eccn\u1ee5 \u1ecdg\u1ee5g\u1ee5 njik\u1ecd LDAP a h\u1ecd\u1ecdr\u1ecd - itinye maxsize na prefsize ab\u1ee5\u1ecd n\u2019otu uru na-edobe connection pool n\u2019ogo kw\u1ee5\u1ee5r\u1ee5 onwe ya.
ldap_connect_pool_timeout = Milisek\u1ecdnd nke oge \u1ecbn\u1ecd n\u2019efu tupu ewepu njik\u1ecd na-ad\u1ecbgh\u1ecb ar\u1ee5 \u1ecdr\u1ee5 na pool.
ldap_connect_pool_health_check_on_checkout_enabled = Ma a ga-akp\u1ecd health check nke connection pool oge \u1ecd b\u1ee5la a ga-ewep\u1ee5ta njik\u1ecd maka iji ya. \u1ecc b\u1ee5r\u1ee5 na agbanyere health check OnCheckout, a ga-agbany\u1ee5\u1ecd health check ndabere na-eme ugboro ugboro.
ldap_connect_pool_health_check_interval_millis = Ogologo oge na milisek\u1ecdnd n\u2019etiti health checks ndabere na-eme ugboro ugboro megide njik\u1ecd nd\u1ecb d\u1ecb n\u2019ime connection pool.
ldap_connect_pool_health_check_max_response_time_millis = Ogologo oge kachas\u1ecb na milisek\u1ecdnd ekwesiri ikwe ka nzaghachi health check laghachi site na sava LDAP.
ldap_replication_password = Okwuntughe onye \u1ecdr\u1ee5 syncrepl ji kwado njirimara na ldap master.
ldap_postfix_password = Okwuntughe postfix ji kwado njirimara na ldap.
ldap_amavis_password = Okwuntughe amavis ji kwado njirimara na ldap.
ldap_starttls_supported = Ma sava LDAP na-akwado \u1ecdr\u1ee5 startTLS.
ldap_require_tls = Ma a ch\u1ecdr\u1ecd TLS maka nd\u1ecb ah\u1ecba LDAP.
ldap_cache_account_maxsize = \u1eccn\u1ee5 \u1ecdg\u1ee5g\u1ee5 kachas\u1ecb nke ihe aka\u1ee5nt\u1ee5 a ga-echekwa na kaash\u1ecb.
ldap_cache_account_maxage = Oge kachas\u1ecb (na nkeji) nke ihe aka\u1ee5nt\u1ee5 n\u2019ime kaash\u1ecb.
ldap_cache_cos_maxsize = \u1eccn\u1ee5 \u1ecdg\u1ee5g\u1ee5 kachas\u1ecb nke ihe cos a ga-echekwa na kaash\u1ecb.
ldap_cache_cos_maxage = Oge kachas\u1ecb (na nkeji) nke ihe cos n\u2019ime kaash\u1ecb.
ldap_cache_domain_maxsize = \u1eccn\u1ee5 \u1ecdg\u1ee5g\u1ee5 kachas\u1ecb nke ihe domain a ga-echekwa na kaash\u1ecb.
ldap_cache_domain_maxage = Oge kachas\u1ecb (na nkeji) nke ihe domain n\u2019ime kaash\u1ecb.
ldap_cache_mime_maxage = Oge kachas\u1ecb (na nkeji) nke ihe MIME n\u2019ime kaash\u1ecb.
ldap_cache_server_maxsize = \u1eccn\u1ee5 \u1ecdg\u1ee5g\u1ee5 kachas\u1ecb nke ihe sava a ga-echekwa na kaash\u1ecb.
ldap_cache_server_maxage = Oge kachas\u1ecb (na nkeji) nke ihe group n\u2019ime kaash\u1ecb.
ldap_cache_share_locator_maxsize = \u1eccn\u1ee5 \u1ecdg\u1ee5g\u1ee5 kachas\u1ecb nke ihe aka\u1ee5nt\u1ee5 n\u2019ime kaash\u1ecb ndebanye aha.
ldap_cache_share_locator_maxage = TTL nke kaash\u1ecb ndebanye aha na nkeji.
ldap_cache_timezone_maxsize = \u1eccn\u1ee5 \u1ecdg\u1ee5g\u1ee5 kachas\u1ecb nke ihe timezone a ga-echekwa na kaash\u1ecb.
ldap_cache_zimlet_maxsize = \u1eccn\u1ee5 \u1ecdg\u1ee5g\u1ee5 kachas\u1ecb nke ihe zimlet a ga-echekwa na kaash\u1ecb.
ldap_cache_zimlet_maxage = Oge kachas\u1ecb (na nkeji) nke ihe zimlet n\u2019ime kaash\u1ecb.
ldap_cache_custom_dynamic_group_membership_maxage_ms = Oge kachas\u1ecb (na milisek\u1ecdnd) iji chekwaa na kaash\u1ecb otu dynamic nd\u1ecb aka\u1ee5nt\u1ee5 b\u1ee5 onye otu ha maka otu nd\u1ecb ah\u1ee5 nke a na-ekpebi membership ha site na MemberURL omenala.
csrf_filter_domain_allowed_ref_hosts_max_size = \u1eccn\u1ee5 \u1ecdg\u1ee5g\u1ee5 kachas\u1ecb nke ndebanye domain n\u2019ime kaash\u1ecb allowedRefererHosts kwa domain nke CsrfFilter. \u1ecc na-alaghachi na ldap_cache_domain_maxsize ma \u1ecd b\u1ee5r\u1ee5 na njehie parsing emee.
csrf_filter_domain_allowed_ref_hosts_cache_expiry_mins = Oge kachas\u1ecb (na nkeji) nke ndebanye d\u1ecb n\u2019ime kaash\u1ecb allowedRefererHosts kwa domain nke CsrfFilter. Mgbe oge ya gachara, a na-ach\u1ee5p\u1ee5 ndebanye ah\u1ee5 ma na-ebughachi ya site na LDAP na ar\u1ecbr\u1ecb\u1ecd na-esote. \u1ecc na-alaghachi na nkeji 60 ma \u1ecd b\u1ee5r\u1ee5 na njehie parsing emee.
mysql_directory = Ebe nr\u1ee5nye MySQL d\u1ecb.
mysql_data_directory = Direktori ebe data MySQL kwes\u1ecbr\u1ecb \u1ecbd\u1ecb.
mysql_errlogfile = Ndek\u1ecd njehie MySQL/MariaDB.
mysql_socket = \u1ee4z\u1ecd gaa na socket MySQL maka iji ya site n\u2019\u1ecdr\u1ee5 akara iwu MySQL.
mysql_pidfile = Fa\u1ecbl\u1ee5 nke a na-echekwa id usoro MySQL n\u2019ime ya.
mysql_mycnf = \u1ee4z\u1ecd gaa na my.cnf, fa\u1ecbl\u1ee5 nhazi MySQL.
mysql_bind_address = Interface d\u1ecb na host a nke MySQL ga-ejik\u1ecdta na ya.
mysql_port = N\u1ecdmba port nke sava MySQL kwes\u1ecbr\u1ecb ige nt\u1ecb na ya.
mysql_root_password = Okwuntughe maka onye \u1ecdr\u1ee5 \u2018root\u2019 e wuru n\u2019ime MySQL, ka a ghara \u1ecbgbagwoju ya anya na nbanye root nke UNIX.  D\u1ecb ka mmezi enyemaka, n\u2019oge mmalite databees\u1ecb a na-emep\u1ee5ta okwuntughe na-enwegh\u1ecb usoro, a na-echekwa ya na nhazi mpaghara na na MySQL.  \u1ecc b\u1ee5r\u1ee5 na \u1ecbch\u1ecdr\u1ecd \u1ecbgbanwe okwuntughe a, biko jiri mmemme zmmypasswd nke ga-agbanwe okwuntughe ah\u1ee5 ma na MySQL ma na nhazi mpaghara.
mysql_memory_percent = Pasent nke ebe nchekwa sistem\u1ee5 mysql kwes\u1ecbr\u1ecb iji. A na-echekwa uru a ebe a ka mmemme zmmycnf jiri ya. \u1ecagbanwe nt\u1ecdala a anagh\u1ecb egosi ozugbo n\u2019ime sava MySQL. \u1eca ga-eji nlezianya zuru oke mep\u1ee5ta my.cnf \u1ecdz\u1ecd ma maliteghar\u1ecba sava MySQL ka mgbanwe ah\u1ee5 malite \u1ecbr\u1ee5 \u1ecdr\u1ee5.
mysql_innodb_log_buffer_size = Lelee akw\u1ee5kw\u1ecd nduzi MySQL maka innodb_log_buffer_size. A na-echekwa uru a ebe a ka mmemme zmmycnf jiri ya. \u1ecagbanwe nt\u1ecdala a anagh\u1ecb egosi ozugbo n\u2019ime sava MySQL. \u1eca ga-eji nlezianya zuru oke mep\u1ee5ta my.cnf \u1ecdz\u1ecd ma maliteghar\u1ecba sava MySQL ka mgbanwe ah\u1ee5 malite \u1ecbr\u1ee5 \u1ecdr\u1ee5.
mysql_innodb_log_file_size = Lelee akw\u1ee5kw\u1ecd nduzi MySQL maka innodb_log_file_size. A na-echekwa uru a ebe a ka mmemme zmmycnf jiri ya. \u1ecagbanwe nt\u1ecdala a anagh\u1ecb egosi ozugbo n\u2019ime sava MySQL. \u1eca ga-eji nlezianya zuru oke mep\u1ee5ta my.cnf \u1ecdz\u1ecd ma maliteghar\u1ecba sava MySQL ka mgbanwe ah\u1ee5 malite \u1ecbr\u1ee5 \u1ecdr\u1ee5.
mysql_sort_buffer_size = Lelee akw\u1ee5kw\u1ecd nduzi MySQL maka sort_buffer_size. A na-echekwa uru a ebe a ka mmemme zmmycnf jiri ya. \u1ecagbanwe nt\u1ecdala a anagh\u1ecb egosi ozugbo n\u2019ime sava MySQL. \u1eca ga-eji nlezianya zuru oke mep\u1ee5ta my.cnf \u1ecdz\u1ecd ma maliteghar\u1ecba sava MySQL ka mgbanwe ah\u1ee5 malite \u1ecbr\u1ee5 \u1ecdr\u1ee5.
mysql_read_buffer_size = Lelee akw\u1ee5kw\u1ecd nduzi MySQL maka read_buffer_size. A na-echekwa uru a ebe a ka mmemme zmmycnf jiri ya. \u1ecagbanwe nt\u1ecdala a anagh\u1ecb egosi ozugbo n\u2019ime sava MySQL. \u1eca ga-eji nlezianya zuru oke mep\u1ee5ta my.cnf \u1ecdz\u1ecd ma maliteghar\u1ecba sava MySQL ka mgbanwe ah\u1ee5 malite \u1ecbr\u1ee5 \u1ecdr\u1ee5.
mysql_backup_retention = \u1eccn\u1ee5 \u1ecdg\u1ee5g\u1ee5 revish\u1ecdn nke ndabere databees\u1ecb mysql a ga-edobe.
antispam_mysql_enabled = Jiri databees\u1ecb mysql maka antispam.  False b\u1ee5 ndabara.
antispam_backup_retention = \u1eccn\u1ee5 \u1ecdg\u1ee5g\u1ee5 revish\u1ecdn nke ndabere databees\u1ecb antispam a ga-edobe.
derby_properties = \u1ee4z\u1ecd gaa na fa\u1ecbl\u1ee5 properties nhazi derby.
imap_max_consecutive_error = \u1ecc b\u1ee5r\u1ee5 na \u1ecd kar\u1ecbr\u1ecb 0, kw\u1ee5s\u1ecb njik\u1ecd IMAP ah\u1ee5 ma \u1ecd b\u1ee5r\u1ee5 na e ruru uru imap_max_consecutive_error.
imap_inactive_session_cache_size = Ehcache: \u1ecdn\u1ee5 \u1ecdg\u1ee5g\u1ee5 kacha elu nke ntinye cache IMAP na-ad\u1ecbgh\u1ecb ar\u1ee5 \u1ecdr\u1ee5 d\u1ecb na diski tupu ewep\u1ee5 ha.
imap_use_ehcache = \u1ecc b\u1ee5r\u1ee5 na \u1ecd b\u1ee5 eziokwu, jiri Ehcache maka cache sesh\u1ecdn IMAP. Ma \u1ecd b\u1ee5gh\u1ecb ya, jiri cache diski.
imap_write_timeout = T\u1ecd\u1ecd oge ngw\u1ee5cha ide nke sesh\u1ecdn IMAP (nio).
imap_write_chunk_size = Ogo b\u1ecdfa ide IMAP na bayt.
imap_thread_keep_alive_time = Ogologo oge ndabara, na sek\u1ecdnd, maka thred IMAP.
imap_throttle_ip_limit = \u1ecc b\u1ee5r\u1ee5 na \u1ecd kar\u1ecbr\u1ecb 0, \u1ecdn\u1ee5 \u1ecdg\u1ee5g\u1ee5 kacha elu nke ar\u1ecbr\u1ecb\u1ecd IMAP kwa sek\u1ecdnd site na IP.
imap_throttle_acct_limit = \u1ecc b\u1ee5r\u1ee5 na \u1ecd kar\u1ecbr\u1ecb 0, \u1ecdn\u1ee5 \u1ecdg\u1ee5g\u1ee5 kacha elu nke ar\u1ecbr\u1ecb\u1ecd IMAP kwa sek\u1ecdnd site na aka\u1ee5nt\u1ee5.
imap_suggested_batch_copy_size = \u1eccn\u1ee5 \u1ecdg\u1ee5g\u1ee5 ozi a ga-ahazi kwa ngwugwu n\u2019oge \u1ecdr\u1ee5 IMAP COPY.
imap_in_progress_response_thread_pool_size = \u1eccn\u1ee5 \u1ecdg\u1ee5g\u1ee5 kacha elu nke thred n\u2019ime p\u1ecdl maka izipu nzaghachi InProgress nye klayent\u1ecb.
imap_in_progress_response_thread_keep_alive = Oge, na sek\u1ecdnd, a ga-eme ka thred d\u1ecb nd\u1ee5 tupu akw\u1ee5s\u1ecb ya.
imap_ehcache_heap_size = \u1eccn\u1ee5 \u1ecdg\u1ee5g\u1ee5 kacha elu nke ntinye cache IMAP echekwara na oyi akwa heap Ehcache.
imap_ehcache_skip_large_folder = Na-agafe \u1ecbchekwa f\u1ecdlda IMAP buru ibu n\u2019ime Ehcache mgbe agbanyere ya.
imap_ehcache_folder_max_message_count = \u00d3k\u00e8 \u1ecdn\u1ee5 \u1ecdg\u1ee5g\u1ee5 ozi nke, ma \u1ecd b\u1ee5r\u1ee5 na a gafee ya, a gagh\u1ecb echekwa f\u1ecdlda IMAP n\u2019ime Ehcache.
nio_imap_enabled = \u1ecc b\u1ee5r\u1ee5 na \u1ecd b\u1ee5 eziokwu, gbanye Jetty non-blocking IO maka IMAP.
nio_pop3_enabled = \u1ecc b\u1ee5r\u1ee5 na \u1ecd b\u1ee5 eziokwu, gbanye Jetty non-blocking IO maka POP3.
postfix_mail_owner = postfix_mail_owner
postfix_setgid_group = postfix_setgid_group
postfix_version = postfix_version
mailboxd_directory = Ebe nr\u1ee5nye mailboxd d\u1ecb.
