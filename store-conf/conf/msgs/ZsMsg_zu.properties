licenseFeaureOnHoldNotifierSubject = Isixwayiso Sesistimu ye-Zimbra: Umkhawulo wokusetshenziswa kwesici/wezici weqiwe
licenseFeaureOnHoldNotifierBodyText = Inani lama-akhawunti anelayisensi selifinyelelwe noma leqiwe kulezi zici ezilandelayo:\n{0}\nUnganciphisa ukusetshenziswa kwabasebenzisi abakhona noma wandise umkhawulo welayisensi yesici.\n\nUkuze wandise umkhawulo welayisensi yesici, sicela uxhumane ne-Zimbra Sales ku-sales@zimbra.com.\nUkuze uphathe ukwabelwa kwezici ze-akhawunti, sicela ungene ku-Admin Portal.\n\nSicela uqaphele okulandelayo:\n1. Uzoqhubeka nokuthola lesi saziso izinsuku ezingu-{1,number,integer} kusukela osukwini lokweqa ukusetshenziswa.\n2. Ngeke ukwazi ukunika amandla isici esisetshenziswe ngokweqile kunoma yimaphi ama-akhawunti.\n3. Uma ungathathi sinyathelo ngesici esisetshenziswe ngokweqile, leso sici sizokhutshazwa kubasebenzisi ukuze sibuyiselwe ngaphansi komkhawulo welayisensi.\n\nNgokuzithoba,\nI-Zimbra Support
licenseFeaureOnHoldNotifierBodyHtml = <div style="font-family:sans-serif;">Inani lama-akhawunti anelayisensi selifinyelelwe noma leqiwe kulezi zici ezilandelayo:<br>{0}<br>Unganciphisa ukusetshenziswa kwabasebenzisi abakhona noma wandise umkhawulo welayisensi yesici.<br><br>Ukuze wandise umkhawulo welayisensi yesici, sicela uxhumane ne-Zimbra Sales ku-<b>sales@zimbra.com</b>.<br>Ukuze uphathe ukwabelwa kwezici ze-akhawunti, sicela ungene ku-Admin Portal.<br><br>Sicela uqaphele okulandelayo:<br>1. Uzoqhubeka nokuthola lesi saziso izinsuku ezingu-{1,number,integer} kusukela osukwini lokweqa ukusetshenziswa.<br>2. Ngeke ukwazi ukunika amandla isici esisetshenziswe ngokweqile kunoma yimaphi ama-akhawunti.<br>3. Uma ungathathi sinyathelo ngesici esisetshenziswe ngokweqile, leso sici sizokhutshazwa kubasebenzisi ukuze sibuyiselwe ngaphansi komkhawulo welayisensi.<br><br>Ngokuzithoba,<br>I-Zimbra Support</div>
passwordExpiryNotifierSubject = Iphasiwedi yakho iphelelwa yisikhathi ezinsukwini ezingu-{0}
passwordExpiryNotifierBodyText = Sawubona {0},\n\nIphasiwedi ye-akhawunti yakho iphelelwa yisikhathi ezinsukwini ezingu-{1}, ngo-{2}.\n\nUkuze ugcine ukufinyelela ku-akhawunti yakho, sicela usethe kabusha iphasiwedi yakho ngaphambi kosuku lokuphelelwa yisikhathi.\n\nUzoqhubeka nokuthola izaziso nsuku zonke kuze kube yilapho iphasiwedi ishintshwa noma iphelelwa yisikhathi.\n\nLesi isaziso se-imeyili esizenzakalelayo.
passwordExpiryNotifierBodyHtml = <p>Sawubona {0},</p><p>Iphasiwedi ye-akhawunti yakho iphelelwa yisikhathi ezinsukwini ezingu-<strong>{1}</strong>, ngo-<strong>{2}</strong>.</p><p>Ukuze ugcine ukufinyelela ku-akhawunti yakho, sicela usethe kabusha iphasiwedi yakho ngaphambi kosuku lokuphelelwa yisikhathi.</p><p>Uzoqhubeka nokuthola izaziso nsuku zonke kuze kube yilapho iphasiwedi ishintshwa noma iphelelwa yisikhathi.</p><p>Lesi isaziso se-imeyili esizenzakalelayo.</p>
