xmpp_dns_override = Bhala phezu kwe-DNS yeseva ye-XMPP, uhlu oluhlukaniswe ngamakhoma lwezinto ezisesimweni esithi "{domain:hostname:port}".
xmpp_muc_default_history_type = I-XMPP Multi-User-Chat: ukusethwa okuzenzakalelayo kwelogi kwamagumbi e-MUC: none|all|number.
