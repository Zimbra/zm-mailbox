httpclient_external_connmgr_max_total_connections = Umphathi woxhumano lwe-httpclient wokuxhumeka kwangaphandle: uchaza inani eliphezulu loxhumano oluvunyelwe jikelele.
httpclient_external_connmgr_so_timeout = Umphathi woxhumano lwe-httpclient wokuxhumeka kwangaphandle: inani le-timeout lika-zero lihunyushwa njenge-timeout engapheli. Leli nani lisetshenziswa uma kungekho timeout yesokhethi esethwe kumapharamitha endlela ye-HTTP.
httpclient_external_connmgr_tcp_nodelay = Umphathi woxhumano lwe-httpclient wokuxhumeka kwangaphandle: uchaza ukuthi i-algorithm ye-Nagle kufanele ikhutshazwe yini kusokhethi ye-HTTP.
