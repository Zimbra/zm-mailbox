zimbra_mysql_shutdown_timeout = Isikhathi sokulinda ukuthi inqubo ye-MySQL/MariaDB yebhokisi lemeyili ime. Khulisa isikhathi sokuphela uma i-mysql.server ithatha isikhathi eside kakhulu ukuvala inqubo.
zimbra_mysql_user = Igama lomsebenzisi le-MySQL elizosetshenziswa ukwakha/nokufinyelela ama-database namatafula e-zimbra. Leli inani ongalinikeza inketho ethi \u2018-u\u2019 yohlelo lomugqa womyalo lwe-\u2018mysql\u2019.
zimbra_mysql_password = Iphasiwedi ye-zimbra_mysql_user. Igcinwe ku-local config ukuze isetshenziswe uhlelo lwesitolo ekuqinisekiseni.  Uma ufuna ukushintsha le phasiwedi, sicela usebenzise uhlelo lwe-zmmypasswd oluzoshintsha iphasiwedi ku-MySQL naku-local config.
