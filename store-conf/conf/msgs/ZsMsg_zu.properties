httpclient_external_connmgr_idle_reaper_sleep_interval = I-idle reaper yomphathi woxhumano lwe-httpclient yokuxhumeka kwangaphandle: isikhathi (ngama-millisecond) intambo yokususa uxhumano olungasebenzi yelala ngaso phakathi komsebenzi. U-0 usho ukuthi le ntambo ivaliwe.
