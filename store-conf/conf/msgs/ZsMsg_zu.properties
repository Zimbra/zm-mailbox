zimbra_index_deferred_items_failure_delay = Ngemva kokwehluleka, ukubambezeleka okuncane (imizuzwana) phakathi kwemizamo yokukhipha umugqa wezinto ezingakafakwa enkombeni (ezibekelwe emuva)
zimbra_index_lucene_max_terms_per_query = Setha inani elikhulu lamagama avunyelwe ngombuzo ngamunye.
zimbra_index_max_transaction_bytes = Lapho kubuthaniswa imisebenzi yenkomba ku-transaction ye-Mailbox, usayizi omkhulu ohlanganisiwe wezinto esizowuvumela ku-transaction eyodwa
zimbra_index_max_transaction_items = Lapho kubuthaniswa imisebenzi yenkomba, inani elikhulu lama-mail_items esiwavumela ku-transaction eyodwa
zimbra_index_max_pending_deletes = Inani elikhulu lokusulwa kwenkomba okulindile kuze kube kubuyiselwa indawo yediski
zimbra_index_lucene_merge_policy = true ukuze kusetshenziswe i-LogDocMergePolicy, false ukuze kusetshenziswe i-LogByteSizeMergePolicy. I-LogDocMergePolicy ikhetha izingxenye ezizohlanganiswa ngokuya ngenani lamadokhumenti. I-LogByteSizeMergePolicy ikhetha izingxenye ezizohlanganiswa ngokuya ngosayizi wazo.
zimbra_index_lucene_min_merge = Isetha usayizi omncane wokuhlanganisa we-Lucene ku-Documents noma ku-KB kuye ngenqubomgomo yokuhlanganisa ecaciswe ku-zimbra_index_lucene_merge_policy.
zimbra_index_lucene_max_merge = Isetha usayizi omkhulu wokuhlanganisa we-Lucene ube ku-Documents noma ku-KB kuye ngenqubomgomo yokuhlanganisa ecaciswe ku-zimbra_index_lucene_merge_policy. Leli nani linquma isegimenti enkulu kunazo zonke engahlanganiswa namanye amasegimenti.
zimbra_index_lucene_merge_factor = Ukuthi izinkomba zezigaba zihlanganiswa kangaki yi-addDocument(). Ngamanani amancane, kusetshenziswa i-RAM encane ngesikhathi sokwenza i-index, futhi ukusesha kuyashesha, kodwa isivinini sokwenza i-index siba buthaka. Ngamanani amakhulu, kusetshenziswa i-RAM eningi ngesikhathi sokwenza i-index, futhi noma ukusesha kuba buthaka, ukwenza i-index kuyashesha. Amanani amakhulu (>10) angcono kakhulu ekwakheni i-index ngobuningi, kanti amancane (<10) angcono kuma-index anakekelwa ngokusebenzisana.
zimbra_index_lucene_term_index_divisor = Ihlukanisa amasampula amatemu enziwe i-index alayishwa ku-RAM. Ngokubeka lokhu enanini > 1 unganciphisa ukusetshenziswa kwememori ngokushintshanisa nokubambezeleka okuphezulu lapho kulayishwa imininingwane yerekhodi egcinelwe itemu.
zimbra_index_lucene_use_compound_file = Kuyiqiniso uma isegimenti entsha ye-Lucene kufanele isebenzise ifomethi yefayela elihlanganisiwe. http://wiki.apache.org/lucene-java/ImproveIndexingSpeed ithi vala ifomethi yefayela elihlanganisiwe ukuze kusebenze kangcono, kodwa lokhu kuzokhulisa kakhulu inani lezichazi zefayela. Izichazi zefayela zingaphela uma i-zimbra_index_lucene_merge_factor inkulu.
zimbra_index_lucene_max_buffered_docs = Inani elincane lamadokhumenti elidingekayo ngaphambi kokuthi amadokhumenti abufferwe kwimemori akhishwe abe isegimenti entsha. Amanani amakhulu ngokuvamile anikeza ukwenza i-index okusheshayo.
zimbra_index_lucene_ram_buffer_size_kb = I-RAM ebufferwe enkulu ye-Lucene ku-KB
zimbra_index_lucene_io_impl = Ukuqaliswa kwe-Lucene FSDirectory okusetshenziselwa i-IO yokwenza i-index. Amanani angenzeka nio - Sebenzisa i-NIOFSDirectory. Kusebenzisa i-io yendawo ye-FileChannel ye-java.nio lapho kufundwa ukuze kugwenywe ukuvumelanisa lapho kufundwa efayeleni elifanayo. mmap - Sebenzisa i-MMapDirectory. Kusebenzisa i-IO emethwe kwimemori lapho kufundwa. Kuyisinqumo esihle uma kunememori ebonakalayo eningi uma iqhathaniswa nosayizi we-index. simple - Sebenzisa i-SimpleFSDirectory. Kusebenzisa i-java.io.RandomAccessFile. Inokusebenza okubi ngesikhathi esisodwa ngoba iyazivumelanisa lapho izintambo eziningi zifunda ifayela elifanayo. Uma kungekho nani elinikeziwe, i-FSDirectory izokhetha ukuqaliswa okungcono kakhulu kwemvelo.
zimbra_index_rfc822address_max_token_count = Inani eliphezulu lamathokheni amakheli kusifudlana samathokheni amakheli e-RFC822. Umkhawulo usebenza kuzo zonke izihloko ze-FROM, TO, ne-CC zama-imeyili, kuwo wonke amakheli e-imeyili Oxhumana nabo kanye nensimu yoMdali yamadokhumenti.
zimbra_index_rfc822address_max_token_length = Ubude bethokheni obukhulu bekheli kusifudlana samathokheni amakheli e-RFC822. Umkhawulo usebenza kuzo zonke izihloko ze-FROM, TO, ne-CC zama-imeyili, kuwo wonke amakheli e-imeyili Oxhumana nabo kanye nensimu yoMdali yamadokhumenti.
zimbra_index_wildcard_max_terms_expanded = Ukwandiswa okukhulu kwe-wildcard kwitemu ngalinye elihlukile embuzweni.
zimbra_galsync_index_reader_cache_size = Inani eliphezulu lama-IndexReader enqolobaneni ye-index yokusesha ye-GAL. I-index ye-Lucene ye-akhawunti yokuvumelanisa ye-GAL igcinwa ngokwehlukile ngaphandle kokuxoshwa okuzenzakalelayo.
zimbra_spam_report_queue_size = Kuzicelo ze-Junk/Not Junk Msg/ConvActionRequests lo sayizi wolayini unciphisa i-workqueue yeseva yokucubungula ukudluliselwa.
zimbra_throttle_op_concurrency = Uhlu oluhlukaniswe ngokhefana lwamanani okusebenza ngesikhathi esisodwa ezigabeni ezi-5 zokubaluleka ngokulandelana kusukela kwezibaluleke kakhulu kuye kwezisezingeni eliphansi
zimbra_im_chat_flush_time = Izingxoxo ze-IM ezivulekile zibhalwa kangaki esitolo (imizuzwana)
zimbra_im_chat_close_time = Iseva izolinda isikhathi esingakanani (imizuzwana) ukuvala amaseshini ezingxoxo ze-IM angasebenzi
zimbra_http_originating_ip_header = Isihloko se-HTTP okufanele sibhekwe ukuze kunqunywe ikheli le-IP langempela leklayenti
zimbra_session_limit_imap = Inani eliphezulu lamafolda e-IMAP umsebenzisi oyedwa angawavula ngesikhathi esisodwa
zimbra_session_limit_admin = Inani eliphezulu lamaseshini e-SOAP omphathi umsebenzisi oyedwa angawavula ngesikhathi esisodwa
zimbra_session_limit_soap = Inani eliphezulu lamaseshini e-soap asebenzayo nge-akhawunti ngayinye. Khuphula leli nani ngokucophelela ukuze ugweme amaphutha okuthi "Too many SOAP sessions" ku-mailbox.log.
zimbra_session_limit_sync = Inani eliphezulu labalaleli bokuvumelanisa ngeseshini ngayinye ye-ActiveSync. Khuphula leli nani ngokucophelela ukuze ugweme amaphutha okuthi "Too many SYNCLISTENER sessions" ku-sync.log.
zimbra_session_timeout_soap = Isikhathi sokuphela sokungenzi lutho (ngemizuzwana) samaseshini e-SOAP
zimbra_session_max_pending_notifications = Inani eliphezulu lezaziso ezisalindile ezingafakwa kulayini eseshinini ye-SOAP ngaphambi kokuthi ulayini uhlanzwe futhi iklayenti litshelwe ukuthi isimo salo asivumelekile
zimbra_converter_enabled_uuencode = Ukuthi umhumushi we-UUENCODE uyasebenza yini lapho kuhlaziywa imilayezo evela esitolo
zimbra_converter_enabled_tnef = Ukuthi umhumushi we-TNEF uyasebenza yini lapho kuhlaziywa imilayezo evela esitolo
zimbra_converter_depth_max = Ukujula okuphindaphindayo kwezingxenye ze-MIME ngaphansi kwalapho abaguquli bengeke basebenze khona
zimbra_ssl_enabled = Ukuthi kulayishwe yini i-keystore ye-ssl noma cha
stats_img_folder = Idirekhthri yokugcina izithombe zezibalo ezikhiqiziwe.
ldap_host = Umphathi we-LDAP ozosetshenziswa. Akusasetshenziswa - sicela usebenzise i-ldap_url esikhundleni salokho.
ldap_log_level = Izinga lokuloga le-LDAP
ldap_port = Imbobo ye-LDAP okufanele isetshenziswe. Akusasetshenziswa - sicela usebenzise i-ldap_url esikhundleni salokho.
ldap_url = Uhlu lwamaseva e-LDAP azosetshenziswa yile seva.
ldap_master_url = I-URL eya kumphathi omkhulu we-LDAP.
ldap_is_master = Ingabe lo mphathi uyiseva enkulu ye-LDAP?
ldap_root_password = Iphasiwedi ye-rootdn ye-slapd.conf ye-LDAP. Njengokwenza kube lula, ngesikhathi sokuqaliswa kwe-LDAP kukhiqizwa iphasiwedi engahleliwe, igcinwe ku-local config naku-slapd.conf. Uma ufuna ukushintsha le phasiwedi, sicela usebenzise uhlelo lwe-zmldappasswd oluzoshintsha le phasiwedi kuzo zombili i-slapd.conf naku-local config.
ldap_connect_timeout = Amamilisekhondi ngemva kwawo umzamo wokuxhuma uyekiswa.
ldap_read_timeout = Amamilisekhondi ngemva kwawo umzamo wokufunda uyekiswa.
ldap_deref_aliases = Ukuthi kuxazululwe ama-alias ngesikhathi sokusesha noma sokubophezela kudirekhthri yangaphandle. Amanani avumelekile yilawa: always, never, finding, searching
ldap_connect_pool_master = Ukuthi kusetshenziswe yini ukuhlanganiswa koxhumano lwe-JNDI ku-LDAP enkulu.
ldap_connect_pool_debug = Ukuthi kulungiswe yini amaphutha ekuhlanganisweni koxhumano lwe-LDAP.
ldap_connect_pool_initsize = Inani lokuqala loxhumano olusebenzayo lwe-LDAP okufanele kunyuswe kulo.
ldap_connect_pool_maxsize = Inani eliphezulu loxhumano lwe-LDAP olusebenzayo nolungasebenzi oluvumelekile.
ldap_connect_pool_prefsize = Inani elithandwayo loxhumano lwe-LDAP - ukusetha i-maxsize ne-prefsize kube yinani elifanayo kugcina ichibi loxhumano ngosayizi ongaguquki.
ldap_connect_pool_timeout = Amamilisekhondi esikhathi sokungenzi lutho ngaphambi kokuthi uxhumano olungasebenzi lususwe echibini.
ldap_connect_pool_health_check_on_checkout_enabled = Ukuthi ukuhlolwa kwempilo yechibi loxhumano kuzobizwa yini noma nini lapho uxhumano luzokhishwa ukuze lusetshenziswe. Uma ukuhlolwa kwempilo kwe-OnCheckout kunikwe amandla, ukuhlolwa kwempilo okuvamile kwangemuva kuzokhutshazwa.
ldap_connect_pool_health_check_interval_millis = Ubude besikhathi ngamamilisekhondi phakathi kokuhlolwa kwempilo okuvamile kwangemuva okwenziwa koxhumano olutholakalayo echibini loxhumano.
ldap_connect_pool_health_check_max_response_time_millis = Ubude besikhathi obukhulu ngamamilisekhondi okufanele buvunyelwe ukuze impendulo yokuhlolwa kwempilo ibuye ivela kuseva ye-LDAP.
ldap_replication_password = Iphasiwedi esetshenziswa umsebenzisi we-syncrepl ukuze aqinisekise ku-ldap enkulu.
ldap_postfix_password = Iphasiwedi esetshenziswa yi-postfix ukuze iqinisekise ku-ldap.
ldap_amavis_password = Iphasiwedi esetshenziswa yi-amavis ukuze iqinisekise ku-ldap.
ldap_starttls_supported = Ukuthi iseva ye-LDAP iyawusekela yini umsebenzi we-startTLS.
ldap_require_tls = Ukuthi i-TLS iyadingeka yini kumaklayenti e-LDAP.
ldap_cache_account_maxsize = Inani eliphezulu lezinto ze-akhawunti okufanele zigcinwe enqolobaneni.
ldap_cache_account_maxage = Ubude besikhathi obukhulu (ngemizuzu) bezinto ze-akhawunti enqolobaneni.
ldap_cache_cos_maxsize = Inani eliphezulu lezinto ze-cos okufanele zigcinwe enqolobaneni.
ldap_cache_cos_maxage = Ubude besikhathi obukhulu (ngemizuzu) bezinto ze-cos enqolobaneni.
ldap_cache_domain_maxsize = Inani eliphezulu lezinto zedomeyini okufanele zigcinwe enqolobaneni
ldap_cache_domain_maxage = Ubude besikhathi obukhulu (ngemizuzu) bezinto zedomeyini enqolobaneni.
ldap_cache_mime_maxage = Ubude besikhathi obukhulu, ngemizuzu, bezinto ze-MIME enqolobaneni.
ldap_cache_server_maxsize = Inani eliphezulu lezinto zeseva okufanele zigcinwe enqolobaneni
ldap_cache_server_maxage = Ubude besikhathi obukhulu (ngemizuzu) bezinto zeqembu enqolobaneni.
ldap_cache_share_locator_maxsize = Izinto ze-akhawunti eziningi kakhulu enqolobaneni yokungena okuqanjwe ngegama.
ldap_cache_share_locator_maxage = I-TTL yenqolobane yokungena okuqanjwe ngegama ngemizuzu.
ldap_cache_timezone_maxsize = Inani eliphezulu lezinto zendawo yesikhathi okufanele zigcinwe enqolobaneni.
ldap_cache_zimlet_maxsize = Inani eliphezulu lezinto ze-zimlet okufanele zigcinwe enqolobaneni.
ldap_cache_zimlet_maxage = Ubude besikhathi obukhulu (ngemizuzu) bezinto ze-zimlet enqolobaneni.
ldap_cache_custom_dynamic_group_membership_maxage_ms = Ubude besikhathi obukhulu (ngamamilisekhondi) bokugcina enqolobaneni ukuthi i-akhawunti iyilungu lamaphi amaqembu aguqukayo kulawo maqembu anobulungu obunqunywa i-MemberURL yangokwezifiso.
csrf_filter_domain_allowed_ref_hosts_max_size = Inani eliphezulu lokungeniswa kwedomeyini enqolobaneni ye-CsrfFilter allowedRefererHosts yedomeyini ngayinye. Kubuyela ku-ldap_cache_domain_maxsize uma kunephepha lokuhumusha.
csrf_filter_domain_allowed_ref_hosts_cache_expiry_mins = Ubude besikhathi obukhulu (ngemizuzu) bokungeniswa enqolobaneni ye-CsrfFilter allowedRefererHosts yedomeyini ngayinye. Ngemva kokuphelelwa yisikhathi, okungenisiwe kuyaxoshwa bese kulayishwa futhi ku-LDAP esicelweni esilandelayo. Kubuyela emizuzwini engu-60 uma kunephepha lokuhumusha.
mysql_directory = Indawo yokufakwa kwe-MySQL.
mysql_data_directory = Idirekhthri lapho idatha ye-MySQL kufanele ihlale khona.
mysql_errlogfile = Ilogi yephutha ye-MySQL/MariaDB.
mysql_socket = Indlela eya kusokhethi se-MySQL ukuze sisetshenziswe amathuluzi omugqa womyalo we-MySQL.
mysql_pidfile = Ifayela lapho kugcinwa khona i-id yenqubo ye-MySQL.
mysql_mycnf = Indlela eya ku-my.cnf, ifayela lokumisa le-MySQL.
mysql_bind_address = Isixhumi esibonakalayo kulo mphathi lapho i-MySQL izobophezela khona.
mysql_port = Inombolo yembobo lapho iseva ye-MySQL kufanele ilalele khona.
mysql_root_password = Iphasiwedi yomsebenzisi owakhelwe ngaphakathi we-\u2018root\u2019 we-MySQL, okungafanele ixutshwe nokungena kwe-UNIX root. Njengokwenza kube lula, ngesikhathi sokuqaliswa kwedathabheyisi kukhiqizwa iphasiwedi engahleliwe, igcinwe ku-local config naku-MySQL. Uma ufuna ukushintsha le phasiwedi, sicela usebenzise uhlelo lwe-zmmypasswd oluzoshintsha le phasiwedi kuzo zombili i-MySQL naku-local config.
mysql_memory_percent = Iphesenti lememori yohlelo okufanele lisetshenziswe yi-mysql. Leli nani ligcinwa lapha ukuze lisetshenziswe uhlelo lwe-zmmycnf. Ukushintsha lesi silungiselelo akubonakali ngokushesha kuseva ye-MySQL. Kuzodingeka, ngokucophelela okukhulu, uphinde wakhe i-my.cnf bese uqala kabusha iseva ye-MySQL ukuze ushintsho lusebenze.
mysql_innodb_log_buffer_size = Bheka amadokhumenti e-MySQL mayelana ne-innodb_log_buffer_size. Leli nani ligcinwa lapha ukuze lisetshenziswe uhlelo lwe-zmmycnf. Ukushintsha lesi silungiselelo akubonakali ngokushesha kuseva ye-MySQL. Kuzodingeka, ngokucophelela okukhulu, uphinde wakhe i-my.cnf bese uqala kabusha iseva ye-MySQL ukuze ushintsho lusebenze.
mysql_innodb_log_file_size = Bheka amadokhumenti e-MySQL mayelana ne-innodb_log_file_size. Leli nani ligcinwa lapha ukuze lisetshenziswe uhlelo lwe-zmmycnf. Ukushintsha lesi silungiselelo akubonakali ngokushesha kuseva ye-MySQL. Kuzodingeka, ngokucophelela okukhulu, uphinde wakhe i-my.cnf bese uqala kabusha iseva ye-MySQL ukuze ushintsho lusebenze.
mysql_sort_buffer_size = Bheka amadokhumenti e-MySQL mayelana ne-sort_buffer_size. Leli nani ligcinwa lapha ukuze lisetshenziswe uhlelo lwe-zmmycnf. Ukushintsha lesi silungiselelo akubonakali ngokushesha kuseva ye-MySQL. Kuzodingeka, ngokucophelela okukhulu, uphinde wakhe i-my.cnf bese uqala kabusha iseva ye-MySQL ukuze ushintsho lusebenze.
mysql_read_buffer_size = Bheka amadokhumenti e-MySQL mayelana ne-read_buffer_size. Leli nani ligcinwa lapha ukuze lisetshenziswe uhlelo lwe-zmmycnf. Ukushintsha lesi silungiselelo akubonakali ngokushesha kuseva ye-MySQL. Kuzodingeka, ngokucophelela okukhulu, uphinde wakhe i-my.cnf bese uqala kabusha iseva ye-MySQL ukuze ushintsho lusebenze.
mysql_backup_retention = Inani lezinguqulo zesipele sedathabheyisi ye-mysql okufanele zigcinwe.
antispam_mysql_enabled = Sebenzisa idathabheyisi ye-mysql ku-antispam. Amanga ngokuzenzakalela.
antispam_backup_retention = Inani lezinguqulo zesipele sedathabheyisi ye-antispam okufanele zigcinwe.
derby_properties = Indlela eya kufayela lezakhiwo zokumisa i-derby.
imap_max_consecutive_error = Uma kukhulu kuno-0, xosha uxhumano lwe-imap uma kufinyelelwa inani le-imap_max_consecutive_error.
imap_inactive_session_cache_size = Ehcache: inani eliphezulu lezinto zokungena zenqolobane ye-IMAP ezingasebenzi kudiski ngaphambi kokuxoshwa.
imap_use_ehcache = Uma kuyiqiniso, sebenzisa i-Ehcache ekugcineni inqolobane yeseshini ye-IMAP. Ngaphandle kwalokho, sebenzisa inqolobane yediski.
imap_write_timeout = Setha isikhathi sokuphela sokubhala seseshini ye-IMAP (nio).
imap_write_chunk_size = Usayizi ngebhayithi bebhafa yokubhala ye-IMAP.
imap_thread_keep_alive_time = Ubude besikhathi obuzenzakalelayo, ngemizuzwana, bentambo ye-IMAP.
imap_throttle_ip_limit = Uma kukhulu kuno-0, ubuningi obukhulu bezicelo ze-IMAP/ngomzuzwana nge-IP ngayinye.
imap_throttle_acct_limit = Uma kukhulu kuno-0, ubuningi obukhulu bezicelo ze-IMAP/ngomzuzwana nge-akhawunti ngayinye.
imap_suggested_batch_copy_size = Inani lemilayezo okufanele icutshungulwe ngeqoqo ngalinye phakathi nemisebenzi ye-IMAP COPY.
imap_in_progress_response_thread_pool_size = Ubuningi bezintambo echibini zokuthumela impendulo ye-InProgress kuklayenti.
imap_in_progress_response_thread_keep_alive = Isikhathi ngemizuzwana intambo egcinwa siphila ngaphambi kokuqedwa.
imap_ehcache_heap_size = Inani eliphezulu lezinto zokungena zenqolobane ye-IMAP ezigcinwe esendlalelweni senqwaba ye-Ehcache.
imap_ehcache_skip_large_folder = Yeqa ukugcina amafolda amakhulu e-IMAP ku-Ehcache uma kunikwe amandla.
imap_ehcache_folder_max_message_count = Umkhawulo wenani lemilayezo ongaphezu kwawo amafolda e-IMAP engagcinwa ku-Ehcache.
nio_imap_enabled = Uma kuyiqiniso, sungula i-Jetty non-blocking IO ye-IMAP.
nio_pop3_enabled = Uma kuyiqiniso, sungula i-Jetty non-blocking IO ye-POP3.
postfix_mail_owner = postfix_mail_owner
postfix_setgid_group = postfix_setgid_group
postfix_version = postfix_version
mailboxd_directory = Indawo yokufakwa kwe-mailboxd.
mailboxd_java_heap_size = Inani lama-megabyte okufanele lisetshenziswe njengosayizi omkhulu wenqwaba ye-Java (-Xmx) ye-JVM eqhuba i-Mailboxd.
mailboxd_java_heap_new_size_percent = Iphesenti losayizi wenqwaba ye-Java elizosetshenziselwa isizukulwane esisha (-Xmn) se-JVM eqhuba i-Mailboxd.
mailboxd_java_options = Izinketho ze-JVM okufanele zisetshenziswe lapho kuqalwa i-Mailboxd.
mailboxd_pidfile = Ifayela lapho kugcinwa khona i-id yenqubo ye-JVM ye-Mailboxd.
mailboxd_keystore = Indawo yefayela ledatha ye-keystore.
mailboxd_keystore_password = Iphasiwedi okufanele isetshenziswe ne-keystore ye-KeyManager.
mailboxd_truststore = Indawo yefayela ledatha ye-truststore.
mailboxd_truststore_password = Iphasiwedi okufanele isetshenziswe ne-keystore ye-TrustManager.
client_ssl_truststore = Indawo yefayela ledatha ye-truststore elisetshenziselwa ukuqinisekiswa kwe-SSL kweklayenti.
client_ssl_truststore_password = Iphasiwedi okufanele isetshenziswe ne-keystore ye-TrustManager ye-SSL yeklayenti.
mailboxd_output_file = Ifayela okuzodluliselwa kulo i-stdout ne-stderr yeseva.
mailboxd_output_rotate_interval = Isikhathi, ngemizuzwana, lapho ifayela lokukhiphayo le-mailboxd lizungeziswa khona. Uma <= 0, akukho ukujikeleza okwenzekayo.
mailboxd_thread_stack_size = Usayizi wesitaki sentambo se-Mailboxd
ssl_allow_untrusted_certs = Uma kuyiqiniso, vumela izitifiketi ze-SSL ezizisayinele zona.
zimlet_directory = Indlela eya kuma-Zimlets afakiwe.
calendar_outlook_compatible_allday_events = Sebenzisa imicimbi yosuku lonke ehambisana ne-Outlook. Amanga ngokuzenzakalela.
calendar_entourage_compatible_timezones = Caphuna ipharamitha ye-TZID ezakhiweni ze-iCalendar, ukuze kubhekwane nephutha ku-MS Entourage. Iqiniso ngokuzenzakalela.
calendar_ics_import_full_parse_max_size = Ngesikhathi sokungenisa i-ics sebenzisa umhumushi ophelele uma usayizi we-ics ungaphansi noma ulingana nalokhu; amafayela e-ics amakhulu acutshungulwa ngomhumushi we-callback ongavumeli izinkomba eziya phambili ku-VTIMEZONE TZID
calendar_canonical_tzid = I-id yendawo yesikhathi okufanele ibuyiswe njenge-TimeZone.getCanonicalID(). Amanani angenzeka: "olson","windows","java". "windows" ngokuzenzakalela.
calendar_cache_enabled = Nika amandla inqolobane yekhalenda. Amanga ngokuzenzakalela.
calendar_cache_directory = Idirekhthri yempande yamafayela enqolobane yekhalenda
calendar_cache_lru_size = Usayizi we-LRU yenqolobane yememori. Gcina amafolda amaningi kangaka ekhalenda ememori.
calendar_cache_range_month_from = Inyanga yokuqala ebangeni eligcinwe enqolobaneni. U-0 usho inyanga yamanje, u--1 usho inyanga edlule, njalonjalo.
calendar_cache_range_months = Inani lezinyanga ebangeni eligcinwe enqolobaneni
krb5_keytab = Indawo yefayela le-keytab le-Zimbra Kerberos 5
krb5_debug_enabled = Kunikezwe ukulungisa amaphutha kwe-Kerberos
zimbra_mtareport_max_hosts = Inani eliphezulu labasingathi okufanele lifakwe emibikweni ye-MTA yansuku zonke ekhiqizwa yi-zmdailyreport.
zimbra_mtareport_max_recipients = Inani labamukeli okufanele babalwe emibikweni yansuku zonke ye-mta.
zimbra_mtareport_max_senders = Inani labathumeli okufanele babalwe emibikweni yansuku zonke ye-mta.
zimbra_mtareport_max_users = Inani eliphezulu labasebenzisi okufanele lifakwe emibikweni ye-MTA yansuku zonke ekhiqizwa yi-zmdailyreport.
zimbra_auth_always_send_refer = Hlala uthumela emuva ithegi ethi <refer> empendulweni yokungena ukuze kuphoqwe ukuqondiswa kabusha kweklayenti.
