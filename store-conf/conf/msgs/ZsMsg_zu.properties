httpclient_internal_client_connection_timeout = Iklayenti le-httpclient lokuxhumeka kwangaphakathi kwe-Zimbra: limisa i-timeout ngama-millisecond esetshenziswa lapho kutholwa uxhumano lwe-HTTP kumphathi woxhumano lwe-HTTP.
httpclient_internal_connmgr_connection_timeout = Umphathi woxhumano lwe-httpclient wokuxhumeka kwangaphakathi kwe-Zimbra: unquma i-timeout kuze kusungulwe uxhumano. Inani lika-zero lisho ukuthi i-timeout ayisetshenziswa.
httpclient_internal_connmgr_idle_reaper_connection_timeout = I-idle reaper yomphathi woxhumano lwe-httpclient yokuxhumeka kwangaphakathi kwe-Zimbra: inani le-timeout elizosetshenziswa lapho kuhlolwa uxhumano olungasebenzi.
httpclient_internal_connmgr_idle_reaper_sleep_interval = I-idle reaper yomphathi woxhumano lwe-httpclient yokuxhumeka kwangaphakathi kwe-Zimbra: isikhathi (ngama-millisecond) intambo yokususa uxhumano olungasebenzi yelala ngaso phakathi komsebenzi. U-0 usho ukuthi le ntambo ivaliwe.
httpclient_internal_connmgr_max_host_connections = Umphathi woxhumano lwe-httpclient wokuxhumeka kwangaphakathi kwe-Zimbra: uchaza inani eliphezulu loxhumano oluvunyelwe ngokulungiselelwa komsingathi ngamunye.
httpclient_internal_connmgr_max_total_connections = Umphathi woxhumano lwe-httpclient wokuxhumeka kwangaphakathi kwe-Zimbra: uchaza inani eliphezulu loxhumano oluvunyelwe jikelele.
httpclient_internal_connmgr_so_timeout = Umphathi woxhumano lwe-httpclient wokuxhumeka kwangaphakathi kwe-Zimbra: inani le-timeout lika-zero lihunyushwa njenge-timeout engapheli. Leli nani lisetshenziswa uma kungekho timeout yesokhethi esethwe kumapharamitha endlela ye-HTTP.
httpclient_internal_connmgr_tcp_nodelay = Umphathi woxhumano lwe-httpclient wokuxhumeka kwangaphakathi kwe-Zimbra: uchaza ukuthi i-algorithm ye-Nagle kufanele ikhutshazwe yini kusokhethi ye-HTTP.
httpclient_internal_connmgr_stale_connection_check = Umphathi woxhumano lwe-httpclient wokuxhumeka kwangaphakathi kwe-Zimbra: unquma ukuthi ukuhlola uxhumano oludala kufanele kusetshenziswe yini. Ukukhubaza lokhu kuhlola kunganikeza ukuthuthuka okuncane kokusebenza kodwa kube sengozini yephutha le-I/O lapho kwenziwa isicelo ngoxhumano oluvalwe ohlangothini lweseva.
httpclient_external_client_connection_timeout = Iklayenti le-httpclient lokuxhumeka kwangaphandle: limisa i-timeout ngama-millisecond esetshenziswa lapho kutholwa uxhumano lwe-HTTP kumphathi woxhumano lwe-HTTP. Ukukhubaza ukuhlola uxhumano oludala kunganikeza ukuthuthuka okuncane kokusebenza kodwa kube sengozini yephutha le-I/O lapho kwenziwa isicelo ngoxhumano oluvalwe ohlangothini lweseva.
httpclient_external_connmgr_connection_timeout = Umphathi woxhumano lwe-httpclient wokuxhumeka kwangaphandle: unquma i-timeout kuze kusungulwe uxhumano. Inani lika-zero lisho ukuthi i-timeout ayisetshenziswa.
