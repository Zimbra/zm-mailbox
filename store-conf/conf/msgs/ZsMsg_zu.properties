httpclient_convertd_so_timeout = I-timeout yesokhethi ngama-millisecond yeklayenti le-convertd. Uma kungu-0 kusho ukuthi akukho timeout. Uma kungu--1 noma kungasethiwe, kusho ukuthi kusetshenziswa i-timeout yokufunda ezenzakalelayo yomphathi woxhumano.
