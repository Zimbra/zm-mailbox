zimbra_mailbox_galsync_cache = Isetha inqolobane enkulu yezinto zoxhumana nabo zebhokisi lemeyili le-galsync. Setha inani okungenani libe yinani lezinto zoxhumana nabo ebhokisini lemeyili le-galsync.
zimbra_mailbox_manager_hardref_cache = Inani elikhulu lamabhokisi emeyili azobanjwa enkumbulweni ngaphambi kokuba umphathi webhokisi lemeyili aqale ukuwavumela ukuthi asuswe ngokuqoqwa kukadoti kwe-SoftReference.
zimbra_mailbox_active_cache = Ubukhulu obukhulu benqolobane yangaphakathi yezinto ze-LRU yebhokisi lemeyili lapho kunezikhathi ezisebenzayo.
zimbra_mailbox_inactive_cache = Ubukhulu obukhulu benqolobane yangaphakathi yezinto ze-LRU yebhokisi lemeyili lapho ingenazo izikhathi ezisebenzayo.
zimbra_mailbox_change_checkpoint_frequency = Imvamisa (ngenani lezinguquko) lapho kubhalwa khona inani lokuguquka le-highwater le-ZIMBRA.MAILBOX.CHANGE_CHECKPOINT yebhokisi lemeyili.
zimbra_index_elasticsearch_url_base = I-URL eyisisekelo ye-ElasticSearch REST API.
zimbra_index_threads = Usayizi we-thread pool wenkomba yeqoqo
zimbra_reindex_threads = Inani elikhulu lama-thread e-re-index. Ama-thread e-re-index awahlanganiswa echibini.
zimbra_index_disable_perf_counters = Uma kungu-false, i-Lucene read ne-write IO kulandelwa ukuqapha ukusebenza kwe-Zimbra. Inani elingu-true likhubaza ukuqapha kwe-Lucene IO.
zimbra_index_max_readers = Inani elikhulu lama-IndexReaders asebenza ngesikhathi esisodwa
zimbra_index_max_writers = Inani elikhulu lama-IndexWriters asebenza ngesikhathi esisodwa
