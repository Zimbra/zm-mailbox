zimbra_uid = I-unix uid ye-zimbra inqubo yeseva ye-zimbra okufanele ishintshele kuyo amalungelo ngemva kokubopha ama-port anelungelo elikhethekile.
zimbra_gid = I-unix gid ye-zimbra inqubo yeseva ye-zimbra okufanele ishintshele kuyo amalungelo ngemva kokubopha ama-port anelungelo elikhethekile.
zimbra_log4j_properties = Indlela eya kufayela lezakhiwo zokumisa i-log4j.
