zimbra_ldap_user = Igama lomsebenzisi le-zimbra elisetshenziselwa ukuqinisekisa nge-admin AuthRequest.
zimbra_ldap_password = Iphasiwedi ye-zimbra_ldap_userdn. Igcinwe ku-local config ukuze isetshenziswe uhlelo lwesitolo ekuqinisekiseni.  Uma ufuna ukushintsha le phasiwedi, sicela usebenzise uhlelo lwe-zmldappasswd oluzoshintsha iphasiwedi ku-LDAP naku-local config.
zimbra_server_hostname = Igama elabelwe le seva. Kufanele kube nokufakwa okuhambisanayo kwe-\u2018server\u2019 ku-LDAP - bheka imibhalo yomyalo we-CreateServer wohlelo lwe-zmprov.
