networkaddress_cache_ttl = Inani lempahla ye-java.security.Security networkaddress.cache.ttl, elisethwa ngepharamitha yesistimu ye-JVM ethi -Dsun.net.inetaddr.ttl. Inani lamasekhondi okugcinwa ngalo impendulo ephumelelayo yokusesha igama lomsingathi ne-IP kusukela kusevisi yamagama.
