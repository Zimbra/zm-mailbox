# local config settings

zimbra_home = Motso wa ho kenya Zimbra le buka ya lehae ya mosebedisi wa UNIX wa \u2018zimbra\u2019. O ke ke wa fallisa motso wa ho kenya - o se ke wa fetola peakanyo ena.
zimbra_java_home = Tsela e isang ho JDK/J2SDK.
zimbra_log_directory = Buka eo difaele tsa log di ngolwang ho yona.
zimbra_index_directory = Buka ya difaele tsa index tsa mailbox.
zimbra_store_directory = Buka ya melaetsa ya mailbox.
zimbra_db_directory = Buka ya difaele tsa database.
zimbra_tmp_directory = Buka ya difaele tsa nakwana.
zimbra_hybrid_blob_mover_enabled = E beha hore na karolo ya Hybrid Blob Mover e buletswe. Tlwaelo ke: false
zimbra_extensions_directory = Buka eo didirekthori tsa yona tse nyane di nang le di-extension.
zimbra_extensions_common_directory = Buka e nang le difaele tsa jar tse tlwaelehileng ho di-extension tsohle.
zimbra_mysql_shutdown_timeout = Nako ya ho emela hore tshebetso ya mailbox MySQL/MariaDB e time. Eketsa timeout haeba mysql.server e nka nako e telele haholo ho kwala tshebetso.
zimbra_mysql_user = Lebitso la mosebedisi la MySQL le tla sebediswa ho theha/ho fihlella didatabase le ditafole tsa zimbra. Ena ke boleng boo o neng o tla bo fana ho khetho ya \u2018-u\u2019 ya lenaneo la mola wa taelo la \u2018mysql\u2019.
zimbra_mysql_password = Phasewete ya zimbra_mysql_user. E bolokilwe ho local config hore e sebediswe ke tshebediso ya store ho netefatsa boitsebiso.  Haeba o batla ho fetola phasewete ena, ka kopo sebedisa lenaneo la zmmypasswd le tla fetola phasewete ho MySQL le ho local config.
zimbra_ldap_userdn = LDAP dn e sebediswang ho netefatsa boitsebiso ba tshebediso ya store ka LDAP.
zimbra_ldap_user = lebitso la mosebedisi la zimbra le sebediswang ho netefatsa boitsebiso ka admin AuthRequest.
zimbra_ldap_password = Phasewete ya zimbra_ldap_userdn. E bolokilwe ho local config hore e sebediswe ke tshebediso ya store ho netefatsa boitsebiso.  Haeba o batla ho fetola phasewete ena, ka kopo sebedisa lenaneo la zmldappasswd le tla  fetola phasewete ho LDAP le ho local config.
zimbra_server_hostname = Lebitso le fanweng la seva sena. Ho tshwanetse ho ba le kenyelletso e tsamaellanang ya \u2018server\u2019 ho LDAP - sheba ditokomane bakeng sa taelo ya CreateServer ya lenaneo la zmprov.
zimbra_user = Mosebedisi wa unix wa zimbra eo tshebetso ya seva ya zimbra e tshwanetseng ho fetolela ditokelo ho yena, ka mora ho tlamahanya di-port tse nang le ditokelo tse kgethehileng.
zimbra_uid = uid ya unix ya zimbra eo tshebetso ya seva ya zimbra e tshwanetseng ho fetolela ditokelo ho yona, ka mora ho tlamahanya di-port tse nang le ditokelo tse kgethehileng.
zimbra_gid = gid ya unix ya zimbra eo tshebetso ya seva ya zimbra e tshwanetseng ho fetolela ditokelo ho yona, ka mora ho tlamahanya di-port tse nang le ditokelo tse kgethehileng.
zimbra_log4j_properties = Tsela e isang faeleng ya dipropathi tsa peakanyo ya log4j.
zimbra_log4j_properties_watch = Nako ya ho shebella faele ya dipropathi tsa peakanyo ya log4j ka msec.
zimbra_attrs_directory = Buka e nang le difaele tsa *.xml tse hlalosang sintakese ya ditshobotsi tsa LDAP tse sebediswang ke sisteme
localized_msgs_directory = Buka ya difaele tsa melaetsa e fetoletsweng puong ya lehae.
localized_client_msgs_directory = Buka ya difaele tsa melaetsa ya moreki e fetoletsweng puong ya lehae.
skins_directory = Buka ya skins.
zimbra_store_sweeper_max_age = Difaele tse fetang metsotso e mengata ena di hlakolwa ka bohona bukeng e kenang ya store.
zimbra_store_copy_buffer_size_kb = Ditshebetso tsa ho kopitsa difaele di sebedisa dibafa tsa boholo bona
zimbra_mailbox_galsync_cache = E beha polokelo ya cache e phahameng ka ho fetisisa ya dintho tsa dikontaka ya lebokose la poso la galsync. Beha boleng bonyane bo lekane le palo ya dintho tsa dikontaka ka lebokoseng la poso la galsync.
zimbra_mailbox_manager_hardref_cache = Palo e phahameng ka ho fetisisa ya mabokose a poso a tla tshwarwa memoring pele molaodi wa mailbox o qala ho dumella hore a tloswe ka pokello ya matlakala ya SoftReference.
zimbra_mailbox_active_cache = Boholo bo phahameng ka ho fetisisa ba cache ya dintho ya ka hare ya LRU ya mailbox ha ho ena le diseshene tse sebetsang.
zimbra_mailbox_inactive_cache = Boholo bo phahameng ka ho fetisisa ba cache ya dintho ya ka hare ya LRU ya mailbox ha e se na diseshene tse sebetsang.
zimbra_mailbox_change_checkpoint_frequency = Makgetlo (ka palo ya diphetoho) ao ho ona boleng ba phetoho ba highwater ba ZIMBRA.MAILBOX.CHANGE_CHECKPOINT ba mailbox bo ngolwang.
zimbra_index_elasticsearch_url_base = URL ya motheo ya ElasticSearch REST API.
zimbra_index_threads = Boholo ba letamo la dithread bakeng sa indeksa ya batch.
zimbra_reindex_threads = Palo e phahameng ka ho fetisisa ya dithread bakeng sa ho etsa indeksa hape. Dithread tsa ho etsa indeksa hape ha di bokellwe letamong.
zimbra_index_disable_perf_counters = Haeba e le false, IO ya ho bala le ho ngola ya Lucene e lateliswa ke ho beha leihlo tshebetso ya Zimbra. Boleng ba true bo tima ho beha leihlo IO ya Lucene.
zimbra_index_max_readers = Palo e phahameng ka ho fetisisa ya IndexReaders tse tsamayang ka nako e le nngwe.
zimbra_index_max_writers = Palo e phahameng ka ho fetisisa ya IndexWriters tse tsamayang ka nako e le nngwe.
zimbra_index_reader_cache_size = Palo e phahameng ka ho fetisisa ya IndexReaders polokelong ya cache ya indeksa ya patlo.
zimbra_index_reader_cache_ttl = Haeba e sa sebetse nako e telele ho feta boleng bona (metsotsoana), tlosa IndexReader ho cache.
zimbra_index_deferred_items_failure_delay = Ka mora ho hloleha, tieho e nyenyane ka ho fetisisa (metsotsoana) pakeng tsa diteko tsa ho hlakola molaleng wa dintho tse sa kang tsa indekswa (deferred).
zimbra_index_lucene_max_terms_per_query = Beha palo e phahameng ka ho fetisisa ya mantswe a patlo a dumelletsweng potso ka nngwe.
zimbra_index_max_transaction_bytes = Ha ho bokellwa ditshebetso tsa indeksa transactioneng ya Mailbox, boholo bo boholo ka ho fetisisa bo kopaneng ba dintho tseo re tla di dumella transactioneng e le nngwe.
zimbra_index_max_transaction_items = Ha ho bokellwa ditshebetso tsa indeksa, palo e phahameng ka ho fetisisa ya mail_items eo re e dumellang transactioneng e le nngwe.
zimbra_index_max_pending_deletes = Palo e phahameng ka ho fetisisa ya ho hlakola indeksa tse emetseng pele sebaka sa disk se busetswa.
zimbra_index_lucene_merge_policy = true bakeng sa ho sebedisa LogDocMergePolicy, false bakeng sa ho sebedisa LogByteSizeMergePolicy. LogDocMergePolicy e kgetha disegmente tse lokelang ho kopanngwa ho latela palo ya ditokomane. LogByteSizeMergePolicy e kgetha disegmente tse lokelang ho kopanngwa ho latela boholo ba tsona.
zimbra_index_lucene_min_merge = E beha boholo bo bonyane ba kopanyo ba Lucene ka Documents kapa KB ho ya ka pholisi ya kopanyo e boletsweng ho zimbra_index_lucene_merge_policy.
zimbra_index_lucene_max_merge = E beha boholo bo boholo ka ho fetisisa ba kopanyo ba Lucene ka Documents kapa KB ho ya ka pholisi ya kopanyo e boletsweng ho zimbra_index_lucene_merge_policy. Boleng bona bo laola segmente e kgolo ka ho fetisisa e ka kopanngwang le disegmente tse ding.
zimbra_index_lucene_merge_factor = E bontsha hore na di-indekse tsa disegmente di kopanngwa hangata hakae ke addDocument(). Ka boleng bo bonyane, RAM e nyenyane e sebediswa ha ho etswa indeksa, mme dipatlo di potlaka, empa lebelo la ho etsa indeksa le a fokotseha. Ka boleng bo boholo, RAM e ngata e sebediswa nakong ya ho etsa indeksa, mme leha dipatlo di lieha, ho etsa indeksa ho potlaka. Boleng bo boholo (>10) bo molemo bakeng sa ho theha indeksa ya batch, mme boleng bo bonyane (<10) bo molemo bakeng sa di-indekse tse hlokometsweng ka tshebediso e tobileng.
zimbra_index_lucene_term_index_divisor = E nka sampole e nyane ya mantswe a indeksitsweng a jarollwang ho RAM. Ka ho beha sena ho boleng bo > 1 o ka fokotsa tshebediso ya memori, empa ka ditjeho tsa tieho e phahameng ha ho jarollwa tlhahisoleseding ya rekoto e boloketsweng lentswe la patlo.
zimbra_index_lucene_use_compound_file = true haeba segmente e ntjha ya Lucene e tshwanetse ho sebedisa fomate ya compound file. http://wiki.apache.org/lucene-java/ImproveIndexingSpeed e re compound file format e timwe bakeng sa tshebetso e betere, empa hoo ho tla eketsa haholo palo ya file descriptors. File descriptors di ka fela haeba zimbra_index_lucene_merge_factor e le kgolo.
zimbra_index_lucene_max_buffered_docs = Palo e bonyane ya ditokomane e hlokahalang pele ditokomane tse bolokilweng memoring ya buffer di ntshwa e le segmente e ntjha. Ka kakaretso, boleng bo boholo bo fana ka ho etsa indeksa ka potlako.
zimbra_index_lucene_ram_buffer_size_kb = RAM e phahameng ka ho fetisisa ya buffer ya Lucene ka KB.
zimbra_index_lucene_io_impl = Tshebediso ya FSDirectory ya Lucene e sebediswang bakeng sa indexing IO. Boleng bo ka bang teng: nio - Sebedisa NIOFSDirectory. E sebedisa positional io ya FileChannel ya java.nio ha e bala ho qoba synchronization ha ho balwa faeleng e le nngwe. mmap - Sebedisa MMapDirectory. E sebedisa memory-mapped IO ha e bala. Ke kgetho e ntle haeba ho na le memori e ngata ya virtual ha e bapiswa le boholo ba indeksa. simple - Sebedisa SimpleFSDirectory. E sebedisa java.io.RandomAccessFile. E na le tshebetso e fokolang ya nako e le nngwe hobane e etsa synchronization ha dithread tse ngata di bala faele e le nngwe. Haeba ho sa fanwe ka boleng, FSDirectory e tla kgetha tshebediso e ntle ka ho fetisisa bakeng sa tikoloho.
zimbra_index_rfc822address_max_token_count = Palo e phahameng ka ho fetisisa ya ditokene tsa diaterese molapong wa ditokene tsa aterese tsa RFC822. Moedi o sebetsa ho dihlooho tsohle tsa FROM, TO le CC bakeng sa di-imeile, diaterese tsohle tsa imeile bakeng sa Dikontaka le lebala la Creator bakeng sa Documents.
zimbra_index_rfc822address_max_token_length = Bolelele bo phahameng ka ho fetisisa ba tokene bakeng sa aterese molapong wa ditokene tsa aterese tsa RFC822. Moedi o sebetsa ho dihlooho tsohle tsa FROM, TO le CC bakeng sa di-imeile, diaterese tsohle tsa imeile bakeng sa Dikontaka le lebala la Creator bakeng sa Documents.
zimbra_index_wildcard_max_terms_expanded = Palo e phahameng ka ho fetisisa ya dikatoloso tsa wildcard bakeng sa lentswe le leng le le leng potso ka nngwe.
zimbra_galsync_index_reader_cache_size = Palo e phahameng ka ho fetisisa ya IndexReaders polokelong ya cache ya indeksa ya patlo ya GAL. Indeksa ya Lucene ya akhaonto ya GAL sync e bolokwa ka cache ka thoko ntle le ho ntshwa ka bohona.
zimbra_spam_report_queue_size = Bakeng sa Junk/Not Junk Msg/ConvActionRequests, boholo bona ba queue bo lekanyetsa workqueue ya seva bakeng sa ho sebetsa ho diforowarde.
zimbra_throttle_op_concurrency = Lenane le arohantsweng ka dikhefane la boleng ba concurrency bakeng sa e nngwe le e nngwe ya maemo a 5 a bohlokwa, ho tloha bohlokweng bo phahameng ka ho fetisisa ho ya ho bo tlase ka ho fetisisa.
zimbra_im_chat_flush_time = Melaetsa ya puisano ya IM e bulehileng e ngolwa polokelong hangata hakae (metsotsoana).
zimbra_im_chat_close_time = Seva e tla ema nako e kae (metsotsoana) pele e kwala diseshene tsa puisano tsa IM tse sa sebetseng.
zimbra_http_originating_ip_header = HTTP header e lokelang ho shejwa ho fumana aterese ya IP ya mantlha ya moreki.
zimbra_session_limit_imap = Palo e phahameng ka ho fetisisa ya difoldara tsa IMAP tseo mosebedisi a le mong a ka di bulang ka nako e le nngwe.
zimbra_session_limit_admin = Palo e phahameng ka ho fetisisa ya diseshene tsa admin SOAP tseo mosebedisi a le mong a ka bang le tsona di bulehile ka nako e le nngwe.
zimbra_session_limit_soap = Palo e phahameng ka ho fetisisa ya diseshene tsa SOAP tse sebetsang ka akhaonto. Eketsa boleng bona ka hloko ho qoba diphoso tsa "Too many SOAP sessions\u201d ho mailbox.log.
zimbra_session_limit_sync = Palo e phahameng ka ho fetisisa ya balatedi ba sync ka seshene bakeng sa ActiveSync. Eketsa boleng bona ka hloko ho qoba diphoso tsa "Too many SYNCLISTENER sessions" ho sync.log.
zimbra_session_timeout_soap = Nako ya ho fela ha ho sa sebetse (ka metsotsoana) bakeng sa diseshene tsa SOAP.
zimbra_session_max_pending_notifications = Palo e phahameng ka ho fetisisa ya ditsebiso tse emetseng tse ka kenngwang molaleng wa SOAP session pele mola o hlakolwa mme moreki a bolellwa hore boemo ba hae ha bo a nepahala.
zimbra_converter_enabled_uuencode = Hore na decoder ya UUENCODE e tsamaiswa ha ho hlahlojwa melaetsa ho tswa polokelong.
zimbra_converter_enabled_tnef = Hore na decoder ya TNEF e tsamaiswa ha ho hlahlojwa melaetsa ho tswa polokelong.
zimbra_converter_depth_max = Botebo ba likarolo tsa MIME bo iphetang boo ka tlasa bona di-converter di ke keng tsa sebetsa.
zimbra_ssl_enabled = Hore na ssl keystore e jarollwa kapa tjhe.
stats_img_folder = Direktori ya ho boloka ditshwantsho tsa dipalopalo tse hlahisitsweng.
ldap_host = Host ya LDAP e lokelang ho sebediswa. Deprecated - ka kopo sebedisa ldap_url sebakeng sa yona.
ldap_log_level = Boemo ba ho ngola direkoto ba LDAP.
ldap_port = Port ya LDAP e lokelang ho sebediswa. Deprecated - ka kopo sebedisa ldap_url sebakeng sa yona.
ldap_url = Lenane la diseva tsa LDAP bakeng sa tshebediso ke seva sena.
ldap_master_url = URL e yang ho LDAP master.
ldap_is_master = Na host ena ke seva e kgolo ya LDAP?
ldap_root_password = Phasewete ya rootdn ya LDAP slapd.conf. Bakeng sa boiketlo, nakong ya ho qala LDAP phasewete e sa reroang e hlahiswa, e bolokwa ho local config le ho slapd.conf. Haeba o batla ho fetola phasewete ena, ka kopo sebedisa lenaneo la zmldappasswd le tla fetola phasewete ho slapd.conf le ho local config ka bobedi.
ldap_connect_timeout = Palo ya dimilisecond tse fetang pele teko ya kgokahanyo e khaotswa.
ldap_read_timeout = Palo ya dimilisecond tse fetang pele teko ya ho bala e khaotswa.
ldap_deref_aliases = Hore na di-alias di tshwanetse ho dereferenswa ha ho batlwa kapa ho tlamahantswa ho external directory. Boleng bo amohelehang ke: always, never, finding, searching
ldap_connect_pool_master = Hore na ho sebediswe pooling ya dikgokahanyo tsa JNDI bakeng sa LDAP master.
ldap_connect_pool_debug = Hore na ho tshwanetse ho etsuwa debug ya pooling ya dikgokahanyo tsa LDAP.
ldap_connect_pool_initsize = Palo ya pele ya dikgokahanyo tsa LDAP tse sebetsang eo ho lokelang ho nyollelwa ho yona.
ldap_connect_pool_maxsize = Palo e phahameng ka ho fetisisa ya dikgokahano tsa LDAP tse sebetsang le tse sa sebetseng tse dumelletsweng.
ldap_connect_pool_prefsize = Palo e ratwang ya dikgokahano tsa LDAP - ho seta maxsize le prefsize ka bobedi ho boleng bo tshwanang ho boloka letamo la dikgokahano le le boholo bo tsitsitseng.
ldap_connect_pool_timeout = Palo ya dimilisecond tsa nako ya ho se sebetse pele kgokahano e sa sebetseng e ntshiwa letamong.
ldap_connect_pool_health_check_on_checkout_enabled = Hore na tekolo ya bophelo ya letamo la dikgokahano e tla bitswa neng le neng ha kgokahano e tshwanetse ho ntshiwa bakeng sa tshebediso. Haeba tekolo ya bophelo ya OnCheckout e nolofaditswe, tekolo ya bophelo ya semelo e etsahalang ka dinako e tla timwa.
ldap_connect_pool_health_check_interval_millis = Bolelele ba nako ka dimilisecond pakeng tsa diteko tsa bophelo tsa semelo tse etsahalang ka dinako khahlanong le dikgokahano tse fumanehang letamong la dikgokahano.
ldap_connect_pool_health_check_max_response_time_millis = Bolelele bo phahameng ka ho fetisisa ba nako ka dimilisecond bo lokelang ho dumellwa hore karabo ya tekolo ya bophelo e kgutle ho tswa seva ya LDAP.
ldap_replication_password = Phasewete e sebediswang ke mosebedisi wa syncrepl ho iknetefatsa ho ldap master.
ldap_postfix_password = Phasewete e sebediswang ke postfix ho iknetefatsa ho ldap.
ldap_amavis_password = Phasewete e sebediswang ke amavis ho iknetefatsa ho ldap.
ldap_starttls_supported = Hore na seva ya LDAP e tshehetsa tshebetso ya startTLS.
ldap_require_tls = Hore na TLS e a hlokeha bakeng sa bareki ba LDAP.
ldap_cache_account_maxsize = Palo e phahameng ka ho fetisisa ya dintho tsa akhaonto tse lokelang ho bolokwa ka cache.
ldap_cache_account_maxage = Nako e phahameng ka ho fetisisa (ka metsotso) eo dintho tsa akhaonto di ka dulang ka cache.
ldap_cache_cos_maxsize = Palo e phahameng ka ho fetisisa ya dintho tsa cos tse lokelang ho bolokwa ka cache.
ldap_cache_cos_maxage = Nako e phahameng ka ho fetisisa (ka metsotso) eo dintho tsa cos di ka dulang ka cache.
ldap_cache_domain_maxsize = Palo e phahameng ka ho fetisisa ya dintho tsa domain tse lokelang ho bolokwa ka cache
ldap_cache_domain_maxage = Nako e phahameng ka ho fetisisa (ka metsotso) eo dintho tsa domain di ka dulang ka cache.
ldap_cache_mime_maxage = Nako e phahameng ka ho fetisisa, ka metsotso, eo dintho tsa MIME di ka dulang ka cache.
ldap_cache_server_maxsize = Palo e phahameng ka ho fetisisa ya dintho tsa server tse lokelang ho bolokwa ka cache
ldap_cache_server_maxage = Nako e phahameng ka ho fetisisa (ka metsotso) eo dintho tsa sehlopha di ka dulang ka cache.
ldap_cache_share_locator_maxsize = Palo e phahameng ka ho fetisisa ya dintho tsa akhaonto ka cache ya named entry.
ldap_cache_share_locator_maxage = TTL ya cache ya named entry ka metsotso.
ldap_cache_timezone_maxsize = Palo e phahameng ka ho fetisisa ya dintho tsa timezone tse lokelang ho bolokwa ka cache.
ldap_cache_zimlet_maxsize = Palo e phahameng ka ho fetisisa ya dintho tsa zimlet tse lokelang ho bolokwa ka cache.
ldap_cache_zimlet_maxage = Nako e phahameng ka ho fetisisa (ka metsotso) eo dintho tsa zimlet di ka dulang ka cache.
ldap_cache_custom_dynamic_group_membership_maxage_ms = Nako e phahameng ka ho fetisisa (ka dimilisecond) ya ho boloka ka cache hore na akhaonto ke setho sa dihlopha dife tse matla bakeng sa dihlopha tseo botho ba tsona bo hlaloswang ka ho sebedisa custom MemberURL.
csrf_filter_domain_allowed_ref_hosts_max_size = Palo e phahameng ka ho fetisisa ya dintlha tsa domain ka cache ya CsrfFilter per-domain allowedRefererHosts. E kgutlela ho ldap_cache_domain_maxsize ha ho eba le phoso ya parsing.
csrf_filter_domain_allowed_ref_hosts_cache_expiry_mins = Nako e phahameng ka ho fetisisa (ka metsotso) ya dintlha ka cache ya CsrfFilter per-domain allowedRefererHosts. Ka mora hore nako e fediswe, ntlha e a ntshwa mme e laollwe hape ho tswa LDAP kopong e latelang. E kgutlela ho metsotso e 60 ha ho eba le phoso ya parsing.
mysql_directory = Sebaka sa ho kenya MySQL.
mysql_data_directory = Foldara eo data ya MySQL e lokelang ho ba ho yona.
mysql_errlogfile = Log ya phoso ya MySQL/MariaDB.
mysql_socket = Tsela e yang ho socket ya MySQL bakeng sa tshebediso ya disebediswa tsa mola wa taelo tsa MySQL.
mysql_pidfile = Faele eo process id ya MySQL e bolokwang ho yona.
mysql_mycnf = Tsela e yang ho my.cnf, faele ya config ya MySQL.
mysql_bind_address = Interface e ho host ena eo MySQL e tla bind ho yona.
mysql_port = Nomoro ya port eo seva ya MySQL e lokelang ho mamela ho yona.
mysql_root_password = Phasewete ya mosebedisi wa \u2018root\u2019 ya hahelletsweng ka hare wa MySQL, e sa lokelang ho ferekanngwa le ho kena ha UNIX root. Bakeng sa boiketlo, nakong ya ho qala database phasewete e sa reroang e a hlahiswa, e bolokwa ho local config le ho MySQL. Haeba o batla ho fetola phasewete ena, ka kopo sebedisa lenaneo la zmmypasswd le tla fetola phasewete ho MySQL ka bobedi le ho local config.
mysql_memory_percent = Peresente ya memori ya sisteme eo mysql e lokelang ho e sebedisa. Boleng bona bo bolokilwe mona bakeng sa tshebediso ya lenaneo la zmmycnf. Ho fetola peakanyo ena ha ho hlahe hanghang ho seva ya MySQL. O tla tlameha, ka tlhokomelo e kgolo, ho hlahisa my.cnf hape le ho qala seva ya MySQL hape hore phetoho e qale ho sebetsa.
mysql_innodb_log_buffer_size = Sheba ditokomane tsa MySQL bakeng sa innodb_log_buffer_size. Boleng bona bo bolokilwe mona bakeng sa tshebediso ya lenaneo la zmmycnf. Ho fetola peakanyo ena ha ho hlahe hanghang ho seva ya MySQL. O tla tlameha, ka tlhokomelo e kgolo, ho hlahisa my.cnf hape le ho qala seva ya MySQL hape hore phetoho e qale ho sebetsa.
mysql_innodb_log_file_size = Sheba ditokomane tsa MySQL bakeng sa innodb_log_file_size. Boleng bona bo bolokilwe mona bakeng sa tshebediso ya lenaneo la zmmycnf. Ho fetola peakanyo ena ha ho hlahe hanghang ho seva ya MySQL. O tla tlameha, ka tlhokomelo e kgolo, ho hlahisa my.cnf hape le ho qala seva ya MySQL hape hore phetoho e qale ho sebetsa.
mysql_sort_buffer_size = Sheba ditokomane tsa MySQL bakeng sa sort_buffer_size. Boleng bona bo bolokilwe mona bakeng sa tshebediso ya lenaneo la zmmycnf. Ho fetola peakanyo ena ha ho hlahe hanghang ho seva ya MySQL. O tla tlameha, ka tlhokomelo e kgolo, ho hlahisa my.cnf hape le ho qala seva ya MySQL hape hore phetoho e qale ho sebetsa.
mysql_read_buffer_size = Sheba ditokomane tsa MySQL bakeng sa read_buffer_size. Boleng bona bo bolokilwe mona bakeng sa tshebediso ya lenaneo la zmmycnf. Ho fetola peakanyo ena ha ho hlahe hanghang ho seva ya MySQL. O tla tlameha, ka tlhokomelo e kgolo, ho hlahisa my.cnf hape le ho qala seva ya MySQL hape hore phetoho e qale ho sebetsa.
mysql_backup_retention = Palo ya diphetolelo tsa backup ya database ya mysql tse lokelang ho bolokwa.
antispam_mysql_enabled = Sebedisa database ya mysql bakeng sa antispam.  False ka boikgethelo.
antispam_backup_retention = Palo ya diphetolelo tsa backup ya database ya antispam tse lokelang ho bolokwa.
derby_properties = Tsela e yang ho faele ya derby configuration properties.
imap_max_consecutive_error = Haeba e feta 0, lahla kgokahano ya imap haeba boleng ba imap_max_consecutive_error bo fihlelwa.
imap_inactive_session_cache_size = Ehcache: palo e phahameng ka ho fetisisa ya dintlha tsa cache tsa IMAP tse sa sebetseng ho diski pele di ntshwa.
imap_use_ehcache = Haeba e le true, sebedisa Ehcache bakeng sa ho boloka seshene sa IMAP ka cache. Ho seng jwalo, sebedisa cache ya diski.
imap_write_timeout = Seta timeout ya ho ngola ya seshene sa IMAP (nio).
imap_write_chunk_size = Boholo ka dibyte ba buffer ya ho ngola ya IMAP.
imap_thread_keep_alive_time = Bolelele ba nako ba boikgethelo, ka metsotswana, bakeng sa thread ya IMAP.
imap_throttle_ip_limit = Haeba e feta 0, palo e phahameng ka ho fetisisa ya dikopo tsa IMAP ka motsotsoana ka IP.
imap_throttle_acct_limit = Haeba e feta 0, palo e phahameng ka ho fetisisa ya dikopo tsa IMAP ka motsotsoana ka akhaonto.
imap_suggested_batch_copy_size = Palo ya melaetsa e lokelang ho sebetshwa ka batch nakong ya ditshebetso tsa IMAP COPY.
imap_in_progress_response_thread_pool_size = Palo e phahameng ka ho fetisisa ya di-thread ka letamong bakeng sa ho romela karabo ya InProgress ho moreki.
imap_in_progress_response_thread_keep_alive = Nako ka metsotswana eo thread e lokelang ho bolokwa e phela pele e fediswa.
imap_ehcache_heap_size = Palo e phahameng ka ho fetisisa ya dintlha tsa cache tsa IMAP tse bolokilweng karolong ya heap ya Ehcache.
imap_ehcache_skip_large_folder = E tlola ho boloka difoldara tse kgolo tsa IMAP ka cache ho Ehcache ha e nolofaditswe.
imap_ehcache_folder_max_message_count = Moedi wa palo ya melaetsa oo ka hodimo ho wona difoldara tsa IMAP di sa bolokweng ka cache ho Ehcache.
nio_imap_enabled = Haeba e le nnete, nolofalletsa IO e sa thibeleng ya Jetty bakeng sa IMAP.
nio_pop3_enabled = Haeba e le nnete, nolofalletsa IO e sa thibeleng ya Jetty bakeng sa POP3.
postfix_mail_owner = postfix_mail_owner
postfix_setgid_group = postfix_setgid_group
postfix_version = postfix_version
mailboxd_directory = Sebaka sa ho kenya mailboxd.
mailboxd_java_heap_size = Palo ya megabyte e tla sebediswa e le boholo bo phahameng ka ho fetisisa ba heap ya Java (-Xmx) ho JVM e tsamaisang Mailboxd.
mailboxd_java_heap_new_size_percent = Peresente ya boholo ba heap ya Java e tla sebediswa bakeng sa young generation (-Xmn) ya JVM e tsamaisang Mailboxd.
mailboxd_java_options = Dikgetho tsa JVM tse tla sebediswa ha ho qala Mailboxd.
mailboxd_pidfile = Faele eo ho yona process ID ya JVM ya Mailboxd e bolokilweng.
mailboxd_keystore = Sebaka sa faele ya data ya keystore.
mailboxd_keystore_password = Phasewete e tla sebediswa le keystore ya KeyManager.
mailboxd_truststore = Sebaka sa faele ya data ya truststore.
mailboxd_truststore_password = Phasewete e tla sebediswa le keystore ya TrustManager.
client_ssl_truststore = Sebaka sa faele ya data ya truststore e sebediswang bakeng sa netefatso ya SSL ya moreki.
client_ssl_truststore_password = Phasewete e tla sebediswa le keystore ya TrustManager ya SSL ya moreki.
mailboxd_output_file = Faele eo stdout le stderr tsa seva di tla lebisetswa ho yona.
mailboxd_output_rotate_interval = Nako, ka metsotswana, eo ka yona faele ya output ya mailboxd e potolohwang. Haeba <= 0, ha ho potoloho e etswang.
mailboxd_thread_stack_size = Boholo ba thread stack bakeng sa Mailboxd
ssl_allow_untrusted_certs = Haeba e le nnete, dumella disetifikeiti tsa SSL tse itekenneng.
zimlet_directory = Tsela e yang ho Zimlets tse kentsoeng.
calendar_outlook_compatible_allday_events = Sebedisa diketsahalo tsa letsatsi lohle tse tsamaisanang le Outlook. False ka tlwaelo.
calendar_entourage_compatible_timezones = Kenya matshwao a qotso ho paramethara ya TZID diphaphatsong tsa iCalendar, ho qoba bothata ho MS Entourage. True ka tlwaelo.
calendar_ics_import_full_parse_max_size = Nakong ya ho kenya ics, sebedisa parser e felletseng haeba boholo ba ics bo le ka tlase ho kapa bo lekana le sena; difaele tse kgolo tsa ics di sekasekwa ka callback parser e sa dumelleng ditshupiso tse eang pele ho VTIMEZONE TZID
calendar_canonical_tzid = ID ya nako ya sebaka e tla kgutliswa e le TimeZone.getCanonicalID(). Ditekanyetso tse ka bang teng: "olson","windows","java". "windows" ka tlwaelo.
calendar_cache_enabled = Nolofalletsa cache ya khalendara. False ka tlwaelo.
calendar_cache_directory = Direkthori ya motso ya difaele tsa cache ya khalendara
calendar_cache_lru_size = Boholo ba memory-cache LRU. Cache palo ena ya difoldara tsa khalendara memoring.
calendar_cache_range_month_from = Kgwedi ya qalo moeling o bolokilweng ka cache. 0 e bolela kgwedi ya jwale, -1 e bolela kgwedi e fetileng, jj.
calendar_cache_range_months = Palo ya dikgwedi moeling o bolokilweng ka cache
krb5_keytab = Sebaka sa faele ya keytab ya Zimbra Kerberos 5
krb5_debug_enabled = Debugging ya Kerberos e nolofaditsweng
zimbra_mtareport_max_hosts = Palo e phahameng ka ho fetisisa ya dihoste tse lokelang ho kenngwa ditlalehong tsa letsatsi le letsatsi tsa MTA tse hlahiswang ke zmdailyreport.
zimbra_mtareport_max_recipients = Palo ya baamoheli ba tla thathamiswa ditlalehong tsa letsatsi le letsatsi tsa mta.
zimbra_mtareport_max_senders = Palo ya baromelli ba tla thathamiswa ditlalehong tsa letsatsi le letsatsi tsa mta.
zimbra_mtareport_max_users = Palo e phahameng ka ho fetisisa ya basebedisi ba lokelang ho kenngwa ditlalehong tsa letsatsi le letsatsi tsa MTA tse hlahiswang ke zmdailyreport.
zimbra_auth_always_send_refer = Kamehla romela tag ya <refer> morao karabong ya auth ho qobella ho lebisa moreki hape.
zimbra_admin_service_port = Port ya admin ya tlwaelo/bootstrap.
zimbra_admin_service_scheme = Sekema sa protokholo ya admin sa tlwaelo/bootstrap.
zimbra_mail_service_port = Port ya imeile ya tlwaelo
zimbra_zmprov_default_to_ldap = Hore na zmprov e ya ka tlwaelo ho LDAP kapa SOAP.
zimbra_zmprov_default_soap_server = Seva ya soap ya tlwaelo eo zmprov e hokelang ho yona
zmprov_safeguarded_attrs = Lenane le arotsweng ka dikoma la diatribyute tsa provisioning tse nang le boleng bo bongata tse hlokang ho sireletswa kgahlanong le ho nkelwa sebaka
zmprov_tmp_directory = Direkthori ya nakwana eo zmprov e ngolang boleng ba atributi ya binary ho difaele ho yona.
zimbra_mailbox_groups = Palo ya dihlopha tsa mailbox tseo mailbox e ntjha e tla abelwa ho tsona.
debug_mailboxindex_use_new_locking = Sebedisa ho notlela ha setaele se setjha bakeng sa MailboxIndex
