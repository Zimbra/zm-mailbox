httpclient_internal_client_connection_timeout=httpclient client bakeng sa dikgokahano tsa kahare tsa Zimbra: E beha nako ya ho fela ka dimiliseconds e sebediswang ha ho nkuwa kgokahano ya HTTP ho tswa ho molaodi wa dikgokahano tsa HTTP.
httpclient_internal_connmgr_connection_timeout=httpclient connection manager bakeng sa dikgokahano tsa kahare tsa Zimbra: E laola nako ya ho fela ho fihlela kgokahano e thehwa. Boleng ba zero bo bolela hore nako ya ho fela ha e sebediswe
httpclient_internal_connmgr_idle_reaper_connection_timeout=httpclient connection manager idle reaper bakeng sa dikgokahano tsa kahare tsa Zimbra: boleng ba nako ya ho fela bo tla sebediswa ha ho etswa teko ya dikgokahano tse sa sebetseng.
httpclient_internal_connmgr_idle_reaper_sleep_interval=httpclient connection manager idle reaper bakeng sa dikgokahano tsa kahare tsa Zimbra: Nako (ka dimiliseconds) eo thredi ya idle connection reaper ya molaodi wa dikgokahano tsa http client e robalang pakeng tsa mesebetsi. 0 e bolela hore thredi ya reaper e holofaditswe
httpclient_internal_connmgr_max_host_connections=httpclient connection manager bakeng sa dikgokahano tsa kahare tsa Zimbra: E hlalosa palo e phahameng ka ho fetisisa ya dikgokahano tse dumelletsweng bakeng sa peakanyo ka nngwe ya moamoheli
httpclient_internal_connmgr_max_total_connections=httpclient connection manager bakeng sa dikgokahano tsa kahare tsa Zimbra: E hlalosa palo e phahameng ka ho fetisisa ya dikgokahano tse dumelletsweng ka kakaretso
httpclient_internal_connmgr_so_timeout=httpclient connection manager bakeng sa dikgokahano tsa kahare tsa Zimbra: Boleng ba nako ya ho fela ba zero bo tolokwa e le nako ya ho fela e sa feleng. Boleng bona bo sebediswa ha ho se na nako ya ho fela ya sokete e behilweng diparamethareng tsa mokgwa wa HTTP
httpclient_internal_connmgr_tcp_nodelay=httpclient connection manager bakeng sa dikgokahano tsa kahare tsa Zimbra: E hlalosa hore na algorithm ya Nagle e tshwanetse ho holofatswa soketeng ya HTTP
httpclient_internal_connmgr_stale_connection_check=httpclient connection manager bakeng sa dikgokahano tsa kahare tsa Zimbra: E laola hore na tlhahlobo ya stale connection e tshwanetse ho sebediswa. Ho holofatsa tlhahlobo ya stale connection ho ka fella ka ntlafalo e nyane ya tshebetso empa ho be le kotsi ya ho fumana phoso ya I/O ha ho etswa kopo ka hodima kgokahano e koetsweng ka lehlakoreng la seva.
httpclient_external_client_connection_timeout=httpclient client bakeng sa dikgokahano tsa kantle: E beha nako ya ho fela ka dimiliseconds e sebediswang ha ho nkuwa kgokahano ya HTTP ho tswa ho molaodi wa dikgokahano tsa HTTP. Ho holofatsa tlhahlobo ya stale connection ho ka fella ka ntlafalo e nyane ya tshebetso empa ho be le kotsi ya ho fumana phoso ya I/O ha ho etswa kopo ka hodima kgokahano e koetsweng ka lehlakoreng la seva.
httpclient_external_connmgr_connection_timeout=httpclient connection manager bakeng sa dikgokahano tsa kantle: E laola nako ya ho fela ho fihlela kgokahano e thehwa. Boleng ba zero bo bolela hore nako ya ho fela ha e sebediswe
httpclient_external_connmgr_idle_reaper_connection_timeout=httpclient connection manager idle reaper bakeng sa dikgokahanyo tsa kantle: boleng ba timeout bo tla sebediswa ha ho lekolwa dikgokahanyo tse sa sebetseng.
httpclient_external_connmgr_idle_reaper_sleep_interval=httpclient connection manager idle reaper bakeng sa dikgokahanyo tsa kantle: Nako (ka dimileseconde) eo thread ya idle connection reaper ya http client connection manager e robalang ka yona pakeng tsa ho etsa mosebetsi. 0 e bolela hore thread ya reaper e timahetswe
httpclient_external_connmgr_max_host_connections=httpclient connection manager bakeng sa dikgokahanyo tsa kantle: E hlalosa palo e phahameng ya dikgokahanyo tse dumelletsweng bakeng sa tlhophiso ka nngwe ya host
httpclient_external_connmgr_max_total_connections=httpclient connection manager bakeng sa dikgokahanyo tsa kantle: E hlalosa palo e phahameng ya dikgokahanyo tse dumelletsweng ka kakaretso
httpclient_external_connmgr_so_timeout=httpclient connection manager bakeng sa dikgokahanyo tsa kantle: Boleng ba timeout ba lefela bo tolokwa e le timeout e se nang moedi. Boleng bona bo sebediswa ha ho se timeout ya socket e behilweng diparamentareng tsa mokgwa wa HTTP
httpclient_external_connmgr_tcp_nodelay=httpclient connection manager bakeng sa dikgokahanyo tsa kantle: E hlalosa hore na mokgwa wa Nagle o tshwanetse ho tingwa socketeng ya HTTP
httpclient_external_connmgr_stale_connection_check=httpclient connection manager bakeng sa dikgokahanyo tsa kantle: E etsa qeto ya hore na tlhahlobo ya hokello e tsofetseng e tshwanetse ho sebediswa.
