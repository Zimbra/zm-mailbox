#license notification email for exceeding usage count for feature
licenseFeaureOnHoldNotifierSubject = Temoso ya Sisteme ya Zimbra: Moedi wa tshebediso ya dikarolo o fetilwe
licenseFeaureOnHoldNotifierBodyText=Palo ya diakhaonto e filweng laesense e se e fihletswe kapa e fetilwe bakeng sa dikarolo tse latelang:\n{0}\nO ka fokotsa tshebediso ya basebedisi ba teng kapa wa eketsa moedi wa laesense ya karolo.\n\nHo eketsa moedi wa laesense ya karolo, ka kopo ikopanye le Zimbra Sales ho sales@zimbra.com.\nHo laola kabo ya dikarolo tsa akhaonto, ka kopo kena ho Admin Portal.\n\nKa kopo hlokomela tse latelang:\n1. O tla tswela pele ho amohela tsebiso ka matsatsi a {1,number,integer} ho tloha letsatsing leo moedi wa tshebediso o ileng wa fetwa ka lona.\n2. O ke ke wa kgona ho nolofalletsa karolo e sebedisitsweng ho feta tekano bakeng sa diakhaonto dife kapa dife.\n3. Haeba o sa nke kgato efe kapa efe mabapi le karolo e sebedisitsweng ho feta tekano, karolo eo e tla emiswa bakeng sa basebedisi ho e khutlisetsa ka tlasa moedi o filweng laesense.\n\nDitumediso,\nZimbra Support
licenseFeaureOnHoldNotifierBodyHtml=<div style="font-family:sans-serif;">Palo ya diakhaonto e filweng laesense e se e fihletswe kapa e fetilwe bakeng sa dikarolo tse latelang:<br>{0}<br>O ka fokotsa tshebediso ya basebedisi ba teng kapa wa eketsa moedi wa laesense ya karolo.<br><br>Ho eketsa moedi wa laesense ya karolo, ka kopo ikopanye le Zimbra Sales ho <b>sales@zimbra.com</b>.<br>Ho laola kabo ya dikarolo tsa akhaonto, ka kopo kena ho Admin Portal.<br><br>Ka kopo hlokomela tse latelang:<br>1. O tla tswela pele ho amohela tsebiso ka matsatsi a {1,number,integer} ho tloha letsatsing leo moedi wa tshebediso o ileng wa fetwa ka lona.<br>2. O ke ke wa kgona ho nolofalletsa karolo e sebedisitsweng ho feta tekano bakeng sa diakhaonto dife kapa dife.<br>3. Haeba o sa nke kgato efe kapa efe mabapi le karolo e sebedisitsweng ho feta tekano, karolo eo e tla emiswa bakeng sa basebedisi ho e khutlisetsa ka tlasa moedi o filweng laesense.<br><br>Ditumediso,<br>Zimbra Support</div>

