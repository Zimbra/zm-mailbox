httpclient_internal_connmgr_idle_reaper_connection_timeout = httpclient connection manager idle reaper ey'ennyungibwa za Zimbra ez'omunda: omuwendo gwa timeout ogukozesebwa mu kukebera ennyungibwa ezitaliiko kye zikola.
httpclient_internal_connmgr_idle_reaper_sleep_interval = httpclient connection manager idle reaper ey'ennyungibwa za Zimbra ez'omunda: Ekiseera (mu milliseconds) thread ya reaper y'ennyungibwa ezitaliiko kye zikola ekyeebakamu wakati w'emirimu. 0 kitegeeza nti thread ya reaper esaziddwako.
httpclient_internal_connmgr_max_host_connections = httpclient connection manager ey'ennyungibwa za Zimbra ez'omunda: Elaga omuwendo ogusinga obungi ogw'ennyungibwa ezikkirizibwa ku buli nsengeka ya host.
httpclient_internal_connmgr_max_total_connections = httpclient connection manager ey'ennyungibwa za Zimbra ez'omunda: Elaga omuwendo ogusinga obungi ogw'ennyungibwa ezikkirizibwa okutwalira awamu.
httpclient_internal_connmgr_so_timeout = httpclient connection manager ey'ennyungibwa za Zimbra ez'omunda: Timeout ya ziro etwalibwa ng'etaggwaawo. Omuwendo guno gukozesebwa nga tewali socket timeout eteedde mu HTTP method parameters.
httpclient_internal_connmgr_tcp_nodelay = httpclient connection manager ey'ennyungibwa za Zimbra ez'omunda: Elaga oba Nagle algorithm ejja kusazibwako ku HTTP socket.
httpclient_internal_connmgr_stale_connection_check = httpclient connection manager ey'ennyungibwa za Zimbra ez'omunda: Elaga oba stale connection check ejja kukozesebwa. Okusazaawo stale connection check kuyinza okwongera katono ku performance naye nga waliwo akabi k'okufuna ensobi ya I/O nga okola request ku nnyungibwa emala dda okuggalwa ku ludda lwa seva.
httpclient_external_client_connection_timeout = httpclient client ey'ennyungibwa ez'ebweru: Teekawo timeout mu milliseconds ekikozesebwa nga batoola HTTP connection okuva mu HTTP connection manager. Okusazaawo stale connection check kuyinza okwongera katono ku performance naye nga waliwo akabi k'okufuna ensobi ya I/O nga okola request ku nnyungibwa emala dda okuggalwa ku ludda lwa seva.
httpclient_external_connmgr_connection_timeout = httpclient connection manager ey'ennyungibwa ez'ebweru: Elagira timeout okutuusa ng'ennyungibwa ekoleddwa. Omuwendo gwa ziro gutegeeza nti timeout tekozesebwa.
httpclient_external_connmgr_idle_reaper_connection_timeout = httpclient connection manager idle reaper ey'ennyungibwa ez'ebweru: omuwendo gwa timeout ogukozesebwa mu kukebera ennyungibwa ezitaliiko kye zikola.
httpclient_external_connmgr_idle_reaper_sleep_interval = httpclient connection manager idle reaper ey'ennyungibwa ez'ebweru: Ekiseera (mu milliseconds) thread ya reaper y'ennyungibwa ezitaliiko kye zikola ekyeebakamu wakati w'emirimu. 0 kitegeeza nti thread ya reaper esaziddwako.
httpclient_external_connmgr_max_host_connections = httpclient connection manager ey'ennyungibwa ez'ebweru: Elaga omuwendo ogusinga obungi ogw'ennyungibwa ezikkirizibwa ku buli nsengeka ya host.
httpclient_external_connmgr_max_total_connections = httpclient connection manager ey'ennyungibwa ez'ebweru: Elaga omuwendo ogusinga obungi ogw'ennyungibwa ezikkirizibwa okutwalira awamu.
httpclient_external_connmgr_so_timeout = httpclient connection manager ey'ennyungibwa ez'ebweru: Timeout ya ziro etwalibwa ng'etaggwaawo. Omuwendo guno gukozesebwa nga tewali socket timeout eteedde mu HTTP method parameters.
