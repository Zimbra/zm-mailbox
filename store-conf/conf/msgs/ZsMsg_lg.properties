zimbra_extensions_directory = Dayirekita obudayirekita bwayo obutono mwe mulimu extensions.
zimbra_extensions_common_directory = Dayirekita erimu fayiro za jar ezikozesebwa awamu ku extensions zonna.
zimbra_mysql_shutdown_timeout = Obudde obulindirirwa enkola ya mailbox MySQL/MariaDB okuggalawo. Yongera timeout singa mysql.server etwala obudde bungi okuggalawo enkola.
zimbra_mysql_user = Erinnya ly omukozesa wa MySQL elikozesebwa okukola oba okuyingira databases ne tables za zimbra. Guno gwe muwendo gwe wandiwadde ku nkola ya -u mu pulogulaamu ya layini y amateeka eya mysql.
zimbra_mysql_password = Password ya zimbra_mysql_user. Eteerekebwa mu local config okusobola okukozesebwa pulogulaamu ya store okukakasa obuyinza. Bwoba oyagala okukyusa password eno, kozesa pulogulaamu ya zmmypasswd egenda okukyusa password mu MySQL ne mu local config.
zimbra_ldap_userdn = LDAP dn ekozesebwa okukakasa pulogulaamu ya store ne LDAP.
zimbra_ldap_user = Erinnya ly omukozesa wa zimbra elikozesebwa okukakasa ne admin AuthRequest.
zimbra_ldap_password = Password ya zimbra_ldap_userdn. Eteerekebwa mu local config okusobola okukozesebwa pulogulaamu ya store okukakasa obuyinza. Bwoba oyagala okukyusa password eno, kozesa pulogulaamu ya zmldappasswd egenda okukyusa password mu LDAP ne mu local config.
zimbra_server_hostname = Erinnya eryaweebwa seva eno. Kisaana okubaawo ekifo ekikwatagana ekya server mu LDAP. Soma ebiwandiiko bya tteeka lya CreateServer mu pulogulaamu ya zmprov.
zimbra_user = Omukozesa wa unix owa zimbra enkola ya seva ya zimbra gwe erina okukyusirako obuyinza nga emaze okwebungako ku ports ez obuyinza obwenjawulo.
zimbra_uid = UID ya unix eya zimbra enkola ya seva ya zimbra gye erina okukyusirako obuyinza nga emaze okwebungako ku ports ez obuyinza obwenjawulo.
zimbra_gid = GID ya unix eya zimbra enkola ya seva ya zimbra gye erina okukyusirako obuyinza nga emaze okwebungako ku ports ez obuyinza obwenjawulo.
zimbra_log4j_properties = Ekkubo eridda ku fayiro ya properties y ensengeka ya log4j.
zimbra_log4j_properties_watch = Ekiseera ekyokukebera fayiro ya properties y ensengeka ya log4j mu msec.
zimbra_attrs_directory = Dayirekita erimu fayiro za *.xml eziraga syntax ya LDAP attributes ezikozesebwa sisitemu.
localized_msgs_directory = Dayirekita ey okutereka fayiro z obubaka ez ennimi ezenjawulo.
localized_client_msgs_directory = Dayirekita ey okutereka fayiro z obubaka bwa client ez ennimi ezenjawulo.
skins_directory = Dayirekita ey okutereka skins.
zimbra_store_sweeper_max_age = Fayiro ezikaddiye okusinga eddakiika zino ziggyibwawo zokka okuva mu dayirekita ey okuyingira eya store.
zimbra_store_copy_buffer_size_kb = Emirimu gy okukoppa fayiro gikozesa buffers ez obunene buno.
zimbra_mailbox_galsync_cache = Eteekawo omuwendo ogusingayo ogwa cache ya contact items mu mailbox ya galsync. Teeka omuwendo guno okubeera waakiri ogwenkana n obungi bwa contact items mu mailbox ya galsync.
zimbra_mailbox_manager_hardref_cache = Omuwendo ogusingayo ogwa mailbox ezinaasibibwa mu memory nga tannatandika manager wa mailbox okukkiriza okuggyibwamu okuyita mu SoftReference garbage collection.
zimbra_mailbox_active_cache = Obunene obusingayo obwa cache eyomunda eya LRU item mu mailbox nga waliwo sessions ezikola.
zimbra_mailbox_inactive_cache = Obunene obusingayo obwa cache eyomunda eya LRU item mu mailbox nga tewali sessions zikola.
zimbra_mailbox_change_checkpoint_frequency = Obudde obw enjawulo, mu muwendo gw enkyukakyuka, mailbox mwe ewandiikira omuwendo gwa highwater change ogwa ZIMBRA.MAILBOX.CHANGE_CHECKPOINT.
zimbra_index_elasticsearch_url_base = Base URL ya ElasticSearch REST API.
zimbra_index_threads = Obunene bwa thread pool bwa batch index.
zimbra_reindex_threads = Omuwendo ogusingayo ogwa threads ogwa re-index. Threads za re-index teziku\u014b\u014baanyizibwa mu pool.
zimbra_index_disable_perf_counters = Bwe kiba false, Lucene read ne write IO bibeerwa ku kkebera kwa Zimbra performance. Omuwendo ogwa true guzibya okukebereza kwa Lucene IO.
zimbra_index_max_readers = Omuwendo ogusingayo ogwa IndexReaders ezikola wamu mu kiseera kimu.
zimbra_index_max_writers = Omuwendo ogusingayo ogwa IndexWriters ezikola wamu mu kiseera kimu.
zimbra_index_reader_cache_size = Omuwendo ogusingayo ogwa IndexReaders mu cache ya search index.
zimbra_index_reader_cache_ttl = Bwe kiba nga tekikozesebwa okumala obudde obusinga omuwendo guno, mu seconds, ggyawo IndexReader okuva mu cache.
zimbra_index_deferred_items_failure_delay = Oluvannyuma lw okulemererwa, buno bwe budde obutono obuyitawo, mu seconds, wakati w okugezaako okuggyamu layini y ebintu ebitali na index ebisindikiddwa emabega.
zimbra_index_lucene_max_terms_per_query = Teeka omuwendo ogusingayo ogwa terms ezikkirizibwa mu buli query.
zimbra_index_max_transaction_bytes = Nga otu\u014b\u014baanya emirimu gya index mu Mailbox transaction, buno bwe bunene obwawamu obusingayo obw ebintu bye tunaakkiriza mu transaction emu.
zimbra_index_max_transaction_items = Nga otu\u014b\u014baanya emirimu gya index, guno gwe muwendo ogusingayo ogwa mail_items gwe tunaakkiriza mu transaction emu.
zimbra_index_max_pending_deletes = Omuwendo ogusingayo ogwa pending index deletes nga tonnaddukanya kuddamu kufuna kifo ku disk.
zimbra_index_lucene_merge_policy = true okukozesa LogDocMergePolicy, false okukozesa LogByteSizeMergePolicy. LogDocMergePolicy eronda segments ez okugattibwa okusinziira ku muwendo gw ebiwandiiko. LogByteSizeMergePolicy eronda segments ez okugattibwa okusinziira ku bunene bwazo.
zimbra_index_lucene_min_merge = Eteekawo obunene obutono obwa Lucene merge mu Documents oba KB okusinziira ku merge policy eragiddwa mu zimbra_index_lucene_merge_policy.
zimbra_index_lucene_max_merge = Eteekawo obunene obusingayo obwa Lucene merge mu Documents oba KB okusinziira ku merge policy eragiddwa mu zimbra_index_lucene_merge_policy. Omuwendo guno gwe gulaga segment esingayo obunene eyinza okugattibwa ne segments endala.
zimbra_index_lucene_merge_factor = Engeri addDocument() gy egattamu segment indices emirundi egikozesebwa. Omuwendo omutono gukozesa RAM entono nga indexing egenda mu maaso era guleeta okunoonya okwangu, naye indexing ebeera mpola. Omuwendo omunene gukozesa RAM nnyingi mu indexing, era wadde okunoonya kuba mpola, indexing yongera obwangu. Emiwendo eminene, okusukka 10, gisinga bulungi ku kukola batch index, ate emitono, wansi wa 10, ku indices eziddukanyizibwa mu ngeri ey enkolagana.
zimbra_index_lucene_term_index_divisor = Ekitundu kino kisalawo obungi bwa indexed terms obuteekebwa mu RAM. Bw oteeka omuwendo ogusinga 1, osobola okukendeeza ku kukozesa memory naye n oteekawo okuwera okusingawo nga olowooza okumanya ebikwata ku record ebiteresebwa ku term.
zimbra_index_lucene_use_compound_file = true bwe kiba nti segment empya eya Lucene erina okukozesa compound file format. http://wiki.apache.org/lucene-java/ImproveIndexingSpeed egamba okuggya ku compound file format okusobola okwongera performance, naye kino kijja kwongera nnyo omuwendo gwa file descriptors. File descriptors ziyinza okuggwaawo singa zimbra_index_lucene_merge_factor eba nnene.
zimbra_index_lucene_max_buffered_docs = Omuwendo omutono ogw ebiwandiiko ebyetaagisa nga tannasumulula buffered in-memory documents nga segment empya. Emiwendo eminene emirundi mingi givaamu indexing eyangu.
zimbra_index_lucene_ram_buffer_size_kb = Lucene Max Buffered RAM mu KB
zimbra_index_lucene_io_impl = Enteekateeka ya Lucene FSDirectory ekozesebwa mu indexing IO. Emiwendo egisoboka: nio - kozesa NIOFSDirectory. Ekola java.nio FileChannel positional io nga esoma okwewala synchronization nga waliwo okusoma okuva mu fayiro emu. mmap - kozesa MMapDirectory. Ekola memory-mapped IO nga esoma. Kirungi singa waliwo virtual memory emala bw ogerageranya n obunene bwa index. simple - kozesa SimpleFSDirectory. Ekola java.io.RandomAccessFile. Ebeera n obutaali bulungi mu kukola okw awamu kubanga yeesiba nga threads eziwera zisoma fayiro emu. Singa tewali muwendo guweereddwa, FSDirectory eronda enteekateeka esinga obulungi ku mbeera eyo.
zimbra_index_rfc822address_max_token_count = Omuwendo ogusingayo ogwa tokens za addresses mu RFC822 address token stream. Ekkomo lino likwata ku headers zonna eza FROM, TO, ne CC ez emeyili, addresses zonna ez emeyili eza Contacts, ne Creator field eya Documents.
zimbra_index_rfc822address_max_token_length = Obuwanvu obusingayo obwa token ku address mu RFC822 address token stream. Ekkomo lino likwata ku headers zonna eza FROM, TO, ne CC ez emeyili, addresses zonna ez emeyili eza Contacts, ne Creator field eya Documents.
zimbra_index_wildcard_max_terms_expanded = Omuwendo ogusingayo ogwa wildcard expansions ku buli term mu query.
zimbra_galsync_index_reader_cache_size = Omuwendo ogusingayo ogwa IndexReaders mu cache ya GAL search index. Lucene index ya GAL sync account eteerekebwa yekka era terina kuggyibwamu kwa bweyagala.
zimbra_spam_report_queue_size = Ku Junk/Not Junk Msg/ConvActionRequests, obunene bwa layini eno bukoma ku server workqueue ekozesebwa okukola forwards.
zimbra_throttle_op_concurrency = Olukalala olwawuliddwa na koma olw emiwendo gya concurrency ku buli mutendera ku mitendera etaano egyokukulembeza okuva ku gusinga obukulu okutuuka ku gusinga obutono obukulu.
zimbra_im_chat_flush_time = Emirundi gya biseera, mu seconds, IM chats eziggule ziwandiikibwa mu store.
zimbra_im_chat_close_time = Obudde, mu seconds, seva bwe elindirira okuggalawo sessions za IM chat ezitalina kye zikola.
zimbra_http_originating_ip_header = HTTP header etunuulirwa okuzuula IP address eyasooka eya client.
zimbra_session_limit_imap = Omuwendo ogusingayo ogwa IMAP folders omukozesa omu zayinza okuggulawo omulundi gumu.
zimbra_session_limit_admin = Omuwendo ogusingayo ogwa admin SOAP sessions omukozesa omu zayinza okuggulawo omulundi gumu.
zimbra_session_limit_soap = Omuwendo ogusingayo ogwa soap sessions ezikola ku buli akawunti. Yongera omuwendo guno n obwegendereza okwewala ensobi za "Too many SOAP sessions" mu mailbox.log.
zimbra_session_limit_sync = Omuwendo ogusingayo ogwa per-session sync listeners ku ActiveSync. Yongera omuwendo guno n obwegendereza okwewala ensobi za "Too many SYNCLISTENER sessions" mu sync.log.
zimbra_session_timeout_soap = Idle timeout, mu seconds, ya SOAP sessions.
zimbra_session_max_pending_notifications = Omuwendo ogusingayo ogwa notifications ezinnindiriddwa ezisobola okuterekebwa mu SOAP session nga tannaggibwamu layini era client n agambibwa nti embeera ye si ntuufu.
zimbra_converter_enabled_uuencode = Oba decoder ya UUENCODE eddukanyizibwa nga baparasa obubaka okuva mu store.
zimbra_converter_enabled_tnef = Oba decoder ya TNEF eddukanyizibwa nga baparasa obubaka okuva mu store.
zimbra_converter_depth_max = Obuziba bwa recursive MIME part obukka wansi converters we zitasobola kukolera.
zimbra_ssl_enabled = Oba ssl keystore etikkibwa oba nedda.
stats_img_folder = Dayirekita ey okutereka ebifaananyi bya sitatistiki ebikolebwa.
ldap_host = LDAP host ekozesebwa. Kivudde mu nkola kati, nsaba okozese ldap_url mu kifo kyayo.
ldap_log_level = Mutendera gwa LDAP logging
ldap_port = LDAP port ekozesebwa. Kivudde mu nkola kati, nsaba okozese ldap_url mu kifo kyayo.
ldap_url = Olukalala lwa seva za LDAP ezikozesebwa seva eno.
ldap_master_url = URL egenda ku LDAP master.
ldap_is_master = Host eno ye master LDAP server?
ldap_root_password = Password ekozesebwa ku rootdn ya LDAP slapd.conf. Nga kyangu, mu kiseera kyokutandikawo LDAP, password eyawuse ekolebwa, neterekebwa mu local config ne mu slapd.conf. Bwoba oyagala okukyusa password eno, kozesa pulogulaamu ya zmldappasswd ejja okukyusa password mu slapd.conf ne mu local config.
ldap_connect_timeout = Milliseconds eziyita oluvannyuma lwazo okugezaako okukolagana ne bikutulibwa.
ldap_read_timeout = Milliseconds eziyita oluvannyuma lwazo okugezaako okusoma ne kukutulibwa.
ldap_deref_aliases = Oba aliases zizibulwamu olw ennyonnyola nga onoonya oba nga weyunga ku dayirekita ey ebweru. Emiwendo egikkirizibwa: always, never, finding, searching
ldap_connect_pool_master = Oba JNDI connection pooling ekozesebwa ku LDAP master.
ldap_connect_pool_debug = Oba okukebereza LDAP connection pooling kukolebwa.
ldap_connect_pool_initsize = Omuwendo ogusookerwako ogwa active LDAP connections okugenda gugenda gweyongera okutuukako.
ldap_connect_pool_maxsize = Omuwendo ogusingayo ogwa LDAP active ne idle connections ezikkirizibwa.
ldap_connect_pool_prefsize = Omuwendo ogwettanirwa ogwa LDAP connections. Okuteeka maxsize ne prefsize ku muwendo gwe gumu kukuuma connection pool ku bunene obutakyuka.
ldap_connect_pool_timeout = Milliseconds z obudde obutali na mulimu nga tannaggibwa okuva mu pool connection etalina mulimu.
ldap_connect_pool_health_check_on_checkout_enabled = Oba okukebereza obulamu bwa connection pool kujja kuyitibwa buli lwe wabaawo connection egenda okuggyibwa okugikozesa. Singa okukebereza kwa OnCheckout kukkirizibwa, okukebereza okuddayo mu biseera ebya background kujja kuzikirizibwa.
ldap_connect_pool_health_check_interval_millis = Obuwanvu bw obudde mu milliseconds obuyita wakati w okukebereza obulamu obuddayo mu background ku connections eziriwo mu connection pool.
ldap_connect_pool_health_check_max_response_time_millis = Obuwanvu obusingayo obwa milliseconds obukkirizibwa okuyita nga tonnafuna kuddamu okuva ku health check okuva ku LDAP server.
ldap_replication_password = Password ekozesebwa omukozesa wa syncrepl okukakasa eri ldap master.
ldap_postfix_password = Password ekozesebwa postfix okukakasa eri ldap.
ldap_amavis_password = Password ekozesebwa amavis okukakasa eri ldap.
ldap_starttls_supported = Oba LDAP server ewagira omulimu gwa startTLS.
ldap_require_tls = Oba TLS yeetaagibwa eri LDAP clients.
ldap_cache_account_maxsize = Omuwendo ogusingayo ogwa account objects okutereka mu cache.
ldap_cache_account_maxage = Obukadde obusingayo, mu ddakiika, obwa account objects mu cache.
ldap_cache_cos_maxsize = Omuwendo ogusingayo ogwa cos objects okutereka mu cache.
ldap_cache_cos_maxage = Obukadde obusingayo, mu ddakiika, obwa cos objects mu cache.
ldap_cache_domain_maxsize = Omuwendo ogusingayo ogwa domain objects okutereka mu cache.
ldap_cache_domain_maxage = Obukadde obusingayo, mu ddakiika, obwa domain objects mu cache.
ldap_cache_mime_maxage = Obukadde obusingayo, mu ddakiika, obwa MIME objects mu cache.
ldap_cache_server_maxsize = Omuwendo ogusingayo ogwa server objects okutereka mu cache.
ldap_cache_server_maxage = Obukadde obusingayo, mu ddakiika, obwa group objects mu cache.
ldap_cache_share_locator_maxsize = Omuwendo ogusingayo ogwa account items mu named entry cache.
ldap_cache_share_locator_maxage = TTL ya named entry cache mu ddakiika.
ldap_cache_timezone_maxsize = Omuwendo ogusingayo ogwa timezone objects okutereka mu cache.
ldap_cache_zimlet_maxsize = Omuwendo ogusingayo ogwa zimlet objects okutereka mu cache.
ldap_cache_zimlet_maxage = Obukadde obusingayo, mu ddakiika, obwa zimlet objects mu cache.
ldap_cache_custom_dynamic_group_membership_maxage_ms = Obukadde obusingayo, mu milliseconds, okutereka mu cache amawulire agalaga dynamic groups omukozesa gy ali mmemba eri ezo ezisalibwa ne custom MemberURL.
csrf_filter_domain_allowed_ref_hosts_max_size = Omuwendo ogusingayo ogwa domain entries mu cache ya CsrfFilter per-domain allowedRefererHosts. Bwe wabaawo ensobi mu parsing, kiddamu ku ldap_cache_domain_maxsize.
csrf_filter_domain_allowed_ref_hosts_cache_expiry_mins = Obukadde obusingayo, mu ddakiika, obwa entries mu cache ya CsrfFilter per-domain allowedRefererHosts. Oluvannyuma lw okuggwaako, entry eggibwamu era etikkibwa nate okuva mu LDAP ku kusaba okuliddako. Bwe wabaawo ensobi mu parsing, kiddamu ku ddakiika 60.
mysql_directory = Ekifo we bateeka MySQL.
mysql_data_directory = Dayirekita MySQL data mwe zirina okubeera.
mysql_errlogfile = Logi y'ensobi eya MySQL/MariaDB.
mysql_socket = Ekkubo erigenda ku socket ya MySQL ey'okukozesebwa ebikozesebwa bya layini y'amateeka ebya MySQL.
mysql_pidfile = Fayiro mwe batereka ID ya process ya MySQL.
mysql_mycnf = Ekkubo erigenda ku my.cnf, fayiro ya config ya MySQL.
mysql_bind_address = Intafeesi ku host eno MySQL gy'eneesibako.
mysql_port = Namba ya port seva ya MySQL gy'egwanidde okuwulirirako.
mysql_root_password = Ekigambo ky'ekyama eky'omukozesa wa MySQL ow'omu 'root', ekitasaanye kutabulwa n'okuyingira kwa UNIX root. Olw'okwanguyiza, mu kiseera eky'okutandikawo database, bakola ekigambo ky'ekyama eky'ekimpowooze ne bakitereka mu local config ne mu MySQL. Bw'oba oyagala okukyusa ekigambo ky'ekyama kino, nsaba okozese pulogulaamu ya zmmypasswd egenda okukyusa ekigambo ky'ekyama mu MySQL ne mu local config byombi.
mysql_memory_percent = Ebitundu ku kikumi eby'ekijjukizo kya sisitemu mysql bye erina okukozesa. Omuwendo guno guterekebwa wano gukozesebwe pulogulaamu ya zmmycnf. Okukyusa enteekateeka eno tekirabika mangu ku seva ya MySQL. Ojja kwetaaga, n'obwegendereza bungi, okuddamu okukola my.cnf n'okutandika buggya seva ya MySQL enkyukakyuka esobole okukola.
mysql_innodb_log_buffer_size = Laba ebiwandiiko bya MySQL ku innodb_log_buffer_size. Omuwendo guno guterekebwa wano gukozesebwe pulogulaamu ya zmmycnf. Okukyusa enteekateeka eno tekirabika mangu ku seva ya MySQL. Ojja kwetaaga, n'obwegendereza bungi, okuddamu okukola my.cnf n'okutandika buggya seva ya MySQL enkyukakyuka esobole okukola.
mysql_innodb_log_file_size = Laba ebiwandiiko bya MySQL ku innodb_log_file_size. Omuwendo guno guterekebwa wano gukozesebwe pulogulaamu ya zmmycnf. Okukyusa enteekateeka eno tekirabika mangu ku seva ya MySQL. Ojja kwetaaga, n'obwegendereza bungi, okuddamu okukola my.cnf n'okutandika buggya seva ya MySQL enkyukakyuka esobole okukola.
mysql_sort_buffer_size = Laba ebiwandiiko bya MySQL ku sort_buffer_size. Omuwendo guno guterekebwa wano gukozesebwe pulogulaamu ya zmmycnf. Okukyusa enteekateeka eno tekirabika mangu ku seva ya MySQL. Ojja kwetaaga, n'obwegendereza bungi, okuddamu okukola my.cnf n'okutandika buggya seva ya MySQL enkyukakyuka esobole okukola.
mysql_read_buffer_size = Laba ebiwandiiko bya MySQL ku read_buffer_size. Omuwendo guno guterekebwa wano gukozesebwe pulogulaamu ya zmmycnf. Okukyusa enteekateeka eno tekirabika mangu ku seva ya MySQL. Ojja kwetaaga, n'obwegendereza bungi, okuddamu okukola my.cnf n'okutandika buggya seva ya MySQL enkyukakyuka esobole okukola.
mysql_backup_retention = Omuwendo gwa verisiyo za backup ya database ya mysql ez'okukuumibwa.
antispam_mysql_enabled = Kozesa database ya mysql ku antispam. Ku bwa bulijjo kiba false.
antispam_backup_retention = Omuwendo gwa verisiyo za backup ya database ya antispam ez'okukuumibwa.
derby_properties = Ekkubo erigenda ku fayiro ya derby configuration properties.
imap_max_consecutive_error = Bwe kiba kisukka ku 0, gala ennyungibwa ya imap ng'omuwendo gwa imap_max_consecutive_error gutuuse.
imap_inactive_session_cache_size = Ehcache: omuwendo ogusinga obungi ogwa entry za kaashi ya IMAP ezitakola ku disiki nga tezinnagobwamu.
imap_use_ehcache = Bwe kiba nga true, kozesa Ehcache okutereka kaashi ya sesoni za IMAP. Si bwe kiri, kozesa kaashi ya disiki.
imap_write_timeout = Teekawo ekiseera ekisinga obuwanvu eky'okuwandiika ekya sesoni ya IMAP (nio).
imap_write_chunk_size = Obunene mu bytes obwa buffer y'okuwandiika ya IMAP.
imap_thread_keep_alive_time = Ekiseera ekya bulijjo, mu sikonda, ekya thread ya IMAP.
imap_throttle_ip_limit = Bwe kiba kisukka ku 0, omuwendo ogusinga obungi ogwa kusaba kwa IMAP buli sikonda ku buli IP.
imap_throttle_acct_limit = Bwe kiba kisukka ku 0, omuwendo ogusinga obungi ogwa kusaba kwa IMAP buli sikonda ku buli akawunti.
imap_suggested_batch_copy_size = Omuwendo gw'obubaka obukolebwako mu buli batch mu mirimu gya IMAP COPY.
imap_in_progress_response_thread_pool_size = Thread ezisinga obungi mu pool ez'okuweereza okuddamu kwa InProgress eri client.
imap_in_progress_response_thread_keep_alive = Ekiseera mu sikonda thread ky'ekuumiibwamu nga tennamalibwawo.
imap_ehcache_heap_size = Omuwendo ogusinga obungi ogwa entry za kaashi ya IMAP eziterekebwa mu heap tier ya Ehcache.
imap_ehcache_skip_large_folder = Bw'eba esobozeddwa, tesimba folda za IMAP ennene mu kaashi ya Ehcache.
imap_ehcache_folder_max_message_count = Ekkomo ly'omuwendo gw'obubaka erisukkaako folda za IMAP ne zitateekebwa mu Ehcache.
nio_imap_enabled = Bwe kiba nga true, ssaako Jetty non-blocking IO ku IMAP.
nio_pop3_enabled = Bwe kiba nga true, ssaako Jetty non-blocking IO ku POP3.
postfix_mail_owner = postfix_mail_owner
postfix_setgid_group = postfix_setgid_group
postfix_version = postfix_version
mailboxd_directory = Ekifo awateekebwa mailboxd.
mailboxd_java_heap_size = Omuwendo gwa megabyte ogukozesebwa ng'obunene bwa Java heap obusinga obungi (-Xmx) obwa JVM etambuza Mailboxd.
mailboxd_java_heap_new_size_percent = Ebitundu ku kikumi eby'obunene bwa Java heap ebikozesebwa ku young generation (-Xmn) eya JVM etambuza Mailboxd.
mailboxd_java_options = JVM options ez'okukozesa ng'otandika Mailboxd.
mailboxd_pidfile = Fayiro mwe batereka ID ya process ya Mailboxd JVM.
mailboxd_keystore = Ekifo awali fayiro ya data ya keystore.
mailboxd_keystore_password = Ekigambo ky'ekyama ekinaakozesebwanga ne keystore ya KeyManager.
mailboxd_truststore = Ekifo awali fayiro ya data ya truststore.
mailboxd_truststore_password = Ekigambo ky'ekyama ekinaakozesebwanga ne truststore ya TrustManager.
client_ssl_truststore = Ekifo awali fayiro ya data ya truststore ekikozesebwa ku client SSL authentication.
client_ssl_truststore_password = Ekigambo ky'ekyama ekinaakozesebwanga ne keystore ya client SSL TrustManager.
mailboxd_output_file = Fayiro okwokukyusiramu stdout ne stderr ebiva ku seva.
mailboxd_output_rotate_interval = Ekiseera, mu sikonda, mailboxd output file lwe ekyusibwamu. Bwe kiba <= 0, tewali kukyusa kukolebwa.
mailboxd_thread_stack_size = Obunene bwa thread stack bwa Mailboxd.
ssl_allow_untrusted_certs = Bwe kiba nga true, kkiriza self-signed SSL certificates.
zimlet_directory = Ekkubo erigenda ku Zimlet eziteekeddwa.
calendar_outlook_compatible_allday_events = Kozesa ebibaawo eby'olunaku lwonna ebikwatagana ne Outlook. Ku bwa bulijjo kiba false.
calendar_entourage_compatible_timezones = Teeka TZID parameter mu bubonero bwa quotes mu iCalendar properties, okukendeeza ku nsobi ya MS Entourage. Ku bwa bulijjo kiba true.
calendar_ics_import_full_parse_max_size = Mu kuyingiza ics, kozesa full parser singa obunene bwa ics buba wansi oba bwenkana kino; fayiro za ics ezisinga obunene zitegeezebwa callback parser etakkiriza forward references ku VTIMEZONE TZID.
calendar_canonical_tzid = ID ya timezone erina okudda nga TimeZone.getCanonicalID(). Emiwendo egisoboka: "olson","windows","java". Ku bwa bulijjo kiba "windows".
calendar_cache_enabled = Ssobozesa calendar cache. Ku bwa bulijjo kiba false.
calendar_cache_directory = Root directory ya fayiro za calendar cache.
calendar_cache_lru_size = Obunene bwa memory-cache LRU. Kaasha folda za kalenda ez'enkana zino mu memory.
calendar_cache_range_month_from = Omwezi ogutandikirwako mu cached range. 0 kitegeeza omwezi oguliwo, -1 kitegeeza omwezi oguwedde, n'ebirala.
calendar_cache_range_months = Omuwendo gw'emyezi egiri mu cached range.
krb5_keytab = Ekifo kya fayiro ya keytab eya Zimbra Kerberos 5.
krb5_debug_enabled = Ssobozesa Kerberos debugging.
zimbra_mtareport_max_hosts = Omuwendo ogusinga obungi ogwa host ezigenda okuteekebwa mu lipoota za MTA eza buli lunaku ezikolebwa zmdailyreport.
zimbra_mtareport_max_recipients = Omuwendo gw'abafuna okuteekebwa mu lipoota za mta eza buli lunaku.
zimbra_mtareport_max_senders = Omuwendo gw'abasindika okuteekebwa mu lipoota za mta eza buli lunaku.
zimbra_mtareport_max_users = Omuwendo ogusinga obungi ogwa bakozesa okuteekebwa mu lipoota za MTA eza buli lunaku ezikolebwa zmdailyreport.
zimbra_auth_always_send_refer = Bulijjo zzaayo akatag <refer> mu kuddamu kw'auth okusobola okuwaliriza client okukyusibwa.
zimbra_admin_service_port = Port ya admin eya bulijjo/ey'okutandikisa.
zimbra_admin_service_scheme = Enkola ya protocol ya admin eya bulijjo/ey'okutandikisa.
zimbra_mail_service_port = Port ya mail eya bulijjo.
zimbra_zmprov_default_to_ldap = Oba zmprov ekozesa LDAP oba SOAP ku bwa bulijjo.
zimbra_zmprov_default_soap_server = Seva ya soap eya bulijjo zmprov gy'eyungako.
zmprov_safeguarded_attrs = Olukalala olwawulwamu akawatule olw'ebifo bya provisioning eby'obungi obw'enjawulo ebyetaaga okukuumibwa obutakyusibwa mu kifo.
zmprov_tmp_directory = Dayirekita ey'akaseera zmprov mw'ewandiika emiwendo gya binary attribute mu fayiro.
zimbra_mailbox_groups = Omuwendo gwa mailbox groups okugabiramu mailbox empya.
debug_mailboxindex_use_new_locking = Kozesa okuziyiza okw'engeri empya ku MailboxIndex.
zimbra_class_provisioning = Kulaasi ya interface ya provisioning.
zimbra_class_accessmanager = Kulaasi ya interface ya access manager.
zimbra_class_mboxmanager = Kulaasi ya interface ya mailbox manager.
zimbra_class_database = Kulaasi ya config ya database.
zimbra_class_store = Kulaasi ya interface ya message store.
zimbra_class_application = Kulaasi ya interface ya Zimbra application.
zimbra_class_rulerewriterfactory = Kulaasi ya interface ya RuleRewriterFactory.
zimbra_class_dbconnfactory = Kulaasi ya Database connection factory.
zimbra_class_soapsessionfactory = Kulaasi ya Soap session factory.
av_notify_user = Endagiriro ya email ey'okuweerezangako obubaka bw'obuddukanya okuva ku anti-virus ne DKIM.
av_notify_domain = Domain eya bulijjo mu nteekateeka za amavisd.
data_source_trust_self_signed_certs = Kkiriza self-signed certificates ng'oyunga ku data source okuyita mu SSL.
data_source_fetch_size = Omuwendo ogusinga obungi ogwa bubaka bwa imap obunaakolebwako FETCH mu buli request.
data_source_max_literal_mem_size = Obunene obusinga obungi obwa literal data (mu bytes) obunaateekebwanga mu kaashi ya memory. Data esinga obunene ejja kuterekebwa mu temporary file.
timezone_file = Fayiro ya iCalendar eraga time zones ezimanyiddwa ennyo.
search_disable_database_hints = Bwe kiba nga true, tokozesa database hints mu queries ezikolebwa mu kunoonyereza.
search_dbfirst_term_percentage_cutoff = Paramita ey'omunda ey'okukola Query.
zmstat_interval = Emirundi samples gye zitwalibwa zmstat (mu sikonda).
zmstat_df_excludes = Olukalala lwa voliyumu za disiki olwawulwamu kolon (okusinziira ku mount path) ezirekebwamu okuva mu zmstats.
zimbra_noop_default_timeout = Ekiseera (sikonda) seva ky'ekkiriza NoOpRequest okusibira bwe kiba nga wait=1 kiragiddwa client.
zimbra_noop_min_timeout = Ekiseera ekitono ennyo eky'okulinda (sikonda) ekiragiddwa NoOpRequest.
zimbra_noop_max_timeout = Ekiseera ekisinga obuwanvu eky'okulinda (sikonda) ekiragiddwa NoOpRequest.
zimbra_waitset_default_request_timeout = Ekiseera kya timeout ekya bulijjo (sikonda) WaitSetRequest etali ya admin ky'enaasibira.
zimbra_waitset_min_request_timeout = Ekiseera kya timeout ekitono ennyo (sikonda) WaitSetRequest etali ya admin ky'enaasibira.
zimbra_waitset_max_request_timeout = Ekiseera kya timeout ekisinga obuwanvu (sikonda) WaitSetRequest etali ya admin ky'enaasibira.
zimbra_waitset_max_per_account = Omuwendo ogusinga obungi ogwa WaitSet ezitali za admin akawunti emu gwe esobola okuggulawo.
zimbra_admin_waitset_default_request_timeout = Ekiseera kya timeout ekya bulijjo (sikonda) WaitSetRequest ya admin ky'enaasibira.
