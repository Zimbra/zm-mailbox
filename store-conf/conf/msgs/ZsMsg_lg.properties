licenseFeaureOnHoldNotifierSubject = Okulabula kwa Sisitemu ya Zimbra: Ekkomo lyokukozesa feature lisusse
licenseFeaureOnHoldNotifierBodyText = Omuwendo gwa akawunti ogukkirizibwa mu layisinsi gutuuse oba gususse ku feature zino wammanga:\n{0}\nOsobola okukendeeza ku nkozesa ya bakozesa abaliwo oba okwongera ekkomo lya layisinsi ya feature.\n\nOkwongera ekkomo lya layisinsi ya feature, tukusaba otuukirire Zimbra Sales ku sales@zimbra.com.\nOkuddukanya okugabira akawunti feature, tukusaba oyingire mu Admin Portal.\n\nNsaba omanye bino wammanga:\n1. Ojja kweyongera okufuna okutegeeza kuno okumala ennaku {1,number,integer} okuva ku lunaku lwe yasusse ku nkozesa.\n2. Tojja kusobola kusobozesa feature ekozesebwa ennyo ku akawunti yonna.\n3. Bwotatwala kikolwa kyonna ku feature ekozesebwa ennyo, feature eyo ejja kusazibwamu ku bakozesa esigale mu kkomo lya layisinsi.\n\nOwawe,\nZimbra Support
licenseFeaureOnHoldNotifierBodyHtml = <div style="font-family:sans-serif;">Omuwendo gwa akawunti ogukkirizibwa mu layisinsi gutuuse oba gususse ku feature zino wammanga:<br>{0}<br>Osobola okukendeeza ku nkozesa ya bakozesa abaliwo oba okwongera ekkomo lya layisinsi ya feature.<br><br>Okwongera ekkomo lya layisinsi ya feature, tukusaba otuukirire Zimbra Sales ku <b>sales@zimbra.com</b>.<br>Okuddukanya okugabira akawunti feature, tukusaba oyingire mu Admin Portal.<br><br>Nsaba omanye bino wammanga:<br>1. Ojja kweyongera okufuna okutegeeza kuno okumala ennaku {1,number,integer} okuva ku lunaku lwe yasusse ku nkozesa.<br>2. Tojja kusobola kusobozesa feature ekozesebwa ennyo ku akawunti yonna.<br>3. Bwotatwala kikolwa kyonna ku feature ekozesebwa ennyo, feature eyo ejja kusazibwamu ku bakozesa esigale mu kkomo lya layisinsi.<br><br>Owawe,<br>Zimbra Support</div>
