passwordExpiryNotifierBodyText=Mukwetsimiwa {0},\n\nPhasiwedi ya akhawunti ya wena yi ta hela endzhaku ka Masiku ya {1}, hi {2}.\n\nKu hlayisa mfikelelo eka akhawunti ya wena, hi kombela u vuyisela phasiwedi ya wena emahlweni ka siku ro hela.\n\nU ta ya emahlweni u amukela switiviso siku ni siku ku kondza phasiwedi yi cinciwa kumbe yi hela.\n\nLeyi i imeyili ya xitiviso lexi rhumeriwaka hi ku tisungulela.
passwordExpiryNotifierBodyHtml=<p>Mukwetsimiwa {0},</p><p>Phasiwedi ya akhawunti ya wena yi ta hela endzhaku ka <strong>Masiku ya {1}</strong>, hi <strong>{2}</strong>.</p><p>Ku hlayisa mfikelelo eka akhawunti ya wena, hi kombela u vuyisela phasiwedi ya wena emahlweni ka siku ro hela.</p><p>U ta ya emahlweni u amukela switiviso siku ni siku ku kondza phasiwedi yi cinciwa kumbe yi hela.</p><p>Leyi i imeyili ya xitiviso lexi rhumeriwaka hi ku tisungulela.</p>

