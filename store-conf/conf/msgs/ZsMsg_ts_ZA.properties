# local config settings

zimbra_home = Mimitsu ya ku nghenisa ya Zimbra ni dayirekitara ya le kaya ya mutirhisi wa UNIX wa \u2018zimbra\u2019. A wu nge swi koti ku rhurhisa mimitsu ya ku nghenisa - u nga cincisi sete leyi.
zimbra_java_home = Ndlela yo ya eka JDK/J2SDK.
zimbra_log_directory = Dayirekitara laha tifayela ta log ti tsariwaka kona.
zimbra_index_directory = Dayirekitara ya tifayela ta index ta bokisi ra imeyili.
zimbra_store_directory = Dayirekitara ya marungula ya bokisi ra imeyili.
zimbra_db_directory = Dayirekitara ya tifayela ta databesi.
zimbra_tmp_directory = Dayirekitara ya tifayela swa nkarhinyana.
zimbra_hybrid_blob_mover_enabled = Swi veka leswaku xitirhisiwa xa Hybrid Blob Mover xi pfuriwile kumbe e-e. Default i: false
zimbra_extensions_directory = Dayirekitara leri tidayirekitara ta rona letitsongo ti nga ni ti-extension.
zimbra_extensions_common_directory = Dayirekitara leri nga ni tifayela ta jar leti tolovelekeke eka ti-extension hinkwato.
zimbra_mysql_shutdown_timeout = Nkarhi wo yima leswaku endlelo ra MySQL/MariaDB ra bokisi ra imeyili ri yima. Engetela nkarhi wo hela loko mysql.server yi teka nkarhi wo leha ngopfu ku tima endlelo.
zimbra_mysql_user = Vito ra mutirhisi ra MySQL leri tirhisiwaka ku tumbuluxa/kuma tidatabesi ni matafula ya zimbra. Leswi hi swona nkoka lowu a wu ta wu tirhisa eka opixini ya \u2018-u\u2019 ya nongonoko wa layini ya swileriso wa \u2018mysql\u2019.
zimbra_mysql_password = Phasiwedi ya zimbra_mysql_user. Yi hlayisiwa eka local config leswaku xitirhisiwa xa store xi ta tirhisa yona ku tiyisisa vumunhu. Loko u lava ku cinca phasiwedi leyi, hi kombela u tirhisa nongonoko wa zmmypasswd lowu nga ta cinca phasiwedi eka MySQL ni le ka local config.
zimbra_ldap_userdn = LDAP dn leyi tirhisiwaka ku tiyisisa xitirhisiwa xa store na LDAP.
zimbra_ldap_user = vito ra mutirhisi ra zimbra leri tirhisiwaka ku tiyisisa na admin AuthRequest.
zimbra_ldap_password = Phasiwedi ya zimbra_ldap_userdn. Yi hlayisiwa eka local config leswaku xitirhisiwa xa store xi ta tirhisa yona ku tiyisisa vumunhu. Loko u lava ku cinca phasiwedi leyi, hi kombela u tirhisa nongonoko wa zmldappasswd lowu nga ta cinca phasiwedi eka LDAP ni le ka local config.
zimbra_server_hostname = Vito leri lulamiseriweke ra sevha leyi. Ku fanele ku va ni nchumu wa \u2018server\u2019 lowu fambelanaka na wona eka LDAP - languta matsalwa ya xileriso xa CreateServer xa nongonoko wa zmprov.
zimbra_user = Mutirhisi wa unix wa zimbra loyi endlelo ra sevha ya zimbra ri faneleke ku hundzisela timfanelo eka yena endzhaku ko boha tiphoti leti nga ni timfanelo ta le henhla.
zimbra_uid = uid ya unix ya zimbra leyi endlelo ra sevha ya zimbra ri faneleke ku hundzisela timfanelo eka yona endzhaku ko boha tiphoti leti nga ni timfanelo ta le henhla.
zimbra_gid = gid ya unix ya zimbra leyi endlelo ra sevha ya zimbra ri faneleke ku hundzisela timfanelo eka yona endzhaku ko boha tiphoti leti nga ni timfanelo ta le henhla.
zimbra_log4j_properties = Ndlela yo ya eka fayili ya swihlawulekisi swa ku lulamisiwa ka log4j.
zimbra_log4j_properties_watch = Nkarhi wo rindza wa ku languta fayili ya swihlawulekisi swa ku lulamisiwa ka log4j hi msec.
zimbra_attrs_directory = Dayirekitara leri nga ni tifayela ta *.xml leti hlamuselaka sintakisi ya swiaki swa LDAP leswi tirhisiwaka hi sisiteme
localized_msgs_directory = Dayirekitara ya tifayela ta marungula lama hundzuluxiweke hi ririmi.
localized_client_msgs_directory = Dayirekitara ya tifayela ta marungula ya mutengi lama hundzuluxiweke hi ririmi.
skins_directory = Dayirekitara ya tiskaeni.
zimbra_store_sweeper_max_age = Tifayela leti kulaka ku tlula timinete leti ti susiwa hi ku tisungulela eka dayirekitara ya swilo leswi nghenaka ya store.
zimbra_store_copy_buffer_size_kb = Matirhelo yo kopa fayili ma tirhisa tibufara ta vukulu lebyi
zimbra_mailbox_galsync_cache = Swi veka cache ya le henhla ya swilo swa vakhontakiti swa bokisi ra imeyili ra galsync. Veka nkoka lowu wu va kwalomu ka nhlayo ya swilo swa vakhontakiti leswi nga eka bokisi ra imeyili ra galsync.
zimbra_mailbox_manager_hardref_cache = Nhlayo ya le henhla ya mabokisi ya imeyili lama nga ta khomiwa ememori emahlweni ka loko mailbox manager yi sungula ku pfumelela leswaku ma basisiwa hi ku tirhisa SoftReference garbage collection.
zimbra_mailbox_active_cache = Vukulu bya le henhla bya cache ya swilo ya le ndzeni ya LRU ya bokisi ra imeyili loko ku ri ni ti-session leti tirhaka.
zimbra_mailbox_inactive_cache = Vukulu bya le henhla bya cache ya swilo ya le ndzeni ya LRU ya bokisi ra imeyili loko ku nga ri na ti-session leti tirhaka.
zimbra_mailbox_change_checkpoint_frequency = Nkarhi wa ku vuyelela (eka nhlayo ya ku cinca) lowu nkoka wa ku cinca wa highwater wa ZIMBRA.MAILBOX.CHANGE_CHECKPOINT wa bokisi ra imeyili wu tsariwaka ha wona.
zimbra_index_elasticsearch_url_base = URL ya masungulo ya ElasticSearch REST API.
zimbra_index_threads = Vukulu bya phulu ya tithirede eka batch index
zimbra_reindex_threads = Nhlayo ya le henhla ya tithirede ta re-index. Tithirede ta re-index a ti hlengeletiwi eka phulu.
zimbra_index_disable_perf_counters = Loko ku ri false, ku hlaya ni ku tsala ka Lucene IO swi landzeleriwa hi ku vekiwa tihlo ka matirhelo ka Zimbra. Nkoka wa true wu tima ku vekiwa tihlo ka Lucene IO.
zimbra_index_max_readers = Nhlayo ya le henhla ya ti-IndexReader leti tirhaka hi nkarhi wun'we
zimbra_index_max_writers = Nhlayo ya le henhla ya ti-IndexWriter leti tirhaka hi nkarhi wun'we
zimbra_index_reader_cache_size = Nhlayo leyikulu ya IndexReaders eka kheshe ya xikombo xa ku lava.
zimbra_index_reader_cache_ttl = Loko yi nga tirhi nkarhi wo tlula ntikelo lowu (tisekoni), susa IndexReader eka kheshe.
zimbra_index_deferred_items_failure_delay = Endzhaku ka ku tsandzeka, ku hlwela lokutsongo (tisekoni) exikarhi ka matshalatshala yo basisa layini ya swilo leswi nga xikombiwangiki (swi yimisiweke).
zimbra_index_lucene_max_terms_per_query = Seta nhlayo leyikulu ya marito lama pfumeleriweke eka xikombelo xinwana ni xinwana.
zimbra_index_max_transaction_bytes = Loko ku hlengeletiwa matirhelo ya xikombo eka tiranakixini ya Mailbox, leyi i sayizi leyikulu hinkwayo ya swilo leswi pfumeleriwaka eka tiranakixini yinwe.
zimbra_index_max_transaction_items = Loko ku hlengeletiwa matirhelo ya xikombo, leyi i nhlayo leyikulu ya mail_items leyi hi yi pfumelelaka eka tiranakixini yinwe.
zimbra_index_max_pending_deletes = Nhlayo leyikulu ya swilo leswi susiweke eka xikombo leswi nga si hetisiwaka ku nga si tlhela ku vuyeriwa ndhawu ya diski.
zimbra_index_lucene_merge_policy = Loko ku ri ntiyiso, tirhisa LogDocMergePolicy; loko ku nga ri ntiyiso, tirhisa LogByteSizeMergePolicy. LogDocMergePolicy yi hlawula swiphemu leswi nga ta hlanganisiwa hi ku ya hi nhlayo ya tidokumente. LogByteSizeMergePolicy yi hlawula swiphemu leswi nga ta hlanganisiwa hi ku ya hi sayizi ya swona.
zimbra_index_lucene_min_merge = Yi seta sayizi leyintsongo ya ku hlanganisa ya Lucene hi Tidokumente kumbe KB ku ya hi pholisi ya ku hlanganisa leyi boxiweke eka zimbra_index_lucene_merge_policy.
zimbra_index_lucene_max_merge = Yi seta sayizi leyikulu ya ku hlanganisa ya Lucene hi Tidokumente kumbe KB ku ya hi pholisi ya ku hlanganisa leyi boxiweke eka zimbra_index_lucene_merge_policy. Ntikelo lowu wu kombisa xiphemu lexikulu swinene lexi nga hlanganisiwaka ni swiphemu swinwana.
zimbra_index_lucene_merge_factor = Swikombiso swa swiphemu swi hlanganisiwa kangani hi addDocument(). Hi mintikelo leyitsongo, RAM yi tirhisiwa ntsongo loko ku endliwa xikombo naswona ku lavisisa ka hatlisa, kambe rivilo ro endla xikombo ra nonoka. Hi mintikelo leyikulu, RAM yo tala yi tirhisiwa loko ku endliwa xikombo, naswona hambileswi ku lavisisa ku nonokaka, ku endla xikombo ka hatlisa. Mintikelo leyikulu (>10) yi pfuna swinene eka ku tumbuluxa swikombo hi swiphepherhele, kasi leyitsongo (<10) eka swikombo leswi hlayisiwaka hi ku tirhisana.
zimbra_index_lucene_term_index_divisor = Yi teka xikombiso xa marito lama nga xikombiwaka lama layichiwaka eka RAM. Hi ku seta leswi eka ntikelo lowu tlula 1 u nga hunguta ku tirhisiwa ka memori kambe ku ta va ni ku nonoka lokukulu loko ku layichiwa rungula ra rekhodo leri hlayisiweke eka rito.
zimbra_index_lucene_use_compound_file = Loko ku ri ntiyiso, xiphemu lexintshwa xa Lucene xi fanele ku tirhisa fomati ya fayili leyi hlanganisiweke. http://wiki.apache.org/lucene-java/ImproveIndexingSpeed yi vula leswaku ku timiwa fomati leyi hlanganisiweke swi nyika matirhelo lamanene, kambe swi ta engetela swinene nhlayo ya tifayili leti pfuriweke. Tifayili leti pfuriweke ti nga hela loko zimbra_index_lucene_merge_factor yi ri leyikulu.
zimbra_index_lucene_max_buffered_docs = Nhlayo leyintsongo ya tidokumente leyi lavekaka ku nga si cheriwa tidokumente ta memori leti khomeriweke tanihi xiphemu lexintshwa. Mintikelo leyikulu hi ntolovelo yi nyika ku endliwa ka swikombo hi ku hatlisa.
zimbra_index_lucene_ram_buffer_size_kb = RAM leyi bufariweke swinene ya Lucene hi KB.
zimbra_index_lucene_io_impl = Xitirhisiwa xa Lucene FSDirectory lexi tirhisiwaka eka indexing IO. Mintikelo leyi nga kona: nio - tirhisa NIOFSDirectory. Xi tirhisa positional io ya FileChannel ya java.nio loko ku hlayiwa leswaku ku papalatiwa ku tiyiseriwa loko ku hlayiwa eka fayili yinwe. mmap - tirhisa MMapDirectory. Xi tirhisa memory-mapped IO loko ku hlayiwa. I nhlawulo lowunene loko memori ya xiviri yi tele loko yi pimanisiwa ni sayizi ya xikombo. simple - tirhisa SimpleFSDirectory. Xi tirhisa java.io.RandomAccessFile. Xi na matirhelo yo biha loko ku ri ni ku hlaya hi nkarhi wunwe hikuva xi tiyisisa loko minseve yo tala yi hlaya fayili yinwe. Loko ku nga nyikiwanga ntikelo, FSDirectory yi ta hlawula xitirhisiwa lexinene eka mbango wolowo.
zimbra_index_rfc822address_max_token_count = Nhlayo leyikulu ya titokene ta tiadirese eka ntila wa titokene ta adirese ya RFC822. Ndzilakano lowu wu tirha eka tihoko hinkwato ta FROM, TO, na CC ta ti-imeyili, hinkwato ta tiadirese ta imeyili ta Vakhontakiti, ni nsimu ya Muvumbi ya Tidokumente.
zimbra_index_rfc822address_max_token_length = Vulehi lebyikulu bya tokene eka adirese eka ntila wa titokene ta adirese ya RFC822. Ndzilakano lowu wu tirha eka tihoko hinkwato ta FROM, TO, na CC ta ti-imeyili, hinkwato ta tiadirese ta imeyili ta Vakhontakiti, ni nsimu ya Muvumbi ya Tidokumente.
zimbra_index_wildcard_max_terms_expanded = Ku andzisiwa lokukulu ka wildcard eka rito rinwana ni rinwana eka xikombelo.
zimbra_galsync_index_reader_cache_size = Nhlayo leyikulu ya IndexReaders eka kheshe ya xikombo xa ku lava xa GAL. Xikombo xa Lucene xa akhawunti ya sync ya GAL xi kheshiwa hi ku hambana naswona a xi na ku susiwa hi ku tisungulela.
zimbra_spam_report_queue_size = Eka Junk/Not Junk Msg/ConvActionRequests, sayizi leyi ya layini yi pima workqueue ya sevha leyi tirhiselwaka ku tirhisa ku hundzisela emahlweni.
zimbra_throttle_op_concurrency = Nxaxamelo lowu hambanisiweke hi tikhoma wa mintikelo ya concurrency ya magoza ya nkoka ya 5 hi ku landzelana ku suka eka lexi nga xa nkoka swinene ku ya eka lexi nga xa nkoka wutsongo.
zimbra_im_chat_flush_time = Tichati ta IM leti pfulekeke ti tsariwa eka vuhlayiselo kangani (tisekoni).
zimbra_im_chat_close_time = Sevha yi ta rindza nkarhi wo tanihi kwihi (tisekoni) ku pfala tiseshini ta chat ta IM leti nga tirhiki.
zimbra_http_originating_ip_header = Hedara ya HTTP leyi faneleke ku langutiwa ku kumisisa IP ya xiviri ya kliyente.
zimbra_session_limit_imap = Nhlayo leyikulu ya tifowudara ta IMAP leti mutirhisi un\u2019we a nga vaka na tona ti pfulekile hi nkarhi wun\u2019we.
zimbra_session_limit_admin = Nhlayo leyikulu ya tiseshini ta admin SOAP leti mutirhisi un\u2019we a nga vaka na tona ti pfulekile hi nkarhi wun\u2019we.
zimbra_session_limit_soap = Nhlayo leyikulu ya tiseshini ta SOAP leti tirhaka hi akhawunti yinwe. Engetelani ntikelo lowu hi vukheta leswaku mi papalata swihoxo swa "Too many SOAP sessions" eka mailbox.log.
zimbra_session_limit_sync = Nhlayo leyikulu ya swiyingiseri swa sync hi seshini xinwe swa ActiveSync. Engetelani ntikelo lowu hi vukheta leswaku mi papalata swihoxo swa "Too many SYNCLISTENER sessions" eka sync.log.
zimbra_session_timeout_soap = Nkarhi wo hela wa ku nga tirhi (hi tisekoni) wa tiseshini ta SOAP.
zimbra_session_max_pending_notifications = Nhlayo leyikulu ya switiviso leswi yimeke leswi nga vekiwaka erhengeni eka seshini ya SOAP ku nga si basisiwa rhenga naswona kliyente a byela leswaku xiyimo xa yona a xa ha tirhi.
zimbra_converter_enabled_uuencode = Loko UUENCODE decoder yi fambisiwa loko ku hlayiwa marungula ku suka eka vuhlayiselo.
zimbra_converter_enabled_tnef = Loko TNEF decoder yi fambisiwa loko ku hlayiwa marungula ku suka eka vuhlayiselo.
zimbra_converter_depth_max = Vuenti bya swiphemu swa MIME lebyi vuyeleriwaka lebyi nga ehansi ka byona ku hundzuluxela swi nga tekiki goza.
zimbra_ssl_enabled = Loko ku layichiwa ssl keystore kumbe e-e.
stats_img_folder = Dayirekitheri ya ku hlayisa swifaniso swa tinhlayo leswi endliweke.
ldap_host = Xigwitsi xa LDAP lexi nga ta tirhisiwa. Xi herisiwile ku tirhisiwa - kombela tirhisa ldap_url ematshan\u2019wini ya xona.
ldap_log_level = Levhele ya ku loga ya LDAP.
ldap_port = Photi ya LDAP leyi nga ta tirhisiwa. Yi herisiwile ku tirhisiwa - kombela tirhisa ldap_url ematshan\u2019wini ya yona.
ldap_url = Nxaxamelo wa tisevha ta LDAP leti tirhisiwaka hi sevha leyi.
ldap_master_url = URL ya sevha leyikulu ya LDAP.
ldap_is_master = Xana host leyi hi yona sevha leyikulu ya LDAP?
ldap_root_password = Phasiwedi ya rootdn ya LDAP slapd.conf. Leswi swi olovisa, hi nkarhi wa ku sungula ka LDAP ku endliwa phasiwedi ya ku hlawula, yi hlayisiwa eka local config na le slapd.conf. Loko u lava ku cinca phasiwedi leyi, tirhisa nongonoko wa zmldappasswd lowu nga ta cinca phasiwedi eka slapd.conf na le local config.
ldap_connect_timeout = Milliseconds leyi endzhaku ka yona ku ringeta ku hlanganisa ku tshikisiwaka.
ldap_read_timeout = Milliseconds leyi endzhaku ka yona ku ringeta ku hlaya ku tshikisiwaka.
ldap_deref_aliases = Loko ku ta endliwa dereference ya ti-aliases loko ku lavisisa kumbe ku boha eka directory ya le handle. Mintikelo leyi tirhaka hi leyi: always, never, finding, searching.
ldap_connect_pool_master = Loko ku tirhisiwa JNDI connection pooling eka sevha leyikulu ya LDAP.
ldap_connect_pool_debug = Loko ku debugiwa LDAP connection pooling.
ldap_connect_pool_initsize = Nhlayo yo sungula ya swihlanganisi swa LDAP leswi tirhaka leswi faneleke ku tlheleriwa eka swona.
ldap_connect_pool_maxsize = Nhlayo leyikulu ya swihlanganisi swa LDAP leswi tirhaka ni leswi nga tirhiki leswi pfumeleriwaka.
ldap_connect_pool_prefsize = Nhlayo leyi tsakeriwaka ya swihlanganisi swa LDAP - ku seta maxsize na prefsize eka ntikelo wun'we swi hlayisa pool ya swihlanganisi eka sayizi leyi nga cinciki.
ldap_connect_pool_timeout = Milliseconds ya nkarhi wo nga tirhi ku nga si susiwa xihlanganisi lexi nga tirhiki eka pool.
ldap_connect_pool_health_check_on_checkout_enabled = Loko ku ri leswaku ku kambela rihanyo ra pool ya xihlanganisi ku ta vitaniwa nkarhi wunwana ni wunwana loko xihlanganisi xi ri kusuhi na ku humesiwa leswaku xi tirhisiwa. Loko ku kambela rihanyo ka OnCheckout ku pfunghiwe, ku kambela rihanyo hi nkarhi hi ndzhaku ku ta timiwa.
ldap_connect_pool_health_check_interval_millis = Nkarhi wa vulehi hi milliseconds exikarhi ka ku kambela rihanyo hi nkarhi hi ndzhaku eka swihlanganisi leswi kumekaka eka pool ya swihlanganisi.
ldap_connect_pool_health_check_max_response_time_millis = Vulehi lebyikulu bya nkarhi hi milliseconds lebyi faneleke ku pfumeleriwa leswaku nhlamulo ya ku kambela rihanyo yi vuya ku suka eka sevha ya LDAP.
ldap_replication_password = Phasiwedi leyi mutirhisi wa syncrepl a yi tirhisaka ku tiyisisa eka sevha leyikulu ya ldap.
ldap_postfix_password = Phasiwedi leyi postfix yi yi tirhisaka ku tiyisisa eka ldap.
ldap_amavis_password = Phasiwedi leyi amavis yi yi tirhisaka ku tiyisisa eka ldap.
ldap_starttls_supported = Loko sevha ya LDAP yi seketela ntirho wa startTLS.
ldap_require_tls = Loko TLS yi boheka eka tiklayente ta LDAP.
ldap_cache_account_maxsize = Nhlayo leyikulu ya ti-objekiti ta akhawunti leti nga ta kheshiwa.
ldap_cache_account_maxage = Vukhale lebyikulu (hi timinete) bya ti-objekiti ta akhawunti eka kheshe.
ldap_cache_cos_maxsize = Nhlayo leyikulu ya ti-objekiti ta COS leti nga ta kheshiwa.
ldap_cache_cos_maxage = Vukhale lebyikulu (hi timinete) bya ti-objekiti ta COS eka kheshe.
ldap_cache_domain_maxsize = Nhlayo leyikulu ya ti-objekiti ta domeni leti nga ta kheshiwa.
ldap_cache_domain_maxage = Vukhale lebyikulu (hi timinete) bya ti-objekiti ta domeni eka kheshe.
ldap_cache_mime_maxage = Vukhale lebyikulu (hi timinete) bya ti-objekiti ta MIME eka kheshe.
ldap_cache_server_maxsize = Nhlayo leyikulu ya ti-objekiti ta sevha leti nga ta kheshiwa.
ldap_cache_server_maxage = Vukhale lebyikulu (hi timinete) bya ti-objekiti ta ntlawa eka kheshe.
ldap_cache_share_locator_maxsize = Nhlayo leyikulu ya swilo swa akhawunti eka kheshe ya swinandzi leswi thyiweke mavito.
ldap_cache_share_locator_maxage = TTL ya kheshe ya swinandzi leswi thyiweke mavito hi timinete.
ldap_cache_timezone_maxsize = Nhlayo leyikulu ya ti-objekiti ta ndhawu ya nkarhi leti nga ta kheshiwa.
ldap_cache_zimlet_maxsize = Nhlayo leyikulu ya ti-objekiti ta Zimlet leti nga ta kheshiwa.
ldap_cache_zimlet_maxage = Vukhale lebyikulu (hi timinete) bya ti-objekiti ta Zimlet eka kheshe.
ldap_cache_custom_dynamic_group_membership_maxage_ms = Vukhale lebyikulu (hi milliseconds) lebyi kheshiwaka bya leswaku hi tihi tidynamic groups leti akhawunti yi nga xirho xa tona eka mintlawa leyi vuxirho bya yona byi kumekaka hi custom MemberURL.
csrf_filter_domain_allowed_ref_hosts_max_size = Nhlayo leyikulu ya swinandzi swa domeni eka kheshe ya CsrfFilter per-domain allowedRefererHosts. Yi wela eka ldap_cache_domain_maxsize loko ku ri ni xihoxo xo hlaya.
csrf_filter_domain_allowed_ref_hosts_cache_expiry_mins = Vukhale lebyikulu (hi timinete) bya swinandzi eka kheshe ya CsrfFilter per-domain allowedRefererHosts. Endzhaku ka nkarhi lowu, xinandzi xa susiwa naswona xi tlhela xi layichiwa ku suka eka LDAP eka xikombelo lexi landzelaka. Yi wela eka 60 wa timinete loko ku ri ni xihoxo xo hlaya.
mysql_directory = Ndhawu ya ku nghenisiwa ka MySQL.
mysql_data_directory = Dayirekitheri leyi data ya MySQL yi faneleke ku tshama eka yona.
mysql_errlogfile = Logi ya swihoxo ya MySQL/MariaDB.
mysql_socket = Ndlela ya sokheti ya MySQL leyi tirhisiwaka hi switirhisiwa swa layini ya xileriso ya MySQL.
mysql_pidfile = Fayili leyi ID ya phurosese ya MySQL yi hlayisiwaka eka yona.
mysql_mycnf = Ndlela ya my.cnf, fayili ya ku lulamisa ya MySQL.
mysql_bind_address = Interface ya host leyi leyi MySQL yi nga ta boheka eka yona.
mysql_port = Nomboro ya photi leyi sevha ya MySQL yi faneleke ku yingisela eka yona.
mysql_root_password = Phasiwedi ya mutirhisi wa "root" wa ka ndzilo wa MySQL, ku nga ri ku nghena ka UNIX root. Hi ku olovisa, hi nkarhi wa ku sungula ka databesi ku endliwa phasiwedi ya ku hlawula, yi hlayisiwa eka local config na le MySQL. Loko u lava ku cinca phasiwedi leyi, tirhisa nongonoko wa zmmypasswd lowu nga ta cinca phasiwedi eka MySQL na le local config.
mysql_memory_percent = Phesente ya memori ya sisiteme leyi mysql yi faneleke ku yi tirhisa. Ntikelo lowu wu hlayisiwa laha leswaku wu tirhisiwa hi nongonoko wa zmmycnf. Ku cinca xivekiwa lexi a swi humeleli hi ku hatlisa eka sevha ya MySQL. U ta boheka, hi vukheta lebyikulu, ku tlhela u tumbuluxa my.cnf no tlhela u sungula sevha ya MySQL leswaku ku cinca ku sungula ku tirha.
mysql_innodb_log_buffer_size = Vona matsalwa ya MySQL ya innodb_log_buffer_size. Ntikelo lowu wu hlayisiwa laha leswaku wu tirhisiwa hi nongonoko wa zmmycnf. Ku cinca xivekiwa lexi a swi humeleli hi ku hatlisa eka sevha ya MySQL. U ta boheka, hi vukheta lebyikulu, ku tlhela u tumbuluxa my.cnf no tlhela u sungula sevha ya MySQL leswaku ku cinca ku sungula ku tirha.
mysql_innodb_log_file_size = Vona matsalwa ya MySQL ya innodb_log_file_size. Ntikelo lowu wu hlayisiwa laha leswaku wu tirhisiwa hi nongonoko wa zmmycnf. Ku cinca xivekiwa lexi a swi humeleli hi ku hatlisa eka sevha ya MySQL. U ta boheka, hi vukheta lebyikulu, ku tlhela u tumbuluxa my.cnf no tlhela u sungula sevha ya MySQL leswaku ku cinca ku sungula ku tirha.
mysql_sort_buffer_size = Vona matsalwa ya MySQL ya sort_buffer_size. Ntikelo lowu wu hlayisiwa laha leswaku wu tirhisiwa hi nongonoko wa zmmycnf. Ku cinca xivekiwa lexi a swi humeleli hi ku hatlisa eka sevha ya MySQL. U ta boheka, hi vukheta lebyikulu, ku tlhela u tumbuluxa my.cnf no tlhela u sungula sevha ya MySQL leswaku ku cinca ku sungula ku tirha.
mysql_read_buffer_size = Vona matsalwa ya MySQL ya read_buffer_size. Ntikelo lowu wu hlayisiwa laha leswaku wu tirhisiwa hi nongonoko wa zmmycnf. Ku cinca xivekiwa lexi a swi humeleli hi ku hatlisa eka sevha ya MySQL. U ta boheka, hi vukheta lebyikulu, ku tlhela u tumbuluxa my.cnf no tlhela u sungula sevha ya MySQL leswaku ku cinca ku sungula ku tirha.
mysql_backup_retention = Nhlayo ya mivuyelo ya backup ya databesi ya mysql leyi faneleke ku hlayisiwa.
antispam_mysql_enabled = Tirhisa databesi ya mysql eka antispam. Hi difoliti i False.
antispam_backup_retention = Nhlayo ya mivuyelo ya backup ya databesi ya antispam leyi faneleke ku hlayisiwa.
derby_properties = Ndlela ya fayili ya swihlawulekisi swa ku lulamisa ya derby.
imap_max_consecutive_error = Loko ku tlula 0, tshika xihlanganisi xa IMAP loko ntikelo wa imap_max_consecutive_error wu fikeleriwa.
imap_inactive_session_cache_size = Ehcache: nhlayo leyikulu ya swinandzi swa kheshe ya IMAP leswi nga tirhiki eka diski ku nga si va ni ku susiwa.
imap_use_ehcache = Loko ku ri ntiyiso, tirhisa Ehcache eka ku khesha seshini ya IMAP. Loko swi nga ri tano, tirhisa kheshe ya diski.
imap_write_timeout = Seta nkarhi wo hela wa ku tsala wa seshini ya IMAP (nio).
imap_write_chunk_size = Sayizi hi tibayiti ya bufara yo tsala ya IMAP.
imap_thread_keep_alive_time = Nkarhi wa ntolovelo, hi tisekoni, wa thread ya IMAP.
imap_throttle_ip_limit = Loko ku tlula 0, nhlayo leyikulu ya swikombelo swa IMAP/sekoni hi IP.
imap_throttle_acct_limit = Loko ku tlula 0, nhlayo leyikulu ya swikombelo swa IMAP/sekoni hi akhawunti.
imap_suggested_batch_copy_size = Nhlayo ya marungula lama faneleke ku tirhisiwa hi ntlawa hi nkarhi wa matirhelo ya IMAP COPY.
imap_in_progress_response_thread_pool_size = Nhlayo leyikulu ya tithiredi eka pool ya ku rhumela nhlamulo ya InProgress eka kliyente.
imap_in_progress_response_thread_keep_alive = Nkarhi hi tisekoni lowu thread yi faneleke ku tshama yi hanya ku nga si herisiwa.
imap_ehcache_heap_size = Nhlayo leyikulu ya swinandzi swa kheshe ya IMAP leswi hlayisiweke eka xiyenge xa heap xa Ehcache.
imap_ehcache_skip_large_folder = Tshika ku khesha tifowudara letikulu ta IMAP eka Ehcache loko swi pfunghiwile.
imap_ehcache_folder_max_message_count = Mpimo wa nhlayo ya marungula lowu nga ehenhla ka wona tifowudara ta IMAP ti nga kheshiwiki eka Ehcache.
nio_imap_enabled = Loko ku ri ntiyiso, pfunghisa Jetty non-blocking IO ya IMAP.
nio_pop3_enabled = Loko ku ri ntiyiso, pfunghisa Jetty non-blocking IO ya POP3.
postfix_mail_owner = postfix_mail_owner
postfix_setgid_group = postfix_setgid_group
postfix_version = postfix_version
mailboxd_directory = Ndhawu ya ku nghenisiwa ka mailboxd.
mailboxd_java_heap_size = Nhlayo ya timhebabayiti leti nga ta tirhisiwa tanihi sayizi leyikulu ya Java heap (-Xmx) ya JVM leyi fambisaka Mailboxd.
mailboxd_java_heap_new_size_percent = Phesente ya sayizi ya Java heap leyi nga ta tirhisiwa eka xiyenge xa young generation (-Xmn) xa JVM lexi fambisaka Mailboxd.
mailboxd_java_options = Swihlawulekisi swa JVM leswi nga ta tirhisiwa loko ku sungula Mailboxd.
mailboxd_pidfile = Fayili leyi ID ya phurosese ya Mailboxd JVM yi hlayisiwaka eka yona.
mailboxd_keystore = Ndhawu ya fayili ya data ya keystore.
mailboxd_keystore_password = Phasiwedi leyi faneleke ku tirhisiwa ni keystore ya KeyManager.
mailboxd_truststore = Ndhawu ya fayili ya data ya truststore.
mailboxd_truststore_password = Phasiwedi leyi faneleke ku tirhisiwa ni keystore ya TrustManager.
client_ssl_truststore = Ndhawu ya fayili ya data ya truststore leyi tirhisiwaka eka ku tiyisisa ka SSL ka kliyente.
client_ssl_truststore_password = Phasiwedi leyi faneleke ku tirhisiwa ni keystore ya TrustManager ya SSL ya kliyente.
mailboxd_output_file = Fayili leyi stdout na stderr ya sevha swi ta kongomisiwa eka yona.
mailboxd_output_rotate_interval = Nkarhi, hi tisekoni, lowu fayili ya mihandzu ya mailboxd yi rhurhisiwaka. Loko <= 0, a ku endliwi ku rhurhisiwa.
mailboxd_thread_stack_size = Sayizi ya stack ya thread ya Mailboxd.
ssl_allow_untrusted_certs = Loko ku ri ntiyiso, pfumelela titifikheti ta SSL leti tisayiniweke hi toxe.
zimlet_directory = Ndlela ya Zimlets leti nghenisiweke.
calendar_outlook_compatible_allday_events = Tirhisa swiendleko swa siku hinkwaro leswi fambisanaka na Outlook. Hi difoliti i False.
calendar_entourage_compatible_timezones = Veka parameter ya TZID eka swilo swa iCalendar eka switlhokovetselo, ku tirha ku rhendzeleka ka xihoxo xa MS Entourage. Hi difoliti i True.
calendar_ics_import_full_parse_max_size = Hi nkarhi wa ku nghenisa ics, tirhisa parser leyi heleleke loko sayizi ya ics yi ri ehansi kumbe yi ringana leyi; tifayili ta ics letikulu ti hlayiwa hi callback parser leyi nga pfumelelikiki swikombelo swa emahlweni eka VTIMEZONE TZID.
calendar_canonical_tzid = ID ya ndhawu ya nkarhi leyi nga ta vuyisiwa tanihi TimeZone.getCanonicalID(). Mintikelo leyi nga kona: "olson", "windows", "java". Hi difoliti i "windows".
calendar_cache_enabled = Pfuna kheshe ya khalendara. Hi difoliti i False.
