#license notification email for exceeding usage count for feature
licenseFeaureOnHoldNotifierSubject = Xitsundzuxo xa Sisiteme ya Zimbra: Mpimo wa ku tirhisiwa ka fichara wu tluriwile
licenseFeaureOnHoldNotifierBodyText=Nhlayo leyi layisensiweke ya tiakhawunti yi fikeleriwe kumbe yi tluriwile eka tifichara leti landzelaka:\n{0}\nU nga ha hunguta ku tirhisiwa ka vatirhisi lava se va nga kona kumbe u engetela mpimo wa layisense ya fichara.\n\nKu engetela mpimo wa layisense ya fichara, hi kombela u tihlanganisa na Zimbra Sales eka sales@zimbra.com.\nKu lawula ku averiwa ka fichara ya akhawunti, hi kombela u nghena eka Admin Portal.\n\nHi kombela u tsundzuka leswi landzelaka:\n1. U ta ya emahlweni u amukela xitiviso lexi ku ringana masiku ya {1,number,integer} ku suka eka siku ra ku tlula ku tirhisiwa.\n2. A wu nge koti ku pfumelela fichara leyi tirhisiweke ngopfu eka tiakhawunti tihi na tihi.\n3. Loko u nga teki goza eka fichara leyi tirhisiweke ngopfu, fichara yi ta timiwa eka vatirhisi leswaku yi tlhela yi va ehansi ka mpimo lowu layisensiweke.\n\nNdziwavo,\nZimbra Support
licenseFeaureOnHoldNotifierBodyHtml=<div style="font-family:sans-serif;">Nhlayo leyi layisensiweke ya tiakhawunti yi fikeleriwe kumbe yi tluriwile eka tifichara leti landzelaka:<br>{0}<br>U nga ha hunguta ku tirhisiwa ka vatirhisi lava se va nga kona kumbe u engetela mpimo wa layisense ya fichara.<br><br>Ku engetela mpimo wa layisense ya fichara, hi kombela u tihlanganisa na Zimbra Sales eka <b>sales@zimbra.com</b>.<br>Ku lawula ku averiwa ka fichara ya akhawunti, hi kombela u nghena eka Admin Portal.<br><br>Hi kombela u tsundzuka leswi landzelaka:<br>1. U ta ya emahlweni u amukela xitiviso lexi ku ringana masiku ya {1,number,integer} ku suka eka siku ra ku tlula ku tirhisiwa.<br>2. A wu nge koti ku pfumelela fichara leyi tirhisiweke ngopfu eka tiakhawunti tihi na tihi.<br>3. Loko u nga teki goza eka fichara leyi tirhisiweke ngopfu, fichara yi ta timiwa eka vatirhisi leswaku yi tlhela yi va ehansi ka mpimo lowu layisensiweke.<br><br>Ndziwavo,<br>Zimbra Support</div>

