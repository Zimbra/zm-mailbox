httpclient_internal_client_connection_timeout=Client ya httpclient bakeng sa dikgokagano tsa ka fa gare tsa Zimbra: E baya timeout ka milisekente e e dirisiwang fa go tsewa kgolagano ya HTTP go tswa mo HTTP connection manager.
httpclient_internal_connmgr_connection_timeout=httpclient connection manager bakeng sa dikgokagano tsa ka fa gare tsa Zimbra: E tlhomamisa timeout go fitlha kgolagano e tlhomiwa. Boleng jwa zero bo raya gore timeout ga e dirisiwe.
httpclient_internal_connmgr_idle_reaper_connection_timeout=httpclient connection manager idle reaper bakeng sa dikgokagano tsa ka fa gare tsa Zimbra: boleng jwa timeout jo bo tla dirisiwang fa go tlhatlhobiwa dikgokagano tse di sa direng.
httpclient_internal_connmgr_idle_reaper_sleep_interval=httpclient connection manager idle reaper bakeng sa dikgokagano tsa ka fa gare tsa Zimbra: nako (ka milisekente) e thread ya idle connection reaper ya http client connection manager e emang ka yone fa gare ga ditiro. 0 e raya gore thread ya reaper e timilwe.
httpclient_internal_connmgr_max_host_connections=httpclient connection manager bakeng sa dikgokagano tsa ka fa gare tsa Zimbra: E tlhalosa palo e kgolo thata ya dikgokagano tse di letleletsweng ka peakanyo nngwe le nngwe ya host.
httpclient_internal_connmgr_max_total_connections=httpclient connection manager bakeng sa dikgokagano tsa ka fa gare tsa Zimbra: E tlhalosa palo e kgolo thata ya dikgokagano tse di letleletsweng ka kakaretso.
httpclient_internal_connmgr_so_timeout=httpclient connection manager bakeng sa dikgokagano tsa ka fa gare tsa Zimbra: Boleng jwa timeout jwa zero bo tlhalosiwa e le timeout e e sa khutleng. Boleng jono bo dirisiwa fa go se na socket timeout e e beilweng mo dipharamithareng tsa HTTP method.
httpclient_internal_connmgr_tcp_nodelay=httpclient connection manager bakeng sa dikgokagano tsa ka fa gare tsa Zimbra: E tlhalosa gore a Nagle algorithm e tshwanetse go timiwa mo HTTP socket.
httpclient_internal_connmgr_stale_connection_check=httpclient connection manager bakeng sa dikgokagano tsa ka fa gare tsa Zimbra: E tlhomamisa gore stale connection check e tshwanetse go dirisiwa. Go tima stale connection check go ka tlisa tokafatso e nnye ya performance mme ga nna le kotsi ya go bona phoso ya I/O fa go dirwa kopo ka kgolagano e e setseng e tswetswe mo letlhakoreng la seabi.
httpclient_external_client_connection_timeout=httpclient client bakeng sa dikgokagano tsa kwa ntle: E baya timeout ka milisekente e e dirisiwang fa go tsewa kgolagano ya HTTP go tswa mo HTTP connection manager. Go tima stale connection check go ka tlisa tokafatso e nnye ya performance mme ga nna le kotsi ya go bona phoso ya I/O fa go dirwa kopo ka kgolagano e e setseng e tswetswe mo letlhakoreng la seabi.
httpclient_external_connmgr_connection_timeout=httpclient connection manager bakeng sa dikgokagano tsa kwa ntle: E tlhomamisa timeout go fitlha kgolagano e tlhomiwa. Boleng jwa zero bo raya gore timeout ga e dirisiwe.
httpclient_external_connmgr_idle_reaper_connection_timeout=Molaodi wa dikgokagano wa httpclient wa dikgokagano tsa kwa ntle wa go phepafatsa tse di sa direng: boleng jwa nako ya go fela jo bo dirisiwang fa go lekwa dikgokagano tse di sa direng.
httpclient_external_connmgr_idle_reaper_sleep_interval=Nako (ka milliseconds) e threde ya go phepafatsa dikgokagano tse di sa direng ya molaodi wa dikgokagano wa http client e robalang magareng ga tiro. 0 e raya gore threde eo e a emisiwa.
httpclient_external_connmgr_max_host_connections=E tlhalosa palo e kgolo thata ya dikgokagano tse di letleletsweng mo peakanyong nngwe le nngwe ya host.
httpclient_external_connmgr_max_total_connections=E tlhalosa palo e kgolo thata ya dikgokagano tse di letleletsweng ka kakaretso.
httpclient_external_connmgr_so_timeout=Boleng jwa timeout jwa zero bo tlhalosiwa jaaka timeout e e sa feleleng. Boleng jono bo dirisiwa fa go se na socket timeout e e beilweng mo diparametereng tsa mokgwa wa HTTP.
httpclient_external_connmgr_tcp_nodelay=E tlhalosa gore a Nagle algorithm e tshwanetse go emisiwa mo socket ya HTTP.
httpclient_external_connmgr_stale_connection_check=E tlhomamisa gore a tekolo ya dikgokagano tse di sa tlhole di siame e tshwanetse go dirisiwa.
