# local config settings

zimbra_home = Motswedi wa tsenyo ya Zimbra le foroteri ya gae ya modirisi wa UNIX wa 'zimbra'. O ka se sutise motswedi wa tsenyo; o se ka wa fetola peakanyo eno.
zimbra_java_home = Tsela e e isang kwa JDK/J2SDK.
zimbra_log_directory = Foroteri e difaele tsa log di kwadiwang mo go yone.
zimbra_index_directory = Foroteri ya difaele tsa index tsa lebokoso la imeile.
zimbra_store_directory = Foroteri ya melaetsa ya lebokoso la imeile.
zimbra_db_directory = Foroteri ya difaele tsa database.
zimbra_tmp_directory = Foroteri ya difaele tsa nakwana.
zimbra_hybrid_blob_mover_enabled = E baya gore karolo ya Hybrid Blob Mover e buletswe kgotsa nnyaa. Boleng jwa kamehla ke: false.
zimbra_extensions_directory = Foroteri e diforoteri tsa yone tse potlana di nang le di-extension.
zimbra_extensions_common_directory = Foroteri e e nang le difaele tsa jar tse tsotlhe di-extension di di dirisang.
zimbra_mysql_shutdown_timeout = Nako ya go leta gore tiragatso ya mailbox MySQL/MariaDB e eme. Oketsa timeout fa mysql.server e tsaya nako e telele go tima tiragatso.
zimbra_mysql_user = Leina la modirisi la MySQL le le dirisiwang go bopa kgotsa go tsena mo didatabase le ditafoleng tsa zimbra. Jeno ke boleng jo o ka bo nayang kgetho ya '-u' ya lenaneo la mola wa taelo la 'mysql'.
zimbra_mysql_password = Phasewete ya zimbra_mysql_user. E bolokilwe mo peakanyong ya selegae gore tiriso ya store e e dirise fa e netefatsa boitshupo. Fa o batla go fetola phasewete eno, dirisa lenaneo la zmmypasswd le le tla fetolang phasewete mo MySQL le mo peakanyong ya selegae.
zimbra_ldap_userdn = LDAP dn e e dirisiwang go netefatsa tiriso ya store ka LDAP.
zimbra_ldap_user = Leina la modirisi la zimbra le le dirisiwang go netefatsa ka admin AuthRequest.
zimbra_ldap_password = Phasewete ya zimbra_ldap_userdn. E bolokilwe mo peakanyong ya selegae gore tiriso ya store e e dirise fa e netefatsa boitshupo. Fa o batla go fetola phasewete eno, dirisa lenaneo la zmldappasswd le le tla fetolang phasewete mo LDAP le mo peakanyong ya selegae.
zimbra_server_hostname = Leina le le abetsweng seabi seno. Go tshwanetse ga bo go na le tsenyo ya 'server' e e tsamaelanang mo LDAP; leba ditokomane tsa taelo ya CreateServer ya lenaneo la zmprov.
zimbra_user = Modirisi wa unix wa zimbra yo tiragatso ya seabi sa zimbra e tshwanetseng go mo fetisetsa ditetla tsa yone morago ga go bofaganya diporoto tse di nang le ditetla tse di kgethegileng.
zimbra_uid = UID ya unix ya zimbra e tiragatso ya seabi sa zimbra e tshwanetseng go fetisetsa ditetla tsa yone kwa go yone morago ga go bofaganya diporoto tse di nang le ditetla tse di kgethegileng.
zimbra_gid = GID ya unix ya zimbra e tiragatso ya seabi sa zimbra e tshwanetseng go fetisetsa ditetla tsa yone kwa go yone morago ga go bofaganya diporoto tse di nang le ditetla tse di kgethegileng.
zimbra_log4j_properties = Tsela e e isang kwa faeleng ya diporopati tsa peakanyo ya log4j.
zimbra_log4j_properties_watch = Nako ya go lebelela gape faele ya diporopati tsa peakanyo ya log4j ka dimilisekente.
zimbra_attrs_directory = Foroteri e e nang le difaele tsa *.xml tse di tlhalosang sintakse ya ditshobotsi tsa LDAP tse di dirisiwang ke sisteme.
localized_msgs_directory = Foroteri ya difaele tsa melaetsa e e ranotsweng ka dipuo.
localized_client_msgs_directory = Foroteri ya difaele tsa melaetsa ya client e e ranotsweng ka dipuo.
skins_directory = Foroteri ya skins.
zimbra_store_sweeper_max_age = Difaele tse di godileng go feta metsotso e le kanaano di phimolwa ka botsona mo forotering ya tse di tsenang ya store.
zimbra_store_copy_buffer_size_kb = Ditiro tsa go kopolola difaele di dirisa dibuffer tsa bogolo jono.
zimbra_mailbox_galsync_cache = E baya palo e e kwa godimo thata ya cache ya dilo tsa dikgokaganyo mo lebokosong la galsync. Baya boleng jo bo seng kwa tlase ga palo ya dilo tsa dikgokaganyo mo lebokosong la galsync.
zimbra_mailbox_manager_hardref_cache = Palo e e kwa godimo thata ya mabokoso a imeile a a tla tshwarwang mo memoring pele molaodi wa mailbox a simolola go a letla go ntshiwa ka SoftReference garbage collection.
zimbra_mailbox_active_cache = Bogolo jo bo kwa godimo thata jwa cache ya ka fa gare ya dilo tsa LRU ya mailbox fa go na le diseshene tse di dirang.
zimbra_mailbox_inactive_cache = Bogolo jo bo kwa godimo thata jwa cache ya ka fa gare ya dilo tsa LRU ya mailbox fa e se na diseshene tse di dirang.
zimbra_mailbox_change_checkpoint_frequency = Kgafetsa (ka palo ya diphetogo) e boleng jwa phetogo jwa highwater jwa ZIMBRA.MAILBOX.CHANGE_CHECKPOINT jwa mailbox bo kwadiwang ka yone.
zimbra_index_elasticsearch_url_base = URL ya motheo ya ElasticSearch REST API.
zimbra_index_threads = Bogolo jwa thread pool jwa batch index.
zimbra_reindex_threads = Palo e e kwa godimo thata ya di-thread tsa re-index. Di-thread tsa re-index ga di dirisiwe mo pooleng.
zimbra_index_disable_perf_counters = Fa e le false, IO ya go bala le go kwala ya Lucene e latelwa ke tekolo ya tiragatso ya Zimbra. Boleng jwa true bo tima tekolo ya Lucene IO.
zimbra_index_max_readers = Palo e e kwa godimo thata ya IndexReaders tse di dirang ka nako e le nngwe.
zimbra_index_max_writers = Palo e e kwa godimo thata ya IndexWriters tse di dirang ka nako e le nngwe.
zimbra_index_reader_cache_size = Palo e e kwa godimo thata ya IndexReaders mo cache ya search index.
zimbra_index_reader_cache_ttl = Fa e sa dire go feta boleng jono ka metsotswana, tlosa IndexReader mo cache.
zimbra_index_deferred_items_failure_delay = Morago ga go palelwa, tiego e e kwa tlase ka metsotswana magareng ga maiteko a go fedisa queue ya dilo tse di sa dirwang index tse di diegisitsweng.
zimbra_index_lucene_max_terms_per_query = Baya palo e e kwa godimo thata ya dithemo tse di letleletsweng mo potso nngwe le nngwe.
zimbra_index_max_transaction_bytes = Fa ditiro tsa index di kgobokanngwa mo transaction ya Mailbox, bogolo jwa tsotlhe jwa dilo jo bo kwa godimo thata jo re tla bo letlelang mo transaction e le nngwe.
zimbra_index_max_transaction_items = Fa ditiro tsa index di kgobokanngwa, palo e e kwa godimo thata ya mail_items e re e letlelang mo transaction e le nngwe.
zimbra_index_max_pending_deletes = Palo e e kwa godimo thata ya diphimolo tsa index tse di emetseng pele go busediwa sebaka sa disk.
zimbra_index_lucene_merge_policy = true go dirisa LogDocMergePolicy, false go dirisa LogByteSizeMergePolicy. LogDocMergePolicy e tlhopha disegmente tse di ka kopanngwang go ya ka palo ya ditokomane. LogByteSizeMergePolicy e tlhopha disegmente go ya ka bogolo jwa tsone.
zimbra_index_lucene_min_merge = E baya bogolo jwa Lucene jwa minimum merge ka Documents kgotsa KB go ikaegile ka merge policy e e tlhalositsweng mo zimbra_index_lucene_merge_policy.
zimbra_index_lucene_max_merge = E baya bogolo jwa Lucene jwa maximum merge ka Documents kgotsa KB go ikaegile ka merge policy e e tlhalositsweng mo zimbra_index_lucene_merge_policy. Boleng jono bo laola segmente e kgolo go feta tsotlhe e e ka kopanngwang le disegmente tse dingwe.
zimbra_index_lucene_merge_factor = Ke gantsi go le kae di-index tsa segmente di kopanngwang ke addDocument(). Ka boleng jo bonnye, RAM e dirisiwa go le gonnye fa go dirwa indexing mme dipatlo di nna bonako, mme lebelo la indexing le nna kwa tlase. Ka boleng jo bogolo, RAM e dirisiwa thata fa go dirwa indexing mme dipatlo di nna bonya, mme indexing e nna bonako. Boleng jo bogolo go feta 10 bo siametse go bopiwa ga batch index, mme jo bonnye go feta 10 bo siametse di-index tse di tlhokomelwang ka seatla.
zimbra_index_lucene_term_index_divisor = E fokotsa sampole ya gore ke dithemo dife tse di dirilweng index tse di laiwang mo RAM. Ka go baya boleng jo bo fetang 1 o ka fokotsa tiriso ya memori, mme seo se tla oketsa latency fa go laiwa tshedimosetso ya rekhoto e e boloketsweng term.
zimbra_index_lucene_use_compound_file = true fa segmente e nt\u0161ha ya Lucene e tshwanetse go dirisa compound file format. http://wiki.apache.org/lucene-java/ImproveIndexingSpeed e re compound file format e tshwanetse go timiwa gore tiragatso e nne botoka, mme seo se tla oketsa thata palo ya file descriptors. File descriptors di ka fela fa zimbra_index_lucene_merge_factor e le kgolo.
zimbra_index_lucene_max_buffered_docs = Palo e nnye thata ya ditokomane e e tlhokegang pele ditokomane tse di buffered mo memoring di tshololwa jaaka segmente e nt\u0161ha. Ka kakaretso, boleng jo bogolo bo dira gore indexing e nne bonako.
zimbra_index_lucene_ram_buffer_size_kb = Bogolo jwa RAM buffer ya Lucene jo bo kwa godimo thata ka KB.
zimbra_index_lucene_io_impl = Tiragatso ya Lucene FSDirectory e e dirisiwang mo indexing IO. Boleng jo bo ka dirisiwang ke: nio - dirisa NIOFSDirectory. E dirisa positional io ya FileChannel ya java.nio fa go balwa gore go se nne le synchronization fa go balwa go tswa mo faeleng e le nngwe. mmap - dirisa MMapDirectory. E dirisa memory-mapped IO fa go balwa. Ke kgetho e ntle fa go na le virtual memory e ntsi go feta bogolo jwa index. simple - dirisa SimpleFSDirectory. E dirisa java.io.RandomAccessFile. Tiragatso ya yone ya concurrency e bokoa ka gonne e dira synchronization fa di-thread di le dintsi di bala faele e le nngwe. Fa go se na boleng jo bo filweng, FSDirectory e tla tlhopha tiragatso e e siameng go feta tsotlhe mo tikologong eno.
zimbra_index_rfc822address_max_token_count = Palo e e kwa godimo thata ya di-token tsa diaterese mo stream ya di-token tsa aterese ya RFC822. Molelwane ono o dira mo dihadereng tsotlhe tsa FROM, TO le CC tsa di-imeile, mo diatereseng tsotlhe tsa imeile tsa Dikgokaganyo le mo field ya Creator ya Ditokomane.
zimbra_index_rfc822address_max_token_length = Boleele jo bo kwa godimo thata jwa token ya aterese mo stream ya di-token tsa aterese ya RFC822. Molelwane ono o dira mo dihadereng tsotlhe tsa FROM, TO le CC tsa di-imeile, mo diatereseng tsotlhe tsa imeile tsa Dikgokaganyo le mo field ya Creator ya Ditokomane.
zimbra_index_wildcard_max_terms_expanded = Palo e e kwa godimo thata ya dikatoloso tsa wildcard tsa term nngwe le nngwe mo potsong.
zimbra_galsync_index_reader_cache_size = Palo e e kwa godimo thata ya IndexReaders mo cache ya GAL search index. Lucene index ya akhaonto ya GAL sync e bewa mo cache ka thoko e se na go ntshiwa ka boitiriso.
zimbra_spam_report_queue_size = Mo Junk/Not Junk Msg/ConvActionRequests, bogolo jono jwa queue bo fokotsa workqueue ya seabi ya go dira forwards.
zimbra_throttle_op_concurrency = Lenane la boleng jwa concurrency le le kgaogantsweng ka diphegelwana la nngwe le nngwe ya maemo a botlhokwa a le 5, go tloga kwa go a kwa godimo go ya kwa go a kwa tlase.
zimbra_im_chat_flush_time = Ke gantsi go le kae ka metsotswana dipuisano tse di bulegileng tsa IM di kwadiwang mo store.
zimbra_im_chat_close_time = Seabi se tla leta boleele jo bo kae ka metsotswana pele se tswala diseshene tsa puisano ya IM tse di sa direng.
zimbra_http_originating_ip_header = HTTP header e e tshwanetseng go lebanwe go tlhomamisa aterese ya IP ya ntlha ya client.
zimbra_session_limit_imap = Palo e e kwa godimo thata ya difoldara tsa IMAP tse modirisi a le mongwe a ka di bulang ka nako e le nngwe.
zimbra_session_limit_admin = Palo e e kwa godimo thata ya diseshene tsa admin SOAP tse modirisi a le mongwe a ka di bulang ka nako e le nngwe.
zimbra_session_limit_soap = Palo e e kwa godimo thata ya diseshene tsa soap tse di dirang ka akhaonto. Oketsa boleng jono ka kelotlhoko gore o tile diphoso tsa "Too many SOAP sessions" mo mailbox.log.
zimbra_session_limit_sync = Palo e e kwa godimo thata ya ba reetsang sync ka seshene bakeng sa ActiveSync. Oketsa boleng jono ka kelotlhoko gore o tile diphoso tsa "Too many SYNCLISTENER sessions" mo sync.log.
zimbra_session_timeout_soap = Timeout ya go se dire ka metsotswana ya diseshene tsa SOAP.
zimbra_session_max_pending_notifications = Palo e e kwa godimo thata ya ditsebiso tse di emetseng tse di ka tsenngwang mo moleng mo sesheneng sa SOAP pele mola o phimolwa mme client e bolelelwa gore maemo a yone ga a siama.
zimbra_converter_enabled_uuencode = A decoder ya UUENCODE e tsamaisiwa fa melaetsa e sekasekwa go tswa mo store.
zimbra_converter_enabled_tnef = A decoder ya TNEF e tsamaisiwa fa melaetsa e sekasekwa go tswa mo store.
zimbra_converter_depth_max = Boteng jwa recursive jwa karolo ya MIME jo bo kwa tlase ga jone di-converter di sa kitlang di dira.
zimbra_ssl_enabled = A ssl keystore e tshwanetse go laiwa kgotsa nnyaa.
stats_img_folder = Foroteri ya go boloka ditshwantsho tsa dipalopalo tse di tlhagisitsweng.
ldap_host = Host ya LDAP e e tshwanetseng go dirisiwa. E fedisitswe; tsweetswee dirisa ldap_url mo boemong jwa yone.
ldap_log_level = Maemo a logging a LDAP.
ldap_port = Poroto ya LDAP e e tshwanetseng go dirisiwa. E fedisitswe; tsweetswee dirisa ldap_url mo boemong jwa yone.
ldap_url = Lenane la diseabi tsa LDAP tse seabi seno se tla di dirisang.
ldap_master_url = URL e e isang kwa LDAP master.
ldap_is_master = A host eno ke seabi se segolo sa LDAP?
ldap_root_password = Phasewete ya rootdn ya LDAP slapd.conf. Go nolofatsa, ka nako ya go simolola LDAP go tlhagisiwa phasewete ya ikgethelo, e e bolokwang mo peakanyong ya selegae le mo slapd.conf. Fa o batla go fetola phasewete eno, tsweetswee dirisa lenaneo la zmldappasswd le le tla fetolang phasewete mo slapd.conf le mo peakanyong ya selegae.
ldap_connect_timeout = Dimilisekente tse morago ga tsone teko ya kgokagano e tlogelwang.
ldap_read_timeout = Dimilisekente tse morago ga tsone teko ya go bala e tlogelwang.
ldap_deref_aliases = A di-alias di tshwanetse go latelwa fa go batliwa kgotsa go bofaganngwa mo forotering ya kwa ntle. Boleng jo bo letleletsweng ke: always, never, finding, searching.
ldap_connect_pool_master = A JNDI connection pooling e tshwanetse go dirisiwa bakeng sa LDAP master.
ldap_connect_pool_debug = A debugging ya LDAP connection pooling e tshwanetse go bulelwa.
ldap_connect_pool_initsize = Palo ya ntlha ya dikgokagano tsa LDAP tse di dirang e go tshwanetseng go godiwa go ya kwa go yone.
ldap_connect_pool_maxsize = Palo e e kwa godimo thata ya dikgokagano tsa LDAP tse di dirang le tse di sa direng e e letleletsweng.
ldap_connect_pool_prefsize = Palo e e ratwang ya dikgokagano tsa LDAP; go baya maxsize le prefsize mo boleng jo bo tshwanang go boloka connection pool e le mo bogolong jo bo sa fetogeng.
ldap_connect_pool_timeout = Dimilisekente tsa nako ya go se dire pele kgokagano e e sa direng e ntshiwa mo pooleng.
ldap_connect_pool_health_check_on_checkout_enabled = A tlhatlhobo ya botsogo ya connection pool e tshwanetse go bidiwa nako le nako fa kgokagano e tla ntshiwang go dirisiwa. Fa tlhatlhobo ya botsogo ya OnCheckout e buletswe, tlhatlhobo ya botsogo ya ka fa morago e e dirwang gangwe le gape e tla timiwa.
ldap_connect_pool_health_check_interval_millis = Boleele jwa nako ka dimilisekente magareng ga ditlhatlhobo tsa botsogo tsa ka fa morago tse di dirwang gangwe le gape mo dikgokaganong tse di leng teng mo connection pool.
ldap_connect_pool_health_check_max_response_time_millis = Boleele jo bo kwa godimo thata jwa nako ka dimilisekente jo bo tshwanetseng go letlelelwa gore karabo ya tlhatlhobo ya botsogo e boe go tswa mo seabing sa LDAP.
ldap_replication_password = Phasewete e modirisi wa syncrepl a e dirisang go netefatsa boitshupo kwa LDAP master.
ldap_postfix_password = Phasewete e postfix e e dirisang go netefatsa boitshupo kwa ldap.
ldap_amavis_password = Phasewete e amavis e e dirisang go netefatsa boitshupo kwa ldap.
ldap_starttls_supported = A seabi sa LDAP se tshegetsa tiriso ya startTLS.
ldap_require_tls = A TLS e a tlhokega mo dikhlaenteng tsa LDAP.
ldap_cache_account_maxsize = Palo e e kwa godimo thata ya dilo tsa akhaonto tse di tshwanetseng go bewa mo cache.
ldap_cache_account_maxage = Bokgale jo bo kwa godimo thata ka metsotso jwa dilo tsa akhaonto mo cache.
ldap_cache_cos_maxsize = Palo e e kwa godimo thata ya dilo tsa COS tse di tshwanetseng go bewa mo cache.
ldap_cache_cos_maxage = Bokgale jo bo kwa godimo thata ka metsotso jwa dilo tsa COS mo cache.
ldap_cache_domain_maxsize = Palo e e kwa godimo thata ya dilo tsa domain tse di tshwanetseng go bewa mo cache.
ldap_cache_domain_maxage = Bokgale jo bo kwa godimo thata ka metsotso jwa dilo tsa domain mo cache.
ldap_cache_mime_maxage = Bokgale jo bo kwa godimo thata ka metsotso jwa dilo tsa MIME mo cache.
ldap_cache_server_maxsize = Palo e e kwa godimo thata ya dilo tsa seabi tse di tshwanetseng go bewa mo cache.
ldap_cache_server_maxage = Bokgale jo bo kwa godimo thata ka metsotso jwa dilo tsa setlhopha mo cache.
ldap_cache_share_locator_maxsize = Palo e e kwa godimo thata ya dilo tsa akhaonto mo cache ya named entry.
ldap_cache_share_locator_maxage = TTL ya cache ya named entry ka metsotso.
ldap_cache_timezone_maxsize = Palo e e kwa godimo thata ya dilo tsa timezone tse di tshwanetseng go bewa mo cache.
ldap_cache_zimlet_maxsize = Palo e e kwa godimo thata ya dilo tsa zimlet tse di tshwanetseng go bewa mo cache.
ldap_cache_zimlet_maxage = Bokgale jo bo kwa godimo thata ka metsotso jwa dilo tsa zimlet mo cache.
ldap_cache_custom_dynamic_group_membership_maxage_ms = Bokgale jo bo kwa godimo thata ka dimilisekente jwa go boloka mo cache gore akhaonto ke leloko la ditlhopha dife tse di fetofetogang, mo ditlhopheng tse botho jwa tsone bo tlhomamisiwang ka MemberURL ya tlwaelo.
csrf_filter_domain_allowed_ref_hosts_max_size = Palo e e kwa godimo thata ya ditsenyo tsa domain mo cache ya CsrfFilter ya allowedRefererHosts ya domain ka nngwe. E wela morago kwa ldap_cache_domain_maxsize fa go na le phoso ya parsing.
csrf_filter_domain_allowed_ref_hosts_cache_expiry_mins = Bokgale jo bo kwa godimo thata ka metsotso jwa ditsenyo mo cache ya CsrfFilter ya allowedRefererHosts ya domain ka nngwe. Morago ga gore nako e fele, tsenyo e ntshiwa mme e laiwa gape go tswa kwa LDAP mo kopong e e latelang. E wela morago go metsotso e le 60 fa go na le phoso ya parsing.
mysql_directory = Lefelo la tsenyo ya MySQL.
mysql_data_directory = Foroteri e data ya MySQL e tshwanetseng go nna mo go yone.
mysql_errlogfile = Log ya diphoso ya MySQL/MariaDB.
mysql_socket = Tsela e e isang kwa socket ya MySQL e e dirisiwang ke didirisiwa tsa mola wa taelo tsa MySQL.
mysql_pidfile = Faele e ID ya tiragatso ya MySQL e bolokiwang mo go yone.
mysql_mycnf = Tsela e e isang kwa my.cnf, e leng faele ya peakanyo ya MySQL.
mysql_bind_address = Interface mo host eno e MySQL e tla bofaganyang kwa go yone.
mysql_port = Nomoro ya poroto e seabi sa MySQL se tshwanetseng go reetsa mo go yone.
mysql_root_password = Phasewete ya modirisi wa 'root' yo o agilweng mo MySQL, e sa tshwaneng le go tsena ga UNIX root. Go nolofatsa, ka nako ya go simolola database go tlhagisiwa phasewete ya ikgethelo, e e bolokwang mo peakanyong ya selegae le mo MySQL. Fa o batla go fetola phasewete eno, tsweetswee dirisa lenaneo la zmmypasswd le le tla fetolang phasewete mo MySQL le mo peakanyong ya selegae.
mysql_memory_percent = Peresente ya memori ya sisteme e mysql e tshwanetseng go e dirisa. Boleng jono bo bolokilwe fano gore lenaneo la zmmycnf le bo dirise. Go fetola peakanyo eno ga go bonagale ka bonako mo seabing sa MySQL. O tla tshwanelwa ke go tlhagisa my.cnf gape ka kelotlhoko e kgolo le go simolola seabi sa MySQL gape gore phetogo e dire.
mysql_innodb_log_buffer_size = Bona ditokomane tsa MySQL mabapi le innodb_log_buffer_size. Boleng jono bo bolokilwe fano gore lenaneo la zmmycnf le bo dirise. Go fetola peakanyo eno ga go bonagale ka bonako mo seabing sa MySQL. O tla tshwanelwa ke go tlhagisa my.cnf gape ka kelotlhoko e kgolo le go simolola seabi sa MySQL gape gore phetogo e dire.
mysql_innodb_log_file_size = Bona ditokomane tsa MySQL mabapi le innodb_log_file_size. Boleng jono bo bolokilwe fano gore lenaneo la zmmycnf le bo dirise. Go fetola peakanyo eno ga go bonagale ka bonako mo seabing sa MySQL. O tla tshwanelwa ke go tlhagisa my.cnf gape ka kelotlhoko e kgolo le go simolola seabi sa MySQL gape gore phetogo e dire.
mysql_sort_buffer_size = Bona ditokomane tsa MySQL bakeng sa sort_buffer_size. Boleng jono bo bolokilwe fano gore bo dirisiwe ke porokeramo ya zmmycnf. Go fetola peakanyo eno ga go bonale ka bonako mo seabi sa MySQL. Gore phetogo e simolole go dira, o tshwanetse go tlhama my.cnf gape ka kelotlhoko e kgolo mme o simolole seabi sa MySQL gape.
mysql_read_buffer_size = Bona ditokomane tsa MySQL bakeng sa read_buffer_size. Boleng jono bo bolokilwe fano gore bo dirisiwe ke porokeramo ya zmmycnf. Go fetola peakanyo eno ga go bonale ka bonako mo seabi sa MySQL. Gore phetogo e simolole go dira, o tshwanetse go tlhama my.cnf gape ka kelotlhoko e kgolo mme o simolole seabi sa MySQL gape.
mysql_backup_retention = Palo ya diphetolo tsa backup ya database ya mysql tse di tshwanetseng go bolokwa.
antispam_mysql_enabled = Dirisa database ya mysql bakeng sa antispam. Ka tlhaolelo e timilwe.
antispam_backup_retention = Palo ya diphetolo tsa backup ya database ya antispam tse di tshwanetseng go bolokwa.
derby_properties = Tsela ya faele ya dipharologantsho tsa peakanyo ya derby.
imap_max_consecutive_error = Fa e feta 0, kgaola kgolagano ya imap fa boleng jwa imap_max_consecutive_error bo fitlheletswe.
imap_inactive_session_cache_size = Ehcache: palo e kgolo thata ya ditsenyo tsa cache ya IMAP tse di sa direng mo diskeng pele di tlosiwa.
imap_use_ehcache = Fa e le boammaaruri, dirisa Ehcache go cache-a session ya IMAP. Fa go se jalo, dirisa cache ya diski.
imap_write_timeout = Bea timeout ya go kwala ya session ya IMAP (nio).
imap_write_chunk_size = Bogolo jwa IMAP write buffer ka dibaete.
imap_thread_keep_alive_time = Lobaka lwa tlhaolelo, ka metsotsoana, lwa thread ya IMAP.
imap_throttle_ip_limit = Fa e feta 0, palo e kgolo thata ya dikopo tsa IMAP ka motsotsoana mongwe le mongwe ka IP.
imap_throttle_acct_limit = Fa e feta 0, palo e kgolo thata ya dikopo tsa IMAP ka motsotsoana mongwe le mongwe ka akhaonto.
imap_suggested_batch_copy_size = Palo ya melaetsa e e tla dirwang mo batch nngwe le nngwe ka nako ya ditiro tsa IMAP COPY.
imap_in_progress_response_thread_pool_size = Palo e kgolo thata ya dithread mo pooleng bakeng sa go romela karabo ya InProgress go client.
imap_in_progress_response_thread_keep_alive = Nako ka metsotsoana e thread e tla tshelang ka yone pele e fedisiwa.
imap_ehcache_heap_size = Palo e kgolo thata ya ditsenyo tsa cache ya IMAP tse di bolokilweng mo mokgatlhong wa heap wa Ehcache.
imap_ehcache_skip_large_folder = Fa se se buletswe, se tlola go cache-a difoldara tse dikgolo tsa IMAP mo Ehcache.
imap_ehcache_folder_max_message_count = Tekanyetso ya palo ya melaetsa e, fa e fetilwe, difoldara tsa IMAP di sa cacheweng mo Ehcache.
nio_imap_enabled = Fa e le boammaaruri, bulela Jetty non-blocking IO bakeng sa IMAP.
nio_pop3_enabled = Fa e le boammaaruri, bulela Jetty non-blocking IO bakeng sa POP3.
postfix_mail_owner = postfix_mail_owner
postfix_setgid_group = postfix_setgid_group
postfix_version = postfix_version
mailboxd_directory = Lefelo la go tsenngwa ga mailboxd.
mailboxd_java_heap_size = Palo ya megabyte e e tla dirisiwang e le bogolo jo bogolo thata jwa Java heap (-Xmx) jwa JVM e e tsamaisang Mailboxd.
mailboxd_java_heap_new_size_percent = Peresente ya bogolo jwa Java heap jo bo tla dirisiwang ke young generation (-Xmn) ya JVM e e tsamaisang Mailboxd.
mailboxd_java_options = Dikgetho tsa JVM tse di tla dirisiwang fa go simololwa Mailboxd.
mailboxd_pidfile = Faele e process id ya Mailboxd JVM e bolokiwang mo go yone.
mailboxd_keystore = Lefelo la faele ya data ya keystore.
mailboxd_keystore_password = Phasewete e e tla dirisiwang le keystore ya KeyManager.
mailboxd_truststore = Lefelo la faele ya data ya truststore.
mailboxd_truststore_password = Phasewete e e tla dirisiwang le keystore ya TrustManager.
client_ssl_truststore = Lefelo la faele ya data ya truststore e e dirisediwang netefatso ya SSL ya client.
client_ssl_truststore_password = Phasewete e e tla dirisiwang le keystore ya client SSL TrustManager.
mailboxd_output_file = Faele e stdout le stderr tsa seabi di tla lebisang kwa go yone.
mailboxd_output_rotate_interval = Lobaka, ka metsotsoana, le faele ya output ya mailboxd e potololwang ka lone. Fa <= 0, ga go na rotation e e dirwang.
mailboxd_thread_stack_size = Bogolo jwa thread stack bakeng sa Mailboxd.
ssl_allow_untrusted_certs = Fa e le boammaaruri, letla ditifikeiti tsa SSL tse di saennweng ke tsone.
zimlet_directory = Tsela ya Zimlets tse di tsentsweng.
calendar_outlook_compatible_allday_events = Dirisa ditiragalo tsa letsatsi lotlhe tse di tsamaisanang le Outlook. Ka tlhaolelo e timilwe.
calendar_entourage_compatible_timezones = Tsenya TZID parameter mo matshwaong a iCalendar ka matshwao a nopolo, go fokotsa phoso ya MS Entourage. Ka tlhaolelo e butswe.
calendar_ics_import_full_parse_max_size = Fa o import-a ics, dirisa parser e e feletseng fa bogolo jwa ics bo le kwa tlase kgotsa bo lekana le seno; difaele tse dikgolo tsa ics di parserwa ka callback parser e e sa letleng forward references go VTIMEZONE TZID.
calendar_canonical_tzid = ID ya time zone e e tla busediwang e le TimeZone.getCanonicalID(). Boleng jo bo kgonegang: "olson","windows","java". Ka tlhaolelo ke "windows".
calendar_cache_enabled = Bulela calendar cache. Ka tlhaolelo e timilwe.
calendar_cache_directory = Root directory ya difaele tsa calendar cache.
calendar_cache_lru_size = Bogolo jwa memory-cache LRU. Cache-a difoldara tsa khalendara tse dintsi jaana mo memory.
calendar_cache_range_month_from = Kgwedi ya simologo mo rangeng e e cacheilweng. 0 e raya kgwedi ya jaanong, -1 e raya kgwedi e e fetileng, jalo jalo.
calendar_cache_range_months = Palo ya dikgwedi mo rangeng e e cacheilweng.
krb5_keytab = Lefelo la faele ya keytab ya Zimbra Kerberos 5.
krb5_debug_enabled = Bulela Kerberos debugging.
zimbra_mtareport_max_hosts = Palo e kgolo thata ya host tse di tla akarediwang mo dipegong tsa letsatsi le letsatsi tsa MTA tse di tlhamiwang ke zmdailyreport.
zimbra_mtareport_max_recipients = Palo ya baamogedi ba ba tla thathamisiwang mo dipegong tsa letsatsi le letsatsi tsa mta.
zimbra_mtareport_max_senders = Palo ya baromedi ba ba tla thathamisiwang mo dipegong tsa letsatsi le letsatsi tsa mta.
zimbra_mtareport_max_users = Palo e kgolo thata ya badirisi ba ba tla akarediwang mo dipegong tsa letsatsi le letsatsi tsa MTA tse di tlhamiwang ke zmdailyreport.
zimbra_auth_always_send_refer = Ka metlha busetsa tag ya <refer> mo karabong ya auth go pateletsa client redirect.
zimbra_admin_service_port = Port ya admin ya tlhaolelo/bootstrap.
zimbra_admin_service_scheme = Sekema sa protocol ya admin ya tlhaolelo/bootstrap.
zimbra_mail_service_port = Port ya imeile ya tlhaolelo.
zimbra_zmprov_default_to_ldap = Gore zmprov e dirisa LDAP kgotsa SOAP ka tlhaolelo.
zimbra_zmprov_default_soap_server = Seabi sa soap sa tlhaolelo se zmprov e tla gokaganang le sone.
zmprov_safeguarded_attrs = Lenane le le kgaogantsweng ka dikoma la ditshupo tsa provisioning tse di nang le boleng jo bontsi tse di tshwanetseng go sirelediwa kgatlhanong le go tseelwa sebaka.
zmprov_tmp_directory = Directory ya nakwana ya gore zmprov e kwalele boleng jwa binary jwa attributes mo difaeleng.
zimbra_mailbox_groups = Palo ya ditlhopha tsa mailbox tse mailbox tse disha di tla abelwang mo go tsone.
debug_mailboxindex_use_new_locking = Dirisa locking ya setaele se sesha bakeng sa MailboxIndex.
zimbra_class_provisioning = Class ya interface ya provisioning.
zimbra_class_accessmanager = Class ya interface ya access manager.
zimbra_class_mboxmanager = Class ya interface ya mailbox manager.
zimbra_class_database = Class ya peakanyo ya database.
zimbra_class_store = Class ya interface ya polokelo ya melaetsa.
zimbra_class_application = Class ya interface ya tiriso ya Zimbra.
zimbra_class_rulerewriterfactory = Class ya interface ya RuleRewriterFactory.
zimbra_class_dbconnfactory = Class ya factory ya kgolagano ya database.
zimbra_class_soapsessionfactory= Class ya factory ya session ya Soap.
av_notify_user = Aterese ya imeile e melaetsa ya botsamaisi e romelwang ka yone go tswa mo anti-virus le DKIM.
av_notify_domain = Domain ya tlhaolelo mo dipeakanyong tsa amavisd.
