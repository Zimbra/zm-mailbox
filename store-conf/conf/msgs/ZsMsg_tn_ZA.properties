#license notification email for exceeding usage count for feature
licenseFeaureOnHoldNotifierSubject = Temoso ya Sisteme ya Zimbra: Molelwane wa tiriso ya dikarolo o fetilwe
licenseFeaureOnHoldNotifierBodyText=Palo ya diakhaonto e e nang le laesense e fitlheletswe kgotsa e fetilwe mo dikarolong tse di latelang:\n{0}\nO ka fokotsa tiriso ya badirisi ba ba leng teng kgotsa wa oketsa molelwane wa laesense ya karolo.\n\nGo oketsa molelwane wa laesense ya karolo, tsweetswee ikgolaganye le Zimbra Sales kwa sales@zimbra.com.\nGo laola kabo ya dikarolo tsa akhaonto, tsweetswee tsena mo Admin Portal.\n\nTsweetswee ela tlhoko tse di latelang:\n1. O tla tswelela go amogela tsebiso eno malatsi a le {1,number,integer} go tswa letsatsing la go feta tiriso.\n2. O ka se kgone go bulela karolo e e dirisitsweng thata mo diakhaontong dife kgotsa dife.\n3. Fa o sa tseye kgato ka karolo e e dirisitsweng thata, karolo eo e tla timiwa gore tiriso ya badirisi e boele mo molelwaneng wa laesense.\n\nDitumediso,\nZimbra Support
licenseFeaureOnHoldNotifierBodyHtml=<div style="font-family:sans-serif;">Palo ya diakhaonto e e nang le laesense e fitlheletswe kgotsa e fetilwe mo dikarolong tse di latelang:<br>{0}<br>O ka fokotsa tiriso ya badirisi ba ba leng teng kgotsa wa oketsa molelwane wa laesense ya karolo.<br><br>Go oketsa molelwane wa laesense ya karolo, tsweetswee ikgolaganye le Zimbra Sales kwa <b>sales@zimbra.com</b>.<br>Go laola kabo ya dikarolo tsa akhaonto, tsweetswee tsena mo Admin Portal.<br><br>Tsweetswee ela tlhoko tse di latelang:<br>1. O tla tswelela go amogela tsebiso eno malatsi a le {1,number,integer} go tswa letsatsing la go feta tiriso.<br>2. O ka se kgone go bulela karolo e e dirisitsweng thata mo diakhaontong dife kgotsa dife.<br>3. Fa o sa tseye kgato ka karolo e e dirisitsweng thata, karolo eo e tla timiwa gore tiriso ya badirisi e boele mo molelwaneng wa laesense.<br><br>Ditumediso,<br>Zimbra Support</div>

