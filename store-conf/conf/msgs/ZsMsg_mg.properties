mysql_sort_buffer_size = Jereo ny antontan-taratasy MySQL momba ny sort_buffer_size. Tehirizina eto io sanda io mba hampiasain'ny programa zmmycnf. Ny fanovana ity fandrindrana ity dia tsy hiseho avy hatrany ao amin'ny mpizara MySQL. Mila mamorona indray ny my.cnf sy mamerina manomboka ny mpizara MySQL ianao, amin'ny fitandremana lehibe, mba hampiharana ilay fanovana.
