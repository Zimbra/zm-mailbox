csrf_filter_domain_allowed_ref_hosts_max_size = Isan'ny domain entries ambony indrindra ao amin'ny cache allowedRefererHosts isaky ny domain an'ny CsrfFilter. Miverina amin'ny ldap_cache_domain_maxsize raha misy hadisoana amin'ny parsing.
