zimbra_index_lucene_min_merge = Mamaritra ny habe merge farany ambany an'ny Lucene amin'ny Documents na KB arakaraka ny merge policy voafaritra ao amin'ny zimbra_index_lucene_merge_policy.
zimbra_index_lucene_max_merge = Mamaritra ny habe merge ambony indrindra an'ny Lucene amin'ny Documents na KB arakaraka ny merge policy voafaritra ao amin'ny zimbra_index_lucene_merge_policy. Io sanda io no mamaritra ny segment lehibe indrindra azo atambatra amin'ny segments hafa.
zimbra_index_lucene_merge_factor = Mamaritra ny fahita matetika anambaran'ny addDocument() ny segment indices. Raha kely ny sanda dia vitsy kokoa ny RAM ampiasaina rehefa manao indexing ary haingana kokoa ny fikarohana, saingy miadana kokoa ny indexing. Raha lehibe kokoa ny sanda dia betsaka kokoa ny RAM ampiasaina mandritra ny indexing ary, na dia miadana kokoa aza ny fikarohana, dia haingana kokoa ny indexing. Ny sanda lehibe kokoa (>10) no tsara indrindra ho an'ny famoronana batch index, ary ny sanda kely kokoa (<10) ho an'ny indices tazonina amin'ny fifandraisana mivantana.
zimbra_index_lucene_term_index_divisor = Mamaritra santionany amin'ireo indexed terms ampidirina ao amin'ny RAM. Amin'ny fametrahana sanda > 1 dia afaka mampihena ny fampiasana memory ianao, saingy hitombo kosa ny fahatarana rehefa mampiditra ny mombamomba ny record voatahiry ho an'ny term iray.
zimbra_index_lucene_use_compound_file = true raha tokony hampiasa ny compound file format ny Lucene segment vaovao. Milaza ny http://wiki.apache.org/lucene-java/ImproveIndexingSpeed fa tsara kokoa ny mamono ny compound file format ho an'ny zava-bita, saingy hampitombo be ny isan'ny file descriptors izany. Mety ho lany ny file descriptors raha lehibe ny zimbra_index_lucene_merge_factor.
zimbra_index_lucene_max_buffered_docs = Ny isan'ny documents farafahakeliny ilaina alohan'ny handefasana ireo buffered in-memory documents ho segment vaovao. Amin'ny ankapobeny, ny sanda lehibe dia manafaingana ny indexing.
zimbra_index_lucene_ram_buffer_size_kb = RAM buffered ambony indrindra an'ny Lucene amin'ny KB
zimbra_index_lucene_io_impl = Fampiharana Lucene FSDirectory ampiasaina amin'ny indexing IO. Sandan'asa azo atao: nio - mampiasa NIOFSDirectory. Mampiasa positional io an'ny FileChannel ao amin'ny java.nio izy rehefa mamaky mba hisorohana ny synchronization rehefa mamaky amin'ilay rakitra iray ihany. mmap - mampiasa MMapDirectory. Mampiasa memory-mapped IO izy rehefa mamaky. Safidy tsara izany raha ampy tsara ny virtual memory raha oharina amin'ny haben'ny index. simple - mampiasa SimpleFSDirectory. Mampiasa java.io.RandomAccessFile izy. Ratsy kokoa ny zava-bitany amin'ny concurrent satria manao synchronization izy rehefa mamaky ilay rakitra iray ihany ny threads maro. Raha tsy misy sanda omena dia hifidy ny fampiharana tsara indrindra ho an'ny tontolo iasana ny FSDirectory.
zimbra_index_rfc822address_max_token_count = Isan'ny tokens ambony indrindra ho an'ny adiresy ao amin'ny RFC822 address token stream. Mihatra amin'ny lohateny FROM, TO ary CC rehetra amin'ny mailaka io fetra io, ary koa amin'ny adiresy mailaka rehetra ho an'ny Contacts sy ny saha Creator ho an'ny Documents.
zimbra_index_rfc822address_max_token_length = Halavan'ny token ambony indrindra ho an'ny adiresy ao amin'ny RFC822 address token stream. Mihatra amin'ny lohateny FROM, TO ary CC rehetra amin'ny mailaka io fetra io, ary koa amin'ny adiresy mailaka rehetra ho an'ny Contacts sy ny saha Creator ho an'ny Documents.
