zimbra_index_disable_perf_counters = Raha false, ny IO famakiana sy fanoratana Lucene dia arahin'ny fanaraha-maso zava-bitan'i Zimbra. Ny sanda true dia manafoana ny fanaraha-maso Lucene IO.
