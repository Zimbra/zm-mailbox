zimbra_mailbox_change_checkpoint_frequency = Ny fahita matetika (araka ny isan'ny fanovana) anoratana ny sanda fanovana highwater ZIMBRA.MAILBOX.CHANGE_CHECKPOINT an'ny boaty mailaka.
