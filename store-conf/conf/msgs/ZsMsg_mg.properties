zimbra_mailbox_galsync_cache = Mamaritra ny cache ambony indrindra ho an'ny contact item ao amin'ny boaty mailaka galsync. Ataovy farafahakeliny mitovy amin'ny isan'ny contact items ao amin'ny boaty mailaka galsync io sanda io.
