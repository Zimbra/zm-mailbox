zimbra_server_hostname = Ny anarana voatokana ho an'ity mpizara ity. Tokony hisy fidirana \u2018server\u2019 mifanaraka aminy ao amin'ny LDAP - jereo ny antontan-taratasy momba ny baiko CreateServer ao amin'ny programa zmprov.
