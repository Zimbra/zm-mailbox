licenseFeaureOnHoldNotifierBodyText = Tonga na nihoatra ny isan''ny kaonty nahazo alalana ho an''ireto feature manaraka ireto:\n{0}\nAzonao atao na mampihena ny fampiasan''ireo mpampiasa efa misy na mampitombo ny fetra lisansa an''ilay feature.\n\nMba hampitomboana ny fetra lisansa an''ilay feature, mifandraisa amin''ny Zimbra Sales ao amin''ny sales@zimbra.com.\nMba hitantanana ny fizarana feature ho an''ny kaonty, midira ao amin''ny Admin Portal.\n\nMariho ireto manaraka ireto:\n1. Hanohy handray ity fampandrenesana ity ianao mandritra ny {1,number,integer} andro manomboka amin''ny daty nihoaran''ny fampiasana ny fetra.\n2. Tsy ho afaka hampihetsika ilay feature nampiasaina tafahoatra ho an''ny kaonty rehetra ianao.\n3. Raha tsy mandray fepetra amin''ilay feature nampiasaina tafahoatra ianao, dia hovonoina ho an''ny mpampiasa ilay feature mba hampidirana azy indray ao anatin''ny fetra lisansa.\n\nMiarahaba,\nZimbra Support
licenseFeaureOnHoldNotifierBodyHtml = <div style="font-family:sans-serif;">Tonga na nihoatra ny isan''ny kaonty nahazo alalana ho an''ireto feature manaraka ireto:<br>{0}<br>Azonao atao na mampihena ny fampiasan''ireo mpampiasa efa misy na mampitombo ny fetra lisansa an''ilay feature.<br><br>Mba hampitomboana ny fetra lisansa an''ilay feature, mifandraisa amin''ny Zimbra Sales ao amin''ny <b>sales@zimbra.com</b>.<br>Mba hitantanana ny fizarana feature ho an''ny kaonty, midira ao amin''ny Admin Portal.<br><br>Mariho ireto manaraka ireto:<br>1. Hanohy handray ity fampandrenesana ity ianao mandritra ny {1,number,integer} andro manomboka amin''ny daty nihoaran''ny fampiasana ny fetra.<br>2. Tsy ho afaka hampihetsika ilay feature nampiasaina tafahoatra ho an''ny kaonty rehetra ianao.<br>3. Raha tsy mandray fepetra amin''ilay feature nampiasaina tafahoatra ianao, dia hovonoina ho an''ny mpampiasa ilay feature mba hampidirana azy indray ao anatin''ny fetra lisansa.<br><br>Miarahaba,<br>Zimbra Support</div>
