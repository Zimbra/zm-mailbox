skins_directory = T\u0161hupet\u0161o ya skins.
zimbra_store_sweeper_max_age = Difaele t\u0161eo di fetago metsotso ye ment\u0161i di phumolwa ka go itiri\u0161a go t\u0161wa t\u0161hupet\u0161ong ya incoming ya store.
zimbra_store_copy_buffer_size_kb = Ditshepedi\u0161o t\u0161a go kopi\u0161a faele di diri\u0161a dibafa t\u0161a bogolo bjo.
zimbra_mailbox_galsync_cache = E beakanya polokelo ya godimo ya dilo t\u0161a dikgokagano t\u0161a lepokisi la poso la galsync. Bea boleng bjo bo be bonyenyane kudu palo ya dilo t\u0161a dikgokagano ka lepokising la poso la galsync.
zimbra_mailbox_manager_hardref_cache = Palo ya godimo ya mapokisi a poso ao a tlago go pinwa mo kgopolong pele molaodi wa mapokisi a poso a thoma go dumelela gore a hlweki\u0161we ka go kgoboket\u0161a ditlakala ga SoftReference.
zimbra_mailbox_active_cache = Bogolo bja godimo bja polokelo ya ka gare ya dilo ya LRU ya lepokisi la poso ge go na le disesheni t\u0161e di \u0161omago.
zimbra_mailbox_inactive_cache = Bogolo bja godimo bja polokelo ya ka gare ya dilo ya LRU ya lepokisi la poso ge go se na disesheni t\u0161e di \u0161omago.
zimbra_mailbox_change_checkpoint_frequency = Makga a, ka palo ya diphetogo, ao boleng bja phetogo ya highwater ya ZIMBRA.MAILBOX.CHANGE_CHECKPOINT ya lepokisi la poso bo ngwalwago.
zimbra_index_elasticsearch_url_base = URL ya motheo ya REST API ya ElasticSearch.
zimbra_index_threads = Bogolo bja pool ya thread bakeng sa batch index.
zimbra_reindex_threads = Palo ya godimo ya thread bakeng sa re-index. Di-thread t\u0161a re-index ga di poolwe.
zimbra_index_disable_perf_counters = Ge e le false, Lucene read le write IO di latelwa ke go lekola t\u0161homi\u0161o ya Zimbra. Boleng bja true bo \u0161iti\u0161a go lekola Lucene IO.
zimbra_index_max_readers = Palo ya godimo ya IndexReaders t\u0161a nako e tee.
zimbra_index_max_writers = Palo ya godimo ya IndexWriters t\u0161a nako e tee.
zimbra_index_reader_cache_size = Palo ya godimo ya IndexReaders ka polokelong ya indekse ya nyaki\u0161i\u0161o.
zimbra_index_reader_cache_ttl = Ge e sa \u0161ome nako ye telele go feta boleng bjo ka metsotswana, tlo\u0161a IndexReader go t\u0161wa polokelong.
zimbra_index_deferred_items_failure_delay = Ka morago ga go palelwa, tiego ya bonyenyane ka metsotswana magareng ga maitapi\u0161o a go hlweki\u0161a mothaladi wa dilo t\u0161e sa indek\u0161wago.
zimbra_index_lucene_max_terms_per_query = Bea palo ya godimo ya mant\u0161u a dumelet\u0161wego ka pot\u0161i\u0161o ka nngwe.
zimbra_index_max_transaction_bytes = Ge ditiro t\u0161a indekse di kgoboket\u0161wa ka transaction ya Mailbox, bogolo bja godimo bja kakaret\u0161o bja dilo t\u0161eo re tlago go di dumelela ka transaction e tee.
zimbra_index_max_transaction_items = Ge ditiro t\u0161a indekse di kgoboket\u0161wa, palo ya godimo ya mail_items yeo re e dumelelago ka transaction e tee.
zimbra_index_max_pending_deletes = Palo ya godimo ya diphomolo t\u0161a indekse t\u0161e di sa emego go fihla go bu\u0161et\u0161wa ga sekgoba sa disk.
zimbra_index_lucene_merge_policy = true go diri\u0161a LogDocMergePolicy, false go diri\u0161a LogByteSizeMergePolicy. LogDocMergePolicy e kgetha dikarolwana t\u0161a go kopanywa go ya ka palo ya ditokumente. LogByteSizeMergePolicy e kgetha dikarolwana t\u0161a go kopanywa go ya ka bogolo bja t\u0161ona.
zimbra_index_lucene_min_merge = E beakanya bogolo bja bonyenyane bja Lucene merge ka Documents goba KB go ya ka merge policy ye e bolet\u0161wego go zimbra_index_lucene_merge_policy.
zimbra_index_lucene_max_merge = E beakanya bogolo bja godimo bja Lucene merge ka Documents goba KB go ya ka merge policy ye e bolet\u0161wego go zimbra_index_lucene_merge_policy. Boleng bjo bo laola segment e kgolo kudu yeo e ka kopanwago le dikarolwana t\u0161e dingwe.
zimbra_index_lucene_merge_factor = Ke gant\u0161i gakaakang di-index t\u0161a segment di kopant\u0161wago ke addDocument(). Ka boleng bjo bonyenyane, RAM e nyenyane e diri\u0161wa ge go dirwa indexing, gomme nyaki\u0161i\u0161o e ba ka pela, eup\u0161a lebelo la indexing le ba fase. Ka boleng bjo bogolo, RAM e nt\u0161i e diri\u0161wa nakong ya indexing, gomme le ge nyaki\u0161i\u0161o e diega, indexing yona e a akgofa. Boleng bjo bogolo (>10) bo loket\u0161e go hlama indekse ya batch, gomme bjo bonyenyane (<10) bo loket\u0161e di-index t\u0161eo di hlokomelwago ka go diri\u0161ana.
zimbra_index_lucene_term_index_divisor = E t\u0161ea sampole e nyenyane ya mant\u0161u a indek\u0161it\u0161wego ao a tsenywago go RAM. Ka go bea se go boleng bjo bo fetago 1 o ka fokot\u0161a t\u0161homi\u0161o ya memory ka ditshenyagalelo t\u0161a latency e phagamego ge go hlahlelwa tshedimo\u0161o ya rekhoto ye e boloket\u0161wego lent\u0161ung.
zimbra_index_lucene_use_compound_file = true ge segment e mpsha ya Lucene e swanet\u0161e go diri\u0161a fomete ya compound file. http://wiki.apache.org/lucene-java/ImproveIndexingSpeed e re fomete ya compound file e timiwe bakeng sa tshepedi\u0161o e kaone, eup\u0161a seo se tla oket\u0161a kudu palo ya file descriptor. File descriptor di ka fela ge zimbra_index_lucene_merge_factor e le kgolo.
zimbra_index_lucene_max_buffered_docs = Palo ya bonyenyane ya ditokumente ye e nyakegago pele ditokumente t\u0161a mo memory t\u0161e di bofilwego di t\u0161hollelwa bjalo ka segment e mpsha. Boleng bjo bogolo gant\u0161i bo fa indexing ya lebelo.
zimbra_index_lucene_ram_buffer_size_kb = Lucene Max Buffered RAM ka KB.
zimbra_index_lucene_io_impl = Phethagat\u0161o ya Lucene FSDirectory ye e diri\u0161wago bakeng sa indexing IO. Boleng bjo bo kgonegago ke nio - diri\u0161a NIOFSDirectory. E diri\u0161a positional io ya FileChannel ya java.nio ge e bala go efoga synchronization ge go balwa go t\u0161wa faeleng e tee. mmap - diri\u0161a MMapDirectory. E diri\u0161a memory-mapped IO ge e bala. Ke kgetho e botse ge memory ya virtual e le nt\u0161i ge e bapet\u0161wa le bogolo bja indekse. simple - diri\u0161a SimpleFSDirectory. E diri\u0161a java.io.RandomAccessFile. E na le tshepedi\u0161o e mpe ya nako e tee ka ge e dira synchronization ge di-thread t\u0161e nt\u0161i di bala faele e tee. Ge go sa fiwe boleng, FSDirectory e tla kgetha phethagat\u0161o e kaone bakeng sa tikologo.
zimbra_index_rfc822address_max_token_count = Palo ya godimo ya token ya diaterese ka stream ya token ya aterese ya RFC822. Mollwane o \u0161oma go di-header ka moka t\u0161a FROM, TO le CC t\u0161a di-imeile, diaterese ka moka t\u0161a imeile t\u0161a Dikgokagano le lepatlelo la Creator la Ditokumente.
zimbra_index_rfc822address_max_token_length = Botelele bja godimo bja token bakeng sa aterese ka stream ya token ya aterese ya RFC822. Mollwane o \u0161oma go di-header ka moka t\u0161a FROM, TO le CC t\u0161a di-imeile, diaterese ka moka t\u0161a imeile t\u0161a Dikgokagano le lepatlelo la Creator la Ditokumente.
zimbra_index_wildcard_max_terms_expanded = Katolo\u0161o ya godimo ya wildcard bakeng sa lent\u0161u le lengwe le le lengwe ka pot\u0161i\u0161ong.
zimbra_galsync_index_reader_cache_size = Palo ya godimo ya IndexReaders ka polokelong ya indekse ya nyaki\u0161i\u0161o ya GAL. Indekse ya Lucene ya akhaonto ya GAL sync e bolokwa ka thoko ntle le go nt\u0161hwa ka go itiri\u0161a.
zimbra_spam_report_queue_size = Bakeng sa Junk/Not Junk Msg/ConvActionRequests bogolo bja queue ye bo lekanyet\u0161a workqueue ya seva bakeng sa go \u0161oma diforowate.
zimbra_throttle_op_concurrency = Lenaneo le arogant\u0161wego ka dikhefana la dikelo t\u0161a concurrency bakeng sa maemo a bohlokwa a 5 go t\u0161wa go a bohlokwa kudu go ya go a bohlokwa bja fase.
zimbra_im_chat_flush_time = Dipoledi\u0161ano t\u0161a IM t\u0161e di but\u0161wego di ngwalelwa store gant\u0161i gakaakang ka metsotswana.
zimbra_im_chat_close_time = Seva e tla leta nako e kae ka metsotswana pele e tswala disesheni t\u0161a IM chat t\u0161e di se nago modiro.
zimbra_http_originating_ip_header = HTTP header ye e swanet\u0161ego go lebelelwa go bona aterese ya IP ya mathomo ya moreki.
zimbra_session_limit_imap = Palo ya godimo ya difoltara t\u0161a IMAP t\u0161eo mo\u0161omi\u0161i o tee a ka bago a di but\u0161e ka nako e tee.
zimbra_session_limit_admin = Palo ya godimo ya disesheni t\u0161a admin SOAP t\u0161eo mo\u0161omi\u0161i o tee a ka bago a di but\u0161e ka nako e tee.
zimbra_session_limit_soap = Palo ya godimo ya disesheni t\u0161a SOAP t\u0161e di \u0161omago ka akhaonto. Oket\u0161a boleng bjo ka tlhokomelo go efoga dipho\u0161o t\u0161a \u201cToo many SOAP sessions\u201d ka mailbox.log.
zimbra_session_limit_sync = Palo ya godimo ya balatedi ba sync ba session ka session bakeng sa ActiveSync. Oket\u0161a boleng bjo ka tlhokomelo go efoga dipho\u0161o t\u0161a \u201cToo many SYNCLISTENER sessions\u201d ka sync.log.
zimbra_session_timeout_soap = Nako ya go fela ge go sa \u0161ongwe ka metsotswana bakeng sa disesheni t\u0161a SOAP.
zimbra_session_max_pending_notifications = Palo ya godimo ya ditsebi\u0161o t\u0161e di sa letet\u0161wego t\u0161eo di ka bewago mothalading ka seshening ya SOAP pele mothaladi o hlweki\u0161wa gomme moreki a bot\u0161wa gore maemo a gagwe ga a sa \u0161oma.
zimbra_converter_enabled_uuencode = Ge decoder ya UUENCODE e sebet\u0161wa ge go hlahlo\u0161wa melaet\u0161a go t\u0161wa go store.
zimbra_converter_enabled_tnef = Ge decoder ya TNEF e sebet\u0161wa ge go hlahlo\u0161wa melaet\u0161a go t\u0161wa go store.
zimbra_converter_depth_max = Botebo bja recursive MIME part bjo bo lego ka tlase ga bjona converters di ka se sebet\u0161e.
zimbra_ssl_enabled = Ge go swanet\u0161e goba aowa go laet\u0161a ssl keystore.
stats_img_folder = T\u0161hupet\u0161o ya go boloka diswant\u0161ho t\u0161a dipalopalo t\u0161e di t\u0161weledit\u0161wego.
ldap_host = Moamogedi wa LDAP yo o swanet\u0161ego go diri\u0161wa. E siilwe ke nako - hle diri\u0161a ldap_url go e na le moo.
ldap_log_level = Mogato wa go ngwala log wa LDAP.
ldap_port = Boemakepe bja LDAP bjo bo swanet\u0161ego go diri\u0161wa. E siilwe ke nako - hle diri\u0161a ldap_url go e na le moo.
ldap_url = Lenaneo la di-server t\u0161a LDAP bakeng sa go diri\u0161wa ke seva ye.
ldap_master_url = URL ya LDAP master.
ldap_is_master = Na host ye ke seva ya master ya LDAP?
ldap_root_password = Phasewete ya LDAP slapd.conf rootdn. Bjalo ka boiketlo, nakong ya go thomi\u0161a LDAP phasewete ya go se kgethwe e a hlamiwa, ya bolokwa ka peakanyong ya selegae le ka slapd.conf. Ge o nyaka go fetola phasewete ye, hle diri\u0161a lenaneo la zmldappasswd leo le tlago go fetola phasewete ka slapd.conf le ka peakanyong ya selegae ka bobedi.
ldap_connect_timeout = Milliseconds ka morago ga moo maitapi\u0161o a kgokagano a fedi\u0161wago.
ldap_read_timeout = Milliseconds ka morago ga moo maitapi\u0161o a go bala a fedi\u0161wago.
ldap_deref_aliases = Ge e ba aliases di swanet\u0161e go dereference ge go nyaki\u0161i\u0161wa goba go binding go t\u0161hupet\u0161o ya ka ntle. Melao ya maleba ke: always, never, finding, searching.
ldap_connect_pool_master = Ge go swanet\u0161e go diri\u0161a JNDI connection pooling bakeng sa LDAP master.
ldap_connect_pool_debug = Ge go swanet\u0161e go debugga LDAP connection pooling.
ldap_connect_pool_initsize = Palo ya mathomo ya dikgokagano t\u0161a LDAP t\u0161e di \u0161omago ye e swanet\u0161ego go oket\u0161wa go yona.
ldap_connect_pool_maxsize = Palo ya godimo ya dikgokagano t\u0161a LDAP t\u0161e di \u0161omago le t\u0161e di sa \u0161omego t\u0161e di dumelet\u0161wego.
ldap_connect_pool_prefsize = Palo ye e ratwago ya dikgokagano t\u0161a LDAP - go bea maxsize le prefsize go boleng bjo bo swanago go boloka connection pool e le ka bogolo bjo bo sa fetogego.
ldap_connect_pool_timeout = Milliseconds ya nako ya go se \u0161ome pele kgokagano ye e sa \u0161omego e nt\u0161hwa go t\u0161wa pooleng.
ldap_connect_pool_health_check_on_checkout_enabled = Ge lekolo la maphelo la connection pool le swanet\u0161e go bit\u0161wa nako le nako ge kgokagano e nt\u0161hwa bakeng sa go diri\u0161wa. Ge lekolo la maphelo la OnCheckout le kgont\u0161hit\u0161we, lekolo la maphelo la morago leo le diragalago ka dinako le tla \u0161iti\u0161wa.
ldap_connect_pool_health_check_interval_millis = Botelele bja nako ka milliseconds magareng ga dilekolo t\u0161a maphelo t\u0161a morago t\u0161e di diragalago ka dinako kgahlanong le dikgokagano t\u0161e di lego gona ka connection pool.
ldap_connect_pool_health_check_max_response_time_millis = Botelele bja godimo bja nako ka milliseconds bjo bo swanet\u0161ego go dumelelwa gore karabo ya lekolo la maphelo e boa go t\u0161wa go seva ya LDAP.
ldap_replication_password = Phasewete ye e diri\u0161wago ke mo\u0161omi\u0161i wa syncrepl go netefat\u0161a go ldap master.
ldap_postfix_password = Phasewete ye e diri\u0161wago ke postfix go netefat\u0161a go ldap.
ldap_amavis_password = Phasewete ye e diri\u0161wago ke amavis go netefat\u0161a go ldap.
ldap_starttls_supported = Ge seva ya LDAP e thekga tshepedi\u0161o ya startTLS.
ldap_require_tls = Ge TLS e nyakega go bareki ba LDAP.
ldap_cache_account_maxsize = Palo ya godimo ya dilo t\u0161a akhaonto t\u0161e di ka bolokwago ka cache.
ldap_cache_account_maxage = Nako ya godimo ka metsotso ya dilo t\u0161a akhaonto ka cache.
ldap_cache_cos_maxsize = Palo ya godimo ya dilo t\u0161a cos t\u0161e di ka bolokwago ka cache.
ldap_cache_cos_maxage = Nako ya godimo ka metsotso ya dilo t\u0161a cos ka cache.
ldap_cache_domain_maxsize = Palo ya godimo ya dilo t\u0161a domain t\u0161e di ka bolokwago ka cache.
ldap_cache_domain_maxage = Nako ya godimo ka metsotso ya dilo t\u0161a domain ka cache.
ldap_cache_mime_maxage = Nako ya godimo ka metsotso ya dilo t\u0161a MIME ka cache.
ldap_cache_server_maxsize = Palo ya godimo ya dilo t\u0161a seva t\u0161e di ka bolokwago ka cache.
ldap_cache_server_maxage = Nako ya godimo ka metsotso ya dilo t\u0161a sehlopha ka cache.
ldap_cache_share_locator_maxsize = Palo ya godimo ya dilo t\u0161a akhaonto ka cache ya named entry.
ldap_cache_share_locator_maxage = TTL ya cache ya named entry ka metsotso.
ldap_cache_timezone_maxsize = Palo ya godimo ya dilo t\u0161a timezone t\u0161e di ka bolokwago ka cache.
ldap_cache_zimlet_maxsize = Palo ya godimo ya dilo t\u0161a Zimlet t\u0161e di ka bolokwago ka cache.
ldap_cache_zimlet_maxage = Nako ya godimo (ka metsotso) ya dilo t\u0161a Zimlet ka cache.
ldap_cache_custom_dynamic_group_membership_maxage_ms = Nako ya godimo (ka milliseconds) ya go boloka ka cache gore akhaonto ke leloko la dynamic groups dife, bakeng sa dihlopha t\u0161eo boleloko bja t\u0161ona bo laolwago ka MemberURL ya tlwaelo.
csrf_filter_domain_allowed_ref_hosts_max_size = Palo ya godimo ya ditseno t\u0161a domain ka cache ya allowedRefererHosts ya domain ka nngwe ya CsrfFilter. Ge go na le pho\u0161o ya parsing, go boela go ldap_cache_domain_maxsize.
csrf_filter_domain_allowed_ref_hosts_cache_expiry_mins = Nako ya godimo (ka metsotso) ya ditseno ka cache ya allowedRefererHosts ya domain ka nngwe ya CsrfFilter. Ka morago ga go felelwa ke nako, tseno e nt\u0161hwa ka cache gomme e laollwa gape go t\u0161wa LDAP kgopelong e latelago. Ge go na le pho\u0161o ya parsing, go boela go metsotso ye 60.
mysql_directory = Lefelo la go tsenya MySQL.
mysql_data_directory = Directory yeo data ya MySQL e swanet\u0161ego go ba go yona.
mysql_errlogfile = Log ya dipho\u0161o ya MySQL/MariaDB.
mysql_socket = Tsejana go ya go socket ya MySQL yeo e \u0161omi\u0161wago ke didiri\u0161wa t\u0161a mothalo wa ditaelo t\u0161a MySQL.
mysql_pidfile = Faele yeo go yona ID ya tshepedi\u0161o ya MySQL e bolokwago.
mysql_mycnf = Tsejana go ya go my.cnf, faele ya peakanyo ya MySQL.
mysql_bind_address = Segokaganyi mo go host ye seo MySQL e tlago go ikgokaganya go sona.
mysql_port = Nomoro ya poroto yeo seva ya MySQL e swanet\u0161ego go theelet\u0161a go yona.
mysql_root_password = Phasewete ya modiri\u0161i wa ka gare wa MySQL wa \u2018root\u2019, e sego wa go swana le go tsena ga UNIX root. Bjalo ka boiketlo, nakong ya go thoma database go t\u0161welet\u0161wa phasewete ya go se kgethwe, ya bolokwa ka local config le ka MySQL. Ge o nyaka go feto\u0161a phasewete ye, hle \u0161omi\u0161a lenaneo la zmmypasswd leo le tlago go feto\u0161a phasewete ka MySQL le ka local config ka bobedi.
mysql_memory_percent = Peresente ya memori ya tshepedi\u0161o ye mysql e swanet\u0161ego go e diri\u0161a. Boleng bjo bo bolokwa mo gore bo \u0161omi\u0161we ke lenaneo la zmmycnf. Go fetola peakanyo ye ga go bonagale ka pela go seva ya MySQL. O tla swanelwa ke go t\u0161welet\u0161a gape my.cnf le go thoma gape seva ya MySQL ka kelohloko e kgolo gore phetogo e \u0161ome.
mysql_innodb_log_buffer_size = Lebelela ditokomane t\u0161a MySQL mabapi le innodb_log_buffer_size. Boleng bjo bo bolokwa mo gore bo \u0161omi\u0161we ke lenaneo la zmmycnf. Go fetola peakanyo ye ga go bonagale ka pela go seva ya MySQL. O tla swanelwa ke go t\u0161welet\u0161a gape my.cnf le go thoma gape seva ya MySQL ka kelohloko e kgolo gore phetogo e \u0161ome.
mysql_innodb_log_file_size = Lebelela ditokomane t\u0161a MySQL mabapi le innodb_log_file_size. Boleng bjo bo bolokwa mo gore bo \u0161omi\u0161we ke lenaneo la zmmycnf. Go fetola peakanyo ye ga go bonagale ka pela go seva ya MySQL. O tla swanelwa ke go t\u0161welet\u0161a gape my.cnf le go thoma gape seva ya MySQL ka kelohloko e kgolo gore phetogo e \u0161ome.
mysql_sort_buffer_size = Lebelela ditokomane t\u0161a MySQL mabapi le sort_buffer_size. Boleng bjo bo bolokwa mo gore bo \u0161omi\u0161we ke lenaneo la zmmycnf. Go fetola peakanyo ye ga go bonagale ka pela go seva ya MySQL. O tla swanelwa ke go t\u0161welet\u0161a gape my.cnf le go thoma gape seva ya MySQL ka kelohloko e kgolo gore phetogo e \u0161ome.
mysql_read_buffer_size = Lebelela ditokomane t\u0161a MySQL mabapi le read_buffer_size. Boleng bjo bo bolokwa mo gore bo \u0161omi\u0161we ke lenaneo la zmmycnf. Go fetola peakanyo ye ga go bonagale ka pela go seva ya MySQL. O tla swanelwa ke go t\u0161welet\u0161a gape my.cnf le go thoma gape seva ya MySQL ka kelohloko e kgolo gore phetogo e \u0161ome.
mysql_backup_retention = Palo ya diphetolo t\u0161a bekapo ya database ya mysql t\u0161eo di swanet\u0161ego go bolokwa.
antispam_mysql_enabled = \u0160omi\u0161a database ya mysql bakeng sa antispam. False ka tlwaelo.
antispam_backup_retention = Palo ya diphetolo t\u0161a bekapo ya database ya antispam t\u0161eo di swanet\u0161ego go bolokwa.
derby_properties = Tsejana go ya go faele ya diphroparithi t\u0161a peakanyo ya derby.
imap_max_consecutive_error = Ge e le kgolo go feta 0, tlogela kgokagano ya IMAP ge boleng bja imap_max_consecutive_error bo fihlet\u0161we.
imap_inactive_session_cache_size = Ehcache: palo ya godimo ya ditseno t\u0161a cache t\u0161a IMAP t\u0161e sa \u0161omego godimo ga disk pele ga go nt\u0161hwa.
imap_use_ehcache = Ge e le true, \u0161omi\u0161a Ehcache bakeng sa caching ya sesene sa IMAP. Go sego bjalo, \u0161omi\u0161a cache ya disk.
imap_write_timeout = Beakanya timeout ya go ngwala ya sesene sa IMAP (nio).
imap_write_chunk_size = Bogolo ka bytes bja buffer ya go ngwala ya IMAP.
imap_thread_keep_alive_time = Nako ya tlwaelo, ka metsotsoana, ya thread ya IMAP.
imap_throttle_ip_limit = Ge e le kgolo go feta 0, palo ya godimo ya dikgopelo t\u0161a IMAP ka motsotswana ka IP.
imap_throttle_acct_limit = Ge e le kgolo go feta 0, palo ya godimo ya dikgopelo t\u0161a IMAP ka motsotswana ka akhaonto.
imap_suggested_batch_copy_size = Palo ya melaet\u0161a yeo e swanet\u0161ego go \u0161ongwa ka batch e tee nakong ya ditiri\u0161o t\u0161a IMAP COPY.
imap_in_progress_response_thread_pool_size = Palo ya godimo ya dithread ka pool ya go romela karabo ya InProgress go moreki.
imap_in_progress_response_thread_keep_alive = Nako ka metsotsoana yeo thread e bolokwago e phela pele e fedi\u0161wa.
imap_ehcache_heap_size = Palo ya godimo ya ditseno t\u0161a cache t\u0161a IMAP t\u0161e bolokwago ka tier ya heap ya Ehcache.
imap_ehcache_skip_large_folder = Ge e kgont\u0161hit\u0161we, tlola go boloka ka Ehcache difoltara t\u0161e dikgolo t\u0161a IMAP.
imap_ehcache_folder_max_message_count = Molelwane wa palo ya melaet\u0161a wo godimo ga wona difoltara t\u0161a IMAP di sa bolokwago ka Ehcache.
nio_imap_enabled = Ge e le true, kgont\u0161ha Jetty non-blocking IO bakeng sa IMAP.
nio_pop3_enabled = Ge e le true, kgont\u0161ha Jetty non-blocking IO bakeng sa POP3.
postfix_mail_owner = postfix_mail_owner
postfix_setgid_group = postfix_setgid_group
postfix_version = postfix_version
mailboxd_directory = Lefelo la go tsenya mailboxd.
mailboxd_java_heap_size = Palo ya megabyte yeo e tlago go diri\u0161wa bjalo ka bogolo bja godimo bja Java heap (-Xmx) ya JVM yeo e kitimago Mailboxd.
mailboxd_java_heap_new_size_percent = Peresente ya bogolo bja Java heap yeo e tlago go diri\u0161wa bakeng sa young generation (-Xmn) ya JVM yeo e kitimago Mailboxd.
mailboxd_java_options = Dikgetho t\u0161a JVM t\u0161eo di swanet\u0161ego go \u0161omi\u0161wa ge Mailboxd e thongwa.
mailboxd_pidfile = Faele yeo go yona ID ya tshepedi\u0161o ya JVM ya Mailboxd e bolokwago.
mailboxd_keystore = Lefelo la faele ya data ya keystore.
mailboxd_keystore_password = Phasewete yeo e swanet\u0161ego go \u0161omi\u0161wa le keystore ya KeyManager.
mailboxd_truststore = Lefelo la faele ya data ya truststore.
mailboxd_truststore_password = Phasewete yeo e swanet\u0161ego go \u0161omi\u0161wa le truststore ya TrustManager.
client_ssl_truststore = Lefelo la faele ya data ya truststore yeo e \u0161omi\u0161wago bakeng sa netefat\u0161o ya SSL ya moreki.
client_ssl_truststore_password = Phasewete yeo e swanet\u0161ego go \u0161omi\u0161wa le truststore ya SSL TrustManager ya moreki.
mailboxd_output_file = Faele yeo stdout le stderr t\u0161a seva di swanet\u0161ego go i\u0161wa go yona.
mailboxd_output_rotate_interval = Nako, ka metsotsoana, yeo ka yona faele ya output ya mailboxd e retolo\u0161wago. Ge e le <= 0, ga go na go retolo\u0161a go dirwago.
mailboxd_thread_stack_size = Bogolo bja stack ya thread bakeng sa Mailboxd.
ssl_allow_untrusted_certs = Ge e le true, dumelela disetifikeiti t\u0161a SSL t\u0161e di sa tshephwego t\u0161e itiri\u0161it\u0161ego saene.
zimlet_directory = Tsejana go ya go di-Zimlet t\u0161e di tsent\u0161wego.
calendar_outlook_compatible_allday_events = \u0160omi\u0161a ditiragalo t\u0161a let\u0161at\u0161i ka moka t\u0161e di sepelelanago le Outlook. False ka tlwaelo.
calendar_entourage_compatible_timezones = Tsopola parametara ya TZID ka gare ga diphroparithi t\u0161a iCalendar go \u0161oma go dikologa pho\u0161o ya MS Entourage. True ka tlwaelo.
calendar_ics_import_full_parse_max_size = Nakong ya go tli\u0161a ics, \u0161omi\u0161a parser ya botlalo ge bogolo bja ics bo le ka fase goba bo lekana le se; difaele t\u0161e dikgolo t\u0161a ics di hlathollwa ka parser ya callback yeo e sa dumeleleng dit\u0161hupet\u0161o t\u0161a pele go VTIMEZONE TZID.
calendar_canonical_tzid = ID ya timezone yeo e swanet\u0161ego go bu\u0161et\u0161wa bjalo ka TimeZone.getCanonicalID(). Boleng bjo bo kgonegago: "olson","windows","java". "windows" ka tlwaelo.
calendar_cache_enabled = Kgont\u0161ha cache ya khalendara. False ka tlwaelo.
calendar_cache_directory = Root directory ya difaele t\u0161a cache ya khalendara.
calendar_cache_lru_size = Bogolo bja LRU ya cache ya memori. Cache ya difoltara t\u0161e dint\u0161i t\u0161a khalendara ka memoring.
calendar_cache_range_month_from = Kgwedi ya mathomo mo go range e bolokwago ka cache. 0 e ra kgwedi ya bjale, -1 e ra kgwedi e fetilego, bj.bj.
calendar_cache_range_months = Palo ya dikgwedi ka range e bolokwago ka cache.
krb5_keytab = Lefelo la faele ya keytab ya Zimbra Kerberos 5.
krb5_debug_enabled = Kgont\u0161hit\u0161we go debug-a Kerberos.
zimbra_mtareport_max_hosts = Palo ya godimo ya dihost t\u0161eo di swanet\u0161ego go akaret\u0161wa dipegong t\u0161a MTA t\u0161a let\u0161at\u0161i le let\u0161at\u0161i t\u0161eo di t\u0161welet\u0161wago ke zmdailyreport.
zimbra_mtareport_max_recipients = Palo ya baamogedi yeo e swanet\u0161ego go lokelet\u0161wa dipegong t\u0161a mta t\u0161a let\u0161at\u0161i le let\u0161at\u0161i.
zimbra_mtareport_max_senders = Palo ya baromedi yeo e swanet\u0161ego go lokelet\u0161wa dipegong t\u0161a mta t\u0161a let\u0161at\u0161i le let\u0161at\u0161i.
zimbra_mtareport_max_users = Palo ya godimo ya badiri\u0161i yeo e swanet\u0161ego go akaret\u0161wa dipegong t\u0161a MTA t\u0161a let\u0161at\u0161i le let\u0161at\u0161i t\u0161eo di t\u0161welet\u0161wago ke zmdailyreport.
zimbra_auth_always_send_refer = Ka mehla romela gape tag ya <refer> ka karabong ya auth go gapelet\u0161a redirect ya moreki.
zimbra_admin_service_port = Poroto ya admin ya tlwaelo/bootstrap.
zimbra_admin_service_scheme = Sekema sa protocol ya admin sa tlwaelo/bootstrap.
zimbra_mail_service_port = Poroto ya imeile ya tlwaelo.
zimbra_zmprov_default_to_ldap = Ge e le gore zmprov e ya ka tlwaelo go LDAP goba SOAP.
zimbra_zmprov_default_soap_server = Seva ya soap ya tlwaelo yeo zmprov e swanet\u0161ego go ikgokaganya le yona.
zmprov_safeguarded_attrs = Lenaneo la diatributi t\u0161a provisioning t\u0161e nang le mehola ye ment\u0161i, le arogant\u0161we ka dikoma, leo le swanet\u0161ego go \u0161irelet\u0161wa kgahlanong le go t\u0161eelwa legato.
zmprov_tmp_directory = Directory ya nakwana yeo zmprov e ngwalago mehola ya atribiuti ya binary go difaele go yona.
zimbra_mailbox_groups = Palo ya dihlopha t\u0161a mailbox yeo mabokose a mafsa a poso a swanet\u0161ego go abelwa go yona.
debug_mailboxindex_use_new_locking = \u0160omi\u0161a locking ya mohuta o mofsa bakeng sa MailboxIndex.
zimbra_class_provisioning = Klase ya segokaganyi sa provisioning.
zimbra_class_accessmanager = Klase ya segokaganyi sa access manager.
zimbra_class_mboxmanager = Klase ya segokaganyi sa mailbox manager.
zimbra_class_database = Klase ya peakanyo ya database.
zimbra_class_store = Klase ya segokaganyi sa polokelo ya molaet\u0161a.
zimbra_class_application = Klase ya segokaganyi sa tshebi\u0161o ya Zimbra.
zimbra_class_rulerewriterfactory = Klase ya segokaganyi sa RuleRewriterFactory.
zimbra_class_dbconnfactory = Klase ya factory ya kgokagano ya database.
zimbra_class_soapsessionfactory= Klase ya factory ya sesene sa SOAP.
av_notify_user = Aterese ya imeile yeo melaet\u0161a ya taolo e romelwago go t\u0161wa go yona go t\u0161wa go anti-virus le DKIM.
av_notify_domain = Domain ya tlwaelo ka dipeakanyong t\u0161a amavisd.
data_source_trust_self_signed_certs = Dumelela disetifikeiti t\u0161e itiri\u0161it\u0161ego saene ge o kgokagana le mothopo wa data ka SSL.
data_source_fetch_size = Palo ya godimo ya melaet\u0161a ya imap yeo e FETCH-wago kgopelong e nngwe le e nngwe.
data_source_max_literal_mem_size = Bogolo bja godimo bja data ya literal (ka bytes) bjo bo tlago go bolokwa ka memoring. Data e kgolwane e tla bolokwa ka faeleng ya nakwana.
timezone_file = Faele ya iCalendar yeo e lokelet\u0161ago di-timezone t\u0161e di tsebjago gabotse.
search_disable_database_hints = Ge e le true, o se ke wa \u0161omi\u0161a dihints t\u0161a database dipot\u0161i\u0161ong t\u0161eo di t\u0161welet\u0161wago nakong ya nyaki\u0161i\u0161o.
search_dbfirst_term_percentage_cutoff = Parametara ya ka gare ya go t\u0161welet\u0161a query.
zmstat_interval = Gant\u0161i gakaakang disampole di t\u0161ewago ke zmstat (metsotswana).
zmstat_df_excludes = Lenaneo la divolumu t\u0161a disk (ka tsela ya mount) leo le arogant\u0161wego ka colon, leo le swanet\u0161ego go nt\u0161hwa go zmstats.
zimbra_noop_default_timeout = Nako ya tlwaelo (metsotswana) ye seva e tlago go dumelela NoOpRequest go thibela ge wait=1 e laet\u0161we ke moreki.
zimbra_noop_min_timeout = Timeout ya fase kudu ye e dumelet\u0161wego (metsotswana) yeo e laet\u0161wego go NoOpRequest.
zimbra_noop_max_timeout = Timeout ya godimo kudu ye e dumelet\u0161wego (metsotswana) yeo e laet\u0161wego go NoOpRequest.
zimbra_waitset_default_request_timeout = Timeout ya kgopelo ya tlwaelo (metsotswana) ye WaitSetRequest ya yo e sego admin e tlago go thibela.
zimbra_waitset_min_request_timeout = Timeout ya kgopelo ya fase kudu (metsotswana) ye WaitSetRequest ya yo e sego admin e tlago go thibela.
zimbra_waitset_max_request_timeout = Timeout ya kgopelo ya godimo kudu (metsotswana) ye WaitSetRequest ya yo e sego admin e tlago go thibela.
zimbra_waitset_max_per_account = Palo ya godimo ya di-WaitSet t\u0161eo akhaonto e tee ye e sego admin e ka bago le t\u0161ona di but\u0161we.
zimbra_admin_waitset_default_request_timeout = Timeout ya kgopelo ya tlwaelo (metsotswana) ye WaitSetRequest ya admin e tlago go thibela.
zimbra_admin_waitset_min_request_timeout = Timeout ya kgopelo ya fase kudu (metsotswana) ye WaitSetRequest ya admin e tlago go thibela.
zimbra_admin_waitset_max_request_timeout = Timeout ya kgopelo ya godimo kudu (metsotswana) ye WaitSetRequest ya admin e tlago go thibela.
zimbra_waitset_initial_sleep_time = Timeout ya mathomo (milliseconds) ya go leta pele go \u0161ongwa WaitSetRequest efe goba efe.
zimbra_waitset_nodata_sleep_time = Nako (milliseconds) ya go robala ge go swarwa WaitSetRequest ge go se na data ka morago ga tlhahlobo ya mathomo.
zmdisklog_warn_threshold = Molelwane wa temo\u0161o wa disk wa tlwaelo wa SNMP/SMTP.
zmdisklog_critical_threshold = Molelwane wa maemo a bohlokwa wa disk wa tlwaelo wa SNMP/SMTP.
zimbra_csv_mapping_file = Faele ya mapping ya mafelo a dikgokagano bakeng sa go tli\u0161a le go romela ntle ga CSV.
zimbra_auth_provider = Lenaneo le laot\u0161wego la baphethi ba auth, le arogant\u0161we ka dikoma.
zimbra_zmjava_options = Dikgetho t\u0161a Java bakeng sa script ya zmjava.
zimbra_zmjava_java_library_path = Phropathi ya Java ya java.library.path bakeng sa script ya zmjava.
zimbra_zmjava_java_ext_dirs = Phropathi ya Java ya java.ext.dirs bakeng sa script ya zmjava.
debug_update_config_use_old_scheme = Ge e le true, DbMailbox.updateConfig() e tla dira DELETE/INSERT go e na le UPDATE.
debug_xmpp_disable_client_tls = Tima TLS bakeng sa protocol ya XMPP C2S.
im_dnsutil_dnsoverride = Dipeakanyo t\u0161a DNS override bakeng sa IM federation, ka fomate ya \u2018{domain,host:port},{domain,host:port},...\u2019
javamail_pop3_debug = Ge e ba go debug ga JavaMail go swanet\u0161e go kgont\u0161hwa bakeng sa POP3.
javamail_zparser = Ge go swanet\u0161e go \u0161omi\u0161wa parser ya MIME ya Zimbra go e na le ya JavaMail.
javamail_imap_debug = Ge e ba go debug ga JavaMail go swanet\u0161e go kgont\u0161hwa bakeng sa IMAP.
javamail_smtp_debug = Ge e ba JavaMail debug e swanet\u0161e go kgont\u0161hwa bakeng sa SMTP.
javamail_pop3_timeout = Nako ya go felela ya POP3 ka metsotswana.
javamail_imap_timeout = Nako ya go felela ya IMAP ka metsotswana.
javamail_smtp_timeout = Nako ya go felela ya SMTP ka metsotswana.
javamail_pop3_enable_starttls = Ge e ba STARTTLS e swanet\u0161e go kgont\u0161hwa bakeng sa POP3.
javamail_imap_enable_starttls = Ge e ba STARTTLS e swanet\u0161e go kgont\u0161hwa bakeng sa IMAP.
javamail_smtp_enable_starttls = Ge e ba STARTTLS e swanet\u0161e go kgont\u0161hwa bakeng sa SMTP.
jdbc_results_streaming_enabled = Ge e le true, data e tla streamwa go t\u0161wa go database bakeng sa dipot\u0161i\u0161o t\u0161eo di ka bu\u0161et\u0161ago dihlopha t\u0161e dikgolo t\u0161a dipoelo.
zimbra_lmtp_validate_messages = Ge e le true, netefat\u0161a diteng t\u0161a melaet\u0161a ya LMTP yeo e tsenago.
zimbra_message_validation_max_line_length = Ge zimbra_lmtp_validate_messages e le true, boelet\u0161a morago melaet\u0161a yeo e nago le mothaladi wo motelele go feta palo ye ya dibaiti.
smtp_host_retry_millis = Palo ya dimilisekonthe t\u0161a go leta pele o leka gape ka morago ga kgokagano ye e palet\u0161wego go moamogedi wa SMTP.
conversation_max_age_ms = Palo ya godimo ya nako yeo dipoledi\u0161ano di dulago di bulegile ka dimilisekonthe.
data_source_scheduling_enabled = Ge mehlodi ya data yeo e beilego polling interval e swanet\u0161e go syncwa ka go itiri\u0161a.
text_attachments_base64 = Ge e le true, dula o encode ditlalelet\u0161o t\u0161a sengwalwa bjalo ka base64.
cli_httpclient_soaphttptransport_so_timeout=Socket timeout ka dimilisekonthe bakeng sa cli utilities SOAP clients t\u0161eo di diri\u0161ago sehlopha sa SoapHttpTransport.
client_use_native_proxy_selector=Ge e ba khoutu ya native e swanet\u0161e go diri\u0161wa go bala data ya system proxy.
client_use_system_proxy=Ge e ba system proxies di swanet\u0161e go diri\u0161wa.
contact_ranking_enabled=Kgont\u0161ha tafola ya go beakanya dikgokagano.
data_source_config=Tsejana ya go ya go faele ya peakanyo ya datasource.
httpclient_internal_client_connection_timeout=Httpclient client bakeng sa dikgokagano t\u0161a ka gare t\u0161a Zimbra: E bea timeout ka dimilisekonthe yeo e diri\u0161wago ge go t\u0161ewa kgokagano ya HTTP go t\u0161wa go HTTP connection manager.
httpclient_internal_connmgr_connection_timeout=Httpclient connection manager bakeng sa dikgokagano t\u0161a ka gare t\u0161a Zimbra: E laola timeout go fihla ge kgokagano e hlomwa. Boleng bja zero bo ra gore timeout ga e diri\u0161we.
httpclient_internal_connmgr_idle_reaper_connection_timeout=Httpclient connection manager idle reaper bakeng sa dikgokagano t\u0161a ka gare t\u0161a Zimbra: boleng bja timeout bjo bo diri\u0161wago ge go lekwa dikgokagano t\u0161e sa \u0161omego.
httpclient_internal_connmgr_idle_reaper_sleep_interval=Httpclient connection manager idle reaper bakeng sa dikgokagano t\u0161a ka gare t\u0161a Zimbra: Palo ya nako (ka dimilisekonthe) yeo thread ya idle connection reaper ya http client connection manager e robalago magareng ga mo\u0161omo. 0 e ra gore thread ya reaper e timilwe.
httpclient_internal_connmgr_max_host_connections=Httpclient connection manager bakeng sa dikgokagano t\u0161a ka gare t\u0161a Zimbra: E hlalosa palo ya godimo ya dikgokagano t\u0161e di dumelet\u0161wego ka peakanyo ya host ka nngwe.
httpclient_internal_connmgr_max_total_connections=Httpclient connection manager bakeng sa dikgokagano t\u0161a ka gare t\u0161a Zimbra: E hlalosa palo ya godimo ya dikgokagano t\u0161e di dumelet\u0161wego ka kakaret\u0161o.
httpclient_internal_connmgr_so_timeout=Httpclient connection manager bakeng sa dikgokagano t\u0161a ka gare t\u0161a Zimbra: Timeout ya boleng bja zero e hlathollwa bjalo ka timeout ya go se fele. Boleng bjo bo diri\u0161wa ge go se na socket timeout yeo e beilwego ka dipharamitha t\u0161a HTTP method.
httpclient_internal_connmgr_tcp_nodelay=Httpclient connection manager bakeng sa dikgokagano t\u0161a ka gare t\u0161a Zimbra: E hlalosa ge e ba Nagle algorithm e swanet\u0161e go paledi\u0161wa go HTTP socket.
httpclient_internal_connmgr_stale_connection_check=Httpclient connection manager bakeng sa dikgokagano t\u0161a ka gare t\u0161a Zimbra: E laola ge e ba stale connection check e swanet\u0161e go diri\u0161wa. Go paledi\u0161a stale connection check go ka felelet\u0161a ka kaonafat\u0161o ye nnyane ya tshepedi\u0161o eup\u0161a go na le kotsi ya go hwet\u0161a pho\u0161o ya I/O ge go phethwa kgopelo godimo ga kgokagano yeo e tswalet\u0161wego ka lehlakoreng la seva.
httpclient_external_client_connection_timeout=Httpclient client bakeng sa dikgokagano t\u0161a ka ntle: E bea timeout ka dimilisekonthe yeo e diri\u0161wago ge go t\u0161ewa kgokagano ya HTTP go t\u0161wa go HTTP connection manager. Go paledi\u0161a stale connection check go ka felelet\u0161a ka kaonafat\u0161o ye nnyane ya tshepedi\u0161o eup\u0161a go na le kotsi ya go hwet\u0161a pho\u0161o ya I/O ge go phethwa kgopelo godimo ga kgokagano yeo e tswalet\u0161wego ka lehlakoreng la seva.
httpclient_external_connmgr_connection_timeout=Httpclient connection manager bakeng sa dikgokagano t\u0161a ka ntle: E laola timeout go fihla ge kgokagano e hlomwa. Boleng bja zero bo ra gore timeout ga e diri\u0161we.
httpclient_external_connmgr_idle_reaper_connection_timeout=Httpclient connection manager idle reaper bakeng sa dikgokagano t\u0161a ka ntle: boleng bja timeout bjo bo diri\u0161wago ge go lekwa dikgokagano t\u0161e sa \u0161omego.
httpclient_external_connmgr_idle_reaper_sleep_interval=Httpclient connection manager idle reaper bakeng sa dikgokagano t\u0161a ka ntle: Palo ya nako (ka dimilisekonthe) yeo thread ya idle connection reaper ya http client connection manager e robalago magareng ga mo\u0161omo. 0 e ra gore thread ya reaper e timilwe.
httpclient_external_connmgr_max_host_connections=Httpclient connection manager bakeng sa dikgokagano t\u0161a ka ntle: E hlalosa palo ya godimo ya dikgokagano t\u0161e di dumelet\u0161wego ka peakanyo ya host ka nngwe.
httpclient_external_connmgr_max_total_connections=Httpclient connection manager bakeng sa dikgokagano t\u0161a ka ntle: E hlalosa palo ya godimo ya dikgokagano t\u0161e di dumelet\u0161wego ka kakaret\u0161o.
httpclient_external_connmgr_so_timeout=Httpclient connection manager bakeng sa dikgokagano t\u0161a ka ntle: Timeout ya boleng bja zero e hlathollwa bjalo ka timeout ya go se fele. Boleng bjo bo diri\u0161wa ge go se na socket timeout yeo e beilwego ka dipharamitha t\u0161a HTTP method.
httpclient_external_connmgr_tcp_nodelay=Httpclient connection manager bakeng sa dikgokagano t\u0161a ka ntle: E hlalosa ge e ba Nagle algorithm e swanet\u0161e go paledi\u0161wa go HTTP socket.
httpclient_external_connmgr_stale_connection_check=Httpclient connection manager bakeng sa dikgokagano t\u0161a ka ntle: E laola ge e ba stale connection check e swanet\u0161e go diri\u0161wa.
httpclient_convertd_so_timeout=Socket timeout ka dimilisekonthe bakeng sa convertd client. Ge e le 0, go ra gore ga go na timeout. Ge e le -1 goba e sa bewa, go ra gore go diri\u0161we timeout ya go bala ya kamehla ya connection manager.
httpclient_convertd_keepalive_connections=E hlalosa ge e ba HTTP keep-alive connections di swanet\u0161e go diri\u0161wa bakeng sa convertd client.
httpclient_soaphttptransport_retry_count=E hlalosa palo ya go leka gape ka morago ga go palelwa ga nakwana bakeng sa SOAP clients t\u0161eo di diri\u0161ago sehlopha sa SoapHttpTransport.
httpclient_soaphttptransport_so_timeout=Socket timeout ka dimilisekonthe bakeng sa SOAP clients t\u0161eo di diri\u0161ago sehlopha sa SoapHttpTransport.
httpclient_soaphttptransport_keepalive_connections=E hlalosa ge e ba HTTP keep-alive connections di swanet\u0161e go diri\u0161wa bakeng sa SOAP http transport.
ldap_starttls_required=Ge e ba starttls e nyakega go java ldap client ge e hloma dikgokagano go seva ya ldap ya Zimbra.
mailboxd_keystore_base=Keystore yeo e swanet\u0161ego go diri\u0161wa bakeng sa java cli application go di-node t\u0161a non-zimbra-store.
networkaddress_cache_ttl=Boleng bja property ya java.security.Security networkaddress.cache.ttl, bjo bo bewa ka property ya JVM system ya -Dsun.net.inetaddr.ttl. Palo ya metsotswana ya go cache lookup ya go atlega ya leina la host go ya go IP address go t\u0161wa tirelong ya maina.
out_of_disk_error_unix=Molaet\u0161a wa thapo ya IOException bakeng sa pho\u0161o ya go fela ga sekgoba sa disk go ditshepedi\u0161o t\u0161a Unix.
out_of_disk_error_windows=Molaet\u0161a wa thapo ya IOException bakeng sa pho\u0161o ya go fela ga sekgoba sa disk go Windows.
purge_initial_sleep_ms=Palo ya nako (ka dimilisekonthe) yeo purge thread e robalago ge e thoma pele e dira mo\u0161omo.
servlet_max_concurrent_http_requests_per_account = Palo ya godimo ya dikgopelo t\u0161a HTTP ka akhaonto pele ZimbraQoSFilter e emi\u0161a dikgopelo t\u0161e dingwe. E sepedi\u0161ana le ditemo\u0161o t\u0161a "Exceeded the max requests limit. Suspending..." ka go mailbox.log.
servlet_max_concurrent_requests_per_session=Palo ya godimo ya dikgopelo t\u0161a HTTP t\u0161a ka nako e tee ka HTTP session (0 e ra gore ga go na moedi). Phetogo e \u0161oma go tloga session e mpsha.
shared_mime_info_globs=Faele ya glob ya freedesktop.org shared-mime-info.
shared_mime_info_magic=Faele ya magic ya freedesktop.org shared-mime-info.
soap_response_buffer_size=Bogolo bja content buffer bakeng sa go romela dikarabo t\u0161a SOAP http. Ge bo sa bewa, diri\u0161a jetty default.
