#license notification email for exceeding usage count for feature
licenseFeaureOnHoldNotifierSubject = Temo\u0161o ya Tshepedi\u0161o ya Zimbra: mollwane wa t\u0161homi\u0161o ya dikarolo o fetilwe
licenseFeaureOnHoldNotifierBodyText=Palo ya diakhaonto t\u0161e di laesentshit\u0161wego e fihlet\u0161we goba e fetilwe bakeng sa dikarolo t\u0161e di latelago:\n{0}\nO ka fokot\u0161a t\u0161homi\u0161o ya badiri\u0161i ba gona goba wa oket\u0161a mollwane wa laesense ya karolo.\n\nGo oket\u0161a mollwane wa laesense ya karolo, hle ikgokaganye le Zimbra Sales go sales@zimbra.com.\nGo laola kabo ya dikarolo t\u0161a akhaonto, hle tsena go Potala ya Taolo.\n\nHle ela hloko t\u0161e di latelago:\n1. O tla t\u0161wela pele o amogela tsebi\u0161o ka mat\u0161at\u0161i a {1,number,integer} go tloga let\u0161at\u0161ing leo t\u0161homi\u0161o e fetilego mollwane ka lona.\n2. O ka se kgone go kgont\u0161ha karolo ye e diri\u0161it\u0161wego kudu bakeng sa diakhaonto dife goba dife.\n3. Ge o sa t\u0161ee kgato efe goba efe mabapi le karolo ye e diri\u0161it\u0161wego kudu, karolo yeo e tla thibelwa go badiri\u0161i gore e boele ka fase ga mollwane wo o laesentshit\u0161wego.\n\nDitumedi\u0161o,\nZimbra Support
licenseFeaureOnHoldNotifierBodyHtml=<div style="font-family:sans-serif;">Palo ya diakhaonto t\u0161e di laesentshit\u0161wego e fihlet\u0161we goba e fetilwe bakeng sa dikarolo t\u0161e di latelago:<br>{0}<br>O ka fokot\u0161a t\u0161homi\u0161o ya badiri\u0161i ba gona goba wa oket\u0161a mollwane wa laesense ya karolo.<br><br>Go oket\u0161a mollwane wa laesense ya karolo, hle ikgokaganye le Zimbra Sales go <b>sales@zimbra.com</b>.<br>Go laola kabo ya dikarolo t\u0161a akhaonto, hle tsena go Potala ya Taolo.<br><br>Hle ela hloko t\u0161e di latelago:<br>1. O tla t\u0161wela pele o amogela tsebi\u0161o ka mat\u0161at\u0161i a {1,number,integer} go tloga let\u0161at\u0161ing leo t\u0161homi\u0161o e fetilego mollwane ka lona.<br>2. O ka se kgone go kgont\u0161ha karolo ye e diri\u0161it\u0161wego kudu bakeng sa diakhaonto dife goba dife.<br>3. Ge o sa t\u0161ee kgato efe goba efe mabapi le karolo ye e diri\u0161it\u0161wego kudu, karolo yeo e tla thibelwa go badiri\u0161i gore e boele ka fase ga mollwane wo o laesentshit\u0161wego.<br><br>Ditumedi\u0161o,<br>Zimbra Support</div>

#send password expiry reminder email
passwordExpiryNotifierSubject = Phasewete ya gago e fela ka mat\u0161at\u0161i a {0}
passwordExpiryNotifierBodyText=Morategi {0},\n\nPhasewete ya akhaonto ya gago e fela ka mat\u0161at\u0161i a {1}, ka {2}.\n\nGo boloka phihlelelo ya gago go akhaonto ya gago, hle seta phasewete ya gago ka leswa pele ga let\u0161at\u0161i la go fela.\n\nO tla t\u0161wela pele o amogela ditsebi\u0161o let\u0161at\u0161i le let\u0161at\u0161i go fihlela phasewete e fetolwa goba e fela.\n\nYe ke tsebi\u0161o ya imeile ye e romet\u0161wego ka boitiri\u0161o.
passwordExpiryNotifierBodyHtml=<p>Morategi {0},</p><p>Phasewete ya akhaonto ya gago e fela ka <strong>mat\u0161at\u0161i a {1}</strong>, ka <strong>{2}</strong>.</p><p>Go boloka phihlelelo ya gago go akhaonto ya gago, hle seta phasewete ya gago ka leswa pele ga let\u0161at\u0161i la go fela.</p><p>O tla t\u0161wela pele o amogela ditsebi\u0161o let\u0161at\u0161i le let\u0161at\u0161i go fihlela phasewete e fetolwa goba e fela.</p><p>Ye ke tsebi\u0161o ya imeile ye e romet\u0161wego ka boitiri\u0161o.</p>

