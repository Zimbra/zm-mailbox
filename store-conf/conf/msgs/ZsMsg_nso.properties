zimbra_mysql_shutdown_timeout = Nako ya go leta gore tshepedi\u0161o ya lepokisi la poso ya MySQL/MariaDB e fele. Oket\u0161a nako ye ge mysql.server e t\u0161ea nako e telele kudu go tima tshepedi\u0161o.
zimbra_mysql_user = Leina la mo\u0161omi\u0161i la MySQL leo le swanet\u0161ego go diri\u0161wa go hlama/gona go fihlelela datapeisi le ditafola t\u0161a zimbra. Ye ke boleng bjo o ka bo fago go kgetho ya \u2018-u\u2019 ya lenaneo la mothalo wa taelo la \u2018mysql\u2019.
zimbra_mysql_password = Phasewete ya zimbra_mysql_user. E bolokilwe ka peakanyong ya selegae gore e diri\u0161we ke tiri\u0161o ya store go netefat\u0161a. Ge o nyaka go fetola phasewete ye, hle diri\u0161a lenaneo la zmmypasswd leo le tlago go fetola phasewete go MySQL le go peakanyo ya selegae ka bobedi.
zimbra_ldap_userdn = LDAP dn ye e diri\u0161wago go netefat\u0161a tiri\u0161o ya store ka LDAP.
zimbra_ldap_user = Leina la mo\u0161omi\u0161i la zimbra leo le diri\u0161wago go netefat\u0161a ka admin AuthRequest.
zimbra_ldap_password = Phasewete ya zimbra_ldap_userdn. E bolokilwe ka peakanyong ya selegae gore e diri\u0161we ke tiri\u0161o ya store go netefat\u0161a. Ge o nyaka go fetola phasewete ye, hle diri\u0161a lenaneo la zmldappasswd leo le tlago go fetola phasewete go LDAP le go peakanyo ya selegae ka bobedi.
zimbra_server_hostname = Leina le le beakant\u0161wego la seva ye. Go swanet\u0161e go ba le tseno ya \u2018server\u2019 ye e sepelelanago go LDAP - lebelela ditokomane bakeng sa taelo ya CreateServer ya lenaneo la zmprov.
zimbra_user = Mo\u0161omi\u0161i wa unix wa zimbra yo tshepedi\u0161o ya seva ya zimbra e swanet\u0161ego go feto\u0161et\u0161a ditokelo go yena ka morago ga go tlemaganya diport t\u0161e di nago le ditokelo.
