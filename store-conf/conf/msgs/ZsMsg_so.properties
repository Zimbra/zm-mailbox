licenseFeaureOnHoldNotifierSubject = Digniinta Nidaamka Zimbra: Xadka isticmaalka sifo(oyinka) waa la dhaafay
licenseFeaureOnHoldNotifierBodyText = Tirada akoonnada ee laysanka leh ayaa la gaaray ama la dhaafay sifooyinkan soo socda:\n{0}\nWaxaad yareyn kartaa isticmaalka isticmaaleyaasha jira ama waxaad kordhin kartaa xadka laysanka sifada.\n\nSi aad u kordhiso xadka laysanka sifada, fadlan la xiriir Zimbra Sales adigoo adeegsanaya sales@zimbra.com.\nSi aad u maamusho qoondaynta sifada ee akoonnada, fadlan soo gal Admin Portal.\n\nFadlan ogow waxyaabahan soo socda:\n1. Waxaad sii heli doontaa ogeysiiska muddo {1,number,integer} maalmood ah laga bilaabo taariikhda la dhaafay isticmaalka.\n2. Ma awoodi doontid inaad sifo si xad-dhaaf ah loo isticmaalay ugu shiddo wax akoon ah.\n3. Haddii aadan wax tallaabo ah ka qaadin sifada si xad-dhaaf ah loo isticmaalay, sifada waa laga demi doonaa isticmaaleyaasha si loogu soo celiyo xadka laysanka.\n\nSalaan,\nTaageerada Zimbra
licenseFeaureOnHoldNotifierBodyHtml = <div style="font-family:sans-serif;">Tirada akoonnada ee laysanka leh ayaa la gaaray ama la dhaafay sifooyinkan soo socda:<br>{0}<br>Waxaad yareyn kartaa isticmaalka isticmaaleyaasha jira ama waxaad kordhin kartaa xadka laysanka sifada.<br><br>Si aad u kordhiso xadka laysanka sifada, fadlan la xiriir Zimbra Sales adigoo adeegsanaya <b>sales@zimbra.com</b>.<br>Si aad u maamusho qoondaynta sifada ee akoonnada, fadlan soo gal Admin Portal.<br><br>Fadlan ogow waxyaabahan soo socda:<br>1. Waxaad sii heli doontaa ogeysiiska muddo {1,number,integer} maalmood ah laga bilaabo taariikhda la dhaafay isticmaalka.<br>2. Ma awoodi doontid inaad sifo si xad-dhaaf ah loo isticmaalay ugu shiddo wax akoon ah.<br>3. Haddii aadan wax tallaabo ah ka qaadin sifada si xad-dhaaf ah loo isticmaalay, sifada waa laga demi doonaa isticmaaleyaasha si loogu soo celiyo xadka laysanka.<br><br>Salaan,<br>Taageerada Zimbra</div>
passwordExpiryNotifierSubject = Eraygaaga sirta ahi wuxuu dhacayaa {0} maalmood gudahood
passwordExpiryNotifierBodyText = Gacaliye {0},\n\nErayga sirta ah ee akoonkaagu wuxuu dhacayaa {1} maalmood gudahood, taariikhdu markay tahay {2}.\n\nSi aad u sii haysato gelitaanka akoonkaaga, fadlan dib u deji eraygaaga sirta ah ka hor taariikhda uu dhacayo.\n\nWaxaad sii heli doontaa ogeysiisyo maalin kasta ilaa erayga sirta ah la beddelo ama uu dhacayo.\n\nTani waa ogeysiis iimayl oo otomaatig ah.
passwordExpiryNotifierBodyHtml = <p>Gacaliye {0},</p><p>Erayga sirta ah ee akoonkaagu wuxuu dhacayaa <strong>{1} maalmood gudahood</strong>, taariikhdu markay tahay <strong>{2}</strong>.</p><p>Si aad u sii haysato gelitaanka akoonkaaga, fadlan dib u deji eraygaaga sirta ah ka hor taariikhda uu dhacayo.</p><p>Waxaad sii heli doontaa ogeysiisyo maalin kasta ilaa erayga sirta ah la beddelo ama uu dhacayo.</p><p>Tani waa ogeysiis iimayl oo otomaatig ah.</p>
