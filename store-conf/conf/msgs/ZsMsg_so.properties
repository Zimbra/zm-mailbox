zimbra_mysql_shutdown_timeout = Muddada la sugayo in habka MySQL/MariaDB ee mailbox-ku uu istaago. Kordhi waqtiga sugitaanka haddii mysql.server uu waqti badan ku qaadanayo joojinta habka.
zimbra_mysql_user = Magaca isticmaalaha MySQL ee loo adeegsanayo abuurista ama gelitaanka keydadka xogta iyo jadwallada zimbra. Tani waa qiimaha aad siin lahayd ikhtiyaarka '-u' ee barnaamijka xariiqda-amarka ee 'mysql'.
zimbra_mysql_password = Erayga sirta ah ee zimbra_mysql_user. Waxaa lagu kaydiyaa local config si barnaamijka store-ku ugu adeegsado xaqiijinta. Haddii aad rabto inaad beddesho eraygan sirta ah, fadlan isticmaal barnaamijka zmmypasswd kaas oo beddeli doona erayga sirta ah MySQL iyo local config labadaba.
zimbra_ldap_userdn = LDAP dn-ga loo adeegsado xaqiijinta barnaamijka store-ka ee LDAP.
zimbra_ldap_user = Magaca isticmaalaha zimbra ee loo adeegsado xaqiijinta AuthRequest-ka maamulka.
zimbra_ldap_password = Erayga sirta ah ee zimbra_ldap_userdn. Waxaa lagu kaydiyaa local config si barnaamijka store-ku ugu adeegsado xaqiijinta. Haddii aad rabto inaad beddesho eraygan sirta ah, fadlan isticmaal barnaamijka zmldappasswd kaas oo beddeli doona erayga sirta ah LDAP iyo local config labadaba.
zimbra_server_hostname = Magaca loo qoondeeyay server-kan. Waa inuu LDAP ku jiraa gelin u dhiganta oo ah 'server' - la tasho dukumeentiyada amarka CreateServer ee barnaamijka zmprov.
zimbra_user = Isticmaalaha unix ee zimbra oo habka server-ka zimbra uu xuquuqaha ugu wareegayo ka dib marka uu ku xirmo dekedaha mudnaanta leh.
zimbra_uid = UID-ga unix ee zimbra oo habka server-ka zimbra uu xuquuqaha ugu wareegayo ka dib marka uu ku xirmo dekedaha mudnaanta leh.
zimbra_gid = GID-ga unix ee zimbra oo habka server-ka zimbra uu xuquuqaha ugu wareegayo ka dib marka uu ku xirmo dekedaha mudnaanta leh.
zimbra_log4j_properties = Wadada faylka properties-ka qaabaynta log4j.
zimbra_log4j_properties_watch = Muddada la socodka ee faylka properties-ka qaabaynta log4j, oo lagu cabbiro msec.
zimbra_attrs_directory = Galka ay ku jiraan faylasha *.xml ee qeexa naxwaha sifooyinka LDAP ee nidaamku adeegsado.
localized_msgs_directory = Galka faylasha fariimaha ee la turjumay.
localized_client_msgs_directory = Galka faylasha fariimaha macmiilka ee la turjumay.
skins_directory = Galka muuqaallada skins-ka.
zimbra_store_sweeper_max_age = Faylasha ka duqoobay tiradan daqiiqado ah si toos ah ayaa looga tirtiraa galka incoming ee store-ka.
zimbra_store_copy_buffer_size_kb = Hawlaha koobiyeenta faylku waxay adeegsadaan bufferro cabbirkan leh.
zimbra_mailbox_galsync_cache = Waxay dejisaa kaydka ugu badan ee shayga xiriirka mailbox-ka galsync. U deji qiime ugu yaraan la eg tirada shayada xiriirka ee mailbox-ka galsync.
zimbra_mailbox_manager_hardref_cache = Tirada ugu badan ee mailbox-yada lagu dhejinayo xusuusta ka hor inta uusan maareeyaha mailbox-ku oggolaan in laga nadiifiyo iyadoo la adeegsanayo SoftReference garbage collection.
zimbra_mailbox_active_cache = Cabbirka ugu badan ee kaydka gudaha ee LRU item ee mailbox marka ay jiraan fadhiyo firfircoon.
zimbra_mailbox_inactive_cache = Cabbirka ugu badan ee kaydka gudaha ee LRU item ee mailbox marka aanu lahayn fadhiyo firfircoon.
zimbra_mailbox_change_checkpoint_frequency = Inta jeer ee, iyadoo lagu cabbirayo tirada isbeddellada, qiimaha isbeddelka highwater ee ZIMBRA.MAILBOX.CHANGE_CHECKPOINT loogu qoro mailbox.
zimbra_index_elasticsearch_url_base = URL-ka saldhigga ah ee ElasticSearch REST API.
zimbra_index_threads = Cabbirka pool-ka thread-yada ee batch index.
zimbra_reindex_threads = Tirada ugu badan ee thread-yada loogu talagalay re-index. Thread-yada re-index lama geliyo pool.
zimbra_index_disable_perf_counters = Haddii uu false yahay, Lucene read iyo write IO waxaa la socda kormeerka waxqabadka Zimbra. Qiime true ah wuxuu damiyaa kormeerka Lucene IO.
zimbra_index_max_readers = Tirada ugu badan ee IndexReaders isku mar shaqayn kara.
zimbra_index_max_writers = Tirada ugu badan ee IndexWriters isku mar shaqayn kara.
zimbra_index_reader_cache_size = Tirada ugu badan ee IndexReaders ee kaydka search index.
zimbra_index_reader_cache_ttl = Haddii uu ka caajiso qiimahan ilbiriqsiyo ka badan, ka saar IndexReader-ka kaydka.
zimbra_index_deferred_items_failure_delay = Guuldarro ka dib, dib-u-dhaca ugu yar ee ilbiriqsiyo u dhexeeya isku dayada lagu nadiifinayo safka shayada aan la index-gareyn ee deferred-ka ah.
zimbra_index_lucene_max_terms_per_query = Deji tirada ugu badan ee terms-ka loo oggol yahay weydiinkiiba.
zimbra_index_max_transaction_bytes = Marka hawlgallada index-ga loo ururinayo transaction Mailbox ah, tani waa cabbirka guud ee ugu badan ee shayada aan u oggolaaneyno hal transaction.
zimbra_index_max_transaction_items = Marka hawlgallada index-ga la ururinayo, tani waa tirada ugu badan ee mail_items aan u oggolaaneyno hal transaction.
zimbra_index_max_pending_deletes = Tirada ugu badan ee pending index deletes ka hor dib-u-soo-celinta booska disk-ga.
zimbra_index_lucene_merge_policy = true si loo isticmaalo LogDocMergePolicy, false si loo isticmaalo LogByteSizeMergePolicy. LogDocMergePolicy waxay doorataa segments-ka la isku darayo iyadoo ku salaynaysa tirada dukumeentiyada. LogByteSizeMergePolicy waxay doorataa segments-ka la isku darayo iyadoo ku salaynaysa cabbirkooda.
zimbra_index_lucene_min_merge = Waxay dejisaa cabbirka ugu yar ee isku-darka Lucene oo lagu cabbiro Documents ama KB, iyadoo ku xiran merge policy-ga lagu qeexay zimbra_index_lucene_merge_policy.
zimbra_index_lucene_max_merge = Waxay dejisaa cabbirka ugu badan ee isku-darka Lucene oo lagu cabbiro Documents ama KB, iyadoo ku xiran merge policy-ga lagu qeexay zimbra_index_lucene_merge_policy. Qiimahani wuxuu go'aamiyaa segment-ka ugu weyn ee lala midayn karo segments kale.
zimbra_index_lucene_merge_factor = Imisa jeer ayay tusmooyinka segment-ka isu daraan addDocument() awgeed. Qiimayaal yaryar waxay isticmaalaan RAM yar inta indexing-ku socdo, raadintuna way dhakhso badan tahay, balse xawaaraha indexing-ku wuu gaabiyaa. Qiimayaal waaweyn waxay isticmaalaan RAM badan inta indexing-ku socdo, raadintuna way gaabis badan tahay, halka indexing-kuna uu dhakhso badan yahay. Qiimayaal waaweyn (>10) waxay ugu habboon yihiin abuurista batch index, qiimayaal yaryarna (<10) tusmooyinka si is-dhexgal ah loo dayactiro.
zimbra_index_lucene_term_index_divisor = Waxay hoos ka muunadaysaa terms-ka la index-gareeyay ee lagu shubayo RAM. Adigoo tan u dejinaya qiime > 1 waxaad yarayn kartaa isticmaalka xusuusta, balse waxaad kordhinaysaa daahitaanka marka la soo rarayo macluumaadka record-ka ee term.
zimbra_index_lucene_use_compound_file = true haddii segment cusub oo Lucene ah uu isticmaali doono compound file format. http://wiki.apache.org/lucene-java/ImproveIndexingSpeed wuxuu leeyahay compound file format waa in la damiyaa si waxqabadka loo hagaajiyo, balse tani si weyn bay u kordhinaysaa tirada file descriptor-rada. File descriptor-radu way dhammaan karaan haddii zimbra_index_lucene_merge_factor uu weyn yahay.
zimbra_index_lucene_max_buffered_docs = Tirada ugu yar ee dukumeentiyada loo baahan yahay ka hor inta aan dukumeentiyada ku jira xusuusta buffer-gareysan loo daadinin segment cusub ahaan. Qiimayaal waaweyn guud ahaan waxay bixiyaan indexing dhakhso badan.
zimbra_index_lucene_ram_buffer_size_kb = Lucene Max Buffered RAM oo lagu cabbiro KB.
zimbra_index_lucene_io_impl = Hirgelinta Lucene FSDirectory ee loo adeegsado indexing IO. Qiimayaasha suurtagalka ah waa nio - adeegso NIOFSDirectory. Waxay adeegsataa positional io ee FileChannel-ka java.nio marka wax la akhrinayo si looga fogaado is-waafajinta marka laga akhrinayo isla faylka. mmap - adeegso MMapDirectory. Waxay adeegsataa memory-mapped IO marka wax la akhrinayo. Waa doorasho fiican haddii ay jirto xusuus dalwaddii badan marka loo eego cabbirka index-ga. simple - adeegso SimpleFSDirectory. Waxay adeegsataa java.io.RandomAccessFile. Waxay leedahay waxqabad liita oo isku mar ah maadaama ay is-waafajin samayso marka thread-yo badan ay isla faylka akhriyaan. Haddii aan qiime la bixin, FSDirectory ayaa dooran doonta hirgelinta ugu habboon deegaanka.
zimbra_index_rfc822address_max_token_count = Tirada ugu badan ee token-yada cinwaannada ku jira RFC822 address token stream. Xadkani wuxuu khuseeyaa dhammaan header-rada FROM, TO, iyo CC ee iimayllada, dhammaan cinwaannada iimaylka ee Xiriirrada, iyo goobta Creator ee Dukumeentiyada.
zimbra_index_rfc822address_max_token_length = Dhererka ugu badan ee token-ka cinwaan ku jira RFC822 address token stream. Xadkani wuxuu khuseeyaa dhammaan header-rada FROM, TO, iyo CC ee iimayllada, dhammaan cinwaannada iimaylka ee Xiriirrada, iyo goobta Creator ee Dukumeentiyada.
zimbra_index_wildcard_max_terms_expanded = Tirada ugu badan ee wildcard expansions ee term kasta oo gaar ah oo ku jira weydiinta.
zimbra_galsync_index_reader_cache_size = Tirada ugu badan ee IndexReaders ee kaydka GAL search index. Lucene index-ga akoonka GAL sync si gooni ah ayaa loo kaydiyaa, mana laha saarid toos ah.
zimbra_spam_report_queue_size = Codsiyada Junk/Not Junk Msg/ConvActionRequests, cabbirkan safka ayaa xaddidaya server workqueue-ga farsamaynta gudbinnada.
zimbra_throttle_op_concurrency = Liis ay kala soocaan commas oo ka kooban qiimayaasha concurrency ee mid kasta oo ka mid ah 5-ta heer ee mudnaanta, laga bilaabo heerka ugu sarreeya ilaa heerka ugu hooseeya.
zimbra_im_chat_flush_time = Inta jeer ee ilbiriqsiyo ee sheekooyinka IM ee furan loogu qoro store-ka.
zimbra_im_chat_close_time = Muddo intee le'eg oo ilbiriqsiyo ah ayuu server-ku sugi doonaa ka hor xiritaanka fadhiyada IM chat ee fadhiya.
zimbra_http_originating_ip_header = HTTP header-ka la eegayo si loo go'aamiyo cinwaanka IP-ga asalka ah ee macmiilka.
zimbra_session_limit_imap = Tirada ugu badan ee faylasha IMAP ee hal isticmaale isku mar u furan kara.
zimbra_session_limit_admin = Tirada ugu badan ee fadhiyada admin SOAP ee hal isticmaale isku mar u furan kara.
zimbra_session_limit_soap = Tirada ugu badan ee fadhiyada soap ee firfircoon halkii akoon. Si taxaddar leh u kordhi qiimahan si looga fogaado khaladaadka "Too many SOAP sessions" ee mailbox.log.
zimbra_session_limit_sync = Tirada ugu badan ee dhageystayaasha sync halkii fadhi ee ActiveSync. Si taxaddar leh u kordhi qiimahan si looga fogaado khaladaadka "Too many SYNCLISTENER sessions" ee sync.log.
zimbra_session_timeout_soap = Waqtiga fadhiga aan firfircoonayn ee ilbiriqsiyo loogu talagalay fadhiyada SOAP.
zimbra_session_max_pending_notifications = Tirada ugu badan ee ogeysiisyada sugaya ee lagu safin karo fadhi SOAP ah ka hor inta aan safka la nadiifin oo macmiilka loo sheegin in xaaladdiisu aanay sax ahayn.
zimbra_converter_enabled_uuencode = In decoder-ka UUENCODE la socodsiiyo marka fariimaha laga imanaya store-ka la fasirayo iyo in kale.
zimbra_converter_enabled_tnef = In decoder-ka TNEF la socodsiiyo marka fariimaha laga imanaya store-ka la fasirayo iyo in kale.
zimbra_converter_depth_max = Qoto-dheeraanta recursive ee qaybaha MIME oo ka hooseysa taas oo converters-ku aanay wax tallaabo ah ka qaadayn.
zimbra_ssl_enabled = In ssl keystore la raro iyo in kale.
stats_img_folder = Galka lagu kaydiyo sawirrada tirakoobka ee la soo saaray.
ldap_host = Martigeliyaha LDAP ee la adeegsanayo. Waa laga tagay - fadlan halkii ka isticmaal ldap_url.
ldap_log_level = Heerka diiwaangelinta LDAP.
ldap_port = Dekedda LDAP ee la adeegsanayo. Waa laga tagay - fadlan halkii ka isticmaal ldap_url.
ldap_url = Liiska server-rada LDAP ee server-kan isticmaalo.
ldap_master_url = URL-ka LDAP master-ka.
ldap_is_master = Martigeliyahan ma yahay server-ka master ee LDAP?
ldap_root_password = Erayga sirta ah ee rootdn ee slapd.conf ee LDAP. Si ku habboon, inta lagu jiro bilaabista LDAP eray sir ah oo aan kala sooc lahayn ayaa la abuuraa, waxaana lagu kaydiyaa local config iyo slapd.conf. Haddii aad rabto inaad beddesho eraygan sirta ah, fadlan isticmaal barnaamijka zmldappasswd kaas oo beddeli doona erayga sirta ah slapd.conf iyo local config labadaba.
ldap_connect_timeout = Millisekannada ka dib isku dayga xiriirka la joojinayo.
ldap_read_timeout = Millisekannada ka dib isku dayga akhriska la joojinayo.
ldap_deref_aliases = In aliases-ka la raaco inta la raadinayo ama lagu xidhayo directory dibadeed. Qiimayaasha ansaxda ahi waa: always, never, finding, searching.
ldap_connect_pool_master = In JNDI connection pooling loo isticmaalo LDAP master iyo in kale.
ldap_connect_pool_debug = In la debug-gareeyo LDAP connection pooling iyo in kale.
ldap_connect_pool_initsize = Tirada bilowga ah ee xiriirrada LDAP ee firfircoon ee loo kordhinayo.
ldap_connect_pool_maxsize = Tirada ugu badan ee isku-xirro LDAP oo firfircoon iyo kuwo fadhiya ee la oggol yahay.
ldap_connect_pool_prefsize = Tirada la doorbidayo ee isku-xirrada LDAP - dejinta maxsize iyo prefsize isla qiime waxay ku haynaysaa kaydka isku-xirrada cabbir go'an.
ldap_connect_pool_timeout = Millisekannada waqtiga fadhiidnimada ka hor inta aan isku-xir fadhiya laga saarin kaydka.
ldap_connect_pool_health_check_on_checkout_enabled = In hubinta caafimaadka kaydka isku-xirrada la wici doono mar kasta oo isku-xir loo soo qaadanayo isticmaal. Haddii hubinta caafimaadka OnCheckout la daaro, hubinta caafimaadka ee gadaal ka socota ee xilliyeed waa la naafoynayaa.
ldap_connect_pool_health_check_interval_millis = Dhererka waqtiga ee millisekanno ahaan u dhexeeya hubinnada caafimaadka ee xilliyeed ee gadaal ka socota ee lagu sameeyo isku-xirrada la heli karo ee kaydka isku-xirrada.
ldap_connect_pool_health_check_max_response_time_millis = Muddada ugu badan ee millisekanno ahaan loo oggolaanayo in jawaabta hubinta caafimaadku uga soo noqoto server-ka LDAP.
ldap_replication_password = Erayga sirta ah ee uu isticmaalo isticmaalaha syncrepl si uu isu xaqiijiyo ldap master-ka.
ldap_postfix_password = Erayga sirta ah ee postfix u isticmaalo inuu isu xaqiijiyo LDAP.
ldap_amavis_password = Erayga sirta ah ee amavis u isticmaalo inuu isu xaqiijiyo LDAP.
ldap_starttls_supported = In server-ka LDAP uu taageero hawlgalka startTLS.
ldap_require_tls = In TLS looga baahan yahay macaamiisha LDAP.
ldap_cache_account_maxsize = Tirada ugu badan ee walxaha akoonnada ah ee lagu kaydinayo kaydka.
ldap_cache_account_maxage = Da'da ugu badan ee walxaha akoonnada ee kaydka ku jira, daqiiqado ahaan.
ldap_cache_cos_maxsize = Tirada ugu badan ee walxaha COS ee lagu kaydinayo kaydka.
ldap_cache_cos_maxage = Da'da ugu badan ee walxaha COS ee kaydka ku jira, daqiiqado ahaan.
ldap_cache_domain_maxsize = Tirada ugu badan ee walxaha domain-ka ee lagu kaydinayo kaydka.
ldap_cache_domain_maxage = Da'da ugu badan ee walxaha domain-ka ee kaydka ku jira, daqiiqado ahaan.
ldap_cache_mime_maxage = Da'da ugu badan, daqiiqado ahaan, ee walxaha MIME ee kaydka ku jira.
ldap_cache_server_maxsize = Tirada ugu badan ee walxaha server-ka ee lagu kaydinayo kaydka.
ldap_cache_server_maxage = Da'da ugu badan ee walxaha kooxaha ee kaydka ku jira, daqiiqado ahaan.
ldap_cache_share_locator_maxsize = Tirada ugu badan ee walxaha akoonnada ee kaydka gelinta magacaysan.
ldap_cache_share_locator_maxage = TTL-ga kaydka gelinta magacaysan, daqiiqado ahaan.
ldap_cache_timezone_maxsize = Tirada ugu badan ee walxaha aagga waqtiga ee lagu kaydinayo kaydka.
ldap_cache_zimlet_maxsize = Tirada ugu badan ee walxaha Zimlet ee lagu kaydinayo kaydka.
ldap_cache_zimlet_maxage = Da'da ugu badan ee walxaha Zimlet ee kaydka ku jira, daqiiqado ahaan.
ldap_cache_custom_dynamic_group_membership_maxage_ms = Da'da ugu badan ee millisekanno ahaan loogu kaydinayo kooxaha firfircoon ee akoonku xubin ka yahay, kuwaas oo xubinnimadooda lagu go'aamiyo MemberURL gaar ah.
csrf_filter_domain_allowed_ref_hosts_max_size = Tirada ugu badan ee gelinnada domain-ka ee ku jira kaydka allowedRefererHosts ee domain-kiiba ee CsrfFilter. Haddii qalad ka dhaco falanqaynta, waxay dib ugu noqotaa ldap_cache_domain_maxsize.
csrf_filter_domain_allowed_ref_hosts_cache_expiry_mins = Da'da ugu badan ee gelinnada ku jira kaydka allowedRefererHosts ee domain-kiiba ee CsrfFilter, daqiiqado ahaan. Marka uu dhaco waqtigu, gelintu waa la saaraa waxaana LDAP dib looga soo raraa codsiga xiga. Haddii qalad ka dhaco falanqaynta, waxay dib ugu noqotaa 60 daqiiqo.
mysql_directory = Goobta rakibidda MySQL.
mysql_data_directory = Galka ay tahay in xogta MySQL ku jirto.
mysql_errlogfile = Diiwaanka khaladaadka ee MySQL/MariaDB.
mysql_socket = Jidka socket-ka MySQL ee ay isticmaalaan qalabka khadka amarka ee MySQL.
mysql_pidfile = Faylka lagu kaydiyo aqoonsiga habraaca MySQL.
mysql_mycnf = Jidka my.cnf, oo ah faylka dejimaha MySQL.
mysql_bind_address = Interface-ka ku yaal martigeliyahan ee MySQL ku xirmi doono.
mysql_port = Lambarka dekedda ee ay tahay in server-ka MySQL dhegeysto.
mysql_root_password = Erayga sirta ah ee isticmaalaha gudaha ku jira ee 'root' ee MySQL, waana inaan lagu khaldin gelitaanka root ee UNIX. Si sahlan awgeed, inta lagu jiro diyaarinta bilowga ah ee keydka xogta waxaa la abuuraa eray sir ah oo aan kala sooc lahayn, waxaana lagu kaydiyaa dejimaha maxalliga ah iyo MySQL. Haddii aad rabto inaad beddesho eraygan sirta ah, fadlan isticmaal barnaamijka zmmypasswd kaas oo beddeli doona erayga sirta ah labadaba MySQL iyo dejimaha maxalliga ah.
mysql_memory_percent = Boqolleyda xusuusta nidaamka ee ay tahay in mysql isticmaasho. Qiimahan halkan ayaa loogu kaydiyaa isticmaalka barnaamijka zmmycnf. Beddelidda dejintan isla markiiba kama muuqato server-ka MySQL. Si isdaba-joog taxaddar leh ah, waa inaad mar kale soo saartaa my.cnf oo aad dib u bilowdaa server-ka MySQL si isbeddelku u dhaqan galo.
mysql_innodb_log_buffer_size = Wixii ku saabsan innodb_log_buffer_size, la tasho dukumeentiyada MySQL. Qiimahan halkan ayaa loogu kaydiyaa isticmaalka barnaamijka zmmycnf. Beddelidda dejintan isla markiiba kama muuqato server-ka MySQL. Si taxaddar badan leh, waa inaad mar kale soo saartaa my.cnf oo aad dib u bilowdaa server-ka MySQL si isbeddelku u dhaqan galo.
mysql_innodb_log_file_size = Wixii ku saabsan innodb_log_file_size, la tasho dukumeentiyada MySQL. Qiimahan halkan ayaa loogu kaydiyaa isticmaalka barnaamijka zmmycnf. Beddelidda dejintan isla markiiba kama muuqato server-ka MySQL. Si taxaddar badan leh, waa inaad mar kale soo saartaa my.cnf oo aad dib u bilowdaa server-ka MySQL si isbeddelku u dhaqan galo.
mysql_sort_buffer_size = Wixii ku saabsan sort_buffer_size, la tasho dukumeentiyada MySQL. Qiimahan halkan ayaa loogu kaydiyaa isticmaalka barnaamijka zmmycnf. Beddelidda dejintan isla markiiba kama muuqato server-ka MySQL. Si taxaddar badan leh, waa inaad mar kale soo saartaa my.cnf oo aad dib u bilowdaa server-ka MySQL si isbeddelku u dhaqan galo.
mysql_read_buffer_size = Wixii ku saabsan read_buffer_size, la tasho dukumeentiyada MySQL. Qiimahan halkan ayaa loogu kaydiyaa isticmaalka barnaamijka zmmycnf. Beddelidda dejintan isla markiiba kama muuqato server-ka MySQL. Si taxaddar badan leh, waa inaad mar kale soo saartaa my.cnf oo aad dib u bilowdaa server-ka MySQL si isbeddelku u dhaqan galo.
mysql_backup_retention = Tirada noocyada kaydka nuqulka keydka xogta mysql ee la sii haynayo.
antispam_mysql_enabled = U isticmaal keydka xogta mysql antispam-ka. Sida caadiga ah waa False.
antispam_backup_retention = Tirada noocyada kaydka nuqulka keydka xogta antispam-ka ee la sii haynayo.
derby_properties = Jidka faylka guryaha dejimaha ee derby.
imap_max_consecutive_error = Haddii uu ka weyn yahay 0, jooji isku-xirka IMAP haddii la gaaro qiimaha imap_max_consecutive_error.
imap_inactive_session_cache_size = Ehcache: tirada ugu badan ee gelinnada kaydka IMAP ee aan firfircoonayn ee disk-ga ku jira ka hor saarista.
imap_use_ehcache = Haddii ay True tahay, u isticmaal Ehcache kaydinta kulannada IMAP. Haddii kale, isticmaal kaydka disk-ga.
imap_write_timeout = Deji waqtiga goynta qorista kulanka IMAP (nio).
imap_write_chunk_size = Cabbirka bytes-ka ee keydka qorista IMAP.
imap_thread_keep_alive_time = Muddada caadiga ah, ilbiriqsiyo ahaan, ee dunta IMAP.
imap_throttle_ip_limit = Haddii uu ka weyn yahay 0, tirada ugu badan ee codsiyada IMAP ilbiriqsigii halkii IP.
imap_throttle_acct_limit = Haddii uu ka weyn yahay 0, tirada ugu badan ee codsiyada IMAP ilbiriqsigii halkii akoon.
imap_suggested_batch_copy_size = Tirada fariimaha la farsameynayo dufcad kasta inta lagu jiro hawlgallada IMAP COPY.
imap_in_progress_response_thread_pool_size = Tirada ugu badan ee dunta ku jirta kaydka dirista jawaabta InProgress ee macaamilka.
imap_in_progress_response_thread_keep_alive = Waqtiga ilbiriqsiyada ah ee dunta nool lagu haynayo ka hor inta aan la joojin.
imap_ehcache_heap_size = Tirada ugu badan ee gelinnada kaydka IMAP ee lagu kaydiyo heerka heap ee Ehcache.
imap_ehcache_skip_large_folder = Waxay ka booddaa kaydinta galalka IMAP ee waaweyn gudaha Ehcache marka la daaro.
imap_ehcache_folder_max_message_count = Xadka tirada fariimaha ee ka sarreeya kaas oo galalka IMAP aan loogu kaydin Ehcache. 
nio_imap_enabled = Haddii ay True tahay, daar Jetty non-blocking IO ee IMAP.
nio_pop3_enabled = Haddii ay True tahay, daar Jetty non-blocking IO ee POP3.
postfix_mail_owner = postfix_mail_owner
postfix_setgid_group = postfix_setgid_group
postfix_version = postfix_version
mailboxd_directory = Goobta rakibidda mailboxd.
mailboxd_java_heap_size = Tirada megabytes-ka loo isticmaali doono cabbirka ugu badan ee Java heap (-Xmx) ee JVM-ka wado Mailboxd.
mailboxd_java_heap_new_size_percent = Boqolleyda cabbirka Java heap ee loo isticmaali doono young generation-ka (-Xmn) ee JVM-ka wado Mailboxd.
mailboxd_java_options = Ikhtiyaarrada JVM ee la isticmaalayo marka la bilaabayo Mailboxd.
mailboxd_pidfile = Faylka lagu kaydiyo aqoonsiga habraaca JVM-ka Mailboxd.
mailboxd_keystore = Goobta faylka xogta keystore.
mailboxd_keystore_password = Erayga sirta ah ee lala isticmaalayo keystore-ka KeyManager.
mailboxd_truststore = Goobta faylka xogta truststore.
mailboxd_truststore_password = Erayga sirta ah ee lala isticmaalayo keystore-ka TrustManager.
client_ssl_truststore = Goobta faylka xogta truststore ee loo isticmaalo xaqiijinta SSL ee macaamilka.
client_ssl_truststore_password = Erayga sirta ah ee lala isticmaalayo keystore-ka TrustManager SSL ee macaamilka.
mailboxd_output_file = Faylka loo weecinayo stdout iyo stderr ee server-ka.
mailboxd_output_rotate_interval = Muddada, ilbiriqsiyo ahaan, ee faylka wax-soo-saarka mailboxd la rogrogo. Haddii <= 0, wax rogrogin ah lama sameeyo.
mailboxd_thread_stack_size = Cabbirka stack-ga dunta ee Mailboxd
ssl_allow_untrusted_certs = Haddii ay True tahay, oggolow shahaadooyinka SSL ee is-saxiixan.
zimlet_directory = Jidka Zimlet-yada la rakibay.
calendar_outlook_compatible_allday_events = Adeegso dhacdooyin maalinta oo dhan ah oo la jaanqaadaya Outlook.  Sida caadiga ah waa False.
calendar_entourage_compatible_timezones = Ku qor calaamadaha xigashada halbeegga TZID ee guryaha iCalendar, si looga gudbo ciladda ku jirta MS Entourage. True ayaa ah kan caadiga ah.
calendar_ics_import_full_parse_max_size = Inta lagu jiro soo-dejinta ics, adeegso parser-ka buuxa haddii cabbirka ics uu ka yar yahay ama la mid yahay tan; faylasha ics ee ka waaweyn waxaa lagu fasiro callback parser oo aan oggolaan tixraacyo horudhac ah oo ku socda VTIMEZONE TZID
calendar_canonical_tzid = Aqoonsiga aagga waqtiga ee lagu soo celinayo TimeZone.getCanonicalID(). Qiimayaasha suurtagalka ah: "olson","windows","java". Sida caadiga ah waa "windows".
calendar_cache_enabled = Daar kaydka kalandarka.  Sida caadiga ah waa False.
calendar_cache_directory = Tusmada salka u ah faylasha kaydka kalandarka
calendar_cache_lru_size = Cabbirka LRU ee kaydka xasuusta.  Ku kaydi xasuusta tiradan galalka kalandarka.
calendar_cache_range_month_from = Bisha bilowga ee xadka la kaydiyey.  0 waxay ka dhigan tahay bisha hadda, -1 waxay ka dhigan tahay bishii hore, iwm.
calendar_cache_range_months = Tirada bilaha ee xadka la kaydiyey
krb5_keytab = Goobta faylka keytab ee Zimbra Kerberos 5
krb5_debug_enabled = Daarista qalad-raadinta Kerberos
zimbra_mtareport_max_hosts = Tirada ugu badan ee host-yada lagu darayo warbixinnada maalinlaha ah ee MTA ee uu sameeyo zmdailyreport.
zimbra_mtareport_max_recipients = Tirada qaataha lagu taxayo warbixinnada maalinlaha ah ee MTA.
zimbra_mtareport_max_senders = Tirada dirayaasha lagu taxayo warbixinnada maalinlaha ah ee MTA.
zimbra_mtareport_max_users = Tirada ugu badan ee isticmaalayaasha lagu darayo warbixinnada maalinlaha ah ee MTA ee uu sameeyo zmdailyreport.
zimbra_auth_always_send_refer = Mar walba ku soo celi calaamadda <refer> jawaabta auth si loogu qasbo macmiilka dib-u-wareejin.
zimbra_admin_service_port = Dekedda maamulka ee default/bootstrap.
zimbra_admin_service_scheme = Qaabka borotokoolka maamulka ee default/bootstrap.
zimbra_mail_service_port = Dekedda iimaylka ee caadiga ah
zimbra_zmprov_default_to_ldap = In zmprov si caadi ah ugu xirmo LDAP ama SOAP.
zimbra_zmprov_default_soap_server = Seerfarka SOAP ee caadiga ah ee uu zmprov ku xirmayo
zmprov_safeguarded_attrs = Liis ay hakadyo kala saaraan oo ka kooban sifooyinka provisioning-ka ee leh qiimayaal badan oo u baahan in laga ilaaliyo beddelid
zmprov_tmp_directory = Tusmo ku meel gaar ah oo uu zmprov ugu qoro faylal qiimayaasha sifooyinka binary-ga.
zimbra_mailbox_groups = Tirada kooxaha mailbox ee loo qaybiyo mailbox-yada cusub.
