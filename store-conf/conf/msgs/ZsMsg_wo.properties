#license notification email for exceeding usage count for feature
licenseFeaureOnHoldNotifierSubject = Artu System Zimbra: limiti j\u00ebfandikoo Feature(s) weesu na
licenseFeaureOnHoldNotifierBodyText=Limu kompt yi \u00f1u maye woon jot na walla wees na ngir features yii:\n{0}\nM\u00ebn nga w\u00e0\u00f1\u00f1i j\u00ebfandikoo j\u00ebfandikukat yi fi nekk walla yokk limiti lis\u00ebnsu feature bi.\n\nNgir yokk limiti lis\u00ebnsu feature bi, jokkool Zimbra Sales ci sales@zimbra.com.\nNgir saytu s\u00e9ddale feature ci kompt yi, duggal ci Admin Portal bi.\n\nNga xam lii:\n1. Dinga kontine a jot y\u00ebgle bi diir {1,number,integer} fan j\u00f3g ci b\u00e9su j\u00ebfandikoo bi weesoo.\n2. Doo m\u00ebn a doxal feature bi \u00f1u j\u00ebfandikoo lu \u00ebpp ci benn kompt.\n3. Su fekkee ne defoowul dara ci feature bi \u00f1u j\u00ebfandikoo lu \u00ebpp, dina\u00f1u ko fagaru ci j\u00ebfandikukat yi ngir delloo ko ci limiti lis\u00ebns bi.\n\nAk j\u00e0mm,\nZimbra Support
licenseFeaureOnHoldNotifierBodyHtml=<div style="font-family:sans-serif;">Limu kompt yi \u00f1u maye woon jot na walla wees na ngir features yii:<br>{0}<br>M\u00ebn nga w\u00e0\u00f1\u00f1i j\u00ebfandikoo j\u00ebfandikukat yi fi nekk walla yokk limiti lis\u00ebnsu feature bi.<br><br>Ngir yokk limiti lis\u00ebnsu feature bi, jokkool Zimbra Sales ci <b>sales@zimbra.com</b>.<br>Ngir saytu s\u00e9ddale feature ci kompt yi, duggal ci Admin Portal bi.<br><br>Nga xam lii:<br>1. Dinga kontine a jot y\u00ebgle bi diir {1,number,integer} fan j\u00f3g ci b\u00e9su j\u00ebfandikoo bi weesoo.<br>2. Doo m\u00ebn a doxal feature bi \u00f1u j\u00ebfandikoo lu \u00ebpp ci benn kompt.<br>3. Su fekkee ne defoowul dara ci feature bi \u00f1u j\u00ebfandikoo lu \u00ebpp, dina\u00f1u ko fagaru ci j\u00ebfandikukat yi ngir delloo ko ci limiti lis\u00ebns bi.<br><br>Ak j\u00e0mm,<br>Zimbra Support</div>

