zimbra_mailbox_manager_hardref_cache = Limu mailbox yi g\u00ebna bari \u00f1uy t\u00e9ye ci memuwaar bala mailbox manager bi t\u00e0mbali di may \u00f1u far leen jaarale ko ci SoftReference garbage collection.
zimbra_mailbox_active_cache = R\u00ebyaay bu g\u00ebna bari bu cache item LRU bu mailbox bi ci biir su amee ay session yu dox.
zimbra_mailbox_inactive_cache = R\u00ebyaay bu g\u00ebna bari bu cache item LRU bu mailbox bi ci biir su amul ay session yu dox.
zimbra_mailbox_change_checkpoint_frequency = Ndawtal bi, ci limu coppite yi, buy bind njari\u00f1u coppite highwater ZIMBRA.MAILBOX.CHANGE_CHECKPOINT bu mailbox bi.
zimbra_index_elasticsearch_url_base = URL bu cosaan bu ElasticSearch REST API.
zimbra_index_threads = R\u00ebyaayu poolu thread ngir batch index
zimbra_reindex_threads = Limu thread yi g\u00ebna bari ngir re-index. Thread yu re-index bokku\u00f1u ci pool.
zimbra_index_disable_perf_counters = Su dee false, Zimbra performance monitoring dina topp j\u00e0ng ak bind I/O bu Lucene. Njari\u00f1 bu true dafay tax ba monitoring I/O bu Lucene doxul.
zimbra_index_max_readers = Limu IndexReader yi g\u00ebna bari \u00f1uy dox bennoon
zimbra_index_max_writers = Limu IndexWriter yi g\u00ebna bari \u00f1uy dox bennoon
zimbra_index_reader_cache_size = Limu IndexReader yi g\u00ebna bari ci cache bu indexu seet bi
zimbra_index_reader_cache_ttl = Bu nekk rekk g\u00ebn a y\u00e0gg njari\u00f1 bii, ci segond, dindi IndexReader bi ci cache bi.
zimbra_index_deferred_items_failure_delay = Gannaaw benn laqu, mooy y\u00e0gg bu n\u00e9ew, ci segond, diggante j\u00e9em yi \u00f1uy dalal queue bu ay item yu \u00f1u indexeewul.
zimbra_index_lucene_max_terms_per_query = Defal limu term yi g\u00ebna bari \u00f1u may ci benn query.
zimbra_index_max_transaction_bytes = Bu \u00f1uy dajale j\u00ebfi index ci transaction bu Mailbox, r\u00ebyaayu item yi \u00f1u boole g\u00ebna bari \u00f1u may ci benn transaction.
zimbra_index_max_transaction_items = Bu \u00f1uy dajale j\u00ebfi index, limu mail_item yi g\u00ebna bari \u00f1u may ci benn transaction.
zimbra_index_max_pending_deletes = Limu index delete yi \u00f1uy xaar g\u00ebna bari bala \u00f1uy delloo b\u00e9rabu disk bi.
zimbra_index_lucene_merge_policy = true ngir j\u00ebfandikoo LogDocMergePolicy, false ngir j\u00ebfandikoo LogByteSizeMergePolicy. LogDocMergePolicy di tann segment yi \u00f1uy boole jaarale ko ci limu dokimaa yi. LogByteSizeMergePolicy di tann segment yi \u00f1uy boole jaarale ko ci r\u00ebyaayam.
zimbra_index_lucene_min_merge = Moo taxawal r\u00ebyaayu boole bu Lucene g\u00ebna n\u00e9ew ci Documents walla KB, jaarale ko ci merge policy bi \u00f1u wax ci zimbra_index_lucene_merge_policy.
zimbra_index_lucene_max_merge = Moo taxawal r\u00ebyaayu boole bu Lucene g\u00ebna bari ci Documents walla KB, jaarale ko ci merge policy bi \u00f1u wax ci zimbra_index_lucene_merge_policy. Njari\u00f1 bii moo dogal segment bi g\u00ebna mag bi \u00f1u man a boole ak yeneen segment.
zimbra_index_lucene_merge_factor = AddDocument() di boole indexu segment yi saa yu tollu. Ak njari\u00f1 yu g\u00ebn a ndaw, RAM la\u00f1uy j\u00ebfandikoo lu g\u00ebn a n\u00e9ew bi \u00f1uy index, te seet yi g\u00ebn a gaaw, waaye gaawaayu index bi g\u00ebn a y\u00e0gg. Ak njari\u00f1 yu g\u00ebn a mag, RAM la\u00f1uy j\u00ebfandikoo lu g\u00ebn a bari bi \u00f1uy index, te doonte seet yi g\u00ebn a y\u00e0gg, index bi g\u00ebn a gaaw. Njari\u00f1 yu mag (>10) g\u00ebn na\u00f1u baax ngir sos batch index, te yu ndaw (<10) ngir index yi \u00f1uy saytu ci doxalin.
zimbra_index_lucene_term_index_divisor = Dafay j\u00ebl ay sampi ci term yi \u00f1u indexe ngir yeb leen ci RAM. Boo defee njari\u00f1 bu > 1, man nga w\u00e0\u00f1\u00f1i j\u00ebfandikoom memuwaar waaye y\u00e9exal bi buy sotti xibaaru bind bi \u00f1u dencal ngir benn term dina g\u00ebna y\u00e0gg.
zimbra_index_lucene_use_compound_file = true su fekkee benn segment bu bees bu Lucene wara j\u00ebfandikoo compound file format. http://wiki.apache.org/lucene-java/ImproveIndexingSpeed nee na compound file format warul dox ngir performance bu g\u00ebn, waaye loolu dina yokk lool limu file descriptor yi. File descriptor yi man naa jeex su zimbra_index_lucene_merge_factor maggee.
zimbra_index_lucene_max_buffered_docs = Limu dokimaa yi g\u00ebna n\u00e9ew \u00f1uy soxla bala dokimaa yi \u00f1u t\u00e9ye ci memuwaar di g\u00e9nn ni benn segment bu bees. Njari\u00f1 yu mag daanaka jox indexing bu g\u00ebn a gaaw.
zimbra_index_lucene_ram_buffer_size_kb = RAM buffer bu Lucene g\u00ebna bari ci KB
zimbra_index_lucene_io_impl = J\u00ebfekaayu FSDirectory bu Lucene bi \u00f1uy j\u00ebfandikoo ngir indexing I/O. Njari\u00f1 yi manees na j\u00ebfandikoo mooy nio - j\u00ebfandikoo NIOFSDirectory. Dafa j\u00ebfandikoo positional io bu FileChannel yu java.nio bi \u00f1uy j\u00e0ng ngir ba\u00f1 synchronisation bu \u00f1uy j\u00e0ng ci benn fayl. mmap - j\u00ebfandikoo MMapDirectory. Dafa j\u00ebfandikoo memory-mapped I/O bu \u00f1uy j\u00e0ng. T\u00e0nn bu baax la su fekkee memuwaaru virtuwel bi bare na ci r\u00ebyaayu index bi. simple - j\u00ebfandikoo SimpleFSDirectory. Dafa j\u00ebfandikoo java.io.RandomAccessFile. Performance amul dara bu baax bu ay thread yu bare j\u00e0ng benn fayl ndax dafa synchronise. Su\u00f1u joxul benn njari\u00f1, FSDirectory dina tann j\u00ebfekaay bi g\u00ebna baax ci mbirum yoon wi.
zimbra_index_rfc822address_max_token_count = Limu token yu address yi g\u00ebna bari ci token stream bi RFC822 address. Dig bi dafa j\u00ebm ci b\u00e9pp header FROM, TO ak CC ci imeel yi, b\u00e9pp email address ci Kontak yi ak tool Creator bu Documents.
zimbra_index_rfc822address_max_token_length = Guddayu token bu address g\u00ebna bari ci token stream bi RFC822 address. Dig bi dafa j\u00ebm ci b\u00e9pp header FROM, TO ak CC ci imeel yi, b\u00e9pp email address ci Kontak yi ak tool Creator bu Documents.
zimbra_index_wildcard_max_terms_expanded = Limu wildcard expansion yi g\u00ebna bari ngir term bu nekk ci query bi.
zimbra_galsync_index_reader_cache_size = Limu IndexReader yi g\u00ebna bari ci cache bu indexu seet GAL. Indexu Lucene bu konto GAL sync bi dees ko cache boppam te amul faru otomaatik.
zimbra_spam_report_queue_size = Ngir Junk/Not Junk Msg/ConvActionRequest yi, r\u00ebyaayu queue bii mooy digg lim bu server workqueue bi ngir j\u00ebfandikoo y\u00f3nne yi.
zimbra_throttle_op_concurrency = Limu njari\u00f1u concurrency yu \u00f1u s\u00e9paratione ak comma ngir b\u00e9pp kenn ci 5 tolluwaayu priorit\u00e9 yi, jaarale ko ci kawe gu g\u00ebna kawe ba ci gu g\u00ebna suuf.
zimbra_im_chat_flush_time = \u00d1aata saa, ci segond, la\u00f1uy bind waxtaan IM yi ubbeeku ci store bi
zimbra_im_chat_close_time = \u00d1aata waxtu, ci segond, la server bi di xaar bala mu t\u00ebj session waxtaan IM yi nekk rekk
zimbra_http_originating_ip_header = HTTP header bi \u00f1uy xool ngir xam IP address bu nj\u00ebkk bu kiliyaan bi
zimbra_session_limit_imap = Limu dosiyey IMAP yi g\u00ebna bari j\u00ebfandikukat kenn man a ubbi benn yoon
zimbra_session_limit_admin = Limu session SOAP yu admin yi g\u00ebna bari j\u00ebfandikukat kenn man a ubbi benn yoon
zimbra_session_limit_soap = Limu session SOAP yu dox g\u00ebna bari ci benn konto. Yokkal njari\u00f1 bii ak teey ngir ba\u00f1 njuumte "Too many SOAP sessions" ci mailbox.log.
zimbra_session_limit_sync = Limu sync listener yi g\u00ebna bari ci benn session ngir ActiveSync. Yokkal njari\u00f1 bii ak teey ngir ba\u00f1 njuumte "Too many SYNCLISTENER sessions" ci sync.log.
zimbra_session_timeout_soap = Timeout bu nekk rekk, ci segond, ngir session SOAP yi
zimbra_session_max_pending_notifications = Limu y\u00ebgle yi \u00f1uy xaar g\u00ebna bari \u00f1u man a teg ci queue ci benn session SOAP, bala \u00f1u rajaxal queue bi te \u00f1u wax kiliyaan bi ne xaalis-staatam baaxul.
zimbra_converter_enabled_uuencode = Ndax UUENCODE decoder bi day dox bi \u00f1uy x\u00e0ll bataaxal yi j\u00f3ge ci store bi
zimbra_converter_enabled_tnef = Ndax TNEF decoder bi day dox bi \u00f1uy x\u00e0ll bataaxal yi j\u00f3ge ci store bi
zimbra_converter_depth_max = X\u00f3otan gu wuutale gu MIME part bi suufam converters yi du\u00f1u ci j\u00ebf
zimbra_ssl_enabled = Ndax dees yeb walla deet ssl keystore bi
stats_img_folder = Kaggu bu \u00f1uy denc ci nataali statistiik yi \u00f1u sos.
ldap_host = Host LDAP bi \u00f1uy j\u00ebfandikoo. Lii deesul ko j\u00ebfandikoo - j\u00ebfandikool ldap_url.
ldap_log_level = Tolluwaayu log LDAP
ldap_port = Port LDAP bi \u00f1uy j\u00ebfandikoo. Lii deesul ko j\u00ebfandikoo - j\u00ebfandikool ldap_url.
ldap_url = Limu server LDAP yi server bii di j\u00ebfandikoo.
ldap_master_url = URL bi j\u00ebm ci LDAP master bi.
ldap_is_master = Host bii mooy server LDAP bu mag bi?
ldap_root_password = Baatu-j\u00e0ll bu rootdn ci slapd.conf bu LDAP. Naka yomb, bi \u00f1uy tambali LDAP, dees g\u00e9nn benn baatu-j\u00e0ll bu random, te denc ko ci local config ak ci slapd.conf. Boo b\u00ebggee soppi baatu-j\u00e0ll bii, j\u00ebfandikool porogaraam zmldappasswd bi, mooy soppi ko ci slapd.conf ak ci local config itam.
ldap_connect_timeout = Millisegond yi gannaaw \u00f1u di taxaw j\u00e9em connection bi dees ko dagg.
ldap_read_timeout = Millisegond yi gannaaw \u00f1u di taxaw j\u00e9em j\u00e0ng bi dees ko dagg.
ldap_deref_aliases = Ndax \u00f1u wara dereference alias yi bi \u00f1uy seet walla bind ak external directory. Njari\u00f1 yu baax yi mooy: always, never, finding, searching
ldap_connect_pool_master = Ndax \u00f1u wara j\u00ebfandikoo JNDI connection pooling ngir LDAP master.
ldap_connect_pool_debug = Ndax \u00f1u wara debug LDAP connection pooling.
ldap_connect_pool_initsize = Limu LDAP connection yu dox yu nj\u00ebkk yi \u00f1u wara yokk ba ci.
ldap_connect_pool_maxsize = Limu LDAP connection yu dox ak yu nekk rekk g\u00ebna bari \u00f1u may.
ldap_connect_pool_prefsize = Limu LDAP connection yi \u00f1u g\u00ebn a b\u00ebgg - def maxsize ak prefsize ci benn njari\u00f1 mooy d\u00ebppoo poolu connection bi ci r\u00ebyaay bu sax.
ldap_connect_pool_timeout = Millisegond yu nekk rekk bala \u00f1u g\u00e9nne connection bu nekk rekk ci pool bi.
ldap_connect_pool_health_check_on_checkout_enabled = Ndax \u00f1u di woote health check bu connection pool saa su connection bennoon j\u00ebm a j\u00ebfandikoo. Su OnCheckout health check di dox, periodic background health check du dox.
ldap_connect_pool_health_check_interval_millis = Gudday waxtu ci millisegond diggante periodic background health check yi \u00f1u di def ci connection yi jappandi ci connection pool bi.
ldap_connect_pool_health_check_max_response_time_millis = Gudday waxtu ci millisegond g\u00ebna bari \u00f1u wara may ngir tontu health check bi dellusi j\u00f3ge ci server LDAP bi.
ldap_replication_password = Baatu-j\u00e0ll bu j\u00ebfandikukat syncrepl bi \u00f1uy j\u00ebfandikoo ngir wone boppam ci ldap master bi.
ldap_postfix_password = Baatu-j\u00e0ll bu postfix di j\u00ebfandikoo ngir wone boppam ci ldap.
ldap_amavis_password = Baatu-j\u00e0ll bu amavis di j\u00ebfandikoo ngir wone boppam ci ldap.
ldap_starttls_supported = Ndax server LDAP bi dafa taage j\u00ebf startTLS.
ldap_require_tls = Ndax TLS dafa war ngir kiliyaan LDAP yi.
ldap_cache_account_maxsize = Limu account object yi g\u00ebna bari \u00f1u man a cache.
ldap_cache_account_maxage = M\u00e0ggat bu g\u00ebna bari, ci simili, bu account object yi ci cache.
ldap_cache_cos_maxsize = Limu cos object yi g\u00ebna bari \u00f1u man a cache.
ldap_cache_cos_maxage = M\u00e0ggat bu g\u00ebna bari, ci simili, bu cos object yi ci cache.
ldap_cache_domain_maxsize = Limu domain object yi g\u00ebna bari \u00f1u man a cache
ldap_cache_domain_maxage = M\u00e0ggat bu g\u00ebna bari, ci simili, bu domain object yi ci cache.
ldap_cache_mime_maxage = M\u00e0ggat bu g\u00ebna bari, ci simili, bu MIME object yi ci cache.
ldap_cache_server_maxsize = Limu server object yi g\u00ebna bari \u00f1u man a cache
ldap_cache_server_maxage = M\u00e0ggat bu g\u00ebna bari, ci simili, bu group object yi ci cache.
ldap_cache_share_locator_maxsize = Limu account item yi g\u00ebna bari ci named entry cache.
ldap_cache_share_locator_maxage = TTL bu named entry cache ci simili.
ldap_cache_timezone_maxsize = Limu timezone object yi g\u00ebna bari \u00f1u man a cache.
ldap_cache_zimlet_maxsize = Limu zimlet object yi g\u00ebna bari \u00f1u man a cache.
ldap_cache_zimlet_maxage = M\u00e0ggat bu g\u00ebna bari, ci simili, bu zimlet object yi ci cache.
ldap_cache_custom_dynamic_group_membership_maxage_ms = M\u00e0ggat bu g\u00ebna bari, ci millisegond, ngir cache dynamic group yi benn konto bokk, ngir grup yi \u00f1uy dogal bokk gi jaarale ko ci MemberURL bu\u00f1 defar.
csrf_filter_domain_allowed_ref_hosts_max_size = Limu duggukaayi domain yi g\u00ebna bari ci cache bu CsrfFilter per-domain allowedRefererHosts. Su parsing amee njuumte, dina dellu ci ldap_cache_domain_maxsize.
csrf_filter_domain_allowed_ref_hosts_cache_expiry_mins = M\u00e0ggat bu g\u00ebna bari, ci simili, bu duggukaay yi ci cache bu CsrfFilter per-domain allowedRefererHosts. Bu jeexee, dees di g\u00e9nne duggukaay bi te yebaat ko j\u00f3ge ci LDAP ci laaj bi ci topp. Su parsing amee njuumte, dina dellu ci 60 simili.
mysql_directory = B\u00e9rabu sampu MySQL.
mysql_data_directory = Kaggu bi done yi MySQL wara nekk.
mysql_errlogfile = Logu njuumte MySQL/MariaDB.
mysql_socket = Yoon bi j\u00ebm ci socket MySQL ngir jumtukaay r\u00ebdd MySQL yi.
mysql_pidfile = Fayl bi \u00f1uy denc ID prosesu MySQL.
mysql_mycnf = Yoon bi j\u00ebm ci my.cnf, faylu komfig MySQL.
mysql_bind_address = Interface bi ci host bii MySQL di bind ci.
mysql_port = Nimero port bi server MySQL bi wara d\u00e9glu ci.
mysql_root_password = Baatu-j\u00e0ll bu j\u00ebfandikukat "root" bu biir MySQL, bu\u00f1u war a jaaxal ak UNIX root login. Naka yomb, bi \u00f1uy tambali database bi dees g\u00e9nn benn baatu-j\u00e0ll bu random, te denc ko ci local config ak ci MySQL. Boo b\u00ebggee soppi baatu-j\u00e0ll bii, j\u00ebfandikool porogaraam zmmypasswd bi, mooy soppi baatu-j\u00e0ll bi ci MySQL ak ci local config itam.
mysql_memory_percent = Porsantaasu memuwaaru sistem bi mysql wara j\u00ebfandikoo. Njari\u00f1 bii dees ko denc fii ngir porogaraam zmmycnf j\u00ebfandikoo ko. Soppi setti\u014b bii du delloo ay coppite ci server MySQL bi saa si. War nga, ak teey bu bare, sosaat my.cnf te t\u00e0mbaliaat server MySQL bi ngir coppite bi jari\u00f1.
mysql_innodb_log_buffer_size = Seetal dokimantaasio\u014b MySQL ngir innodb_log_buffer_size. Njari\u00f1 bii dees ko denc fii ngir porogaraam zmmycnf j\u00ebfandikoo ko. Soppi setti\u014b bii du delloo ay coppite ci server MySQL bi saa si. War nga, ak teey bu bare, sosaat my.cnf te t\u00e0mbaliaat server MySQL bi ngir coppite bi jari\u00f1.
mysql_innodb_log_file_size = Seetal dokimantaasio\u014b MySQL ngir innodb_log_file_size. Njari\u00f1 bii dees ko denc fii ngir porogaraam zmmycnf j\u00ebfandikoo ko. Soppi setti\u014b bii du delloo ay coppite ci server MySQL bi saa si. War nga, ak teey bu bare, sosaat my.cnf te t\u00e0mbaliaat server MySQL bi ngir coppite bi jari\u00f1.
mysql_sort_buffer_size = Seetal dokimantaasio\u014b MySQL ngir sort_buffer_size. Njari\u00f1 bii dees ko denc fii ngir porogaraam zmmycnf j\u00ebfandikoo ko. Soppi setti\u014b bii du delloo ay coppite ci server MySQL bi saa si. War nga, ak teey bu bare, sosaat my.cnf te t\u00e0mbaliaat server MySQL bi ngir coppite bi jari\u00f1.
mysql_read_buffer_size = Seetal dokimantaasio\u014b MySQL ngir read_buffer_size. Njari\u00f1 bii dees ko denc fii ngir porogaraam zmmycnf j\u00ebfandikoo ko. Soppi setti\u014b bii du delloo ay coppite ci server MySQL bi saa si. War nga, ak teey bu bare, sosaat my.cnf te t\u00e0mbaliaat server MySQL bi ngir coppite bi jari\u00f1.
mysql_backup_retention = Limu sumb yu backup bu database mysql yi \u00f1u wara denc.
antispam_mysql_enabled = J\u00ebfandikool database mysql ngir antispam. False la defolt bi.
antispam_backup_retention = Limu sumb yu backup bu database antispam yi \u00f1u wara denc.
derby_properties = Yoon bi j\u00ebm ci faylu properties buy komfigire derby.
imap_max_consecutive_error = Su mu g\u00ebn 0, daggal jokkoo IMAP bi bu tolloo ci limiti imap_max_consecutive_error.
imap_inactive_session_cache_size = Ehcache: limu \u00ebntu cache IMAP yu inactive yi g\u00ebn a bari ci disk bala \u00f1u leen d\u00e0qe.
imap_use_ehcache = Su true la, j\u00ebfandikoo Ehcache ngir cache sessio\u014b IMAP. Su dul noonu, j\u00ebfandikoo disk cache.
imap_write_timeout = Defar timeout bu bindu sessio\u014b IMAP bi (nio).
imap_write_chunk_size = R\u00ebyaay bu bufferu bindu IMAP bi ci bytes.
imap_thread_keep_alive_time = Diir bu nd\u00e9ffar, ci segond, ngir xarala IMAP.
imap_throttle_ip_limit = Su mu g\u00ebn 0, limu laaj yu IMAP ci segond bu IP g\u00ebn a bari.
imap_throttle_acct_limit = Su mu g\u00ebn 0, limu laaj yu IMAP ci segond bu account g\u00ebn a bari.
imap_suggested_batch_copy_size = Limu bataaxal yi \u00f1uy ligg\u00e9ey ci benn batch bi ci operasyon COPY yu IMAP.
imap_in_progress_response_thread_pool_size = Limu xarala yi g\u00ebn a bari ci pool bi ngir y\u00f3nnee tontu InProgress ci client bi.
imap_in_progress_response_thread_keep_alive = Diiru segond yi \u00f1uy b\u00e0yyi xarala bi mu dund bala \u00f1u dagg ko.
imap_ehcache_heap_size = Limu \u00ebntu cache IMAP yi g\u00ebn a bari yi \u00f1u denc ci heap tier bu Ehcache.
imap_ehcache_skip_large_folder = B\u00ebsalul cache folder IMAP yu mag ci Ehcache bu \u00f1u ko doxalee.
imap_ehcache_folder_max_message_count = Barabu limu bataaxal yi folder IMAP du\u00f1u leen cache ci Ehcache bu \u00f1u g\u00ebn ci dayo boobu.
nio_imap_enabled = Su true la, doxal Jetty non-blocking IO ngir IMAP.
nio_pop3_enabled = Su true la, doxal Jetty non-blocking IO ngir POP3.
postfix_mail_owner = postfix_mail_owner
postfix_setgid_group = postfix_setgid_group
postfix_version = postfix_version
mailboxd_directory = Berabu sampu mailboxd.
mailboxd_java_heap_size = Limu megabytes yi JVM biy doxal Mailboxd di j\u00ebfandikoo ni r\u00ebyaayu Java heap bu g\u00ebn a mag (-Xmx).
mailboxd_java_heap_new_size_percent = Pourcentage bu Java heap size bi JVM biy doxal Mailboxd di j\u00ebfandikoo ngir young generation (-Xmn).
mailboxd_java_options = Opsio\u014b yu JVM yu \u00f1uy j\u00ebfandikoo bu \u00f1uy t\u00e0mbali Mailboxd.
mailboxd_pidfile = Fayl bi \u00f1u di denc process id bu JVM Mailboxd.
mailboxd_keystore = Berabu faylu done keystore.
mailboxd_keystore_password = Baatu-j\u00e0ll bi \u00f1uy j\u00ebfandikoo ak keystore bu KeyManager.
mailboxd_truststore = Berabu faylu done truststore.
mailboxd_truststore_password = Baatu-j\u00e0ll bi \u00f1uy j\u00ebfandikoo ak keystore bu TrustManager.
client_ssl_truststore = Berabu faylu done truststore bu \u00f1uy j\u00ebfandikoo ngir autentifikaasio\u014b SSL bu client.
client_ssl_truststore_password = Baatu-j\u00e0ll bi \u00f1uy j\u00ebfandikoo ak keystore bu client SSL TrustManager.
mailboxd_output_file = Fayl bi \u00f1uy jubbanti stdout ak stderr bu serveer bi ca.
mailboxd_output_rotate_interval = Diir, ci segond, bi \u00f1uy w\u00ebrale faylu g\u00e9nne mailboxd. Su <= 0, du am w\u00ebrale.
mailboxd_thread_stack_size = R\u00ebyaayu stacku xarala ngir Mailboxd.
