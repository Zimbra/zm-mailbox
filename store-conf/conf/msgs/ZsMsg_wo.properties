zimbra_home = R\u00ebccu sampu Zimbra ak kaggu k\u00ebrg\u00f3orug j\u00ebfandikukat UNIX bii di "zimbra". M\u00ebnuloo toxal r\u00ebccu sampu bi - bul soppi setti\u014b bii.
