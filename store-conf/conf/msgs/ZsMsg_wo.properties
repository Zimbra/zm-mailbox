zimbra_mysql_shutdown_timeout = Diiru waxtu bi \u00f1uy xaar ngir prosesu mailbox MySQL/MariaDB jeex. Yokk timeout bi su fekkee mysql.server dafa j\u00ebl waxtu wu bare ngir t\u00ebj prosesu bi.
zimbra_mysql_user = Turu j\u00ebfandikukat MySQL bu \u00f1uy j\u00ebfandikoo ngir sos walla jot ci database ak table yi Zimbra. Lii mooy njari\u00f1 bi nga wara jox ci tanneef "-u" bu porogaraamu r\u00ebdd "mysql".
zimbra_mysql_password = Baatu-j\u00e0ll bu zimbra_mysql_user. Denc na\u00f1u ko ci local config ngir porogaraamu store bi j\u00ebfandikoo ko ngir wone boppam. Boo b\u00ebggee soppi baatu-j\u00e0ll bii, j\u00ebfandikool porogaraam zmmypasswd bi, mooy soppi baatu-j\u00e0ll bi ci MySQL ak ci local config itam.
zimbra_ldap_userdn = LDAP dn bi \u00f1uy j\u00ebfandikoo ngir wone store application bi ci LDAP.
zimbra_ldap_user = Turu j\u00ebfandikukat zimbra bi \u00f1uy j\u00ebfandikoo ngir wone bopp ak admin AuthRequest.
zimbra_ldap_password = Baatu-j\u00e0ll bu zimbra_ldap_userdn. Denc na\u00f1u ko ci local config ngir store application bi j\u00ebfandikoo ko ngir wone boppam. Boo b\u00ebggee soppi baatu-j\u00e0ll bii, j\u00ebfandikool porogaraam zmldappasswd bi, mooy soppi baatu-j\u00e0ll bi ci LDAP ak ci local config itam.
zimbra_server_hostname = Turu server bii \u00f1u provision. War na am benn duggukaay "server" bu ko m\u00e9ngoo ci LDAP - seetal dokimantaasio\u014bu santaane CreateServer bu porogaraam zmprov.
zimbra_user = J\u00ebfandikukat unix zimbra bi prosesu server zimbra bi wara j\u00ebmee ay sa\u00f1-sa\u00f1am ci moom, gannaaw mu boole port yi am sa\u00f1-sa\u00f1 yu kawe.
zimbra_uid = UID unix zimbra bi prosesu server zimbra bi wara j\u00ebmee ay sa\u00f1-sa\u00f1am ci moom, gannaaw mu boole port yi am sa\u00f1-sa\u00f1 yu kawe.
zimbra_gid = GID unix zimbra bi prosesu server zimbra bi wara j\u00ebmee ay sa\u00f1-sa\u00f1am ci moom, gannaaw mu boole port yi am sa\u00f1-sa\u00f1 yu kawe.
