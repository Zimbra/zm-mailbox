#license notification email for exceeding usage count for feature
licenseFeaureOnHoldNotifierSubject = Tsivhudzo ya Sisiteme ya Zimbra: Mukano wa kushumisele kwa feature wo fhiriswa
licenseFeaureOnHoldNotifierBodyText=Nomboro yo tendelwaho ya dzi-akhaunthu yo swikelwa kana ya fhiriswa kha dzi-feature dzi tevhelaho:\n{0}\nNi nga fhungudza kushumisele kwa vhashumisi vha hone kana na engedza mukano wa \u1e3daisentse ya feature.\n\nU itela u engedza mukano wa \u1e3daisentse ya feature, ri humbela ni kwame Zimbra Sales kha sales@zimbra.com.\nU laula kuavhelwe kwa feature kha akhaunthu, ri humbela ni sign in kha Admin Portal.\n\nRi humbela ni dzhiele nzhele zwi tevhelaho:\n1. Ni \u1e13o bvela phan\u1e13a no \u1e71anganedza iyi n\u1e13ivhadzo lwa ma\u1e13uvha a {1,number,integer} u bva nga \u1e13uvha \u1e3da u fhirisa kushumisele.\n2. Ni nga si kone u tendela feature yo shumiswaho nga maan\u1e13a kha dzi-akhaunthu na nthihi.\n3. Arali ni sa dzhii nyito kha feature yo shumiswaho nga maan\u1e13a, feature iyo i \u1e13o tsimiwa kha vhashumisi u itela uri i vhe fhasi ha mukano wa \u1e3daisentse.\n\nNdaa,\nZimbra Support
licenseFeaureOnHoldNotifierBodyHtml=<div style="font-family:sans-serif;">Nomboro yo tendelwaho ya dzi-akhaunthu yo swikelwa kana ya fhiriswa kha dzi-feature dzi tevhelaho:<br>{0}<br>Ni nga fhungudza kushumisele kwa vhashumisi vha hone kana na engedza mukano wa \u1e3daisentse ya feature.<br><br>U itela u engedza mukano wa \u1e3daisentse ya feature, ri humbela ni kwame Zimbra Sales kha <b>sales@zimbra.com</b>.<br>U laula kuavhelwe kwa feature kha akhaunthu, ri humbela ni sign in kha Admin Portal.<br><br>Ri humbela ni dzhiele nzhele zwi tevhelaho:<br>1. Ni \u1e13o bvela phan\u1e13a no \u1e71anganedza iyi n\u1e13ivhadzo lwa ma\u1e13uvha a {1,number,integer} u bva nga \u1e13uvha \u1e3da u fhirisa kushumisele.<br>2. Ni nga si kone u tendela feature yo shumiswaho nga maan\u1e13a kha dzi-akhaunthu na nthihi.<br>3. Arali ni sa dzhii nyito kha feature yo shumiswaho nga maan\u1e13a, feature iyo i \u1e13o tsimiwa kha vhashumisi u itela uri i vhe fhasi ha mukano wa \u1e3daisentse.<br><br>Ndaa,<br>Zimbra Support</div>

#send password expiry reminder email
passwordExpiryNotifierSubject = Phasiwedi yanu i fhela nga Ma\u1e13uvha a {0}
passwordExpiryNotifierBodyText=A {0},\n\nPhasiwedi ya akhaunthu yanu i fhela nga Ma\u1e13uvha a {1}, nga \u1e3da {2}.\n\nU itela u bvela phan\u1e13a na u wana akhaunthu yanu, ri humbela ni risete phasiwedi yanu mbilu \u1e13uvha \u1e3da u fhela \u1e3di sa athu swika.\n\nNi \u1e13o bvela phan\u1e13a no \u1e71anganedza n\u1e13ivhadzo dza \u1e13uvha \u1e3di\u1e45we na \u1e3di\u1e45we u swika phasiwedi i tshi shandulwa kana ya fhela.\n\nIyi ndi n\u1e13ivhadzo ya imeili yo itwaho nga othomathiki.
passwordExpiryNotifierBodyHtml=<p>A {0},</p><p>Phasiwedi ya akhaunthu yanu i fhela nga <strong>Ma\u1e13uvha a {1}</strong>, nga <strong>{2}</strong>.</p><p>U itela u bvela phan\u1e13a na u wana akhaunthu yanu, ri humbela ni risete phasiwedi yanu mbilu \u1e13uvha \u1e3da u fhela \u1e3di sa athu swika.</p><p>Ni \u1e13o bvela phan\u1e13a no \u1e71anganedza n\u1e13ivhadzo dza \u1e13uvha \u1e3di\u1e45we na \u1e3di\u1e45we u swika phasiwedi i tshi shandulwa kana ya fhela.</p><p>Iyi ndi n\u1e13ivhadzo ya imeili yo itwaho nga othomathiki.</p>

