# local config settings

zimbra_home = Tshisiki tsha u dzhenisa Zimbra na dairek\u1e71ori ya hayani ya mushumisi wa UNIX wa \u2018zimbra\u2019. Ni nga si kone u sudzulusa tshisiki tsha u dzhenisa - ni songo shandukisa iyi sethingi.
zimbra_java_home = Bada ya JDK/J2SDK.
zimbra_log_directory = Dairek\u1e71ori ine faela dza logi dza \u1e45waliwa khayo.
zimbra_index_directory = Dairek\u1e71ori ya faela dza indekisi ya mailbox.
zimbra_store_directory = Dairek\u1e71ori ya milaedza ya mailbox.
zimbra_db_directory = Dairek\u1e71ori ya faela dza database.
zimbra_tmp_directory = Dairek\u1e71ori ya faela dza tshifhinganyana.
zimbra_hybrid_blob_mover_enabled = I vhea uri tshitenwa tsha Hybrid Blob Mover tsho tendelwa naa. Tshi\u1e4bwe tsha u thoma ndi: false
zimbra_extensions_directory = Dairek\u1e71ori ine dzi-subdir dzayo dza vha na dzi-extension.
zimbra_extensions_common_directory = Dairek\u1e71ori ine ya vha na faela dza jar dzine dza shumiswa nga dzi-extension dzo\u1e71he.
zimbra_mysql_shutdown_timeout = Tshifhinga tsha u lindela uri mushumo wa mailbox MySQL/MariaDB u fe. Engedzani tshifhinga arali mysql.server i tshi khou dzhia tshifhinga tshinzhi u vala mushumo.
zimbra_mysql_user = Dzina \u1e3da mushumisi \u1e3da MySQL \u1e3di shumiswaho u sika/u swikelela dzi-database na dzitafula dza zimbra. He\u1e3di ndi \u1e3done ndeme ine na \u1e13o i\u1e4bea kha khetho ya \u2018-u\u2019 ya programa ya layini ya ndaela ya \u2018mysql\u2019.
zimbra_mysql_password = Phasiwedi ya zimbra_mysql_user. Yo vhulungwa kha config ya fhano u itela uri app ya store i kone u dzhena.  Arali ni tshi \u1e71o\u1e13a u shandukisa hei phasiwedi, ndi khwi\u1e4be u shumisa programa ya zmmypasswd ine ya \u1e13o shandukisa phasiwedi kha MySQL na kha config ya fhano.
zimbra_ldap_userdn = LDAP dn ine ya shumiswa u dzhena nga app ya store kha LDAP.
zimbra_ldap_user = Dzina \u1e3da mushumisi \u1e3da zimbra \u1e3di shumiswaho u dzhena nga admin AuthRequest.
zimbra_ldap_password = Phasiwedi ya zimbra_ldap_userdn. Yo vhulungwa kha config ya fhano u itela uri app ya store i kone u dzhena.  Arali ni tshi \u1e71o\u1e13a u shandukisa hei phasiwedi, ndi khwi\u1e4be u shumisa programa ya zmldappasswd ine ya \u1e13o shandukisa phasiwedi kha LDAP na kha config ya fhano.
zimbra_server_hostname = Dzina \u1e3do\u1e4betshedzwaho \u1e3da hei seva. Hu tea u vha na entry ya \u2018server\u2019 i elanaho nayo kha LDAP - sedzani ma\u1e45walo a CreateServer command ya programa ya zmprov.
zimbra_user = Mushumisi wa unix wa zimbra ane mushumo wa seva ya zimbra wa tea u shandukela kha thendelo dzawo nga murahu ha u vhofha dzi-port dza ndeme.
zimbra_uid = uid ya unix ya zimbra ine mushumo wa seva ya zimbra wa tea u shandukela khayo nga murahu ha u vhofha dzi-port dza ndeme.
zimbra_gid = gid ya unix ya zimbra ine mushumo wa seva ya zimbra wa tea u shandukela khayo nga murahu ha u vhofha dzi-port dza ndeme.
zimbra_log4j_properties = Bada ya faela ya zwiimiswa zwa log4j.
zimbra_log4j_properties_watch = Nako ya u sedza ha faela ya zwiimiswa zwa log4j nga msec.
zimbra_attrs_directory = Dairek\u1e71ori ine ya vha na faela dza *.xml dzine dza sumbedza sintaksi ya zwiitwa zwa LDAP zwi shumiswaho nga sisiteme
localized_msgs_directory = Dairek\u1e71ori ya faela dza milaedza yo \u1e71alutshedzwaho.
localized_client_msgs_directory = Dairek\u1e71ori ya faela dza milaedza ya client yo \u1e71alutshedzwaho.
skins_directory = Dairek\u1e71ori ya dziskini.
zimbra_store_sweeper_max_age = Faela dzine dza fhira minetse nnzhi iyi dzi bviswa nga u tou itela u bva kha dairek\u1e71ori ya u dzhena ya store.
zimbra_store_copy_buffer_size_kb = Mishumo ya u kopa faela i shumisa dzi-buffer dza vhulapfu uvhu
zimbra_mailbox_galsync_cache = I vhea cache ya n\u1e71hesa ya zwithu zwa vhukwamani zwa mailbox ya galsync. Vheani ndeme mbiluledza ya vhu\u1e71uku ya zwithu zwa vhukwamani zwine zwa vha kha mailbox ya galsync.
zimbra_mailbox_manager_hardref_cache = Nomboro ya n\u1e71hesa ya dzi-mailbox dzine dza \u1e13o farelwa memori\u1e4bi musi mailbox manager i sa athu tendela uri dzi kone u kunakulwa nga ku\u1e71anganyiswa kwa SoftReference garbage collection.
zimbra_mailbox_active_cache = Saizi ya n\u1e71hesa ya cache ya nga ngomu ya tshithu tsha LRU ya mailbox musi hu na sessions dzi shumeaho.
zimbra_mailbox_inactive_cache = Saizi ya n\u1e71hesa ya cache ya nga ngomu ya tshithu tsha LRU ya mailbox musi i si na sessions dzi shumeaho.
zimbra_mailbox_change_checkpoint_frequency = Frequensi (nga nomboro ya shanduko) ine ngayo ndeme ya shanduko ya highwater ya ZIMBRA.MAILBOX.CHANGE_CHECKPOINT ya mailbox i \u1e45waliwa.
zimbra_index_elasticsearch_url_base = URL ya mutheo ya ElasticSearch REST API.
zimbra_index_threads = Saizi ya thread pool ya batch index
zimbra_reindex_threads = Nomboro ya n\u1e71hesa ya dzi-thread dza re-index. Dzi-thread dza re-index a dzi vhulungwi kha pool.
zimbra_index_disable_perf_counters = Arali hu false, Lucene read na write IO zwi tevhedzwa nga u \u1e71ola matshilisano a Zimbra. Ndeme ya true i ima u \u1e71olwa ha Lucene IO.
zimbra_index_max_readers = Nomboro ya n\u1e71hesa ya IndexReaders dzine dza nga shumisana nga tshifhinga tshithihi
zimbra_index_max_writers = Nomboro ya n\u1e71hesa ya IndexWriters dzine dza nga shumisana nga tshifhinga tshithihi
zimbra_index_reader_cache_size = Nomboro khulwane ya IndexReaders kha kheshe ya indekisi ya u \u1e71o\u1e13a
zimbra_index_reader_cache_ttl = Arali ya sa shumi tshifhinga tshilapfu u fhira ndeme iyi (sekhondi), bvisani IndexReader kha kheshe
zimbra_index_deferred_items_failure_delay = Nga murahu ha u kundelwa, u lenga hu\u1e71uku (sekhondi) vhukati ha ndingo dza u \u1e71anzwa khiu ya zwithu zwi songo valiwaho indekisini (deferred)
zimbra_index_lucene_max_terms_per_query = Vhekanyani nomboro khulwane ya maipfi o tendelwaho kha query i\u1e45we na i\u1e45we.
zimbra_index_max_transaction_bytes = When batching index operations into a Mailbox transaction, the maximum aggregate size of items that we will tendela kha a single transaction
zimbra_index_max_transaction_items = When batching index operations, the nomboro khulwane ya mail_items we tendela kha a single transaction
zimbra_index_max_pending_deletes = Nomboro khulwane ya pending index deletes until reclaiming the disk space
zimbra_index_lucene_merge_policy = true u shumisa LogDocMergePolicy, false u shumisa LogByteSizeMergePolicy. LogDocMergePolicy chooses segments u merge based kha the nomboro ya documents. LogByteSizeMergePolicy chooses segments u merge based kha their size.
zimbra_index_lucene_min_merge = Sets the Lucene minimum merge size kha Documents or KB depending kha the merge policy specified kha zimbra_index_lucene_merge_policy.
zimbra_index_lucene_max_merge = Sets the Lucene maximum merge size kha Documents or KB depending kha the merge policy specified kha zimbra_index_lucene_merge_policy. This value determines the largest segment that may be merged na other segments.
zimbra_index_lucene_merge_factor = How often segment indices are merged by addDocument(). With smaller values, less RAM is shumisad while indexing, na searches are faster, but indexing speed is slower. With larger values, more RAM is shumisad during indexing, na while searches are slower, indexing is faster. Larger values (>10) are best ya batch index creation, na smaller values (<10) ya indices that are interactively maintained.
zimbra_index_lucene_term_index_divisor = Subsamples which indexed terms are \u1e3dodzhiwaho into RAM. By setting this u a value > 1 you can reduce memory usage at the expense of higher latency when \u1e3dodaing the record information vhulungwaho ya a term.
zimbra_index_lucene_use_compound_file = true if a new Lucene segment should shumisa the compound faela format. http://wiki.apache.org/lucene-java/ImproveIndexingSpeed says u turn off compound faela format ya better performance, but will greatly increase the nomboro ya faela descriptors. File descriptors could be depleted if zimbra_index_lucene_merge_factor is large.
zimbra_index_lucene_max_buffered_docs = The minimal nomboro ya documents required before the buffered in-memory documents are flushed as a new segment. Large values generally give faster indexing.
zimbra_index_lucene_ram_buffer_size_kb = Lucene Max Buffered RAM kha KB
zimbra_index_lucene_io_impl = Lucene FSDirectory implementation shumisad ya indexing IO. Possible values nio - Shumisani NIOFSDirectory. Uses java.nio's FileChannel's positional io when reading u avoid synchronization when reading u bva kha the same faela. mmap - Shumisani MMapDirectory. Uses memory-mapped IO when reading. A good choice if there is plenty of virtual memory relative u index size. simple - Shumisani SimpleFSDirectory. Uses java.io.RandomAccessFile. It has poor concurrent performance as it synchronizes when multiple thiredes read the same faela. Arali hu sa\u1e4be ndeme, FSDirectory will choose the best implementation ya the environment.
zimbra_index_rfc822address_max_token_count = The maximum token count of \u1e13iresies kha the RFC822 \u1e13iresi token stream. The limit applies u all FROM, TO, na CC headers ya emails, all email email \u1e13iresies ya Contacts na Creator field ya Documents.
zimbra_index_rfc822address_max_token_length = The maximum token length ya an \u1e13iresi kha the RFC822 \u1e13iresi token stream. The limit applies u all FROM, TO, na CC headers ya emails, all email email \u1e13iresies ya Contacts na Creator field ya Documents.
zimbra_index_wildcard_max_terms_expanded = Nomboro khulwane ya u andiswa ha wildcard kha term i\u1e45we na i\u1e45we kha query.
zimbra_galsync_index_reader_cache_size = The nomboro khulwane ya IndexReaders kha the GAL indekisi ya u \u1e71o\u1e13a kheshe. The GAL sync akhaunthu Lucene index is kheshed separately na no automatic eviction.
zimbra_spam_report_queue_size = Kha Junk/Not Junk Msg/ConvActionRequests, muelo uyu wa khiu u vhea mukano kha workqueue ya sevha ya u shumisa u rumela phanda.
zimbra_throttle_op_concurrency = Mutevhe wa concurrency values ya each of the 5 priority levels kha order u bva kha highest priority u lowest priority
zimbra_im_chat_flush_time = How frequently (sekhondi) are open IM chats written u the store
zimbra_im_chat_close_time = How long (sekhondi) will the sevha wait u vala i songo shuma IM chat seshenis
zimbra_http_originating_ip_header = HTTP header ine ya sedzwa u vhona \u1e13iresi ya IP ya u thoma ya client
zimbra_session_limit_imap = Nomboro khulwane ya IMAP folders a single mushumisi can have vhu\u1e3da nga tshifhinga tshithihi
zimbra_session_limit_admin = Nomboro khulwane ya admin SOAP seshenis a single mushumisi can have vhu\u1e3da nga tshifhinga tshithihi
zimbra_session_limit_soap = Nomboro khulwane ya active soap seshenis per akhaunthu. Carefully increase this value u avoid "Too many SOAP seshenis\u201d errors kha mailbox.log.
zimbra_session_limit_sync = Nomboro khulwane ya per sesheni sync listeners ya ActiveSync. Carefully increase this value u avoid "Too many SYNCLISTENER seshenis" errors kha sync.log.
zimbra_session_timeout_soap = Idle timeout (in sekhondi) ya SOAP seshenis
zimbra_session_max_pending_notifications = Nomboro khulwane ya pending notifications that can be queued kha a SOAP sesheni before the queue is purged na the client is told their state is invalid
zimbra_converter_enabled_uuencode = Arali the UUENCODE decoder is run when parsing milaedza u bva kha the store
zimbra_converter_enabled_tnef = Arali the TNEF decoder is run when parsing milaedza u bva kha the store
zimbra_converter_depth_max = Recursive MIME part depth beneath which converters will not act
zimbra_ssl_enabled = Arali hu tshi tea u \u1e3doda the ssl keystore
stats_img_folder = Direk\u1e71ori ya u vhulunga zwifanyiso zwa mivhalo yo bveledzwaho.
ldap_host = LDAP host u shumisa. Deprecated - please shumisa ldap_url instead.
ldap_log_level = \u1e3cevelo ya logging ya LDAP
ldap_port = LDAP port u shumisa. Deprecated - please shumisa ldap_url instead.
ldap_url = Mutevhe wa LDAP sevhas ya shumisa by this sevha.
ldap_master_url = URL u the LDAP master.
ldap_is_master = Is this host the master LDAP sevha?
ldap_root_password = Password ya LDAP slapd.conf rootdn. Nga u itela u ololofa, nga tshifhinga tsha u thoma LDAP, phasiwede ya random i a bveledzwa, ya vhulungwa kha local config na kha slapd.conf. Arali ni tshi \u1e71o\u1e13a u shandukisa phasiwede iyi, shumisani mbekanyamushumo ya zmldappasswd ine ya shandukisa phasiwede kha slapd.conf na kha local config.
ldap_connect_timeout = Millisekhondi after which a khonekisheni attempt is aborted.
ldap_read_timeout = Millisekhondi after which a read attempt is aborted.
ldap_deref_aliases = Arali u dereference aliases while searching or binding u external directory. Valid values are: always, never, finding, searching
ldap_connect_pool_master = Arali u shumisa JNDI khonekisheni phu\u1e3duing ya LDAP master.
ldap_connect_pool_debug = Arali u debug LDAP khonekisheni phu\u1e3duing.
ldap_connect_pool_initsize = Initial nomboro ya active LDAP khonekishenis u ramp up to.
ldap_connect_pool_maxsize = Nomboro khulwane ya LDAP active na i songo shuma khonekishenis tendelaed.
ldap_connect_pool_prefsize = Nomboro i takalelwaho ya LDAP khonekishenis - setting both maxsize na prefsize u the same value maintains the khonekisheni phu\u1e3du at a fixed size.
ldap_connect_pool_timeout = Millisekhondi of i songo shuma time before an i songo shuma khonekisheni is bumped u bva kha the phu\u1e3du.
ldap_connect_pool_health_check_on_checkout_enabled = Arali khonekisheni phu\u1e3du health check will be invoked whenever a khonekisheni is u be checked out ya shumisa. If OnCheckout health check is enabled, periodic background health check will be disabled.
ldap_connect_pool_health_check_interval_millis = Length of time kha milisekhondi between periodic background health checks against the available khonekishenis kha khonekisheni phu\u1e3du.
ldap_connect_pool_health_check_max_response_time_millis = The maximum length of time kha milisekhondi that should be tendelaed ya the health check response u come back u bva kha the LDAP sevha.
ldap_replication_password = Password shumisad by the syncrepl mushumisi u authenticate u the ldap master.
ldap_postfix_password = Password shumisad by postfix u authenticate u ldap.
ldap_amavis_password = Password shumisad by amavis u authenticate u ldap.
ldap_starttls_supported = Arali the LDAP sevha supports the startTLS operation.
ldap_require_tls = Arali TLS is required ya LDAP clients.
ldap_cache_account_maxsize = Nomboro khulwane ya akhaunthu objects u kheshe.
ldap_cache_account_maxage = Vhukale vhuhulwane (nga minetse) ha akhaunthu objects kha kheshe.
ldap_cache_cos_maxsize = Nomboro khulwane ya cos objects u kheshe.
ldap_cache_cos_maxage = Vhukale vhuhulwane (nga minetse) ha cos objects kha kheshe.
ldap_cache_domain_maxsize = Nomboro khulwane ya domain objects u kheshe
ldap_cache_domain_maxage = Vhukale vhuhulwane (nga minetse) ha domain objects kha kheshe.
ldap_cache_mime_maxage = Vhukale vhuhulwane, nga minetse, ha MIME objects kha kheshe.
ldap_cache_server_maxsize = Nomboro khulwane ya sevha objects u kheshe
ldap_cache_server_maxage = Vhukale vhuhulwane (nga minetse) ha group objects kha kheshe.
ldap_cache_share_locator_maxsize = Maximum akhaunthu items kha named entry kheshe.
ldap_cache_share_locator_maxage = Named entry kheshe TTL kha minetse.
ldap_cache_timezone_maxsize = Nomboro khulwane ya timezone objects u kheshe.
ldap_cache_zimlet_maxsize = Nomboro khulwane ya zimlet objects u kheshe.
ldap_cache_zimlet_maxage = Vhukale vhuhulwane (nga minetse) ha zimlet objects kha kheshe.
ldap_cache_custom_dynamic_group_membership_maxage_ms = Vhukale vhuhulwane (nga milisekhondi) ha u kheshea which dynamic groups an akhaunthu is a member of ya those groups whose membership is determind using a custom MemberURL.
csrf_filter_domain_allowed_ref_hosts_max_size = Nomboro khulwane ya domain entries kha the CsrfFilter per-domain tendelaedRefererHosts kheshe. Falls back u ldap_kheshe_domain_maxsize kha parsing error.
csrf_filter_domain_allowed_ref_hosts_cache_expiry_mins = Vhukale vhuhulwane (nga minetse) ha entries kha the CsrfFilter per-domain tendelaedRefererHosts kheshe. After expiry, the entry is evicted na re\u1e3dodzhiwaho u bva kha LDAP kha the next request. Falls back u 60 minetse kha parsing error.
mysql_directory = Fhethu ha MySQL installation.
mysql_data_directory = Direk\u1e71ori ine MySQL data should reside.
mysql_errlogfile = MySQL/MariaDB error log.
mysql_socket = Bada i yaho kha MySQL socket ya shumisa by MySQL command line tools.
mysql_pidfile = Faela ine MySQL process id is vhulungwaho.
mysql_mycnf = Bada i yaho kha my.cnf, the MySQL config faela.
mysql_bind_address = Interface kha this host u which MySQL will bind.
mysql_port = Port number kha which MySQL sevha should listen.
mysql_root_password = Password ya MySQL\u2019s built-in \u2018root\u2019 mushumisi, not u be confshumisad na the UNIX root login. Nga u itela u ololofa, nga tshifhinga tsha u thoma database, phasiwede ya random i a bveledzwa, ya vhulungwa kha local config na kha MySQL. Arali ni tshi \u1e71o\u1e13a u shandukisa phasiwede iyi, shumisani mbekanyamushumo ya zmmypasswd ine ya shandukisa phasiwede kha MySQL na kha local config.
mysql_memory_percent = Phesenthe ya system memory that mysql should shumisa. This value is vhulungwaho here ya shumisa by zmmycnf program. U shandukisa tshiimiswa itshi a zwi vhonali nga u \u1e71avhanya kha sevha ya MySQL. Ni \u1e13o tea, nga vhulondi vhuhulu, u bveledza hafhu my.cnf na u thoma hafhu sevha ya MySQL uri tshanduko i thome u shuma.
mysql_innodb_log_buffer_size = Sedzani \u1e3di\u1e45walo \u1e3da MySQL kha innodb_log_buffer_size. This value is vhulungwaho here ya shumisa by zmmycnf program. U shandukisa tshiimiswa itshi a zwi vhonali nga u \u1e71avhanya kha sevha ya MySQL. Ni \u1e13o tea, nga vhulondi vhuhulu, u bveledza hafhu my.cnf na u thoma hafhu sevha ya MySQL uri tshanduko i thome u shuma.
mysql_innodb_log_file_size = Sedzani \u1e3di\u1e45walo \u1e3da MySQL kha innodb_log_faela_size. This value is vhulungwaho here ya shumisa by zmmycnf program. U shandukisa tshiimiswa itshi a zwi vhonali nga u \u1e71avhanya kha sevha ya MySQL. Ni \u1e13o tea, nga vhulondi vhuhulu, u bveledza hafhu my.cnf na u thoma hafhu sevha ya MySQL uri tshanduko i thome u shuma.
mysql_sort_buffer_size = Sedzani \u1e3di\u1e45walo \u1e3da MySQL kha sort_buffer_size. This value is vhulungwaho here ya shumisa by zmmycnf program. U shandukisa tshiimiswa itshi a zwi vhonali nga u \u1e71avhanya kha sevha ya MySQL. Ni \u1e13o tea, nga vhulondi vhuhulu, u bveledza hafhu my.cnf na u thoma hafhu sevha ya MySQL uri tshanduko i thome u shuma.
mysql_read_buffer_size = Sedzani \u1e3di\u1e45walo \u1e3da MySQL kha read_buffer_size. This value is vhulungwaho here ya shumisa by zmmycnf program. U shandukisa tshiimiswa itshi a zwi vhonali nga u \u1e71avhanya kha sevha ya MySQL. Ni \u1e13o tea, nga vhulondi vhuhulu, u bveledza hafhu my.cnf na u thoma hafhu sevha ya MySQL uri tshanduko i thome u shuma.
mysql_backup_retention = Nomboro ya revisions of the mysql database backup u retain.
antispam_mysql_enabled = Shumisani database ya MySQL kha antispam. False nga default.
antispam_backup_retention = Nomboro ya revisions of the antispam database backup u retain.
derby_properties = Bada i yaho kha derby configuration properties faela.
imap_max_consecutive_error = Arali zwi fhira 0, drop the imap khonekisheni if imap_max_consecutive_error value is reached.
imap_inactive_session_cache_size = Ehkheshe: the nomboro khulwane ya inactive IMAP kheshe entries kha disk before eviction.
imap_use_ehcache = Arali ndi true, shumisa Ehkheshe ya IMAP sesheni caching. Otherwise, shumisa disk kheshe.
imap_write_timeout = Vhekanyani the IMAP sesheni write timeout (nio).
imap_write_chunk_size = Size kha bytes of the IMAP write buffer.
imap_thread_keep_alive_time = Tshifhinga tsha default, nga sekhondi, tsha an IMAP thirede.
imap_throttle_ip_limit = Arali zwi fhira 0, maximum IMAP requests/second per IP.
imap_throttle_acct_limit = Arali zwi fhira 0, maximum IMAP requests/second per akhaunthu.
imap_suggested_batch_copy_size = Nomboro ya milaedza u process per batch during IMAP COPY operations.
imap_in_progress_response_thread_pool_size = Max thiredes kha phu\u1e3du ya sending InProgress response u client.
imap_in_progress_response_thread_keep_alive = Tshifhinga nga sekhondi ya thirede u be vhulungwaho i tshi kha \u1e13i shuma before being terminated.
imap_ehcache_heap_size = Nomboro khulwane ya IMAP kheshe entries vhulungwaho kha Ehkheshe heap tier.
imap_ehcache_skip_large_folder = Skips caching of large IMAP folders into Ehkheshe when enabled.
imap_ehcache_folder_max_message_count = Message count threshold above which IMAP folders are not kheshed into Ehkheshe.
nio_imap_enabled = Arali ndi true, enable Jetty non-blocking IO ya IMAP.
nio_pop3_enabled = Arali ndi true, enable Jetty non-blocking IO ya POP3.
postfix_mail_owner = postfix_mail_owner
postfix_setgid_group = postfix_setgid_group
postfix_version = postfix_version
mailboxd_directory = Fhethu ha mailboxd installation.
mailboxd_java_heap_size = Nomboro ya megabytes u be shumisad as the maximum Java heap size (-Xmx) of the JVM running Mailboxd.
mailboxd_java_heap_new_size_percent = Phesenthe ya Java heap size that will be shumisad ya the young generation (-Xmn) of the JVM running Mailboxd.
mailboxd_java_options = JVM options u shumisa when launching Mailboxd.
mailboxd_pidfile = Faela ine process id of Mailboxd JVM is vhulungwaho.
mailboxd_keystore = Fhethu ha keystore data faela.
mailboxd_keystore_password = Password u be shumisad na the KeyManager keystore.
mailboxd_truststore = Fhethu ha truststore data faela.
mailboxd_truststore_password = Password u be shumisad na the TrustManager keystore.
client_ssl_truststore = Fhethu ha truststore data faela shumisad ya client SSL authentication.
client_ssl_truststore_password = Password u be shumisad na the client SSL TrustManager keystore.
mailboxd_output_file = Faela ya u redirect stdout na stderr of sevha to.
mailboxd_output_rotate_interval = Tshifhinga, nga sekhondi, at which mailboxd output faela is rotated. If <= 0, no rotation is performed.
mailboxd_thread_stack_size = Thread stack size ya Mailboxd
ssl_allow_untrusted_certs = Arali ndi true, tendela self-signed SSL certificates.
zimlet_directory = Bada i yaho kha installed Zimlets.
calendar_outlook_compatible_allday_events = Shumisani Outlook-compatible all-day events. False by default.
calendar_entourage_compatible_timezones = Quote TZID parameter kha iCalendar properties, u workaround bug kha MS Entourage. True by default.
calendar_ics_import_full_parse_max_size = During ics import shumisa full parser if ics size is less than or equal u this; larger ics faelas are parsed na callback parser which doesn\u2019t tendela forward references u VTIMEZONE TZID
calendar_canonical_tzid = The timezone id u be returnded as TimeZone.getCanonicalID(). Possible values: "olson","windows","java". "windows" by default.
calendar_cache_enabled = Tendelani calendar kheshe. False by default.
calendar_cache_directory = Root directory of calendar kheshe faelas
calendar_cache_lru_size = Size of memory-kheshe LRU. Cache this many calendar folder kha memory.
calendar_cache_range_month_from = Starting month kha kheshed range. 0 means current month, -1 means last month, etc.
calendar_cache_range_months = Nomboro ya months kha kheshed range
krb5_keytab = Zimbra Kerberos 5 keytab faela location
krb5_debug_enabled = Enabled Kerberos debugging
zimbra_mtareport_max_hosts = Nomboro khulwane ya hosts u include kha daily MTA reports zwo bveledzwaho by zmdailyreport.
zimbra_mtareport_max_recipients = Nomboro ya recipients u list kha daily mta reports.
zimbra_mtareport_max_senders = Nomboro ya senders u list kha daily mta reports.
zimbra_mtareport_max_users = Nomboro khulwane ya mushumisis u include kha daily MTA reports zwo bveledzwaho by zmdailyreport.
zimbra_auth_always_send_refer = Dzulela u rumela murahu a <refer> tag kha an auth response u force a client redirect.
zimbra_admin_service_port = Port ya admin ya default/bootstrap.
zimbra_admin_service_scheme = Sikimu ya protocol ya admin ya default/bootstrap.
zimbra_mail_service_port = Port ya imeili ya default
zimbra_zmprov_default_to_ldap = Arali zmprov defaults u LDAP or SOAP.
zimbra_zmprov_default_soap_server = Default soap sevha ya zmprov u connect to
zmprov_safeguarded_attrs = Mutevhe wa multi-valued provisioning attributes that need u be safe-guarded against replacement
zmprov_tmp_directory = Temporary directory ya zmprov u write binary attribute values u faelas.
zimbra_mailbox_groups = Nomboro ya mailbox groups u distribute new mailboxes to.
debug_mailboxindex_use_new_locking = Shumisani new-style locking ya MailboxIndex
zimbra_class_provisioning = Kilasi ya interface ya provisioning
zimbra_class_accessmanager = Kilasi ya interface ya murangaphan\u1e13a wa access
zimbra_class_mboxmanager = Kilasi ya interface ya murangaphan\u1e13a wa mailbox
zimbra_class_database = Kilasi ya configuration ya database
zimbra_class_store = Kilasi ya interface ya vhuvhulungo ha milaedza
zimbra_class_application = Kilasi ya interface ya application ya Zimbra
zimbra_class_rulerewriterfactory = Kilasi ya interface ya RuleRewriterFactory
zimbra_class_dbconnfactory = Kilasi ya factory ya khonekisheni ya database
zimbra_class_soapsessionfactory= Kilasi ya factory ya sesheni ya Soap
av_notify_user = \u1e12iresi ya imeili ya u rumela milaedza ya vhulanguli i bvaho kha anti-virus na DKIM.
av_notify_domain = Domain ya default kha zwiimiswa zwa amavisd.
data_source_trust_self_signed_certs = Allow self-signed certificates when connecting u a data source over SSL.
data_source_fetch_size = nomboro khulwane ya imap milaedza u FETCH kha each request
data_source_max_literal_mem_size = Maximum literal data size (in bytes) that will be kheshed kha memory. Larger data will be vhulungwaho kha a faela ya tshifhinganyana.
timezone_file = Faela ya iCalendar ine ya sumbedza zwifhinga zwa dzitso zwo \u1e13ivheaho
