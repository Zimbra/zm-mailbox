# local config settings

zimbra_home = Imphandze yekufaka ye-Zimbra kanye nefolda yasekhaya yemsebentisi we-UNIX \u2018zimbra\u2019. Awukwati kuyisa lenye indzawo imphandze yekufaka - ungayintjintji le sethingi.
zimbra_java_home = Indlela leya ku-JDK/J2SDK.
zimbra_log_directory = Ifolda lapho emafayela elogi abhalwa khona.
zimbra_index_directory = Ifolda yemafayela e-index yelibhokisi lemilayeto.
zimbra_store_directory = Ifolda yemilayeto yelibhokisi lemilayeto.
zimbra_db_directory = Ifolda yemafayela edathabheyisi.
zimbra_tmp_directory = Ifolda yemafayela esikhashana.
zimbra_hybrid_blob_mover_enabled = Iseta kutsi sici se-Hybrid Blob Mover sivuliwe yini. Lokumisiwe ngu: false
zimbra_extensions_directory = Ifolda letifolda tangaphansi tayo ticuketse ema-extension.
zimbra_extensions_common_directory = Ifolda lenemafayela e-jar lavamile kuwo onkhe ema-extension.
zimbra_mysql_shutdown_timeout = Sikhatsi sekulindza kutsi inchubo ye-MySQL/MariaDB yelibhokisi lemilayeto ime. Yandisa i-timeout nangabe mysql.server itsatsa sikhatsi lesidze kakhulu kuvala le nchubo.
zimbra_mysql_user = Ligama lemsebentisi le-MySQL lelisetjentiselwa kwakha noma kufinyelela emadathabheyisi nematafula e-zimbra. Leli nguligugu longaliniketa kukhetsa kwe-\u2018-u\u2019 kuhlelo lwekulayini wemiyalo lwe-\u2018mysql\u2019.
zimbra_mysql_password = Iphasiwedi ye-zimbra_mysql_user. Igcinwe ku-local config kuze isetjentiswe yisicelo sestolo ekucinisekiseni.  Nawufuna kutjintja le phasiwedi, sicela usebentise luhlelo lwe-zmmypasswd lolutawutjintja iphasiwedi ku-MySQL naku-local config.
zimbra_ldap_userdn = I-LDAP dn lesetjentiselwa kucinisekisa isicelo sestolo ku-LDAP.
zimbra_ldap_user = Ligama lemsebentisi le-zimbra lelisetjentiselwa kucinisekisa nge-admin AuthRequest.
zimbra_ldap_password = Iphasiwedi ye-zimbra_ldap_userdn. Igcinwe ku-local config kuze isetjentiswe yisicelo sestolo ekucinisekiseni.  Nawufuna kutjintja le phasiwedi, sicela usebentise luhlelo lwe-zmldappasswd lolutawutjintja iphasiwedi ku-LDAP naku-local config.
zimbra_server_hostname = Ligama leliniketiwe lale seva. Kufanele kube nekungena kwe-\u2018server\u2019 lokuhambelanako ku-LDAP - buka imibhalo yemiyalo ye-CreateServer yeluhlelo lwe-zmprov.
zimbra_user = Umsebentisi we-unix we-zimbra inchubo yeseva ye-zimbra lokufanele ishintshele kuwo emalungelo ayo ngemva kwekubopha ema-port lanemalungelo lakhetsekile.
zimbra_uid = I-uid ye-unix ye-zimbra inchubo yeseva ye-zimbra lokufanele ishintshele kuyo emalungelo ayo ngemva kwekubopha ema-port lanemalungelo lakhetsekile.
zimbra_gid = I-gid ye-unix ye-zimbra inchubo yeseva ye-zimbra lokufanele ishintshele kuyo emalungelo ayo ngemva kwekubopha ema-port lanemalungelo lakhetsekile.
zimbra_log4j_properties = Indlela leya kufayela lemaphrophathi ekulungiselela i-log4j.
zimbra_log4j_properties_watch = Sikhawu sekubuka sefayela lemaphrophathi ekulungiselela i-log4j nge-msec.
zimbra_attrs_directory = Ifolda lecuketse emafayela e-*.xml lachaza i-syntax yetimphawu te-LDAP letisetjentiswa yisistimu
localized_msgs_directory = Ifolda yemafayela emilayeto ahunyushiwe.
localized_client_msgs_directory = Ifolda yemafayela emilayeto weklayenti lahunyushiwe.
skins_directory = Ifolda yema-skin.
zimbra_store_sweeper_max_age = Emafayela lamadzala kunalenombolo yeminithi acishwa ngokuzenzakalela ku-ifolda yekungena yesitolo.
zimbra_store_copy_buffer_size_kb = Imisebenti yekukopisha lifayela isebentisa ema-buffer alabukhulu lobu
zimbra_mailbox_galsync_cache = Iseta buningi lobuphezulu be-cache yemaitemu yebakhontakhti ebhokisini lemilayeto le-galsync. Setha ligugu libe okungenani yinombolo yemaitemu yebakhontakhti ebhokisini lemilayeto le-galsync.
zimbra_mailbox_manager_hardref_cache = Inombolo lenkhulu kakhulu yemabhokisi emilayeto latawubanjelwa enkumbulweni ngaphambi kwekutsi mphatsi webhokisi lemilayeto acale kuwavumela kutsi asuswe nge-SoftReference garbage collection.
zimbra_mailbox_active_cache = Bukhulu lobuphezulu be-cache yemaitemu yangaphakathi ye-LRU yelibhokisi lemilayeto nasekunema-session lasebentako.
zimbra_mailbox_inactive_cache = Bukhulu lobuphezulu be-cache yemaitemu yangaphakathi ye-LRU yelibhokisi lemilayeto nalingenawo ema-session lasebentako.
zimbra_mailbox_change_checkpoint_frequency = Imvamisa (ngenombolo yetingucuko) lapho kubhalwa khona ligugu lengucuko leliphakeme le-ZIMBRA.MAILBOX.CHANGE_CHECKPOINT lelibhokisi lemilayeto.
zimbra_index_elasticsearch_url_base = I-URL yesisekelo ye-ElasticSearch REST API.
zimbra_index_threads = Bukhulu be-thread pool ye-batch index
zimbra_reindex_threads = Inombolo lenkhulu kakhulu yema-thread ye-re-index. Ema-thread e-re-index awakahlanganiswa ku-pool.
zimbra_index_disable_perf_counters = Nangabe kungu-false, i-IO yekufundza neyekubhala ye-Lucene iyalandzelwa kuqapha kusebenta kwe-Zimbra. Ligugu lelingu-true licisha kuqapha i-IO ye-Lucene.
zimbra_index_max_readers = Inombolo lenkhulu kakhulu yema-IndexReader lasebenta kanye
zimbra_index_max_writers = Inombolo lenkhulu kakhulu yema-IndexWriter lasebenta kanye
zimbra_index_reader_cache_size = Inombolo lenkhulu kakhulu yema-IndexReader ku-cache ye-index yekusesha
zimbra_index_reader_cache_ttl = Nangabe ingasebenti sikhatsi lesidze kunaleli gugu (imizuzwana), susa i-IndexReader ku-cache
zimbra_index_deferred_items_failure_delay = Ngemuva kwekuhluleka, kubambezeleka lokuncane kakhulu (imizuzwana) emkhatsini wemizamo yekukhipha lilayini lemayitemu langaka-indexwa (lahlehlisiwe)
zimbra_index_lucene_max_terms_per_query = Seta inombolo lenkhulu kakhulu yemagama lavunyelwe kumbuto ngamunye.
zimbra_index_max_transaction_bytes = Nangabe imisebenti ye-index ihlanganiswa ibe kuthengiselana kwe-Mailbox, lobu ngubukhulu lobuphelele lobukhulu kakhulu bema-ayitemu lesitawubuvumela ekuthengiselaneni kunye
zimbra_index_max_transaction_items = Nangabe imisebenti ye-index ihlanganiswa, lena yinombolo lenkhulu kakhulu ye-mail_items lesiyivumela ekuthengiselaneni kunye
zimbra_index_max_pending_deletes = Inombolo lenkhulu kakhulu yekucishwa kwe-index lokusalindzile ngaphambi kwekubuyisa sikhala sediski
zimbra_index_lucene_merge_policy = true kusebentisa i-LogDocMergePolicy, false kusebentisa i-LogByteSizeMergePolicy. I-LogDocMergePolicy ikhetsa tincenye letitawuhlanganiswa ngekwenombolo yemadokhumenti. I-LogByteSizeMergePolicy ikhetsa tincenye letitawuhlanganiswa ngekwebukhulu bato.
zimbra_index_lucene_min_merge = Iseta bukhulu bekuncane kakhulu kwekuhlanganisa be-Lucene ku-Documents noma ku-KB kuya ngemgomo wekuhlanganisa lochazwe ku-zimbra_index_lucene_merge_policy.
zimbra_index_lucene_max_merge = Kubeka bukhulu bekumatanisa lobukhulu kakhulu beLucene ku-Documents noma ku-KB kuya ngenqubomgomo yekumatanisa lechazwe ku-zimbra_index_lucene_merge_policy. Lelinani linquma i-segment lenkhulu kakhulu lengamataniswa naletinye ti-segment.
zimbra_index_lucene_merge_factor = Kukhombisa kutsi ema-index e-segment amataniswa kangaki yi-addDocument(). Ngetinani letincane kusetjentiswa i-RAM lencane ngesikhatsi seku-indeksa, futsi kusesha kuyashesha, kodvwa sivinini seku-indeksa siyancipha. Ngetinani letinkhulu kusetjentiswa i-RAM leningi ngesikhatsi seku-indeksa, futsi nobe kusesha kuba kuhamba kancane, ku-indeksa kuyashesha. Tinani letinkhulu (>10) tihamba kahle ekwakheni i-index ngebatch, kantsi tinani letincane (<10) tilungele ema-index lagcinwa ngekusebentisana ngco.
zimbra_index_lucene_term_index_divisor = Yenta i-subsample yemagama la-indeksiwe layishwa ku-RAM. Ngekubeka loku kuze kube linani > 1 unganciphisa kusetjentiswa kwememori, kodvwa kukhokhwe ngekulibala lokukhulu nakulayishwa lwati lwerekhodi olugcinelwe ligama.
zimbra_index_lucene_use_compound_file = true nangabe i-segment lensha yeLucene kufanele isebentise ifomethi yelifayela lelihlanganisiwe. http://wiki.apache.org/lucene-java/ImproveIndexingSpeed utsi ifomethi yelifayela lelihlanganisiwe kufanele icishwe ukuze kusebente kancono, kodvwa loko kutawukhulisa kakhulu linani lema-file descriptor. Ema-file descriptor angaphela nangabe zimbra_index_lucene_merge_factor likhulu.
zimbra_index_lucene_max_buffered_docs = Linani lelincane kakhulu lemadokhumenti lelidzingekako ngaphambi kwekutsi emadokhumenti labhafariwe asememorini akhishelwe ngaphandle njenge-segment lensha. Tinani letinkhulu tivamise kwenta ku-indeksa kusheshe.
zimbra_index_lucene_ram_buffer_size_kb = I-RAM yebhafa lenkhulu kakhulu yeLucene ku-KB
zimbra_index_lucene_io_impl = Kusetjentiswa kweLucene FSDirectory ekwenteni i-indexing IO. Tinani letingaba khona ngu-nio - Sebentisa i-NIOFSDirectory. Isebentisa i-positional io ye-FileChannel ye-java.nio nangabe ifundza kugwema kusinkhronayiza nakufundvwa efayelini lelifanako. mmap - Sebentisa i-MMapDirectory. Isebentisa i-IO le-memory-mapped nakufundvwa. Kuyinkhetfo lenhle nangabe kunememori yevirtual leningi uma icatsaniswa nebukhulu be-index. simple - Sebentisa i-SimpleFSDirectory. Isebentisa i-java.io.RandomAccessFile. Kusebenta kwayo nangabe kunemisebenti leningi ngasikhatsi sinye akukahle ngobe iyasinkhronayiza uma imicu leminingi ifundza lifayela lelifanako. Nangabe kunganikwanga linani, i-FSDirectory itawukhetsa kusebenta lokuhle kakhulu kuleyo ndzawo.
zimbra_index_rfc822address_max_token_count = Linani lelikhulu kakhulu lema-token emakheli akulowo mfula wema-token welikheli le-RFC822. Lomkhawulo usebenta kuwo onkhe emaheda e-FROM, TO, ne-CC ema-imeyili, kuwo onkhe emakheli e-imeyili e-Emakhontakhti kanye nasensimini ye-Creator yema-Documents.
zimbra_index_rfc822address_max_token_length = Budze lobukhulu kakhulu be-token yelikheli kulowo mfula wema-token welikheli le-RFC822. Lomkhawulo usebenta kuwo onkhe emaheda e-FROM, TO, ne-CC ema-imeyili, kuwo onkhe emakheli e-imeyili e-Emakhontakhti kanye nasensimini ye-Creator yema-Documents.
zimbra_index_wildcard_max_terms_expanded = Kwandziswa lokukhulu kakhulu kwe-wildcard kuthemu ngalinye ngalinye embutweni.
zimbra_galsync_index_reader_cache_size = Linani lelikhulu kakhulu lema-IndexReader kusekheshi ye-index yekusesha ye-GAL. I-index yeLucene ye-akhawunti yekusinkha ye-GAL igcinwa kusekheshi layo yodvwa ngaphandle kwekukhipheka ngekutentekela.
zimbra_spam_report_queue_size = Kuma-Junk/Not Junk Msg/ConvActionRequests, lobukhulu belichungechunge bunciphisa i-workqueue yeseva leyecubungula ema-forward.
zimbra_throttle_op_concurrency = Luhlu lolwehlukaniswe ngemakhoma lwelinani lekusebenta ngasikhatsi sinye kulelinye nelinye lemazinga la-5 ebukhulu bebucayi, kusukela kuleliphakeme kakhulu kuye kuleliphansi kakhulu.
zimbra_im_chat_flush_time = Tingcoco te-IM letivulekile tibhalwa kangaki esitoreni (ngemasekhondi)
zimbra_im_chat_close_time = Iseva italindza sikhatsi lesingakanani (ngemasekhondi) kuvala ema-session e-IM chat langasebenti
zimbra_http_originating_ip_header = Iheda ye-HTTP lekufanele ibukwe kuze kunqunywe likheli le-IP lekucala leliklayenti
zimbra_session_limit_imap = Linani lelikhulu kakhulu letifolda te-IMAP umsebentisi munye langatigcina tivulekile ngasikhatsi sinye
zimbra_session_limit_admin = Linani lelikhulu kakhulu lema-session e-SOAP e-admin umsebentisi munye langawagcina avulekile ngasikhatsi sinye
zimbra_session_limit_soap = Linani lelikhulu kakhulu lema-session e-soap lasebentako ngekwe-akhawunti. Yengeta lelinani ngekucophelela kuze ugweme emaphutsa e-"Too many SOAP sessions\u201d ku-mailbox.log.
zimbra_session_limit_sync = Linani lelikhulu kakhulu lalabalaleli be-sync ngeseshini ngayinye be-ActiveSync. Yengeta lelinani ngekucophelela kuze ugweme emaphutsa e-"Too many SYNCLISTENER sessions" ku-sync.log.
zimbra_session_timeout_soap = Sikhatsi sekuphela ngenxa yekungasebenti (ngemasekhondi) sama-session e-SOAP
zimbra_session_max_pending_notifications = Linani lelikhulu kakhulu leticwayiso letisalindzile letingafakwa eluchungeni kusession ye-SOAP ngaphambi kwekutsi lolo chungechunge luhlantwe bese liklayenti litjelwa kutsi simo salo asisasebenti.
zimbra_converter_enabled_uuencode = Kutsi i-decoder ye-UUENCODE iyasebenta yini nakucutjungulwa imilayeto lebuya esitoreni
zimbra_converter_enabled_tnef = Kutsi i-decoder ye-TNEF iyasebenta yini nakucutjungulwa imilayeto lebuya esitoreni
zimbra_converter_depth_max = Bujule lobukhulu kakhulu bebujule bekuphindzaphindza kwebuncenye be-MIME lapho ema-converter angeke asebente ngaphansi kwabo
zimbra_ssl_enabled = Kutsi i-ssl keystore ilayishwe yini noma cha
stats_img_folder = Idayirekthri yekugcina titfombe tetibalo letikhiqiziwe.
ldap_host = I-host ye-LDAP lefanele isetjentiswe.  Seyiphelelwe sikhatsi - sicela usebentise ldap_url esikhundleni saloko.
ldap_log_level = Lizinga lekuloga le-LDAP
ldap_port = I-port ye-LDAP lefanele isetjentiswe.  Seyiphelelwe sikhatsi - sicela usebentise ldap_url esikhundleni saloko.
ldap_url = Luhlu lwemaseva e-LDAP lotawusetjentiswa yile seva.
ldap_master_url = I-URL ye-LDAP master
ldap_is_master = Ingabe le host iyiseva ye-LDAP master?
ldap_root_password = Libitomfihlo le-LDAP slapd.conf rootdn.  Kute kube lula, ngesikhatsi sekucalisa i-LDAP kukhiqitwa libitomfihlo lelingahleliwe, ligcinwe ku-local config naku-slapd.conf.  Nangabe ufuna kugucula lelibitomfihlo, sicela usebentise luhlelo lwe-zmldappasswd lolutawugucula lelibitomfihlo ku-slapd.conf nakulocal config kokubili.
ldap_connect_timeout = Emamillisecond ngemuva kwalapho umzamo wekuchumana ukhanselwa khona.
ldap_read_timeout = Emamillisecond ngemuva kwalapho umzamo wekufundza ukhanselwa khona.
ldap_deref_aliases = Kutsi ema-alias adereference yini nakuseshwa noma nakuboshwa kudayirekthri yangaphandle. Tinani letisemtsetfweni nguleti: njalo, nhlobo, nakutfola, nakusesha
ldap_connect_pool_master = Kutsi i-JNDI connection pooling isetjentiselwe i-LDAP master yini.
ldap_connect_pool_debug = Kutsi i-LDAP connection pooling idebagiwe yini.
ldap_connect_pool_initsize = Linani lekucala lekuchumana kwe-LDAP lokusebentako lokufanele kufinyelelwe kulo ngesinyatselo.
ldap_connect_pool_maxsize = Linani lelikhulu kakhulu lekuchumana kwe-LDAP lokusebentako nalokungasebenti lokuvumelekile.
ldap_connect_pool_prefsize = Linani lelitsandvwako lekuchumana kwe-LDAP - kubeka kokubili i-maxsize ne-prefsize kulinani lelifanako kugcina i-connection pool isebukhulu lobungagucuki.
ldap_connect_pool_timeout = Emamillisecond esikhatsi sekungasebenti ngaphambi kwekutsi kuchumana lokungasebenti kukhishwe e-pool.
ldap_connect_pool_health_check_on_checkout_enabled = Kutsi kuhlolwa kwemphilo ye-connection pool kutawubitwa yini njalo nakuchumana kutawukhishwa kuze kusetjentiswe. Nangabe kuhlolwa kwemphilo ye-OnCheckout kuvuliwe, kuhlolwa kwemphilo lokwenteka njalo emuva kutawucishwa.
ldap_connect_pool_health_check_interval_millis = Budze besikhatsi ngemamillisecond emkhatsini wekuhlolwa kwemphilo lokwenteka njalo emuva lokubhekiswe ekuchumaneni lokukhona ku-connection pool.
ldap_connect_pool_health_check_max_response_time_millis = Budze besikhatsi lobukhulu kakhulu ngemamillisecond lobufanele buvunyelwe kuze imphendvulo yekuhlolwa kwemphilo ibuye isuke kuseva ye-LDAP.
ldap_replication_password = Libitomfihlo lelisetjentiswa ngumsebentisi we-syncrepl kuze atiinisekise ku-ldap master.
ldap_postfix_password = Libitomfihlo lelisetjentiswa yi-postfix kuze itiinisekise ku-ldap.
ldap_amavis_password = Libitomfihlo lelisetjentiswa yi-amavis kuze itiinisekise ku-ldap.
ldap_starttls_supported = Kutsi iseva ye-LDAP iyasisekela yini sento se-startTLS.
ldap_require_tls = Nobe i-TLS iyafuneka emaklayentini e-LDAP.
ldap_cache_account_maxsize = Linani lelikhulu kakhulu letintfo telikhawunti lekufanele tigcinwe ku-cache.
ldap_cache_account_maxage = Budzala lobukhulu kakhulu (ngemaminithi) betintfo telikhawunti ku-cache.
ldap_cache_cos_maxsize = Linani lelikhulu kakhulu letintfo te-cos lekufanele tigcinwe ku-cache.
ldap_cache_cos_maxage = Budzala lobukhulu kakhulu (ngemaminithi) betintfo te-cos ku-cache.
ldap_cache_domain_maxsize = Linani lelikhulu kakhulu letintfo tedomeyini lekufanele tigcinwe ku-cache
ldap_cache_domain_maxage = Budzala lobukhulu kakhulu (ngemaminithi) betintfo tedomeyini ku-cache.
ldap_cache_mime_maxage = Budzala lobukhulu kakhulu, ngemaminithi, betintfo te-MIME ku-cache.
ldap_cache_server_maxsize = Linani lelikhulu kakhulu letintfo teva lekufanele tigcinwe ku-cache
ldap_cache_server_maxage = Budzala lobukhulu kakhulu (ngemaminithi) betintfo telicembu ku-cache.
ldap_cache_share_locator_maxsize = Linani lelikhulu kakhulu letintfo telikhawunti ku-cache yekufaka lokuneligama.
ldap_cache_share_locator_maxage = I-TTL ye-cache yekufaka lokuneligama ngemaminithi.
ldap_cache_timezone_maxsize = Linani lelikhulu kakhulu letintfo tesikhatsi sendzawo lekufanele tigcinwe ku-cache.
ldap_cache_zimlet_maxsize = Linani lelikhulu kakhulu letintfo te-Zimlet lekufanele tigcinwe ku-cache.
ldap_cache_zimlet_maxage = Budzala lobukhulu kakhulu (ngemaminithi) betintfo te-Zimlet ku-cache.
ldap_cache_custom_dynamic_group_membership_maxage_ms = Budzala lobukhulu kakhulu (ngema-millisecond) bekugcina ku-cache kutsi nguwaphi emacembu ladayinamiki likhawunti leliwulunga kuwo, kulawo macembu lapho bulunga bawo buncunywa ngekusebentisa i-MemberURL yangokwezifiso.
csrf_filter_domain_allowed_ref_hosts_max_size = Linani lelikhulu kakhulu lekufakwa kwedomeyini ku-cache ye-CsrfFilter allowedRefererHosts yedomeyini ngayinye. Kubuyela ku-ldap_cache_domain_maxsize nangabe kuba neliphutsa lekuphasa umbhalo.
csrf_filter_domain_allowed_ref_hosts_cache_expiry_mins = Budzala lobukhulu kakhulu (ngemaminithi) bekufakwa ku-cache ye-CsrfFilter allowedRefererHosts yedomeyini ngayinye. Emva kwekuphelelwa sikhatsi, lokufakiwe kuyakhishwa kuphindze kulayishwe kabusha ku-LDAP esicelweni lesilandzelako. Kubuyela kumaminithi la-60 nangabe kuba neliphutsa lekuphasa umbhalo.
mysql_directory = Indzawo yekufakwa kwe-MySQL.
mysql_data_directory = Idayirekthri lapho idatha ye-MySQL kufanele ibe khona.
mysql_errlogfile = Ilogi yemaphutsa ye-MySQL/MariaDB.
mysql_socket = Indlela eya ku-socket ye-MySQL lezosetjentiswa emathuluzini elayini wemiyalo ye-MySQL.
mysql_pidfile = Lifayela lapho kugcinwa khona i-ID yenchubo ye-MySQL.
mysql_mycnf = Indlela eya ku-my.cnf, lifayela lekuhlelwa kwe-MySQL.
mysql_bind_address = I-interface kulomphatsi lapho i-MySQL itawubopha khona.
mysql_port = Inombolo yephothi lapho iseva ye-MySQL kufanele ilalele khona.
mysql_root_password = Libitomfihlo lemsebentisi we-'root' lowakhelwe ngekhatsi ku-MySQL, lingadidaniswa nekungena kwe-UNIX root. Njengekusita, ngesikhatsi sekucalisa idathabheyisi kukhiqitwa libitomfihlo lelingahleliwe, ligcinwe ekuhlelweni kwasekhaya nase-MySQL. Nangabe ufuna kugucula lelibitomfihlo, sicela usebentise luhlelo lwe-zmmypasswd lolutawugucula lelibitomfihlo kokubili ku-MySQL nasekuhlelweni kwasekhaya.
mysql_memory_percent = Liphesenti lememori yesistimu lekufanele lisetjentiswe yi-mysql. Lelivelu ligcinwe lapha kute lisetjentiswe luhlelo lwe-zmmycnf. Kugucula lesi silungiselelo akubonakali masinyane kuseva ye-MySQL. Kutawudzingeka kutsi, ngekucaphela lokukhulu, uphindze ukhiqize i-my.cnf bese ucala kabusha iseva ye-MySQL kuze lolu shintjo lusebente.
mysql_innodb_log_buffer_size = Buka imibhalo ye-MySQL mayelana ne-innodb_log_buffer_size. Lelivelu ligcinwe lapha kute lisetjentiswe luhlelo lwe-zmmycnf. Kugucula lesi silungiselelo akubonakali masinyane kuseva ye-MySQL. Kutawudzingeka kutsi, ngekucaphela lokukhulu, uphindze ukhiqize i-my.cnf bese ucala kabusha iseva ye-MySQL kuze lolu shintjo lusebente.
mysql_innodb_log_file_size = Buka imibhalo ye-MySQL mayelana ne-innodb_log_file_size. Lelivelu ligcinwe lapha kute lisetjentiswe luhlelo lwe-zmmycnf. Kugucula lesi silungiselelo akubonakali masinyane kuseva ye-MySQL. Kutawudzingeka kutsi, ngekucaphela lokukhulu, uphindze ukhiqize i-my.cnf bese ucala kabusha iseva ye-MySQL kuze lolu shintjo lusebente.
mysql_sort_buffer_size = Buka imibhalo ye-MySQL mayelana ne-sort_buffer_size. Lelivelu ligcinwe lapha kute lisetjentiswe luhlelo lwe-zmmycnf. Kugucula lesi silungiselelo akubonakali masinyane kuseva ye-MySQL. Kutawudzingeka kutsi, ngekucaphela lokukhulu, uphindze ukhiqize i-my.cnf bese ucala kabusha iseva ye-MySQL kuze lolu shintjo lusebente.
mysql_read_buffer_size = Buka imibhalo ye-MySQL mayelana ne-read_buffer_size. Lelivelu ligcinwe lapha kute lisetjentiswe luhlelo lwe-zmmycnf. Kugucula lesi silungiselelo akubonakali masinyane kuseva ye-MySQL. Kutawudzingeka kutsi, ngekucaphela lokukhulu, uphindze ukhiqize i-my.cnf bese ucala kabusha iseva ye-MySQL kuze lolu shintjo lusebente.
mysql_backup_retention = Linani lema-revision ekhophi yekusekela yedathabheyisi ye-mysql lekufanele agcinwe.
antispam_mysql_enabled = Sebentisa idathabheyisi ye-mysql ku-antispam. False iyidifolthi.
antispam_backup_retention = Linani lema-revision ekhophi yekusekela yedathabheyisi ye-antispam lekufanele agcinwe.
derby_properties = Indlela eya kufayela letakhiwo tekuhlelwa kwe-derby.
imap_max_consecutive_error = Nangabe kukhulu kuno-0, ncamula kuchumana kwe-imap nangabe kufinyelelwa kuvelu ye-imap_max_consecutive_error.
imap_inactive_session_cache_size = Ehcache: linani lelikhulu kakhulu lekufakwa ku-cache ye-IMAP lengasebenti kudiski ngaphambi kwekukhishwa.
imap_use_ehcache = Nangabe kuyiqiniso, sebentisa i-Ehcache ekugcineni ku-cache kweseshini ye-IMAP. Nakungenjalo, sebentisa i-cache yediski.
imap_write_timeout = Setha sikhatsi sekuphela sekubhala seseshini ye-IMAP (nio).
imap_write_chunk_size = Bukhulu nge-emabhayithi bebhafa yekubhala ye-IMAP.
imap_thread_keep_alive_time = Budze besikhatsi sedifolthi, ngemasekhondi, se-thread ye-IMAP.
imap_throttle_ip_limit = Nangabe kukhulu kuno-0, linani lelikhulu kakhulu leticelo te-IMAP ngomzuzwana ku-IP ngayinye.
imap_throttle_acct_limit = Nangabe kukhulu kuno-0, linani lelikhulu kakhulu leticelo te-IMAP ngomzuzwana kulikhawunti ngayinye.
imap_suggested_batch_copy_size = Linani lemilayeto lelicutshungulwa kubhetji ngayinye ngesikhatsi semisebenti ye-IMAP COPY.
imap_in_progress_response_thread_pool_size = Linani lelikhulu kakhulu lema-thread ephulini yekutfumela imphendvulo ye-InProgress kuklayenti.
imap_in_progress_response_thread_keep_alive = Sikhatsi ngemasekhondi sekutsi i-thread igcinwe iphila ngaphambi kwekucedvwa kwayo.
imap_ehcache_heap_size = Linani lelikhulu kakhulu lekufakwa ku-cache ye-IMAP lokugcinwe esigabeni se-heap se-Ehcache.
imap_ehcache_skip_large_folder = Nangabe kuniketiwe, yeqa kugcinwa ku-Ehcache ku-cache kwema-folda e-IMAP lamakhulu.
imap_ehcache_folder_max_message_count = Umkhawulo wekubalwa kwemilayeto longenhla kwawo emafolda e-IMAP awagcinwa ku-Ehcache ku-cache. 
nio_imap_enabled = Nangabe kuliciniso, vula i-Jetty non-blocking IO ye-IMAP.
nio_pop3_enabled = Nangabe kuliciniso, vula i-Jetty non-blocking IO ye-POP3.
postfix_mail_owner = postfix_mail_owner
postfix_setgid_group = postfix_setgid_group
postfix_version = postfix_version
mailboxd_directory = Indzawo yekufakwa kwe-mailboxd.
mailboxd_java_heap_size = Inani lema-megabyte lelitawusetjentiswa njengebukhulu lobukhulu be-Java heap (-Xmx) be-JVM lechuba i-Mailboxd.
mailboxd_java_heap_new_size_percent = Iphesenti lebukhulu be-Java heap lelitawusetjentiswa ku-young generation (-Xmn) ye-JVM lechuba i-Mailboxd.
mailboxd_java_options = Tintfo tekutikhetsela te-JVM letisetjentiswako nawucalisa i-Mailboxd.
mailboxd_pidfile = Lifayela lapho kugcinwa khona i-process id ye-JVM ye-Mailboxd.
mailboxd_keystore = Indzawo yelifayela ledatha ye-keystore.
mailboxd_keystore_password = Libitophawu lelitawusetjentiswa ne-KeyManager keystore.
mailboxd_truststore = Indzawo yelifayela ledatha ye-truststore.
mailboxd_truststore_password = Libitophawu lelitawusetjentiswa ne-TrustManager keystore.
client_ssl_truststore = Indzawo yelifayela ledatha ye-truststore lelisetjentiselwa kucinisekisa i-SSL yeklayenti.
client_ssl_truststore_password = Libitophawu lelitawusetjentiswa ne-keystore ye-SSL TrustManager yeklayenti.
mailboxd_output_file = Lifayela lokuphambukisela kulo i-stdout ne-stderr yeseva.
mailboxd_output_rotate_interval = Sikhatsi, ngemasekhondi, lapho lifayela lekukhipha le-mailboxd lijikiswa khona. Nangabe <= 0, akukho kujikiswa lokwentiwako.
mailboxd_thread_stack_size = Bukhulu be-thread stack be-Mailboxd
ssl_allow_untrusted_certs = Nangabe kuliciniso, vumela titifiketi te-SSL letitisayine tona.
zimlet_directory = Indlela leya kuma-Zimlet lafakiwe.
calendar_outlook_compatible_allday_events = Sebentisa imicimbi yelilanga lonkhe levisisana ne-Outlook. False ngekwekuzenzakalela.
calendar_entourage_compatible_timezones = Faka timphawu tekucaphuna kupharamitha ye-TZID etintfweni te-iCalendar, kuze kugwenywe liphutsa leliku-MS Entourage. True ngekwekuzenzakalela.
calendar_ics_import_full_parse_max_size = Ngesikhatsi sekungenisa i-ics, sebentisa i-parser lephelele nangabe bukhulu be-ics buncane noma bulingana naloku; emafayela e-ics lamakhulu ahlaziywa nge-callback parser lengavumeli tinkhomba letiya embili ku-VTIMEZONE TZID
calendar_canonical_tzid = I-id yendzawo yesikhatsi letawubuyiselwa njenge-TimeZone.getCanonicalID(). Emanani langaba khona: "olson","windows","java". "windows" ngekwekuzenzakalela.
calendar_cache_enabled = Vula i-cache yelikhalenda. False ngekwekuzenzakalela.
calendar_cache_directory = Umkhombandlela wesisekelo wemafayela e-cache yelikhalenda
calendar_cache_lru_size = Bukhulu be-LRU ye-memory-cache. Gcina lelinani letifolda telikhalenda ememori.
