#license notification email for exceeding usage count for feature
licenseFeaureOnHoldNotifierSubject = Sexwayiso Sesistimu se-Zimbra: Umkhawulo wekusetjentiswa kwetici wecisiwe udlulwe
licenseFeaureOnHoldNotifierBodyText=Inani lema-akhawunti lelinelayisensi selifinyelelwe noma ledluliwe kuletici:\n{0}\nNinganciphisa kusebentisa kwebasebentisi labakhona noma nenyuse umkhawulo welayisensi yetici.\n\nKute wenyuse umkhawulo welayisensi yetici, sicela utsintsane ne-Zimbra Sales ku sales@zimbra.com.\nKute uphatse kwabelwa kwetici telikhawunti, sicela ungene ku-Admin Portal.\n\nSicela unake loku lokulandzelako:\n1. Utawuchubeka utfola lesicwayiso emalanga la-{1,number,integer} kusukela elangeni lekweca kusebentisa.\n2. Ngeke ukhone kuvumela lesici lesisetjentiswe kakhulu kunoma nguwaphi ema-akhawunti.\n3. Nangabe ungatsatsi sinyatselo kulesici lesisetjentiswe kakhulu, lesici sitawuvalelwa basebentisi kuze sehle ngaphansi kwemkhawulo welayisensi.\n\nNgekutinikela,\nZimbra Support
licenseFeaureOnHoldNotifierBodyHtml=<div style="font-family:sans-serif;">Inani lema-akhawunti lelinelayisensi selifinyelelwe noma ledluliwe kuletici:<br>{0}<br>Ninganciphisa kusebentisa kwebasebentisi labakhona noma nenyuse umkhawulo welayisensi yetici.<br><br>Kute wenyuse umkhawulo welayisensi yetici, sicela utsintsane ne-Zimbra Sales ku <b>sales@zimbra.com</b>.<br>Kute uphatse kwabelwa kwetici telikhawunti, sicela ungene ku-Admin Portal.<br><br>Sicela unake loku lokulandzelako:<br>1. Utawuchubeka utfola lesicwayiso emalanga la-{1,number,integer} kusukela elangeni lekweca kusebentisa.<br>2. Ngeke ukhone kuvumela lesici lesisetjentiswe kakhulu kunoma nguwaphi ema-akhawunti.<br>3. Nangabe ungatsatsi sinyatselo kulesici lesisetjentiswe kakhulu, lesici sitawuvalelwa basebentisi kuze sehle ngaphansi kwemkhawulo welayisensi.<br><br>Ngekutinikela,<br>Zimbra Support</div>

