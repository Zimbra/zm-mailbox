licenseFeaureOnHoldNotifierSubject = Tahadhari ya Mfumo wa Zimbra: Kikomo cha matumizi ya vipengele kimepitwa
licenseFeaureOnHoldNotifierBodyText = Idadi iliyoruhusiwa kwa leseni ya akaunti imefikiwa au imepitwa kwa vipengele vifuatavyo:\n{0}\nUnaweza kupunguza matumizi ya watumiaji waliopo au kuongeza kikomo cha leseni ya kipengele.\n\nIli kuongeza kikomo cha leseni ya kipengele, tafadhali wasiliana na Mauzo ya Zimbra kupitia sales@zimbra.com.\nIli kusimamia ugawaji wa vipengele vya akaunti, tafadhali ingia kwenye Admin Portal.\n\nTafadhali zingatia yafuatayo:\n1. Utaendelea kupokea arifa kwa siku {1,number,integer} kuanzia tarehe ambayo matumizi yalipita kikomo.\n2. Hutaweza kuwezesha kipengele kilichotumika kupita kiasi kwa akaunti yoyote.\n3. Ikiwa hutachukua hatua yoyote kuhusu kipengele kilichotumika kupita kiasi, kipengele hicho kitazimwa kwa watumiaji ili kiwe ndani ya kikomo cha leseni.\n\nKwa heshima,\nZimbra Support
licenseFeaureOnHoldNotifierBodyHtml = <div style="font-family:sans-serif;">Idadi iliyoruhusiwa kwa leseni ya akaunti imefikiwa au imepitwa kwa vipengele vifuatavyo:<br>{0}<br>Unaweza kupunguza matumizi ya watumiaji waliopo au kuongeza kikomo cha leseni ya kipengele.<br><br>Ili kuongeza kikomo cha leseni ya kipengele, tafadhali wasiliana na Mauzo ya Zimbra kupitia <b>sales@zimbra.com</b>.<br>Ili kusimamia ugawaji wa vipengele vya akaunti, tafadhali ingia kwenye Admin Portal.<br><br>Tafadhali zingatia yafuatayo:<br>1. Utaendelea kupokea arifa kwa siku {1,number,integer} kuanzia tarehe ambayo matumizi yalipita kikomo.<br>2. Hutaweza kuwezesha kipengele kilichotumika kupita kiasi kwa akaunti yoyote.<br>3. Ikiwa hutachukua hatua yoyote kuhusu kipengele kilichotumika kupita kiasi, kipengele hicho kitazimwa kwa watumiaji ili kiwe ndani ya kikomo cha leseni.<br><br>Kwa heshima,<br>Zimbra Support</div>
