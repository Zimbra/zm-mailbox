zimbra_mailbox_galsync_cache = Huamua kiwango cha juu cha cache ya vipengee vya mawasiliano ya kisanduku cha galsync. Weka thamani iwe angalau idadi ya vipengee vya mawasiliano katika kisanduku cha galsync.
zimbra_mailbox_manager_hardref_cache = Idadi ya juu ya visanduku vya barua vitakavyowekwa kwenye kumbukumbu kabla ya meneja wa kisanduku cha barua kuanza kuruhusu vifutwe kupitia ukusanyaji taka wa SoftReference.
zimbra_mailbox_active_cache = Ukubwa wa juu wa cache ya ndani ya LRU ya vipengee ya kisanduku cha barua wakati kuna vikao vinavyotumika.
zimbra_mailbox_inactive_cache = Ukubwa wa juu wa cache ya ndani ya LRU ya vipengee ya kisanduku cha barua wakati hakina vikao vinavyotumika.
zimbra_mailbox_change_checkpoint_frequency = Marudio (kwa idadi ya mabadiliko) ambayo thamani ya mabadiliko ya highwater ya ZIMBRA.MAILBOX.CHANGE_CHECKPOINT ya kisanduku cha barua huandikwa.
zimbra_index_elasticsearch_url_base = URL ya msingi ya ElasticSearch REST API.
zimbra_index_threads = Ukubwa wa dimbwi la nyuzi kwa batch index
zimbra_reindex_threads = Idadi ya juu ya nyuzi za re-index. Nyuzi za re-index haziwekwi kwenye dimbwi.
zimbra_index_disable_perf_counters = Ikiwa false, IO za kusoma na kuandika za Lucene hufuatiliwa na ufuatiliaji wa utendaji wa Zimbra. Thamani ya true huzima ufuatiliaji wa IO wa Lucene.
zimbra_index_max_readers = Idadi ya juu ya IndexReaders zinazoweza kutumika kwa wakati mmoja
zimbra_index_max_writers = Idadi ya juu ya IndexWriters zinazoweza kutumika kwa wakati mmoja
zimbra_index_reader_cache_size = Idadi ya juu ya IndexReaders katika cache ya search index
zimbra_index_reader_cache_ttl = Ikiwa haijatumiwa kwa muda mrefu zaidi ya thamani hii (sekunde), ondoa IndexReader kutoka kwenye cache
zimbra_index_deferred_items_failure_delay = Baada ya hitilafu, ucheleweshaji wa chini kabisa (sekunde) kati ya majaribio ya kusafisha foleni ya vipengee visivyo na index (deferred)
zimbra_index_lucene_max_terms_per_query = Weka idadi ya juu ya terms zinazoruhusiwa kwa kila query.
zimbra_index_max_transaction_bytes = Wakati operesheni za index zinapowekwa kwa mafungu kwenye transaction ya Mailbox, huu ndio ukubwa wa juu wa jumla wa vipengee tutakaoruhusu katika transaction moja
zimbra_index_max_transaction_items = Wakati operesheni za index zinawekwa kwa mafungu, hii ndiyo idadi ya juu ya mail_items tunazoruhusu katika transaction moja
zimbra_index_max_pending_deletes = Idadi ya juu ya ufutaji wa index unaosubiri kabla ya kurejesha nafasi ya diski
zimbra_index_lucene_merge_policy = Tumia LogDocMergePolicy ikiwa true, na LogByteSizeMergePolicy ikiwa false. LogDocMergePolicy huchagua segments za kuunganisha kulingana na idadi ya hati. LogByteSizeMergePolicy huchagua segments za kuunganisha kulingana na ukubwa wake.
zimbra_index_lucene_min_merge = Huamua ukubwa wa chini kabisa wa merge wa Lucene katika Documents au KB kutegemea merge policy iliyobainishwa katika zimbra_index_lucene_merge_policy.
zimbra_index_lucene_max_merge = Huamua ukubwa wa juu kabisa wa merge wa Lucene katika Documents au KB kutegemea merge policy iliyobainishwa katika zimbra_index_lucene_merge_policy. Thamani hii huamua segment kubwa zaidi inayoweza kuunganishwa na segments nyingine.
zimbra_index_lucene_merge_factor = Ni mara ngapi faharasa za segment huunganishwa na addDocument(). Kwa thamani ndogo, RAM hutumika kidogo wakati wa indexing, na utafutaji ni wa haraka zaidi, lakini kasi ya indexing ni ndogo. Kwa thamani kubwa, RAM hutumika zaidi wakati wa indexing, na ingawa utafutaji ni wa polepole, indexing ni ya haraka zaidi. Thamani kubwa (>10) ni bora kwa uundaji wa batch index, na ndogo (<10) kwa faharasa zinazodumishwa kwa maingiliano.
zimbra_index_lucene_term_index_divisor = Huchukua sampuli ndogo za indexed terms zinazopakiwa kwenye RAM. Kwa kuweka hii kuwa thamani > 1 unaweza kupunguza matumizi ya kumbukumbu kwa gharama ya latency kubwa zaidi wakati wa kupakia taarifa ya rekodi iliyohifadhiwa kwa term.
zimbra_index_lucene_use_compound_file = true ikiwa segment mpya ya Lucene inapaswa kutumia muundo wa compound file. http://wiki.apache.org/lucene-java/ImproveIndexingSpeed inasema uzime muundo wa compound file kwa utendaji bora, lakini hilo litaongeza sana idadi ya file descriptors. File descriptors zinaweza kuisha ikiwa zimbra_index_lucene_merge_factor ni kubwa.
zimbra_index_lucene_max_buffered_docs = Idadi ya chini ya hati zinazohitajika kabla hati zilizowekwa kwenye kumbukumbu kuflushiwa kama segment mpya. Thamani kubwa kwa kawaida huleta indexing ya haraka.
zimbra_index_lucene_ram_buffer_size_kb = Lucene Max Buffered RAM katika KB
zimbra_index_lucene_io_impl = Utekelezaji wa Lucene FSDirectory unaotumika kwa indexing IO. Thamani zinazowezekana nio - Tumia NIOFSDirectory. Hutumia positional io ya FileChannel ya java.nio wakati wa kusoma ili kuepuka synchronization wakati wa kusoma kutoka faili ileile. mmap - Tumia MMapDirectory. Hutumia memory-mapped IO wakati wa kusoma. Ni chaguo zuri ikiwa kuna kumbukumbu pepe ya kutosha kulinganisha na ukubwa wa index. simple - Tumia SimpleFSDirectory. Hutumia java.io.RandomAccessFile. Ina utendaji dhaifu wa concurrent kwa sababu hufanya synchronization wakati nyuzi nyingi zinasoma faili ileile. Ikiwa hakuna thamani iliyotolewa, FSDirectory itachagua utekelezaji bora kwa mazingira husika.
zimbra_index_rfc822address_max_token_count = Idadi ya juu ya token za anwani katika mtiririko wa token wa anwani ya RFC822. Kikomo hiki kinatumika kwa vichwa vyote vya FROM, TO, na CC vya barua pepe, anwani zote za barua pepe za Anwani, na uga wa Creator kwa Documents.
zimbra_index_rfc822address_max_token_length = Urefu wa juu wa token kwa anwani katika mtiririko wa token wa anwani ya RFC822. Kikomo hiki kinatumika kwa vichwa vyote vya FROM, TO, na CC vya barua pepe, anwani zote za barua pepe za Anwani, na uga wa Creator kwa Documents.
zimbra_index_wildcard_max_terms_expanded = Idadi ya juu ya wildcard expansions kwa kila term binafsi katika query.
zimbra_galsync_index_reader_cache_size = Idadi ya juu ya IndexReaders katika cache ya search index ya GAL. Faharasa ya Lucene ya akaunti ya GAL sync huhifadhiwa kando bila eviction ya kiotomatiki.
zimbra_spam_report_queue_size = Kwa Junk/Not Junk Msg/ConvActionRequests, ukubwa huu wa foleni hupunguza foleni ya kazi ya seva kwa ajili ya kuchakata forwards.
zimbra_throttle_op_concurrency = Orodha ya concurrency values zilizotenganishwa kwa koma kwa kila moja ya viwango 5 vya kipaumbele kwa mpangilio kutoka kipaumbele cha juu hadi cha chini
zimbra_im_chat_flush_time = Ni mara ngapi (sekunde) mazungumzo ya IM yaliyo wazi huandikwa kwenye store
zimbra_im_chat_close_time = Seva itasubiri kwa muda gani (sekunde) kabla ya kufunga vikao vya IM visivyotumika
zimbra_http_originating_ip_header = HTTP header ya kuangalia ili kubaini anwani ya IP ya asili ya mteja
zimbra_session_limit_imap = Idadi ya juu ya folda za IMAP ambazo mtumiaji mmoja anaweza kuwa nazo wazi kwa wakati mmoja
zimbra_session_limit_admin = Idadi ya juu ya vikao vya admin SOAP ambavyo mtumiaji mmoja anaweza kuwa navyo wazi kwa wakati mmoja
zimbra_session_limit_soap = Idadi ya juu ya vikao vya soap vinavyotumika kwa kila akaunti. Ongeza thamani hii kwa uangalifu ili kuepuka hitilafu za "Too many SOAP sessions" katika mailbox.log.
zimbra_session_limit_sync = Idadi ya juu ya wasikilizaji wa sync kwa kila kikao kwa ActiveSync. Ongeza thamani hii kwa uangalifu ili kuepuka hitilafu za "Too many SYNCLISTENER sessions" katika sync.log.
zimbra_session_timeout_soap = Muda wa kukoma bila shughuli (kwa sekunde) kwa vikao vya SOAP
zimbra_session_max_pending_notifications = Idadi ya juu ya arifa zinazosubiri zinazoweza kuwekwa foleni katika kikao cha SOAP kabla foleni haijasafishwa na mteja kuambiwa hali yake si halali
zimbra_converter_enabled_uuencode = Ikiwa decoder ya UUENCODE itaendeshwa wakati wa kuchanganua ujumbe kutoka store
zimbra_converter_enabled_tnef = Ikiwa decoder ya TNEF itaendeshwa wakati wa kuchanganua ujumbe kutoka store
zimbra_converter_depth_max = Kina cha recursive MIME part ambacho chini yake converters hazitafanya kazi
zimbra_ssl_enabled = Ikiwa utapakia ssl keystore au la
stats_img_folder = Saraka ya kuhifadhi picha za takwimu zinazozalishwa.
ldap_host = Host ya LDAP ya kutumia.  Imeacha kutumika - tafadhali tumia ldap_url badala yake.
ldap_log_level = Kiwango cha uandishi kumbukumbu cha LDAP
ldap_port = Port ya LDAP ya kutumia.  Imeacha kutumika - tafadhali tumia ldap_url badala yake.
ldap_url = Orodha ya seva za LDAP za kutumiwa na seva hii.
ldap_master_url = URL ya LDAP master.
ldap_is_master = Je, host hii ni seva kuu ya LDAP?
ldap_root_password = Nenosiri la rootdn ya LDAP slapd.conf.  Kwa urahisi, wakati wa kuanzisha LDAP nenosiri la nasibu hutengenezwa, kuhifadhiwa katika usanidi wa ndani na katika slapd.conf.  Ikiwa unataka kubadilisha nenosiri hili, tafadhali tumia programu ya zmldappasswd ambayo itabadilisha nenosiri katika slapd.conf na pia katika usanidi wa ndani.
ldap_connect_timeout = Milliseconds ambazo baada yake jaribio la muunganisho hukatizwa.
ldap_read_timeout = Milliseconds ambazo baada yake jaribio la kusoma hukatizwa.
ldap_deref_aliases = Ikiwa aliases zitaondolewa rejea wakati wa kutafuta au kuunganisha na saraka ya nje. Thamani halali ni: always, never, finding, searching
ldap_connect_pool_master = Ikiwa utatumia JNDI connection pooling kwa LDAP master.
ldap_connect_pool_debug = Ikiwa utadebug LDAP connection pooling.
ldap_connect_pool_initsize = Idadi ya awali ya miunganisho inayotumika ya LDAP ya kuongeza hadi.
ldap_connect_pool_maxsize = Idadi ya juu ya miunganisho ya LDAP inayotumika na isiyotumika inayoruhusiwa.
ldap_connect_pool_prefsize = Idadi inayopendelewa ya miunganisho ya LDAP - kuweka maxsize na prefsize kuwa thamani ileile hudumisha connection pool katika ukubwa usiobadilika.
ldap_connect_pool_timeout = Milliseconds za muda wa kutotumika kabla muunganisho usiotumika haujatolewa kutoka kwenye pool.
ldap_connect_pool_health_check_on_checkout_enabled = Ikiwa ukaguzi wa afya wa connection pool utaitwa kila muunganisho unapochukuliwa kwa matumizi. Ikiwa ukaguzi wa afya wa OnCheckout umewezeshwa, ukaguzi wa mara kwa mara wa nyuma utazimwa.
ldap_connect_pool_health_check_interval_millis = Muda kwa milliseconds kati ya ukaguzi wa mara kwa mara wa afya dhidi ya miunganisho inayopatikana katika connection pool.
ldap_connect_pool_health_check_max_response_time_millis = Muda wa juu kwa milliseconds unaopaswa kuruhusiwa kwa jibu la ukaguzi wa afya kutoka kwa seva ya LDAP.
ldap_replication_password = Nenosiri linalotumiwa na mtumiaji wa syncrepl kujithibitisha kwa ldap master.
ldap_postfix_password = Nenosiri linalotumiwa na postfix kujithibitisha kwa ldap.
ldap_amavis_password = Nenosiri linalotumiwa na amavis kujithibitisha kwa ldap.
ldap_starttls_supported = Ikiwa seva ya LDAP inaunga mkono operesheni ya startTLS.
ldap_require_tls = Ikiwa TLS inahitajika kwa wateja wa LDAP.
ldap_cache_account_maxsize = Idadi ya juu ya objekti za akaunti za kuhifadhi kwenye cache.
ldap_cache_account_maxage = Umri wa juu (kwa dakika) wa objekti za akaunti katika cache.
ldap_cache_cos_maxsize = Idadi ya juu ya objekti za cos za kuhifadhi kwenye cache.
ldap_cache_cos_maxage = Umri wa juu (kwa dakika) wa objekti za cos katika cache.
ldap_cache_domain_maxsize = Idadi ya juu ya objekti za domain za kuhifadhi kwenye cache
ldap_cache_domain_maxage = Umri wa juu (kwa dakika) wa objekti za domain katika cache.
ldap_cache_mime_maxage = Umri wa juu, kwa dakika, wa objekti za MIME katika cache.
ldap_cache_server_maxsize = Idadi ya juu ya objekti za seva za kuhifadhi kwenye cache
ldap_cache_server_maxage = Umri wa juu (kwa dakika) wa objekti za group katika cache.
ldap_cache_share_locator_maxsize = Idadi ya juu ya vipengee vya akaunti katika cache ya named entry.
ldap_cache_share_locator_maxage = TTL ya cache ya named entry kwa dakika.
ldap_cache_timezone_maxsize = Idadi ya juu ya objekti za timezone za kuhifadhi kwenye cache.
ldap_cache_zimlet_maxsize = Idadi ya juu ya objekti za zimlet za kuhifadhi kwenye cache.
ldap_cache_zimlet_maxage = Umri wa juu (kwa dakika) wa objekti za zimlet katika cache.
ldap_cache_custom_dynamic_group_membership_maxage_ms = Umri wa juu (kwa milliseconds) wa kuhifadhi kwenye cache ni dynamic groups zipi ambazo akaunti ni mwanachama wake kwa makundi yale ambayo uanachama wake huamuliwa kwa kutumia MemberURL maalum.
csrf_filter_domain_allowed_ref_hosts_max_size = Idadi ya juu ya entries za domain katika cache ya per-domain allowedRefererHosts ya CsrfFilter. Hurudi kwenye ldap_cache_domain_maxsize ikiwa kuna hitilafu ya parsing.
csrf_filter_domain_allowed_ref_hosts_cache_expiry_mins = Umri wa juu (kwa dakika) wa entries katika cache ya per-domain allowedRefererHosts ya CsrfFilter. Baada ya muda huu kuisha, entry hutolewa na kupakiwa tena kutoka LDAP kwenye ombi linalofuata. Hurudi kwenye dakika 60 ikiwa kuna hitilafu ya parsing.
mysql_directory = Mahali pa usakinishaji wa MySQL.
mysql_data_directory = Saraka ambayo data ya MySQL inapaswa kuwepo.
mysql_errlogfile = Kumbukumbu ya hitilafu ya MySQL/MariaDB.
mysql_socket = Njia ya socket ya MySQL kwa matumizi ya zana za mstari wa amri za MySQL.
mysql_pidfile = Faili ambayo kitambulisho cha mchakato wa MySQL huhifadhiwa.
mysql_mycnf = Njia ya my.cnf, faili ya usanidi wa MySQL.
mysql_bind_address = Kiolesura kwenye host hii ambacho MySQL itafungamana nacho.
mysql_port = Nambari ya port ambayo seva ya MySQL inapaswa kusikiliza.
mysql_root_password = Nenosiri la mtumiaji wa ndani wa MySQL aitwaye \u2018root\u2019, lisichanganywe na kuingia kwa UNIX root.  Kwa urahisi, wakati wa kuanzisha hifadhidata nenosiri la nasibu hutengenezwa, kuhifadhiwa katika usanidi wa ndani na katika MySQL.  Ikiwa unataka kubadilisha nenosiri hili, tafadhali tumia programu ya zmmypasswd ambayo itabadilisha nenosiri katika MySQL na pia katika usanidi wa ndani.
mysql_memory_percent = Asilimia ya kumbukumbu ya mfumo ambayo mysql inapaswa kutumia. Thamani hii huhifadhiwa hapa kwa matumizi ya programu ya zmmycnf. Kubadilisha mpangilio huu hakuakisi mara moja katika seva ya MySQL. Utalazimika, kwa tahadhari kubwa, kutengeneza upya my.cnf na kuanzisha upya seva ya MySQL ili mabadiliko yaanze kutumika.
mysql_innodb_log_buffer_size = Soma nyaraka za MySQL kwa innodb_log_buffer_size. Thamani hii huhifadhiwa hapa kwa matumizi ya programu ya zmmycnf. Kubadilisha mpangilio huu hakuakisi mara moja katika seva ya MySQL. Utalazimika, kwa tahadhari kubwa, kutengeneza upya my.cnf na kuanzisha upya seva ya MySQL ili mabadiliko yaanze kutumika.
mysql_innodb_log_file_size = Soma nyaraka za MySQL kwa innodb_log_file_size. Thamani hii huhifadhiwa hapa kwa matumizi ya programu ya zmmycnf. Kubadilisha mpangilio huu hakuakisi mara moja katika seva ya MySQL. Utalazimika, kwa tahadhari kubwa, kutengeneza upya my.cnf na kuanzisha upya seva ya MySQL ili mabadiliko yaanze kutumika.
mysql_sort_buffer_size = Soma nyaraka za MySQL kwa sort_buffer_size. Thamani hii huhifadhiwa hapa kwa matumizi ya programu ya zmmycnf. Kubadilisha mpangilio huu hakuakisi mara moja katika seva ya MySQL. Utalazimika, kwa tahadhari kubwa, kutengeneza upya my.cnf na kuanzisha upya seva ya MySQL ili mabadiliko yaanze kutumika.
mysql_read_buffer_size = Soma nyaraka za MySQL kwa read_buffer_size. Thamani hii huhifadhiwa hapa kwa matumizi ya programu ya zmmycnf. Kubadilisha mpangilio huu hakuakisi mara moja katika seva ya MySQL. Utalazimika, kwa tahadhari kubwa, kutengeneza upya my.cnf na kuanzisha upya seva ya MySQL ili mabadiliko yaanze kutumika.
mysql_backup_retention = Idadi ya marekebisho ya chelezo ya hifadhidata ya mysql ya kuhifadhi.
antispam_mysql_enabled = Tumia hifadhidata ya mysql kwa antispam.  False kwa chaguo-msingi.
antispam_backup_retention = Idadi ya marekebisho ya chelezo ya hifadhidata ya antispam ya kuhifadhi.
derby_properties = Njia ya faili ya sifa za usanidi wa derby.
imap_max_consecutive_error = Ikiwa ni kubwa kuliko 0, acha muunganisho wa imap ikiwa thamani ya imap_max_consecutive_error imefikiwa.
imap_inactive_session_cache_size = Ehcache: idadi ya juu ya entries za cache ya IMAP zisizotumika kwenye diski kabla ya eviction.
imap_use_ehcache = Ikiwa true, tumia Ehcache kwa caching ya vikao vya IMAP. Vinginevyo, tumia cache ya diski.
imap_write_timeout = Weka muda wa mwisho wa uandishi wa kikao cha IMAP (nio).
imap_write_chunk_size = Ukubwa kwa bytes wa buffer ya kuandika ya IMAP.
imap_thread_keep_alive_time = Muda wa chaguo-msingi, kwa sekunde, wa nyuzi ya IMAP.
imap_throttle_ip_limit = Ikiwa ni kubwa kuliko 0, idadi ya juu ya maombi ya IMAP kwa sekunde kwa kila IP.
imap_throttle_acct_limit = Ikiwa ni kubwa kuliko 0, idadi ya juu ya maombi ya IMAP kwa sekunde kwa kila akaunti.
imap_suggested_batch_copy_size = Idadi ya ujumbe wa kuchakata kwa kila batch wakati wa operesheni za IMAP COPY.
imap_in_progress_response_thread_pool_size = Idadi ya juu ya nyuzi katika pool kwa kutuma jibu la InProgress kwa mteja.
imap_in_progress_response_thread_keep_alive = Muda kwa sekunde wa nyuzi kubaki hai kabla ya kusitishwa.
imap_ehcache_heap_size = Idadi ya juu ya entries za cache ya IMAP zinazohifadhiwa katika Ehcache heap tier.
imap_ehcache_skip_large_folder = Huruka caching ya folda kubwa za IMAP kwenye Ehcache ikiwa imewezeshwa.
imap_ehcache_folder_max_message_count = Kizingiti cha idadi ya ujumbe ambacho juu yake folda za IMAP hazihifadhiwi kwenye Ehcache. 
nio_imap_enabled = Ikiwa true, wezesha Jetty non-blocking IO kwa IMAP.
nio_pop3_enabled = Ikiwa true, wezesha Jetty non-blocking IO kwa POP3.
postfix_mail_owner = postfix_mail_owner
postfix_setgid_group = postfix_setgid_group
postfix_version = postfix_version
mailboxd_directory = Mahali pa usakinishaji wa mailboxd.
mailboxd_java_heap_size = Idadi ya megabytes zitakazotumiwa kama ukubwa wa juu wa Java heap (-Xmx) wa JVM inayoendesha Mailboxd.
mailboxd_java_heap_new_size_percent = Asilimia ya ukubwa wa Java heap itakayotumiwa kwa young generation (-Xmn) ya JVM inayoendesha Mailboxd.
mailboxd_java_options = Chaguo za JVM za kutumia wakati wa kuanzisha Mailboxd.
mailboxd_pidfile = Faili ambayo kitambulisho cha mchakato wa JVM ya Mailboxd huhifadhiwa.
mailboxd_keystore = Mahali pa faili ya data ya keystore.
mailboxd_keystore_password = Nenosiri la kutumika na KeyManager keystore.
mailboxd_truststore = Mahali pa faili ya data ya truststore.
mailboxd_truststore_password = Nenosiri la kutumika na TrustManager keystore.
client_ssl_truststore = Mahali pa faili ya data ya truststore inayotumika kwa uthibitishaji wa client SSL.
client_ssl_truststore_password = Nenosiri la kutumika na client SSL TrustManager keystore.
mailboxd_output_file = Faili ya kuelekeza stdout na stderr ya seva.
mailboxd_output_rotate_interval = Kipindi, kwa sekunde, ambacho faili ya output ya mailboxd huzungushwa. Ikiwa <= 0, hakuna mzunguko unaofanywa.
mailboxd_thread_stack_size = Ukubwa wa stack ya thread kwa Mailboxd
ssl_allow_untrusted_certs = Ikiwa true, ruhusu vyeti vya SSL vilivyojisaini.
zimlet_directory = Njia ya Zimlets zilizosakinishwa.
calendar_outlook_compatible_allday_events = Tumia matukio ya siku nzima yanayolingana na Outlook.  False kwa chaguo-msingi.
calendar_entourage_compatible_timezones = Nukuu parameter ya TZID katika sifa za iCalendar, ili kuzunguka hitilafu katika MS Entourage. True kwa chaguo-msingi.
calendar_ics_import_full_parse_max_size = Wakati wa kuagiza ics tumia full parser ikiwa ukubwa wa ics ni mdogo au sawa na huu; faili kubwa zaidi za ics huchanganuliwa kwa callback parser ambayo hairuhusu forward references kwa VTIMEZONE TZID
calendar_canonical_tzid = Kitambulisho cha timezone kitakachorejeshwa kama TimeZone.getCanonicalID(). Thamani zinazowezekana: "olson","windows","java". "windows" kwa chaguo-msingi.
calendar_cache_enabled = Washa cache ya kalenda.  False kwa chaguo-msingi.
calendar_cache_directory = Saraka ya mzizi ya faili za cache ya kalenda
calendar_cache_lru_size = Ukubwa wa LRU ya cache ya kumbukumbu.  Hifadhi folda hizi nyingi za kalenda kwenye kumbukumbu.
calendar_cache_range_month_from = Mwezi wa kuanzia katika range iliyohifadhiwa kwenye cache.  0 humaanisha mwezi wa sasa, -1 humaanisha mwezi uliopita, n.k.
calendar_cache_range_months = Idadi ya miezi katika range iliyohifadhiwa kwenye cache
krb5_keytab = Mahali pa faili ya keytab ya Zimbra Kerberos 5
krb5_debug_enabled = Uwekaji wa Kerberos debugging umewezeshwa
zimbra_mtareport_max_hosts = Idadi ya juu ya hosts za kujumuisha katika ripoti za kila siku za MTA zinazozalishwa na zmdailyreport.
zimbra_mtareport_max_recipients = Idadi ya wapokeaji ya kuorodhesha katika ripoti za kila siku za mta.
zimbra_mtareport_max_senders = Idadi ya watumaji ya kuorodhesha katika ripoti za kila siku za mta.
zimbra_mtareport_max_users = Idadi ya juu ya watumiaji ya kujumuisha katika ripoti za kila siku za MTA zinazozalishwa na zmdailyreport.
zimbra_auth_always_send_refer = Tuma daima tag ya <refer> katika jibu la auth ili kulazimisha mteja kufanya redirect.
zimbra_admin_service_port = Port ya admin ya chaguo-msingi/bootstrap.
zimbra_admin_service_scheme = Mpango wa itifaki wa admin wa chaguo-msingi/bootstrap.
zimbra_mail_service_port = Port ya barua ya chaguo-msingi
zimbra_zmprov_default_to_ldap = Iwapo zmprov hutumia LDAP au SOAP kama chaguomsingi.
zimbra_zmprov_default_soap_server = Seva chaguomsingi ya SOAP ambayo zmprov itaunganisha nayo
zmprov_safeguarded_attrs = Orodha ya atributi za utoaji zenye thamani nyingi, iliyotenganishwa kwa koma, ambazo zinapaswa kulindwa dhidi ya kubadilishwa
zmprov_tmp_directory = Saraka ya muda ambayo zmprov hutumia kuandika thamani za atributi za binary kwenye faili.
zimbra_mailbox_groups = Idadi ya vikundi vya kisanduku cha barua vya kusambazia visanduku vipya vya barua.
debug_mailboxindex_use_new_locking = Tumia kufunga kwa mtindo mpya kwa MailboxIndex
zimbra_class_provisioning = Darasa la kiolesura cha utoaji
zimbra_class_accessmanager = Darasa la kiolesura cha msimamizi wa ufikiaji
zimbra_class_mboxmanager = Darasa la kiolesura cha msimamizi wa kisanduku cha barua
zimbra_class_database = Darasa la usanidi wa hifadhidata
zimbra_class_store = Darasa la kiolesura cha hifadhi ya ujumbe
zimbra_class_application = Darasa la kiolesura cha programu ya Zimbra
zimbra_class_rulerewriterfactory = Darasa la kiolesura cha RuleRewriterFactory
zimbra_class_dbconnfactory = Darasa la kiwanda cha miunganisho ya hifadhidata
zimbra_class_soapsessionfactory = Darasa la kiwanda cha vipindi vya SOAP
av_notify_user = Anwani ya barua pepe ya kutuma ujumbe wa kiusimamizi kutoka kwa anti-virus na DKIM.
av_notify_domain = Domeni chaguomsingi katika mipangilio ya amavisd.
data_source_trust_self_signed_certs = Ruhusu vyeti vilivyojisaini vyenyewe unapounganisha kwenye chanzo cha data kupitia SSL.
data_source_fetch_size = idadi ya juu ya ujumbe wa IMAP wa FETCH katika kila ombi
data_source_max_literal_mem_size = Ukubwa wa juu wa data halisi (kwa baiti) utakaoakibishwa kwenye kumbukumbu. Data kubwa zaidi itahifadhiwa katika faili la muda.
timezone_file = Faili ya iCalendar inayoorodhesha saa za eneo zinazojulikana
search_disable_database_hints = Ikiwa ni kweli, usitumie vidokezo vya hifadhidata katika hoja zinazozalishwa wakati wa kutafuta
search_dbfirst_term_percentage_cutoff = Kigezo cha ndani cha uundaji wa hoja
zmstat_interval = ni mara ngapi sampuli huchukuliwa na zmstat (sekunde)
zmstat_df_excludes = orodha ya juzuu za diski iliyotenganishwa kwa alama ya koloni (kwa njia ya mount) za kuondoa kutoka kwa zmstats
zimbra_noop_default_timeout = Muda (sekunde) ambao seva itaruhusu NoOpRequest kuzuiwa ikiwa wait=1 imebainishwa na mteja
zimbra_noop_min_timeout = Muda mdogo wa kusubiri unaoruhusiwa (sekunde) uliobainishwa kwa NoOpRequest
zimbra_noop_max_timeout = Muda mkubwa wa kusubiri unaoruhusiwa (sekunde) uliobainishwa kwa NoOpRequest
zimbra_waitset_default_request_timeout = Muda chaguomsingi wa kusubiri (sekunde) ambao WaitSetRequest isiyo ya msimamizi itazuiwa
zimbra_waitset_min_request_timeout = Muda mdogo wa kusubiri (sekunde) ambao WaitSetRequest isiyo ya msimamizi itazuiwa
zimbra_waitset_max_request_timeout = Muda mkubwa wa kusubiri (sekunde) ambao WaitSetRequest isiyo ya msimamizi itazuiwa
zimbra_waitset_max_per_account = Idadi ya juu ya WaitSet zisizo za msimamizi ambazo akaunti moja inaweza kuwa nazo wazi
zimbra_admin_waitset_default_request_timeout = Muda chaguomsingi wa kusubiri (sekunde) ambao WaitSetRequest ya msimamizi itazuiwa
zimbra_admin_waitset_min_request_timeout = Muda mdogo wa kusubiri (sekunde) ambao WaitSetRequest ya msimamizi itazuiwa
