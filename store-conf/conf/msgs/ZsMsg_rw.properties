zimbra_mailbox_manager_hardref_cache = Umubare ntarengwa w\u2019amasanduku y\u2019imeri azafatanwa mu bubiko mbere y\u2019uko umuyobozi w\u2019amasanduku y\u2019imeri atangira kwemera ko avanwamo binyuze mu ikusanyamyanda rya SoftReference.
zimbra_mailbox_active_cache = Ingano ntarengwa y\u2019ububiko bw\u2019imbere bwa LRU bw\u2019ibintu byo mu gasanduku k\u2019imeri igihe hari seshoni zikora.
zimbra_mailbox_inactive_cache = Ingano ntarengwa y\u2019ububiko bw\u2019imbere bwa LRU bw\u2019ibintu byo mu gasanduku k\u2019imeri igihe nta seshoni zikora.
zimbra_mailbox_change_checkpoint_frequency = Inshuro, zibarwa nk\u2019umubare w\u2019impinduka, agaciro k\u2019impinduka ka highwater ka ZIMBRA.MAILBOX.CHANGE_CHECKPOINT k\u2019agasanduku k\u2019imeri kandikwaho.
zimbra_index_elasticsearch_url_base = URL shingiro ya ElasticSearch REST API.
zimbra_index_threads = Ingano y\u2019itsinda ry\u2019ududodo ku ikora-indeksi yo mu byiciro.
zimbra_reindex_threads = Umubare ntarengwa w\u2019ududodo two kongera gukora indeksi. Ududodo two kongera gukora indeksi ntidushyirwa mu itsinda.
zimbra_index_disable_perf_counters = Niba ari false, IO yo gusoma no kwandika ya Lucene ikurikiranwa n\u2019igenzura ry\u2019imikorere rya Zimbra. Agaciro true gahagarika igenzura rya IO ya Lucene.
