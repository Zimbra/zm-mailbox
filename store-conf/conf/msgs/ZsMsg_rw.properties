licenseFeaureOnHoldNotifierSubject = Iburira rya Sisitemu ya Zimbra: Umupaka w\u2019imikoreshereze y\u2019ibiranga wararenzwe
licenseFeaureOnHoldNotifierBodyText = Umubare wa konti wemerewe n\u2019uruhushya wagezweho cyangwa wararenzwe ku biranga bikurikira:\n{0}\nMushobora kugabanya imikoreshereze y\u2019abakoresha basanzwe cyangwa mukongera umupaka w\u2019uruhushya rw\u2019ibyo biranga.\n\nKugira ngo mwongere umupaka w\u2019uruhushya rw\u2019ibyo biranga, mwandikire itsinda ry\u2019igurisha rya Zimbra kuri sales@zimbra.com.\nKugira ngo mugenzure isaranganywa ry\u2019ibiranga kuri konti, injirai muri Admin Portal.\n\nMwibuke ibi bikurikira:\n1. Muzakomeza kwakira iri menyesha mu minsi {1,number,integer} uhereye ku munsi umupaka warenzweho.\n2. Ntimuzashobora gukora icyo kiranga cyakoreshejwe birenze urugero kuri konti iyo ari yo yose.\n3. Nidafata icyemezo kuri icyo kiranga cyakoreshejwe birenze urugero, kizahagarikwa ku bakoresha kugira ngo gisubizwe munsi y\u2019umupaka w\u2019uruhushya.\n\nMurakoze,\nZimbra Support
licenseFeaureOnHoldNotifierBodyHtml = <div style="font-family:sans-serif;">Umubare wa konti wemerewe n\u2019uruhushya wagezweho cyangwa wararenzwe ku biranga bikurikira:<br>{0}<br>Mushobora kugabanya imikoreshereze y\u2019abakoresha basanzwe cyangwa mukongera umupaka w\u2019uruhushya rw\u2019ibyo biranga.<br><br>Kugira ngo mwongere umupaka w\u2019uruhushya rw\u2019ibyo biranga, mwandikire itsinda ry\u2019igurisha rya Zimbra kuri <b>sales@zimbra.com</b>.<br>Kugira ngo mugenzure isaranganywa ry\u2019ibiranga kuri konti, injirai muri Admin Portal.<br><br>Mwibuke ibi bikurikira:<br>1. Muzakomeza kwakira iri menyesha mu minsi {1,number,integer} uhereye ku munsi umupaka warenzweho.<br>2. Ntimuzashobora gukora icyo kiranga cyakoreshejwe birenze urugero kuri konti iyo ari yo yose.<br>3. Nidafata icyemezo kuri icyo kiranga cyakoreshejwe birenze urugero, kizahagarikwa ku bakoresha kugira ngo gisubizwe munsi y\u2019umupaka w\u2019uruhushya.<br><br>Murakoze,<br>Zimbra Support</div>
