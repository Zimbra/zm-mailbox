zimbra_ldap_user = Izina ry\u2019umukoresha rya zimbra rikoreshwa mu kwemeza hakoreshejwe admin AuthRequest.
zimbra_ldap_password = Ijambobanga rya zimbra_ldap_userdn. Ribikwa muri local config kugira ngo porogaramu ya store irikoreshe mu kwemeza. Niba ushaka guhindura iri jambobanga, koresha porogaramu ya zmldappasswd, izahindura ijambobanga muri LDAP no muri local config.
zimbra_server_hostname = Izina ryagenwe ry\u2019iyi server. Hagomba kubaho inyandiko ya \u2018server\u2019 ihuye na ryo muri LDAP \u2014 reba inyandiko z\u2019itegeko rya CreateServer rya porogaramu ya zmprov.
zimbra_user = Ukoresha unix wa zimbra, uwo process ya server ya zimbra igomba guhererezaho uburenganzira nyuma yo kwiyomeka ku ports zifite uburenganzira bwihariye.
