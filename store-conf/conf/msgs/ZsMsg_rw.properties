zimbra_index_deferred_items_failure_delay = Nyuma y\u2019ikosa, gutinda guto kurusha ibindi, mu masegonda, hagati y\u2019igerageza ryo gusukura umurongo w\u2019ibintu bitakorewe indeksi byatinze.
zimbra_index_lucene_max_terms_per_query = Igena umubare ntarengwa w\u2019amagambo yemerewe kuri buri kibazo cy\u2019ishakisha.
zimbra_index_max_transaction_bytes = Iyo ibikorwa byo gukora indeksi bishyizwe hamwe mu gikorwa cya Mailbox, iyi ni ingano ntarengwa y\u2019ikusanyirizo ry\u2019ibintu twemera mu gikorwa kimwe.
zimbra_index_max_transaction_items = Iyo ibikorwa byo gukora indeksi bishyizwe hamwe, uyu ni umubare ntarengwa wa mail_items twemera mu gikorwa kimwe.
zimbra_index_max_pending_deletes = Umubare ntarengwa w\u2019ibisibwa mu ndeksi bitarasozwa mbere yo kongera kwigarurira umwanya wa disiki.
zimbra_index_lucene_merge_policy = true kugira ngo ukoreshe LogDocMergePolicy, false kugira ngo ukoreshe LogByteSizeMergePolicy. LogDocMergePolicy ihitamo ibice byo guhuza hashingiwe ku mubare w\u2019inyandiko. LogByteSizeMergePolicy ihitamo ibice byo guhuza hashingiwe ku bunini bwabyo.
zimbra_index_lucene_min_merge = Igena ubunini bwo hasi bwa Lucene bwo guhuza, mu Nyandiko cyangwa KB, bitewe na politiki yo guhuza yatanzwe muri zimbra_index_lucene_merge_policy.
zimbra_index_lucene_max_merge = Igena ubunini bwo hejuru bwa Lucene bwo guhuza, mu Nyandiko cyangwa KB, bitewe na politiki yo guhuza yatanzwe muri zimbra_index_lucene_merge_policy. Aka gaciro kagena igice kinini kurusha ibindi gishobora guhurizwa hamwe n\u2019ibindi bice.
zimbra_index_lucene_merge_factor = Ni kangahe indeksi z\u2019ibice zihuzwa na addDocument(). Iyo agaciro kari hasi, RAM nkeya ikoreshwa mu gukora indeksi kandi ishakisha ryihuta, ariko umuvuduko wo gukora indeksi ukagenda buhoro. Iyo agaciro kari hejuru, RAM nyinshi ikoreshwa mu gukora indeksi kandi, nubwo ishakisha rigenda buhoro, gukora indeksi byo byihuta. Agaciro kari hejuru (>10) ni ko keza ku iremwa ry\u2019indeksi ryo mu byiciro, kandi agaciro kari hasi (<10) kakaba keza ku ndeksi zibungabungwa mu buryo bw\u2019imikoranire.
zimbra_index_lucene_term_index_divisor = Ifata igice cy\u2019amagambo yakorewe indeksi ashyirwa muri RAM. Ushyize aka gaciro kuri > 1 ushobora kugabanya ikoreshwa ry\u2019umwanya wo kwibuka, ariko igihe cyo gutegereza kikiyongera igihe amakuru y\u2019inyandiko abikiwe ijambo atangizwa.
zimbra_index_lucene_use_compound_file = true niba igice gishya cya Lucene kigomba gukoresha imiterere ya compound file. http://wiki.apache.org/lucene-java/ImproveIndexingSpeed ivuga ko kuzimya imiterere ya compound file bitanga imikorere myiza kurushaho, ariko bizongera cyane umubare wa file descriptors. File descriptors zishobora gushira niba zimbra_index_lucene_merge_factor iri hejuru.
zimbra_index_lucene_max_buffered_docs = Umubare muto w\u2019inyandiko usabwa mbere y\u2019uko inyandiko zabitswe muri memori zisohorwa nk\u2019igice gishya. Muri rusange agaciro kari hejuru gatuma gukora indeksi byihuta.
zimbra_index_lucene_ram_buffer_size_kb = RAM ntarengwa ya Lucene yabitswe by\u2019agateganyo, mu KB.
zimbra_index_lucene_io_impl = Ishyirwa mu bikorwa rya Lucene FSDirectory rikoreshwa kuri IO yo gukora indeksi. Agaciro gashoboka ni nio - Koresha NIOFSDirectory. Rikoresha positional io ya FileChannel ya java.nio mu gusoma kugira ngo ririnde synchronization iyo hasomwa muri dosiye imwe. mmap - Koresha MMapDirectory. Rikoresha memory-mapped IO mu gusoma. Ni amahitamo meza niba hari virtual memory ihagije ugereranyije n\u2019ingano y\u2019indeksi. simple - Koresha SimpleFSDirectory. Rikoresha java.io.RandomAccessFile. Imikorere yaryo y\u2019igihe kimwe si myiza kuko rishyira synchronization igihe ududodo twinshi dusoma dosiye imwe. Niba nta gaciro katanzwe, FSDirectory izahitamo ishyirwa mu bikorwa rihuje neza n\u2019ibidukikije.
zimbra_index_rfc822address_max_token_count = Umubare ntarengwa wa tokeni z\u2019aderesi mu murongo wa tokeni z\u2019aderesi wa RFC822. Iyi mipaka ikoreshwa ku mitwe yose ya FROM, TO na CC y\u2019imeri, ku aderesi zose z\u2019imeri z\u2019Abo muvugana no ku murima wa Creator w\u2019Inyandiko.
zimbra_index_rfc822address_max_token_length = Uburebure ntarengwa bwa tokeni ku aderesi mu murongo wa tokeni z\u2019aderesi wa RFC822. Iyi mipaka ikoreshwa ku mitwe yose ya FROM, TO na CC y\u2019imeri, ku aderesi zose z\u2019imeri z\u2019Abo muvugana no ku murima wa Creator w\u2019Inyandiko.
zimbra_index_wildcard_max_terms_expanded = Umubare ntarengwa w\u2019iyaguka rya wildcard kuri buri jambo ku giti cyaryo mu kibazo cy\u2019ishakisha.
zimbra_galsync_index_reader_cache_size = Umubare ntarengwa wa IndexReaders mu bubiko bw\u2019indeksi y\u2019ishakisha rya GAL. Indeksi ya Lucene ya konti ya GAL sync ibikwa ukwacyo kandi ntivanwamo yikoresha.
zimbra_spam_report_queue_size = Ku Junk/Not Junk Msg/ConvActionRequests, iyi ngano y\u2019umurongo igabanya workqueue ya seriveri ikoreshwa mu gutunganya ubutumwa bwo kohereza imbere.
zimbra_throttle_op_concurrency = Urutonde rw\u2019agaciro k\u2019imikoranire rutandukanijwe na koma ku nzego 5 z\u2019ibyihutirwa, kuva ku rwego rwo hejuru kugera ku rwo hasi.
zimbra_im_chat_flush_time = Ni kangahe, mu masegonda, ibiganiro bya IM bifunguye byandikwa mu bubiko.
zimbra_im_chat_close_time = Ni igihe kingana iki, mu masegonda, seriveri izategereza mbere yo gufunga seshoni z\u2019ibiganiro bya IM zidakoreshwa.
zimbra_http_originating_ip_header = HTTP header ikoreshwa mu kumenya aderesi ya IP y\u2019umwimerere y\u2019umukiliya.
zimbra_session_limit_imap = Umubare ntarengwa w\u2019ububiko bwa IMAP umukoresha umwe ashobora gufungura icyarimwe.
zimbra_session_limit_admin = Umubare ntarengwa wa seshoni za admin SOAP umukoresha umwe ashobora gufungura icyarimwe.
zimbra_session_limit_soap = Umubare ntarengwa wa seshoni za SOAP zikora kuri buri konti. Wongere aka gaciro witonze kugira ngo wirinde amakosa ya "Too many SOAP sessions" muri mailbox.log.
zimbra_session_limit_sync = Umubare ntarengwa wa sync listeners kuri buri seshoni ya ActiveSync. Wongere aka gaciro witonze kugira ngo wirinde amakosa ya "Too many SYNCLISTENER sessions" muri sync.log.
zimbra_session_timeout_soap = Igihe ntarengwa cyo gutegereza iyo nta gikorwa, mu masegonda, kuri seshoni za SOAP.
zimbra_session_max_pending_notifications = Umubare ntarengwa w\u2019imenyesha ritegereje rishobora gushyirwa ku murongo muri seshoni ya SOAP mbere y\u2019uko uwo murongo usukurwa kandi umukiliya akabwirwa ko imimerere ye itagifite agaciro.
zimbra_converter_enabled_uuencode = Niba decoder ya UUENCODE ikoreshwa igihe ubutumwa busesengurwa buvuye mu bubiko.
zimbra_converter_enabled_tnef = Niba decoder ya TNEF ikoreshwa igihe ubutumwa busesengurwa buvuye mu bubiko.
zimbra_converter_depth_max = Ubujyakuzimu bw\u2019ibice bya MIME byisubiramo munsi yabwo converters zitazakora.
zimbra_ssl_enabled = Niba ssl keystore igomba gutangizwa.
stats_img_folder = Ububiko bwo kubikamo amashusho y\u2019ibarurishamibare yakozwe.
ldap_host = Host ya LDAP ikoreshwa. Byateshejwe agaciro - nyamuneka koresha ldap_url aho.
ldap_log_level = Urwego rwo kwandika amakuru rwa LDAP.
ldap_port = Port ya LDAP ikoreshwa. Byateshejwe agaciro - nyamuneka koresha ldap_url aho.
ldap_url = Urutonde rwa seriveri za LDAP zikoreshwa n\u2019iyi seriveri.
ldap_master_url = URL igana kuri LDAP master.
ldap_is_master = Ese iyi host ni yo seriveri nkuru ya LDAP?
ldap_root_password = Ijambobanga rya rootdn ya slapd.conf ya LDAP. Mu rwego rwo korohereza, igihe LDAP itangizwa hakorwa ijambobanga ritunguranye, rikabikwa muri local config no muri slapd.conf. Niba ushaka guhindura iri jambobanga, nyamuneka koresha porogaramu ya zmldappasswd, izahindura ijambobanga muri slapd.conf no muri local config.
ldap_connect_timeout = Milisegonda nyuma yazo igerageza ryo gukora ihuza rihagarikwa.
ldap_read_timeout = Milisegonda nyuma yazo igerageza ryo gusoma rihagarikwa.
ldap_deref_aliases = Niba aliases zigomba gukurikirwa igihe ushakisha cyangwa wihuza n\u2019ububiko bwo hanze. Agaciro kemewe ni: always, never, finding, searching.
ldap_connect_pool_master = Niba hakoreshejwe JNDI connection pooling kuri LDAP master.
ldap_connect_pool_debug = Niba hakorwa debug ya LDAP connection pooling.
ldap_connect_pool_initsize = Umubare wa mbere w\u2019amahuza ya LDAP akora pool izazamukiraho.
ldap_connect_pool_maxsize = Umubare ntarengwa w\u2019amahuza ya LDAP akora n\u2019adakora yemerewe.
ldap_connect_pool_prefsize = Umubare wifuzwa w\u2019amahuza ya LDAP - gushyiraho maxsize na prefsize ku gaciro kamwe bituma connection pool iguma ku bunini budahinduka.
ldap_connect_pool_timeout = Milisegonda z\u2019igihe cyo kudakora mbere y\u2019uko ihuza ridakora rikurwa muri pool.
ldap_connect_pool_health_check_on_checkout_enabled = Niba igenzura ry\u2019ubuzima bwa connection pool rizakorwa buri gihe iyo ihuza rigiye gutangwa kugira ngo rikoreshwe. Niba igenzura rya OnCheckout rikoreshejwe, igenzura ry\u2019ubuzima rikorwa inyuma buri gihe rizahagarikwa.
ldap_connect_pool_health_check_interval_millis = Igihe kingana iki, mu milisegonda, hagati y\u2019igenzura ry\u2019ubuzima rikorwa inyuma ku mahuza aboneka muri connection pool.
ldap_connect_pool_health_check_max_response_time_millis = Igihe ntarengwa, mu milisegonda, kigomba kwemerewa kugira ngo igisubizo cy\u2019igenzura ry\u2019ubuzima kigaruke kivuye kuri seriveri ya LDAP.
ldap_replication_password = Ijambobanga rikoreshwa n\u2019umukoresha wa syncrepl kugira ngo yemezwe kuri ldap master.
ldap_postfix_password = Ijambobanga postfix ikoresha kugira ngo yemezwe kuri ldap.
ldap_amavis_password = Ijambobanga amavis ikoresha kugira ngo yemezwe kuri ldap.
ldap_starttls_supported = Niba seriveri ya LDAP ishyigikira igikorwa cya startTLS.
ldap_require_tls = Niba TLS isabwa ku bakiliya ba LDAP.
ldap_cache_account_maxsize = Umubare ntarengwa w\u2019ibintu bya konti bigomba kubikwa mu bubiko.
ldap_cache_account_maxage = Igihe ntarengwa, mu minota, ibintu bya konti bimara mu bubiko.
ldap_cache_cos_maxsize = Umubare ntarengwa w\u2019ibintu bya cos bigomba kubikwa mu bubiko.
ldap_cache_cos_maxage = Igihe ntarengwa, mu minota, ibintu bya cos bimara mu bubiko.
ldap_cache_domain_maxsize = Umubare ntarengwa w\u2019ibintu bya domain bigomba kubikwa mu bubiko.
ldap_cache_domain_maxage = Igihe ntarengwa, mu minota, ibintu bya domain bimara mu bubiko.
ldap_cache_mime_maxage = Igihe ntarengwa, mu minota, ibintu bya MIME bimara mu bubiko.
ldap_cache_server_maxsize = Umubare ntarengwa w\u2019ibintu bya seriveri bigomba kubikwa mu bubiko.
ldap_cache_server_maxage = Igihe ntarengwa, mu minota, ibintu by\u2019amatsinda bimara mu bubiko.
ldap_cache_share_locator_maxsize = Umubare ntarengwa w\u2019ibintu bya konti mu bubiko bw\u2019entries zifite izina.
ldap_cache_share_locator_maxage = TTL y\u2019ububiko bw\u2019entries zifite izina mu minota.
ldap_cache_timezone_maxsize = Umubare ntarengwa w\u2019ibintu bya timezone bigomba kubikwa mu bubiko.
ldap_cache_zimlet_maxsize = Umubare ntarengwa w\u2019ibintu bya zimlet bigomba kubikwa mu bubiko.
ldap_cache_zimlet_maxage = Igihe ntarengwa, mu minota, ibintu bya zimlet bimara mu bubiko.
ldap_cache_custom_dynamic_group_membership_maxage_ms = Igihe ntarengwa, mu milisegonda, cyo kubika amatsinda dynamic konti ibereye umunyamuryango, ku matsinda abanyamuryango bayo bagenwa hifashishijwe MemberURL yihariye.
csrf_filter_domain_allowed_ref_hosts_max_size = Umubare ntarengwa w\u2019ibyinjira bya domain mu bubiko bwa CsrfFilter allowedRefererHosts bwa buri domain. Iyo parsing yanze, hasubirwaho ldap_cache_domain_maxsize.
csrf_filter_domain_allowed_ref_hosts_cache_expiry_mins = Igihe ntarengwa, mu minota, ibyinjira bimara mu bubiko bwa CsrfFilter allowedRefererHosts bwa buri domain. Iyo igihe kirangiye, icyinjira kiravanwamo maze kigafungurwa bundi bushya kivuye muri LDAP ku busabe bukurikira. Iyo parsing yanze, hasubirwaho iminota 60.
mysql_directory = Aho MySQL yashyizwe.
mysql_data_directory = Ububiko amakuru ya MySQL agomba kubamo.
mysql_errlogfile = Idosiye y\u2019inyandiko z\u2019amakosa za MySQL/MariaDB.
mysql_socket = Inzira igana kuri socket ya MySQL ikoreshwa n\u2019ibikoresho bya MySQL byo ku murongo w\u2019amabwiriza.
mysql_pidfile = Idosiye ibikwamo ID y\u2019igikorwa cya MySQL.
mysql_mycnf = Inzira igana kuri my.cnf, idosiye y\u2019igenamiterere ya MySQL.
mysql_bind_address = Interefeisi iri kuri iyi host MySQL izifungaho.
mysql_port = Nimero y\u2019umuyoboro serveri ya MySQL igomba gutegeraho.
mysql_root_password = Ijambobanga ry\u2019umukoresha wa \u201croot\u201d ryubatswe muri MySQL; ntirigomba kwitiranywa n\u2019ukwinjira kwa root kwa UNIX. Mu korohereza imikoreshereze, igihe hatangizwa ububikoshingiro hakorwa ijambobanga ritunguranye, rikabikwa muri config y\u2019aho hantu no muri MySQL. Niba ushaka guhindura iri jambobanga, koresha porogaramu zmmypasswd, izahindura ijambobanga muri MySQL no muri config y\u2019aho hantu.
mysql_memory_percent = Ijanisha ry\u2019umwanyabubiko wa sisitemu mysql igomba gukoresha. Aka gaciro kabikwa hano kugira ngo gakoreshwe na porogaramu ya zmmycnf. Guhindura iri genamiterere ntibihita bigaragara muri serveri ya MySQL. Bizaba ngombwa, mwitondeye cyane, kongera gukora my.cnf no kongera gutangiza serveri ya MySQL kugira ngo impinduka zitangire gukora.
mysql_innodb_log_buffer_size = Soma inyandiko za MySQL ku byerekeye innodb_log_buffer_size. Aka gaciro kabikwa hano kugira ngo gakoreshwe na porogaramu ya zmmycnf. Guhindura iri genamiterere ntibihita bigaragara muri serveri ya MySQL. Bizaba ngombwa, mwitondeye cyane, kongera gukora my.cnf no kongera gutangiza serveri ya MySQL kugira ngo impinduka zitangire gukora.
mysql_innodb_log_file_size = Soma inyandiko za MySQL ku byerekeye innodb_log_file_size. Aka gaciro kabikwa hano kugira ngo gakoreshwe na porogaramu ya zmmycnf. Guhindura iri genamiterere ntibihita bigaragara muri serveri ya MySQL. Bizaba ngombwa, mwitondeye cyane, kongera gukora my.cnf no kongera gutangiza serveri ya MySQL kugira ngo impinduka zitangire gukora.
mysql_sort_buffer_size = Soma inyandiko za MySQL ku byerekeye sort_buffer_size. Aka gaciro kabikwa hano kugira ngo gakoreshwe na porogaramu ya zmmycnf. Guhindura iri genamiterere ntibihita bigaragara muri serveri ya MySQL. Bizaba ngombwa, mwitondeye cyane, kongera gukora my.cnf no kongera gutangiza serveri ya MySQL kugira ngo impinduka zitangire gukora.
mysql_read_buffer_size = Soma inyandiko za MySQL ku byerekeye read_buffer_size. Aka gaciro kabikwa hano kugira ngo gakoreshwe na porogaramu ya zmmycnf. Guhindura iri genamiterere ntibihita bigaragara muri serveri ya MySQL. Bizaba ngombwa, mwitondeye cyane, kongera gukora my.cnf no kongera gutangiza serveri ya MySQL kugira ngo impinduka zitangire gukora.
mysql_backup_retention = Umubare wa revisiyo za kopi z\u2019ubwirinzi za database ya mysql zigomba kubikwa.
antispam_mysql_enabled = Koresha ububikoshingiro bwa mysql ku antispam. Mburabuzi ni False.
antispam_backup_retention = Umubare wa revisiyo za kopi z\u2019ubwirinzi za database ya antispam zigomba kubikwa.
derby_properties = Inzira igana kuri dosiye y\u2019ibiranga igenamiterere rya derby.
imap_max_consecutive_error = Niba birenze 0, hagarika ihuza rya IMAP igihe agaciro ka imap_max_consecutive_error kagezweho.
imap_inactive_session_cache_size = Ehcache: umubare ntarengwa w\u2019ibyinjijwe mu bubiko bwa IMAP bitagikora bibikwa kuri disiki mbere yo gukurwamo.
imap_use_ehcache = Niba ari true, koresha Ehcache mu kubika amasomo ya IMAP. Bitabaye ibyo, koresha ububiko bwa disiki.
imap_write_timeout = Shyiraho igihe ntarengwa cyo kwandika cy\u2019isomo rya IMAP (nio).
imap_write_chunk_size = Ingano ya buffer yo kwandika ya IMAP, mu bytes.
imap_thread_keep_alive_time = Igihe mburabuzi, mu masegonda, cy\u2019umutwe wa IMAP.
imap_throttle_ip_limit = Niba birenze 0, umubare ntarengwa w\u2019ubusabe bwa IMAP ku isegonda kuri buri IP.
imap_throttle_acct_limit = Niba birenze 0, umubare ntarengwa w\u2019ubusabe bwa IMAP ku isegonda kuri buri konti.
imap_suggested_batch_copy_size = Umubare w\u2019ubutumwa bugomba gutunganywa kuri buri batch mu bikorwa bya IMAP COPY.
imap_in_progress_response_thread_pool_size = Umubare ntarengwa w\u2019udutwe mu pool two kohereza igisubizo cya InProgress ku mukiliya.
imap_in_progress_response_thread_keep_alive = Igihe, mu masegonda, umutwe ugumishwa mbere yo guhagarikwa.
imap_ehcache_heap_size = Umubare ntarengwa w\u2019ibyinjijwe mu bubiko bwa IMAP bibikwa mu rwego rwa heap ya Ehcache.
imap_ehcache_skip_large_folder = Iyo byafunguwe, ububiko bunini bwa IMAP ntibubikwa muri Ehcache.
imap_ehcache_folder_max_message_count = Urugero ntarengwa rw\u2019umubare w\u2019ubutumwa; ururengejeho ububiko bwa IMAP ntibubikwa muri Ehcache.
nio_imap_enabled = Niba ari true, fasha Jetty non-blocking IO kuri IMAP.
nio_pop3_enabled = Niba ari true, fasha Jetty non-blocking IO kuri POP3.
postfix_mail_owner = postfix_mail_owner
postfix_setgid_group = postfix_setgid_group
postfix_version = postfix_version
mailboxd_directory = Aho mailboxd yashyizwe.
mailboxd_java_heap_size = Umubare wa megabayiti zigomba gukoreshwa nk\u2019ingano ntarengwa ya heap ya Java (-Xmx) ya JVM ikoresha Mailboxd.
mailboxd_java_heap_new_size_percent = Ijanisha ry\u2019ingano ya heap ya Java rizakoreshwa n\u2019itsinda rya young generation (-Xmn) rya JVM ikoresha Mailboxd.
mailboxd_java_options = Amahitamo ya JVM yo gukoresha igihe Mailboxd itangizwa.
mailboxd_pidfile = Idosiye ibikwamo ID y\u2019igikorwa cya JVM ya Mailboxd.
mailboxd_keystore = Aho idosiye y\u2019amakuru ya keystore iri.
mailboxd_keystore_password = Ijambobanga rigomba gukoreshwa hamwe na keystore ya KeyManager.
mailboxd_truststore = Aho idosiye y\u2019amakuru ya truststore iri.
mailboxd_truststore_password = Ijambobanga rigomba gukoreshwa hamwe na keystore ya TrustManager.
client_ssl_truststore = Aho idosiye y\u2019amakuru ya truststore ikoreshwa mu kwemeza client SSL iri.
client_ssl_truststore_password = Ijambobanga rigomba gukoreshwa hamwe na client SSL TrustManager keystore.
mailboxd_output_file = Idosiye serveri igomba koherezwamo stdout na stderr.
mailboxd_output_rotate_interval = Igihe, mu masegonda, idosiye y\u2019ibisohoka bya mailboxd ihindurwamo indi. Niba <= 0, nta guhinduranya gukorwa.
mailboxd_thread_stack_size = Ingano ya stack y\u2019umutwe kuri Mailboxd.
ssl_allow_untrusted_certs = Niba ari true, emerera certifikati za SSL zisinywe ubwazo.
zimlet_directory = Inzira igana kuri Zimlets zashyizweho.
calendar_outlook_compatible_allday_events = Koresha ibyabaye by\u2019umunsi wose bihuje na Outlook. Mburabuzi ni False.
calendar_entourage_compatible_timezones = Shyira parameter ya TZID mu twuguruzo muri ibiranga iCalendar, kugira ngo uzenguruke ikosa riri muri MS Entourage. Mburabuzi ni True.
calendar_ics_import_full_parse_max_size = Mu gihe cyo kwinjiza ics, koresha parser yuzuye niba ingano ya ics iri munsi cyangwa ihwanye n\u2019iki; amadosiye manini ya ics asesengurwa na callback parser itemera ibyerekezo byo mbere ku TZID ya VTIMEZONE.
calendar_canonical_tzid = ID ya timezone izasubizwa na TimeZone.getCanonicalID(). Agaciro gashoboka: "olson","windows","java". Mburabuzi ni "windows".
calendar_cache_enabled = Fungura cache ya kalendari. Mburabuzi ni False.
calendar_cache_directory = Ububiko bw\u2019umuzi bw\u2019amadosiye ya cache ya kalendari.
calendar_cache_lru_size = Ingano ya LRU ya cache iri mu mwanya w\u2019ibuka. Bika mu mwanya w\u2019ibuka ububiko bwa kalendari bungana gutya.
calendar_cache_range_month_from = Ukwezi gutangirira mo mu ntera yabitswe muri cache. 0 bivuze uku kwezi, -1 bivuze ukwezi gushize, n\u2019ibindi.
calendar_cache_range_months = Umubare w\u2019amezi ari mu ntera yabitswe muri cache.
krb5_keytab = Aho dosiye ya keytab ya Kerberos 5 ya Zimbra iri.
krb5_debug_enabled = Gufungura igenzura ry\u2019amakosa rya Kerberos.
zimbra_mtareport_max_hosts = Umubare ntarengwa wa host zigomba gushyirwa muri raporo za buri munsi za MTA zikorwa na zmdailyreport.
zimbra_mtareport_max_recipients = Umubare w\u2019abakira ugomba gushyirwa ku rutonde muri raporo za buri munsi za mta.
zimbra_mtareport_max_senders = Umubare w\u2019ohereza ugomba gushyirwa ku rutonde muri raporo za buri munsi za mta.
zimbra_mtareport_max_users = Umubare ntarengwa w\u2019abakoresha ugomba gushyirwa muri raporo za buri munsi za MTA zikorwa na zmdailyreport.
zimbra_auth_always_send_refer = Buri gihe ohereza tagi ya <refer> mu gisubizo cy\u2019iyemeza kugira ngo uhatire umukiliya gukora redirect.
zimbra_admin_service_port = Umuyoboro mburabuzi cyangwa wo gutangiza wa admin.
zimbra_admin_service_scheme = Scheme ya protokole mburabuzi cyangwa yo gutangiza ya admin.
zimbra_mail_service_port = Umuyoboro mburabuzi w\u2019imeri.
zimbra_zmprov_default_to_ldap = Ese zmprov, ku mburabuzi, ikoresha LDAP cyangwa SOAP.
zimbra_zmprov_default_soap_server = Serveri ya SOAP mburabuzi zmprov ihuza na yo.
zmprov_safeguarded_attrs = Urutonde rutandukanijwe na koma rw\u2019ibiranga provisioning bifite indangagaciro nyinshi bigomba kurindwa gusimbuzwa.
zmprov_tmp_directory = Ububiko bw\u2019agateganyo zmprov ikoresha mu kwandika indangagaciro z\u2019ibiranga bya binary muri dosiye.
