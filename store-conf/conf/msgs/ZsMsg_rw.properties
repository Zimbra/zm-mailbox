zimbra_gid = GID ya unix ya zimbra, iyo process ya server ya zimbra igomba guhererezaho uburenganzira nyuma yo kwiyomeka ku ports zifite uburenganzira bwihariye.
zimbra_log4j_properties = Inzira ijya ku idosiye ya properties y\u2019igenamiterere rya log4j.
zimbra_log4j_properties_watch = Intera yo kugenzura idosiye ya properties y\u2019igenamiterere rya log4j mu msec.
zimbra_attrs_directory = Ububiko burimo amadosiye *.xml agaragaza imiterere ya attributes za LDAP zikoreshwa na sisitemu.
localized_msgs_directory = Ububiko bw\u2019amadosiye y\u2019ubutumwa bwahinduwe mu ndimi.
