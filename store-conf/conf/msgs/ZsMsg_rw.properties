zimbra_mysql_password = Ijambobanga rya zimbra_mysql_user. Ribikwa muri local config kugira ngo porogaramu ya store irikoreshe mu kwemeza. Niba ushaka guhindura iri jambobanga, koresha porogaramu ya zmmypasswd, izahindura ijambobanga muri MySQL no muri local config.
