zimbra_ldap_password = Kalmar sirri ta zimbra_ldap_userdn. Ana adana ta a saitin gida domin manhajar store ta tabbatar da shaida. Idan ana son canza wannan kalmar sirri, a yi amfani da shirin zmldappasswd wanda zai canza kalmar sirrin a LDAP da kuma a saitin gida.
zimbra_server_hostname = Sunan da aka tanada wa wannan sabar. Ya kamata a sami madaidaicin shigarwar \u2018server\u2019 a cikin LDAP - a duba takardun bayani don umarnin CreateServer na shirin zmprov.
