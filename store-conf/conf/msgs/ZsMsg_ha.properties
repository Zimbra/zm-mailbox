licenseFeaureOnHoldNotifierSubject = Fa\u0257akarwar tsarin Zimbra: An wuce iyakar amfani da sifa ko siffofi
licenseFeaureOnHoldNotifierBodyText = An kai ko an wuce adadin asusun da aka ba lasisi don siffofi masu zuwa:\n{0}\nZa a iya ko dai rage amfani da masu amfani na yanzu ko \u0199ara iyakar lasisin sifar.\n\nDon \u0199ara iyakar lasisin sifar, da fatan a tuntu\u0253i Zimbra Sales a sales@zimbra.com.\nDon sarrafa rabon siffofi na asusu, da fatan a shiga Admin Portal.\n\nA lura da wa\u0257annan:\n1. Za a ci gaba da kar\u0253ar wannan sanarwar na tsawon kwanaki {1,number,integer} daga ranar da aka wuce amfani.\n2. Ba za a iya kunna sifar da aka yi amfani da ita fiye da kima ba ga kowane asusu.\n3. Idan ba a \u0257auki wani mataki kan sifar da aka yi amfani da ita fiye da kima ba, za a kashe sifar ga masu amfani domin a dawo da ita cikin iyakar lasisi.\n\nGaisuwa,\nZimbra Support
licenseFeaureOnHoldNotifierBodyHtml = <div style="font-family:sans-serif;">An kai ko an wuce adadin asusun da aka ba lasisi don siffofi masu zuwa:<br>{0}<br>Za a iya ko dai rage amfani da masu amfani na yanzu ko \u0199ara iyakar lasisin sifar.<br><br>Don \u0199ara iyakar lasisin sifar, da fatan a tuntu\u0253i Zimbra Sales a <b>sales@zimbra.com</b>.<br>Don sarrafa rabon siffofi na asusu, da fatan a shiga Admin Portal.<br><br>A lura da wa\u0257annan:<br>1. Za a ci gaba da kar\u0253ar wannan sanarwar na tsawon kwanaki {1,number,integer} daga ranar da aka wuce amfani.<br>2. Ba za a iya kunna sifar da aka yi amfani da ita fiye da kima ba ga kowane asusu.<br>3. Idan ba a \u0257auki wani mataki kan sifar da aka yi amfani da ita fiye da kima ba, za a kashe sifar ga masu amfani domin a dawo da ita cikin iyakar lasisi.<br><br>Gaisuwa,<br>Zimbra Support</div>
