zimbra_mysql_shutdown_timeout = Lokacin jira kafin aikin MySQL/MariaDB na akwatin sa\u0199o ya mutu. A \u0199ara lokacin \u0199arewa idan mysql.server yana \u0257aukar lokaci mai tsawo wajen kashe aikin.
zimbra_mysql_user = Sunan mai amfani na MySQL da za a yi amfani da shi don \u0199ir\u0199ira ko samun damar shiga rumbunan bayanai da teburan zimbra. Wannan shi ne \u0199imar da za a bayar ga za\u0253in \u2018-u\u2019 na shirin layin umarni na \u2018mysql\u2019.
zimbra_mysql_password = Kalmar sirri ta zimbra_mysql_user. Ana adana ta a saitin gida domin manhajar store ta tabbatar da shaida. Idan ana son canza wannan kalmar sirri, a yi amfani da shirin zmmypasswd wanda zai canza kalmar sirrin a MySQL da kuma a saitin gida.
