filter_null_env_sender_for_dsn_redirect = Idan true ne, yana sa mai aika envelope ya zama null lokacin tura DSN ta filters na imel. Saita wannan key zuwa false na iya haifar da madaukai na imel. Duba bug 56566. Za a cire wannan key a cikin 8.x.);
