zimbra_index_lucene_max_terms_per_query = Saita matsakaicin adadin kalmomin da aka yarda da su a kowace tambaya.
zimbra_index_max_transaction_bytes = Lokacin ha\u0257a ayyukan index cikin ma\u2019amalar Mailbox, wannan shi ne mafi girman jimillar girman abubuwan da za a bari a cikin ma\u2019amala guda
