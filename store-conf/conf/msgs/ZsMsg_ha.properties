zimbra_index_lucene_merge_policy = true don amfani da LogDocMergePolicy, false don amfani da LogByteSizeMergePolicy. LogDocMergePolicy yana za\u0253ar sassan da za a ha\u0257a bisa adadin takardu. LogByteSizeMergePolicy yana za\u0253ar sassan da za a ha\u0257a bisa girmansu.
zimbra_index_lucene_min_merge = Yana saita mafi \u0199arancin girman ha\u0257awar Lucene a cikin Takardu ko KB gwargwadon manufofin ha\u0257awa da aka ayyana a zimbra_index_lucene_merge_policy.
zimbra_index_lucene_max_merge = Yana saita mafi girman girman ha\u0257awar Lucene a cikin Takardu ko KB gwargwadon manufofin ha\u0257awa da aka ayyana a zimbra_index_lucene_merge_policy. Wannan \u0199imar tana tantance mafi girman sashe da za a iya ha\u0257awa da wasu sassa.
zimbra_index_lucene_merge_factor = Sau nawa ake ha\u0257a fihirisoshin sassa ta addDocument(). Da \u0199ananan \u0199imomi, ana amfani da RAM ka\u0257an yayin yin index, kuma bincike yana sauri, amma saurin yin index yana raguwa. Da manyan \u0199imomi, ana amfani da RAM fiye da haka yayin yin index, kuma ko da yake bincike yana jinkiri, yin index yana sauri. Manyan \u0199imomi (>10) sun fi dacewa ga \u0199ir\u0199irar batch index, \u0199ananan \u0199imomi (<10) kuma ga fihiriso da ake kula da su ta mu\u2019amala.
zimbra_index_lucene_term_index_divisor = Yana yin samfurin \u0253angare na kalmomin da aka yi wa index da ake lodawa cikin RAM. Ta saita wannan zuwa \u0199ima > 1 ana iya rage amfani da \u0199wa\u0199walwa a madadin \u0199arin jinkiri yayin loda bayanan rikodi da aka adana don kalma.
zimbra_index_lucene_use_compound_file = true idan sabon sashen Lucene ya kamata ya yi amfani da tsarin compound file. http://wiki.apache.org/lucene-java/ImproveIndexingSpeed ya ce a kashe tsarin compound file domin kyakkyawan aiki, amma hakan zai \u0199ara yawan file descriptors sosai. File descriptors na iya \u0199arewa idan zimbra_index_lucene_merge_factor ya yi girma.
zimbra_index_lucene_max_buffered_docs = \u0198aramin adadin takardu da ake bu\u0199ata kafin a zubar da takardun da aka ajiye a \u0199wa\u0199walwa a matsayin sabon sashe. Manyan \u0199imomi gaba\u0257aya suna bada saurin yin index.
zimbra_index_lucene_ram_buffer_size_kb = Matsakaicin Buffered RAM na Lucene a KB
zimbra_index_lucene_io_impl = Aiwarar FSDirectory ta Lucene da ake amfani da ita don indexing IO. \u0198imomin da za su yiwu su ne nio - Yi amfani da NIOFSDirectory. Yana amfani da positional io na FileChannel na java.nio yayin karatu don guje wa synchronization lokacin karatu daga fayil guda. mmap - Yi amfani da MMapDirectory. Yana amfani da memory-mapped IO yayin karatu. Za\u0253i ne mai kyau idan akwai wadatacciyar virtual memory idan aka kwatanta da girman index. simple - Yi amfani da SimpleFSDirectory. Yana amfani da java.io.RandomAccessFile. Ayyukansa na lokaci guda ba su da kyau saboda yana yin synchronization lokacin da zare da yawa suke karanta fayil guda. Idan ba a bayar da \u0199ima ba, FSDirectory zai za\u0253i mafi kyawun aiwarar ga muhalli.
zimbra_index_rfc822address_max_token_count = Matsakaicin adadin tokens na adireshi a cikin rafin token na adireshin RFC822. Iyakar tana aiki ga duk kanun FROM, TO, da CC na imel, ga duk adireshoshin imel na Lambobin sadarwa, da filin Creator na Takardu.
zimbra_index_rfc822address_max_token_length = Matsakaicin tsawon token don adireshi a cikin rafin token na adireshin RFC822. Iyakar tana aiki ga duk kanun FROM, TO, da CC na imel, ga duk adireshoshin imel na Lambobin sadarwa, da filin Creator na Takardu.
zimbra_index_wildcard_max_terms_expanded = Matsakaicin fa\u0257a\u0257awar wildcard ga kowace kalma \u0257aya a cikin tambayar.
zimbra_galsync_index_reader_cache_size = Matsakaicin adadin IndexReaders a cikin cache na fihirisar bincike na GAL. Ana cache \u0257in Lucene index na asusun GAL sync dabam ba tare da fitarwa ta atomatik ba.
zimbra_spam_report_queue_size = Ga Junk/Not Junk Msg/ConvActionRequests, wannan girman jerin gwano yana iyakance server workqueue don sarrafa turawa.
zimbra_throttle_op_concurrency = Jerin \u0199imomin concurrency da aka raba da wa\u0199afi ga kowane matakai 5 na fifiko daga mafi girma zuwa mafi \u0199asa
zimbra_im_chat_flush_time = Sau nawa, a dakiku, ake rubuta bu\u0257a\u0257\u0257un hirarrakin IM zuwa store
zimbra_im_chat_close_time = Tsawon lokacin, a dakiku, da sabar za ta jira kafin rufe zaman hirar IM marasa aiki
zimbra_http_originating_ip_header = Kanun HTTP da za a duba domin tantance ainihin adireshin IP na abokin ciniki
zimbra_session_limit_imap = Matsakaicin adadin jakokin IMAP da mai amfani guda zai iya bu\u0257ewa a lokaci guda
zimbra_session_limit_admin = Matsakaicin adadin zaman admin SOAP da mai amfani guda zai iya bu\u0257ewa a lokaci guda
zimbra_session_limit_soap = Matsakaicin adadin zaman SOAP masu aiki ga kowane asusu. A \u0199ara wannan \u0199imar a hankali don guje wa kurakuran \u201cToo many SOAP sessions\u201d a mailbox.log.
zimbra_session_limit_sync = Matsakaicin adadin masu sauraron sync ga kowane zama na ActiveSync. A \u0199ara wannan \u0199imar a hankali don guje wa kurakuran \u201cToo many SYNCLISTENER sessions\u201d a sync.log.
zimbra_session_timeout_soap = Lokacin \u0199arewar rashin aiki, a dakiku, don zaman SOAP
zimbra_session_max_pending_notifications = Matsakaicin adadin sanarwar da ke jiran aiwatarwa da za a iya jera su a cikin zaman SOAP kafin a tsarkake jerin gwano kuma a sanar da abokin ciniki cewa halinsa ba ya aiki
zimbra_converter_enabled_uuencode = Ko ana gudanar da decoder na UUENCODE lokacin da ake nazarin sa\u0199onni daga store
zimbra_converter_enabled_tnef = Ko ana gudanar da decoder na TNEF lokacin da ake nazarin sa\u0199onni daga store
zimbra_converter_depth_max = Matsakaicin zurfin \u0253angaren MIME na maimaitawa da converters ba za su yi aiki a \u0199asansa ba
zimbra_ssl_enabled = Ko za a loda SSL keystore ko a\u2019a
stats_img_folder = Jaka don adana hotunan kididdiga da aka \u0199ir\u0199ira.
ldap_host = Mai masaukin LDAP da za a yi amfani da shi. An daina amfani da shi - a maimakon haka a yi amfani da ldap_url.
ldap_log_level = Matakin log na LDAP
ldap_port = Tashar LDAP da za a yi amfani da ita. An daina amfani da ita - a maimakon haka a yi amfani da ldap_url.
ldap_url = Jerin sabobin LDAP don wannan sabar ta yi amfani da su.
ldap_master_url = URL zuwa babban LDAP.
ldap_is_master = Shin wannan mai masaukin babban sabar LDAP ne?
ldap_root_password = Kalmar sirri ta rootdn na LDAP slapd.conf. Don sau\u0199i, yayin \u0199addamar da LDAP ana \u0199ir\u0199irar kalmar sirri bazuwar, a adana ta a saitin gida da kuma a slapd.conf. Idan ana son canza wannan kalmar sirri, a yi amfani da shirin zmldappasswd wanda zai canza kalmar sirrin a slapd.conf da kuma a saitin gida.
ldap_connect_timeout = Milliseconds bayan haka ake katse yun\u0199urin ha\u0257i.
ldap_read_timeout = Milliseconds bayan haka ake katse yun\u0199urin karatu.
ldap_deref_aliases = Ko za a warware aliases yayin bincike ko \u0257aurewa zuwa kundin adireshi na waje. Ingantattun \u0199imomi su ne: always, never, finding, searching
ldap_connect_pool_master = Ko za a yi amfani da JNDI connection pooling ga LDAP master.
ldap_connect_pool_debug = Ko za a yi debugging na LDAP connection pooling.
ldap_connect_pool_initsize = Adadin farko na ha\u0257in LDAP masu aiki da za a tashi zuwa gare su.
ldap_connect_pool_maxsize = Matsakaicin adadin ha\u0257in LDAP masu aiki da marasa aiki da aka yarda da su.
ldap_connect_pool_prefsize = Adadin ha\u0257in LDAP da aka fi so - saita maxsize da prefsize zuwa \u0199ima \u0257aya yana ri\u0199e tafkin ha\u0257i a tsayayyen girma.
ldap_connect_pool_timeout = Milliseconds na rashin aiki kafin a fitar da ha\u0257in da ba ya aiki daga tafkin.
ldap_connect_pool_health_check_on_checkout_enabled = Ko za a kira binciken lafiyar tafkin ha\u0257i duk lokacin da za a cire ha\u0257i domin amfani. Idan an kunna binciken lafiya na OnCheckout, za a kashe binciken lafiya na bango na lokaci-lokaci.
ldap_connect_pool_health_check_interval_millis = Tsawon lokaci a milliseconds tsakanin binciken lafiya na bango na lokaci-lokaci a kan ha\u0257in da suke samuwa a cikin tafkin ha\u0257i.
ldap_connect_pool_health_check_max_response_time_millis = Mafi tsawon lokacin a milliseconds da ya kamata a ba amsar binciken lafiya damar dawowa daga sabar LDAP.
ldap_replication_password = Kalmar sirrin da mai amfani na syncrepl yake amfani da ita don tabbatar da shaida zuwa babban ldap.
ldap_postfix_password = Kalmar sirrin da postfix ke amfani da ita don tabbatar da shaida zuwa ldap.
ldap_amavis_password = Kalmar sirrin da amavis ke amfani da ita don tabbatar da shaida zuwa ldap.
ldap_starttls_supported = Ko sabar LDAP tana goyon bayan aikin startTLS.
ldap_require_tls = Ko ana bu\u0199atar TLS ga abokan cinikin LDAP.
ldap_cache_account_maxsize = Matsakaicin adadin abubuwan asusu da za a yi cache \u0257insu.
ldap_cache_account_maxage = Matsakaicin shekarun abubuwan asusu, a mintuna, a cikin cache.
ldap_cache_cos_maxsize = Matsakaicin adadin abubuwan cos da za a yi cache \u0257insu.
ldap_cache_cos_maxage = Matsakaicin shekarun abubuwan cos, a mintuna, a cikin cache.
ldap_cache_domain_maxsize = Matsakaicin adadin abubuwan domain da za a yi cache \u0257insu
ldap_cache_domain_maxage = Matsakaicin shekarun abubuwan domain, a mintuna, a cikin cache.
ldap_cache_mime_maxage = Matsakaicin shekaru, a mintuna, na abubuwan MIME a cikin cache.
ldap_cache_server_maxsize = Matsakaicin adadin abubuwan sabar da za a yi cache \u0257insu
ldap_cache_server_maxage = Matsakaicin shekarun abubuwan rukuni, a mintuna, a cikin cache.
ldap_cache_share_locator_maxsize = Matsakaicin abubuwan asusu a cikin cache na named entry.
ldap_cache_share_locator_maxage = TTL na cache na named entry a mintuna.
ldap_cache_timezone_maxsize = Matsakaicin adadin abubuwan timezone da za a yi cache \u0257insu.
ldap_cache_zimlet_maxsize = Matsakaicin adadin abubuwan zimlet da za a yi cache \u0257insu.
ldap_cache_zimlet_maxage = Matsakaicin shekarun abubuwan zimlet, a mintuna, a cikin cache.
ldap_cache_custom_dynamic_group_membership_maxage_ms = Matsakaicin shekaru, a milliseconds, na yin cache \u0257in wa\u0257anne dynamic groups ne asusu memba a cikinsu ga wa\u0257ancan groups \u0257in da membobinsu ake \u0199ayyade ta amfani da custom MemberURL.
csrf_filter_domain_allowed_ref_hosts_max_size = Matsakaicin adadin shigarwar domain a cikin cache na CsrfFilter per-domain allowedRefererHosts. Idan an sami kuskuren parsing, sai a koma zuwa ldap_cache_domain_maxsize.
csrf_filter_domain_allowed_ref_hosts_cache_expiry_mins = Matsakaicin shekaru, a mintuna, na shigarwar da ke cikin cache na CsrfFilter per-domain allowedRefererHosts. Bayan \u0199arewa, ana fitar da shigarwar kuma a sake lodata daga LDAP a bu\u0199ata ta gaba. Idan an sami kuskuren parsing, sai a koma zuwa mintuna 60.
mysql_directory = Wurin shigar MySQL.
mysql_data_directory = Babban fayil \u0257in da bayanan MySQL ya kamata su kasance a ciki.
mysql_errlogfile = Rajistar kuskuren MySQL/MariaDB.
mysql_socket = Hanya zuwa socket \u0257in MySQL don kayan aikin layin umarnin MySQL su yi amfani da shi.
mysql_pidfile = Fayil \u0257in da ake adana ID na aikin MySQL a ciki.
mysql_mycnf = Hanya zuwa my.cnf, fayil \u0257in saitin MySQL.
mysql_bind_address = Interface a wannan host \u0257in da MySQL zai \u0257aure da shi.
mysql_port = Lambar tashar da sabar MySQL ya kamata ta saurara a kanta.
mysql_root_password = Kalmar sirri ta ginanniyar mai amfani \u2018root\u2019 ta MySQL, kada a rikita ta da shiga ta UNIX root. Don sau\u0199i, yayin fara bayanan database ana \u0199ir\u0199irar bazuwar kalmar sirri, ajiye ta a local config da kuma a cikin MySQL. Idan ana son canza wannan kalmar sirri, a yi amfani da shirin zmmypasswd wanda zai canza kalmar sirrin a MySQL da kuma a local config.
mysql_memory_percent = Kashi na \u0199wa\u0199walwar tsarin da mysql zai yi amfani da shi. Ana adana wannan \u0199imar a nan domin shirin zmmycnf ya yi amfani da ita. Canza wannan saitin ba ya bayyana nan da nan a sabar MySQL. Dole ne, tare da taka-tsantsan sosai, a sake \u0199ir\u0199irar my.cnf kuma a sake kunna sabar MySQL domin canjin ya fara aiki.
mysql_innodb_log_buffer_size = A duba takardun MySQL don innodb_log_buffer_size. Ana adana wannan \u0199imar a nan domin shirin zmmycnf ya yi amfani da ita. Canza wannan saitin ba ya bayyana nan da nan a sabar MySQL. Dole ne, tare da taka-tsantsan sosai, a sake \u0199ir\u0199irar my.cnf kuma a sake kunna sabar MySQL domin canjin ya fara aiki.
mysql_innodb_log_file_size = A duba takardun MySQL don innodb_log_file_size. Ana adana wannan \u0199imar a nan domin shirin zmmycnf ya yi amfani da ita. Canza wannan saitin ba ya bayyana nan da nan a sabar MySQL. Dole ne, tare da taka-tsantsan sosai, a sake \u0199ir\u0199irar my.cnf kuma a sake kunna sabar MySQL domin canjin ya fara aiki.
mysql_sort_buffer_size = A duba takardun MySQL don sort_buffer_size. Ana adana wannan \u0199imar a nan domin shirin zmmycnf ya yi amfani da ita. Canza wannan saitin ba ya bayyana nan da nan a sabar MySQL. Dole ne, tare da taka-tsantsan sosai, a sake \u0199ir\u0199irar my.cnf kuma a sake kunna sabar MySQL domin canjin ya fara aiki.
mysql_read_buffer_size = A duba takardun MySQL don read_buffer_size. Ana adana wannan \u0199imar a nan domin shirin zmmycnf ya yi amfani da ita. Canza wannan saitin ba ya bayyana nan da nan a sabar MySQL. Dole ne, tare da taka-tsantsan sosai, a sake \u0199ir\u0199irar my.cnf kuma a sake kunna sabar MySQL domin canjin ya fara aiki.
mysql_backup_retention = Yawan sigogin ajiyar bayanan mysql da za a ri\u0199e.
antispam_mysql_enabled = Yi amfani da bayanan mysql don anti-spam. False ne a matsayin tsoho.
antispam_backup_retention = Yawan sigogin ajiyar bayanan anti-spam da za a ri\u0199e.
derby_properties = Hanya zuwa fayil \u0257in kaddarorin saitin derby.
imap_max_consecutive_error = Idan ya fi 0, a katse ha\u0257in imap idan an kai \u0199imar imap_max_consecutive_error.
imap_inactive_session_cache_size = Ehcache: mafi yawan adadin shigarwar cache na IMAP marasa aiki a kan faifai kafin a kore su.
imap_use_ehcache = Idan true ne, a yi amfani da Ehcache don cache na zaman IMAP. In ba haka ba, a yi amfani da cache na faifai.
imap_write_timeout = Saita lokacin \u0199arewar rubutun zaman IMAP (nio).
imap_write_chunk_size = Girman ma\u2019ajin rubutu na IMAP a bytes.
imap_thread_keep_alive_time = Tsohon tsawon lokaci, a da\u0199i\u0199u, na zaren IMAP.
imap_throttle_ip_limit = Idan ya fi 0, mafi yawan bu\u0199atun IMAP a sakan ga kowane IP.
imap_throttle_acct_limit = Idan ya fi 0, mafi yawan bu\u0199atun IMAP a sakan ga kowane asusu.
imap_suggested_batch_copy_size = Yawan sa\u0199onnin da za a sarrafa a kowane batch yayin ayyukan IMAP COPY.
imap_in_progress_response_thread_pool_size = Iyakar yawan zare a cikin pool don aika amsar InProgress ga abokin ciniki.
imap_in_progress_response_thread_keep_alive = Lokaci a da\u0199i\u0199u da za a ci gaba da ri\u0199e zaren kafin a dakatar da shi.
imap_ehcache_heap_size = Mafi yawan shigarwar cache na IMAP da ake adanawa a \u0253angaren heap na Ehcache.
imap_ehcache_skip_large_folder = Yana tsallake ajiye manyan jakokin IMAP a Ehcache idan an kunna shi.
imap_ehcache_folder_max_message_count = Matakin iyakar yawan sa\u0199onni wanda sama da shi ba a ajiye jakokin IMAP a Ehcache.
nio_imap_enabled = Idan true ne, a kunna Jetty non-blocking IO don IMAP.
nio_pop3_enabled = Idan true ne, a kunna Jetty non-blocking IO don POP3.
postfix_mail_owner = postfix_mail_owner
postfix_setgid_group = postfix_setgid_group
postfix_version = postfix_version
mailboxd_directory = Wurin shigar mailboxd.
mailboxd_java_heap_size = Yawan megabytes da za a yi amfani da su a matsayin matsakaicin girman Java heap (-Xmx) na JVM mai tafiyar da Mailboxd.
mailboxd_java_heap_new_size_percent = Kashi na girman Java heap da za a yi amfani da shi don young generation (-Xmn) na JVM mai tafiyar da Mailboxd.
mailboxd_java_options = Za\u0253u\u0253\u0253ukan JVM da za a yi amfani da su lokacin \u0199addamar da Mailboxd.
mailboxd_pidfile = Fayil \u0257in da ake adana ID na aikin JVM na Mailboxd a ciki.
mailboxd_keystore = Wurin fayil \u0257in bayanan keystore.
mailboxd_keystore_password = Kalmar sirri da za a yi amfani da ita tare da keystore na KeyManager.
mailboxd_truststore = Wurin fayil \u0257in bayanan truststore.
mailboxd_truststore_password = Kalmar sirri da za a yi amfani da ita tare da keystore na TrustManager.
client_ssl_truststore = Wurin fayil \u0257in bayanan truststore da ake amfani da shi don tantancewar SSL ta abokin ciniki.
client_ssl_truststore_password = Kalmar sirri da za a yi amfani da ita tare da keystore na SSL TrustManager na abokin ciniki.
mailboxd_output_file = Fayil \u0257in da za a karkatar da stdout da stderr na sabar zuwa gare shi.
mailboxd_output_rotate_interval = Lokaci, a da\u0199i\u0199u, da ake jujjuya fayil \u0257in fitar mailboxd a kai. Idan <= 0, ba a yin jujjuya.
mailboxd_thread_stack_size = Girman stack na zare don Mailboxd.
ssl_allow_untrusted_certs = Idan true ne, a ba da damar takardun shaidar SSL masu sa hannun kai.
zimlet_directory = Hanya zuwa Zimlets da aka girka.
calendar_outlook_compatible_allday_events = Yi amfani da abubuwan kalanda na yini gaba\u0257aya masu dacewa da Outlook. False ne a matsayin tsoho.
calendar_entourage_compatible_timezones = A sanya alamar quote ga sigar TZID a cikin kaddarorin iCalendar, domin kauce wa matsalar da ke MS Entourage. True ne a matsayin tsoho.
calendar_ics_import_full_parse_max_size = Yayin shigo da ics, a yi amfani da full parser idan girman ics ya yi \u0199asa da ko ya yi daidai da wannan; manyan fayilolin ics kuma callback parser zai fassara su, wanda ba ya ba da damar forward references zuwa VTIMEZONE TZID.
calendar_canonical_tzid = ID na yankin lokaci da za a mayar a matsayin TimeZone.getCanonicalID(). \u0198imomi masu yiwuwa: "olson","windows","java". "windows" ne a matsayin tsoho.
calendar_cache_enabled = Kunna cache na kalanda. False ne a matsayin tsoho.
calendar_cache_directory = Babban fayil na tushen fayilolin cache na kalanda.
calendar_cache_lru_size = Girman LRU na memory-cache. A ajiye adadin jakokin kalanda wannan a \u0199wa\u0199walwa.
calendar_cache_range_month_from = Watan farawa a zangon da aka ajiye a cache. 0 na nufin watan yanzu, -1 na nufin watan da ya gabata, da sauransu.
calendar_cache_range_months = Yawan watanni a cikin zangon da aka ajiye a cache.
krb5_keytab = Wurin fayil \u0257in keytab na Zimbra Kerberos 5.
krb5_debug_enabled = Kunna debug na Kerberos.
zimbra_mtareport_max_hosts = Mafi yawan adadin hosts da za a ha\u0257a a cikin rahotannin MTA na yau da kullum da zmdailyreport ke samarwa.
zimbra_mtareport_max_recipients = Yawan masu kar\u0253a da za a jera a rahotannin mta na yau da kullum.
zimbra_mtareport_max_senders = Yawan masu aikawa da za a jera a rahotannin mta na yau da kullum.
zimbra_mtareport_max_users = Mafi yawan adadin masu amfani da za a ha\u0257a a cikin rahotannin MTA na yau da kullum da zmdailyreport ke samarwa.
zimbra_auth_always_send_refer = A ko da yaushe a mayar da alamar <refer> a cikin amsar auth don tilasta redirect na abokin ciniki.
zimbra_admin_service_port = Tsohuwar tashar admin ta bootstrap.
zimbra_admin_service_scheme = Tsohon tsarin protocol na admin/bootstrap.
zimbra_mail_service_port = Tsohuwar tashar imel.
zimbra_zmprov_default_to_ldap = Ko zmprov yana komawa LDAP ko SOAP a matsayin tsoho.
zimbra_zmprov_default_soap_server = Tsohuwar sabar SOAP da zmprov zai ha\u0257a zuwa gare ta.
zmprov_safeguarded_attrs = Jerin siffofin provisioning masu darajoji da yawa da aka raba da wa\u0199afi wa\u0257anda suke bu\u0199atar kariya daga maye gurbi.
zmprov_tmp_directory = Babban fayil na wucin gadi don zmprov ya rubuta \u0199imomin siffofi na binary zuwa fayiloli.
zimbra_mailbox_groups = Yawan rukunin mailbox da za a rarraba sabbin mailbox zuwa gare su.
debug_mailboxindex_use_new_locking = Yi amfani da sabon salon kullewa don MailboxIndex.
zimbra_class_provisioning = Ajin interface na provisioning.
zimbra_class_accessmanager = Ajin interface na manajan damar shiga.
zimbra_class_mboxmanager = Ajin interface na manajan mailbox.
zimbra_class_database = Ajin saitin database.
zimbra_class_store = Ajin interface na ma\u2019ajin sa\u0199o.
zimbra_class_application = Ajin interface na aikace-aikacen Zimbra.
zimbra_class_rulerewriterfactory = Ajin interface na RuleRewriterFactory.
zimbra_class_dbconnfactory = Ajin factory na ha\u0257in database.
zimbra_class_soapsessionfactory = Ajin factory na zaman SOAP.
av_notify_user = Adireshin imel da za a aika sa\u0199onnin gudanarwa daga anti-virus da DKIM.
av_notify_domain = Tsohon domain a saitunan amavisd.
data_source_trust_self_signed_certs = Ba da damar takardun shaida masu sa hannun kai yayin ha\u0257awa da tushen bayanai ta SSL.
data_source_fetch_size = Mafi yawan sa\u0199onnin imap da za a FETCH a kowane bu\u0199ata.
data_source_max_literal_mem_size = Matsakaicin girman literal data (a bytes) da za a ajiye a cache a \u0199wa\u0199walwa. Za a adana bayanan da suka fi girma a fayil na wucin gadi.
timezone_file = Fayil \u0257in iCalendar mai lissafa sanannun yankunan lokaci.
search_disable_database_hints = Idan true ne, kada a yi amfani da database hints a cikin queries da aka \u0199ir\u0199ira yayin bincike.
search_dbfirst_term_percentage_cutoff = Sigar Internal Query Generation.
