zimbra_mailbox_galsync_cache = Yana saita mafi girman cache na abubuwan mai sadarwa na akwatin sa\u0199o na galsync. A sa \u0199imar ta zama a\u0199alla adadin abubuwan mai sadarwa da ke cikin akwatin sa\u0199o na galsync.
zimbra_mailbox_manager_hardref_cache = Matsakaicin adadin akwatinan sa\u0199o da za a \u0257aure a \u0199wa\u0199walwa kafin manajan akwatin sa\u0199o ya fara barin a tsarkake su ta hanyar tarin shara na SoftReference.
zimbra_mailbox_active_cache = Mafi girman girman cache na cikin gida na LRU na abubuwa a akwatin sa\u0199o lokacin da akwai zaman aiki.
zimbra_mailbox_inactive_cache = Mafi girman girman cache na cikin gida na LRU na abubuwa a akwatin sa\u0199o lokacin da babu zaman aiki.
zimbra_mailbox_change_checkpoint_frequency = Yawan sauyawa, wato adadin canje-canje, da ake rubuta \u0199imar canjin highwater ta ZIMBRA.MAILBOX.CHANGE_CHECKPOINT na akwatin sa\u0199o.
zimbra_index_elasticsearch_url_base = Tushen URL na REST API na ElasticSearch.
zimbra_index_threads = Girman thread pool don batch index.
zimbra_reindex_threads = Matsakaicin adadin zare don sake yin index. Zaren sake yin index ba a ha\u0257a su cikin pool ba.
zimbra_index_disable_perf_counters = Idan false ne, ana bibiyar karatu da rubuta IO na Lucene ta hanyar sa ido kan aikin Zimbra. \u0198imar true tana kashe sa ido kan IO na Lucene.
zimbra_index_max_readers = Matsakaicin adadin IndexReaders da za su iya gudana a lokaci guda
