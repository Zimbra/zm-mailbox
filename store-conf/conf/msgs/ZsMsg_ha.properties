httpclient_internal_client_connection_timeout = Abokin httpclient don ha\u0257e-ha\u0257en cikin gida na Zimbra: yana saita lokacin \u0199arewa a millisekan da ake amfani da shi yayin samo ha\u0257in HTTP daga manajan ha\u0257in HTTP.
httpclient_internal_connmgr_connection_timeout = Manajan ha\u0257in httpclient don ha\u0257e-ha\u0257en cikin gida na Zimbra: yana \u0199ayyade lokacin \u0199arewa har sai an kafa ha\u0257i. Darajar sifili na nufin ba a amfani da lokacin \u0199arewar.
httpclient_internal_connmgr_idle_reaper_connection_timeout = Manajan ha\u0257in httpclient idle reaper don ha\u0257e-ha\u0257en cikin gida na Zimbra: darajar lokacin \u0199arewa da za a yi amfani da ita yayin gwada ha\u0257e-ha\u0257e marasa aiki.
httpclient_internal_connmgr_idle_reaper_sleep_interval = Manajan ha\u0257in httpclient idle reaper don ha\u0257e-ha\u0257en cikin gida na Zimbra: tsawon lokacin (a millisekan) da zaren mai tsabtace ha\u0257e-ha\u0257e marasa aiki na manajan ha\u0257in httpclient yake barci tsakanin ayyuka. 0 na nufin an kashe zaren reaper.
httpclient_internal_connmgr_max_host_connections = Manajan ha\u0257in httpclient don ha\u0257e-ha\u0257en cikin gida na Zimbra: yana ayyana matsakaicin adadin ha\u0257e-ha\u0257en da aka yarda da su ga kowane tsarin mai masauki.
httpclient_internal_connmgr_max_total_connections = Manajan ha\u0257in httpclient don ha\u0257e-ha\u0257en cikin gida na Zimbra: yana ayyana matsakaicin jimillar adadin ha\u0257e-ha\u0257en da aka yarda da su.
httpclient_internal_connmgr_so_timeout = Manajan ha\u0257in httpclient don ha\u0257e-ha\u0257en cikin gida na Zimbra: ana fassara darajar lokacin \u0199arewa ta sifili a matsayin lokacin \u0199arewa mara iyaka. Ana amfani da wannan darajar idan ba a saita lokacin \u0199arewar socket a sigogin hanyar HTTP ba.
httpclient_internal_connmgr_tcp_nodelay = Manajan ha\u0257in httpclient don ha\u0257e-ha\u0257en cikin gida na Zimbra: yana ayyana ko a kashe algorithm na Nagle a kan socket na HTTP.
httpclient_internal_connmgr_stale_connection_check = Manajan ha\u0257in httpclient don ha\u0257e-ha\u0257en cikin gida na Zimbra: yana \u0199ayyade ko za a yi amfani da binciken tsohuwar ha\u0257i. Kashe binciken tsohuwar ha\u0257i na iya kawo \u0199aramin ingantuwar aiki amma yana haifar da ha\u0257arin samun kuskuren I/O yayin aiwatar da bu\u0199ata a kan ha\u0257in da aka rufe daga \u0253angaren sabar.
httpclient_external_client_connection_timeout = Abokin httpclient don ha\u0257e-ha\u0257e na waje: yana saita lokacin \u0199arewa a millisekan da ake amfani da shi yayin samo ha\u0257in HTTP daga manajan ha\u0257in HTTP. Kashe binciken tsohuwar ha\u0257i na iya kawo \u0199aramin ingantuwar aiki amma yana haifar da ha\u0257arin samun kuskuren I/O yayin aiwatar da bu\u0199ata a kan ha\u0257in da aka rufe daga \u0253angaren sabar.
httpclient_external_connmgr_connection_timeout = Manajan ha\u0257in httpclient don ha\u0257e-ha\u0257e na waje: yana \u0199ayyade lokacin \u0199arewa har sai an kafa ha\u0257i. Darajar sifili na nufin ba a amfani da lokacin \u0199arewar.
httpclient_external_connmgr_idle_reaper_connection_timeout = Manajan ha\u0257in httpclient idle reaper don ha\u0257e-ha\u0257e na waje: darajar lokacin \u0199arewa da za a yi amfani da ita yayin gwada ha\u0257e-ha\u0257e marasa aiki.
httpclient_external_connmgr_idle_reaper_sleep_interval = Manajan ha\u0257in httpclient idle reaper don ha\u0257e-ha\u0257e na waje: tsawon lokacin (a millisekan) da zaren mai tsabtace ha\u0257e-ha\u0257e marasa aiki na manajan ha\u0257in httpclient yake barci tsakanin ayyuka. 0 na nufin an kashe zaren reaper.
httpclient_external_connmgr_max_host_connections = Manajan ha\u0257in httpclient don ha\u0257e-ha\u0257e na waje: yana ayyana matsakaicin adadin ha\u0257e-ha\u0257en da aka yarda da su ga kowane tsarin mai masauki.
httpclient_external_connmgr_max_total_connections = Manajan ha\u0257in httpclient don ha\u0257e-ha\u0257e na waje: yana ayyana matsakaicin jimillar adadin ha\u0257e-ha\u0257en da aka yarda da su.
httpclient_external_connmgr_so_timeout = Manajan ha\u0257in httpclient don ha\u0257e-ha\u0257e na waje: ana fassara darajar lokacin \u0199arewa ta sifili a matsayin lokacin \u0199arewa mara iyaka. Ana amfani da wannan darajar idan ba a saita lokacin \u0199arewar socket a sigogin hanyar HTTP ba.
httpclient_external_connmgr_tcp_nodelay = Manajan ha\u0257in httpclient don ha\u0257e-ha\u0257e na waje: yana ayyana ko a kashe algorithm na Nagle a kan socket na HTTP.
httpclient_external_connmgr_stale_connection_check = Manajan ha\u0257in httpclient don ha\u0257e-ha\u0257e na waje: yana \u0199ayyade ko za a yi amfani da binciken tsohuwar ha\u0257i.
httpclient_convertd_so_timeout = Lokacin \u0199arewar socket a millisekan don abokin convertd. Idan 0 ne, wannan na nufin babu lokacin \u0199arewa. Idan -1 ne ko ba a saita ba, wannan na nufin a yi amfani da tsohon lokacin karatu na manajan ha\u0257in.
