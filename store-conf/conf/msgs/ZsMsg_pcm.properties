zimbra_mailbox_galsync_cache = Set di maximum galsync mailbox contact item cache. Set di value make e at least reach di number of contact items for di galsync mailbox.
zimbra_mailbox_manager_hardref_cache = Di maximum number of mailboxes wey go stay pinned for memory before di mailbox manager go begin allow dem make dem purge dem through SoftReference garbage collection.
zimbra_mailbox_active_cache = Di maximum size of one mailbox internal LRU item cache when sessions dey active.
zimbra_mailbox_inactive_cache = Di maximum size of one mailbox internal LRU item cache when e no get active sessions.
zimbra_mailbox_change_checkpoint_frequency = Di frequency (for number of changes) wey dem dey use write one mailbox ZIMBRA.MAILBOX.CHANGE_CHECKPOINT highwater change value.
zimbra_index_elasticsearch_url_base = Base URL wey ElasticSearch REST API dey use.
zimbra_index_threads = Size of di thread pool for batch index.
zimbra_reindex_threads = Maximum number of threads for re-index. Re-index threads no dey pooled.
zimbra_index_disable_perf_counters = If false, Zimbra performance monitoring go track Lucene read and write IO. True value go disable Lucene IO monitoring.
zimbra_index_max_readers = Maximum number of IndexReaders wey fit run together.
zimbra_index_max_writers = Maximum number of IndexWriters wey fit run together.
zimbra_index_reader_cache_size = Maximum number of IndexReaders for di search index cache
zimbra_index_reader_cache_ttl = If e idle pass dis value (seconds), remove di IndexReader from di cache
zimbra_index_deferred_items_failure_delay = After failure, di minimum delay (seconds) between attempts to clear out di queue of unindexed (deferred) items
zimbra_index_lucene_max_terms_per_query = Set di maximum number of terms wey dem permit per query.
zimbra_index_max_transaction_bytes = When dem dey batch index operations into one Mailbox transaction, dis na di maximum aggregate size of items wey we go allow for one single transaction
zimbra_index_max_transaction_items = When dem dey batch index operations, dis na di maximum number of mail_items wey we go allow for one single transaction
zimbra_index_max_pending_deletes = Maximum number of pending index deletes before dem reclaim di disk space
zimbra_index_lucene_merge_policy = true make e use LogDocMergePolicy, false make e use LogByteSizeMergePolicy. LogDocMergePolicy dey choose segments to merge based on di number of documents. LogByteSizeMergePolicy dey choose segments to merge based on dia size.
zimbra_index_lucene_min_merge = Set di Lucene minimum merge size for Documents or KB depending on di merge policy wey dem specify for zimbra_index_lucene_merge_policy.
zimbra_index_lucene_max_merge = Set di Lucene maximum merge size for Documents or KB depending on di merge policy wey dem specify for zimbra_index_lucene_merge_policy. Dis value determine di largest segment wey fit merge with other segments.
zimbra_index_lucene_merge_factor = How often addDocument() dey merge segment indices. With smaller values, dem use less RAM while indexing, and searches go faster, but indexing speed go slower. With larger values, dem use more RAM during indexing, and even though searches go slower, indexing go faster. Larger values (>10) na better for batch index creation, and smaller values (<10) for indices wey dem dey maintain interactively.
zimbra_index_lucene_term_index_divisor = E dey subsample which indexed terms dem load into RAM. If you set am to value > 1, you fit reduce memory usage, but latency go higher when dem dey load di record information wey dem store for one term.
zimbra_index_lucene_use_compound_file = true if new Lucene segment suppose use di compound file format. http://wiki.apache.org/lucene-java/ImproveIndexingSpeed talk say make you turn off compound file format for better performance, but e go greatly increase di number of file descriptors. File descriptors fit finish if zimbra_index_lucene_merge_factor dey large.
zimbra_index_lucene_max_buffered_docs = Di minimum number of documents wey dem require before dem flush di buffered in-memory documents as new segment. Large values generally dey give faster indexing.
zimbra_index_lucene_ram_buffer_size_kb = Maximum buffered RAM for Lucene, in KB.
zimbra_index_lucene_io_impl = Lucene FSDirectory implementation wey dem use for indexing IO. Possible values: nio - Use NIOFSDirectory. E dey use java.nio FileChannel positional io when reading to avoid synchronization when dem dey read from di same file. mmap - Use MMapDirectory. E dey use memory-mapped IO when reading. Na good choice if plenty virtual memory dey relative to di index size. simple - Use SimpleFSDirectory. E dey use java.io.RandomAccessFile. Concurrent performance no too good because e dey synchronize when multiple threads read di same file. If dem no provide value, FSDirectory go choose di best implementation for di environment.
zimbra_index_rfc822address_max_token_count = Di maximum token count for addresses for di RFC822 address token stream. Di limit dey apply to all FROM, TO, and CC headers for emails, all email addresses for Contacts, and Creator field for Documents.
zimbra_index_rfc822address_max_token_length = Di maximum token length for one address for di RFC822 address token stream. Di limit dey apply to all FROM, TO, and CC headers for emails, all email addresses for Contacts, and Creator field for Documents.
zimbra_index_wildcard_max_terms_expanded = Maximum wildcard expansions for each individual term for di query.
zimbra_galsync_index_reader_cache_size = Di maximum number of IndexReaders for di GAL search index cache. Dem cache di GAL sync account Lucene index separately and e no get automatic eviction.
zimbra_spam_report_queue_size = For Junk/Not Junk Msg/ConvActionRequests, dis queue size dey limit di server workqueue for processing di forwards.
zimbra_throttle_op_concurrency = Comma-separated list of concurrency values for each of di 5 priority levels, from highest priority reach lowest priority
zimbra_im_chat_flush_time = How often (seconds) dem dey write open IM chats to di store
zimbra_im_chat_close_time = How long (seconds) di server go wait before e close idle IM chat sessions
zimbra_http_originating_ip_header = HTTP header wey dem go check to determine di original IP address of di client
zimbra_session_limit_imap = Maximum number of IMAP folders wey one user fit open at once
zimbra_session_limit_admin = Maximum number of admin SOAP sessions wey one user fit open at once
zimbra_session_limit_soap = Maximum number of active SOAP sessions per account. Increase dis value carefully to avoid "Too many SOAP sessions\u201d errors in mailbox.log.
zimbra_session_limit_sync = Maximum number of per-session sync listeners for ActiveSync. Increase dis value carefully to avoid "Too many SYNCLISTENER sessions" errors in sync.log.
zimbra_session_timeout_soap = Idle timeout (in seconds) wey SOAP sessions get.
zimbra_session_max_pending_notifications = Maximum number of pending notifications wey fit queue for one SOAP session before dem purge di queue and tell di client say dia state no valid
