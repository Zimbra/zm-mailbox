licenseFeaureOnHoldNotifierSubject = Zimbra System Alert: Feature(s) usage don pass di limit
licenseFeaureOnHoldNotifierBodyText = Di licensed number of accounts for these features don reach or pass di limit:\n{0}\nYou fit either reduce how the existing users dey use am or increase the feature license limit.\n\nTo increase the feature license limit, abeg contact Zimbra Sales at sales@zimbra.com.\nTo manage account feature allocation, abeg sign in to the Admin Portal.\n\nAbeg note dis:\n1. You go continue to receive the notification for {1,number,integer} days from the date wey usage pass di limit.\n2. You no go fit enable the overused feature for any accounts.\n3. If you no take any action on the overused feature, dem go disable the feature for the users so e fit come back under the licensed limit.\n\nRegards,\nZimbra Support
licenseFeaureOnHoldNotifierBodyHtml = <div style="font-family:sans-serif;">Di licensed number of accounts for these features don reach or pass di limit:<br>{0}<br>You fit either reduce how the existing users dey use am or increase the feature license limit.<br><br>To increase the feature license limit, abeg contact Zimbra Sales at <b>sales@zimbra.com</b>.<br>To manage account feature allocation, abeg sign in to the Admin Portal.<br><br>Abeg note dis:<br>1. You go continue to receive the notification for {1,number,integer} days from the date wey usage pass di limit.<br>2. You no go fit enable the overused feature for any accounts.<br>3. If you no take any action on the overused feature, dem go disable the feature for the users so e fit come back under the licensed limit.<br><br>Regards,<br>Zimbra Support</div>
