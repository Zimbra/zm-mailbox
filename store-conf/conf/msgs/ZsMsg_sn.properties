#license notification email for exceeding usage count for feature
licenseFeaureOnHoldNotifierSubject = Yambiro yeSisitimu yeZimbra: Muganhu wekushandiswa kwemaficha wapfuurwa
licenseFeaureOnHoldNotifierBodyText=Nhamba yeakaundi dzakatenderwa nerezinesi yasvika kana kudarika kumaficha anotevera:\n{0}\nMunogona kuderedza kushandiswa kwevashandisi varipo kana kuwedzera muganhu weresinesi reficha.\n\nKuti muwedzere muganhu weresinesi reficha, ndapota batai Zimbra Sales pa sales@zimbra.com.\nKuti mutarise kugoverwa kwemaficha kumaakaundi, ndapota pinda muAdmin Portal.\n\nNdapota cherechedzai zvinotevera:\n1. Mucharamba muchigamuchira chiziviso ichi kwemazuva {1,number,integer} kubva pazuva rakapfuurwa muganhu wekushandisa.\n2. Hamuzokwanisi kugonesa ficha yashandiswa zvakanyanya kune chero akaundi.\n3. Kana mukasatora matanho paficha yashandiswa zvakanyanya, ficha yacho ichadzimwa kuvashandisi kuitira kuti idzoke pasi pemuganhu weresinesi.\n\nKwaziso,\nZimbra Support
licenseFeaureOnHoldNotifierBodyHtml=<div style="font-family:sans-serif;">Nhamba yeakaundi dzakatenderwa nerezinesi yasvika kana kudarika kumaficha anotevera:<br>{0}<br>Munogona kuderedza kushandiswa kwevashandisi varipo kana kuwedzera muganhu weresinesi reficha.<br><br>Kuti muwedzere muganhu weresinesi reficha, ndapota batai Zimbra Sales pa <b>sales@zimbra.com</b>.<br>Kuti mutarise kugoverwa kwemaficha kumaakaundi, ndapota pinda muAdmin Portal.<br><br>Ndapota cherechedzai zvinotevera:<br>1. Mucharamba muchigamuchira chiziviso ichi kwemazuva {1,number,integer} kubva pazuva rakapfuurwa muganhu wekushandisa.<br>2. Hamuzokwanisi kugonesa ficha yashandiswa zvakanyanya kune chero akaundi.<br>3. Kana mukasatora matanho paficha yashandiswa zvakanyanya, ficha yacho ichadzimwa kuvashandisi kuitira kuti idzoke pasi pemuganhu weresinesi.<br><br>Kwaziso,<br>Zimbra Support</div>

