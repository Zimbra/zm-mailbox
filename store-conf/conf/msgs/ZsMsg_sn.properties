# local config settings

zimbra_home = Mudzi wekuiswa kweZimbra uye dhairekitori repamba remushandisi weUNIX anonzi \u2018zimbra\u2019. Hamugoni kufambisa mudzi wekuiswa - musachinje marongero aya.
zimbra_java_home = Nzira inoenda kuJDK/J2SDK.
zimbra_log_directory = Dhairekitori rinonyorerwa mafaira elog.
zimbra_index_directory = Dhairekitori remafaira eindekisi ebhokisi reimeyili.
zimbra_store_directory = Dhairekitori remameseji ebhokisi reimeyili.
zimbra_db_directory = Dhairekitori remafaira edhatabhesi.
zimbra_tmp_directory = Dhairekitori remafaira echinguvana.
zimbra_hybrid_blob_mover_enabled = Inoseta kuti chikamu cheHybrid Blob Mover chabatidzwa here. Zvinogara zviri: false
zimbra_extensions_directory = Dhairekitori rine madhairekitori madiki ane maextension.
zimbra_extensions_common_directory = Dhairekitori rine mafaira ejar anowanikwa kumaextension ese.
zimbra_mysql_shutdown_timeout = Nguva yekumirira kuti maitiro eMySQL/MariaDB ebhokisi reimeyili amire. Wedzerai nguva yekupedzisira kana mysql.server iri kutora nguva refu kumisa maitiro acho.
zimbra_mysql_user = Zita remushandisi reMySQL rinoshandiswa kugadzira kana kupinda mumadatabase nematafura eZimbra. Iri ndiro kukosha kwamungapa kusarudzo ye\u2018-u\u2019 yechirongwa chemutsetse wemirairo che\u2018mysql\u2019.
zimbra_mysql_password = Pasiwedhi yezimbra_mysql_user. Yakachengetwa mukonifigi yemuno kuti ishandiswe neapp yechitoro pakuzvisimbisa. Kana muchida kuchinja pasiwedhi iyi, ndapota shandisai chirongwa chezmmypasswd chinochinja pasiwedhi muMySQL nemukonifigi yemuno.
zimbra_ldap_userdn = LDAP dn rinoshandiswa kuzvisimbisa neapp yechitoro kuLDAP.
zimbra_ldap_user = Zita remushandisi reZimbra rinoshandiswa kuzvisimbisa neadmin AuthRequest.
zimbra_ldap_password = Pasiwedhi yezimbra_ldap_userdn. Yakachengetwa mukonifigi yemuno kuti ishandiswe neapp yechitoro pakuzvisimbisa. Kana muchida kuchinja pasiwedhi iyi, ndapota shandisai chirongwa chezmldappasswd chinochinja pasiwedhi muLDAP nemukonifigi yemuno.
zimbra_server_hostname = Zita rakapihwa server iyi. Panofanira kuva nechinyorwa che\u2018server\u2019 chinoenderana nacho muLDAP - tarisai zvinyorwa zvekuraira kweCreateServer muchirongwa chezmprov.
zimbra_user = Mushandisi weunix weZimbra uyo maitiro eserver yeZimbra anofanira kuchinjira kumvumo dzake mushure mekubatanidza mapoti ane mvumo dzakakosha.
zimbra_uid = Iyo unix uid yeZimbra iyo maitiro eserver yeZimbra anofanira kuchinjira kumvumo dzayo mushure mekubatanidza mapoti ane mvumo dzakakosha.
zimbra_gid = Iyo unix gid yeZimbra iyo maitiro eserver yeZimbra anofanira kuchinjira kumvumo dzayo mushure mekubatanidza mapoti ane mvumo dzakakosha.
zimbra_log4j_properties = Nzira inoenda kufaira reproperties rekonifigireisheni ye log4j.
zimbra_log4j_properties_watch = Nguva yekutarisa zvakare yefaira reproperties rekonifigireisheni ye log4j mumasekondi ezviuru (msec).
zimbra_attrs_directory = Dhairekitori rine mafaira e*.xml anotsanangura sintakisi yehunhu hweLDAP hunoshandiswa nehurongwa
localized_msgs_directory = Dhairekitori remafaira emameseji emutauro.
localized_client_msgs_directory = Dhairekitori remafaira emameseji emutauro emutengi.
skins_directory = Dhairekitori remaskin.
zimbra_store_sweeper_max_age = Mafaira akura kupfuura maminitsi aya anobviswa ega kubva kudhairekitori rinopinda rechitoro.
zimbra_store_copy_buffer_size_kb = Maitiro ekukopa faira anoshandisa mabhafa ehukuru uhu
zimbra_mailbox_galsync_cache = Inoisa huwandu hwepamusoro hwecache yezvinhu zvemakontakiti mu mailbox yegalsync. Isa kukosha uku kuti kuenzane kana kupfuure huwandu hwezvinhu zvemakontakiti zviri mu mailbox yegalsync.
zimbra_mailbox_manager_hardref_cache = Huwandu hwepamusoro hwema mailbox anoramba akasungwa mumemory mailbox manager isati yatanga kubvumira kuti abviswe neSoftReference garbage collection.
zimbra_mailbox_active_cache = Saizi yepamusoro yecache yemukati yeLRU yezvinhu zvemailbox kana kune masession ari kushanda.
zimbra_mailbox_inactive_cache = Saizi yepamusoro yecache yemukati yeLRU yezvinhu zvemailbox kana isina masession ari kushanda.
zimbra_mailbox_change_checkpoint_frequency = Kuwanda kwekudzokororwa (maererano nehuwandu hwekuchinja) uko kukosha kwekuchinja kwepamusoro kweZIMBRA.MAILBOX.CHANGE_CHECKPOINT kwemailbox kunonyorwa.
zimbra_index_elasticsearch_url_base = Base URL yeElasticSearch REST API.
zimbra_index_threads = Saizi yethread pool yebatch index.
zimbra_reindex_threads = Huwandu hwepamusoro hwema thread ere-index. Re-index threads haasi mu pool.
zimbra_index_disable_perf_counters = Kana iri false, Lucene yekuverenga neyekunyora IO zvinoteverwa neZimbra performance monitoring. Kukosha kwe true kunodzima Lucene IO monitoring.
zimbra_index_max_readers = Huwandu hwepamusoro hweIndexReaders dzinogona kushanda panguva imwe chete.
zimbra_index_max_writers = Huwandu hwepamusoro hweIndexWriters dzinogona kushanda panguva imwe chete.
zimbra_index_reader_cache_size = Huwandu hwepamusoro hweIndexReaders mucache ye search index.
zimbra_index_reader_cache_ttl = Kana yakagara isina kushanda kupfuura kukosha uku (masekondi), bvisa IndexReader mucache.
zimbra_index_deferred_items_failure_delay = Mushure mekukundikana, kunonoka kushoma (masekondi) pakati pekuedza kubvisa queue yezvinhu zvisina kuiswa muindex (deferred).
zimbra_index_lucene_max_terms_per_query = Isa huwandu hwepamusoro hwematemu anobvumidzwa pakubvunza kumwe chete.
zimbra_index_max_transaction_bytes = Pakubatanidza mashandiro eindex mu transaction yeMailbox, iyi ndiyo saizi yepamusoro yose yezvinhu zvatinobvumira mu transaction imwe chete.
zimbra_index_max_transaction_items = Pakubatanidza mashandiro eindex, iyi ndiyo nhamba yepamusoro yema mail_items atinobvumira mu transaction imwe chete.
zimbra_index_max_pending_deletes = Huwandu hwepamusoro hwekudzimwa kweindex kwakamirira kusvikira nzvimbo yedhisiki yadzorerwa.
zimbra_index_lucene_merge_policy = true kushandisa LogDocMergePolicy, false kushandisa LogByteSizeMergePolicy. LogDocMergePolicy inosarudza masegment ekubatanidza zvichienderana nehuwandu hwemagwaro. LogByteSizeMergePolicy inosarudza masegment ekubatanidza zvichienderana nesaizi yawo.
zimbra_index_lucene_min_merge = Inoisa saizi shoma yeLucene merge mu Documents kana KB zvichienderana nemerge policy yakatsanangurwa mu zimbra_index_lucene_merge_policy.
zimbra_index_lucene_max_merge = Inoisa saizi yepamusoro yeLucene merge mu Documents kana KB zvichienderana nemerge policy yakatsanangurwa mu zimbra_index_lucene_merge_policy. Kukosha uku kunotara segment hombe inogona kubatanidzwa nemamwe masegment.
zimbra_index_lucene_merge_factor = Masegment index anobatanidzwa kangani ne addDocument(). Nekukosha kudiki, RAM shoma inoshandiswa pakuisa muindex uye kutsvaga kunokurumidza, asi indexing inononoka. Nekukosha kukuru, RAM yakawanda inoshandiswa pakuisa muindex uye, kunyange kutsvaga kuchinonoka, indexing inokurumidza. Kukosha kukuru (>10) kwakanakira kugadzira batch index, uye kukosha kudiki (<10) kwemaindex anochengetwa zvichipindirana.
zimbra_index_lucene_term_index_divisor = Inotora sampuli diki yematemu akaiswa muindex anopinzwa muRAM. Nekuisa kukosha uku ku > 1 unogona kuderedza kushandiswa kwememory asi uchiwedzera kunonoka pakurodha ruzivo rwerekodhi rwakachengeterwa temu.
zimbra_index_lucene_use_compound_file = true kana segment itsva yeLucene ichifanira kushandisa compound file format. http://wiki.apache.org/lucene-java/ImproveIndexingSpeed inoti compound file format inofanira kudzimiwa kuti performance ive nani, asi izvi zvinowedzera zvikuru huwandu hwefile descriptors. File descriptors dzinogona kupera kana zimbra_index_lucene_merge_factor iri hombe.
zimbra_index_lucene_max_buffered_docs = Huwandu hushoma hwemagwaro hunodiwa magwaro akabufferwa mumemory asati abuditswa sesegment itsva. Kazhinji kukosha kukuru kunopa indexing inokurumidza.
zimbra_index_lucene_ram_buffer_size_kb = Huwandu hwepamusoro hweRAM yakabufferwa neLucene mu KB.
zimbra_index_lucene_io_impl = Implementation yeLucene FSDirectory inoshandiswa pakuindexa IO. Zvikosha zvinogoneka ndezvi nio - shandisa NIOFSDirectory. Inoshandisa positional io yeFileChannel yejava.nio pakuverenga kuti irege kusynchronizer kana richiverengwa faira rimwe chete. mmap - shandisa MMapDirectory. Inoshandisa memory-mapped IO pakuverenga. Sarudzo yakanaka kana paine virtual memory yakawanda maererano nesaizi yeindex. simple - shandisa SimpleFSDirectory. Inoshandisa java.io.RandomAccessFile. Ine concurrent performance isina kusimba nekuti inosynchronizer kana mathread mazhinji achiverenga faira rimwe chete. Kana pasina kukosha kwapihwa, FSDirectory ichasarudza implementation yakanakisisa yenharaunda yacho.
zimbra_index_rfc822address_max_token_count = Huwandu hwepamusoro hwematoken emakero muRFC822 address token stream. Muganhu uyu unoshanda kumahedha ese eFROM, TO, neCC emaimeyili, kumaadresi ese eimeyili eMakontakiti, uye kufield yeCreator yeDocuments.
zimbra_index_rfc822address_max_token_length = Hurefu hwepamusoro hwetoken yekero muRFC822 address token stream. Muganhu uyu unoshanda kumahedha ese eFROM, TO, neCC emaimeyili, kumaadresi ese eimeyili eMakontakiti, uye kufield yeCreator yeDocuments.
zimbra_index_wildcard_max_terms_expanded = Huwandu hwepamusoro hwekuwedzerwa kwewildcard patega patega temu iri mukubvunza.
zimbra_galsync_index_reader_cache_size = Huwandu hwepamusoro hweIndexReaders mucache yeGAL search index. Index yeLucene yeakaundi yeGAL sync inochengetwa yega pasina kudzingwa otomatiki.
zimbra_spam_report_queue_size = PaJunk/Not Junk Msg/ConvActionRequests, saizi yequeue iyi inomisa hukuru hweworkqueue yeserver yekugadzirisa kuforwarda.
zimbra_throttle_op_concurrency = Rondedzero yakaparadzaniswa nemakoma yezvikosha zveconcurrency pamatanho mashanu epriority kubva pakakwirira kusvika pakaderera.
zimbra_im_chat_flush_time = IM chats dzakavhurika dzinonyorwa kangani (masekondi) muchitoro.
zimbra_im_chat_close_time = Server inomirira nguva yakareba sei (masekondi) kuti ivhare masession eIM chat asiri kushanda.
zimbra_http_originating_ip_header = HTTP header inotariswa kuti uone IP address yekutanga yemutengi.
zimbra_session_limit_imap = Huwandu hwepamusoro hwemaIMAP foda dzinogona kuvhurwa nemushandisi mumwe chete panguva imwe.
zimbra_session_limit_admin = Huwandu hwepamusoro hwemasession eadmin SOAP anogona kuvhurwa nemushandisi mumwe chete panguva imwe.
zimbra_session_limit_soap = Huwandu hwepamusoro hwemasession eSOAP ari kushanda paakaundi imwe. Wedzera kukosha uku zvinyoronyoro kuti udzivise zvikanganiso zve"Too many SOAP sessions" mu mailbox.log.
zimbra_session_limit_sync = Huwandu hwepamusoro hwe sync listeners pasession yeActiveSync. Wedzera kukosha uku zvinyoronyoro kuti udzivise zvikanganiso zve"Too many SYNCLISTENER sessions" mu sync.log.
zimbra_session_timeout_soap = Idle timeout (mumasekondi) yemasession eSOAP.
zimbra_session_max_pending_notifications = Huwandu hwepamusoro hwezviziviso zvakamirira zvinogona kuiswa muqueue musession yeSOAP queue isati yacheneswa uye client yaziviswa kuti state yayo haina kushanda.
zimbra_converter_enabled_uuencode = Kana decoder yeUUENCODE ichifanira kumhanywa pakupatsanura meseji kubva muchitoro.
zimbra_converter_enabled_tnef = Kana decoder yeTNEF ichifanira kumhanywa pakupatsanura meseji kubva muchitoro.
zimbra_converter_depth_max = Kudzika kweMIME part kunodzokororwa uko converters dzisingashandi pasi paro.
zimbra_ssl_enabled = Kana ssl keystore ichifanira kurodhwa kana kuti kwete.
stats_img_folder = Dhairekitori rekuchengetera mifananidzo yezviverengero yakagadzirwa.
ldap_host = LDAP host yekushandisa. Yaregedzwa - shandisa ldap_url panzvimbo payo.
ldap_log_level = Nhanho yelogging yeLDAP.
ldap_port = LDAP port yekushandisa. Yaregedzwa - shandisa ldap_url panzvimbo payo.
ldap_url = Rondedzero yemaserver eLDAP anoshandiswa neserver iyi.
ldap_master_url = URL inoenda kuLDAP master.
ldap_is_master = Host iyi ndiyo master LDAP server here?
ldap_root_password = Pasiwedhi ye rootdn yeLDAP slapd.conf. Kuti zvive nyore, panguva yekutanga kweLDAP panogadzirwa pasiwedhi isingasarudzwi kare, yochengetwa mulocal config uye mu slapd.conf. Kana uchida kuchinja pasiwedhi iyi, shandisa chirongwa che zmldappasswd chinobva chachinja pasiwedhi iri mu slapd.conf nemu local config zviri zviviri.
ldap_connect_timeout = Mamirisekondi apfuura apo kuyedza kubatana kunomiswa.
ldap_read_timeout = Mamirisekondi apfuura apo kuyedza kuverenga kunomiswa.
ldap_deref_aliases = Kana maalias achifanira kudereferenswa pakutsvaga kana kubatanidza kune external directory. Zvikosha zvinobvumidzwa ndezvi: always, never, finding, searching.
ldap_connect_pool_master = Kana JNDI connection pooling ichifanira kushandiswa kuLDAP master.
ldap_connect_pool_debug = Kana LDAP connection pooling ichifanira kudebugwa.
ldap_connect_pool_initsize = Huwandu hwekutanga hwemaLDAP connections ari kushanda hwekukwidziridzwa kusvika pahwo.
ldap_connect_pool_maxsize = Huwandu hwepamusoro hwemaLDAP connections ari kushanda neasina kushanda anobvumidzwa.
ldap_connect_pool_prefsize = Huwandu hunodiwa hwemaLDAP connections - kuisa maxsize neprefsize zvakafanana kunochengeta connection pool iri pasaizi yakatarwa.
ldap_connect_pool_timeout = Mamirisekondi enguva yekusashanda usati wabvisa connection isiri kushanda mupool.
ldap_connect_pool_health_check_on_checkout_enabled = Kana health check yeconnection pool ichifanira kuitwa pese panenge paine connection iri kutorwa kuti ishandiswe. Kana OnCheckout health check yakagoneswa, periodic background health check inodzimwa.
ldap_connect_pool_health_check_interval_millis = Nguva iri mumamirisekondi pakati pema periodic background health checks anorova connections aripo muconnection pool.
ldap_connect_pool_health_check_max_response_time_millis = Nguva yepamusoro iri mumamirisekondi inofanira kubvumidzwa kuti mhinduro yehealth check idzoke kubva kuseva yeLDAP.
ldap_replication_password = Pasiwedhi inoshandiswa nemushandisi wesyncrepl kuti asimbise kuzivikanwa ku ldap master.
ldap_postfix_password = Pasiwedhi inoshandiswa nepostfix kuti isimbise kuzivikanwa ku ldap.
ldap_amavis_password = Pasiwedhi inoshandiswa neamavis kuti isimbise kuzivikanwa ku ldap.
ldap_starttls_supported = Kana server yeLDAP ichitsigira startTLS operation.
ldap_require_tls = Kana TLS ichidikanwa kune vatengi veLDAP.
ldap_cache_account_maxsize = Huwandu hwepamusoro hwezvinhu zveakaundi zvinogona kuchengetwa mucache.
ldap_cache_account_maxage = Zera repamusoro (mumaminitsi) rezvinhu zveakaundi mucache.
ldap_cache_cos_maxsize = Huwandu hwepamusoro hwezvinhu zvecos zvinogona kuchengetwa mucache.
ldap_cache_cos_maxage = Zera repamusoro (mumaminitsi) rezvinhu zvecos mucache.
ldap_cache_domain_maxsize = Huwandu hwepamusoro hwezvinhu zvedomain zvinogona kuchengetwa mucache.
ldap_cache_domain_maxage = Zera repamusoro (mumaminitsi) rezvinhu zvedomain mucache.
ldap_cache_mime_maxage = Zera repamusoro, mumaminitsi, rezvinhu zveMIME mucache.
ldap_cache_server_maxsize = Huwandu hwepamusoro hwezvinhu zveserver zvinogona kuchengetwa mucache.
ldap_cache_server_maxage = Zera repamusoro (mumaminitsi) rezvinhu zveboka mucache.
ldap_cache_share_locator_maxsize = Huwandu hwepamusoro hwezvinhu zveakaundi munamed entry cache.
ldap_cache_share_locator_maxage = TTL yenamed entry cache mumaminitsi.
ldap_cache_timezone_maxsize = Huwandu hwepamusoro hwezvinhu zvetimezone zvinogona kuchengetwa mucache.
ldap_cache_zimlet_maxsize = Huwandu hwepamusoro hwezvinhu zveZimlet zvinogona kuchengetwa mucache.
ldap_cache_zimlet_maxage = Zera repamusoro (mumaminitsi) rezvinhu zveZimlet mucache.
ldap_cache_custom_dynamic_group_membership_maxage_ms = Zera repamusoro (mumamirisekondi) rekuchengetera mucache mapoka ane simba ayo akaundi inhengo yadzo kumapoka ayo nhengo dzadzo dzinotemwa pachishandiswa custom MemberURL.
csrf_filter_domain_allowed_ref_hosts_max_size = Huwandu hwepamusoro hweentries dzedomain muCsrfFilter per-domain allowedRefererHosts cache. Kana pakava nekukanganisa pakupatsanura, zvinodzokera ku ldap_cache_domain_maxsize.
csrf_filter_domain_allowed_ref_hosts_cache_expiry_mins = Zera repamusoro (mumaminitsi) reentries muCsrfFilter per-domain allowedRefererHosts cache. Mushure mekunge rapera, entry yacho inobviswa uye yotangwazve kubva kuLDAP pachikumbiro chinotevera. Kana pakava nekukanganisa pakupatsanura, zvinodzokera kumaminitsi 60.
mysql_directory = Nzvimbo yekuisirwa MySQL.
mysql_data_directory = Dhairekitori rinofanira kugara data reMySQL.
mysql_errlogfile = Rogi yekukanganisa yeMySQL/MariaDB.
mysql_socket = Nzira inoenda kuMySQL socket kuti ishandiswe nematurusi eMySQL emutsetse wekuraira.
mysql_pidfile = Faira rinochengeterwa process id yeMySQL.
mysql_mycnf = Nzira inoenda ku my.cnf, faira rekonfigi reMySQL.
mysql_bind_address = Interface iri pahost iyi iyo MySQL ichasungirirwa pairi.
mysql_port = Nhamba yeport iyo server yeMySQL inofanira kuteerera pairi.
mysql_root_password = Pasiwedhi yemushandisi weMySQL akavakirwa mukati anonzi \u2018root\u2019; haifaniri kuvhiringidzwa nekupinda kweUNIX root. Kuitira nyore, panguva yekutanga hifadhidata panogadzirwa pasiwedhi isina kurongwa, yochengetwa mulocal config uye muMySQL. Kana uchida kuchinja pasiwedhi iyi, tapota shandisa chirongwa chezmmypasswd chinobva chachinja pasiwedhi yacho muMySQL nemulocal config.
mysql_memory_percent = Chikamu chememory yesystem chinofanira kushandiswa neMySQL. Kukosha uku kunochengetwa pano kuti kushandiswe nechirongwa chezmmycnf. Kuchinja setting iyi hakuratidziki ipapo ipapo museva yeMySQL. Uchafanira, nekungwarira kukuru, kugadzira patsva my.cnf uye wotangazve server yeMySQL kuti shanduko itange kushanda.
mysql_innodb_log_buffer_size = Tarisa zvinyorwa zveMySQL zve innodb_log_buffer_size. Kukosha uku kunochengetwa pano kuti kushandiswe nechirongwa chezmmycnf. Kuchinja setting iyi hakuratidziki ipapo ipapo museva yeMySQL. Uchafanira, nekungwarira kukuru, kugadzira patsva my.cnf uye wotangazve server yeMySQL kuti shanduko itange kushanda.
mysql_innodb_log_file_size = Tarisa zvinyorwa zveMySQL zve innodb_log_file_size. Kukosha uku kunochengetwa pano kuti kushandiswe nechirongwa chezmmycnf. Kuchinja setting iyi hakuratidziki ipapo ipapo museva yeMySQL. Uchafanira, nekungwarira kukuru, kugadzira patsva my.cnf uye wotangazve server yeMySQL kuti shanduko itange kushanda.
mysql_sort_buffer_size = Tarisa zvinyorwa zveMySQL zve sort_buffer_size. Kukosha uku kunochengetwa pano kuti kushandiswe nechirongwa chezmmycnf. Kuchinja setting iyi hakuratidziki ipapo ipapo museva yeMySQL. Uchafanira, nekungwarira kukuru, kugadzira patsva my.cnf uye wotangazve server yeMySQL kuti shanduko itange kushanda.
mysql_read_buffer_size = Tarisa zvinyorwa zveMySQL zve read_buffer_size. Kukosha uku kunochengetwa pano kuti kushandiswe nechirongwa chezmmycnf. Kuchinja setting iyi hakuratidziki ipapo ipapo museva yeMySQL. Uchafanira, nekungwarira kukuru, kugadzira patsva my.cnf uye wotangazve server yeMySQL kuti shanduko itange kushanda.
mysql_backup_retention = Nhamba yeshanduro dzebackup yedhatabhesi reMySQL dzinofanira kuchengetwa.
antispam_mysql_enabled = Shandisa dhatabhesi reMySQL kune antispam. False ndiyo default.
antispam_backup_retention = Nhamba yeshanduro dzebackup yedhatabhesi reantispam dzinofanira kuchengetwa.
derby_properties = Nzira inoenda kufaira rema properties ekonfigi rederby.
imap_max_consecutive_error = Kana iri pamusoro pe0, donhedza kubatana kweIMAP kana kukosha kweimap_max_consecutive_error kwasvikwa.
imap_inactive_session_cache_size = Ehcache: nhamba yepamusoro yemaentry ecache eIMAP asiri kushanda ari padiski zvisati zvabviswa.
imap_use_ehcache = Kana iri true, shandisa Ehcache pakuchengetedza cache yesesheni dzeIMAP. Zvikasadaro, shandisa disk cache.
imap_write_timeout = Isa timeout yekunyora yesesheni yeIMAP (nio).
imap_write_chunk_size = Saizi mumabhaiti yebhafa rekunyora reIMAP.
imap_thread_keep_alive_time = Nguva yakajairwa, mumasekonzi, yeshinda yeIMAP.
imap_throttle_ip_limit = Kana iri pamusoro pe0, huwandu hwepamusoro hwezvikumbiro zveIMAP pasekondi paIP.
imap_throttle_acct_limit = Kana iri pamusoro pe0, huwandu hwepamusoro hwezvikumbiro zveIMAP pasekondi paakaundi.
imap_suggested_batch_copy_size = Nhamba yemameseji anogadziriswa pabatch rimwe nerimwe panguva yemaitiro eIMAP COPY.
imap_in_progress_response_thread_pool_size = Huwandu hwepamusoro hweshinda mudziva rekutumira mhinduro yeInProgress kumutengi.
imap_in_progress_response_thread_keep_alive = Nguva mumasekonzi yekuti shinda irambe iripo isati yagumiswa.
imap_ehcache_heap_size = Nhamba yepamusoro yemaentry ecache eIMAP anochengetwa muheap tier yeEhcache.
imap_ehcache_skip_large_folder = Svetuka kuchengetedza cache yemafoda makuru eIMAP muEhcache kana zvabatidzwa.
imap_ehcache_folder_max_message_count = Chikumbaridzo chekuwanda kwemameseji pamusoro pacho mafoda eIMAP haachengetwi muEhcache.
nio_imap_enabled = Kana iri true, batidza Jetty non-blocking IO yeIMAP.
nio_pop3_enabled = Kana iri true, batidza Jetty non-blocking IO yePOP3.
postfix_mail_owner = postfix_mail_owner
postfix_setgid_group = postfix_setgid_group
postfix_version = postfix_version
mailboxd_directory = Nzvimbo yekuisirwa mailboxd.
mailboxd_java_heap_size = Nhamba yemegabytes dzichashandiswa sesaizi yepamusoro yeJava heap (-Xmx) yeJVM iri kumhanyisa Mailboxd.
mailboxd_java_heap_new_size_percent = Chikamu cheJava heap size chichashandiswa kune young generation (-Xmn) cheJVM iri kumhanyisa Mailboxd.
mailboxd_java_options = Sarudzo dzeJVM dzekushandisa pakutanga Mailboxd.
mailboxd_pidfile = Faira rinochengeterwa process id yeJVM yeMailboxd.
mailboxd_keystore = Nzvimbo yefaira redata rekeystore.
mailboxd_keystore_password = Pasiwedhi ichashandiswa neKeyManager keystore.
mailboxd_truststore = Nzvimbo yefaira redata retruststore.
mailboxd_truststore_password = Pasiwedhi ichashandiswa neTrustManager keystore.
client_ssl_truststore = Nzvimbo yefaira redata retruststore rinoshandiswa pakuongorora client SSL.
client_ssl_truststore_password = Pasiwedhi ichashandiswa neclient SSL TrustManager keystore.
mailboxd_output_file = Faira rekuti stdout ne stderr yeserver zvitumirwe kwariri.
mailboxd_output_rotate_interval = Nguva, mumasekonzi, iyo faira reoutput remailboxd rinotenderedzwa. Kana <= 0, hapana rotation inoitwa.
mailboxd_thread_stack_size = Saizi yestack yeshinda yeMailboxd
ssl_allow_untrusted_certs = Kana iri true, bvumira zvitupa zveSSL zvakazvisaina.
zimlet_directory = Nzira inoenda kumaZimlet akaiswa.
calendar_outlook_compatible_allday_events = Shandisa zviitiko zvezuva rose zvinoenderana neOutlook. False ndiyo default.
calendar_entourage_compatible_timezones = Isa makotesheni paTZID parameter muzvivakwa zveiCalendar, kugadzirisa bhagi riri muMS Entourage. True ndiyo default.
calendar_ics_import_full_parse_max_size = Panguva yeics import shandisa full parser kana saizi yeics iri pasi kana kuenzana neiyi; mafaira eics akakura anoparswa necallback parser isingabvumiri forward references kuVTIMEZONE TZID
calendar_canonical_tzid = Timezone id inofanira kudzoserwa seTimeZone.getCanonicalID(). Zvinogona kuva: "olson","windows","java". "windows" ndiyo default.
calendar_cache_enabled = Batidza cache yekareindari. False ndiyo default.
calendar_cache_directory = Dhairekitori guru remafaira ecache yekareindari
calendar_cache_lru_size = Saizi yeLRU yememory-cache. Chengeta mafoda ekareindari mazhinji aya mumemory.
calendar_cache_range_month_from = Mwedzi wekutanga murange yakacacherwa. 0 zvinoreva mwedzi uno, -1 zvinoreva mwedzi wapfuura, nezvimwe.
calendar_cache_range_months = Nhamba yemwedzi murange yakacacherwa
krb5_keytab = Nzvimbo yefaira reZimbra Kerberos 5 keytab
krb5_debug_enabled = Kerberos debugging yakabatidzwa
zimbra_mtareport_max_hosts = Nhamba yepamusoro yema host anofanira kuiswa mumarepoti ezuva nezuva eMTA anogadzirwa ne zmdailyreport.
zimbra_mtareport_max_recipients = Nhamba yevagamuchiri inofanira kunyorwa mumarepoti ezuva nezuva eMTA.
zimbra_mtareport_max_senders = Nhamba yevatumiri inofanira kunyorwa mumarepoti ezuva nezuva eMTA.
zimbra_mtareport_max_users = Nhamba yepamusoro yevashandisi inofanira kuiswa mumarepoti ezuva nezuva eMTA anogadzirwa ne zmdailyreport.
zimbra_auth_always_send_refer = Gara uchidzosera <refer> tag mumhinduro yeauth kuti umanikidze client redirect.
zimbra_admin_service_port = Port yeadmin yekutanga/bootstrap.
zimbra_admin_service_scheme = Scheme yeprotocol yeadmin yekutanga/bootstrap.
zimbra_mail_service_port = Port yemeyili yekutanga.
zimbra_zmprov_default_to_ldap = Kuti zmprov itore LDAP here kana SOAP seyedefault.
zimbra_zmprov_default_soap_server = Server yeSOAP yekutanga yekuti zmprov ibatanidze kwairi
zmprov_safeguarded_attrs = Rondedzero yakaparadzaniswa nemakoma yemaattribute ekuprovisioning ane ma value akawanda anoda kudzivirirwa pakutsiviwa
zmprov_tmp_directory = Dhairekitori renguva pfupi rekuti zmprov inyore maattribute values emabhinari kumafaira.
zimbra_mailbox_groups = Nhamba yemapoka emamailbox ekugovera ma mailbox matsva kwaari.
debug_mailboxindex_use_new_locking = Shandisa locking yemhando itsva yeMailboxIndex
zimbra_class_provisioning = Kirasi yeinterface yeprovisioning
zimbra_class_accessmanager = Kirasi yeinterface yeaccess manager
zimbra_class_mboxmanager = Kirasi yeinterface yemailbox manager
zimbra_class_database = Kirasi yekonfigi yedhatabhesi
zimbra_class_store = Kirasi yeinterface ye message store
zimbra_class_application = Kirasi yeinterface yeapplication yeZimbra
zimbra_class_rulerewriterfactory = Kirasi yeinterface yeRuleRewriterFactory
zimbra_class_dbconnfactory = Kirasi yefekitari yekubatanidza kudhatabhesi
zimbra_class_soapsessionfactory= Kirasi yefekitari yesesheni yeSOAP
av_notify_user = Kero yeimeyili yekutumira mameseji ehutongi kubva kuanti-virus neDKIM.
av_notify_domain = Domain yekutanga mumasetingi eamavisd.
data_source_trust_self_signed_certs = Bvumira zvitupa zvakazvisaina paunobatanidza kune data source uchishandisa SSL.
data_source_fetch_size = nhamba yepamusoro yemameseji eIMAP anofanira kuFETCHwa muchikumbiro chimwe nechimwe
data_source_max_literal_mem_size = Saizi yepamusoro yeliteral data (mumabhaiti) ichachengetwa mumemory. Data rakakura richachengetwa mufaira renguva pfupi.
timezone_file = Faira re iCalendar rinonyora nzvimbo dzenguva dzinozivikanwa zvikuru
search_disable_database_hints = Kana iri true, usashandise database hints mumibvunzo inogadzirwa panguva yekutsvaga
search_dbfirst_term_percentage_cutoff = Paramita yemukati yekugadzira query
zmstat_interval = kuwanda kwekutora masampuli nezmstat (masekondi)
zmstat_df_excludes = rondedzero yakaparadzaniswa nemakoloni yemavhoriyumu edhisiki (nemount path) ekubvisa kubva kuzmstats
zimbra_noop_default_timeout = Nguva (masekondi) iyo sevha inobvumira NoOpRequest kumira kana wait=1 yatsanangurwa neclient
