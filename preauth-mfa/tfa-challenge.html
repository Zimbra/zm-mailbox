<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Two-step verification</title>
<style>
  :root{
    --bg:#f4f6fb; --card:#fff; --ink:#1b2233; --dim:#66718a; --line:#dde3ee;
    --accent:#2563eb; --accent-ink:#fff; --err:#b91c1c; --ok:#047857;
  }
  @media (prefers-color-scheme: dark){
    :root{ --bg:#0f1420; --card:#171d2c; --ink:#e8ecf6; --dim:#93a0bb; --line:#2a3348; }
  }
  *{box-sizing:border-box}
  body{margin:0;min-height:100vh;display:flex;align-items:center;justify-content:center;
    background:var(--bg);color:var(--ink);
    font:15px/1.55 ui-sans-serif,system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;padding:24px}
  .card{background:var(--card);border:1px solid var(--line);border-radius:14px;
    box-shadow:0 8px 30px rgba(16,24,40,.08);width:100%;max-width:430px;padding:30px 30px 26px}
  h1{font-size:21px;margin:0 0 6px;letter-spacing:-.01em}
  p.sub{color:var(--dim);margin:0 0 22px;font-size:14px}
  label{display:block;font-size:13px;font-weight:600;margin:0 0 6px}
  input{width:100%;padding:11px 12px;border:1px solid var(--line);border-radius:9px;
    background:transparent;color:var(--ink);font-size:15px;font-family:inherit}
  input:focus{outline:2px solid var(--accent);outline-offset:1px;border-color:transparent}
  .row{margin-bottom:16px}
  .actions{display:flex;gap:10px;align-items:center;margin-top:22px}
  button{font:inherit;font-weight:600;border-radius:9px;padding:11px 18px;cursor:pointer;border:1px solid transparent}
  button.primary{background:var(--accent);color:var(--accent-ink)}
  button.primary:disabled{opacity:.5;cursor:default}
  button.ghost{background:transparent;color:var(--dim);border-color:var(--line)}
  .msg{margin-top:16px;font-size:13.5px;min-height:20px}
  .msg.err{color:var(--err)} .msg.ok{color:var(--ok)}
  .step{display:none} .step.on{display:block}
  code{font-family:ui-monospace,Menlo,Consolas,monospace;font-size:.92em}
  .hint{color:var(--dim);font-size:12.5px;margin-top:10px}
</style>
</head>
<body>
<div class="card">
  <h1>Two-step verification</h1>
  <p class="sub">Signing in as <span id="acct"></span>. We've emailed you a code.</p>

  <div id="step1" class="step on">
    <div class="row">
      <label for="code">Verification code</label>
      <input id="code" type="text" inputmode="text" autocomplete="one-time-code"
             placeholder="Enter the code we emailed" autofocus>
      <div class="hint" id="sentTo"></div>
    </div>
    <div class="actions">
      <button class="primary" id="verifyBtn">Verify</button>
      <button class="ghost" id="resendBtn">Resend code</button>
    </div>
  </div>

  <div id="msg" class="msg"></div>
</div>

<script>
(function () {
  var SOAP = '/service/soap/';
  var $ = function (id) { return document.getElementById(id); };
  var msg = $('msg');

  function say(text, kind) {
    msg.className = 'msg' + (kind ? ' ' + kind : '');
    msg.textContent = text || '';
  }
  function esc(s) {
    return String(s).replace(/[<>&"]/g, function (c) {
      return { '<': '&lt;', '>': '&gt;', '&': '&amp;', '"': '&quot;' }[c];
    });
  }
  function qp(name) {
    var m = new RegExp('[?&]' + name + '=([^&]*)').exec(window.location.search);
    return m ? decodeURIComponent(m[1].replace(/\+/g, ' ')) : '';
  }

  // Handed over by SsoTwoFactorGate. This token has Usage.TWO_FACTOR_AUTH -- it buys nothing but
  // the right to present a code. There is deliberately no session cookie yet.
  var TOKEN   = qp('tfa');
  var ACCOUNT = qp('account');
  var MASKED  = qp('tfaEmail');

  if (!TOKEN || !ACCOUNT) {
    say('This link is missing its sign-in token. Start again from your portal.', 'err');
    $('verifyBtn').disabled = true;
    $('resendBtn').disabled = true;
    return;
  }
  $('acct').textContent = ACCOUNT;
  $('sentTo').textContent = MASKED ? 'Sent to ' + MASKED + '.' : '';

  function soap(bodyXml) {
    var env =
      '<soap:Envelope xmlns:soap="http://www.w3.org/2003/05/soap-envelope">' +
      '<soap:Header><context xmlns="urn:zimbra"/></soap:Header>' +
      '<soap:Body>' + bodyXml + '</soap:Body></soap:Envelope>';
    return fetch(SOAP, {
      method: 'POST',
      credentials: 'same-origin',
      headers: { 'Content-Type': 'application/soap+xml' },
      body: env
    }).then(function (r) { return r.text(); });
  }
  function fault(t) {
    var m = /<soap:Text>([^<]*)<\/soap:Text>/.exec(t);
    return m ? m[1] : null;
  }

  // Leg 1 -- ask the twofactorauth extension to mail a code. The gate does not do this itself,
  // so the page drives it on load (and again on Resend).
  function sendCode(quiet) {
    return soap(
      '<SendTwoFactorAuthCodeRequest xmlns="urn:zimbraAccount">' +
      '<action>email</action>' +
      '<authToken>' + esc(TOKEN) + '</authToken>' +
      '</SendTwoFactorAuthCodeRequest>'
    ).then(function (t) {
      if (/<status>[^<]*sent[^<]*<\/status>/.test(t)) {
        if (!quiet) say('A new code is on its way.', 'ok');
        return true;
      }
      say(fault(t) || 'Could not send a code.', 'err');
      return false;
    });
  }

  // Leg 2 -- exchange the code plus the tfa token for a real session. Auth accepts an authToken
  // with Usage.TWO_FACTOR_AUTH in place of a password, which is what makes this work for a user
  // who arrived through SSO and has no password at all.
  function verify() {
    var code = $('code').value.trim();
    if (!code) { say('Enter the code from your email.', 'err'); return; }
    $('verifyBtn').disabled = true;
    say('Checking\u2026');
    soap(
      '<AuthRequest xmlns="urn:zimbraAccount" twoFactorCode="' + esc(code) + '">' +
      '<account by="name">' + esc(ACCOUNT) + '</account>' +
      '<authToken>' + esc(TOKEN) + '</authToken>' +
      '</AuthRequest>'
    ).then(function (t) {
      if (/<authToken>/.test(t) && !/<soap:Fault/.test(t)) {
        say('Verified. Taking you to your mailbox\u2026', 'ok');
        window.location.replace('/modern/');
        return;
      }
      $('verifyBtn').disabled = false;
      say(fault(t) || 'That code was not accepted.', 'err');
    }).catch(function (e) {
      $('verifyBtn').disabled = false;
      say(e && e.message ? e.message : 'Network error.', 'err');
    });
  }

  $('verifyBtn').addEventListener('click', verify);
  $('resendBtn').addEventListener('click', function () { sendCode(false); });
  $('code').addEventListener('keydown', function (e) { if (e.key === 'Enter') verify(); });

  sendCode(true);
})();
</script>
</body>
</html>
